反应。"],"0|1":["电解质：在水溶液或熔融状态下能导电的化合物，酸、碱、盐、水、活泼金属氧化物均是。","非电解质：在水溶液和熔融状态下都不导电的化合物，如蔗糖、酒精、CO2、SO2。","强电解质在水溶液中完全电离，如强酸、强碱、绝大多数盐，电离用等号。","弱电解质在水溶液中部分电离，如弱酸、弱碱、水，电离方程式用可逆号。","电离方程式：NaCl=Na++Cl-，H2SO4=2H++SO42-，CH3COOH⇌CH3COO-+H+。","离子反应实质：反应中某些离子浓度减小，用离子方程式表示。","离子方程式书写四步：写、拆、删、查，强酸强碱可溶性盐拆为离子。","离子反应发生条件：生成沉淀、气体、弱电解质（水）或发生氧化还原反应。","离子共存条件：离子间不生成沉淀、气体、弱电解质，不发生氧化还原与络合反应。","溶解性口诀：钾钠铵硝皆可溶，盐酸盐中银不溶，硫酸盐中钡不溶，碳酸盐只溶钾钠铵。","常见有色离子：Cu2+蓝色、Fe3+黄色、Fe2+浅绿色、MnO4-紫红色。"],"0|2":["氧化还原反应本质是电子转移（得失或偏移），特征是元素化合价升降。","氧化剂得电子、化合价降低、被还原，发生还原反应，生成还原产物。","还原剂失电子、化合价升高、被氧化，发生氧化反应，生成氧化产物。","四大基本反应类型中，置换反应全部是氧化还原反应。","常见氧化剂：O2、Cl2、浓硫酸、硝酸、KMnO4、FeCl3、H2O2等。","常见还原剂：活泼金属、H2、C、CO、Fe2+、I-、SO2、H2S等。","强弱规律：氧化剂氧化性大于氧化产物，还原剂还原性大于还原产物。","双线桥表示：箭头从反应物指向产物同种元素，标出得失电子数与化合价变化。","单线桥表示：箭头由还原剂指向氧化剂，标明转移电子总数。","化合价升降法配平：标价态、列升降、求最小公倍数、配变价物质、观察配平。","归中规律：同种元素不同价态反应，产物价态介于两者之间且不交叉。","歧化反应：同种元素既升高又降低，如Cl2+H2O⇌HCl+HClO。"],"0|3":["钠的物理性质：银白色、质软、密度小于水大于煤油、熔点低，保存在煤油中。","钠与水反应：2Na+2H2O=2NaOH+H2↑，现象为浮、熔、游、响、红（酚酞变红）。","钠与氧气：常温生成白色Na2O，4Na+O2=2Na2O；点燃生成淡黄色Na2O2。","钠与氯气、硫：2Na+Cl2=2NaCl（点燃），2Na+S=Na2S（研磨或加热）。","Na2O是白色碱性氧化物：Na2O+H2O=2NaOH，Na2O+CO2=Na2CO3。","Na2O2与水：2Na2O2+2H2O=4NaOH+O2↑，放热并产生气泡。","Na2O2与CO2：2Na2O2+2CO2=2Na2CO3+O2，用于呼吸面具供氧。","Na2O2中氧为-1价，反应中既作氧化剂又作还原剂，1 mol转移1 mol电子。","碳酸钠：白色粉末易溶于水，热稳定，溶液显碱性，俗名纯碱、苏打。","碳酸氢钠：细小白色晶体，溶解度小于Na2CO3，2NaHCO3=Na2CO3+H2O+CO2↑（加热）。","与盐酸反应：Na2CO3+2HCl=2NaCl+H2O+CO2↑，NaHCO3+HCl=NaCl+H2O+CO2↑。","相互转化：Na2CO3+CO2+H2O=2NaHCO3，NaHCO3+NaOH=Na2CO3+H2O或加热。","侯氏制碱法：NaCl+NH3+CO2+H2O=NaHCO3↓+NH4Cl，先通NH3后通CO2。","焰色反应：钠焰色黄色，钾焰色紫色（透过蓝色钴玻璃观察），是物理变化。"],"0|4":["氯气物理性质：黄绿色有刺激性气味有毒气体，密度大于空气，能溶于水，易液化。","与金属反应：2Na+Cl2=2NaCl，Cu+Cl2=CuCl2（棕黄色烟），2Fe+3Cl2=2FeCl3（均点燃）。","与氢气：H2+Cl2=2HCl（点燃，苍白色火焰，瓶口白雾），光照混合会爆炸。","与水反应：Cl2+H2O⇌HCl+HClO，新制氯水含Cl2、HClO、H2O及H+、Cl-、ClO-。","次氯酸：弱酸、强氧化性可杀菌消毒，不稳定，2HClO=2HCl+O2↑（光照）。","氯水久置：HClO分解，最终变为稀盐酸，失去漂白能力。","与碱反应：Cl2+2NaOH=NaCl+NaClO+H2O，2Cl2+2Ca(OH)2=Ca(ClO)2+CaCl2+2H2O。","漂白粉有效成分Ca(ClO)2，漂白原理：Ca(ClO)2+CO2+H2O=CaCO3+2HClO。","实验室制氯气：MnO2+4HCl(浓)=MnCl2+Cl2↑+2H2O（加热），须用浓盐酸。","收集与尾气：向上排空气法收集，NaOH溶液吸收尾气，除HCl用饱和食盐水。","氯气检验：湿润的淀粉碘化钾试纸变蓝，Cl2+2KI=2KCl+I2。","氯离子检验：加AgNO3生成白色沉淀，再加稀硝酸沉淀不溶解。","氯气用途：制盐酸、漂白粉、农药、有机溶剂，是重要化工原料。"],"0|5":["物质的量是表示含有一定数目粒子的集合体的物理量，单位mol，只用于微观粒子。","阿伏加德罗常数NA约为6.02×10的23次方每摩尔，n=N/NA。","摩尔质量M单位g/mol，数值上等于相对分子（原子）质量，m=n·M。","气体摩尔体积Vm：标况（0摄氏度、101 kPa）约为22.4 L/mol，V=n·Vm。","阿伏加德罗定律：同温同压下，同体积任何气体含相同数目分子。","物质的量浓度c=n/V，单位mol/L，V指溶液体积而非溶剂体积。","容量瓶：配制溶液的专用仪器，标有温度与容积，不能溶解固体或长期存放。","配制步骤：计算、称量或量取、溶解、冷却、转移、洗涤、定容、摇匀、装瓶。","定容操作：距刻度线1~2 cm改用胶头滴管滴加，平视使凹液面与刻度线相切。","稀释定律：稀释前后溶质物质的量不变，c1V1=c2V2。","误差分析：未洗涤烧杯偏低，定容俯视偏高、仰视偏低，转移时洒出偏低。","托盘天平精确到0.1 g，量筒精确到0.1 mL，不能用于配制或反应容器。"],"1|0":["铁的物理性质：银白色金属，有延展性、导热导电性，能被磁铁吸引。","铁与Cl2、S、水蒸气：2Fe+3Cl2=2FeCl3（点燃），Fe+S=FeS（加热），3Fe+4H2O(g)=Fe3O4+4H2（高温）。","铁与非氧化性酸：Fe+2H+=Fe2++H2↑，生成亚铁盐与氢气。","铁的氧化物：FeO黑色、Fe2O3红棕色（铁红）、Fe3O4黑色有磁性（磁性氧化铁）。","氢氧化亚铁：白色沉淀，4Fe(OH)2+O2+2H2O=4Fe(OH)3，迅速变灰绿再变红褐。","制Fe(OH)2须隔绝氧气：滴管伸入液面下，液面覆盖植物油或苯。","Fe3+检验：加KSCN溶液变红色，Fe3++3SCN-=Fe(SCN)3。","Fe2+检验：先加KSCN不变色，再加氯水变红；或加NaOH先生成白色沉淀后变色。","铁三角转化：Fe+2Fe3+=3Fe2+，2Fe2++Cl2=2Fe3++2Cl-，Fe+2H+=Fe2++H2↑。","铝的两性：2Al+2NaOH+2H2O=2NaAlO2+3H2↑，2Al+6HCl=2AlCl3+3H2↑。","铝热反应：2Al+Fe2O3=Al2O3+2Fe（高温），用于焊接钢轨、冶炼高熔点金属。","合金：硬度大于成分金属，熔点低于成分金属，钢含碳0.03%~2%。","金属冶炼：电解法（Na、Mg、Al）、热还原法（Fe、Cu）、热分解法（Hg、Ag）。"],"1|1":["硫俗称硫黄，黄色固体，难溶于水、微溶于酒精、易溶于CS2。","硫与金属、氧气：Fe+S=FeS（加热），S+O2=SO2（点燃，蓝紫色火焰）。","SO2物理性质：无色有刺激性气味有毒气体，密度大于空气，易溶于水。","SO2是酸性氧化物：SO2+H2O=H2SO3，SO2+2NaOH=Na2SO3+H2O。","SO2还原性：2SO2+O2=2SO3（催化剂加热，可逆），能使溴水、酸性KMnO4褪色。","SO2漂白性：与品红化合生成不稳定无色物，加热恢复红色，是可逆的化合漂白。","SO2氧化性：SO2+2H2S=3S↓+2H2O，与H2S归中生成硫。","浓硫酸吸水性：吸收游离水作干燥剂，不能干燥NH3、H2S、HI。","浓硫酸脱水性：使蔗糖、纸张炭化，C12H22O11=12C+11H2O（浓硫酸）。","浓硫酸与Cu：Cu+2H2SO4(浓)=CuSO4+SO2↑+2H2O（加热），稀硫酸不反应。","浓硫酸与碳：C+2H2SO4(浓)=CO2↑+2SO2↑+2H2O（加热）。","常温浓硫酸使铁、铝钝化，可用铁罐车运输浓硫酸。","接触法：沸腾炉4FeS2+11O2=2Fe2O3+8SO2（高温），接触室2SO2+O2⇌2SO3（催化剂加热）。","吸收塔用98.3%浓硫酸吸收SO3防酸雾；酸雨pH小于5.6，防治靠脱硫脱硝。"],"1|2":["N2无色无味难溶于水，化学性质稳定，N≡N键能大，空气中约占78%。","氮的固定：N2+O2=2NO（放电），工业合成氨N2+3H2⇌2NH3（高温高压催化剂）。","NO无色有毒难溶于水，2NO+O2=2NO2；NO2红棕色有毒易溶于水。","NO2与水：3NO2+H2O=2HNO3+NO，NO2与O2按4:1混合可被水完全吸收。","氨物理性质：无色有刺激性气味，极易溶于水（1:700），密度小于空气，易液化。","喷泉实验：氨气溶于水使瓶内压强骤减，形成红色喷泉（滴有酚酞）。","氨水：NH3+H2O⇌NH3·H2O⇌NH4++OH-，显弱碱性，NH3·H2O受热分解放出NH3。","氨的还原性：4NH3+5O2=4NO+6H2O（催化剂加热），工业制硝酸的第一步。","实验室制氨：2NH4Cl+Ca(OH)2=CaCl2+2NH3↑+2H2O（加热），向下排空气收集，碱石灰干燥。","铵盐：易溶于水，受热分解，与碱共热放出氨气，用于检验NH4+。","硝酸：无色易挥发液体，见光分解，4HNO3=4NO2↑+O2↑+2H2O（光照或加热）。","浓硝酸与Cu：Cu+4HNO3(浓)=Cu(NO3)2+2NO2↑+2H2O。","稀硝酸与Cu：3Cu+8HNO3(稀)=3Cu(NO3)2+2NO↑+4H2O。","硝酸与金属不产生H2，浓硝酸常温使铁、铝钝化，久置浓硝酸因NO2显黄色。"],"1|3":["硅：灰黑色有金属光泽固体，熔点高硬度大，是良好的半导体材料。","硅的化学性质：Si+O2=SiO2（加热），Si+2NaOH+H2O=Na2SiO3+2H2↑。","硅的用途：制芯片、集成电路、太阳能电池。","SiO2：熔点高硬度大的固体，不溶于水，是酸性氧化物。","SiO2与NaOH、HF：SiO2+2NaOH=Na2SiO3+H2O，SiO2+4HF=SiF4↑+2H2O（雕刻玻璃）。","盛NaOH溶液用橡胶塞：NaOH与玻璃中SiO2反应生成Na2SiO3黏住瓶口。","硅酸：不溶于水的白色胶状物，弱酸，由Na2SiO3+2HCl=H2SiO3↓+2NaCl制得。","硅酸钠水溶液俗称水玻璃，是矿物胶，可作黏合剂、防腐剂、防火剂。","高纯硅制备：SiO2+2C=Si+2CO↑（高温），Si+2Cl2=SiCl4（加热），SiCl4+2H2=Si+4HCl（高温）。","传统硅酸盐材料：陶瓷、玻璃、水泥，原料分别对应黏土、纯碱石灰石石英、石灰石黏土。","光导纤维主要成分SiO2，用于光纤通信；氮化硅是高温结构陶瓷。"],"1|4":["化学键断裂吸收能量，形成释放能量，反应热由断键吸热与成键放热之差决定。","放热反应：反应物总能量大于生成物总能量，如燃烧、中和、金属与酸、大多数化合反应。","吸热反应：生成物总能量大于反应物总能量，如C+CO2=2CO（高温）、大多数分解反应。","原电池是把化学能转化为电能的装置，利用自发的氧化还原反应。","铜锌原电池：Zn为负极，Zn-2e-=Zn2+；Cu为正极，2H++2e-=H2↑。","电子由负极经导线流向正极，电流方向相反，阳离子移向正极。","原电池构成条件：两种活泼性不同的电极、电解质溶液、闭合回路、自发氧化还原反应。","负极发生氧化反应，正极发生还原反应，较活泼金属作负极。","常见电池：锌锰干电池、铅蓄电池（可充电）、锂电池、氢氧燃料电池。","氢氧燃料电池碱性介质：负极H2-2e-+2OH-=2H2O，正极O2+2H2O+4e-=4OH-。","燃料燃烧是放热反应，如CH4+2O2=CO2+2H2O（点燃），是重要能量来源。"],"1|5":["化学反应速率用单位时间内反应物浓度减少或生成物浓度增加表示，单位mol/(L·s)。","同一反应用不同物质表示速率之比等于化学计量数之比。","浓度越大反应速率越快，增大气体压强本质是增大浓度。","温度越高反应速率越快，催化剂能加快反应速率。","增大接触面积加快反应：固体粉碎、搅拌、增大表面积。","可逆反应：同一条件下既能正向又能逆向进行的反应，用可逆号表示。","化学平衡：v正=v逆且不为零，各组分浓度保持不变，是动态平衡。","化学反应限度：可逆反应中反应物不能完全转化，存在限度。","平衡标志：直接标志v正=v逆、浓度不变；间接标志看颜色、压强、密度是否恒定。","等体反应（如H2+I2⇌2HI）中压强、总物质的量始终不变，不能作平衡标志。","提高转化率：增大廉价反应物浓度、及时分离产物。"],"1|6":["有机物是含碳化合物，但CO、CO2、碳酸盐、碳化物等除外。","甲烷：无色无味气体，难溶于水，正四面体结构，键角约109.5度。","甲烷取代反应：CH4+Cl2=CH3Cl+HCl（光照），可连续取代生成四种氯代物。","乙烯：无色稍有气味气体，含碳碳双键，CH2=CH2+Br2=CH2BrCH2Br使溴水褪色。","乙烯加成：与H2、HCl、H2O加成，加聚成聚乙烯，nCH2=CH2→[-CH2-CH2-]n（催化剂）。","乙烯氧化：使酸性KMnO4褪色，燃烧火焰明亮带黑烟。","苯：平面正六边形，碳碳键介于单双键之间，易取代难加成，不与溴水、KMnO4反应。","苯的取代：C6H6+Br2=C6H5Br+HBr（FeBr3催化），C6H6+HNO3=C6H5NO2+H2O（浓硫酸加热）。","乙醇：与钠反应2C2H5OH+2Na=2C2H5ONa+H2↑，与水任意比互溶。","乙醇催化氧化：2C2H5OH+O2=2CH3CHO+2H2O（Cu或Ag催化加热），生成乙醛。","乙酸：含羧基，显弱酸性，CH3COOH+NaHCO3=CH3COONa+H2O+CO2↑。","酯化反应：CH3COOH+C2H5OH=CH3COOC2H5+H2O（浓硫酸加热，可逆），酸脱羟基醇脱氢。","乙酸乙酯制备：饱和Na2CO3溶液吸收乙酸和乙醇、降低酯溶解度，导管不伸入液面下。","葡萄糖能银镜反应、与新制Cu(OH)2加热生成砖红色沉淀；淀粉遇碘变蓝。"],"2|0":["焓变ΔH：恒压下反应热等于焓变，单位kJ/mol，放热为负、吸热为正。","ΔH=生成物总能量-反应物总能量，也等于反应物键能总和-生成物键能总和。","热化学方程式书写：注明物质状态（s、l、g、aq），系数可为分数，ΔH与系数成正比。","可逆反应热化学方程式：ΔH表示按方程式计量数完全转化时的反应热。","中和热：稀溶液中强酸强碱生成1 mol水放热57.3 kJ，H++OH-=H2O，ΔH=-57.3 kJ/mol。","中和热测定：量热计保温，环形玻璃搅拌棒搅拌，测反应前后温度差计算。","燃烧热：1 mol纯物质完全燃烧生成稳定氧化物放出的热量，H2须生成液态水。","盖斯定律：反应热只与始态终态有关与途径无关，方程式可加减求ΔH。","反应热计算：由已知热化学方程式、键能数据、燃烧热或中和热数据求算。","活化能与催化剂：催化剂降低活化能、同等程度加快正逆反应，不改变反应热。","能量图像：反应物能量高于生成物为放热反应，反之吸热，差值即ΔH。"],"2|1":["速率表达式v=Δc/Δt，固体与纯液体浓度视为常数，不能表示速率。","同一反应不同物质表示的速率之比等于化学计量数之比。","增大浓度：活化分子数目增多，单位体积内有效碰撞增多，速率加快。","压强影响只对有气体参加的反应：压缩体积增大浓度速率加快。","温度影响：升温使活化分子百分数增大，速率显著加快。","催化剂：降低活化能，同等程度加快正逆反应速率，不改变反应热与平衡。","接触面积：固体越细、搅拌越充分，速率越快。","有效碰撞理论：能量足够且取向合适的分子碰撞才发生反应。","速率常数k：v=k·c(A)的m次方·c(B)的n次方，k随温度升高而增大。","恒容充入惰性气体：总压增大但各组分浓度不变，速率不变。","测定速率：测气体体积、颜色深浅（分光光度法）、电导率变化。"],"2|2":["化学平衡状态：v正=v逆不为零，各组分浓度不再变化，是动态平衡。","平衡常数K：生成物浓度幂之积除以反应物浓度幂之积，纯固体纯液体不写入表达式。","K只与温度有关，K越大反应进行程度越大，转化率越高。","浓度商Q与K比较：Q小于K正向移动，Q大于K逆向移动，Q等于K平衡。","勒夏特列原理：改变条件时平衡向减弱这种改变的方向移动。","增大反应物浓度：平衡正向移动，该反应物自身转化率降低，另一反应物转化率提高。","压强影响：增大压强向气体分子数减小的方向移动（气体反应且计量数不等）。","温度影响：升温向吸热方向移动，降温向放热方向移动。","催化剂不影响平衡移动，只缩短达到平衡的时间。","转化率计算：转化率=转化量/起始量×100%，用三段式（起始、转化、平衡）求解。","恒容充惰性气体平衡不移动；恒压充惰性气体对不等体反应平衡有影响。","图像分析：先拐先平数值大，即先达平衡的曲线对应温度高或压强大。"],"2|3":["强电解质完全电离，弱电解质部分电离，存在电离平衡：CH3COOH⇌CH3COO-+H+。","电离平衡移动：升温促进电离，加水稀释促进电离但离子浓度减小。","同离子效应：加入含相同离子的物质抑制电离，如醋酸中加醋酸钠。","电离常数Ka只与温度有关，Ka越大酸性越强，可比较弱酸相对强弱。","水的电离：水是极弱电解质，H2O⇌H++OH-，电离过程吸热。","水的离子积Kw=c(H+)·c(OH-)，25摄氏度时为1×10的负14次方，只随温度升高而增大。","Kw适用于任何水溶液：酸或碱溶液中由Kw求另一离子浓度。","溶液酸碱性判断：c(H+)与c(OH-)比较，c(H+)大于c(OH-)为酸性。","pH=-lg c(H+)，25摄氏度时pH=7中性，pH越小酸性越强。","pH计算：强酸强碱直接算，混合先判断过量，碱过量先算c(OH-)再换算。","稀释规律：强酸稀释10倍pH增大1，弱酸稀释10倍pH增大小于1。","pH试纸：用洁净玻璃棒蘸取溶液点在试纸上，与标准比色卡对照，不能先湿润。"],"2|4":["盐类水解：盐电离出的离子与水电离出的H+或OH-结合生成弱电解质，促进水的电离。","水解规律：有弱才水解、无弱不水解、谁弱谁水解、谁强显谁性、越弱越水解。","水解方程式用可逆号，一般不标沉淀与气体符号，双水解例外。","Na2CO3分步水解：CO32-+H2O⇌HCO3-+OH-，HCO3-+H2O⇌H2CO3+OH-。","影响水解：升温促进水解，加水稀释促进，加酸或碱抑制或促进，同离子抑制。","水解应用：明矾净水、纯碱加热去油污、配制FeCl3溶液加盐酸抑制水解。","双水解不共存：Al3+与HCO3-、CO32-、S2-、AlO2-，Fe3+与HCO3-、CO32-。","双水解实例：Al3++3HCO3-=Al(OH)3↓+3CO2↑，是泡沫灭火器原理。","离子浓度比较三守恒：电荷守恒、物料守恒、质子守恒。","沉淀溶解平衡：AgCl(s)⇌Ag+(aq)+Cl-(aq)，是动态平衡。","溶度积Ksp=c(Ag+)·c(Cl-)，只与温度有关，Ksp越小越难溶。","沉淀判断：Q大于Ksp生成沉淀，Q小于Ksp沉淀溶解，Q等于Ksp饱和。","沉淀转化：由溶解度大的向溶解度小的转化，如AgCl→AgI→Ag2S。","沉淀溶解方法：加酸溶解（CaCO3、Mg(OH)2）、生成配合物（AgCl溶于氨水）。"],"2|5":["原电池：化学能转化为电能，负极氧化、正极还原，电子由负极经外电路流向正极。","电解池：电能转化为化学能，阳极接电源正极发生氧化，阴极接负极发生还原。","电解饱和食盐水（氯碱工业）：2NaCl+2H2O=2NaOH+H2↑+Cl2↑（通电）。","电解熔融氯化钠制钠：2NaCl=2Na+Cl2↑（通电，熔融）；电解熔融Al2O3制铝。","电解精炼铜：粗铜作阳极、纯铜作阴极、CuSO4溶液作电解液，阳极泥回收金、银。","电镀：镀层金属作阳极、待镀件作阴极，电镀液含镀层金属离子。","放电顺序：阳极阴离子S2-、I-、Br-、Cl-先于OH-放电，阴极阳离子逆金属活动性顺序放电。","金属腐蚀：化学腐蚀与电化学腐蚀，电化学腐蚀更普遍更严重。","吸氧腐蚀（中性弱酸性）：负极Fe-2e-=Fe2+，正极O2+2H2O+4e-=4OH-。","析氢腐蚀（酸性环境）：负极Fe-2e-=Fe2+，正极2H++2e-=H2↑。","金属防护：牺牲阳极保护法（连接更活泼金属）、外加电流阴极保护法、镀层涂漆。","电解CuSO4溶液：阴极析铜、阳极放氧，2CuSO4+2H2O=2Cu+O2↑+2H2SO4（通电）。"],"3|0":["能层K、L、M、N分别含s、p、d、f能级，能级数等于能层序数。","构造原理：电子按1s、2s、2p、3s、3p、4s、3d、4p顺序依次填充。","能量最低原理：电子优先占据能量最低的轨道，使体系能量最低。","泡利原理：一个原子轨道最多容纳2个电子，且自旋方向相反。","洪特规则：等价轨道上电子优先单独占据且自旋方向相同。","洪特规则特例：半充满全充满稳定，Cr为3d5 4s1，Cu为3d10 4s1。","电子排布式：Fe为1s2 2s2 2p6 3s2 3p6 3d6 4s2，简写[Ar]3d6 4s2。","基态与激发态：基态能量最低，吸收能量跃迁为激发态，电子跃迁产生光谱。","原子半径：同周期从左到右减小，同主族从上到下增大。","第一电离能：同周期从左到右增大（ⅡA、ⅤA反常），同主族从上到下减小。","第一电离能反常：Mg大于Al、N大于O、P大于S，因全满或半满稳定。","电负性：F最大为4.0，同周期从左到右增大，同主族从上到下减小。","电负性应用：判断金属非金属性强弱、成键类型（差值大于1.7为离子键）。"],"3|1":["共价键：原子间通过共用电子对形成的化学键，具有饱和性与方向性。","σ键头碰头重叠、可单独存在，π键肩并肩重叠、随σ键存在。","单键含1个σ键，双键含1σ加1π，三键含1σ加2π。","键能越大键越牢固，键长越短键能越大，键角决定分子的空间结构。","等电子体：原子总数与价电子总数相同的分子结构相似，如CO与N2。","杂化类型：sp3正四面体（CH4）、sp2平面形（C2H4）、sp直线形（C2H2）。","VSEPR理论：价层电子对数决定空间构型，孤对电子斥力大于成键电子对。","常见构型：CH4正四面体、NH3三角锥形、H2O角形、CO2直线形、BF3平面三角形。","分子极性：正负电荷中心重合为非极性分子（CO2、CH4），不重合为极性分子（H2O、NH3）。","范德华力：随相对分子质量增大而增强，影响物质的熔沸点与溶解性。","氢键：F、O、N与H形成的较强分子间作用力，X-H···Y，不是化学键。","氢键影响：H2O、HF、NH3沸点反常高，冰中氢键使其密度小于液态水。","相似相溶：极性分子易溶于极性溶剂，非极性分子易溶于非极性溶剂。","配合物：中心离子与配体以配位键结合，如[Cu(NH3)4]2+深蓝色、配位数4。"],"3|2":["晶体特征：自范性、各向异性、固定熔点；非晶体没有固定熔点。","晶胞是最小的重复单元，平移可得到整个晶体，用均摊法计数。","均摊法：顶点粒子贡献1/8、棱上1/4、面上1/2、体内1。","离子晶体：阴阳离子以离子键结合，如NaCl、CsCl，熔融或溶于水导电。","NaCl晶胞：Na+与Cl-配位数均为6，一个晶胞含4个Na+与4个Cl-。","共价晶体：原子以共价键结合成空间网状结构，金刚石、SiO2、晶体硅。","金刚石：每个C与4个C成键，1 mol金刚石含2 mol C-C键，熔点高硬度大。","SiO2：每个Si连4个O、每个O连2个Si，1 mol SiO2含4 mol Si-O键。","分子晶体：以范德华力或氢键结合，干冰、冰、碘，熔沸点低。","金属晶体：金属阳离子与自由电子靠金属键结合，导电导热、有延展性。","晶胞密度计算：密度等于晶胞质量除以体积，晶胞质量等于粒子数乘摩尔质量除以NA。","熔点比较：共价晶体大于离子晶体大于分子晶体（一般规律）。","石墨：层内共价键、层间范德华力，可导电，是混合型晶体。"],"3|3":["有机物按碳骨架分链状与环状化合物，按官能团分烃及烃的衍生物。","常见官能团：碳碳双键、碳碳三键、卤素原子、羟基、醛基、羧基、酯基、氨基。","烷烃命名：选最长碳链为主链，编号使支链位次和最小，如2,2-二甲基丙烷。","烯烃炔烃命名：选含双键或三键的最长链为主链，编号使不饱和键位次最小。","苯的同系物：苯环为母体，编号使取代基位次最小，如1,2-二甲苯即邻二甲苯。","同分异构现象：分子式相同结构不同的现象，分为碳链异构、位置异构、官能团异构。","官能团异构：C4H10O中醇与醚、C4H8O2中羧酸与酯互为同分异构体。","常见数目：C4H10有2种、C5H12有3种、C4H9Cl有4种同分异构体。","等效氢法：同一碳上、对称位置、连在同一碳上的甲基上的氢等效。","不饱和度计算：Ω=(2n+2-m)/2，判断分子中环与双键数目。","手性碳：连接四个不同原子或基团的碳原子，存在对映异构体。"],"3|4":["烷烃通式CnH2n+2，特征反应为取代，光照下与Cl2、Br2卤代。","烯烃通式CnH2n，能加成与加聚，使溴水和酸性KMnO4褪色。","乙炔CH≡CH直线形，能加成，CH≡CH+2Br2=CHBr2CHBr2。","苯易取代难加成，不与溴水、KMnO4反应，甲苯侧链能被氧化成苯甲酸。","卤代烃水解：R-X+NaOH=R-OH+NaX（NaOH水溶液加热）。","卤代烃消去：NaOH醇溶液加热，生成烯烃、NaX和H2O。","卤素检验：水解后用稀硝酸酸化，再加AgNO3看沉淀颜色。","乙醇与钠：2C2H5OH+2Na=2C2H5ONa+H2↑，羟基上氢被置换。","乙醇催化氧化：2C2H5OH+O2=2CH3CHO+2H2O（Cu或Ag催化加热）。","醇消去：浓硫酸170摄氏度加热，乙醇生成乙烯和水。","苯酚弱酸性：与NaOH、Na2CO3反应，不与NaHCO3反应，FeCl3显紫色。","苯酚与溴水：生成三溴苯酚白色沉淀，用于检验苯酚。","醛基检验：银镜反应与水浴加热的新制Cu(OH)2生成砖红色沉淀。","羧酸与酯化：羧酸与NaHCO3放CO2，酯化酸脱羟基醇脱氢，碱性水解完全。"],"3|5":["葡萄糖C6H12O6是多羟基醛，与果糖互为同分异构体，不能水解。","葡萄糖检验：银镜反应与新制Cu(OH)2加热生成砖红色沉淀。","蔗糖水解生成葡萄糖和果糖，麦芽糖水解生成两分子葡萄糖。","二糖水解：C12H22O11+H2O=C6H12O6+C6H12O6（稀硫酸加热催化）。","淀粉是天然高分子，遇碘变蓝，水解最终产物为葡萄糖。","纤维素也是天然高分子，水解生成葡萄糖，人体不能消化。","油脂是高级脂肪酸甘油酯，不饱和油脂能使溴水褪色。","油脂皂化：碱性条件下水解生成高级脂肪酸钠和甘油，制肥皂。","硬化油：不饱和油脂与H2加成（催化剂加热）制得。","氨基酸含氨基与羧基，具有两性，是蛋白质水解最终产物。","蛋白质盐析：加轻金属盐可逆析出，用于分离提纯。","蛋白质变性：加热、强酸强碱、重金属盐、紫外线使其不可逆变性。","蛋白质检验：遇浓硝酸变黄（颜色反应），灼烧有烧焦羽毛气味。","核酸：DNA与RNA由核苷酸聚合而成，携带遗传信息。"],"3|6":["核心转化链：卤代烃水解得醇，醇氧化得醛，醛氧化得羧酸，醇酸酯化得酯。","引入卤原子：烷烃光照取代或烯烃炔烃与X2、HX加成。","引入碳碳双键：卤代烃或醇的消去反应。","氧化反应：醇到醛到羧酸是氧化，烯烃、醛、酮加氢是还原。","加成反应引入官能团：烯烃与水加成得醇，与HX加成得卤代烃。","逆合成分析：从目标产物官能团出发倒推原料与中间体，设计路线。","官能团保护：酚羟基、氨基在氧化或酯化前先保护，反应后脱保护。","常见条件记忆：NaOH水溶液加热水解、NaOH醇溶液加热消去、浓硫酸170摄氏度醇消去。","推断突破口：分子式与不饱和度、特征反应（银镜、FeCl3显色、溴水褪色）。","核磁共振氢谱：峰数等于等效氢种类数，峰面积比等于氢原子个数比。","红外光谱：用于判断分子中含有的官能团种类。","加聚反应：含碳碳双键的单体发生加成聚合，无小分子生成。","缩聚反应：含两个官能团的单体脱去小分子（如水）聚合。","合成路线评价：步骤少、产率高、原料易得、原子经济、条件温和、绿色环保。"],"4|0":["常用仪器：容量瓶、分液漏斗、冷凝管、坩埚、蒸发皿、滴定管的用途要分清。","过滤操作：一贴二低三靠，滤纸紧贴漏斗，液面低于滤纸边缘。","蒸发结晶：蒸发皿中加热，大量晶体析出时停止加热，用余热蒸干。","蒸馏：分离沸点不同的互溶液体，加碎瓷片防暴沸，温度计水银球位于支管口。","萃取分液：萃取剂与原溶剂互不相溶，下层从下口放出，上层从上口倒出。","气体制备装置：固固加热制O2、NH3，固液不加热制H2、CO2，固液加热制Cl2、SO2。","气体收集：难溶于水用排水法，密度大于空气用向上排空气法，小于空气向下排。","气体净化干燥：洗气瓶长进短出，浓硫酸干燥酸性气体，碱石灰干燥碱性气体。","尾气处理：Cl2、SO2用NaOH溶液吸收，CO点燃处理，注意防倒吸。","药品保存：钠放煤油中、白磷放冷水中、浓硝酸棕色瓶避光、NaOH用橡胶塞。","实验安全：酒精灯用火柴点燃，加热液体加碎瓷片防暴沸，有毒气体验证在通风橱。","离子检验：Cl-用AgNO3和稀硝酸，SO42-先加盐酸无沉淀再加BaCl2。"],"4|1":["中和滴定：酸式滴定管装酸性或氧化性溶液，碱式滴定管装碱性溶液。","滴定管使用：先检漏、润洗，装液后赶气泡，读数估读到0.01 mL。","终点判断：滴入最后半滴标准液，指示剂变色且半分钟内不褪色。","指示剂选择：强酸强碱用酚酞或甲基橙，强酸弱碱用甲基橙，强碱弱酸用酚酞。","滴定误差：未润洗滴定管使浓度偏高，俯视读数使体积偏小结果偏低。","探究实验流程：明确目的、提出假设、设计实验、预测现象、得出结论。","控制变量法：只改变一个变量，其他条件保持相同，设计对比实验。","方案评价角度：可行性、科学性、安全性、环保性、简约性。","定量测定：沉淀法、气体体积法、滴定法，用关系式法列比例计算。","数据处理：重复实验取平均值，异常数据舍弃，计算相对误差。","规范表述：取样品、加试剂、若出现某现象、则证明某结论，操作现象结论三步。"],"4|2":["流程主线：原料预处理、核心反应、分离提纯、产品获得四个环节。","粉碎研磨目的：增大接触面积，加快反应速率，提高浸取率。","焙烧煅烧目的：使矿物转化为易反应物质，如硫铁矿焙烧生成Fe2O3和SO2。","酸浸碱浸：溶解目标金属或氧化物，除去不溶性杂质。","加氧化剂：将Fe2+氧化为Fe3+，便于后续调节pH沉淀除去。","调节pH：控制pH使Fe3+、Al3+水解沉淀，目标离子留在溶液中。","沉淀剂：利用Ksp使杂质沉淀，如加BaCl2除SO42-，加NaOH除Mg2+。","蒸发浓缩冷却结晶：适用于溶解度随温度变化大的物质，如KNO3。","蒸发结晶：适用于溶解度受温度影响小的物质，如NaCl。","洗涤沉淀：用蒸馏水或乙醇洗涤，取最后一次洗涤液检验是否洗净。","循环利用：母液、滤液返回前面步骤，提高原料利用率。","陌生方程式书写：结合介质酸碱性补H+或OH-，用守恒法配平。","绿色化学：废渣回收、尾气处理、母液循环，减少污染。"],"4|3":["微粒数陷阱：1 mol Na2O2含2 mol Na+与1 mol O22-，注意离子组成。","标况状态陷阱：标况下SO3、CCl4、苯、乙醇、HF不是气体，不能用22.4 L/mol。","可逆反应陷阱：N2与H2、SO2与O2、Cl2与H2O反应不能完全转化。","电子转移陷阱：Na2O2与H2O反应1 mol转移1 mol电子，Cl2与NaOH歧化同。","结构陷阱：1 mol SiO2含4 mol Si-O键，1 mol P4含6 mol P-P键，石墨1.5 mol C-C键。","溶液陷阱：弱电解质部分电离、盐类水解使溶液中离子数目减少。","溶剂陷阱：水中也含氧原子，氨水溶质视为NH3·H2O，氯水成分复杂。","核素陷阱：D2O、T2O、18O2中质子中子数与普通水不同。","聚集状态：标况下水是液态，NO2与N2O4存在相互转化平衡。","混合气体：求平均摩尔质量与分子总数，注意各组分的状态与组成。"],"4|4":["离子方程式正误判断：查客观事实、拆写规则、原子守恒与电荷守恒。","拆写规则：强酸强碱可溶性盐拆，弱酸弱碱、难溶物、氧化物、单质不拆。","微溶物：作反应物澄清石灰水可拆，作生成物如CaSO4不拆。","氨水是弱碱不拆，浓硫酸以分子存在不拆，浓盐酸拆为H+和Cl-。","与量有关：少量物质按1 mol完全反应确定计量数，如向Ca(OH)2通CO2。","滴加顺序：Na2CO3与盐酸互滴现象不同，AlCl3与NaOH互滴产物不同。","隐含条件：无色排除Cu2+、Fe3+、Fe2+、MnO4-，pH与Al反应条件判断。","氧化还原不共存：Fe3+与I-、S2-，MnO4-与Fe2+、I-、SO32-，ClO-与还原性离子。","双水解不共存：Al3+与HCO3-、CO32-、AlO2-、S2-，Fe3+与HCO3-、CO32-。","络合不共存：Fe3+与SCN-生成血红色配合物，Cu2+与过量氨水生成深蓝色。","除杂离子反应：除CO32-加盐酸，除SO42-加BaCl2，除Mg2+加NaOH。","水电离c(H+)=1×10的负13次方：溶液可能显强酸性也可能显强碱性。"],"4|5":["三守恒解题：电子守恒、原子守恒、电荷守恒是氧化还原计算的核心。","电子守恒：氧化剂得电子总数等于还原剂失电子总数。","强弱规律：氧化剂氧化性大于氧化产物，还原剂还原性大于还原产物。","价态规律：最高价只有氧化性，最低价只有还原性，中间价态两者兼有。","陌生方程式书写：标价态、算升降、定系数、按介质补H+、OH-或H2O。","装置判断：有外接电源为电解池，无电源为原电池。","电极反应书写：注意介质参与，用电子守恒、电荷守恒、原子守恒配平。","电解计算：串联电路转移电子数相等，求气体体积与析出金属质量。","二次电池：放电时的负极，充电时接电源负极作阴极，反应互逆。","离子交换膜：质子交换膜只允许H+通过，维持溶液电荷平衡。","腐蚀快慢：电解原理腐蚀大于原电池腐蚀大于化学腐蚀。","金属防护：牺牲阳极保护法、外加电流阴极保护法、镀层与涂层。"],"4|6":["图像审题：先看横纵坐标，再看曲线趋势与起点、交点、拐点、平衡点。","c-t图：曲线水平段为平衡，各物质浓度变化量之比等于化学计量数之比。","v-t图：突变点判断条件改变，速率同时增大可能是升温或加压。","先拐先平数值大：先达平衡的曲线对应温度高、压强大或浓度大。","转化率-温度图：升温转化率升高则为吸热反应，降低则为放热反应。","转化率-压强图：增大压强转化率升高，则该方向气体分子数减小。","K-T图：K随温度升高增大为吸热反应，减小为放热反应。","等温线等压线：固定一个变量分析另一变量，判断吸放热与计量数。","投料比图：按化学计量数之比投料时，两种反应物转化率最大。","三段式计算：起始量、转化量、平衡量，求转化率、K与平均摩尔质量。","恒容充惰性气体：速率与平衡均不变；恒压充惰性气体对不等体反应有影响。"],"4|7":["推断突破口：分子式与不饱和度、特征反应、红外与核磁共振氢谱数据。","分子式确定：元素分析、燃烧产物定量与质谱相对分子质量。","红外光谱判断官能团种类，核磁共振氢谱峰数等于等效氢种类数。","特征反应：醛基银镜与Cu(OH)2、酚羟基FeCl3显紫色、羧基与NaHCO3放CO2。","合成路线：目标产物逆推，先定碳骨架，再设计官能团转化。","新信息应用：分析陌生反应的断键成键位置，模仿书写产物。","官能团保护：酚羟基、氨基在氧化或酯化前保护，防止副反应。","限定条件同分异构体：满足苯环、官能团、核磁峰数等条件逐一排查。","反应类型判断：取代、加成、消去、氧化、还原、加聚、缩聚。","合成路线评价：步骤少、产率高、原料易得、原子经济、绿色环保。"]},"biology":{"0|0":["组成细胞的元素：按含量分为大量元素（C、H、O、N、P、S、K、Ca、Mg等）和微量元素（Fe、Mn、Zn、Cu、B、Mo等），C是基本元素。","组成细胞的化合物分为无机化合物（水、无机盐）和有机化合物（糖类、脂质、蛋白质、核酸），其中水含量最多。","水以自由水和结合水两种形式存在，自由水是良好溶剂并参与代谢，结合水是细胞结构的重要组成成分。","无机盐主要以离子形式存在，是细胞和生物体的组成成分，并维持细胞和生物体的生命活动及酸碱平衡。","糖类按水解情况分为单糖（葡萄糖、果糖、核糖、脱氧核糖）、二糖（蔗糖、麦芽糖、乳糖）和多糖（淀粉、纤维素、糖原）。","脂肪是细胞内良好的储能物质，还有保温、缓冲和减压作用；磷脂是构成生物膜的重要成分；固醇包括胆固醇、性激素和维生素D。","蛋白质功能多样：构成细胞和生物体结构（结构蛋白）、催化（酶）、运输（血红蛋白）、调节（激素）、免疫（抗体）。","检测生物组织中的有机物：还原糖用斐林试剂水浴加热产生砖红色沉淀，脂肪用苏丹Ⅲ染液呈橘黄色，蛋白质用双缩脲试剂呈紫色。","氨基酸结构通式：每种氨基酸至少含一个氨基和一个羧基，且连在同一个碳原子上，R基的不同决定氨基酸种类。","氨基酸脱水缩合形成多肽，肽键数等于脱去水分子数；蛋白质相对分子质量等于氨基酸总质量减脱去水分子总质量。","蛋白质结构多样性由氨基酸种类、数目、排列顺序及肽链盘曲折叠形成的空间结构决定。","核酸是细胞内携带遗传信息的物质，DNA主要分布在细胞核，RNA主要分布在细胞质，基本单位是核苷酸。","DNA与RNA比较：DNA含脱氧核糖和胸腺嘧啶T，RNA含核糖和尿嘧啶U，DNA一般是双链，RNA一般是单链。"],"0|1":["细胞膜成分：主要由脂质（磷脂最丰富）和蛋白质组成，还有少量糖类，功能越复杂的细胞膜蛋白质种类和数量越多。","流动镶嵌模型：磷脂双分子层构成基本支架，蛋白质镶嵌或贯穿其中，磷脂分子和大多数蛋白质可以运动，膜具有流动性。","细胞膜功能：将细胞与外界环境分隔开、控制物质进出细胞、进行细胞间的信息交流（如受体结合、胞间连丝）。","制备纯净细胞膜选用哺乳动物成熟红细胞：无细胞核和众多细胞器，用蒸馏水使其吸水涨破后离心提取。","线粒体：双层膜，内膜向内折叠形成嵴，含少量DNA和RNA，是有氧呼吸第二、三阶段场所，是有氧呼吸的主要场所。","叶绿体：双层膜，含基粒（类囊体堆叠）和基质，含少量DNA和RNA，是光合作用的场所。","内质网：单层膜，粗面内质网上附着核糖体参与蛋白质的加工运输，光面内质网参与脂质合成。","高尔基体：单层膜，对蛋白质进行加工、分类和包装，在植物细胞中与细胞壁的形成有关。","核糖体：无膜结构，由rRNA和蛋白质组成，是蛋白质合成的场所；游离核糖体合成胞内蛋白，附着核糖体合成分泌蛋白。","中心体：无膜结构，由两个互相垂直的中心粒组成，与动物和低等植物细胞的有丝分裂有关。","细胞骨架：由蛋白质纤维组成，维持细胞形态，锚定并支撑细胞器，与细胞运动、分裂、分化及物质运输有关。","分泌蛋白的合成运输途径：核糖体→内质网→高尔基体→细胞膜，用同位素标记法（3H标记亮氨酸）追踪验证。","细胞核结构：核膜（双层膜，上有核孔）、核仁（与核糖体形成有关）、染色质（由DNA和蛋白质组成）。","染色质与染色体是同一种物质在细胞不同时期的两种存在状态；细胞核是遗传信息库，是细胞代谢和遗传的控制中心。"],"0|2":["渗透作用：水分子（或其他溶剂分子）通过半透膜的扩散，发生条件是有半透膜和半透膜两侧存在浓度差。","成熟的植物细胞构成渗透系统：细胞膜和液泡膜及两膜之间的细胞质构成原生质层，原生质层相当于半透膜。","动物细胞吸失水：红细胞放入清水中吸水涨破，放入浓盐水中失水皱缩，细胞膜相当于半透膜。","植物细胞吸失水：细胞壁是全透性的，外界溶液浓度大于细胞液浓度时细胞失水，发生质壁分离。","自由扩散：物质顺浓度梯度直接透过磷脂双分子层，不需转运蛋白和能量，如O2、CO2、甘油、乙醇、苯。","协助扩散：顺浓度梯度，需借助转运蛋白（载体蛋白或通道蛋白），不需能量，如葡萄糖进入红细胞、水通过水通道蛋白。","主动运输：逆浓度梯度运输，需载体蛋白协助并消耗能量，如K+进入细胞、葡萄糖和氨基酸进入小肠上皮细胞。","转运蛋白具有特异性，数量有限，故协助扩散和主动运输的运输速率存在饱和现象。","胞吞和胞吐：大分子物质通过细胞膜内陷形成囊泡进入或排出细胞，需要消耗能量，依赖细胞膜的流动性。","质壁分离及复原实验：选紫色洋葱鳞片叶外表皮，用0.3g/mL蔗糖溶液处理，可证明原生质层相当于半透膜并判断细胞死活。"],"1|0":["酶是活细胞产生的具有催化作用的有机物，绝大多数是蛋白质，少数是RNA，细胞代谢需要酶的催化。","酶的作用机理是降低化学反应的活化能，与无机催化剂相比降低活化能更显著，催化效率更高，不改变化学反应平衡点。","酶的特性：高效性、专一性、作用条件较温和；高温、过酸、过碱会使酶空间结构破坏而永久失活。","酶本质探索：毕希纳证明引起发酵的是酶，萨姆纳提取脲酶证明酶是蛋白质，切赫和奥特曼发现少数RNA也有催化功能。","ATP结构简式A-P~P~P，A代表腺苷，P代表磷酸基团，~代表高能磷酸键，ATP是驱动细胞生命活动的直接能源物质。","ATP与ADP相互转化：ATP水解时高能磷酸键断裂释放能量，ATP合成时吸收能量，二者转化不是可逆反应。","细胞的能量来源：糖类是主要能源物质，脂肪是良好的储能物质，ATP是直接能源物质，最终能量来源是太阳能。","有氧呼吸第一阶段在细胞质基质进行：葡萄糖分解为丙酮酸和[H]，释放少量能量。","有氧呼吸第二阶段在线粒体基质进行：丙酮酸和水彻底分解为CO2和[H]，释放少量能量。","有氧呼吸第三阶段在线粒体内膜进行：[H]与O2结合生成水，释放大量能量，产生大量ATP。","无氧呼吸在细胞质基质进行：第一阶段同有氧呼吸，第二阶段丙酮酸转化为酒精和CO2（酵母菌、多数植物）或乳酸（动物、乳酸菌）。","细胞呼吸原理应用：酵母菌酿酒先通气后密封，果蔬保鲜采用低温低氧，种子入库前晒干降低呼吸作用。","光合作用探究历程：萨克斯实验证明绿叶在光下产生淀粉，恩格尔曼实验证明氧气由叶绿体释放。","鲁宾和卡门用18O同位素标记证明光合作用释放的氧气全部来自水；卡尔文用14C标记CO2探明暗反应中碳的转移途径。"],"1|1":["细胞增殖方式：真核生物体细胞以有丝分裂为主，还有无丝分裂和减数分裂；原核细胞通过二分裂增殖。","细胞周期：连续分裂的细胞从一次分裂完成时开始到下一次分裂完成时为止，包括分裂间期和分裂期。","分裂间期：完成DNA复制和有关蛋白质的合成，细胞适度生长，为分裂期进行物质准备。","有丝分裂前期：染色质螺旋化为染色体，核膜、核仁逐渐消失，纺锤体形成，染色体散乱分布。","有丝分裂中期：着丝粒排列在赤道板上，染色体形态和数目最清晰，是观察和计数染色体的最佳时期。","有丝分裂后期：着丝粒分裂，姐妹染色单体分开成为两条染色体，在纺锤丝牵引下分别移向细胞两极，染色体数目加倍。","有丝分裂末期：染色体解螺旋为染色质，核膜、核仁重新出现，纺锤体消失，细胞一分为二。","动物细胞与植物细胞末期区别：动物细胞膜从中部向内凹陷缢裂，植物细胞在赤道板位置形成细胞板扩展为细胞壁。","有丝分裂的意义：亲代细胞的染色体复制后平均分配到两个子细胞中，保持了亲子代细胞遗传性状的稳定性。","无丝分裂：细胞核先延长，从中部缢裂为两个核，整个过程无纺锤丝和染色体出现，如蛙的红细胞分裂。","观察根尖分生组织细胞有丝分裂实验：解离（盐酸和酒精混合液）、漂洗、染色（甲紫溶液）、制片四个步骤。","细胞分化：在个体发育中，由一个或一种细胞增殖产生的后代，在形态、结构和生理功能上发生稳定性差异的过程。","细胞分化的实质是基因的选择性表达，分化不改变细胞的遗传物质；细胞全能性随分化程度提高而降低。","细胞衰老特征：水分减少、多种酶活性降低、色素积累、细胞核体积增大、细胞膜通透性改变；细胞凋亡是基因控制的编程性死亡。"],"1|2":["豌豆作为实验材料的优点：自花传粉、闭花受粉，自然状态下一般为纯种；具有易于区分的相对性状。","人工异花传粉操作：母本去雄（花蕾期）→套袋→人工授粉→再套袋；符号P表示亲本、F1表示子一代、F2表示子二代。","相对性状：一种生物的同一种性状的不同表现类型，如豌豆的高茎与矮茎、圆粒与皱粒。","性状分离：杂种后代中同时出现显性性状和隐性性状的现象，如F1高茎自交后代出现高茎和矮茎。","孟德尔对分离现象的解释：生物的性状由遗传因子决定，体细胞中遗传因子成对存在，形成配子时成对遗传因子彼此分离。","分离定律内容：在杂合子细胞中，位于一对同源染色体上的等位基因，形成配子时随同源染色体的分开而分离，分别进入不同配子。","分离定律的验证：测交（Aa与aa杂交）后代性状分离比约为1:1，可证明F1产生两种数量相等的配子。","假说—演绎法步骤：提出问题→作出假说→演绎推理→实验验证（测交）→得出结论。","自由组合定律内容：控制不同性状的遗传因子的分离和组合互不干扰，形成配子时决定同一性状的成对遗传因子彼此分离，决定不同性状的遗传因子自由组合。","自由组合的验证：F1（YyRr）与隐性纯合子测交，后代出现四种表现型且比例约为1:1:1:1。","自由组合定律的细胞学基础：减数第一次分裂后期非同源染色体自由组合，其上的非等位基因随之自由组合。","孟德尔获得成功的原因：正确选材、由一对相对性状到多对相对性状的研究、运用统计学方法分析、科学严谨的实验程序。"],"1|3":["减数分裂概念：进行有性生殖的生物，原始生殖细胞经染色体复制一次、细胞连续分裂两次，形成的成熟生殖细胞染色体数目减半。","减数第一次分裂前期：同源染色体两两配对（联会）形成四分体，四分体中的非姐妹染色单体可发生交叉互换。","减数第一次分裂后期：同源染色体分离，分别移向细胞两极，非同源染色体自由组合，染色体数目减半。","减数第二次分裂：无同源染色体，后期姐妹染色单体分开，染色体数目暂时加倍，末期细胞一分为二。","精子形成过程：精原细胞→初级精母细胞→两个次级精母细胞→四个精细胞→变形为精子，细胞质均等分裂。","卵细胞形成过程：初级卵母细胞分裂产生次级卵母细胞和第一极体，次级卵母细胞再分裂产生卵细胞和第二极体，细胞质不均等分配。","受精作用：精子和卵细胞相互识别后融合，精子的核与卵细胞的核融合，受精卵染色体数目恢复体细胞数目。","减数分裂和受精作用的意义：维持生物前后代体细胞染色体数目的恒定，同时增加遗传多样性。","萨顿运用类比推理提出基因在染色体上的假说，摩尔根用果蝇杂交实验证明基因位于染色体上。","摩尔根果蝇实验：红眼雌蝇与白眼雄蝇杂交，F1全为红眼，F2中白眼全为雄性，证明白眼基因位于X染色体上。","伴X染色体隐性遗传特点（红绿色盲、血友病）：男性患者多于女性患者，具有交叉遗传现象。","伴X染色体显性遗传特点（抗维生素D佝偻病）：女性患者多于男性患者，男患者的母亲和女儿一定患病。","伴Y染色体遗传特点：只在男性中遗传，父传子、子传孙，如外耳道多毛症。","观察减数分裂实验：选用蝗虫精母细胞制作临时装片，可观察到减数第一次分裂和减数第二次分裂各时期图像。"],"1|4":["肺炎链球菌转化实验：格里菲思发现加热杀死的S型菌含转化因子，艾弗里证明转化因子是DNA，即DNA是遗传物质。","噬菌体侵染细菌实验：赫尔希和蔡斯用35S标记蛋白质、32P标记DNA，证明DNA是噬菌体的遗传物质。","烟草花叶病毒实验证明RNA是遗传物质；除少数RNA病毒外，细胞生物的遗传物质都是DNA，DNA是主要的遗传物质。","DNA双螺旋结构（沃森和克里克提出）：两条脱氧核苷酸链反向平行盘旋，磷酸和脱氧核糖交替连接构成基本骨架。","DNA碱基互补配对：A与T配对、G与C配对，碱基对之间通过氢键连接，双链DNA中嘌呤总数等于嘧啶总数。","DNA分子的特性：稳定性、多样性（碱基对的排列顺序千变万化）、特异性（每种DNA有特定的碱基排列顺序）。","DNA复制：半保留复制、边解旋边复制，需要模板、原料（4种脱氧核苷酸）、能量和酶（解旋酶、DNA聚合酶）。","DNA复制场所主要是细胞核，线粒体和叶绿体中也可进行；复制n次后DNA分子数为2的n次方个。","基因通常是有遗传效应的DNA片段，一个DNA分子上有许多基因，基因中碱基的排列顺序代表遗传信息。","转录：以DNA的一条链为模板合成RNA，需要RNA聚合酶，原料是4种核糖核苷酸，场所主要是细胞核。","翻译：以mRNA为模板，tRNA识别并转运氨基酸，在核糖体上合成具有一定氨基酸顺序的蛋白质。","密码子是mRNA上决定一个氨基酸的三个相邻碱基，64个密码子中3个是终止密码子，起始密码子AUG编码甲硫氨酸。","基因控制性状的两条途径：通过控制酶的合成控制代谢过程间接控制性状（如豌豆皱粒），通过控制蛋白质结构直接控制性状（如囊性纤维化）。","中心法则：遗传信息从DNA流向DNA（复制）、从DNA流向RNA再流向蛋白质（转录和翻译），RNA病毒还可进行RNA复制和逆转录。"],"1|5":["基因突变实例：镰状细胞贫血是由于血红蛋白基因中一个碱基对发生替换，导致谷氨酸变为缬氨酸。","基因突变概念：DNA分子中发生碱基对的增添、缺失或替换，而引起的基因碱基序列的改变。","基因突变主要发生在细胞分裂间期DNA复制时，可自发产生，也可由物理、化学、生物因素诱发。","基因突变的特点：普遍性、随机性、不定向性、低频性、多害少利性；基因突变产生新基因，是生物变异的根本来源。","基因重组：减数分裂时非同源染色体上的非等位基因自由组合，以及同源染色体非姐妹染色单体交叉互换，是生物变异的重要来源。","染色体结构变异：缺失、重复、倒位、易位，改变染色体上基因的数目或排列顺序，可用显微镜直接观察。","染色体数目变异：细胞内个别染色体增加或减少（如21三体综合征），或以染色体组的形式成倍增加或减少。","染色体组：细胞中形态和大小各不相同的一组非同源染色体，共同携带控制生物生长发育的全套遗传信息。","二倍体、多倍体：体细胞含两个染色体组的个体是二倍体，含三个或三个以上染色体组的是多倍体，如香蕉是三倍体。","单倍体：体细胞含有本物种配子染色体数目的个体，一般植株弱小且高度不育。","杂交育种：原理是基因重组，通过杂交、自交、选优、连续自交获得纯合子，方法简便但育种年限长。","诱变育种：原理是基因突变，利用物理或化学因素提高突变频率，可产生新性状但具有不定向性，需大量筛选。","单倍体育种：花药离体培养获得单倍体幼苗，再用秋水仙素处理使染色体数目加倍，能明显缩短育种年限。","多倍体育种：用秋水仙素或低温抑制纺锤体形成，使染色体数目加倍；无子西瓜是二倍体与四倍体杂交产生的三倍体。"],"1|6":["生物有共同祖先的证据：化石（最直接的证据）、比较解剖学（同源器官）、胚胎学、细胞和分子水平的证据。","达尔文自然选择学说内容：过度繁殖、生存斗争、遗传变异、适者生存，解释了生物进化的原因和适应性。","自然选择学说的局限性：不能解释遗传和变异的本质，对生物进化的解释局限于个体水平。","种群是生物进化的基本单位；种群基因库是种群中全部个体所含有的全部基因的总和。","突变（基因突变和染色体变异）和基因重组为生物进化提供原材料，突变具有不定向性，不能决定进化方向。","自然选择直接作用于个体的表型，使种群的基因频率发生定向改变，决定生物进化的方向。","生物进化的实质是种群基因频率的改变；种群基因频率的改变不一定导致新物种形成。","隔离包括地理隔离和生殖隔离；生殖隔离指不同物种之间不能交配或交配后不能产生可育后代。","物种形成的三个基本环节：突变和基因重组、自然选择、隔离，生殖隔离是物种形成的标志。","加拉帕戈斯群岛地雀的进化：不同岛屿上的地雀种群经长期地理隔离和自然选择，最终形成不同物种。","协同进化：不同物种之间、生物与无机环境之间在相互影响中不断进化和发展。","生物多样性包括基因多样性、物种多样性和生态系统多样性，是协同进化的结果。"],"2|0":["体液包括细胞内液和细胞外液，细胞外液由血浆、组织液和淋巴液构成，细胞外液即内环境，是细胞直接生活的环境。","血浆、组织液、淋巴液的关系：血浆渗出毛细血管壁形成组织液，组织液大部分回流血浆，少部分进入毛细淋巴管形成淋巴液。","血浆成分：水约90%，含蛋白质约7%至9%，以及葡萄糖、氨基酸、无机盐、激素和代谢废物等。","血红蛋白存在于红细胞内，不属于内环境成分；汗液、尿液、消化液等与外界相通的液体也不属于内环境。","内环境的理化性质：渗透压（血浆渗透压主要与Na+、Cl-含量有关）、酸碱度（pH约为7.35至7.45）、温度（37℃左右）。","血浆pH维持：血浆中存在HCO3-与H2CO3等缓冲物质，能中和进入血浆的酸或碱性物质。","细胞通过内环境与外界进行物质交换：消化系统吸收营养物质，呼吸系统交换气体，泌尿系统排出代谢废物。","内环境是细胞与外界环境进行物质交换的媒介，细胞直接生活在内环境中。","稳态概念：正常机体通过调节作用，使各器官、系统协调活动，共同维持内环境的相对稳定状态。","稳态的调节机制：神经—体液—免疫调节网络是机体维持稳态的主要调节机制。","内环境稳态的意义：内环境稳态是机体进行正常生命活动的必要条件，稳态失调会导致疾病。"],"2|1":["神经系统包括中枢神经系统（脑和脊髓）和外周神经系统（脑神经和脊神经），后者又分为躯体运动神经和内脏运动神经。","自主神经系统由交感神经和副交感神经组成，二者作用相反，共同调节内脏器官的活动，如心跳加快和减慢。","神经元是神经系统结构和功能的基本单位，由细胞体、树突和轴突组成，轴突及其髓鞘构成神经纤维。","反射是神经调节的基本方式，指在中枢神经系统参与下，机体对内外刺激产生的规律性应答。","反射弧由感受器、传入神经、神经中枢、传出神经和效应器组成，效应器是传出神经末梢及其所支配的肌肉或腺体。","反射类型：非条件反射（生来就有，如膝跳反射、缩手反射）和条件反射（后天学习形成，需要大脑皮层参与）。","静息电位：未受刺激时膜内K+外流，膜电位表现为外正内负；受刺激后Na+内流形成动作电位，表现为外负内正。","兴奋在神经纤维上以电信号（神经冲动）形式双向传导，膜内电流方向与兴奋传导方向相同。","突触结构包括突触前膜、突触间隙和突触后膜，突触小泡中的神经递质经胞吐释放到突触间隙。","神经递质与突触后膜上的受体特异性结合，引起突触后神经元兴奋或抑制，作用后迅速被降解或回收。","兴奋在神经元之间的传递是单向的，原因是神经递质只能由突触前膜释放，作用于突触后膜。","神经系统的分级调节：大脑皮层是最高级中枢，低级中枢（如脊髓）受高级中枢的调控，如排尿反射。","人脑的高级功能：语言（S区受损患运动性失语症，H区受损患听觉性失语症）、学习和记忆、情绪等。","大脑皮层言语区：S区（运动性语言中枢）受损不能说话，H区受损听不懂话，W区受损不能写字，V区受损看不懂文字。"],"2|2":["激素的发现：斯他林和贝利斯发现促胰液素，这是人们发现的第一种激素；沃泰默和巴甫洛夫曾认为其调节是神经调节。","激素概念：由内分泌腺或内分泌细胞分泌的高效生物活性物质，经体液运输到全身，作用于靶器官、靶细胞。","主要内分泌腺及其激素：下丘脑（促激素释放激素、抗利尿激素）、垂体（生长激素、促甲状腺激素）、甲状腺（甲状腺激素）。","胰岛：胰岛B细胞分泌胰岛素，胰岛A细胞分泌胰高血糖素；肾上腺分泌肾上腺素，性腺分泌性激素。","血糖的来源：食物中糖类的消化吸收、肝糖原分解、非糖物质转化；去路：氧化分解、合成糖原、转化为脂肪等。","胰岛素是唯一能降低血糖的激素，促进组织细胞加速摄取、利用和储存葡萄糖；胰高血糖素促进肝糖原分解升高血糖。","血糖调节方式：神经—体液调节，血糖调节中枢位于下丘脑，胰岛素和胰高血糖素相互拮抗共同维持血糖平衡。","甲状腺激素分泌的分级调节：下丘脑分泌促甲状腺激素释放激素，促进垂体分泌促甲状腺激素，进而促进甲状腺分泌甲状腺激素。","反馈调节：甲状腺激素含量增多时，会抑制下丘脑和垂体的分泌活动（负反馈），使甲状腺激素含量维持相对稳定。","激素调节的特点：微量高效、通过体液运输、作用于靶器官和靶细胞（需与靶细胞表面的特异性受体结合）。","激素一经靶细胞接受并起作用后就失活，体内激素水平依靠不断产生和灭活来维持动态平衡。","体温调节：寒冷时皮肤血管收缩减少散热、骨骼肌战栗增加产热，甲状腺激素和肾上腺素分泌增多促进代谢产热。","水盐平衡调节：细胞外液渗透压升高，刺激下丘脑渗透压感受器，下丘脑合成并由垂体释放抗利尿激素增多，促进肾小管和集合管重吸收水。","神经调节与体液调节的关系：体液调节是神经调节的一个环节，内分泌腺受中枢神经系统的控制，激素也可影响神经系统的发育和功能。"],"2|3":["免疫器官：骨髓（免疫细胞产生和成熟场所）、胸腺（T细胞成熟场所）、扁桃体、淋巴结和脾等。","免疫细胞：淋巴细胞（B细胞、T细胞）、树突状细胞、巨噬细胞等，都来自骨髓中的造血干细胞。","免疫活性物质：抗体、细胞因子（如白细胞介素）、溶菌酶等，由免疫细胞或其他细胞产生并发挥免疫作用。","免疫系统的三大功能：免疫防御（抵抗病原体入侵）、免疫自稳（清除衰老或损伤的细胞）、免疫监视（识别和清除癌细胞）。","第一道防线：皮肤和黏膜；第二道防线：体液中的杀菌物质（如溶菌酶）和吞噬细胞；这两道防线属于非特异性免疫。","第三道防线：特异性免疫，包括体液免疫和细胞免疫，是后天获得的，具有特异性。","体液免疫过程：抗原呈递细胞摄取处理并呈递抗原，辅助性T细胞辅助B细胞，B细胞增殖分化为浆细胞和记忆B细胞。","浆细胞合成并分泌抗体，抗体与抗原特异性结合形成沉淀或细胞集团，最终被吞噬细胞吞噬消化。","细胞免疫过程：细胞毒性T细胞受抗原刺激后增殖分化为新的细胞毒性T细胞和记忆T细胞，与靶细胞密切接触使其裂解。","记忆细胞的作用：再次接触相同抗原时迅速增殖分化，产生更快更强的二次免疫应答。","过敏反应：已产生免疫的机体再次接受相同过敏原刺激时发生的组织损伤或功能紊乱，特点是发作迅速、反应强烈、消退较快。","自身免疫病：免疫系统对自身成分发生免疫反应，如类风湿关节炎、系统性红斑狼疮；免疫缺陷病如艾滋病（HIV主要攻击辅助性T细胞）。","免疫学的应用：接种疫苗（抗原）产生抗体和记忆细胞预防疾病，注射抗毒血清治疗，器官移植使用免疫抑制剂。","HIV传播途径：性接触、血液传播、母婴传播；艾滋病患者免疫功能几乎全部丧失，最终死于严重感染或恶性肿瘤。"],"2|4":["达尔文实验：单侧光照射胚芽鞘向光弯曲，胚芽鞘尖端受单侧光刺激后，产生的影响传递到下部引起弯曲生长。","鲍森·詹森实验：在胚芽鞘尖端与下部之间插入琼脂片，弯曲生长仍发生，说明尖端产生的影响可透过琼脂片。","拜尔实验：切去尖端后将其放在一侧，胚芽鞘弯向放尖端的对侧，说明弯曲生长是尖端产生的影响分布不均所致。","温特实验：将接触过尖端的琼脂块放在去尖端胚芽鞘一侧引起弯曲，证明尖端产生的影响是一种化学物质，命名为生长素。","生长素的化学本质是吲哚乙酸，产生部位主要是幼嫩的芽、叶和发育中的种子，集中在生长旺盛的部位。","生长素的运输：极性运输（从形态学上端运输到形态学下端，属于主动运输）和横向运输（单侧光、重力引起分布不均）。","生长素的作用：促进细胞纵向伸长，具有两重性，低浓度促进生长、高浓度抑制生长，根、芽、茎的敏感性依次降低。","顶端优势：顶芽产生的生长素向下运输，侧芽部位生长素浓度过高受抑制，去除顶芽后侧芽发育成枝条。","生长素类似物应用：促进扦插枝条生根、培育无子番茄（处理未受粉的雌蕊子房）、作为除草剂防除双子叶杂草。","其他植物激素的功能：赤霉素促进细胞伸长和种子萌发，细胞分裂素促进细胞分裂，脱落酸抑制生长和促进休眠，乙烯促进果实成熟。","激素间的相互作用：生长素和赤霉素协同促进茎的伸长，赤霉素和脱落酸在种子萌发上相互拮抗。","植物生长调节剂：人工合成的对植物生长发育有调节作用的化学物质，如2,4-D、乙烯利，应用时需注意浓度。","环境因素对植物生命活动的调节：光（通过光敏色素感知）、温度（如春化作用）、重力（根的向地性、茎的背地性）。","植物生长发育的调控：基因表达调控、激素调节和环境因素调节共同完成，三者相互联系、相互配合。"],"3|0":["种群概念：生活在同一地区的同种生物全部个体的集合，种群是物种繁殖和进化的基本单位。","种群密度：种群在单位面积或单位体积中的个体数，是种群最基本的数量特征。","调查种群密度的方法：样方法适用于植物和活动能力弱的动物，需随机取样，可采用五点取样法或等距取样法。","标志重捕法：适用于活动能力强、活动范围大的动物，种群数量等于初次捕获标记数乘以重捕数再除以重捕中标记数。","出生率和死亡率、迁入率和迁出率是决定种群密度大小的直接因素。","年龄结构：分为增长型、稳定型和衰退型，可预测种群数量的变化趋势。","性别比例：影响种群的出生率，进而影响种群密度，如利用性引诱剂诱杀雄虫可降低害虫种群密度。","J形增长：在食物和空间条件充裕、气候适宜、没有天敌等理想条件下，种群数量每年以一定的倍数增长。","S形增长：资源和空间有限，种群数量经过一定时间的增长后趋于稳定，稳定时的数量即环境容纳量（K值）。","K/2时种群增长速率最大，K值时增长速率为零，此时出生率等于死亡率。","影响种群数量变化的因素：非生物因素（光照、温度、水分）和生物因素（种内竞争、捕食、寄生等）。","种群研究的应用：渔业捕捞应在种群数量超过K/2后捕捞，使种群增长速率保持较大；有害生物防治可通过降低环境容纳量实现。"],"3|1":["群落概念：同一时间内聚集在一定区域中各种生物种群的集合，群落研究的是不同种群之间的关系。","物种丰富度：群落中物种数目的多少，是群落结构的重要指标，越靠近热带物种丰富度越高。","种间关系类型：捕食、竞争、寄生、互利共生，如捕食是捕食者与被捕食者之间的关系。","互利共生实例：豆科植物与根瘤菌、人体肠道中的益生菌、地衣中的藻类和真菌，双方相互依存、彼此有利。","群落的空间结构：垂直结构表现为分层现象，植物分层主要与光照有关，动物分层与食物条件和栖息空间有关。","群落的水平结构：不同地段分布着不同种群，呈镶嵌分布，与地形变化、土壤湿度和盐碱度、光照强度及人为干扰有关。","群落的主要类型：荒漠生物群落、草原生物群落、森林生物群落、湿地生物群落和海洋生物群落等。","群落演替：随着时间的推移，一个群落被另一个群落代替的过程，分为初生演替和次生演替。","初生演替：从裸岩开始的演替顺序为裸岩→地衣→苔藓→草本植物→灌木→乔木，起点无土壤和种子等繁殖体。","次生演替：弃耕农田的演替顺序为草本植物→灌木→乔木，起点保留土壤条件，演替速度比初生演替快。","人类活动对群落演替的影响：人类活动往往使群落演替按照不同于自然演替的方向和速度进行。","调查土壤中小动物类群丰富度：用取样器取样法采集，统计方法有记名计算法和目测估计法。"],"3|2":["生态系统概念：在一定空间内，生物群落与它的非生物环境相互作用而形成的统一整体。","生态系统的组成成分：非生物的物质和能量、生产者、消费者、分解者；生产者是生态系统的主要成分。","生产者是自养生物（绿色植物、硝化细菌等），分解者是腐生的细菌、真菌等，消费者包括植食性、肉食性和杂食性动物。","食物链的起点是生产者，终点是最高营养级，食物链中不包括分解者和非生物成分，一般不超过5个营养级。","营养级：处于食物链某一环节上的全部生物的总和，同一种生物可因食物不同而占据不同的营养级。","能量流动的起点是生产者固定的太阳能，流经生态系统的总能量是生产者固定的太阳能总量。","能量流动的特点：单向流动、逐级递减，相邻两个营养级之间的传递效率约为10%至20%。","某一营养级同化量的去向：呼吸作用散失、流入下一营养级、流向分解者以及未被利用的部分。","摄入量等于同化量加粪便量，粪便中的能量属于上一营养级同化量的一部分。","能量金字塔不会倒置，数量金字塔和生物量金字塔在特殊情况下可以倒置。","碳循环：大气中的CO2通过光合作用（或化能合成作用）进入生物群落，通过呼吸作用、分解作用和化石燃料燃烧返回大气。","物质循环的特点：物质可以在生物群落与非生物环境之间反复利用、循环流动，具有全球性。","信息传递的类型：物理信息（光、声、温度）、化学信息（化学物质，如性外激素）、行为信息（如蜜蜂跳舞）。","生态系统的稳定性：抵抗力稳定性与营养结构复杂程度正相关，负反馈调节是生态系统自我调节能力的基础，自我调节能力有限。"],"3|3":["人口增长对环境的影响：人均资源占有量减少、环境压力增大，人口问题是造成环境问题的重要原因。","全球性生态环境问题：全球气候变化、水资源短缺、臭氧层破坏、土地荒漠化、生物多样性丧失和环境污染。","温室效应：CO2等温室气体排放过多导致全球气温升高，应对措施是减少化石燃料燃烧、植树造林等。","臭氧层破坏：氟氯烃等物质排放使臭氧层变薄，到达地面的紫外线增强，危害人体健康和生态系统。","生物多样性的三个层次：基因多样性（遗传多样性）、物种多样性和生态系统多样性。","生物多样性的价值：直接价值（食用、药用、工业原料、观赏）、间接价值（保持水土、调节气候等生态功能）、潜在价值。","生物多样性丧失的原因：栖息地破坏和丧失（最主要）、掠夺式开发利用、外来物种入侵、环境污染。","保护生物多样性的措施：就地保护（建立自然保护区，最有效）、易地保护、建立精子库和种子库、制定法律法规。","外来物种入侵：外来物种缺乏天敌制约而迅速繁殖，破坏本地生态平衡，如水葫芦、薇甘菊的泛滥。","生态足迹：维持某一人口单位生存所需的生产资源和吸纳废物的土地及水域面积，生态足迹越大对环境的影响越大。","可持续发展：在不牺牲未来几代人需要的情况下满足当代人的需要，强调自然、经济、社会的协调发展。","生态农业：运用物质循环再生和能量多级利用的原理，如桑基鱼塘、沼气工程，实现资源的高效利用。"],"3|4":["传统发酵技术：利用微生物的代谢活动生产产品，如果酒（酵母菌）、果醋（醋酸菌）、泡菜（乳酸菌）、腐乳（毛霉等）。","果酒制作：酵母菌是兼性厌氧微生物，18至30℃条件下先通气促进繁殖，再密封进行无氧呼吸产生酒精和CO2。","果醋制作：醋酸菌是好氧细菌，30至35℃条件下始终通气，糖源充足时直接产醋酸，糖源不足时乙醇先变乙醛再变醋酸。","泡菜制作：乳酸菌是厌氧细菌，无氧条件下将葡萄糖分解为乳酸，腌制坛需密封并用水封，注意亚硝酸盐含量。","培养基的成分：水、碳源（如糖类）、氮源（如蛋白质）、无机盐，有的还需加入特殊营养物质和琼脂。","培养基的种类：按物理性质分为液体培养基和固体培养基；按用途分为选择培养基和鉴别培养基。","无菌技术：消毒（煮沸、巴氏消毒、化学药剂消毒）是杀死部分微生物，灭菌（灼烧、干热、高压蒸汽）是杀死所有微生物。","微生物的纯化培养：平板划线法和稀释涂布平板法均可分离纯化微生物，稀释涂布平板法还可用于活菌计数。","微生物计数：稀释涂布平板法统计的是活菌数目（结果偏小），显微镜直接计数法计数包括死菌（结果偏大）。","土壤中分解尿素的细菌的分离：用尿素作为唯一氮源的选择培养基培养，细菌合成脲酶将尿素分解为氨。","发酵工程的环节：菌种的选育→扩大培养→配制培养基和灭菌→接种→发酵罐内发酵→产品的分离提纯。","发酵罐中需控制的条件：温度、pH、溶解氧、搅拌转速等，如青霉素发酵采用通气搅拌方式。","发酵工程的应用：食品工业（酱油、醋、味精、柠檬酸）、医药工业（青霉素、胰岛素）、化工原料生产等。"],"3|5":["植物细胞工程的理论基础是细胞全能性，即已分化的细胞仍具有发育成完整生物体的潜能。","植物组织培养流程：外植体→脱分化形成愈伤组织→再分化形成根和芽→移栽成完整植株。","植物组织培养条件：无菌环境、适宜的温度和光照，培养基中加入生长素和细胞分裂素等植物激素。","脱分化：已分化的细胞失去特有的结构和功能，转变为未分化的愈伤组织；再分化是愈伤组织重新分化出根和芽。","植物体细胞杂交：用纤维素酶和果胶酶去除细胞壁，原生质体经物理（电激）或化学（聚乙二醇）方法融合，再再生细胞壁并培养。","植物体细胞杂交的意义：克服远缘杂交不亲和的障碍，如培育出番茄—马铃薯杂种植株。","植物细胞工程的应用：微型繁殖、作物脱毒（选取茎尖）、人工种子、培育突变体和利用植物细胞培养生产药物。","动物细胞培养条件：无菌无毒的环境、加入血清等天然成分、适宜温度（36.5±0.5℃）、pH为7.2至7.4。","动物细胞培养的气体环境：95%空气和5%的CO2，其中CO2的主要作用是维持培养液的pH。","动物细胞培养过程：取动物组织→剪碎→用胰蛋白酶或胶原蛋白酶处理分散成单个细胞→原代培养→传代培养。","原代培养与传代培养：细胞培养至10代以内遗传物质不发生改变，传至50代后部分细胞发生癌变获得不死性。","动物细胞融合的方法：聚乙二醇（PEG）融合法、电融合法、灭活病毒（如仙台病毒）诱导法。","单克隆抗体制备：骨髓瘤细胞与B淋巴细胞融合，经HAT培养基筛选出杂交瘤细胞，再经克隆化培养和抗体检测筛选出能产生特定抗体的杂交瘤细胞。","单克隆抗体的特点和应用：特异性强、灵敏度高、可大量制备，用于诊断疾病和制成生物导弹治疗癌症。"],"3|6":["基因工程概念：按照人们的愿望进行严格的设计，通过体外DNA重组和转基因等技术，赋予生物新的遗传特性。","限制酶（限制性内切核酸酶）：能够识别双链DNA分子的特定核苷酸序列，并在特定位点切割磷酸二酯键。","限制酶切割DNA可产生黏性末端或平末端；DNA连接酶能连接DNA片段，恢复磷酸二酯键。","常用的载体：质粒（能自我复制的环状DNA分子）、噬菌体和动植物病毒，载体需有标记基因和多个限制酶切点。","基因工程的基本操作程序：目的基因的筛选与获取→基因表达载体的构建→将目的基因导入受体细胞→目的基因的检测与鉴定。","基因表达载体的组成：目的基因、启动子、终止子和标记基因，启动子是RNA聚合酶识别和结合的部位。","目的基因的获取方法：从基因文库中获取、利用PCR技术扩增、通过化学方法人工合成。","PCR技术原理：DNA半保留复制，过程为变性（高温使DNA解旋）、复性（引物与模板结合）、延伸（耐高温的Taq酶催化合成）。","目的基因导入受体细胞的方法：植物用农杆菌转化法（利用Ti质粒）、基因枪法，动物用显微注射法，微生物用感受态细胞法。","目的基因的检测与鉴定：DNA分子杂交检测是否导入，分子杂交检测是否转录出mRNA，抗原—抗体杂交检测是否翻译出蛋白质。","基因工程的应用：抗虫棉（导入Bt毒蛋白基因）、转基因抗病植物、乳腺生物反应器生产药物、基因工程胰岛素、基因治疗。","蛋白质工程：以蛋白质分子的结构规律及其与生物功能的关系为基础，通过基因修饰或基因合成对现有蛋白质进行改造。","蛋白质工程的基本途径：从预期功能出发设计蛋白质结构→推测氨基酸序列→找到并改造基因→表达出新的蛋白质。"],"3|7":["胚胎工程：对动物早期胚胎或配子进行的显微操作和处理技术，包括体外受精、胚胎移植、胚胎分割和胚胎干细胞培养等。","精子获能：精子在雌性生殖道中（或体外获能液中）获得受精能力；卵母细胞需培养至减数第二次分裂中期（MⅡ期）才成熟。","体外受精过程：采集卵母细胞→体外培养成熟→与获能精子在体外受精→受精卵移入发育培养液中继续培养。","早期胚胎培养液成分：水、无机盐、有机盐、维生素、激素、氨基酸、核苷酸以及血清等。","胚胎移植：将早期胚胎移植到同种的、生理状态相同的雌性动物体内，使其继续发育为新个体的技术。","胚胎移植的生理基础：供体和受体同期发情，受体对移入的胚胎基本不发生免疫排斥反应，胚胎的遗传特性不受受体影响。","胚胎移植的意义：充分发挥雌性优良个体的繁殖潜力，缩短育种周期，提高繁殖效率。","胚胎分割：用分割针或分割刀将桑葚胚或囊胚（分割囊胚时须将内细胞团均等分割）分割成2等份、4等份等。","胚胎分割属于无性繁殖，分割产生的后代具有相同的遗传物质，性别相同。","胚胎干细胞：来源于早期胚胎或原始性腺，具有全能性，可诱导分化形成各种组织细胞。","转基因生物的安全性争论：涉及食物安全（过敏原、营养成分改变）、生物安全（基因漂移）和环境安全等问题。","伦理问题：中国政府禁止生殖性克隆人，不反对治疗性克隆研究；试管婴儿属于有性生殖，克隆动物属于无性生殖。"],"4|0":["总光合速率等于净光合速率加呼吸速率，净光合速率可用CO2吸收量、O2释放量或有机物积累量表示。","呼吸速率在黑暗条件下测定，测CO2释放量或O2吸收量；净光合速率在光照条件下测定。","光补偿点：光合速率等于呼吸速率时的光照强度，此时净光合速率为零，有机物无积累。","光饱和点：光合速率不再随光照强度增大而增大的最低光照强度，此后限制因素主要是CO2浓度和温度。","探究光照强度对光合作用影响时用黑纸片遮光设置梯度，探究CO2浓度影响时可用不同浓度的NaHCO3溶液。","夏季中午光合午休：气孔部分关闭，CO2供应不足，暗反应减慢，光合速率下降。","密闭装置中气体变化分析：光合速率大于呼吸速率时O2增加、CO2减少，反之则相反。","绿叶中色素的提取和分离：用无水乙醇提取色素，用层析液分离，滤纸条上出现四条色素带。","色素的功能：叶绿素主要吸收红光和蓝紫光，类胡萝卜素主要吸收蓝紫光，光合作用吸收可见光。","化能合成作用：硝化细菌等利用氧化无机物释放的能量将CO2和H2O合成有机物，属于自养生物。","同位素标记法的应用：鲁宾和卡门证明光合作用释放的O2来自水，卡尔文用14CO2探明暗反应碳的转移途径。"],"4|1":["遗传系谱图分析步骤：先判断显隐性（无中生有为隐性、有中生无为显性），再判断基因位于常染色体还是X染色体。","判断基因位置的口诀：隐性遗传看女病，其父亲或儿子正常则为常染色体隐性遗传；显性遗传看男病，其母亲或女儿正常则为常染色体显性遗传。","伴X染色体隐性遗传：男性患者多于女性，交叉遗传，女患者的父亲和儿子一定患病。","伴X染色体显性遗传：女性患者多于男性，连续遗传，男患者的母亲和女儿一定患病。","人类遗传病类型：单基因遗传病（白化病、红绿色盲、抗维生素D佝偻病）、多基因遗传病（青少年型糖尿病）、染色体异常遗传病。","染色体异常遗传病实例：21三体综合征（多一条21号染色体）、猫叫综合征（5号染色体部分缺失）。","遗传病的调查：调查遗传病的发病率在人群中随机调查，调查遗传方式在患者家系中进行。","遗传病的监测和预防：遗传咨询、产前诊断（羊水检查、B超检查、基因检测），基因治疗将正常基因导入有缺陷的细胞。","概率计算注意：已出生的孩子不影响亲本基因型的判断，计算时注意条件概率和性别比例。","分解组合法：多对相对性状分别分析概率，再利用乘法原理组合，用于自由组合定律的概率计算。"],"4|2":["可遗传变异的来源：基因突变、基因重组和染色体变异，遗传物质发生改变并能遗传给后代。","基因突变是生物变异的根本来源，基因重组是生物变异的重要来源，主要发生在有性生殖过程中。","杂交育种：原理是基因重组，通过杂交和连续自交选育纯合子，操作简单但育种年限较长。","诱变育种：原理是基因突变，利用物理或化学因素提高突变频率，能产生新性状但需大量筛选。","单倍体育种：花药离体培养获得单倍体植株，再用秋水仙素处理使染色体加倍，能明显缩短育种年限。","多倍体育种：用秋水仙素或低温处理萌发的种子或幼苗，抑制纺锤体形成，使染色体数目加倍。","无子西瓜培育：用四倍体与二倍体杂交获得三倍体，三倍体减数分裂联会紊乱，不能形成正常配子，不产生种子。","无子番茄：用生长素或生长素类似物处理未受粉的雌蕊子房发育而成，遗传物质未改变，属于不可遗传变异。","基因工程育种：原理是基因重组，能定向改造生物性状，克服远缘杂交不亲和的障碍。","秋水仙素的作用机理：抑制细胞分裂时纺锤体的形成，染色体复制后细胞不能分裂，导致染色体数目加倍。"],"4|3":["神经—体液—免疫调节网络是机体维持内环境稳态的主要调节机制。","下丘脑的功能：体温调节中枢、水盐平衡调节中枢、血糖调节中枢，并能分泌促激素释放激素和抗利尿激素。","分级调节：下丘脑分泌促激素释放激素作用于垂体，垂体分泌促激素作用于靶腺体，如甲状腺激素的分泌调节。","反馈调节：负反馈使激素含量维持相对稳定，如甲状腺激素对下丘脑和垂体的抑制；正反馈如分娩时催产素的作用。","抗利尿激素由下丘脑合成、垂体释放，促进肾小管和集合管对水的重吸收，减少尿量。","寒冷环境中的体温调节：皮肤血管收缩减少散热、骨骼肌战栗增加产热、甲状腺激素和肾上腺素分泌增多。","炎热环境中的体温调节：皮肤血管舒张、汗液分泌增多以增加散热，主要依靠神经调节完成。","血糖调节中枢位于下丘脑，胰岛素、胰高血糖素和肾上腺素共同参与血糖平衡的调节，属于神经—体液调节。","激素作用的特点：微量高效、通过体液运输、只作用于靶器官和靶细胞，发挥作用后被灭活。","免疫系统的功能：免疫防御、免疫自稳和免疫监视，与神经调节和体液调节共同维持机体的稳态。"],"4|4":["食物链的书写：起点是生产者，终点是最高营养级，箭头指向捕食者，表示能量流动的方向。","营养级的判断：生产者是第一营养级，初级消费者是第二营养级，次级消费者是第三营养级，依次类推。","能量流动的分析：同化量等于摄入量减去粪便量，粪便中的能量属于上一营养级同化量的一部分。","某营养级同化量的去向：呼吸作用消耗、流入下一营养级、流向分解者和未利用的部分。","能量传递效率：相邻两个营养级之间同化量的比值，约为10%至20%，计算最少消耗按20%、最多消耗按10%。","能量金字塔：各营养级的能量由低到高递减，不会倒置；数量金字塔在特殊情况下可以倒置。","生物富集：不易分解的有害物质（如重金属、DDT）沿食物链逐渐积累，营养级越高浓度越高。","食物网中数量变化分析：捕食者减少，被捕食者先增加后减少并趋于稳定；被捕食者减少，捕食者随之减少。","流经生态系统的总能量是生产者固定的太阳能总量，生态系统中能量的最终来源是太阳能。","研究能量流动的意义：帮助人们科学规划、合理调整能量流动关系，使能量持续高效地流向对人类最有益的部分。"],"4|5":["实验设计的基本原则：科学性原则、单一变量原则、对照原则和平行重复原则。","实验变量：自变量是人为改变的因素，因变量是随自变量变化而变化的观察指标，无关变量需保持相同且适宜。","对照的类型：空白对照（不进行处理）、自身对照（实验前后自身对比）、条件对照和相互对照。","实验设计的步骤：分组编号→施加处理（控制自变量）→观察记录（测量因变量）→统计分析→得出结论。","探究性实验与验证性实验的区别：探究性实验结果有多种可能需分情况讨论，验证性实验结论是已知的。","实验材料的选择：易获得、易观察、材料本身不影响实验结果，如质壁分离实验选用紫色洋葱鳞片叶外表皮。","预实验的作用：摸清实验条件的大致范围，避免人力物力的浪费，但不能减少实验误差。","结果与结论的表述：用若—则句式分情况讨论，先描述实验结果，再得出实验结论。","经典实验方法：同位素标记法（噬菌体侵染细菌实验）、差速离心法（分离各种细胞器）、荧光标记法（证明细胞膜流动性）。","实验评价的角度：是否设置对照组、变量是否单一、是否进行重复实验、取材是否随机、操作是否规范。"],"4|6":["长句答题的基本结构：原因类用因为—所以表述，依据类用据图可知表述，设计类按操作步骤完整表述。","原因类题目答题思路：先写引起变化的直接原因，再写导致的结果，保证因果关系链条完整。","实验设计类长句模板：取材随机均分→分组编号→对自变量进行处理→观察记录因变量→统计分析得出结论。","遗传题长句表述：写清亲本的基因型和表现型、产生的配子类型、后代的基因型表现型及比例。","曲线图的描述规范：先整体描述变化趋势，再分段描述，并注明起点、拐点、交点和终点等关键点。","区分直接原因与根本原因：如质壁分离的直接原因是细胞失水，根本原因是外界溶液浓度高于细胞液浓度。","生物学术语的规范书写：纺锤体、着丝粒、渗透压、神经递质、抗原呈递等不能写错别字。","答题规范要求：分点作答、序号化、要点化，突出关键词，避免只写结论不写过程。"]}},"toc":{"chinese":{"0":[{"book":"必修上册","units":[{"unit":"第一单元 青春激扬","sections":[{"sec":"1 沁园春·长沙","module":"0|0"},{"sec":"2 立在地球边上放号 / 红烛 / 峨日朵雪峰之侧 / 致云雀","module":"0|0"},{"sec":"3 百合花 / *哦，香雪","module":"0|0"},{"sec":"单元学习任务","module":"0|0"}]},{"unit":"第二单元 劳动光荣","sections":[{"sec":"4 喜看稻菽千重浪——记首届国家最高科技奖获得者袁隆平","module":"1|2"},{"sec":"5 以工匠精神雕琢时代品质","module":"0|4"},{"sec":"6 芣苢 / 插秧歌","module":"0|2"},{"sec":"单元学习任务","module":"0|4"}]},{"unit":"第三单元 生命的诗意","sections":[{"sec":"7 短歌行 / 归园田居（其一）","module":"0|2"},{"sec":"8 梦游天姥吟留别 / 登高 / 琵琶行并序","module":"0|2"},{"sec":"9 念奴娇·赤壁怀古 / 永遇乐·京口北固亭怀古 / 声声慢（寻寻觅觅）","module":"0|2"},{"sec":"单元学习任务","module":"0|2"}]},{"unit":"第四单元 家乡文化生活","sections":[{"sec":"学习活动一：记录家乡的人和物","module":"0|4"},{"sec":"学习活动二：家乡文化生活现状调查","module":"0|4"},{"sec":"学习活动三：参与家乡文化建设","module":"0|4"},{"sec":"单元学习任务","module":"0|4"}]},{"unit":"第五单元 整本书阅读《乡土中国》","sections":[{"sec":"《乡土中国》（费孝通）阅读指导","module":"2|1"},{"sec":"学习任务一：理解学术著作","module":"2|1"},{"sec":"学习任务二：把握核心概念","module":"2|1"},{"sec":"学习任务三：学以致用","module":"2|1"},{"sec":"单元学习任务","module":"2|1"}]},{"unit":"第六单元 学习之道","sections":[{"sec":"10 劝学 / 师说","module":"0|1"},{"sec":"11 反对党八股（节选）","module":"0|4"},{"sec":"12 拿来主义","module":"0|4"},{"sec":"13 读书：目的和前提 / *上图书馆","module":"0|0"},{"sec":"单元学习任务","module":"0|4"}]},{"unit":"第七单元 自然情怀","sections":[{"sec":"14 故都的秋 / *荷塘月色 /* ============ 五级掌握 + 间隔重复复习（艾宾浩斯遗忘曲线） ============ */
let mastery = {};
try { mastery = JSON.parse(localStorage.getItem('hs_mastery2') || '{}'); } catch (e) { mastery = {}; }
/* 迁移旧数据（三级 → 五级） */
try {
  const old = JSON.parse(localStorage.getItem('hs_mastery') || '{}');
  if (old && Object.keys(old).length && !Object.keys(mastery).length){
    for (const k in old){ if (old[k] >= 1) mastery[k] = { lv: old[k] === 2 ? 4 : 2, iv: old[k] === 2 ? 7 : 1, due: Date.now(), reps: 1 }; }
    saveMastery();
  }
} catch (e) {}
const saveMastery = () => { try { localStorage.setItem('hs_mastery2', JSON.stringify(mastery)); } catch (e) {} };
const LV_NAMES = ['', '陌生', '眼熟', '认识', '熟悉', '掌握'];
const DAY = 86400000;
const levelOf = (k) => { const m = mastery[k]; return m && m.lv ? m.lv : 1; };
const countDue = () => { let n = 0; const now = Date.now(); for (const k in mastery) if (mastery[k].due <= now) n++; return n; };
const statsFor = (prefix) => {
  let w = 0, n5 = 0, due = 0; const now = Date.now();
  for (const k in mastery) if (k.startsWith(prefix)) {
    const m = mastery[k];
    w += m.lv / 5;
    if (m.lv >= 5) n5++;
    if (m.due <= now) due++;
  }
  return { w, n5, due };
};
const itemKey = (s, pi, mi, cat, ii) => s.id + '|' + pi + '|' + mi + '|' + cat + '|' + ii;

function setLevel(key, lv){
  const cur = mastery[key] || { lv: 1, iv: 1, due: 0, reps: 0 };
  mastery[key] = { lv, iv: cur.iv || 1, due: Date.now() + (cur.iv || 1) * DAY, reps: (cur.reps || 0) + 1 };
  saveMastery();
}
function cycleLevel(li){
  const key = li.dataset.key;
  if (!key) return;
  const lv = levelOf(key);
  const next = lv >= 5 ? 1 : lv + 1;
  setLevel(key, next);
  li.classList.remove('lv1', 'lv2', 'lv3', 'lv4', 'lv5');
  li.classList.add('lv' + next);
  toast('已标记为「' + LV_NAMES[next] + '」');
  updateProgress(li, key);
  updateReviewBadge();
}
function updateProgress(li, key){
  const parts = key.split('|');
  const mpre = parts.slice(0, 3).join('|') + '|';
  const ppre = parts.slice(0, 2).join('|') + '|';
  const card = li.closest('.module');
  if (card){
    const total = card.querySelectorAll('.item').length;
    const st = statsFor(mpre);
    const mp = $('#mprog-' + parts.slice(0, 3).join('-'));
    if (mp) mp.textContent = (st.n5 ? st.n5 + '✓' : '') + (st.n5 ? ' / ' : '') + total + ' · ★' + (total ? (st.w / total * 5).toFixed(1) : '0');
  }
  const pcard = li.closest('.period');
  if (pcard){
    const pTotal = pcard.querySelectorAll('.item').length;
    const st = statsFor(ppre);
    const pid = pcard.id.slice(2);
    const bar = $('#prog-' + pid);
    const txt = $('#progtxt-' + pid);
    if (bar) bar.style.width = (pTotal ? Math.round(st.w / pTotal * 100) : 0) + '%';
    if (txt) txt.textContent = '已掌握 ' + st.n5 + ' · 待复习 ' + st.due + ' · 共 ' + pTotal;
  }
}

/* ============ 间隔重复复习队列 ============ */
let reviewQueue = [], reviewIdx = 0;
function updateReviewBadge(){
  const n = countDue();
  const b = $('#reviewBadge');
  if (b){ b.textContent = n; b.style.display = n ? 'flex' : 'none'; }
}
function openReview(){
  const now = Date.now();
  reviewQueue = [];
  for (const k in mastery) if (mastery[k].due <= now) reviewQueue.push(k);
  if (!reviewQueue.length){ toast('今日复习已完成 🎉'); return; }
  reviewIdx = 0;
  showReviewItem();
}
function showReviewItem(){
  const key = reviewQueue[reviewIdx];
  if (!key){ hideModal(); toast('今日复习已完成 🎉'); updateReviewBadge(); return; }
  const parts = key.split('|');
  const s = DATA.find((x) => x.id === parts[0]);
  const p = s.periods[Number(parts[1])], m = p.modules[Number(parts[2])];
  const catId = parts[3], ii = Number(parts[4]);
  const c = CATS.find((x) => x.id === catId);
  const text = (m[c.key] || [])[ii] || '';
  const en = (ENRICH[s.id] || {})[parts[1] + '|' + parts[2] + '|' + catId + '|' + ii];
  const lv = levelOf(key);
  $('#modalCard').innerHTML = `
    <div class="modal-top">
      <span class="mt-subj" style="color:${s.color}">🔄 间隔复习 · ${reviewIdx + 1}/${reviewQueue.length}</span>
      <button id="modalClose" class="icon-btn">✕</button>
    </div>
    <div class="mt-crumb">${esc(s.name)} · ${esc(p.period)} · ${esc(m.title)} · ${c.icon}${esc(c.name)} · 当前「${LV_NAMES[lv]}」</div>
    <p class="mt-text">${esc(text)}</p>
    ${en && en.explain ? `<div class="mt-ex"><b>📖 讲解</b>${esc(en.explain)}</div>` : ''}
    <div class="mt-actions">
      <button class="ghost-btn rv-forget">忘记</button>
      <button class="ghost-btn rv-hard">模糊</button>
      <button class="primary-btn rv-good">记住了</button>
    </div>
    <div class="mt-ex" style="margin-top:10px;color:var(--faint);font-size:12px">根据你的回忆效果，系统按艾宾浩斯遗忘曲线自动安排下次复习时间</div>`;
  showModal();
  $('#modalClose').addEventListener('click', hideModal);
  $('#modalCard .rv-forget').addEventListener('click', () => reviewRate(key, 0));
  $('#modalCard .rv-hard').addEventListener('click', () => reviewRate(key, 1));
  $('#modalCard .rv-good').addEventListener('click', () => reviewRate(key, 2));
}
function reviewRate(key, quality){
  const cur = mastery[key] || { lv: 1, iv: 1, reps: 0 };
  let lv = cur.lv, iv = cur.iv || 1;
  if (quality === 0){ lv = Math.max(1, lv - 1); iv = 1; }
  else if (quality === 1){ lv = Math.max(2, lv); iv = Math.max(2, Math.round(iv * 1.5)); }
  else { lv = Math.min(5, lv + 1); iv = Math.min(60, Math.max(3, Math.round(iv * 2))); }
  mastery[key] = { lv, iv, due: Date.now() + iv * DAY, reps: (cur.reps || 0) + 1 };
  saveMastery();
  const msg = quality === 0 ? '已安排 1 天后复习' : quality === 1 ? '下次复习 ' + iv + ' 天后' : '已提升为「' + LV_NAMES[lv] + '」，' + iv + ' 天后复习';
  toast(msg);
  reviewIdx++;
  showReviewItem();
}

/* ============ 统计 ============ */
const countModules = (s) => s.periods.reduce((n, p) => n + p.modules.length, 0);
const countItems = (s) => {
  let n = 0;
  s.periods.forEach((p, pi) => p.modules.forEach((m, mi) => {
    n += CATS.reduce((y, c) => y + (m[c.key] || []).length, 0);
    n += ((TEXTBOOK[s.id] || {})[pi + '|' + mi] || []).length;
  }));
  return n;
};

            INDEX.push({ s, pi, mi, cat: c, text: t, key: itemKey(s, pi, mi, c.id, ii), sName: s.name, sId: s.id, pName: p.period, mTitle: m.title, full: t + ' ' + (en.explain || '') + ' ' + (en.tip || '') });
          });
        });
        ((TEXTBOOK[s.id] || {})[pi + '|' + mi] || []).forEach((t, ii) => {
          INDEX.push({ s, pi, mi, cat: { icon:'📖', name:'课本知识点' }, text: t, key: itemKey(s, pi, mi, 't', ii), sName: s.name, sId: s.id, pName: p.period, mTitle: m.title, full: t });
        });
      });
    });
  });
}

  revealAll();
  updateSidebar();
  try { document.title = '高中全科知识库 · ' + s.name; } catch (e) {}
}

function renderPeriod(s, p, pi){
  const total = p.modules.reduce((n, m) => n + CATS.reduce((x, c) => x + (m[c.key] || []).length, 0), 0);
  const st = statsFor(s.id + '|' + pi + '|');
  const pct = total ? Math.round(st.w / total * 100) : 0;
  const tips = (p.tips || []).map(t => `<span class="tip-chip">💡 ${esc(t)}</span>`).join('');
  const mods = p.modules.map((m, mi) => renderModule(s, p, pi, mi, m)).join('');
  return `
  <section class="period reveal" id="p-${s.id}-${pi}" style="--accent:${s.color}">
    <div class="period-head">
      <h2>${esc(p.period)}</h2>
      ${p.textbook ? `<span class="textbook">📖 ${esc(p.textbook)}</span>` : ''}
    </div>
    ${tips ? `<div class="tips">${tips}</div>` : ''}
    <div class="prog">
      <div class="prog-bar"><i id="prog-${s.id}-${pi}" style="width:${pct}%"></i></div>
      <span class="prog-txt" id="progtxt-${s.id}-${pi}">已掌握 ${st.n5} · 待复习 ${st.due} · 共 ${total}</span>
    </div>
    <div class="modules">${mods}</div>
  </section>`;
}

function renderModule(s, p, pi, mi, m){
  const mpre = s.id + '|' + pi + '|' + mi + '|';
  const total = CATS.reduce((n, c) => n + (m[c.key] || []).length, 0);
  const st = statsFor(mpre);
  const cats = CATS.map((c) => {
    const arr = m[c.key] || [];
    if (!arr.length) return '';
    const items = arr.map((t, ii) => renderItem(s, pi, mi, c, ii, t)).join('');
    return `<section class="cat cat-${c.cls}">
      <h4><span class="chip chip-${c.cls}">${c.icon} ${c.name}</span><em>${arr.length} 条</em></h4>
      <ul>${items}</ul></section>`;
  }).join('');
  const tb = (TEXTBOOK[s.id] || {})[pi + '|' + mi] || [];
  const tbHtml = tb.length ? `<section class="cat cat-book tb-full">
      <h4><span class="chip chip-book">📖 课本知识点</span><em>${tb.length} 条</em></h4>
      <ul>${tb.map((t, ii) => renderItem(s, pi, mi, { id:'t', key:'textbookPoints', name:'课本知识点', icon:'📖', cls:'book' }, ii, t)).join('')}</ul>
    </section>` : '';
  const tbt = total + tb.length;
  return `<article class="module reveal" id="m-${s.id}-${pi}-${mi}" style="--accent:${s.color};--d:${(mi % 6) * 60}ms">
    <header class="m-head">
      <span class="m-num" style="background:${s.color}22;color:${s.color};border-color:${s.color}44">${String(mi + 1).padStart(2, '0')}</span>
      <h3>${esc(m.title)}</h3>
      <span class="m-prog" id="mprog-${s.id}-${pi}-${mi}">${(st.n5 ? st.n5 + '✓' : '') + (st.n5 ? ' / ' : '') + tbt + ' · ★' + (tbt ? (st.w / tbt * 5).toFixed(1) : '0')}</span>
    </header>
    <div class="m-body">${tbHtml}<div class="m-grid">${cats}</div></div>
  </article>`;
}

function renderItem(s, pi, mi, c, ii, t){
  const key = itemKey(s, pi, mi, c.id, ii);
  const lv = levelOf(key);
  const en = (ENRICH[s.id] || {})[pi + '|' + mi + '|' + c.id + '|' + ii];
  const hasDetail = en && (en.explain || en.example || en.tip);
  const detail = hasDetail ? `
    <div class="it-detail">
      ${en.explain ? `<div class="ex"><b>📖 讲解</b><p>${esc(en.explain)}</p></div>` : ''}
      ${en.example ? `<div class="ex ex-eg"><b>✏️ 例题</b><p>${esc(en.example)}</p></div>` : ''}
      ${en.tip ? `<div class="ex ex-tip"><b>⚠️ 易错提醒</b><p>${esc(en.tip)}</p></div>` : ''}
    </div>` : '';
  const more = hasDetail ? `<button class="it-more" tabindex="-1">💡 查看讲解</button>` : '';
  return `<li class="item lv${lv}" data-key="${key}" data-cat="${c.id}">
    <button class="dot" tabindex="-1" aria-hidden="true" title="点击切换掌握度：陌生 → 眼熟 → 认识 → 熟悉 → 掌握"></button>
    <div class="it-body">
      <p class="it-text">${esc(t)}</p>
      ${more}
      ${detail}
    </div>
  </li>`;
}

/* ============ 搜索 ============ */
const searchInput = $('#searchInput');
const searchPanel = $('#searchPanel');
let searchTimer = null;
searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 140); });
searchInput.addEventListener('focus', doSearch);
function hideSearch(){ searchPanel.classList.add('hidden'); }
function hl(text, q){
  const t = esc(text);
  const safe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return t.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
}
function doSearch(){
  const q = searchInput.value.trim();
  if (!q){ hideSearch(); return; }
  const ql = q.toLowerCase();
  const hits = INDEX.filter((it) =>
    it.full.toLowerCase().includes(ql) ||
    it.text.toLowerCase().includes(ql) ||
    it.sName.toLowerCase().includes(ql) ||
    it.pName.toLowerCase().includes(ql)
  ).slice(0, 120);
  const groups = new Map();
  hits.forEach((h) => { if (!groups.has(h.sId)) groups.set(h.sId, []); groups.get(h.sId).push(h); });
  let html = '';
  for (const s of DATA){
    const arr = groups.get(s.id);
    if (!arr) continue;
    html += `<div class="sg"><div class="sg-head"><span style="color:${s.color}">${s.icon} ${esc(s.name)}</span><em>${arr.length} 条</em></div>`;
    html += arr.map((h) => `<button class="search-item" data-s="${h.sId}" data-pi="${h.pi}" data-mi="${h.mi}">
      <span class="si-crumb">${esc(h.pName)} · ${esc(h.mTitle)} · ${h.cat.icon}${esc(h.cat.name)}</span>
      <span class="si-text">${hl(h.text, q)}</span></button>`).join('');
    html += '</div>';
  }
  searchPanel.innerHTML = html || '<div class="sg-empty">未找到相关内容，换个关键词试试～</div>';
  searchPanel.classList.remove('hidden');
}
function jumpTo(d){
  hideSearch();
  searchInput.value = '';
  closeGraph();
  openSubject(d.s);
  setTimeout(() => {
    const el = document.getElementById('m-' + d.s + '-' + d.pi + '-' + d.mi);
    if (el){
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 2000);
    }
  }, 120);
}

function revealAll(){
  const io = new IntersectionObserver((es) => {
    es.forEach((en) => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold: .06 });
  $$('.reveal').forEach((el) => io.observe(el));
}
function runCountUp(els){
  els.forEach((el) => {
    const target = parseInt(el.dataset.count, 10);
    if (!(target >= 0)) return;
    const dur = 1200, t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
let typeTimer = null;
let ti = 0, ci = 0, deleting = false;
function startTyping(){
  const el = $('#typeText');
  if (!el) return;
  stopTyping();
  typeTimer = setInterval(() => {
    const phrase = PHRASES[ti];
    el.textContent = phrase.slice(0, ci);
    if (!deleting){
      if (ci < phrase.length) ci++;
      else deleting = true;
    } else {
      if (ci > 0) ci--;
      else { deleting = false; ti = (ti + 1) % PHRASES.length; }
    }
  }, deleting ? 36 : 85);
}

function bindTilt(cards){
  if (window.matchMedia('(pointer:coarse)').matches) return;
  cards.forEach((card) => {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = 'perspective(900px) rotateX(' + (-y * 7).toFixed(2) + 'deg) rotateY(' + (x * 9).toFixed(2) + 'deg) translateY(-4px)';
      card.style.setProperty('--mx', (x * 100 + 50) + '%');
      card.style.setProperty('--my', (y * 100 + 50) + '%');

  });
}

      ctx.quadraticCurveTo(p.x + sway, p.y - p.h * .6, p.x + sway * 1.6, p.y - p.h);
      ctx.stroke();
      ctx.lineWidth = 1.3;
      const lx = p.x + sway * 1.3, ly = p.y - p.h * .62;
      for (let i = 0; i < 3; i++){
        const ang = -1.2 - i * .5, len = 16 + i * 4;
        ctx.save(); ctx.translate(lx, ly + i * 8); ctx.rotate(ang + Math.sin(t * .002 + i) * .12);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * .6, -4, len, 0);
        ctx.stroke(); ctx.restore();
      }
    } else if (p.t === 'stroke'){
      p.y -= p.sp;
      if (p.y < -80){ p.y = H + 60; p.x = Math.random() * W; }
      ctx.strokeStyle = ink(p.a); ctx.lineWidth = 2.4;

      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(p.x + Math.sin(t * .001 + p.x) * 8, p.y + p.len * .5, p.x, p.y + p.len);
      ctx.stroke();
    } else if (p.t === 'poem'){
      p.y -= .02;
      if (p.y < -60){ p.y = H + 40; }
      ctx.font = 'bold ' + p.fs + 'px "Kaiti SC","STKaiti","Noto Serif SC",serif';
      ctx.fillStyle = ink(p.a);
      ctx.fillText(p.s, p.x, p.y);
    } else if (p.t === 'brush'){
      p.y -= p.sp; p.x += Math.sin(t * .001 + p.y * .01) * .3;
      if (p.y < -100){ p.y = H + 80; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(.42);
      ctx.strokeStyle = ink(p.a); ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(30, 92); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(30, 92); ctx.lineTo(42, 86); ctx.lineTo(34, 102); ctx.closePath();
      ctx.fillStyle = ink(p.a + .06); ctx.fill();
      ctx.restore();
    } else if (p.t === 'compass'){
      p.r = (p.r || 0) + .0012;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.strokeStyle = indigo(p.a); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, p.rr, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(p.rr, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, p.rr); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, 6.283); ctx.fillStyle = indigo(p.a + .06); ctx.fill();
      ctx.restore();
    } else if (p.t === 'pen'){
      p.y += p.vy;
      if (p.y < -60){ p.y = H + 40; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(t * .0012 + p.ph) * .3);
      ctx.strokeStyle = indigo(p.a + .05); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-16, 6); ctx.lineTo(14, -6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14, -6); ctx.lineTo(20, -2); ctx.lineTo(12, 0); ctx.closePath();
      ctx.fillStyle = indigo(p.a + .08); ctx.fill();
      ctx.restore();
    } else if (p.t === 'spring'){
      const bobY = p.y + p.len + Math.sin(t * .0018 + p.ph) * 18;
      ctx.strokeStyle = ink(p.a); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      let yy = p.y, dir = 1;
      while (yy < bobY - 8){ yy += 6; ctx.lineTo(p.x + dir * 6, yy); dir *= -1; }
      ctx.lineTo(p.x, bobY);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, bobY, 5, 0, 6.283); ctx.fillStyle = ink(p.a + .07); ctx.fill();
    } else if (p.t === 'tube'){
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.strokeStyle = ink(p.a + .06); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-24, 12); ctx.lineTo(24, 12); ctx.stroke();
      const cols = ['rgba(166,58,43,.35)', jade(p.a + .12), 'rgba(196,122,40,.35)'];
      for (let i = -1; i <= 1; i++){
        const tx = i * 16;
        const lvl = 12 + ((t * .4 + (i + 1) * 9) % 24);
        ctx.beginPath(); ctx.moveTo(tx - 4, -32); ctx.lineTo(tx - 4, 8); ctx.lineTo(tx + 4, 8); ctx.lineTo(tx + 4, -32); ctx.stroke();
        ctx.fillStyle = cols[i + 1];
        ctx.fillRect(tx - 4, 8 - lvl, 8, lvl);
        ctx.beginPath(); ctx.ellipse(tx, -32, 5, 1.6, 0, 0, 6.283); ctx.stroke();
      }
      ctx.restore();
    } else if (p.t === 'flower'){
      const sway = Math.sin(t * .0015 + p.ph) * 3;
      ctx.strokeStyle = jade(p.a); ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(p.x + sway, p.y - p.len * .5, p.x + sway, p.y - p.len);
      ctx.stroke();
      ctx.save(); ctx.translate(p.x + sway, p.y - p.len);
      const cols = ['rgba(166,58,43,.42)', 'rgba(217,131,36,.42)', 'rgba(166,58,43,.34)'];
      for (let i = 0; i < 5; i++){
        ctx.rotate(6.283 / 5);
        ctx.beginPath(); ctx.ellipse(0, -4.5, 3.2, 4.8, 0, 0, 6.283);
        ctx.fillStyle = cols[i % 3]; ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, 6.283); ctx.fillStyle = '#d98324'; ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(p.x + sway * .4, p.y - p.len * .55); ctx.rotate(.5);
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, 6.283); ctx.fillStyle = jade(p.a + .06); ctx.fill();
      ctx.restore();
    } else if (p.t === 'seal'){
      const s = 30 * (1 + .05 * Math.sin(t * .002));
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.fillStyle = 'rgba(166,58,43,.5)';
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.fillStyle = '#f6f1e6';
      ctx.font = 'bold ' + s * .6 + 'px "Kaiti SC","STKaiti",serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('文', 0, s * .06);
      ctx.restore();
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    } else if (p.t === 'grid'){
      ctx.strokeStyle = acc(p.alpha); ctx.lineWidth = 1;
      const step = 60;
      const ox = (mx - W / 2) * .05 % step, oy = (my - H / 2) * .05 % step;
      for (let x = ox; x < W; x += step){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = oy; y < H; y += step){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    } else if (p.t === 'sin'){
      ctx.strokeStyle = indigo(p.alpha + .05); ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8){
        const y = p.y0 + Math.sin(x * .008 + t * .0005) * p.amp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    } else if (p.t === 'para'){
      ctx.strokeStyle = indigo(p.alpha + .04); ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let x = -W * .4; x <= W * .4; x += 6){
        const y = p.y0 + (x * x) / (W * .22);
        x === -W * .4 ? ctx.moveTo(p.x0 + x, y) : ctx.lineTo(p.x0 + x, y);
      }
      ctx.stroke();
    } else if (p.t === 'geo'){
      p.r += p.vr; p.x += p.vx; p.y += p.vy;
      if (p.x < -60 || p.x > W + 60) p.vx *= -1;
      if (p.y < -60 || p.y > H + 60) p.vy *= -1;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.strokeStyle = acc(p.a); ctx.lineWidth = 1.2;
      ctx.beginPath();
      if (p.k === 0) ctx.arc(0, 0, p.s, 0, 6.283);
      else if (p.k === 1){ ctx.moveTo(-p.s, p.s * .8); ctx.lineTo(p.s, p.s * .8); ctx.lineTo(0, -p.s); ctx.closePath(); }
      else ctx.rect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.stroke();
      ctx.restore();
    } else if (p.t === 'txt' || p.t === 'word'){
      p.x += p.vx; p.y += p.vy;
      if (p.x < -140) p.x = W + 70;
      if (p.x > W + 140) p.x = -70;
      if (p.y < -60){ p.y = H + 40; }
      if (p.y > H + 60){ p.y = -40; }
      ctx.font = (p.fs || 16) + 'px "Kaiti SC","STKaiti","Noto Serif SC",serif';
      ctx.fillStyle = p.t === 'word' ? indigo(p.a) : acc(p.a);
      ctx.fillText(p.s, p.x, p.y);
    } else if (p.t === 'page'){
      p.y += p.vy; p.rot += .0012;
      if (p.y < -120){ p.y = H + 80; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(t * .001 + p.x) * .2 + p.rot * .3);
      ctx.strokeStyle = ink(p.a + .04); ctx.lineWidth = 1.1;
      ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
      for (let i = 1; i <= 3; i++){
        ctx.beginPath(); ctx.moveTo(-p.w / 2 + 5, -p.h / 2 + i * p.h / 4);
        ctx.lineTo(p.w / 2 - 5, -p.h / 2 + i * p.h / 4); ctx.stroke();
      }
      ctx.restore();
    } else if (p.t === 'let'){
      p.y += p.vy;
      if (p.y < -50){ p.y = H + 40; p.x = Math.random() * W; }
      ctx.font = 'italic ' + p.fs + 'px Georgia,serif';
      ctx.fillStyle = ink(p.a); ctx.fillText(p.ch, p.x, p.y);
    } else if (p.t === 'globe'){
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.strokeStyle = indigo(p.alpha + .05); ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .38, 0, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-p.r, 0); ctx.lineTo(p.r, 0); ctx.stroke();
      ctx.restore();
    } else if (p.t === 'atom'){
      p.x += p.vx; p.y += p.vy;
      if (p.x < -60 || p.x > W + 60) p.vx *= -1;
      if (p.y < -60 || p.y > H + 60) p.vy *= -1;
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.strokeStyle = acc(p.a); ctx.lineWidth = 1;
      for (let i = 0; i < 2; i++){
        ctx.save(); ctx.rotate(t * .0012 * (i % 2 ? 1 : -1) + i * 2.1);
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .4, 0, 0, 6.283); ctx.stroke();
        const ex = Math.cos(t * .002 + i * 3.14) * p.r, ey = Math.sin(t * .002 + i * 3.14) * p.r * .4;
        ctx.beginPath(); ctx.arc(ex, ey, 1.8, 0, 6.283);
        ctx.fillStyle = acc(p.a + .16); ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0, 0, 2.8, 0, 6.283);
      ctx.fillStyle = acc(p.a + .12); ctx.fill();
      ctx.restore();
    } else if (p.t === 'pendulum'){
      const ang = Math.sin(t * .0016 + p.ph) * .5;
      const bx = p.x + Math.sin(ang) * p.len, by = p.y + Math.cos(ang) * p.len;
      ctx.strokeStyle = ink(p.alpha); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(bx, by); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.283); ctx.fillStyle = ink(p.alpha + .05); ctx.fill();
      ctx.beginPath(); ctx.arc(bx, by, 4, 0, 6.283); ctx.fillStyle = ink(p.alpha + .08); ctx.fill();
    } else if (p.t === 'field'){
      ctx.strokeStyle = indigo(p.alpha + .05); ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++){
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.quadraticCurveTo(p.x + i * 22, p.y - 40, p.x + i * 34, p.y - 90);
        ctx.stroke();
      }
    } else if (p.t === 'flask'){
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.strokeStyle = acc(p.alpha + .06); ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-22, -14); ctx.lineTo(-22, 26); ctx.lineTo(-34, 56);
      ctx.lineTo(34, 56); ctx.lineTo(22, 26); ctx.lineTo(22, -14);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-14, -40); ctx.lineTo(-22, -14); ctx.moveTo(14, -40); ctx.lineTo(22, -14); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -40, 5, 0, 6.283); ctx.stroke();
      const g = ctx.createLinearGradient(0, 26, 0, 56);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, jade(p.alpha + .06));
      ctx.fillStyle = g; ctx.fillRect(-33, 26, 66, 30);
      ctx.restore();
    } else if (p.t === 'bubble'){
      p.y += p.vy; p.x += Math.sin(t * .003 + p.y * .05) * .4;
      if (p.y < -20){ p.y = H * .9; p.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.strokeStyle = jade(p.a + .04); ctx.lineWidth = 1; ctx.stroke();
    } else if (p.t === 'molecule'){
      p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = 34;
      const A = (r, c) => { ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fillStyle = c; ctx.fill(); };
      ctx.strokeStyle = ink(p.alpha + .07); ctx.lineWidth = 1.4;
      if (p.kind === 0){
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s, s * .7); ctx.moveTo(0, 0); ctx.lineTo(s, s * .7); ctx.stroke();
        ctx.save(); A(5, 'rgba(166,58,43,.5)'); ctx.restore();
        ctx.save(); ctx.translate(-s, s * .7); A(3.4, ink(.35)); ctx.restore();
        ctx.save(); ctx.translate(s, s * .7); A(3.4, ink(.35)); ctx.restore();
      } else if (p.kind === 1){
        ctx.beginPath(); ctx.moveTo(-s, 0); ctx.lineTo(s, 0); ctx.stroke();
        ctx.save(); A(5, ink(.4)); ctx.restore();
        ctx.save(); ctx.translate(-s, 0); A(3.4, 'rgba(166,58,43,.45)'); ctx.restore();
        ctx.save(); ctx.translate(s, 0); A(3.4, 'rgba(166,58,43,.45)'); ctx.restore();
      } else {
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s);
        ctx.moveTo(0, 0); ctx.lineTo(-s * .8, s * .6); ctx.moveTo(0, 0); ctx.lineTo(s * .8, s * .6); ctx.stroke();
        ctx.save(); A(5, indigo(.5)); ctx.restore();
        ctx.save(); ctx.translate(0, -s); A(3.4, ink(.35)); ctx.restore();
        ctx.save(); ctx.translate(-s * .8, s * .6); A(3.4, ink(.35)); ctx.restore();
        ctx.save(); ctx.translate(s * .8, s * .6); A(3.4, ink(.35)); ctx.restore();
      }
      ctx.restore();
    } else if (p.t === 'mol'){
      p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.strokeStyle = acc(p.a); ctx.lineWidth = 1.1;
      ctx.beginPath();
      for (let i = 0; i <= 6; i++){ const ang = i * 6.283 / 6; const px = Math.cos(ang) * p.r, py = Math.sin(ang) * p.r; i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, p.r * .55, 0, 6.283); ctx.stroke();
      ctx.restore();
    } else if (p.t === 'chem'){
      p.x += (Math.random() - .5) * .1; p.y -= .06;
      if (p.y < -40){ p.y = H + 30; p.x = Math.random() * W; }
      ctx.font = p.fs + 'px "Noto Serif SC","SimSun",serif';
      ctx.fillStyle = jade(p.a + .02);
      ctx.fillText(p.s, p.x, p.y);
    } else if (p.t === 'helix'){
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.strokeStyle = jade(p.alpha + .05); ctx.lineWidth = 1.3;
      const half = p.len / 2, amp = 26;
      ctx.beginPath();
      for (let i = 0; i <= 60; i++){ const yy = i * (p.len / 60) - half; const xx = Math.sin(i * .22 + t * .0012) * amp; i === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy); }
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 60; i++){ const yy = i * (p.len / 60) - half; const xx = Math.sin(i * .22 + t * .0012 + 3.14159) * amp; i === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy); }
      ctx.stroke();
      ctx.lineWidth = .8;
      for (let i = 0; i <= 60; i += 6){
        const yy = i * (p.len / 60) - half;
        const x1 = Math.sin(i * .22 + t * .0012) * amp, x2 = Math.sin(i * .22 + t * .0012 + 3.14159) * amp;
        ctx.beginPath(); ctx.moveTo(x1, yy); ctx.lineTo(x2, yy); ctx.stroke();
      }
      ctx.restore();
    } else if (p.t === 'cell'){
      p.x += p.vx; p.y += p.vy;
      if (p.x < -40 || p.x > W + 40) p.vx *= -1;
      if (p.y < -40 || p.y > H + 40) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.strokeStyle = jade(p.a); ctx.lineWidth = 1.2; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .45, 0, 6.283);
      ctx.fillStyle = jade(p.a + .07); ctx.fill();
    } else if (p.t === 'leaf'){
      p.y += p.vy; p.x += Math.sin(t * .003 + p.ph) * .6;
      if (p.y > H + 30){ p.y = -20; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(t * .002 + p.ph) * .5);
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * .45, 0, 0, 6.283);
      ctx.fillStyle = jade(p.a); ctx.fill();
      ctx.restore();
    } else if (p.t === 'chromo'){
      p.r = (p.r || 0) + p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.strokeStyle = jade(p.a + .05); ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(-9, -9); ctx.lineTo(9, 9); ctx.moveTo(9, -9); ctx.lineTo(-9, 9); ctx.stroke();
      ctx.restore();
    }
  }

  let lastMode = null;
  function step(t){
    ctx.clearRect(0, 0, W, H);
    if (lastMode !== bgMode){ BG = makeParticles(bgMode); curCol = MODE_COLORS[bgMode] || MODE_COLORS.home; lastMode = bgMode; }
    for (const p of BG) drawItem(p, t);
    const wm = SUBJ_WM[bgMode];
    if (wm){
      ctx.save();
      ctx.font = '900 ' + Math.min(W, H) * .24 + 'px "Kaiti SC","STKaiti","Noto Serif SC",serif';
      ctx.fillStyle = ink(.055);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(wm, W * .5, H * .42);
      ctx.restore();
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============ 真实场景背景（渐变天空 · 大气透视 · 自然粒子） ============ */
function initScene(canvas){
  const ctx = canvas.getContext('2d');
  let W, H;
  const resize = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
  resize();
  addEventListener('resize', resize);
  const dark = () => root.dataset.theme === 'dark';
  const darken = (c, k) => c.map((v) => Math.min(255, Math.round(v * k)));
  const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  let mx = W / 2, my = H / 2;
  addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });
  const N = Math.random;
  /* 噪点颗粒纹理（摄影质感） */
  const noiseCanvas = document.createElement('canvas');
  noiseCanvas.width = noiseCanvas.height = 160;
  const nctx = noiseCanvas.getContext('2d');
  const img = nctx.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4){ const v = 110 + Math.floor(N() * 130); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  nctx.putImageData(img, 0, 0);
  const grain = ctx.createPattern(noiseCanvas, 'repeat');
  const SCENES = {
    home: { sky: [[238, 233, 216], [250, 246, 232]], sun: [255, 205, 130] },
    chinese: { sky: [[206, 224, 234], [244, 228, 200], [250, 210, 162]], sun: [255, 196, 128] },
    math: { sky: [[8, 16, 40], [26, 42, 82]], night: true },
    english: { sky: [[20, 46, 74], [92, 82, 118], [230, 182, 136]], sun: [255, 198, 130], sea: true },
    physics: { sky: [[4, 8, 22], [16, 40, 70]], night: true, aurora: true },
    chemistry: { sky: [[32, 20, 12], [80, 48, 22]], glow: [255, 178, 90] },
    biology: { sky: [[170, 216, 198], [226, 243, 204]], sun: [255, 224, 140], meadow: true }
  };
  function skyGrad(mode){
    const s = SCENES[mode] || SCENES.home;
    const stops = s.sky || SCENES.home.sky;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    stops.forEach((c, i) => g.addColorStop(i / Math.max(1, stops.length - 1), rgba(dark() ? darken(c, .32) : c, 1)));
    return g;
  }
  function drawSun(mode){
    const s = SCENES[mode] || SCENES.home;
    if (!s.sun) return;
    const c = dark() ? darken(s.sun, .55) : s.sun;
    const sx = W * .78, sy = H * .28, r = Math.min(W, H) * .07;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 3.4);
    g.addColorStop(0, rgba(c, .5)); g.addColorStop(.35, rgba(c, .15)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(sx - r * 3.4, sy - r * 3.4, r * 6.8, r * 6.8);
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.283);
    ctx.fillStyle = rgba(c, .92); ctx.fill();
  }
  function ridge(yBase, amp1, f1, amp2, f2, t, off, color, alpha){
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10){
      const y = yBase + Math.sin(x * f1 + t * .0002 + off) * amp1 + Math.sin(x * f2 + t * .00015 + off * 2.7) * amp2;
      ctx.lineTo(x, y);
    }

        if (lf.y > H + 20){ lf.y = -20; lf.x = N() * W; }
        ctx.save(); ctx.translate(lf.x, lf.y); ctx.rotate(Math.sin(t * .002 + lf.ph) * .6);
        ctx.beginPath(); ctx.ellipse(0, 0, lf.r, lf.r * .45, 0, 0, 6.283);
        ctx.fillStyle = rgba(dark() ? [120, 180, 120] : [74, 138, 84], lf.a); ctx.fill();
        ctx.restore();
      }
    }
    if (mode === 'chemistry'){ /* 气泡（化学） */
      for (const b of bubbles){
        b.y -= b.vy; b.x += Math.sin(t * .003 + b.y * .02) * .3;
        if (b.y < H * .3){ b.y = H * .95; b.x = N() * W; }
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283);
        ctx.strokeStyle = rgba(dark() ? [220, 180, 120] : [176, 128, 66], .4); ctx.lineWidth = 1; ctx.stroke();
      }
    }
    if (mode === 'home'){
      for (let i = 0; i < 12; i++){
        const x = ((i * 97 + t * .012) % (W + 40)) - 20, y = ((i * 61 + t * .02) % (H + 40)) - 20;
        ctx.beginPath(); ctx.arc(x, y, 1 + i % 3, 0, 6.283);
        ctx.fillStyle = rgba(dark() ? [210, 205, 190] : [60, 56, 50], .1); ctx.fill();
      }
    }
    drawSubjectEls(mode, t);
    if (mode === 'chinese' || mode === 'biology' || mode === 'english' || mode === 'home') drawForeground();
    drawVignette();
    drawNoise();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

  ['math', '随机变量', 'biology', '遗传'],
  ['math', '计数原理', 'biology', '遗传'],
  ['math', '统计', 'biology', '种群'],

  ['chemistry', '有机化合物基础', 'biology', '组成细胞的分子'],
  ['chemistry', '盐类水解', 'biology', '人体的内环境'],
  ['chemistry', '电化学', 'physics', '恒定电流'],
  ['chemistry', '化学平衡', 'biology', '生态系统'],
  ['physics', '静电场', 'chemistry', '原子结构']
];
const GRAPH = { nodes: [], edges: [], scale: 1, tx: 0, ty: 0, built: false, filters: {}, simRaf: null };
const SVGNS = 'http://www.w3.org/2000/svg';

function buildGraph(){
  const nodes = [], edges = [], bySubj = {};
  DATA.forEach((s, si) => {
    bySubj[s.id] = [];
    s.periods.forEach((p, pi) => {
      p.modules.forEach((m, mi) => {
        const items = CATS.reduce((n, c) => n + (m[c.key] || []).length, 0);
        nodes.push({
          id: s.id + '|' + pi + '|' + mi, sid: s.id, si, pi, mi,
          title: m.title, items, r: 5 + Math.min(14, Math.sqrt(items) * 1.35),
          x: 0, y: 0, vx: 0, vy: 0, pinned: false
        });
        bySubj[s.id].push(nodes[nodes.length - 1]);
      });
    });
  });
  for (const arr of Object.values(bySubj))
    for (let i = 0; i < arr.length - 1; i++) edges.push({ s: arr[i], t: arr[i + 1], cross: false });
  const findNode = (sid, kw) => { const arr = bySubj[sid] || []; for (const n of arr) if (n.title.includes(kw)) return n; return null; };
  for (const [a, ka, b, kb] of CROSS_RULES){
    const na = findNode(a, ka), nb = findNode(b, kb);
    if (na && nb && na !== nb) edges.push({ s: na, t: nb, cross: true });
  }
  /* 初始位置：按学科分布在圆环上 */
  const subs = DATA.map((s) => s.id);
  subs.forEach((sid, k) => {
    const arr = bySubj[sid];
    const ang = (k / subs.length) * 6.283;
    const cx = Math.cos(ang) * 260, cy = Math.sin(ang) * 200;
    arr.forEach((n, i) => {
      const a2 = ang + (i / Math.max(1, arr.length)) * 0.9 - 0.45;
      n.x = cx + Math.cos(a2) * 130;
      n.y = cy + Math.sin(a2) * 100;
    });
  });
  return { nodes, edges };
}
function simTick(){
  const N = GRAPH.nodes;
  for (let i = 0; i < N.length; i++){
    for (let j = i + 1; j < N.length; j++){
      const a = N[i], b = N[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 4){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 4; }
      const d = Math.sqrt(d2);
      const f = 2400 / d2;
      const fx = dx / d * f, fy = dy / d * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  for (const e of GRAPH.edges){
    const a = e.s, b = e.t;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    const f = (d - 96) * 0.02;
    const fx = dx / d * f, fy = dy / d * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  for (const n of N){
    n.vx += -n.x * 0.012; n.vy += -n.y * 0.012;
    n.vx *= 0.85; n.vy *= 0.85;
    const sp = Math.hypot(n.vx, n.vy);
    if (sp > 4){ n.vx *= 4 / sp; n.vy *= 4 / sp; }
    if (!n.pinned){ n.x += n.vx; n.y += n.vy; }
  }
}
function renderGraph(){
  const svg = $('#gvSvg');
  svg.innerHTML = '';
  const g = document.createElementNS(SVGNS, 'g');
  g.id = 'gvMain';
  g.setAttribute('transform', 'translate(' + GRAPH.tx + ',' + GRAPH.ty + ') scale(' + GRAPH.scale + ')');
  svg.appendChild(g);
  GRAPH.edgeEls = GRAPH.edges.map((e) => {
    const l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('class', 'gv-edge' + (e.cross ? ' cross' : ''));
    g.appendChild(l);
    return { el: l, e };
  });
  GRAPH.nodeEls = GRAPH.nodes.map((n) => {
    const s = DATA[n.si];
    const ng = document.createElementNS(SVGNS, 'g');
    ng.setAttribute('class', 'gv-node');
    ng.dataset.id = n.id;
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', n.r);
    c.setAttribute('fill', s.color);
    c.setAttribute('fill-opacity', '.88');
    ng.appendChild(c);
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('class', 'gv-label');
    t.setAttribute('y', -(n.r + 9));
    t.textContent = n.title;
    ng.appendChild(t);
    g.appendChild(ng);
    return { el: ng, n };
  });
  updateGraphPositions();
  updateGraphVisibility();
}
function updateGraphPositions(){
  for (const o of GRAPH.nodeEls) o.el.setAttribute('transform', 'translate(' + o.n.x + ',' + o.n.y + ')');
  for (const o of GRAPH.edgeEls){
    o.el.setAttribute('x1', o.e.s.x); o.el.setAttribute('y1', o.e.s.y);
    o.el.setAttribute('x2', o.e.t.x); o.el.setAttribute('y2', o.e.t.y);
  }
}
function updateGraphVisibility(){
  for (const o of GRAPH.nodeEls) o.el.style.display = GRAPH.filters[o.n.sid] === false ? 'none' : '';
  for (const o of GRAPH.edgeEls){
    const sHide = GRAPH.filters[o.e.s.sid] === false, tHide = GRAPH.filters[o.e.t.sid] === false;
    o.el.style.display = (sHide || tHide) ? 'none' : '';
  }
}
function highlightGraph(id){
  for (const o of GRAPH.nodeEls) o.el.classList.remove('hl', 'dim');
  for (const o of GRAPH.edgeEls) o.el.classList.remove('hl');
  if (!id) return;
  const adj = new Set([id]);
  for (const o of GRAPH.edgeEls){
    if (o.e.s.id === id || o.e.t.id === id){ o.el.classList.add('hl'); adj.add(o.e.s.id); adj.add(o.e.t.id); }
  }
  for (const o of GRAPH.nodeEls){
    if (o.n.id === id) o.el.classList.add('hl');
    else if (!adj.has(o.n.id)) o.el.classList.add('dim');
  }
}
function startSim(ms){
  if (GRAPH.simRaf) return;
  const t0 = performance.now();
  const loop = () => {
    simTick();
    updateGraphPositions();
    if (performance.now() - t0 < ms) GRAPH.simRaf = requestAnimationFrame(loop);
    else GRAPH.simRaf = null;
  };
  loop();
}
function stopSim(){ if (GRAPH.simRaf){ cancelAnimationFrame(GRAPH.simRaf); GRAPH.simRaf = null; } }

function openGraph(){

/* 图谱交互 */
(function graphInteractions(){
  const wrap = $('#gvWrap');
  const tip = $('#gvTip');
  let panning = false, px = 0, py = 0;
  let dragNode = null, dragMoved = 0, dx0 = 0, dy0 = 0;
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left - GRAPH.tx, my = e.clientY - rect.top - GRAPH.ty;
    const ns = Math.min(3.2, Math.max(.25, GRAPH.scale * Math.exp(-e.deltaY * .0012)));
    GRAPH.tx += mx - mx * (ns / GRAPH.scale);
    GRAPH.ty += my - my * (ns / GRAPH.scale);
    GRAPH.scale = ns;
    $('#gvMain').setAttribute('transform', 'translate(' + GRAPH.tx + ',' + GRAPH.ty + ') scale(' + GRAPH.scale + ')');
  }, { passive: false });
  wrap.addEventListener('pointerdown', (e) => {
    const nodeG = e.target.closest('.gv-node');
    if (nodeG){
      const n = GRAPH.nodes.find((x) => x.id === nodeG.dataset.id);
      if (n){
        dragNode = n; n.pinned = true;
        dragMoved = 0; dx0 = e.clientX; dy0 = e.clientY;
        stopSim();
        nodeG.setPointerCapture(e.pointerId);
        return;
      }
    }
    panning = true; px = e.clientX; py = e.clientY;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (dragNode){
      const rect = wrap.getBoundingClientRect();
      dragNode.x = (e.clientX - rect.left - GRAPH.tx) / GRAPH.scale;
      dragNode.y = (e.clientY - rect.top - GRAPH.ty) / GRAPH.scale;
      dragMoved = Math.max(dragMoved, Math.hypot(e.clientX - dx0, e.clientY - dy0));
      updateGraphPositions();
      return;
    }
    if (panning){
      GRAPH.tx += e.clientX - px; GRAPH.ty += e.clientY - py;
      px = e.clientX; py = e.clientY;
      $('#gvMain').setAttribute('transform', 'translate(' + GRAPH.tx + ',' + GRAPH.ty + ') scale(' + GRAPH.scale + ')');
    }
  });
  wrap.addEventListener('pointerup', (e) => {
    if (dragNode){
      const n = dragNode;
      dragNode = null;
      n.pinned = false;
      if (dragMoved < 6) jumpTo({ s: n.sid, pi: n.pi, mi: n.mi });
      else startSim(1400);
      return;
    }
    panning = false;
  });
  wrap.addEventListener('pointerover', (e) => {
    const nodeG = e.target.closest('.gv-node');
    if (nodeG){
      const n = GRAPH.nodes.find((x) => x.id === nodeG.dataset.id);
      if (n){
        const s = DATA[n.si];
        highlightGraph(n.id);
        tip.innerHTML = '<b>' + s.icon + ' ' + esc(s.name) + '</b> · ' + esc(s.periods[n.pi].period) + '<br/>' + esc(n.title) + '<br/><span style="color:var(--faint)">' + n.items + ' 条知识点</span>';
        tip.classList.remove('hidden');
        const r = wrap.getBoundingClientRect();
        tip.style.left = Math.min(e.clientX - r.left + 16, r.width - 300) + 'px';
        tip.style.top = Math.max(e.clientY - r.top + 14, 8) + 'px';
      }
    } else {
      highlightGraph(null);
      tip.classList.add('hidden');
    }
  });
})();

document.addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (item){
    if (e.target.closest('.dot') || item.dataset.cat === 't'){ cycleLevel(item); return; }
    item.classList.toggle('open');
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav){
    e.preventDefault();
    if (nav.dataset.nav === 'home') goHome();
    else if (nav.dataset.nav === 'start'){ const g = $('.subj-grid'); if (g) g.scrollIntoView({ behavior: 'smooth' }); }
    return;
  }
  const subj = e.target.closest('[data-subject]');
  if (subj){ openSubject(subj.dataset.subject); return; }
  const gotoMod = e.target.closest('[data-goto-mod]');
  if (gotoMod){ const p = gotoMod.dataset.gotoMod.split('|'); jumpTo({ s: p[0], pi: Number(p[1]), mi: Number(p[2]) }); return; }
  const gotoSubj = e.target.closest('[data-goto-subj]');
  if (gotoSubj){ openSubject(gotoSubj.dataset.gotoSubj); return; }
  const res = e.target.closest('.search-item');
  if (res){ jumpTo(res.dataset); return; }
  if (!e.target.closest('.search-wrap')) hideSearch();
});
$('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) hideModal(); });

/* ============ 键盘 ============ */
addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){ hideSearch(); hideModal(); closeGraph(); }
  if (e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault(); searchInput.focus();
  }
});

/* ============ 启动 ============ */
renderSidebar();
setBgMode('home');
updateReviewBadge();
if (DATA_OK){
  renderHome();
  initScene(document.getElementById('fx'));
} else {
  renderHome();
}
})();
</script>
</body>
