金属盐（Na2SO4等）使蛋白质析出，加水可复原，是可逆物理变化，用于分离提纯；变性：加热、重金属盐、强酸强碱、紫外线使结构破坏，不可逆。","example":"例：豆浆加盐卤点豆腐是盐析；加热使鸡蛋清凝固是变性；重金属盐中毒喝牛奶是让蛋白质变性解毒。","tip":"盐析可逆物理、变性不可逆化学，轻金属盐盐析、重金属盐变性。"},"1|6|e|0":{"explain":"鉴别试剂对应性质：溴水（烯烃加成褪色）；KMnO4（烯烃、乙醇被氧化褪色）；Na（醇、酸放H2）；NaHCO3（只有羧酸放CO2）。用特征反应逐一鉴别。","tip":"区分羧酸与醇用NaHCO3；区分烯烃与烷烃用溴水或KMnO4。"},"1|6|e|1":{"explain":"官能团决定性质：碳碳双键（加成）、羟基（与Na、氧化）、醛基（银镜）、羧基（酸性）、酯基（水解）。写同分异构体按「类别异构→碳链异构→位置异构」有序书写防漏。","example":"例：C4H10有两种（正丁烷、异丁烷）；C4H9Cl有四种（两种丁烷各两种一氯代位置）。","tip":"数同分异构体先列碳链骨架再安官能团位置，防漏防重。"},"1|6|e|2":{"explain":"乙酸乙酯制备要点：浓硫酸作催化剂和吸水剂；饱和Na2CO3溶液三个作用——中和乙酸、溶解乙醇、降低乙酸乙酯溶解度便于分层；导管口在液面上方防倒吸。","example":"例：乙酸乙酯实验中导管口在饱和Na2CO3液面上方，目的是防倒吸；Na2CO3能除乙酸溶乙醇。","tip":"饱和Na2CO3三大作用（中和、溶解、降低溶解度）是必考点。"},"1|6|e|3":{"explain":"检验方法：葡萄糖加新制Cu(OH)2加热有砖红色沉淀，或银镜反应（水浴加热）；淀粉加碘水变蓝；蛋白质加浓硝酸变黄（颜色反应）、灼烧有烧焦羽毛气味。","tip":"葡萄糖检验要「新制Cu(OH)2加加热」，碱性环境不能少。"},"2|0|k|0":{"explain":"ΔH两条计算途径：ΔH=生成物总能量-反应物总能量（能量角度）；ΔH=反应物键能总和-生成物键能总和（键能角度）。ΔH为负放热、为正吸热，单位kJ/mol。","example":"例：H2(g)+Cl2(g)=2HCl(g)中，键能算得ΔH=(436+243)-2×431=-183 kJ/mol，放热。","tip":"能量与键能两个公式方向相反（生成物减反应物、反应物减生成物），别混。"},"2|0|k|1":{"explain":"ΔH符号与反应放吸热对应：放热反应体系能量降低，ΔH为负；吸热反应体系能量升高，ΔH为正。热化学方程式必须写ΔH及其符号、单位。","example":"例：放热反应ΔH为负，如H2燃烧ΔH=-285.8 kJ/mol；吸热反应ΔH为正。","tip":"ΔH负=放热、正=吸热，写热化学方程式ΔH符号不能丢。"},"2|0|k|2":{"explain":"热化学方程式三大规范：必须标状态（s、l、g、aq），不标状态不正确；化学计量数可以是分数；ΔH数值与计量数成正比（系数翻倍ΔH翻倍）。","example":"例：2H2(g)+O2(g)=2H2O(l) ΔH=-571.6 kJ/mol，写成H2(g)+1/2O2(g)=H2O(l) ΔH=-285.8 kJ/mol也正确。","tip":"检查热化学方程式：状态、系数与ΔH对应、ΔH符号三个要点。"},"2|0|k|3":{"explain":"中和热定义：稀溶液中强酸与强碱中和生成1 mol水放出的热量，数值57.3 kJ，离子方程式H++OH-=H2O，ΔH=-57.3 kJ/mol。弱酸弱碱因电离吸热，测得数值不同。","example":"例：H2SO4与NaOH中和生成1 mol水放热57.3 kJ；CH3COOH与NaOH中和放热小于57.3 kJ（电离吸热）。","tip":"中和热是「生成1 mol水」，且只适用于稀的强酸强碱。"},"2|0|k|4":{"explain":"燃烧热定义三个要点：1 mol可燃物、完全燃烧、生成稳定氧化物（H生成H2O(l)、C生成CO2(g)、S生成SO2(g)）。如C燃烧热指生成CO2不是CO。","example":"例：C燃烧热对应C(s)+O2(g)=CO2(g) ΔH=-393.5 kJ/mol；生成CO不是完全燃烧，不算燃烧热。","tip":"燃烧热三要素「1 mol、完全燃烧、稳定产物」，液态水是稳定产物。"},"2|0|k|5":{"explain":"盖斯定律核心：反应热只由始态、终态决定，与中间途径无关。求目标反应ΔH：把已知方程式按需加减（乘系数），对应ΔH同样加减，消去中间物质即可。","example":"例：已知C+O2=CO2 ΔH1，CO+1/2O2=CO2 ΔH2，则C+1/2O2=CO的ΔH=ΔH1-ΔH2。","tip":"盖斯定律运算：方程式加减、ΔH同步加减乘除，中间物质消去。"},"2|0|d|0":{"explain":"燃烧热强调「1 mol可燃物且完全燃烧生成稳定产物」；中和热强调「生成1 mol水」，且稀的强酸强碱。题目常把「2 mol」「生成CO」「弱酸」等作为错误项。","example":"例：2H2(g)+O2(g)=2H2O(l)放热571.6 kJ，燃烧热是285.8 kJ/mol而非571.6 kJ/mol。","tip":"燃烧热除以计量数折算到1 mol，生成稳定氧化物才算。"},"2|0|d|1":{"explain":"弱酸、弱碱电离吸热，中和过程总放热=中和放热-电离吸热，故小于57.3 kJ/mol。浓硫酸稀释放热使测得中和热偏大。判断偏差先想电离与稀释的热效应。","example":"例：CH3COOH与NaOH中和热小于57.3 kJ/mol；NH3·H2O与HCl中和热也小于57.3 kJ/mol。","tip":"弱电解质电离吸热使中和热偏小，浓硫酸稀释放热使偏大。"},"2|0|d|2":{"explain":"三个高频错误：漏写物质状态；ΔH数值与计量数不匹配；可逆反应热化学方程式中ΔH指「按化学计量数完全反应」的热量，不是实际转化量。","example":"例：N2+3H2⇌2NH3 ΔH=-92.4 kJ/mol指1 mol N2完全转化（实际转化率小于100%）放热92.4 kJ。","tip":"可逆反应的ΔH按「完全反应」算，与平衡转化率无关。"},"2|0|d|3":{"explain":"键能是「1 mol化学键」的能量，计算时键的物质的量=物质物质的量×每分子含键数：1 mol CH4含4 mol C-H键、1 mol CO2含2 mol C=O键。","example":"例：CH4燃烧ΔH=(4×E(C-H)+2×E(O=O))-(2×E(C=O)+4×E(O-H))，各键须乘个数。","tip":"键能计算先数「每分子含几根键」，漏乘系数是常见失分点。"},"2|0|e|0":{"explain":"正误判断三步：看状态（s/l/g/aq是否齐全）、看ΔH符号与数值是否与系数对应、看是否为稳定产物。书写时系数可用分数，ΔH随之变化。","tip":"看到「未标状态」或「ΔH与系数不匹配」直接判错。"},"2|0|e|1":{"explain":"步骤：把已知方程式加减组合消去中间产物，ΔH同步运算。注意方程式反向时ΔH变号、乘系数时ΔH同乘。","tip":"盖斯计算「方程式怎么组合，ΔH就怎么组合」，检查中间物是否消净。"},"2|0|e|2":{"explain":"测定中和热装置：保温杯（隔热）、环形玻璃搅拌棒、温度计测温度；记录起始温度与最高温度；酸稍过量保证碱完全反应；多次测量取平均。","tip":"中和热实验防散热：隔热杯、环形搅拌棒、一次倒入快速测温。"},"2|0|e|3":{"explain":"能量图中：生成物能量低于反应物为放热（ΔH为负），高于为吸热；活化能=过渡态能量-反应物能量；催化剂降低活化能，但不改变ΔH。","tip":"催化剂降活化能不改变ΔH，图中ΔH看反应物生成物能量差。"},"2|1|k|0":{"explain":"速率v=Δc/Δt，Δc是浓度变化量（mol/L），Δt是时间。固体、纯液体浓度恒定，不能表示速率；气体和溶液中的物质可以。速率是正值。","example":"例：CaCO3与盐酸反应中不能用v(CaCO3)表示速率，因为CaCO3是固体，浓度视为常数。","tip":"固体、纯液体不表示速率，看到v(固体)即错。"},"2|1|k|1":{"explain":"五因素：增大浓度、升温、加压（气体）、加催化剂、增大接触面积均加快。压强本质是浓度：加压气体浓度增大。","example":"例：锌与浓盐酸反应比稀盐酸快（浓度大）；铁粉比铁片快（接触面积大），说明浓度和接触面积影响速率。","tip":"加压加快只对气体反应成立，本质是气体浓度增大。"},"2|1|k|2":{"explain":"催化剂通过降低活化能同时加快正逆反应速率（同等程度），缩短到达平衡时间，但不改变平衡移动方向、不改变平衡转化率、不改变ΔH。","example":"例：合成氨用铁触媒加快速率，但平衡时NH3含量不变，转化率不变，只是更快达到平衡。","tip":"催化剂「加速不移动」：更快到达平衡，但平衡点与反应热都不变。"},"2|1|k|3":{"explain":"只有活化分子碰撞才反应。升温：分子能量普遍提高，活化分子百分数增大；加催化剂：降低活化能，更多分子变为活化分子；增大浓度：单位体积活化分子数增多。","example":"例：加热使活化分子百分数增大，有效碰撞频率提高，速率加快；催化剂同样增大活化分子百分数。","tip":"升温与催化剂增大「活化分子百分数」，浓度只增「活化分子数目」。"},"2|1|k|4":{"explain":"速率方程v=k·c(A)的m次方·c(B)的n次方中，k是速率常数（温度升高增大），指数m、n由实验测定，与化学计量数无关（只对基元反应等于计量数）。","example":"例：实验测得c(A)加倍速率加倍、c(B)加倍速率不变，则v=k·c(A)，m=1、n=0。","tip":"速率方程指数「由实验定、不等于计量数」，是基础速率题陷阱。"},"2|1|d|0":{"explain":"加压本质是气体浓度增大（体积缩小）。恒容下充入惰性气体：各组分浓度不变，速率不变；恒压下充入惰性气体：容器体积增大，气体浓度减小，速率减小。","example":"例：恒容密闭容器中充入He，N2+3H2⇌2NH3各气体浓度不变，速率不变，平衡不移动。","tip":"恒容充惰气浓度不变速率不变；恒压充惰气体积变大浓度变小。"},"2|1|d|1":{"explain":"催化剂同倍改变正逆速率，v正、v逆同时增大，平衡不移动，转化率不变，但到达平衡时间缩短。图像上表现为曲线更快平直，但平衡点相同。","example":"例：加催化剂后v-t图中正逆速率同时增大且相等，平衡点不变，只是更快达到，转化率也不变。","tip":"图像判断：催化剂使「更快到达且平衡点不变」，区别于升温加压。"},"2|1|d|2":{"explain":"放热反应放热使体系温度升高，速率增大；随反应进行反应物浓度减小，速率又减小。两者竞争：前期升温占主导速率增大，后期浓度占主导速率减小，故速率「先增后减」。","example":"例：锌与盐酸（放热）反应，开始速率增大（温度升高）后减小（盐酸变稀），v-t图先升后降。","tip":"放热反应速率曲线先升后降：升温与浓度消耗的竞争结果。"},"2|1|d|3":{"explain":"换算核心：v(A)/a=v(B)/b=v(C)/c（除以计量数相等）。比较快慢换算到同一物质或比较v/系数；单位先统一（1 min=60 s）。","example":"例：2SO2+O2⇌2SO3中v(SO2)=0.6 mol/(L·min)，则v(O2)=0.3 mol/(L·min)。","tip":"比速率先除以系数再比大小，单位统一是关键。"},"2|1|e|0":{"explain":"速率计算用三段式：起始、变化、平衡，变化量之比等于计量数之比；速率=变化量/时间。比较快慢统一换算：除以计量数后数值大者快。","tip":"三段式变化量按计量数配比，这是速率与平衡计算通用方法。"},"2|1|e|1":{"explain":"控制变量：探究一个因素只改变它，其余条件相同。如探究温度：两组除温度外浓度、体积、试剂都相同，比较现象作结论。","tip":"控制变量题答题模板：只改变X，其他条件相同，比较现象。"},"2|1|e|2":{"explain":"v-t图看变化：速率突变——若正逆速率同增且平衡移动，可能升温或加压；若同增等幅且平衡不移动，是加催化剂或等体反应加压。浓度改变只使某物质相关速率跳变。","tip":"突变分析「同增同减看等幅」：等幅是催化剂或等体加压。"},"2|1|e|3":{"explain":"活化能图：E正=E逆+ΔH（放热时E正大于E逆，ΔH=E正-E逆为负）。催化剂同时降低正逆活化能（降低幅度相同），ΔH不变。","example":"例：放热反应正活化能Ea(正)大于Ea(逆)，ΔH=Ea(正)-Ea(逆)，为负值。","tip":"活化能图求ΔH：正活化能减逆活化能，符号看放吸热。"},"2|2|k|0":{"explain":"对aA+bB⇌cC+dD，K=生成物浓度幂之积除以反应物浓度幂之积，浓度用平衡浓度，指数是计量数。K只随温度改变，不随浓度、压强、催化剂改变。K越大反应进行越完全。","example":"例：对N2+3H2⇌2NH3，K=c(NH3)的2次方除以[c(N2)·c(H2)的3次方]，升温（放热）K减小。","tip":"K的表达式指数是计量数，固体和纯液体不写入表达式。"},"2|2|k|1":{"explain":"Q用任意时刻浓度计算，与K比较判断移动方向：Q小于K正向移动，Q大于K逆向移动，Q等于K平衡。改变浓度后Q变化，体系向Q回归K的方向移动。","example":"例：某时刻Q小于K，说明生成物偏少，平衡正向移动，正反应速率大于逆反应速率，直到Q等于K。","tip":"判断方向「Q对K」：小于正移、大于逆移、等于平衡。"},"2|2|k|2":{"explain":"三段式步骤：列起始量，设转化量为x，按计量数比写各物质转化量，求平衡量；转化率=转化量/起始量×100%；平衡浓度=平衡量/体积。","example":"例：起始1 mol N2、3 mol H2，平衡时N2转化0.5 mol，则转化率50%，平衡c(N2)=0.5/V。","tip":"转化量之比=计量数之比，设x时按计量比设各物质。"},"2|2|k|3":{"explain":"勒夏特列原理：改变条件（浓度、温度、压强），平衡向「减弱该改变」的方向移动：增大反应物浓度向正移；升温向吸热方向移；加压向气体分子数减少方向移。","example":"例：合成氨增大压强，平衡向气体分子数减少方向（正方向）移动，NH3含量增大、转化率提高。","tip":"「减弱」不是「消除」，平衡移动只能部分抵消条件的改变。"},"2|2|k|4":{"explain":"催化剂同等程度改变正逆速率，v正=v逆仍成立，平衡不移动，各物质平衡浓度、转化率不变，只是更快达到平衡。","example":"例：加催化剂后合成氨平衡时NH3含量不变，但到达平衡的时间明显缩短，说明催化剂不改变平衡。","tip":"催化剂改变速率不改变平衡，平衡浓度转化率都不变。"},"2|2|k|5":{"explain":"图像规律「先拐先平数值大」：先出现拐点（先达平衡）的曲线条件更剧烈——温度更高或压强更大。转化率随温度升高而增大为吸热反应，减小为放热反应。","example":"例：T2先拐（T2大于T1）且T2对应转化率低，说明升温转化率降低，正反应放热。","tip":"先拐先平数值大加拐点后数值走向，判断吸放热与计量数。"},"2|2|d|0":{"explain":"加压只影响气体反应：若反应前后气体计量数之和不相等（如2SO2+O2⇌2SO3），加压向计量数小方向移动；若相等（H2+I2⇌2HI），加压平衡不移动。","example":"例：恒容下充入He，各气体分压不变，H2+I2⇌2HI与2SO2+O2⇌2SO3平衡都不移动。","tip":"看气体计量数差：不为0加压才移动，为0加压不移动。"},"2|2|d|1":{"explain":"恒容充惰气：各反应气体浓度（分压）不变，Q不变，平衡不移动。恒压充惰气：容器体积增大，各气体浓度等倍减小，Q可能变化，平衡向气体分子数增多方向移动。","example":"例：恒容充He，2SO2+O2⇌2SO3平衡不移动；恒压充He，体积增大，平衡向气体分子数增多的逆方向移动。","tip":"充惰气看容器：恒容不移动，恒压向气体分子数多方向移动。"},"2|2|d|2":{"explain":"增大一种反应物浓度，平衡正移，但该物质本身转化率降低（增大的部分未全转化），另一种反应物转化率提高。如增大N2浓度，N2转化率降低、H2转化率升高。","example":"例：N2+3H2⇌2NH3中增大c(N2)，H2转化率提高、N2转化率降低，平衡正移。","tip":"「增谁谁降」：增大某反应物浓度，该反应物转化率降低。"},"2|2|d|3":{"explain":"等效平衡：不同投料达到相同平衡状态。恒温恒容、气体计量数不等：投料「一边倒」后各物质起始量完全相等才等效；恒温恒容等体反应或恒温恒压：按比例投料即等效。","example":"例：恒温恒容下2SO2+O2⇌2SO3，投2 mol SO2加1 mol O2与投2 mol SO3（完全转化回）等效。","tip":"恒容不等体看「完全相等」，恒容等体和恒压看「成比例」。"},"2|2|e|0":{"explain":"计算K用平衡浓度代入表达式（指数为计量数）；K只随温度变；用Q与K比较判断方向。题中常给图像或表格数据，先求平衡浓度再列K。","tip":"K计算先找平衡浓度，固体纯液体不写入K表达式。"},"2|2|e|1":{"explain":"应用步骤：明确改变什么条件，判断平衡向哪个方向移动，再分析目标量变化。如2NO2⇌N2O4加压颜色先深后浅、转化率增大。","example":"例：2NO2(红棕)⇌N2O4(无色)压缩体积，颜色先变深（浓度增大）后略变浅（平衡正移），但比原来深。","tip":"压缩气体先看浓度骤增再看平衡移动，颜色变化「先深后浅」。"},"2|2|e|2":{"explain":"读图顺序：看横纵坐标→找拐点（先拐先平数值大）→比较同一条件下的数值→判断吸放热与计量数。投料比图中按计量比投料时转化率最高。","tip":"投料比图峰值处即计量比投料，峰值点两反应物转化率相等。"},"2|2|e|3":{"explain":"合成氨放热、气体计量数减小：低温高压利于转化率，但速率慢；高温利于速率但转化率低；故选500 ℃、10~30 MPa、铁触媒，兼顾速率、转化率与成本。","example":"例：合成氨实际条件500 ℃、20 MPa、铁触媒，是速率、转化率、成本综合平衡的结果。","tip":"工业条件分析套路「速率与转化率兼顾、考虑成本安全」。"},"2|3|k|0":{"explain":"强弱电解质看电离程度：强电解质完全电离无平衡；弱电解质部分电离存在电离平衡：CH3COOH⇌CH3COO-+H+，平衡时分子与离子共存。加水稀释电离度增大但离子浓度减小。","example":"例：0.1 mol/L CH3COOH中c(H+)小于0.1 mol/L，因部分电离存在电离平衡。","tip":"弱电解质电离方程式用可逆号，加水稀释电离度增大、浓度减小。"},"2|3|k|1":{"explain":"电离常数Ka（或Kb）等于电离产物浓度幂之积除以未电离分子浓度，只随温度变化（升温增大，电离吸热），与浓度无关。Ka越大酸性越强。","example":"例：Ka(CH3COOH)大于Ka(H2CO3)，故醋酸可制碳酸：2CH3COOH+Na2CO3=2CH3COONa+H2O+CO2↑。","tip":"电离常数只与温度有关，比较酸性用Ka大小。"},"2|3|k|2":{"explain":"电离平衡移动规律：加水稀释，平衡正移（电离度增大），但体积增大使离子浓度反而减小；加入含相同离子的盐（同离子效应）平衡逆移电离度减小；升温平衡正移。","example":"例：向CH3COOH中加水，电离度增大但c(H+)减小；加CH3COONa，c(H+)减小（同离子效应）。","tip":"稀释「度升浓度降」：电离度增大、离子浓度减小，两个方向别混。"},"2|3|k|3":{"explain":"水是极弱电解质：H2O⇌H++OH-，Kw=c(H+)·c(OH-)，25 ℃时为1×10-14。Kw只随温度变（升温增大），适用于任何稀溶液。","example":"例：25 ℃时0.1 mol/L盐酸中c(OH-)=Kw/c(H+)=1×10-14/0.1=1×10-13 mol/L。","tip":"Kw适用于一切水溶液，酸溶液中也有OH-，由Kw算。"},"2|3|k|4":{"explain":"pH=-lg c(H+)，c(H+)越大pH越小。25 ℃时中性pH=7；pH小于7酸性、大于7碱性。pH每差1，c(H+)差10倍。","example":"例：c(H+)=1×10-4 mol/L的溶液pH=4，显酸性；pH=10则c(OH-)=1×10-4 mol/L。","tip":"pH与c(H+)是负对数关系，pH小1则c(H+)大10倍。"},"2|3|k|5":{"explain":"混合求pH步骤：先算n(H+)与n(OH-)，判断谁过量；酸过量c(H+)=(n酸-n碱)/V总，直接求pH；碱过量先求c(OH-)，再由Kw求c(H+)算pH。","example":"例：pH=2与pH=12等体积混合：n(H+)与n(OH-)相等，恰好中和，pH=7（25 ℃）。","tip":"碱过量必须经Kw换算c(H+)，不能直接用c(OH-)求pH。"},"2|3|d|0":{"explain":"稀释相同倍数，强酸c(H+)按倍数减小，pH变化大；弱酸稀释时电离度增大补偿了c(H+)，pH变化小。如pH=2的盐酸与醋酸稀释100倍，盐酸pH=4，醋酸小于4。","example":"例：pH=2的盐酸和醋酸各稀释100倍：盐酸pH变为4，醋酸pH变为2到4之间。","tip":"弱酸稀释pH变化小，「越稀越电离」补偿浓度下降。"},"2|3|d|1":{"explain":"中性条件是c(H+)=c(OH-)，与pH=7不等价：25 ℃中性pH=7，100 ℃时Kw=1×10-12，中性pH=6。判断酸碱性只看c(H+)与c(OH-)相对大小。","example":"例：100 ℃时pH=6的溶液是中性（c(H+)=c(OH-)），pH=7反而是碱性。","tip":"中性判断标准是c(H+)=c(OH-)，pH=7只在25 ℃成立。"},"2|3|d|2":{"explain":"Kw=c(H+)·c(OH-)对任何水溶液恒成立：酸溶液中c(H+)大，但c(OH-)由Kw/c(H+)求得，不为0；碱溶液同理。这是求水电离出的c(H+)或c(OH-)的基础。","example":"例：pH=1盐酸中水电离的c(H+)等于溶液c(OH-)=1×10-13 mol/L，而非1×10-1。","tip":"酸溶液中水电离的c(H+)就是溶液c(OH-)，两者相等。"},"2|3|d|3":{"explain":"同浓度（如0.1 mol/L）的盐酸与醋酸：盐酸完全电离c(H+)大，pH小、与金属反应快；醋酸部分电离c(H+)小，pH大、反应慢。但二者可中和的碱量相同。","example":"例：0.1 mol/L盐酸pH=1，0.1 mol/L醋酸pH大于1；两者各10 mL中和NaOH物质的量相同。","tip":"强弱酸「pH与速率不同、中和能力相同」，看是c(H+)还是总酸量。"},"2|3|e|0":{"explain":"稀释：强酸每稀释10倍pH加1（不越过7），弱酸pH变化小；混合：先算n(H+)、n(OH-)判过量，酸过量算c(H+)、碱过量经Kw换算。","tip":"pH计算最后用c(H+)求，碱过量先求c(OH-)再换c(H+)。"},"2|3|e|1":{"explain":"酸碱溶液抑制水电离：溶液中水电离的c(H+)等于溶液c(OH-)（酸中）或c(H+)（碱中），数值远小于1×10-7；盐溶液促进水电离。先判断抑制还是促进。","example":"例：pH=2盐酸中水电离c(H+)=1×10-12 mol/L（被抑制）；pH=12的Na2CO3溶液中水电离c(H+)=1×10-2 mol/L（被促进）。","tip":"先判抑制（酸碱）还是促进（盐），再按「酸中水电离H+等于溶液OH-」算。"},"2|3|e|2":{"explain":"比较强弱电解质：同浓度测pH（强酸pH小）、测导电性（强电解质导电强）、与金属反应速率（强酸快）、测电离度。注意控制变量。","example":"例：0.1 mol/L盐酸pH=1、醋酸pH大于1，说明醋酸是弱电解质（部分电离）。","tip":"比较实验必须「同浓度」，用pH、导电性、反应快慢三法。"},"2|3|e|3":{"explain":"Ka大小比较酸性强弱；强酸制弱酸原则判断反应方向（Ka大的酸可制Ka小的酸）；判断离子共存看能否生成弱电解质、沉淀、气体。","example":"例：因Ka(CH3COOH)大于Ka(HClO)，CH3COOH能与NaClO反应生成HClO。","tip":"「强酸制弱酸」用Ka比较判断，Ka大者酸性强。"},"2|4|k|0":{"explain":"水解本质：盐电离出的弱酸根（或弱碱阳离子）与水电离的H+（或OH-）结合生成弱电解质，消耗水电离出的离子，使水的电离平衡正移（促进水电离）。","example":"例：Na2CO3中CO3(2-)与水电离的H+结合成HCO3-，c(OH-)增大，溶液显碱性。","tip":"水解促进水电离，酸碱抑制水电离，方向相反。"},"2|4|k|1":{"explain":"口诀五句：有弱才水解（含弱酸根或弱碱阳离子才水解）；无弱不水解（强酸强碱盐不水解）；谁弱谁水解；越弱越水解；谁强显谁性。","example":"例：NaCl不水解显中性；CH3COONa水解显碱性；NH4Cl水解显酸性；Na2CO3水解程度大于NaHCO3。","tip":"「谁强显谁性」：强酸弱碱盐酸性、强碱弱酸盐碱性、都强中性。"},"2|4|k|2":{"explain":"多元弱酸盐分步水解：CO3(2-)第一步水解生成HCO3-，第二步生成H2CO3，第一步为主。写水解方程式用可逆号、不写气体沉淀符号。","example":"例：Na2CO3溶液显碱性的主反应：CO3(2-)+H2O⇌HCO3-+OH-。","tip":"水解方程式用可逆号，分步水解只写第一步为主。"},"2|4|k|3":{"explain":"水解吸热：升温促进水解；加水稀释促进水解（但离子浓度减小）；加酸抑制弱碱阳离子水解、促进弱酸根水解（反之加碱）；同离子效应抑制水解。","example":"例：加热Na2CO3溶液去油污效果更好（升温促进水解）；配制FeCl3加盐酸抑制水解。","tip":"升温稀释促进水解，同离子效应抑制水解。"},"2|4|k|4":{"explain":"应用三例：明矾中Al3+水解生成Al(OH)3胶体吸附杂质净水；纯碱水解显碱性，加热促进水解去油污；配制FeCl3溶液加少量盐酸抑制水解。","example":"例：配制FeCl3溶液：加适量盐酸使Fe3++3H2O⇌Fe(OH)3+3H+平衡逆移，溶液澄清。","tip":"配制易水解盐溶液加对应酸或碱抑制水解。"},"2|4|k|5":{"explain":"沉淀溶解平衡是动态平衡：AgCl(s)⇌Ag++Cl-，Ksp=c(Ag+)·c(Cl-)，表达式只含离子浓度（固体不写入），只与温度有关。Ksp越小越难溶。","example":"例：AgCl的Ksp=c(Ag+)·c(Cl-)，升温（溶解吸热）Ksp增大，说明Ksp只随温度改变。","tip":"Ksp表达式只写离子浓度幂之积，固体不写入，只随温度变。"},"2|4|k|6":{"explain":"用Q与Ksp比较判断沉淀的生成与溶解：Q大于Ksp生成沉淀、Q等于Ksp饱和、Q小于Ksp沉淀溶解。沉淀转化：向更难溶方向转化，如AgCl→AgI→Ag2S。","example":"例：向AgCl悬浊液中加KI，白色AgCl转化为黄色AgI：AgCl(s)+I-=AgI(s)+Cl-，因Ksp(AgI)更小。","tip":"沉淀转化方向：Ksp小（更难溶）的方向，AgCl→AgI→Ag2S。"},"2|4|d|0":{"explain":"弱酸根与弱碱阳离子相互促进水解（双水解）可进行到底，离子不共存：Al3+与HCO3-、CO3(2-)、S2-、AlO2-，Fe3+与HCO3-、CO3(2-)。","example":"例：AlCl3与NaHCO3溶液混合：Al3++3HCO3-=Al(OH)3↓+3CO2↑，产生白色沉淀和气泡。","tip":"双水解写「=」、标↓↑，与单水解写可逆号不同。"},"2|4|d|1":{"explain":"三守恒：电荷守恒（阳离子总电荷=阴离子总电荷）；物料守恒（元素总量关系）；质子守恒（水电离H+与OH-守恒，可由前两者相减得）。如Na2CO3溶液三者联合用于离子浓度排序。","example":"例：Na2CO3溶液中c(Na+)最大，其次c(CO3(2-))，再c(HCO3-)，最后c(H2CO3)。","tip":"写电荷守恒注意离子电荷数乘系数，如2c(CO3(2-))。"},"2|4|d|2":{"explain":"酸式盐酸碱性看「电离与水解谁强」：NaHCO3中HCO3-水解大于电离，显碱性；NaHSO3中HSO3-电离大于水解，显酸性；NaHSO4完全电离显强酸性。","example":"例：NaHCO3溶液显碱性（水解为主），NaHSO3显酸性（电离为主），NaHSO4显强酸性（完全电离）。","tip":"判断酸式盐性质先比较电离与水解强弱，NaHSO4是特例完全电离。"},"2|4|d|3":{"explain":"易水解盐蒸干灼烧得氧化物：FeCl3水解生成Fe(OH)3，灼烧分解得Fe2O3；AlCl3同理得Al2O3。不水解或水解产物稳定者不变（Na2CO3得原盐）。","example":"例：蒸干灼烧FeCl3溶液最终得Fe2O3：先水解生成Fe(OH)3，HCl挥发促进水解，灼烧2Fe(OH)3=Fe2O3+3H2O。","tip":"「蒸干灼烧氯化物得氧化物」，因HCl挥发促进水解到底。"},"2|4|e|0":{"explain":"判断酸碱性用「谁强显谁性」；pH比较：越弱越水解、对应盐碱性越强；离子浓度排序先写三守恒，一般c(主要离子)大于c(次要离子)。","tip":"排序用「电离大于水解」为主流，先电荷守恒检验。"},"2|4|e|1":{"explain":"图像题看趋势：稀释时水解程度增大但各离子浓度减小；升温时水解程度增大，c(OH-)（或c(H+)）增大。曲线变化要与「度升浓度降」的规律对应。","tip":"稀释图：离子浓度都降、水解度升；升温图：水解方向浓度升。"},"2|4|e|2":{"explain":"Ksp计算：由离子浓度求Ksp或由Ksp求某离子浓度；判断沉淀生成：Q与Ksp比较。应用：锅炉水垢CaSO4用Na2CO3转化为CaCO3（Ksp更小）再用盐酸溶解。","example":"例：CaSO4水垢加Na2CO3：CaSO4+CO3(2-)=CaCO3+SO4(2-)（CaCO3更难溶），再加盐酸溶解CaCO3。","tip":"除垢思路「难溶转更难溶」：Ksp小的沉淀更稳定。"},"2|4|e|3":{"explain":"设计思路：比较对应盐水解程度或比较酸与盐反应。如测同浓度CH3COONa与NaHCO3溶液pH：pH大者对应酸更弱。","example":"例：测同浓度CH3COONa和Na2CO3溶液pH，Na2CO3更大，说明H2CO3弱于CH3COOH。","tip":"「越弱越水解」：对应盐水解程度大的酸更弱。"},"2|5|k|0":{"explain":"原电池核心「负氧正还」：负极失电子被氧化、正极得电子被还原；电子经外电路由负极流向正极（电流相反）；溶液中阳离子移向正极得电子、阴离子移向负极。","example":"例：Zn-Cu稀硫酸电池：Zn失电子作负极溶解，H+移向Cu正极得电子放H2，电子由Zn经导线流向Cu。","tip":"原电池四要素「负氧正还、电子出负、阳离子追正」。"},"2|5|k|1":{"explain":"电解池「阳氧阴还」：阳极接电源正极发生氧化反应（阴离子放电或电极溶解），阴极接负极发生还原反应（阳离子得电子）；阳离子移向阴极。","example":"例：电解CuCl2溶液：阳极Cl-失电子放Cl2，阴极Cu2+得电子析出Cu，两极产物不同。","tip":"电解池与电源相连：阳极接正、阴极接负，离子「阳奔阴、阴向阳」。"},"2|5|k|2":{"explain":"氯碱工业电解饱和食盐水：阴极H+得电子放H2（同时生成OH-），阳极Cl-失电子放Cl2，总反应2NaCl+2H2O=2NaOH+H2↑+Cl2↑（通电）。","example":"例：电解饱和食盐水阳极放Cl2、阴极放H2，阴极区生成NaOH，用离子交换膜隔开两极。","tip":"电解方程式写「通电」条件，阳极Cl2、阴极H2和NaOH。"},"2|5|k|3":{"explain":"精炼铜：粗铜（含Zn、Fe、Ni、Ag、Au等）作阳极溶解，纯铜作阴极析出，CuSO4溶液作电解液；活泼杂质（Zn、Fe）先溶解，不活泼杂质（Ag、Au）沉为阳极泥。","example":"例：精炼铜时阳极质量减少不等于阴极增加（活泼杂质溶解、阳极泥沉积），阴极得纯铜。","tip":"粗铜阳极溶解、纯铜阴极析出，金银等进入阳极泥回收。"},"2|5|k|4":{"explain":"钢铁腐蚀以吸氧腐蚀为主（中性、弱酸性）：负极Fe-2e-=Fe2+，正极O2得电子生成OH-，Fe(OH)2再氧化成Fe(OH)3脱水生铁锈。强酸性环境发生析氢腐蚀。","example":"例：钢铁在潮湿空气中吸氧腐蚀：负极Fe失电子，正极O2得电子生成OH-，铁最终生锈。","tip":"吸氧腐蚀条件「中性弱酸」，析氢腐蚀「强酸」，负极都是Fe失电子。"},"2|5|k|5":{"explain":"防护原理都是让被保护金属作阴极（或正极）不受腐蚀：牺牲阳极法——连接更活泼金属（如轮船外壳连Zn块），Zn先被腐蚀；外加电流阴极保护法——被保护金属接电源负极。","example":"例：轮船外壳镶锌块，Zn作负极被腐蚀，船体（正极）被保护，是牺牲阳极保护法，原理是活泼金属先腐蚀。","tip":"被保护金属「作阴极或正极」，牺牲阳极用更活泼金属。"},"2|5|d|0":{"explain":"放电顺序要背：阳极（惰性电极）阴离子放电顺序S2-、I-、Br-、Cl-先于OH-放电，含氧酸根不易放电；阴极阳离子按金属活动性逆序（不活泼先放电）：Ag+、Cu2+先于H+。","example":"例：电解CuCl2溶液：阳极Cl-放电放Cl2，阴极Cu2+放电析Cu；Cu2+放完再H+放H2。","tip":"阳极「S I Br Cl OH」，阴极「金属越不活泼越先放电」。"},"2|5|d|1":{"explain":"恢复原溶液「出什么加什么」：电解CuSO4生成Cu和O2（出Cu出O），加CuO（或CuCO3，放CO2后相当于CuO）可恢复；电解NaCl生成H2和Cl2，通入HCl恢复。","example":"例：电解CuSO4溶液一段时间后，加适量CuO（或CuCO3）可使溶液恢复原浓度。","tip":"恢复看「跑了什么」：跑Cu加CuO、跑H2和Cl2通HCl。"},"2|5|d|2":{"explain":"吸氧腐蚀：中性或弱酸性，正极O2得电子生成OH-；析氢腐蚀：酸性较强，正极H+得电子放H2。铁锈生成：Fe→Fe2+→Fe(OH)2→Fe(OH)3→脱水成Fe2O3·xH2O。","example":"例：潮湿中性环境铁吸氧腐蚀生成Fe(OH)2，继续氧化为Fe(OH)3，脱水得铁锈Fe2O3·xH2O。","tip":"铁锈是Fe2O3·xH2O，生成经过「亚铁→氢氧化物→氧化→脱水」。"},"2|5|d|3":{"explain":"介质决定产物：酸性介质H+参与（负极H2-2e-=2H+）；碱性介质OH-参与（负极H2-2e-+2OH-=2H2O）；熔融碳酸盐CO3(2-)参与。总反应相同。","example":"例：氢氧燃料电池：酸性负极H2-2e-=2H+，碱性负极H2-2e-+2OH-=2H2O，产物不同但总反应相同。","tip":"电极式按介质配平：先定产物，再用H+、OH-或CO3(2-)平衡电荷。"},"2|5|e|0":{"explain":"综合题步骤：先判装置类型（有无外接电源），再定电极（原电池活泼金属负极；电解池接正极是阳极），写电极式，算电子转移，分析pH变化。","tip":"先判装置再判电极，电解池看电源、原电池看活泼性。"},"2|5|e|1":{"explain":"电解计算统一用电子守恒：各电极转移电子数相等，n(e-)=n(金属)×价态变化=气体物质的量×每个分子得电子数。串联电解池转移电子数相同。","example":"例：串联电解CuSO4和AgNO3，转移2 mol电子，阴极析出1 mol Cu和2 mol Ag。","tip":"串联电路「电子数相等」，按电子守恒统一折算气体与金属。"},"2|5|e|2":{"explain":"腐蚀速率排序：电解池阳极（被腐蚀极）大于原电池负极、大于化学腐蚀、大于原电池正极（被保护）、大于电解池阴极（被保护）。","tip":"腐蚀快慢「电解阳极大于原电池负极大于化学腐蚀大于被保护极」。"},"2|5|e|3":{"explain":"活泼金属用电解熔融化合物冶炼：电解熔融NaCl制Na（2NaCl=2Na+Cl2↑），电解熔融Al2O3制Al（加冰晶石降熔点）。不电解AlCl3（共价化合物熔融不导电）。","example":"例：工业制铝：2Al2O3=4Al+3O2↑（通电、冰晶石助熔），制钠电解熔融NaCl。","tip":"冶炼活泼金属电解熔融物，Al用电解Al2O3不用AlCl3。"},"3|0|k|0":{"explain":"能层按能量从低到高分K、L、M、N（对应n=1、2、3、4），K层只有s，L层s、p，M层s、p、d，N层含s、p、d、f。s、p、d、f能级最多容纳2、6、10、14个电子。","example":"例：M能层含3s、3p、3d三个能级，最多容纳2+6+10=18个电子，等于2n²。","tip":"能级容纳数s2、p6、d10、f14，各层最多2n²个电子。"},"3|0|k|1":{"explain":"电子按能量由低到高填充：1s、2s、2p、3s、3p、4s、3d、4p……（4s先于3d）。遵循能量最低原理、泡利原理、洪特规则。","example":"例：K的排布为1s2 2s2 2p6 3s2 3p6 4s1（4s先于3d填充）。","tip":"记忆顺序「1s2s2p3s3p4s3d4p」，4s在3d前。"},"3|0|k|2":{"explain":"书写电子排布式按能层由低到高排列，但同一能层写在一起：Fe为1s2 2s2 2p6 3s2 3p6 3d6 4s2（先写3d再写4s）。价电子排布Fe为3d6 4s2。","example":"例：Fe原子电子排布式1s2 2s2 2p6 3s2 3p6 3d6 4s2，价电子排布式3d6 4s2。","tip":"书写顺序「按能层排」，3d6在4s2前面，别按填充顺序写。"},"3|0|k|3":{"explain":"第一电离能规律：同周期从左到右总体增大，但ⅡA大于ⅢA、ⅤA大于ⅥA，因半满、全满稳定；同主族从上到下减小（半径增大、失电子容易）。","example":"例：第一电离能Mg大于Al（3s2全满）、N大于O（2p3半满）、P大于S，同主族从上到下递减。","tip":"反常点「ⅡA、ⅤA大于相邻」：Be大于B、Mg大于Al、N大于O、P大于S。"},"3|0|k|4":{"explain":"电负性表示原子吸引电子能力：F最大4.0；同周期从左到右增大、同主族从上到下减小。电负性差越大键越极性（差值较大一般为离子键）。","example":"例：电负性F大于O大于N大于C，H与F成键极性大，Na与Cl电负性差大形成离子键。","tip":"电负性「F最大、右上角大」，差值大成离子键。"},"3|0|k|5":{"explain":"原子半径规律：同周期从左到右核电荷增大、电子层数相同，半径减小；同主族从上到下电子层数增多，半径增大。比较半径先看电子层数再看核电荷。","example":"例：半径Na大于Mg大于Al大于Cl（同周期递减），Li小于Na小于K（同主族递增）。","tip":"比半径「层多者大、同层电荷多者小」。"},"3|0|d|0":{"explain":"洪特规则特例：等价轨道半满（d5）、全满（d10）、全空（d0）时能量低更稳定，电子「抢占」s轨道电子：Cr是3d5 4s1（不是3d4 4s2）、Cu是3d10 4s1。","example":"例：Cr价电子排布3d5 4s1、Cu为3d10 4s1，都是半满全满稳定造成的特例。","tip":"特例只记「Cr和Cu」：3d5 4s1、3d10 4s1。"},"3|0|d|1":{"explain":"反常原因：轨道全满、半满稳定。Mg的3s2全满稳定，电离能大于Al；N的2p3半满稳定，大于O；P（3p3）大于S（3p4）。答题要写出「轨道半满/全满更稳定」。","example":"例：第一电离能N大于O，因N的2p3半充满状态更稳定，失去电子需更多能量，同理P大于S。","tip":"答反常必写「半满/全满稳定」，这是得分点。"},"3|0|d|2":{"explain":"失电子顺序与填充顺序相反：先失最外层（4s）电子再失3d：Fe(3d6 4s2)失2个电子成Fe2+（3d6），不是3d4 4s2；Fe3+为3d5。","example":"例：Fe2+电子排布为1s2 2s2 2p6 3s2 3p6 3d6，Fe3+为3d5（先失4s2再失1个3d电子）。","tip":"阳离子「先失最外层」，Fe2+写3d6，别写成3d4 4s2。"},"3|0|d|3":{"explain":"电子云是电子在核外空间出现的概率密度图：小黑点密处概率大，不代表电子轨迹；s轨道球形、p轨道哑铃形、d轨道花瓣形。","example":"例：1s电子云呈球形，2p电子云呈哑铃形，小黑点疏密表示出现概率大小，密处概率大。","tip":"电子云不是「电子绕核的轨迹」，是概率分布图。"},"3|0|e|0":{"explain":"由电子排布反推元素：数电子总数定原子序数；由价电子排布定族与周期（价电子数=主族族序数）。书写注意能层顺序与特例（Cr、Cu）。","tip":"由价电子排布定位元素：层数定周期、价电子数定族。"},"3|0|e|1":{"explain":"比较电离能、电负性先看周期表位置，反常点（ⅡA、ⅤA）用半满全满解释。答题规范：「因2p3（或3s2）为半满（全满）稳定结构，失去电子需更多能量」。","tip":"解释反常必须点出「半满全满稳定」，一句话到位。"},"3|0|e|2":{"explain":"位置-结构-性质三角关系：由位置推半径、电离能、电负性、金属性非金属性；反过来由数据（如电离能突跃、电负性数值）定位元素。","tip":"电离能突跃点提示价电子数，电负性数值可定位元素。"},"3|0|e|3":{"explain":"基态是能量最低状态，吸收能量跃迁到激发态；电子从激发态回到基态释放能量以光形式放出（发射光谱）。焰色反应本质是电子跃迁发光，是物理变化。","tip":"焰色反应是物理变化（电子跃迁发光），不是化学变化。"},"3|1|k|0":{"explain":"σ键「头碰头」重叠程度大可独立存在，π键「肩并肩」重叠程度小随σ键存在：单键1个σ键；双键1σ+1π；三键1σ+2π。π键不如σ键稳定，易断裂。","example":"例：C2H4中C=C含1σ+1π，C-H为σ键；N2中N≡N含1σ+2π，σ键总数比π键多一个。","tip":"数键类型「单σ、双σ加π、三σ加2π」，π键活泼易加成。"},"3|1|k|1":{"explain":"键能越大键越牢固分子越稳定；键长越短键能越大越稳定；键角决定分子的空间构型（如109.5°正四面体、120°平面三角形、180°直线形）。","example":"例：N≡N键能大（946 kJ/mol）故N2稳定；H2O键角104.5°为V形。","tip":"键能大键长短则稳定；键角定构型。"},"3|1|k|2":{"explain":"杂化类型决定构型：sp3杂化（4个轨道）正四面体，如CH4；sp2杂化（3个）平面三角形，如C2H4；sp杂化（2个）直线形，如C2H2。","example":"例：CH4中C是sp3杂化，C2H4中C是sp2杂化，C2H2中C是sp杂化，构型分别为正四面体、平面、直线。","tip":"杂化数=价层电子对数：4对sp3、3对sp2、2对sp。"},"3|1|k|3":{"explain":"VSEPR理论：价层电子对数决定电子对空间构型；孤对电子不占「原子位置」但排斥大，使构型改变：如NH3成三角锥、H2O成V形。","example":"例：NH3价层电子对4对（3成键+1孤对），分子构型三角锥，键角107.3°小于109.5°。","tip":"孤对电子「占位置不占原子」，把分子「压」变形。"},"3|1|k|4":{"explain":"判断分子极性看电荷中心是否重合：对称结构（直线CO2、正四面体CH4、平面BF3）是非极性分子；不对称（V形H2O、三角锥NH3）是极性分子。","example":"例：CO2含极性键但对称是非极性分子；H2O含极性键且不对称是极性分子，说明极性键不等于极性分子。","tip":"口诀「对称非极性、不对称极性」，极性键不等于极性分子。"},"3|1|k|5":{"explain":"分子间作用力含范德华力和氢键：范德华力随相对分子质量增大而增强（熔沸点升高）；氢键是F、O、N等电负性大的原子与H之间的作用力（如H2O、HF、NH3分子间），比范德华力强。","example":"例：同族氢化物沸点HI大于HBr大于HCl（范德华力随Mr增大）；H2O沸点反常高于H2S（氢键）。","tip":"范德华力看Mr大小，氢键看「F、O、N与H」。"},"3|1|k|6":{"explain":"氢键影响物理性质：H2O、HF、NH3因分子间氢键沸点反常升高（H2O大于H2S、HF大于HCl、NH3大于PH3）；氢键还影响溶解性与DNA双螺旋等生物结构。","example":"例：H2O沸点100 ℃远高于H2S（-60 ℃），因水分子间氢键需更多能量破坏。","tip":"沸点反常「水氟氨」，氢键使沸点升高。"},"3|1|k|7":{"explain":"配位键是共用电子对由一方提供的共价键：Cu2+提供空轨道、NH3提供孤对电子形成配位键。配合物[Cu(NH3)4]2+中中心离子Cu2+、配体NH3、配位数4，溶液呈深蓝色。","example":"例：向CuSO4溶液加过量氨水，先沉淀后溶解，得深蓝色[Cu(NH3)4]2+溶液。","tip":"配合物「中心离子+配体+配位数」，配位键是特殊共价键。"},"3|1|d|0":{"explain":"数σ键：每个单键1个σ、双键中1个σ、三键中1个σ。C2H4：C=C一个σ、4个C-H四个σ，共5σ+1π；N2：N≡N为1σ+2π。","example":"例：C2H4分子含5个σ键和1个π键；C2H2含3个σ键和2个π键，数键先写结构式。","tip":"数σ键「所有单键加双三键中各一个」，π键数=双键数+2×三键数。"},"3|1|d|1":{"explain":"判断杂化：先算价层电子对数（含孤对电子），4对sp3、3对sp2、2对sp。SO2价层电子对3（2成键+1孤对）为sp2（V形）；NH3为sp3（三角锥）。","example":"例：SO2中心S价层电子对3对，sp2杂化，分子为V形；NH3有4对，sp3杂化，三角锥形。","tip":"杂化看「价层电子对数」，含孤对；构型再看孤对位置。"},"3|1|d|2":{"explain":"判断分子极性：结构对称（直线、平面三角、正四面体，中心无孤对）为非极性，不对称（V形、三角锥，中心有孤对）为极性。","example":"例：H2O、NH3是极性分子；CO2、CH4、BF3是非极性分子，判断看结构是否对称。","tip":"中心原子有孤对电子、结构不对称则极性分子。"},"3|1|d|3":{"explain":"氢键本质是静电作用，强度介于化学键与范德华力之间，不属于化学键。HF因分子间氢键沸点高于HCl（反常）；但HF电离程度小，是弱酸。","example":"例：沸点HF大于HI大于HBr大于HCl（HF因氢键反常最高），氢键不是化学键。","tip":"氢键「不是化学键」，是较强的分子间作用力。"},"3|1|d|4":{"explain":"等电子体：原子总数相同、价电子总数相同的粒子，结构与性质相似：CO与N2都是10价电子，都有三键（C≡O类似N≡N）；SO2与O3都是18价电子，都是V形分子。","example":"例：CO与N2互为等电子体，CO结构为C≡O（三键）类似N≡N；SO2与O3等电子，都是V形分子。","tip":"等电子体「原子总数同、价电子同」，可互推结构与键型。"},"3|1|e|0":{"explain":"解题步骤：写结构式→数σ、π键；算中心原子价层电子对数→定杂化类型。注意C=C双键是1σ+1π，三键1σ+2π。","tip":"先写结构式再数键，杂化用价层电子对数判断。"},"3|1|e|1":{"explain":"比较键角思路：孤对电子排斥作用大于成键电子对，使键角压缩：NH3（107.3°）小于CH4（109.5°），H2O（104.5°）更小（有2对孤对）。","tip":"孤对越多键角越小：CH4大于NH3大于H2O是经典排序。"},"3|1|e|2":{"explain":"比较沸点：先看有无氢键（F、O、N的氢化物反常高），再看Mr大小；溶解性用「相似相溶」与氢键（如乙醇与水互溶因氢键）分析。","tip":"沸点先查氢键再比Mr，溶解看相似相溶与氢键。"},"3|1|e|3":{"explain":"分析配合物「四要素」：中心离子（提供空轨道）、配体（提供孤对电子）、配位数（配体个数）、配离子电荷。如[Fe(SCN)]2+中Fe3+为中心离子、SCN-为配体。","example":"例：[Cu(NH3)4]2+中心离子Cu2+、配体NH3、配位数4，溶液深蓝色。","tip":"配位数=配体个数（高中按个数算），先找中心离子。"},"3|2|k|0":{"explain":"四大晶体类型与实例：离子晶体（NaCl、CaO，靠离子键）、共价晶体（金刚石、SiO2，共价键网状）、分子晶体（干冰、冰，分子间作用力）、金属晶体（Fe、Cu，金属键）。","example":"例：干冰是分子晶体、金刚石是共价晶体、NaCl是离子晶体、铁是金属晶体，四大类型各记代表物。","tip":"分类看「粒子与作用力」：分子晶体靠范德华力最易熔。"},"3|2|k|1":{"explain":"性质由微粒间作用力决定：共价晶体共价键强，熔点高硬度大（金刚石最硬）；离子晶体熔点较高、熔融导电；分子晶体范德华力弱，熔沸点低；金属晶体导电导热有延展性。","example":"例：熔点金刚石（共价）大于NaCl（离子）大于冰（分子）；金属铜能导电导热，性质由作用力决定。","tip":"熔点大致排序：共价晶体大于离子晶体大于金属晶体（多数）大于分子晶体。"},"3|2|k|2":{"explain":"均摊法算每个晶胞的粒子数：顶点粒子被8个晶胞共用占1/8，棱心占1/4，面心占1/2，体心占1。如NaCl晶胞中Cl-在顶点和面心共4个、Na+在棱和体心共4个。","example":"例：顶点8个粒子贡献8×1/8=1个，面心6个贡献6×1/2=3个，共4个，再加棱心和体心补全。","tip":"均摊「顶八棱四面二体一」，先标位置再算贡献。"},"3|2|k|3":{"explain":"NaCl晶胞中Cl-（或Na+）处于顶点和面心，每个Na+周围等距6个Cl-、每个Cl-周围6个Na+，配位数都是6；离子晶体无独立分子。","example":"例：NaCl晶体中每个Na+被6个Cl-包围，配位数6，无NaCl分子存在，化学式只表最简比。","tip":"NaCl配位数6、CsCl配位数8，注意区分。"},"3|2|k|4":{"explain":"金刚石：每个C连4个C，每条C-C键被2个C共用，故1 mol金刚石含2 mol C-C键；SiO2：每个Si连4个O，1 mol SiO2含4 mol Si-O键。","example":"例：1 mol金刚石含2 mol C-C键；1 mol SiO2含4 mol Si-O键。","tip":"数键「共价键被两个原子共用要除以2」，金刚石C-C键为2 mol/mol。"},"3|2|k|5":{"explain":"密度公式：ρ=m/V，晶胞质量=晶胞中粒子数×摩尔质量/NA，晶胞体积=边长³（注意单位换算：1 nm=10-7 cm，1 pm=10-10 cm）。ρ=Z×M/(NA×a³)。","example":"例：NaCl晶胞含4个NaCl，边长为a cm，ρ=4×58.5/(NA×a³) g/cm³。","tip":"密度计算先数粒子数、再换单位：pm、nm换成cm。"},"3|2|d|0":{"explain":"计数前先定位粒子位置：顶点1/8、棱心1/4、面心1/2、体心1。同一晶胞中不同位置贡献不同，如体心立方金属晶胞：8个顶点（8×1/8=1）加1个体心=2个原子。","example":"例：面心立方晶胞含8×1/8+6×1/2=4个原子；体心立方含8×1/8+1=2个原子。","tip":"先标位置再按「顶八棱四面二体一」算，别漏别重。"},"3|2|d|1":{"explain":"单位换算易错：1 nm=10-7 cm、1 pm=10-10 cm，体积要立方换算（1 nm³=10-21 cm³）。代入ρ=Z·M/(NA·a³)时统一为cm和g/mol。","example":"例：边长400 pm=4×10-8 cm，体积(4×10-8)³=6.4×10-23 cm³。","tip":"边长pm或nm先换算成cm再立方，NA用6.02×10的23次方。"},"3|2|d|2":{"explain":"特殊结构键数：1 mol SiO2含4 mol Si-O键；1 mol P4含6 mol P-P键；1 mol石墨含1.5 mol C-C键。","example":"例：1 mol SiO2含4 mol Si-O键；1 mol P4含6 mol P-P键；1 mol石墨含1.5 mol C-C键。","tip":"三个特殊键数「4、6、1.5」记牢，SiO2键不除2、石墨要除2。"},"3|2|d|3":{"explain":"熔点规律：共价晶体大于离子晶体大于分子晶体。离子晶体比较：离子半径越小、电荷越多，离子键越强熔点越高（如MgO大于NaCl）。","example":"例：熔点金刚石大于MgO大于NaCl大于干冰；MgO（Mg2+、O2-电荷多半径小）熔点高于NaCl。","tip":"离子晶体熔点看「半径小电荷多」，MgO是经典例子。"},"3|2|e|0":{"explain":"推断化学式：用均摊法算各粒子数，取最简整数比即化学式；配位数看与某粒子距离最近的异种粒子数。先定位位置再计算。","tip":"化学式由均摊后粒子数最简比确定，配位数数最近邻粒子。"},"3|2|e|1":{"explain":"三量互求公式ρ=Z·M/(NA·a³)：已知三求一。代入时注意：Z是晶胞粒子数（均摊）、M是摩尔质量、a换算成cm、NA已知。","tip":"公式ρ=ZM/(NA·a³)四量互求，单位全部用cm和g。"},"3|2|e|2":{"explain":"判断晶体类型看组成与性质：熔沸点高硬度大是共价晶体（金刚石、SiO2）；熔融导电的是离子晶体（NaCl）；易升华的是分子晶体（干冰、冰）。","tip":"冰是分子晶体但有氢键，沸点高于一般分子晶体。"},"3|2|e|3":{"explain":"石墨：层状结构，层内共价键、层间范德华力，能导电、质软、熔点高；C60是分子晶体（足球烯）；石墨烯是单层石墨，强度大导电性好。","example":"例：石墨熔点高（层内共价键）但质软（层间范德华力弱），能导电；C60是分子晶体。","tip":"石墨「层内共价、层间范德华」，性质「熔点高又软」矛盾点常考。"},"3|3|k|0":{"explain":"官能团决定性质，要会写会认：羟基-OH（醇、酚）、醛基-CHO（醛）、羧基-COOH（羧酸）、酯基-COO-（酯）、羰基C=O（酮）、氨基-NH2、碳碳双键、碳碳三键。","example":"例：CH3CH2OH含羟基属醇，C6H5OH含羟基属酚，CH3CHO含醛基属醛。","tip":"官能团名称与结构简式要一一对应，酚羟基与醇羟基书写不同。"},"3|3|k|1":{"explain":"命名步骤：选主链（含官能团的最长碳链）→编号（官能团位次最小，其次取代基位次和最小）→写名称（位次-取代基-母体）。数字与汉字间用短线。","example":"例：CH3-CH(CH3)-CH2-CH3命名为2-甲基丁烷；CH2=CH-CH2-CH3为1-丁烯。","tip":"编号原则「官能团优先最小」，烯烃从离双键近端编号。"},"3|3|k|2":{"explain":"烷烃命名格式：位次-数目+名称，数字与汉字间用「-」，多个相同取代基合并写「二、三」。如2,2-二甲基丙烷（新戊烷）、3-甲基戊烷。","example":"例：(CH3)4C命名为2,2-二甲基丙烷；CH3CH2CH(CH3)CH2CH3为3-甲基戊烷。","tip":"逗号连接位次、短线连接数字与汉字，格式「2,2-二甲基」不能写错。"},"3|3|k|3":{"explain":"三类异构：碳链异构（碳骨架不同，如正丁烷与异丁烷）；位置异构（官能团位置不同，如1-丁烯与2-丁烯）；官能团异构（官能团种类不同，如乙醇与二甲醚）。","example":"例：C4H10有正丁烷与异丁烷（碳链异构）；C2H6O有乙醇与二甲醚（官能团异构）。","tip":"三类异构顺序排查「碳链→位置→官能团」，防漏防重。"},"3|3|k|4":{"explain":"通式相同可对应不同官能团：CnH2n+2O可为醇或醚；CnH2nO2可为羧酸或酯；CnH2n可为烯烃或环烷烃。写异构体时先列类别再写结构。","example":"例：C2H6O的同分异构体有乙醇CH3CH2OH和二甲醚CH3OCH3；C2H4O2有乙酸和甲酸甲酯。","tip":"同通式先想官能团异构，CnH2nO2=羧酸或酯。"},"3|3|k|5":{"explain":"常考数目直接记：C4H10两种；C5H12三种；C4H9Cl四种（两种丁烷各2种一氯代位置）；C4H8烯烃3种（1-丁烯、2-丁烯、异丁烯）。","example":"例：C4H10O的醇类有4种（对应C4H9OH，C4H9有4种），同分异构体总数7种（4醇加3醚）。","tip":"「C4H9有4种」是万能钥匙：C4H9Cl、C4H9OH、C4H9COOH都4种。"},"3|3|k|6":{"explain":"手性碳：连4个互不相同的原子或基团的碳原子，该分子存在手性异构（镜像不能重合）。判断方法：找连4个不同基团的碳。","example":"例：乳酸CH3CH(OH)COOH中间碳连4个不同基团（-CH3、-OH、-H、-COOH），是手性碳。","tip":"手性碳「四不同」：连4个不同原子或基团才是。"},"3|3|d|0":{"explain":"命名易错点：烯烃主链必须含双键且编号使双键位次最小（如CH3CH=CHCH3是2-丁烯不是1-丁烯）；多个支链按位次和最小编号、相同支链合并。","example":"例：CH3-CH=C(CH3)-CH3命名为2-甲基-2-丁烯（双键位次2最小）。","tip":"烯烃编号「双键优先最小」，含官能团主链必须包含官能团。"},"3|3|d|1":{"explain":"有序书写三步：先写碳链异构（主链依次减碳），再固定官能团写位置异构，最后考虑官能团异构（换官能团类型）。","example":"例：C5H10O的醛有4种：戊醛2种加2-甲基丁醛2种，先碳链后位置再官能团，有序书写防遗漏。","tip":"书写顺序固定「碳链→位置→官能团」，写完检查是否漏重。"},"3|3|d|2":{"explain":"限定条件题先画骨架：含苯环先画苯环，再安排取代基种类与位置（邻间对），最后排剩余碳链。","example":"例：C7H8O含苯环，可能为苯甲醇、邻/间/对甲酚、苯甲醚共5种，先苯环再官能团位置。","tip":"限定条件先画骨架（苯环、官能团）再排位置，逐类排查。"},"3|3|d|3":{"explain":"等效氢法：对称位置的氢等效（同一位置的氢被取代产物相同）。判断一氯代物数=等效氢种类数。如2,2-二甲基丙烷4个甲基等效只有1种氢。","example":"例：2,2-二甲基丙烷一氯代物1种（4个甲基等效）；甲苯一氯代物4种（苯环3种加甲基1种）。","tip":"等效氢看对称轴：轴对称与中心对称位置的氢等效。"},"3|3|e|0":{"explain":"大题第一问常考命名与官能团：按「选主链、编号、写名称」三步；识别官能团名称（羟基、醛基、羧基、酯基、碳碳双键）。注意酚、醇区分。","tip":"命名写完检查编号是否最小、官能团是否入主链。"},"3|3|e|1":{"explain":"C4H10O：醇4种（C4H9OH）+醚3种=7种；C5H10O2：羧酸4种（C4H9COOH）+酯多种。先定官能团类别再数碳链与位置。","example":"例：C4H10O有7种同分异构体（4醇+3醚），用C4H9有4种、C3H7有2种等基数。","tip":"记住「C4H9有4种、C3H7有2种、C2H5有1种」，直接套用数异构。"},"3|3|e|2":{"explain":"核磁共振氢谱峰数=等效氢种类数、峰面积比=氢原子数比；特征反应定官能团（银镜=醛基、NaHCO3放CO2=羧基、FeCl3显紫=酚羟基）。","example":"例：能发生银镜反应且氢谱只有1组峰的物质可为乙二醛OHC-CHO（2个醛基氢等效）。","tip":"氢谱峰数=等效氢种数，峰面积比=氢数比，与对称性结合。"},"3|3|e|3":{"explain":"分类看官能团与结构：脂肪烃（链状）、芳香烃（含苯环）；含羟基的醇（链烃基）与酚（苯环直接连OH）；醛、酮、羧酸、酯按官能团区分。","tip":"酚羟基直接连苯环，醇羟基连链烃基，别混。"},"3|4|k|0":{"explain":"烷烃通式CnH2n+2（饱和烃），碳碳单键，性质稳定：只能发生取代（光照卤代）和燃烧（氧化），不能发生加成反应（无双键）。","example":"例：C3H8通式C3H8符合CnH2n+2，与Cl2光照发生取代，不能使溴水褪色。","tip":"烷烃「只能取代不能加成」，通式CnH2n+2判断饱和。"},"3|4|k|1":{"explain":"烯烃含碳碳双键，通式CnH2n，性质活泼：加成（H2、X2、HX、H2O）、加聚成高分子、被KMnO4氧化。使溴水褪色是加成、使KMnO4褪色是氧化。","example":"例：乙烯与H2O加成制乙醇：CH2=CH2+H2O→CH3CH2OH（催化剂加热加压）；加聚成聚乙烯。","tip":"烯烃「能加成能加聚」，溴水KMnO4都褪色。"},"3|4|k|2":{"explain":"乙炔含碳碳三键，直线形分子，性质比烯烃更活泼：与Br2加成分两步（先1 mol生成CHBr=CHBr，再1 mol生成CHBr2CHBr2）；能被KMnO4氧化褪色。","example":"例：乙炔通入足量溴水：CH≡CH+2Br2=CHBr2CHBr2，最终产物为四溴乙烷。","tip":"三键加成分两步，足量溴水生成四溴代物。"},"3|4|k|3":{"explain":"苯易取代难加成：与Br2（FeBr3催化）卤代、与浓硝酸（浓硫酸催化）硝化；甲苯中甲基受苯环影响被KMnO4氧化为-COOH（苯甲酸），说明有α-H的苯同系物能被氧化。","example":"例：甲苯使酸性KMnO4褪色生成苯甲酸C6H5COOH；苯本身不能使KMnO4褪色。","tip":"苯环稳定不褪色，苯的同系物侧链可被氧化（有α-H才行）。"},"3|4|k|4":{"explain":"卤代烃两大反应：水解（NaOH水溶液加热，-X换为-OH）；消去（NaOH醇溶液加热，相邻碳脱HX成双键）。检验卤素：先水解，再加稀硝酸酸化，最后加AgNO3看沉淀颜色。","example":"例：检验CH3CH2Br中Br：加NaOH水溶液加热水解，加稀硝酸酸化，滴AgNO3有淡黄色AgBr沉淀。","tip":"检验卤素顺序「水解→酸化→AgNO3」，酸化不能省。"},"3|4|k|5":{"explain":"醇的性质由羟基决定：与Na置换放H2；浓硫酸170 ℃消去成烯烃；催化氧化：羟基碳有2个H（-CH2OH）氧化成醛、有1个H（-CHOH）氧化成酮、无H不能催化氧化。","example":"例：乙醇170 ℃消去成乙烯；1-丙醇氧化成丙醛，2-丙醇氧化成丙酮，羟基碳上氢数决定产物。","tip":"醇催化氧化看羟基碳上的H数：2H醛、1H酮、0H不反应。"},"3|4|k|6":{"explain":"苯酚的弱酸性（比碳酸弱但比HCO3-强）：与NaOH中和、与Na2CO3反应生成NaHCO3（不放CO2）、不与NaHCO3反应；与FeCl3显紫色；与溴水生成三溴苯酚。","example":"例：苯酚与Na2CO3：C6H5OH+Na2CO3=C6H5ONa+NaHCO3（不产生CO2）；与溴水生成白色三溴苯酚。","tip":"苯酚酸性「比碳酸弱比HCO3-强」：能与Na2CO3但不能与NaHCO3反应。"},"3|4|k|7":{"explain":"醛基特征反应：银镜反应（醛+银氨溶液水浴加热，析出银镜）；与新制Cu(OH)2加热生成砖红色Cu2O沉淀。醛易被氧化为羧酸（有还原性）。","example":"例：乙醛银镜反应：CH3CHO+2Ag(NH3)2OH→CH3COONH4+2Ag↓+3NH3+H2O（水浴加热）。","tip":"银镜条件「水浴加热、碱性、试管洁净」，1 mol醛基出2 mol Ag。"},"3|4|k|8":{"explain":"羧酸含-COOH显酸性，与醇酯化（酸脱羟基醇脱氢，可逆）；酯水解生成酸和醇，碱性条件（皂化）水解完全且产物为羧酸盐和醇。","example":"例：乙酸乙酯在NaOH溶液中水解：CH3COOC2H5+NaOH=CH3COONa+C2H5OH（皂化，不可逆）。","tip":"酯碱性水解写「皂化」，产物是羧酸钠和醇，酸性水解生成酸和醇。"},"3|4|d|0":{"explain":"条件一字之差反应不同：NaOH水溶液加热→水解（-X→-OH）；NaOH醇溶液加热→消去（脱HX成烯烃）。写方程式与判断产物先看溶剂是水还是醇。","example":"例：CH3CH2Br与NaOH水溶液加热得乙醇；与NaOH醇溶液加热得乙烯，溶剂不同反应类型不同。","tip":"「水水解、醇消去」，溶剂决定反应类型。"},"3|4|d|1":{"explain":"看羟基碳上氢原子数：-CH2OH（2个H）氧化成醛；-CHOH（1个H）氧化成酮；-C(OH)（无H）不能催化氧化。如乙醇（2H）成乙醛，叔丁醇（0H）不反应。","example":"例：CH3CH2OH→CH3CHO（醛）；CH3CH(OH)CH3→CH3COCH3（酮）；(CH3)3COH不能催化氧化。","tip":"记口诀「二醛一酮零不反应」，先看羟基碳连几个H。"},"3|4|d|2":{"explain":"银镜反应三条件：水浴加热（不能直接加热）、碱性（银氨溶液本身碱性）、试管洁净（否则银镜不亮）。定量关系：1 mol -CHO生成2 mol Ag。","example":"例：0.5 mol乙醛完全银镜反应生成1 mol Ag；银氨溶液须现配现用，1 mol醛基定量出2 mol银。","tip":"银镜「水浴、洁净、碱性」，定量1 mol醛基2 mol银。"},"3|4|d|3":{"explain":"特征反应反推官能团：与Na放H2→羟基或羧基；与NaHCO3放CO2→羧基；溴水褪色→碳碳双键；银镜→醛基；FeCl3显紫→酚羟基。","example":"例：某有机物能与NaHCO3放CO2又能银镜，则含羧基和醛基，由特征反应推官能团。","tip":"官能团推断「试剂-现象-官能团」对应表要背熟。"},"3|4|e|0":{"explain":"烃燃烧通式CxHy+(x+y/4)O2→xCO2+(y/2)H2O：等物质的量烃耗氧看(x+y/4)大小；等质量烃耗氧看含氢量；100 ℃以上水为气态时体积变化ΔV=y/4-1。","example":"例：等物质的量C2H6与C2H4燃烧，C2H6耗氧多（3.5大于3）；等质量CH4耗氧最多（含氢量最高）。","tip":"燃烧计算看「x+y/4」与含氢量，水蒸气体积变化看y/4-1。"},"3|4|e|1":{"explain":"酸性顺序：乙酸大于碳酸大于苯酚大于碳酸氢根大于乙醇。乙酸与NaHCO3、Na2CO3都放CO2；苯酚与Na2CO3生成NaHCO3不放CO2；乙醇都不反应。","example":"例：鉴别乙醇、苯酚、乙酸：加NaHCO3放CO2的是乙酸；加Na2CO3能反应生成NaHCO3的是苯酚；均无明显现象的是乙醇。","tip":"酸性排序「乙酸大于碳酸大于苯酚大于HCO3-大于乙醇」，据此选试剂。"},"3|4|e|2":{"explain":"判断反应类型看断键特征：取代（有进有出，卤代、酯化、水解）；加成（只进不出，双键三键加H2、X2、HX）；消去（脱小分子成双键）；氧化（加氧去氢）；还原（加氢去氧）。","tip":"反应类型看「成键断键特征」，消去与取代看溶剂，加聚缩聚看有无小分子。"},"3|4|e|3":{"explain":"核心转化链（大题骨架）：卤代烃水解成醇、醇氧化成醛、醛氧化成羧酸、醇酸酯化成酯。写转化时注意条件：水解NaOH水溶液加热、氧化Cu或Ag加热、酯化浓硫酸加热。","example":"例：CH3CH2Br→CH3CH2OH（NaOH水溶液）→CH3CHO（O2/Cu）→CH3COOH→CH3COOC2H5（浓硫酸）。","tip":"转化链「卤→醇→醛→酸→酯」每步条件写全，这是大题得分基础。"},"3|5|k|0":{"explain":"葡萄糖含5个羟基和1个醛基，是多羟基醛：能银镜反应（水浴加热）和新制Cu(OH)2加热生成砖红色Cu2O，是检验葡萄糖（还原性糖）的方法。","example":"例：葡萄糖与新制Cu(OH)2加热生成砖红色沉淀，可检验糖尿病人的尿糖，是还原性糖的特征反应。","tip":"葡萄糖「多羟基醛」，醛基决定银镜与Cu(OH)2反应。"},"3|5|k|1":{"explain":"同分异构体成对记：葡萄糖与果糖（C6H12O6）；蔗糖与麦芽糖（C12H22O11）。注意淀粉与纤维素不是同分异构体（n不同）。","example":"例：葡萄糖C6H12O6与果糖C6H12O6分子式相同结构不同，互为同分异构体。","tip":"「葡果、蔗麦」两对同分异构体，淀粉纤维素不是。"},"3|5|k|2":{"explain":"二糖水解产物：蔗糖水解生成1分子葡萄糖+1分子果糖；麦芽糖水解生成2分子葡萄糖。蔗糖无还原性（非还原糖），水解后才有还原性。","example":"例：蔗糖水解产物是葡萄糖和果糖各1分子，麦芽糖水解得2分子葡萄糖，二者水解产物不同。","tip":"蔗糖→葡+果，麦芽糖→2葡，水解后蔗糖才有还原性。"},"3|5|k|3":{"explain":"淀粉遇碘变蓝（检验淀粉）；淀粉水解（酸催化或酶）最终产物葡萄糖；纤维素水解最终也生成葡萄糖，但人体缺乏相应酶不能消化纤维素（膳食纤维）。","example":"例：淀粉水解液加碘水不变蓝说明水解完全；水解最终产物葡萄糖用Cu(OH)2检验。","tip":"淀粉检验「遇碘变蓝」，水解产物葡萄糖；纤维素人体不消化。"},"3|5|k|4":{"explain":"油脂（高级脂肪酸甘油酯）是混合物：酸性水解生成高级脂肪酸和甘油；碱性水解（皂化）生成高级脂肪酸钠（肥皂）和甘油。不饱和油脂能使溴水褪色。","example":"例：皂化反应：(C17H35COO)3C3H5+3NaOH→3C17H35COONa+C3H5(OH)3，产物是肥皂和甘油。","tip":"油脂是混合物不是高分子化合物，皂化=碱性水解制肥皂。"},"3|5|k|5":{"explain":"蛋白质由氨基酸经脱水缩合（肽键）形成，水解最终产物是氨基酸；氨基酸含-NH2（碱性）和-COOH（酸性），具有两性。","example":"例：蛋白质水解最终产物是氨基酸；氨基酸既能与酸又能与碱反应（两性），由肽键连接形成。","tip":"蛋白质→氨基酸，氨基酸两性（氨基碱、羧基酸）。"},"3|5|k|6":{"explain":"蛋白质四性质：盐析（加轻金属盐析出，加水复原，可逆物理变化）；变性（加热、重金属盐、强酸强碱、紫外线，不可逆化学变化）；颜色反应（浓硝酸变黄）；灼烧有烧焦羽毛气味。","example":"例：检验蛋白质：灼烧有烧焦羽毛气味；浓硝酸使含苯环蛋白质变黄，两种方法均可鉴别。","tip":"盐析可逆物理、变性不可逆化学，浓硝酸变黄是颜色反应。"},"3|5|k|7":{"explain":"核酸（DNA、RNA）由许多核苷酸聚合而成，核苷酸含碱基、五碳糖和磷酸；DNA双螺旋存储遗传信息，RNA参与蛋白质合成。","example":"例：DNA由脱氧核苷酸聚合而成，是遗传信息的载体；RNA由核糖核苷酸聚合，参与蛋白质合成。","tip":"核酸由核苷酸聚合，是遗传信息载体。"},"3|5|d|0":{"explain":"按能否水解分类：单糖（葡萄糖、果糖）不能再水解；二糖（蔗糖、麦芽糖）水解成2分子单糖；多糖（淀粉、纤维素）水解成多分子葡萄糖。","example":"例：葡萄糖不能水解（单糖）；蔗糖水解成葡萄糖和果糖（二糖）；淀粉水解最终得葡萄糖（多糖）。","tip":"单糖不水解、二糖多糖可水解，水解产物都是单糖。"},"3|5|d|1":{"explain":"检验淀粉水解程度三件事：加碘水检验淀粉是否剩余（变蓝=有剩余）；加NaOH中和催化剂硫酸（否则Cu(OH)2被酸消耗）后再加新制Cu(OH)2检验葡萄糖。","example":"例：淀粉部分水解：碘水变蓝且Cu(OH)2有砖红色；完全水解：碘水不变蓝，两现象组合判断程度。","tip":"检验葡萄糖前必须加NaOH中和硫酸，这是实验得分点。"},"3|5|d|2":{"explain":"油脂是高级脂肪酸甘油酯的混合物（分子量不大）不是高分子；淀粉、纤维素、蛋白质分子量巨大是天然高分子化合物；塑料、合成纤维、合成橡胶是合成高分子。","example":"例：油脂不是高分子化合物（分子量小）；蛋白质、淀粉、纤维素是天然高分子，高分子看分子量大小。","tip":"「油脂不是高分子」是常设陷阱，高分子看分子量巨大。"},"3|5|d|3":{"explain":"区分要点：盐析加轻金属盐（Na2SO4等），蛋白质析出，加水复原，可逆，用于分离提纯；变性加热、重金属盐、强酸强碱、紫外线，不可逆，用于消毒。","example":"例：加饱和Na2SO4使蛋白质析出是盐析（可逆）；加CuSO4使蛋白质凝固是变性（不可逆）。","tip":"「轻盐盐析可逆，重金属盐变性不可逆」，消毒杀菌是变性。"},"3|5|e|0":{"explain":"检验方法汇总：葡萄糖加新制Cu(OH)2加热砖红色或银镜；淀粉加碘水变蓝；蛋白质加浓硝酸变黄、灼烧焦羽毛味。注意银镜水浴加热、Cu(OH)2要新制且碱性。","tip":"检验试剂与现象一一对应，条件（新制、加热、碱性）写全。"},"3|5|e|1":{"explain":"水解条件：酸催化（稀硫酸）或酶，加热。产物：蔗糖→葡萄糖+果糖；麦芽糖→2葡萄糖；淀粉→最终葡萄糖；纤维素→葡萄糖。","tip":"蔗糖水解产物是「葡萄糖+果糖」各一分子，别写成两分子葡萄糖。"},"3|5|e|2":{"explain":"皂化：油脂+NaOH→高级脂肪酸钠（肥皂）+甘油；去污原理：肥皂亲油基插油污、亲水基溶于水，把油污乳化成小油滴；硬化油：不饱和油脂催化加氢变饱和。","tip":"硬化油=不饱和油脂加氢，油脂氢化是加成（还原）反应。"},"3|5|e|3":{"explain":"应用：加热、酒精、紫外线、重金属盐使蛋白质变性，用于消毒杀菌；重金属盐中毒喝牛奶、蛋清，让重金属与奶中蛋白质先变性，减少人体蛋白质损伤。","tip":"中毒急救「喝牛奶蛋清」，原理是蛋白质变性，医院消毒也是变性应用。"},"3|6|k|0":{"explain":"转化链骨架：R-X→R-OH（水解NaOH水溶液）→R-CHO（氧化）→R-COOH（氧化）→R-COOR'（酯化浓硫酸）。每条转化写清试剂条件，是合成路线设计的基础。","example":"例：CH3CH2Br→CH3CH2OH→CH3CHO→CH3COOH→CH3COOC2H5，条件依次为NaOH水溶液、O2/Cu、O2、浓硫酸。","tip":"转化链「卤醇醛酸酯」每步条件写全，逆推时倒着用。"},"3|6|k|1":{"explain":"官能团引入方法：引入双键——卤代烃NaOH醇溶液消去或醇浓硫酸170 ℃消去；引入卤原子——烷烃光照取代、烯烃与HX、X2加成；引入羟基——卤代烃水解或烯烃与水加成。","example":"例：由CH3CH2Br制CH2=CH2：NaOH醇溶液加热消去；由CH2=CH2制CH3CH2Br：与HBr加成。","tip":"引入官能团方法归类记忆，双键消去、卤素取代加成。"},"3|6|k|2":{"explain":"加成是引入官能团的温和方法：烯烃+H2O→醇（催化剂加热加压）；烯烃+HX→卤代烃；烯烃、醛、酮+H2→烷烃或醇（还原）。加成不改变碳骨架。","example":"例：CH2=CH2+H2O→CH3CH2OH；CH3CHO+H2→CH3CH2OH（还原）。","tip":"加氢是还原反应，醛加氢成醇、烯烃加氢成烷烃。"},"3|6|k|3":{"explain":"氧化还原看氢氧变化：醇→醛→羧酸是加氧（去氢）氧化，用O2/Cu或KMnO4；醛、酮、烯烃加H2是还原（加氢）。","example":"例：CH3CH2OH→CH3CHO是氧化（Cu催化）；CH3CHO+H2→CH3CH2OH是还原。","tip":"「加氧氧化、加氢还原」，醇醛酸递变是氧化链。"},"3|6|k|4":{"explain":"逆合成法：从目标产物出发，考虑「要得到它，需要什么原料经什么反应」，逐步倒推到易得原料。如目标酯→醇+酸→烯烃或卤代烃→烷烃。","example":"例：合成乙酸乙酯：逆推需乙醇和乙酸，乙醇可由乙烯水化制，乙酸由乙醇氧化制，再酯化。","tip":"逆推「从产物往回推」，每步对应一个学过的转化反应。"},"3|6|k|5":{"explain":"条件与反应对应是书写关键：NaOH水溶液加热→水解成醇；NaOH醇溶液加热→消去成烯烃；浓硫酸170 ℃→醇消去；Cu或Ag加热→醇催化氧化；浓硫酸加热→酯化；光照→烷烃卤代。","example":"例：看到「NaOH醇溶液加热」写消去反应，看到「浓硫酸170 ℃」写醇消去成烯烃。","tip":"条件决定反应类型，做题先圈条件再写方程式。"},"3|6|d|0":{"explain":"逆合成双考虑：官能团转化（沿着卤醇醛酸酯链逆推）与碳骨架变化（加长碳链用卤代烃与NaCN等、缩短用消去氧化）。从目标产物每次切一个官能团对应的键。","example":"例：合成CH3CH2CH2OH：逆推可由CH3CH=CH2水化（碳骨架3碳）或CH3CH2CH2Br水解。","tip":"逆推先看碳数是否变化，再定官能团转化的路线。"},"3|6|d|1":{"explain":"多官能团物质反应会相互干扰：酚羟基易被氧化，做其他反应前先用成酯等方式保护，反应后再水解恢复；氨基同理。保护-反应-脱保护三步是合成设计难点。","example":"例：含酚羟基和醛基的分子氧化醛基前，先让酚羟基成酯保护，防其被氧化，最后水解恢复。","tip":"保护原则「易反应基团先保护」，氧化还原反应前常需保护。"},"3|6|d|2":{"explain":"推断三步：由分子式算不饱和度Ω=(2C+2-H-X+N)/2定可能结构（Ω=1可能双键或环、Ω=4可能苯环）；特征反应定官能团；氢谱峰数与峰面积比定具体结构。","example":"例：C2H4O2不饱和度1，能与NaHCO3放CO2说明含羧基，为乙酸CH3COOH。","tip":"不饱和度+特征反应+氢谱三招联合推断，逐步缩小范围。"},"3|6|d|3":{"explain":"评价合成路线角度：步骤数（越少越好）、总产率（步骤多产率低）、原子经济性（原子利用率高、副产物少）、条件（温和、安全、环保）。","example":"例：加成反应原子利用率100%（无副产物）优于取代反应，绿色化学优先选，评价看步骤与产率。","tip":"评价路线「步骤少、产率高、原子经济、条件温和」四角度。"},"3|6|e|0":{"explain":"大题四问应对：由转化关系与信息定结构简式；写方程式注意条件与可逆号；反应类型判断看断键特征；同分异构体按「碳链→位置→官能团」有序写。","tip":"大题先读完全部信息再推断，方程式检查条件与配平。"},"3|6|e|1":{"explain":"新信息迁移：先读懂信息中断键成键位置（画圈标记），把陌生反应当「新工具」插入合成路线。","tip":"新信息先圈「断键成键」位置，再按信息模仿写产物。"},"3|6|e|2":{"explain":"联合推断流程：分子式→不饱和度→特征反应（定官能团）→红外（定化学键）→核磁（定氢种类与比）→拼结构。数据互相印证。","tip":"数据联合推断「先官能团后骨架」，氢谱峰数核对等效氢。"},"3|6|e|3":{"explain":"书写路线模板「反应物→条件→产物」：每步写试剂、催化剂、温度（如NaOH水溶液加热、浓硫酸加热、Cu加热）。条件不全要扣分。","tip":"路线题条件必须写全「试剂+条件」，一步一条件别省。"},"4|0|k|0":{"explain":"仪器要点：容量瓶（定容，不能溶解加热久存）；分液漏斗（萃取分液，下层下口放、上层上口倒）；冷凝管（冷水下进上出）；坩埚（灼烧固体）；蒸发皿（蒸发浓缩）。","example":"例：蒸馏时冷凝管冷水「下进上出」冷凝效果好；蒸发浓缩用蒸发皿，灼烧固体用坩埚，仪器用途分清。","tip":"坩埚灼烧固体、蒸发皿蒸发液体，冷凝管水流下进上出。"},"4|0|k|1":{"explain":"方法选择看性质差异：固液分离过滤；从溶液得固体蒸发（或结晶）；互溶液体沸点不同蒸馏；溶解度差异大萃取分液；胶体与溶液渗析；蛋白质盐析。","example":"例：分离KNO3和NaCl用结晶（溶解度随温度变化差异大）；分离酒精和水用蒸馏。","tip":"分离方法「看状态与性质差异」，萃取分液看溶解度差异。"},"4|0|k|2":{"explain":"离子检验规范：Cl-先加稀硝酸酸化再加AgNO3（白色沉淀不溶于硝酸）；SO4(2-)先加盐酸无沉淀再加BaCl2；NH4+加NaOH加热，湿润红色石蕊试纸变蓝。","example":"例：检验SO4(2-)：先加足量盐酸无现象，再加BaCl2出现白色沉淀，证明含SO4(2-)。","tip":"检验SO4(2-)「先盐酸后BaCl2」，检验Cl-「先硝酸后AgNO3」。"},"4|0|k|3":{"explain":"装置与反应物状态对应：固固加热制O2、NH3；固液不加热制H2、CO2；固液加热制Cl2、SO2。","example":"例：制Cl2用固液加热装置，制O2用固固加热装置，制CO2用固液不加热装置，看反应物状态与条件。","tip":"装置选择「看状态与条件」：固固加热、固液加热、固液不加热三类。"},"4|0|k|4":{"explain":"净化原则：除杂试剂只与杂质反应不消耗目标气体；顺序先除杂后干燥。防倒吸：易溶气体（NH3、HCl）用倒扣漏斗或安全瓶；尾气处理：有毒气体用溶液吸收或燃烧。","example":"例：制Cl2除HCl用饱和食盐水，干燥用浓硫酸；NH3尾气用倒扣漏斗防倒吸，除杂干燥顺序别颠倒。","tip":"防倒吸「倒扣漏斗+安全瓶」，除杂「先除杂后干燥」。"},"4|0|k|5":{"explain":"保存原则看性质：钠活泼放煤油中；白磷易自燃放冷水中；NaOH与玻璃反应密封且用橡胶塞；浓硝酸见光分解用棕色瓶避光；氢氟酸用塑料瓶。","example":"例：浓硝酸用棕色瓶避光保存（见光分解）；NaOH溶液用橡胶塞试剂瓶，保存方式由性质决定。","tip":"药品保存「性质决定方式」：活泼、自燃、分解、腐蚀对应保存法。"},"4|0|k|6":{"explain":"安全要点：酒精灯用火柴点燃、灯帽盖灭，不能对点、不能吹灭；蒸馏加热加碎瓷片防暴沸；有毒气体在通风橱操作；酒精着火用湿布盖灭。","example":"例：蒸馏时忘加碎瓷片会暴沸，须停止加热冷却后再补加，加热液体前务必先加碎瓷片防暴沸。","tip":"事故处理「酸溅先擦再冲、碱溅硼酸中和」，蒸馏必加碎瓷片。"},"4|0|d|0":{"explain":"目的不同：蒸馏分离沸点不同的互溶液体（如酒精与水），用蒸馏烧瓶+冷凝管；蒸发是加热使溶剂汽化得固体溶质（如食盐水得食盐），用蒸发皿。蒸发结晶不能蒸干。","example":"例：从海水中得食盐用蒸发结晶；分离酒精与水用蒸馏，蒸馏得液体、蒸发得固体，目的不同。","tip":"蒸馏得液体、蒸发得固体，蒸发不能蒸干（防晶体飞溅）。"},"4|0|d|1":{"explain":"分液漏斗操作要点：使用前检漏；振荡后打开活塞放气（防气压过大）；静置分层；下层液体从下口放出，上层液体从上口倒出。萃取剂要互不相溶且溶质溶解度差异大。","example":"例：用CCl4萃取碘水：下层CCl4层（紫红色）从下口放出，上层水从上口倒出，分液顺序别乱。","tip":"分液「下层下口放、上层上口倒」，萃取剂与水互不相溶。"},"4|0|d|2":{"explain":"收集方法选择：不溶于水且不与水反应用排水法（H2、O2、NO）；密度大于空气向上排空气（CO2、Cl2）；密度小于空气向下排空气（NH3）；与空气反应的气体只能排水法。","example":"例：NO只能用排水法收集（与O2反应）；NH3用向下排空气法；Cl2用向上排空气法。","tip":"收集看「溶解性与密度」，与空气反应的气体只能排水法。"},"4|0|d|3":{"explain":"除杂三原则：不引入新杂质、不消耗被提纯物、杂质易分离。试剂过量的要再除去（过量BaCl2除SO4(2-)后用Na2CO3除Ba2+，再用盐酸除CO3(2-)）。","example":"例：除去NaCl中CaCl2和Na2SO4：加过量BaCl2、再加过量Na2CO3、最后加盐酸调pH，顺序不能乱。","tip":"除杂「不引新杂、不损主体、易分离」，过量试剂要除尽。"},"4|0|e|0":{"explain":"操作正误题看细节：读数视线与凹液面最低处相平；定容平视刻度线；容量瓶不能溶解；加热试管液体不超三分之一、先预热；过滤「一贴二低三靠」。","tip":"操作判断题盯「读数、定容、加热、洗涤」四类细节。"},"4|0|e|1":{"explain":"方法选择看差异：溶解度差异大（萃取、结晶）、沸点差异（蒸馏）、密度差异（分液）、固体与液体（过滤）、胶体与溶液（渗析）。","tip":"分离题先想「利用什么性质差异」，再对号入座选方法。"},"4|0|e|2":{"explain":"装置连接顺序「发生→除杂→干燥→收集→尾气」，每个洗气瓶「长进短出」，最后尾气处理（吸收或燃烧）。评价装置看能否达到目的、有无安全隐患。","tip":"连接顺序「发生除杂干燥收集尾气」，洗气瓶长进短出。"},"4|0|e|3":{"explain":"方案评价三角度：可行性（能否发生、条件能否达到）；安全性（防爆防毒防倒吸）；环保性（尾气处理、原子利用率、无污染）。","tip":"评价模板「可行、安全、环保」三角度答题。"},"4|1|k|0":{"explain":"定量实验三件套：中和滴定（滴定管选择、指示剂变色范围、终点半分钟不褪色、误差分析看消耗体积偏差）；配制溶液（八步操作）；气体体积测定（量气装置、液面平齐读数）。","example":"例：盐酸滴定NaOH用酚酞，终点时溶液由红色变无色且半分钟内不褪色，读数保留到0.01 mL。","tip":"中和滴定终点「半分钟不褪色」，读数估读到小数点后2位。"},"4|1|k|1":{"explain":"探究流程：明确实验目的→提出假设→设计实验（控制变量、设对比组）→预测现象→实验验证→得出结论。答题按「假设-方案-现象-结论」四步组织。","example":"例：探究温度对速率影响：设计两组仅温度不同的对比实验，预测高温组更快出现现象，实验验证后得出结论。","tip":"探究题答题模板「目的→假设→方案→现象→结论」。"},"4|1|k|2":{"explain":"混合气体检验逻辑：先检验并除去干扰气体，再检验目标气体，最后确认干扰气体已除尽。如SO2与CO2混合气：品红检验SO2→KMnO4除SO2→品红确认除尽→石灰水检验CO2。","example":"例：检验CO2前必须先除尽SO2并用另一品红确认，否则SO2也使石灰水变浑浊干扰结论。","tip":"检验逻辑「先除干扰、确认除尽、再检目标」。"},"4|1|k|3":{"explain":"表述模板「操作→现象→结论」：取少量样品于试管，加入某试剂，若出现某现象，则证明含有某物质。现象与结论对应，逻辑严密。","example":"例：检验Cl-：取少量溶液，加稀硝酸酸化，滴加AgNO3，若产生白色沉淀，则含Cl-。","tip":"规范表述「操作-现象-结论」三步，缺一不可。"},"4|1|k|4":{"explain":"数据处理规范：平行实验多次测量取平均值；明显异常数据（偏差大）舍弃；计算相对误差=(测定值-真实值)/真实值×100%。","example":"例：三次滴定消耗体积18.10、18.15、20.50 mL，20.50 mL异常舍弃，取前两次平均18.125 mL。","tip":"异常数据（偏差过大）舍弃再取平均，误差计算带符号。"},"4|1|d|0":{"explain":"终点判断要点：接近终点时逐滴滴加（最后半滴），溶液颜色突变且半分钟内不褪色即为终点；滴定管读数精确到0.01 mL，酸式装酸和氧化性溶液、碱式装碱。","example":"例：用盐酸滴定NaOH（酚酞）：滴入最后半滴盐酸，溶液由浅红色变无色，半分钟不褪色即达终点。","tip":"终点「半滴变色半分钟不褪」，滴定管读数保留两位小数。"},"4|1|d|1":{"explain":"误差分析统一思路：操作影响「消耗标准液体积V」，V偏大则待测浓度偏大。读数：滴定前俯视、滴定后仰视使V偏大，浓度偏大。","example":"例：滴定前平视、终点仰视读数，消耗体积偏大，测得NaOH浓度偏大，误差分析看体积偏差。","tip":"误差分析「看消耗体积偏差」，读数「前俯后仰体积偏大」。"},"4|1|d|2":{"explain":"控制变量核心：探究某因素影响时只改变该因素，其余（浓度、温度、体积、试剂）完全相同，设置对比组。","example":"例：探究浓度对反应速率影响：两组仅Na2S2O3浓度不同，温度、体积相同，比较出现浑浊时间。","tip":"控制变量「只变一个、其余相同」，对比实验才严谨。"},"4|1|d|3":{"explain":"设计方案步骤：明确目的→选择原理（题给信息或学过的反应）→设计操作（取样、加试剂、条件）→预测现象→得出结论。注意试剂过量处理、对照实验与安全环保。","example":"例：设计实验证明某气体是CO2：将气体通入澄清石灰水，变浑浊则含CO2，操作现象结论完整。","tip":"设计方案「原理→操作→现象→结论」，对照与安全不能少。"},"4|1|e|0":{"explain":"滴定计算：c(待测)=c(标准)×V(标准)×计量比/V(待测)，取合理平均值；误差分析看V(标准)偏差。注意指示剂选择、滴定管选择与终点判断。","example":"例：0.1000 mol/L盐酸滴定25.00 mL NaOH耗20.00 mL，c(NaOH)=0.1000×20.00/25.00=0.08000 mol/L。","tip":"滴定计算代入平均体积，误差看标准液体积偏差。"},"4|1|e|1":{"explain":"综合题四问：解释现象（用原理说明原因）；得出结论（由现象推结论）；评价方案（对照、变量、可行性）；改进方案（补对照、控变量、加尾气处理）。","tip":"评价改进题从「对照、变量、安全环保」找问题。"},"4|1|e|2":{"explain":"严谨性看三点：有无对照实验（排除干扰）；能否达到实验目的（原理可行）；操作是否规范（取样量、条件）。如检验SO4(2-)未先加盐酸排除CO3(2-)就不严谨。","tip":"严谨性「对照、目的、规范」三查，缺对照即不严谨。"},"4|1|e|3":{"explain":"关系式法：由已知与未知建立计量关系。测CaCO3纯度：CaCO3+2HCl=CaCl2+CO2↑+H2O，测CO2体积或质量，由n(CO2)=n(CaCO3)求纯度。","example":"例：0.5 g样品产生112 mL CO2（标况，0.005 mol），则n(CaCO3)=0.005 mol，质量0.5 g，纯度100%。","tip":"关系式法「计量关系换算」，量气注意读数时液面平齐。"},"4|2|k|0":{"explain":"流程题读图框架：原料预处理（粉碎增大接触面积、焙烧除杂或转化、酸浸碱浸溶解）、核心反应、分离提纯（过滤、结晶、调节pH沉淀）、产品获得。按四段分段分析。","example":"例：读铝土矿提铝流程：先碱浸溶Al2O3除Fe2O3、SiO2，再通CO2沉淀Al(OH)3，灼烧得Al2O3后电解。","tip":"读流程按「预处理、反应、分离、产品」四段定位问题。"},"4|2|k|1":{"explain":"操作目的要会答：粉碎、研磨——增大接触面积、加快反应速率；加热——提高速率、增大溶解度；搅拌——使反应充分、受热均匀；过量试剂——保证反应完全。","example":"例：矿石粉碎浸取可加快浸取速率，因接触面积增大，反应速率提高，加热搅拌也有类似作用。","tip":"答操作目的模板「增大接触面积、加快速率、使反应充分」。"},"4|2|k|2":{"explain":"浸取作用分析：酸浸（加盐酸、硫酸）溶解金属氧化物等目标成分进入溶液（如Al2O3+6H+=2Al3++3H2O）；碱浸溶解两性物质（Al2O3、SiO2）或油脂；同时除去不溶杂质。","example":"例：铝土矿（Al2O3、Fe2O3、SiO2）盐酸酸浸：Al2O3、Fe2O3溶解进入溶液，SiO2不与盐酸反应留在滤渣。","tip":"酸浸写离子方程式，注意两性氧化物碱浸也能溶。"},"4|2|k|3":{"explain":"流程中常见套路：加H2O2（或O2、Cl2）把Fe2+氧化为Fe3+，因为Fe3+在较低pH就能沉淀完全（pH约3到4），而Fe2+需pH更高，氧化后便于调节pH除去铁。","example":"例：含Fe2+溶液加H2O2：2Fe2++H2O2+2H+=2Fe3++2H2O，再调pH使Fe3+沉淀除去。","tip":"氧化Fe2+为Fe3+常用H2O2（不引入杂质），便于pH沉淀分离。"},"4|2|k|4":{"explain":"调节pH分离：不同离子沉淀完全的pH不同，控制pH使杂质离子（Fe3+）先沉淀完全、目标离子（如Zn2+、Ni2+）不沉淀，过滤分离。常用金属氧化物或碳酸盐调pH（不引入新杂质）。","example":"例：含Zn2+、Fe3+溶液加ZnO调pH至4，Fe3+沉淀完全而Zn2+不沉淀，过滤除去Fe(OH)3。","tip":"调pH「让杂质先沉、目标不沉」，调pH试剂选不引入杂质的。"},"4|2|k|5":{"explain":"结晶方法选择看溶解度曲线：溶解度随温度变化大（陡升型，如KNO3）用蒸发浓缩、冷却结晶；变化小（平缓型，如NaCl）用蒸发结晶。答题写「蒸发浓缩、冷却结晶、过滤、洗涤、干燥」。","example":"例：从KNO3和NaCl混合物中提KNO3：蒸发浓缩、冷却结晶、过滤，KNO3析出。","tip":"「陡冷却、平蒸发」：溶解度变化大冷却结晶，变化小蒸发结晶。"},"4|2|k|6":{"explain":"绿色化学答题点：母液循环利用（提高利用率、减少排放）；尾气处理（吸收有害气体）；废渣回收（如阳极泥回收贵金属）；废水处理达标排放。","example":"例：侯氏制碱法中母液循环利用NaCl，既提高原料利用率又减少废液排放，体现绿色化学。","tip":"绿色化学答题「循环、处理、回收」三个关键词。"},"4|2|d|0":{"explain":"流程图中pH范围是重要隐含信息：pH范围对应的沉淀可判断除杂对象；由Ksp算沉淀完全（离子浓度降至10-5 mol/L）所需pH，或用Q与Ksp比较判断能否沉淀。","example":"例：Ksp[Fe(OH)3]已知，令c(Fe3+)=10-5 mol/L求c(OH-)再算pH，即沉淀完全的pH。","tip":"题中给pH范围或Ksp必考「沉淀顺序与pH控制」，两数据联合用。"},"4|2|d|1":{"explain":"流程离子方程式书写：先判断溶液酸碱性（酸浸酸性、碱浸碱性），再定产物（酸性补H+、碱性补OH-），用化合价升降配平变价，最后原子电荷守恒检查。","example":"例：酸性浸取液加H2O2：2Fe2++H2O2+2H+=2Fe3++2H2O，介质H+由酸浸提供。","tip":"写流程离子方程式先看介质酸碱性，再配电荷与原子。"},"4|2|d|2":{"explain":"选氧化剂原则：只氧化目标离子、不引入杂质（H2O2最佳，产物水）；过量原因：保证反应完全、提高产率。洗涤沉淀用蒸馏水或冷水，检验是否洗净取最后一次洗涤液检验特征离子。","example":"例：检验沉淀是否洗净：取最后一次洗涤液，滴加BaCl2，若无白色沉淀则SO4(2-)已洗净。","tip":"洗净检验「取末次洗涤液验特征离子」，过量试剂目的「保证完全」。"},"4|2|d|3":{"explain":"找循环物质：看流程图中有没有某物质「生成后又回到前面步骤作原料」（箭头指回）。如侯氏制碱中CO2、NaCl循环。","example":"例：流程中若某步生成CO2又通回碳化塔，CO2即循环利用物质，看箭头是否指回前面步骤。","tip":"循环物质「看箭头指回」，生成物变原料即循环。"},"4|2|e|0":{"explain":"各金属流程套路：铝——铝土矿酸浸或碱浸除杂后电解Al2O3；铁——磁铁矿或赤铁矿还原；铜——火法或湿法（CuSO4电解精炼）；钛——TiCl4用Mg还原。","tip":"金属流程先定「冶炼方法」：电解法、热还原法对应。"},"4|2|e|1":{"explain":"条件控制答题模板：温度——太高（副反应、分解、挥发）太低（速率慢）；pH——控制沉淀、抑制水解；过量试剂——保证转化完全。按「目的+原理」组织答案。","tip":"条件目的答题「两段式」：先写目的再写原理。"},"4|2|e|2":{"explain":"方程式书写结合介质与价态；产率计算：实际产量/理论产量×100%，理论产量由计量关系（关系式法）求。注意原料纯度、损失率折算。","example":"例：10 t含80% Fe2O3的矿石炼铁，理论产铁量=10×0.8×112/160=5.6 t，实际4.48 t则产率80%。","tip":"产率=实际/理论，理论量用关系式按计量比算。"},"4|2|e|3":{"explain":"陌生元素流程解题：按流程框架（预处理→反应→分离→产品）逐段读，结合题给信息（化合价、Ksp、溶解度数据）判断反应。用学过的方法迁移。","tip":"陌生流程「套框架读题」，信息题答案多藏在题干数据里。"},"4|3|k|0":{"explain":"微粒数计算先写化学式分析组成：Na2O2由2个Na+和1个O2(2-)（过氧根离子）构成，1 mol Na2O2含2 mol Na+、1 mol O2(2-)共3 mol离子。","example":"例：1 mol Na2O2含离子总数为3NA（2NA个Na+和NA个O2(2-)），含氧原子2NA。","tip":"算微粒数先拆化学式：Na2O2是Na+和O2(2-)，不是Na+和O2-。"},"4|3|k|1":{"explain":"标况下「不是气体」清单：SO3（固体）、H2O（液体）、HF、CCl4、CHCl3、苯、乙醇、NO2（存在2NO2⇌N2O4聚合）。看到这些物质标况加22.4 L直接判错。","example":"例：标况下22.4 L SO3不是1 mol（固体）；标况下22.4 L CCl4也不是1 mol（液体）。","tip":"标况气体清单背熟：SO3、水、苯、CCl4、乙醇、HF、NO2都不是气体。"},"4|3|k|2":{"explain":"可逆反应不能进行到底：1 mol N2与3 mol H2反应生成的NH3小于2 mol，SO2与O2、Cl2与H2O同理。涉及可逆反应的微粒数或电子数都不能按完全转化算。","example":"例：1 mol N2与3 mol H2反应，生成的NH3分子数小于2NA；1 mol Cl2溶于水转移电子数小于NA。","tip":"见可逆反应（⇌）即「不能完全」，微粒数与电子数都不能按完全算。"},"4|3|k|3":{"explain":"电子转移注意歧化与部分反应：Na2O2与H2O、CO2反应中-1价氧歧化，1 mol Na2O2只转移1 mol电子；Cl2+2NaOH歧化，1 mol Cl2转移1 mol电子。","example":"例：1 mol Na2O2与足量H2O反应转移NA个电子（不是2NA）；1 mol Cl2与NaOH反应转移NA个电子。","tip":"转移电子数「按得电子数算」，歧化、部分氧化还原都要按实际电子转移。"},"4|3|k|4":{"explain":"溶液题陷阱：求水溶液中氧原子数不能只算溶质（水也含氧）；氨水中溶质是NH3（或NH3·H2O），标况下氨水是液体不能用22.4 L/mol；FeCl3溶液考虑水解使离子数减少。","example":"例：1 L 1 mol/L氨水中NH3·H2O分子数小于NA（部分电离）；水溶液中氧原子数要计入水。","tip":"溶液题「先想溶剂和电离水解」，氨水、FeCl3溶液都有陷阱。"},"4|3|k|5":{"explain":"特殊结构键数必背：SiO2含4 mol Si-O键、P4含6 mol P-P键、石墨含1.5 mol C-C键、金刚石含2 mol C-C键（均按1 mol计）。","example":"例：1 mol SiO2含4NA个Si-O键；1 mol P4含6NA个P-P键。","tip":"键数「SiO2 4、P4 6、石墨1.5、金刚石2」，分清楚共用与否。"},"4|3|d|0":{"explain":"溶液中离子数不等于溶质电离出的理论数：弱电解质（CH3COOH、NH3·H2O）部分电离，离子数偏小；盐类水解（FeCl3、Na2CO3）消耗部分离子；但强酸强碱盐完全电离。","example":"例：1 L 0.1 mol/L CH3COOH中H+数小于0.1NA（部分电离）；1 L 0.1 mol/L FeCl3中Fe3+数小于0.1NA（水解）。","tip":"溶液离子数「弱电解质电离、盐水解」都会使离子数小于理论。"},"4|3|d|1":{"explain":"使用22.4 L/mol两个条件：标准状况（0 ℃、101 kPa）且是气体。常温常压、非气体（液体、固体）都不能用。题目常给「常温常压下22.4 L」或「标况下苯」设陷阱。","example":"例：常温常压下11.2 L O2不是0.5 mol；标况下22.4 L H2O不是1 mol。","tip":"见22.4先查「标况+气体」，两者缺一即错。"},"4|3|d|2":{"explain":"标况下某些物质状态特殊：H2O是液体、SO3是固体、HF是液体（常温）、苯是液体；NO2存在2NO2⇌N2O4平衡，1 mol NO2实际气体分子数小于NA。","example":"例：标况下22.4 L NO2的分子数小于NA（部分转化为N2O4）；标况下22.4 L水不是1 mol。","tip":"状态与平衡双查：NO2聚合、N2O4、水、SO3都是陷阱。"},"4|3|d|3":{"explain":"核素计算先明确各核素中子数：D有1个、T有2个、18O有10个中子。D2O中质子数和中子数都是10；T2O中子数为12。","example":"例：1 mol D2O含质子10NA、中子10NA；1 mol T2O含中子12NA。","tip":"核素题「先数中子再乘个数」，D1中子、T2中子、18O10中子。"},"4|3|e|0":{"explain":"NA题四关排查法：状态关（标况+气体）、可逆关（⇌不能完全）、电子转移关（歧化、部分反应）、结构关（键数、离子组成）。逐项过四关。","tip":"NA题「状态、可逆、电子转移、结构」四关逐项排查。"},"4|3|e|1":{"explain":"转移电子数计算：n(e-)=n(氧化剂或还原剂)×每个粒子转移电子数，注意歧化按得电子数算、部分氧化还原按被氧化部分算。","example":"例：2Na+2H2O=2NaOH+H2↑中1 mol Na转移1 mol电子；电解1 mol CuSO4转移2 mol电子。","tip":"电子转移「先定每个粒子得失电子数」，再乘物质的量。"},"4|3|e|2":{"explain":"电解质溶液离子数：强电解质完全电离按理论算；弱电解质部分电离偏小；盐考虑水解偏小（Fe3+、CO3(2-)等）；还要考虑水的电离。","tip":"溶液离子数「强全电离、弱部分、盐水解」，三项检查。"},"4|3|e|3":{"explain":"混合气体：平均摩尔质量M平均=m总/n总；分子总数n总=V/Vm（标况）。由密度或平均摩尔质量求组成比，再算分子数。","example":"例：标况下11.2 L混合气体分子总数0.5NA，与组成无关；平均摩尔质量由总质量和总物质的量求。","tip":"分子总数看总物质的量，平均摩尔质量=总质量/总物质的量。"},"4|4|k|0":{"explain":"书写三规范：事实（产物正确，如Fe与盐酸生成Fe2+）、拆写（强酸强碱可溶盐拆，弱电解质沉淀气体单质氧化物不拆）、守恒（原子守恒+电荷守恒）。","example":"例：NaHCO3与盐酸：HCO3-+H+=H2O+CO2↑（HCO3-不拆）；Fe与盐酸：Fe+2H+=Fe2++H2↑。","tip":"检查三步「事实、拆写、守恒」，HCO3-、HSO3-等弱酸酸式根不拆。"},"4|4|k|1":{"explain":"与量问题统一方法：少量物质按1 mol完全反应，确定消耗离子比例。Ca(OH)2与NaHCO3：少量NaHCO3时生成CaCO3和水；过量NaHCO3时Ca2+和OH-全消耗。","example":"例：少量NaHCO3加入Ca(OH)2：HCO3-+OH-+Ca2+=CaCO3↓+H2O；足量时：Ca2++2OH-+2HCO3-=CaCO3↓+CO3(2-)+2H2O。","tip":"与量问题「少量按1 mol」，少量物质定比例，别漏产物。"},"4|4|k|2":{"explain":"隐含条件先翻译：无色——排除Cu2+（蓝）、Fe3+（黄）、Fe2+（浅绿）、MnO4-（紫红）；pH=1或加石蕊变红——强酸性，排除OH-、CO3(2-)、HCO3-、S2-等。","example":"例：pH=1溶液中，CO3(2-)、HCO3-、S2-、SO3(2-)、OH-都不能大量共存。","tip":"隐含条件「先翻译成酸碱性或无色」，再逐项排除。"},"4|4|k|3":{"explain":"氧化还原不共存组合：Fe3+氧化I-、S2-（2Fe3++2I-=2Fe2++I2）；MnO4-（酸性）氧化Fe2+、I-、SO3(2-)；NO3-只在酸性氧化Fe2+、I-。","example":"例：Fe3+与I-不能共存：2Fe3++2I-=2Fe2++I2；H+、NO3-、Fe2+三者也不能共存。","tip":"氧化还原不共存「强氧化剂+强还原剂」，NO3-只在酸性显氧化性。"},"4|4|k|4":{"explain":"双水解不共存组合：Al3+与HCO3-、CO3(2-)、S2-、AlO2-，Fe3+与HCO3-、CO3(2-)。相互促进水解进行到底。","example":"例：Al3+与HCO3-不能共存：Al3++3HCO3-=Al(OH)3↓+3CO2↑，产生白色沉淀和气泡。","tip":"双水解「弱碱阳离子+弱酸根」多不共存，Al3+与AlO2-也要记。"},"4|4|k|5":{"explain":"络合不共存：Fe3+与SCN-生成血红色[Fe(SCN)]2+；Cu2+与过量NH3生成深蓝色[Cu(NH3)4]2+（少量NH3先生成Cu(OH)2沉淀）。","example":"例：含Fe3+的溶液中加入KSCN变血红色，Fe3+与SCN-不能大量共存，因生成配合物。","tip":"络合陷阱「Fe3+与SCN-、Cu2+与过量NH3」，生成配合物不共存。"},"4|4|d|0":{"explain":"水电离出c(H+)=1×10-13 mol/L远小于1×10-7，说明水的电离被抑制，溶液可能是强酸也可能是强碱。两种情况都要考虑，选项须在两种环境都能共存才算正确。","example":"例：水电离c(H+)=10-13的溶液：若是酸，HCO3-、OH-不共存；若是碱，H+、NH4+、Al3+不共存。","tip":"水电离出10-13「酸碱两可」，选项要经得起两种环境考验。"},"4|4|d|1":{"explain":"与Al反应放H2：可能是强酸性溶液（非氧化性酸，不能含NO3-，因硝酸与Al不放H2）或强碱性溶液。两类环境共存要求不同，分别验证每个选项。","example":"例：与Al放H2的溶液若含NO3-则不成立（硝酸与Al不放H2）；碱性环境则H+、Al3+、NH4+不能共存。","tip":"加铝放氢「酸或碱两解」，酸环境禁NO3-，碱环境禁弱碱阳离子。"},"4|4|d|2":{"explain":"拆写细节：NH3·H2O是弱碱不拆；微溶物作生成物不拆（CaSO4↓）；浓硫酸不拆；HCO3-等弱酸酸式根不拆（HSO4-拆开）；澄清石灰水拆、石灰乳不拆。","example":"例：CO2通入氨水：CO2+NH3·H2O=NH4++HCO3-（过量少量产物不同），NH3·H2O不拆。","tip":"不拆清单「弱电解质、沉淀、气体、单质、氧化物、微溶生成物」。"},"4|4|d|3":{"explain":"与量问题通用解法：把「少量（或不足）物质」设为1 mol，写出它完全反应消耗的离子数，再按电荷配平。如少量CO2通NaOH生成CO3(2-)，过量生成HCO3-。","example":"例：少量CO2+2OH-=CO3(2-)+H2O；过量CO2+OH-=HCO3-。设少量物质1 mol即得。","tip":"「少量1 mol定比例」，先写少量物质再配其他离子。"},"4|4|e|0":{"explain":"共存题排查顺序：隐含条件（无色、酸碱环境）→氧化还原（强氧化剂+强还原剂）→双水解（弱碱阳+弱酸根）→络合（Fe3+与SCN-）。逐层排除。","tip":"共存排查「隐含→氧化还原→双水解→络合」四层过滤。"},"4|4|e|1":{"explain":"四角度找错：事实（产物错）、拆写（该拆未拆或不该拆拆了）、守恒（原子或电荷不守恒）、量的关系（过量少量产物错）。先找明显错误最快。","example":"例：Fe与稀硝酸反应写成Fe+2H+=Fe2++H2↑错误（硝酸不放H2），应写Fe与硝酸的氧化还原反应。","tip":"正误判断「四查」：事实、拆写、守恒、量的关系。"},"4|4|e|2":{"explain":"由现象推反应：白色沉淀（AgCl、BaSO4、CaCO3）、气泡（CO2、H2、NH3）、颜色变化（Fe3+血红色）对应反应物。先定产物再写方程式，注意介质与配平。","tip":"现象定产物：沉淀、气体、颜色是写方程式的线索。"},"4|4|e|3":{"explain":"除杂离子反应：除CO3(2-)加盐酸（CO3(2-)+2H+=CO2↑+H2O）；除SO4(2-)加BaCl2（Ba2++SO4(2-)=BaSO4↓）；除Fe3+加Fe粉。","example":"例：除去NaCl溶液中SO4(2-)：加过量BaCl2生成BaSO4沉淀过滤，再加Na2CO3除过量Ba2+。","tip":"除杂「选试剂不引新杂」，过量试剂要再处理。"},"4|5|k|0":{"explain":"三守恒应用：电子守恒（氧化剂得电子数=还原剂失电子数）解氧化还原计算；原子守恒解方程式与关系式；电荷守恒解离子方程式配平与电解质溶液问题。","example":"例：0.3 mol Cu与稀硝酸完全反应，由电子守恒：0.3×2=n(NO)×3，n(NO)=0.2 mol。","tip":"氧化还原计算优先电子守恒，一个等式解全题。"},"4|5|k|1":{"explain":"由自发反应比较氧化还原性强弱：氧化性——氧化剂大于氧化产物；还原性——还原剂大于还原产物。多反应排序用传递性，且「强者优先」。","example":"例：由2Fe3++2I-=2Fe2++I2得氧化性Fe3+大于I2；由Cl2+2Fe2+=2Fe3++2Cl-得Cl2大于Fe3+。","tip":"比较强弱「只比反应物产物对应项」，中间物质不参与。"},"4|5|k|2":{"explain":"陌生氧化还原方程式四步：标变价元素化合价→定产物→化合价升降配平变价物质→补介质（酸性H+、碱性OH-）配电荷→H2O配氢氧。检查原子与电荷守恒。","example":"例：酸性KMnO4氧化SO3(2-)：2MnO4-+5SO3(2-)+6H+=2Mn2++5SO4(2-)+3H2O，先配电子转移再补H+。","tip":"配平顺序「电子→电荷→原子」，介质离子最后补。"},"4|5|k|3":{"explain":"综合题框架：有无外接电源判原电池或电解池；原电池活泼金属负极失电子、电解池接正极阳极；写电极式注意介质；离子迁移（阳离子向正极或阴极）；pH变化看消耗或生成H+、OH-。","example":"例：电解CuSO4溶液阴极析Cu、阳极OH-放电放O2并生成H+，溶液pH降低。","tip":"电化学综合「先判装置再写电极」，pH变化看电极产物。"},"4|5|k|4":{"explain":"电解计算统一电子守恒：各电极转移电子数相等，n(e-)=金属物质的量×价态变化=气体物质的量×每个分子得电子数。串联电路转移电子数相同。","example":"例：电解AgNO3转移2 mol电子析出2 mol Ag（216 g）；同时阳极放O2 0.5 mol（标况11.2 L）。","tip":"电解计算「电子守恒一杆秤」，气体金属统一折算电子。"},"4|5|k|5":{"explain":"防护原理：让被保护金属作正极（原电池）或阴极（电解池）：牺牲阳极法——连接更活泼金属（Zn），Zn作负极被腐蚀；外加电流阴极保护法——被保护金属接电源负极。","example":"例：钢闸门接直流电源负极（外加电流阴极保护），或镶锌块（牺牲阳极保护），都是让铁作阴极或正极。","tip":"防护两法「牺牲阳极（连活泼金属）、外加电流接负极」。"},"4|5|d|0":{"explain":"电子转移按化学计量数配比：3Cu+8HNO3=3Cu(NO3)2+2NO↑+4H2O中3 mol Cu转移6 mol电子，8 mol HNO3只有2 mol被还原。","example":"例：0.3 mol Cu与足量稀硝酸反应转移0.6 mol电子，生成0.2 mol NO。","tip":"电子转移「跟住变价物质」，HNO3只有被还原部分得电子。"},"4|5|d|1":{"explain":"离子交换膜选择性透过：质子交换膜只允许H+通过；阴离子交换膜只允许阴离子通过；阳离子交换膜只允许阳离子通过。作用：阻止分子或离子交叉反应，维持电荷平衡。","example":"例：氯碱工业用阳离子交换膜，Na+通过进入阴极室生成NaOH，阻止Cl2进入阴极室。","tip":"交换膜「只让指定离子过」，作用是隔离产物、平衡电荷。"},"4|5|d|2":{"explain":"二次电池（如铅蓄电池）：放电是原电池（负极氧化），充电是电解池（原负极接电源负极作阴极被还原），电极反应互为逆反应。判断时看装置有无电源。","example":"例：铅蓄电池放电时Pb作负极被氧化，充电时Pb接电源负极作阴极被还原，反应互逆。","tip":"二次电池「放电原电池、充电电解池」，充放电电极反应互逆。"},"4|5|d|3":{"explain":"多元素变价计算：逐一分析每种变价元素的升降，总失电子=总得电子。如2Cu2S+3O2=2Cu2O+2SO2中Cu价态不变，S失12 mol电子，O2得12 mol。","example":"例：2Cu2S+3O2=2Cu2O+2SO2中S由-2升到+4共失12 mol电子（2 mol S），O2得12 mol电子，Cu价态不变。","tip":"多元素变价「逐个元素算升降」，最后得失电子总数相等。"},"4|5|e|0":{"explain":"金属与硝酸反应：电子守恒——n(金属)×失电子数=n(NO2)×1+n(NO)×3。再结合氮原子守恒求硝酸总量。","example":"例：Cu与硝酸生成0.1 mol NO和0.1 mol NO2，转移电子0.1×3+0.1×1=0.4 mol，n(Cu)=0.2 mol。","tip":"硝酸计算「电子守恒+氮守恒」双守恒联立，一步到位。"},"4|5|e|1":{"explain":"二次电池：分清充放电，放电负极氧化、充电阴极还原；燃料电池：燃料作负极（H2、CH4、CH3OH氧化），O2作正极，电极式结合介质（酸性H+、碱性OH-）。","example":"例：甲烷燃料电池碱性负极：CH4-8e-+10OH-=CO3(2-)+7H2O，正极O2+2H2O+4e-=4OH-。","tip":"燃料电池「燃料负极氧化、O2正极还原」，介质定产物。"},"4|5|e|2":{"explain":"补介质配平步骤：标价态→定产物→升降配平→补介质（酸性H+、碱性OH-）配电荷→补H2O配氢氧。介质判断：溶液酸碱性或题给条件。","example":"例：酸性KMnO4氧化H2O2：2MnO4-+5H2O2+6H+=2Mn2++5O2↑+8H2O，先配电子后补H+。","tip":"配平检查「电荷守恒+原子守恒」，介质H+或OH-数量要正好。"},"4|5|e|3":{"explain":"腐蚀快慢：电解池阳极大于原电池负极大于化学腐蚀大于原电池正极大于电解池阴极。防护：牺牲阳极、外加电流阴极保护、镀层涂层。判断时先定装置与电极。","tip":"腐蚀快慢排序「电解阳极大于原电负极大于化学大于被保护」，防护看电极。"},"4|6|k|0":{"explain":"平衡图像五类：c-t图（浓度随时间变化，平直处平衡）；v-t图（速率变化判断条件）；转化率-温度或压强图（判断吸放热与计量数）；等温等压线；投料比图（峰值=计量比）。","example":"例：c-t图中曲线变平直表示浓度不再变化，该时刻达到平衡；投料比图峰值处对应计量比投料。","tip":"读图先认类型，再按「坐标、拐点、趋势」三步分析。"},"4|6|k|1":{"explain":"v-t图读法：速率突变——浓度改变使某物质相关速率瞬间跳变；温度、压强改变使正逆速率同时渐变（等幅或不等幅）；催化剂使正逆同时等幅增大、平衡不移动。","example":"例：t时刻v正、v逆同时增大且v正大于v逆，若正反应吸热则改变条件是升温；若等幅增大且平衡不移动则是加催化剂。","tip":"v-t看突变：浓度跳变、温压渐变、催化剂等幅。"},"4|6|k|2":{"explain":"「先拐先平数值大」是读图铁律：先出现拐点（先达平衡）的曲线条件更剧烈——温度更高或压强更大。配合拐点后的数值走向判断吸放热与计量数。","example":"例：T2曲线先拐则T2大于T1；T2对应转化率低说明升温转化率降低，正反应放热。","tip":"先拐=条件剧烈，先判T或p大小，再看趋势判吸放热。"},"4|6|k|3":{"explain":"平衡常数K只随温度变：升温K增大→正向吸热；升温K减小→正向放热。图像中K随T升高而增大即为吸热反应。","example":"例：某反应升温K增大，说明正反应吸热，ΔH大于0；升温K减小则正反应放热，据此判断ΔH符号。","tip":"「升温K增=吸热」，用K-T图像直接定ΔH符号。"},"4|6|k|4":{"explain":"投料比图中转化率（或产物含量）随投料比变化有峰值：按化学计量数之比投料时两种反应物恰好「匹配」，转化率都最大、产物含量最高。","example":"例：合成氨中n(N2):n(H2)=1:3时NH3含量最高，对应投料比曲线峰值。","tip":"投料比峰值=计量比投料，峰值处两反应物转化率相等。"},"4|6|k|5":{"explain":"三段式（起始、转化、平衡）：转化量按计量数比；转化率=转化/起始；K用平衡浓度代入；平均摩尔质量=总质量/总物质的量。","example":"例：起始1 mol A和2 mol B反应A+2B⇌2C，平衡时A剩0.5 mol，转化率50%，平衡量按计量比推算。","tip":"三段式「转化量比=计量数比」，平衡量=起始-转化。"},"4|6|d|0":{"explain":"判断移动方向看改变条件瞬间v正、v逆相对大小：v正大于v逆正向移动；v正小于v逆逆向移动；相等不移动。升温加压都增大速率但增幅不同。","example":"例：恒温加压瞬间v正、v逆都增大，若正反应气体计量数小则v正增大更多，平衡正移。","tip":"移动方向「看瞬时v正与v逆大小」，不是看平衡后。"},"4|6|d|1":{"explain":"恒温线（转化率-p图）：转化率随p增大而增大说明正反应气体分子数减少；减小说明增多；不变说明前后相等。恒压线（转化率-T图）：随T升高增大为吸热、减小为放热。","example":"例：转化率随压强增大而增大，说明正反应气体计量数之和小于逆反应，如2SO2+O2⇌2SO3。","tip":"转化率-p图看计量数，转化率-T图看吸放热。"},"4|6|d|2":{"explain":"等效平衡：恒温恒容不等体反应投料完全相等才等效；恒温恒容等体或恒温恒压按比例投料等效。图像中不同投料最终平衡浓度（或转化率）相同即等效。","example":"例：恒温恒容下2HI⇌H2+I2（等体），投2 mol HI与投1 mol H2加1 mol I2等效，HI分解率相同。","tip":"等效判断「恒容等体或恒压看比例，恒容不等体看相等」。"},"4|6|d|3":{"explain":"区别关键：加压使各气体浓度增大、v正v逆都增大，若前后计量数不等则平衡移动；催化剂同幅增大v正v逆，平衡不移动。图像中催化剂只提前拐点不改变平衡点。","example":"例：加催化剂后曲线更快平直但平衡浓度不变；加压（计量数不等）后平衡点改变，据此区分两种改变。","tip":"「加压动平衡、催化剂不动」，图像看平衡点是否移动。"},"4|6|e|0":{"explain":"综合读图：先拐先平定T、p大小→看趋势定吸放热（T升高转化率增=吸热）→定计量数（p增大转化率增=气体分子数减小方向为正反应）→定移动方向。","tip":"图像三步「定条件、判吸放热、判计量数」，缺一不可。"},"4|6|e|1":{"explain":"从图像读取平衡浓度（曲线平直处），代入K表达式（指数=计量数）；或用三段式由转化率反推平衡量。注意K只随温度变。","tip":"K计算「读平衡浓度代入」，图像平直段取数。"},"4|6|e|2":{"explain":"工业条件分析：合成氨放热、计量数减小——低温高压转化率高但速率慢；兼顾速率、转化率、成本选500 ℃、10~30 MPa、铁触媒。","tip":"条件选择答题「三兼顾」：速率、转化率、成本设备。"},"4|6|e|3":{"explain":"图像数据读取：t=0处是起始量，曲线平直处是平衡量，差值即转化量；转化率=转化量/起始量。注意纵坐标是浓度还是物质的量。","example":"例：c-t图中起始c(A)=2、平衡c(A)=0.5，转化量1.5，转化率75%。","tip":"读图「起点起始、平直平衡」，浓度与物质的量换算看体积。"},"4|7|k|0":{"explain":"推断三突破口：分子式算不饱和度定可能结构；特征反应定官能团（银镜或Cu(OH)2=醛基、FeCl3显紫=酚羟基、溴水褪色=双键或醛）；光谱数据定结构。","example":"例：分子式C3H6O2、能与NaHCO3放CO2，含羧基，为丙酸CH3CH2COOH。","tip":"推断「不饱和度+特征反应+光谱」三招并用。"},"4|7|k|1":{"explain":"特征反应表：醛基——银镜、Cu(OH)2砖红色；酚羟基——FeCl3紫色；羧基——与NaHCO3放CO2；碳碳双键——溴水、KMnO4褪色；羟基——与Na放H2。","example":"例：与NaHCO3放CO2必含羧基；与FeCl3显紫色必含酚羟基，特征反应是推断突破口。","tip":"「试剂-现象-官能团」对应表是推断基础，要默写。"},"4|7|k|2":{"explain":"逆推设计：从目标产物看官能团，倒推「谁反应生成它」，逐步回到原料；同时考虑碳链增长（卤代烃+NaCN、醛加成）或缩短（消去氧化）。每步写清条件。","example":"例：由乙烯合成乙酸乙酯：乙烯→乙醇（水化）→乙酸（氧化）→乙酸乙酯（酯化），三步路线。","tip":"设计路线「从产物逆推」，每步对应学过的转化。"},"4|7|k|3":{"explain":"新信息题：先圈出信息反应的断键与成键位置（如C=O加成、双烯合成），理解官能团如何变化，再迁移到目标分子相应位置书写产物。","example":"例：信息给出R-C≡N水解成R-COOH，遇到含-CN的分子即可推其水解产物为羧酸。","tip":"新信息「圈断键、找位置、再迁移」，先模仿后应用。"},"4|7|k|4":{"explain":"确定分子式：燃烧法（测CO2、H2O质量求C、H含量）或元素分析；质谱测相对分子质量（最大质荷比）；由最简式×倍数=分子式。","example":"例：某有机物含C 40%、H 6.7%、O 53.3%，最简式CH2O，质谱M=60，分子式C2H4O2。","tip":"分子式「元素分析定最简式+质谱定分子量」，两者结合。"},"4|7|k|5":{"explain":"限定条件同分异构体解题：先按条件定官能团（特征反应），再定骨架（苯环、碳链），再排位置（邻间对、等效氢），最后核对氢谱峰数与峰面积比。","example":"例：含苯环、能与NaHCO3放CO2、氢谱4组峰面积比3:2:2:1的C8H8O2是对甲基苯甲酸。","tip":"限定条件「先官能团后骨架再位置」，氢谱核对称。"},"4|7|d|0":{"explain":"逆合成操作：从目标产物倒推——找到能生成它的反应（酯由醇酸酯化、烯由消去、醇由水解或还原），逐步切断到简单原料；再正向写路线。","example":"例：合成CH3CH2CH2OH：逆推可由CH3CH=CH2水化或CH3CH2CH2Br水解，选原料易得的路线。","tip":"逆推「从产物找生成反应」，切断点在官能团。"},"4|7|d|1":{"explain":"多官能团物质做特定反应前先保护易反应基团：酚羟基、氨基在氧化前先成酯（或酰胺）保护，反应后水解恢复；按「先保护→反应→脱保护」安排。","example":"例：含酚羟基和醛基的分子要把醛氧化成羧酸，先让酚羟基成酯保护再氧化，最后水解，保护后反应更干净。","tip":"保护「先保护易变基团」，氧化还原前后常需保护与脱保护。"},"4|7|d|2":{"explain":"迁移关键：把信息反应的「变化模式」（某键断裂、某键形成、官能团转化）套到目标分子相同位置。先在小分子上标注断键成键，再扩展到大分子。","example":"例：信息给出醛与HCN加成生成羟基腈，遇到醛基化合物即写其与HCN的加成产物，先理解再迁移。","tip":"迁移先「模式识别」，找到目标分子中相同官能团位置。"},"4|7|d|3":{"explain":"有序书写防漏：按「官能团异构→碳链异构→位置异构」逐类，先定类别（由限定条件）再写碳链再排位置；用等效氢与对称性去重；最后核对限定条件。","example":"例：C4H8O2羧酸有2种（丁酸2种）；酯先写甲酸丙酯（2种）再乙酸乙酯（1种）再丙酸甲酯（1种）。","tip":"写异构体「分类分步不跳步」，写完全部条件核对一遍。"},"4|7|e|0":{"explain":"大题四问应对：用分子式+特征反应+转化关系定结构；写方程式注意条件、可逆号、配平；反应类型判断看断键特征；最后写同分异构体按序排查。","tip":"大题「先读全信息再动笔」，方程式条件配平检查。"},"4|7|e|1":{"explain":"按条件分层写：官能团类别→碳骨架→位置排列，用对称去重，最后数数。限定条件（氢谱峰数、特征反应、含苯环）每一条都要满足，写后逐条核对。","tip":"写异构体「逐条满足限定条件」，写完数一遍防漏。"},"4|7|e|2":{"explain":"设计步骤：目标产物逆推→确定中间体→从原料正推→衔接路线，每步写试剂与条件。优先用加成（原子利用率高）、避免多步低产率路线。","tip":"路线「逆推设计、正推书写」，条件齐全，优选加成。"},"4|7|e|3":{"explain":"综合计算：由质量或气体体积求物质的量、由关系式求产率、由氢谱峰面积比定氢数。信息迁移：陌生反应按「断键成键模式」套用。","tip":"计算「先物质的量后关系式」，信息「先模式后应用」。"}},"biology":{"0|0|k|0":{"explain":"蛋白质由约20种氨基酸组成，每个氨基酸至少含一个氨基和一个羧基，且连在同一碳原子上，R基决定种类。记忆：氨基羧基像两顶帽子挂在同一根柱子（中心碳原子）上。","example":"例：判断某分子是否氨基酸，看是否同时含氨基和羧基且连在同一碳原子上，甘氨酸符合即可作蛋白质原料。","tip":"中心碳原子上必须同时连氨基、羧基和R基，缺一不可。"},"0|0|k|1":{"explain":"两个氨基酸各出基团结合成肽键并脱去一分子水，叫脱水缩合。n个氨基酸形成m条链时，肽键数等于脱水数等于n减m。记忆公式：肽键数等于氨基酸数减肽链数。","example":"例：10个氨基酸形成2条肽链，肽键数等于10减2等于8，脱去8分子水，分子质量减少144。","tip":"环状肽肽键数等于氨基酸数，不再减肽链数，这是常设陷阱。"},"0|0|k|2":{"explain":"蛋白质像用20种字母写成的句子：氨基酸种类、数目、排列顺序不同，肽链盘曲折叠的空间结构就不同。结构决定功能，故蛋白质有催化、运输、免疫、调节等多种功能。","example":"例：血红蛋白与胰岛素都由氨基酸构成，因排列和空间结构不同，分别执行运氧和降血糖功能。","tip":"多样性根本原因是DNA多样性；高温只破坏空间结构，不破坏肽键。"},"0|0|k|3":{"explain":"核酸分DNA和RNA，基本单位是核苷酸，由含氮碱基、五碳糖和磷酸组成。DNA的五碳糖是脱氧核糖、特有碱基T；RNA的是核糖、特有碱基U，这是区分关键。","example":"例：某核酸含T和脱氧核糖则为DNA，含U和核糖则为RNA，二者都含A、G、C三种碱基。","tip":"看清题目问DNA还是RNA的碱基，T和U别写混；病毒只含一种核酸。"},"0|0|k|4":{"explain":"糖类按能否水解分单糖、二糖、多糖。单糖如葡萄糖不能水解、可直接被吸收，是能源核心；多糖包括淀粉（植物储能）、纤维素（细胞壁）、糖原（动物储能）。糖类是主要能源物质。","example":"例：米饭中的淀粉经消化水解为葡萄糖被吸收，葡萄糖氧化分解释放能量供生命活动利用。","tip":"纤维素是细胞壁成分不是能源物质；几丁质是含氮多糖，别归入储能糖类。"},"0|0|k|5":{"explain":"脂质分三类记功能：脂肪是良好储能物质，还保温、缓冲；磷脂构成生物膜的基本骨架；固醇包括胆固醇、性激素、维生素D（促钙吸收）。脂质主要由C、H、O组成。","example":"例：花生种子富含脂肪，同质量脂肪氧化分解比糖类耗氧多、产能多，故储能效率更高，是良好储能物质。","tip":"脂肪不是多糖；性激素是脂质不是蛋白质，通过受体起调节作用。"},"0|0|d|0":{"explain":"蛋白质计算抓核心公式：肽键数等于脱水数等于氨基酸数减肽链数；环状肽肽键数等于氨基酸数。游离氨基羧基数等于肽链数加R基上的数目。分子质量等于氨基酸总数乘平均减脱水数乘18。","example":"例：100个氨基酸形成2条链，肽键98个，游离氨基至少2个；若成环状则肽键100个。","tip":"算相对分子质量必减脱去的水；先分清直链还是环状肽。"},"0|0|d|1":{"explain":"判断氨基酸看三点：是否含氨基、是否含羧基、二者是否连在同一碳原子上，缺一不可。若氨基或羧基挂在R基上，不算标准配置，不能作蛋白质原料。命题常在R基上做文章。","example":"例：某分子氨基和羧基连在不同碳原子上，虽含两种基团也不是氨基酸，不能参与蛋白质合成。","tip":"命题常在R基上挂氨基羧基干扰判断，务必盯住中心碳原子。"},"0|0|d|2":{"explain":"三大鉴定记条件：还原糖加斐林试剂（现配现用）需水浴加热，生成砖红色沉淀；脂肪加苏丹Ⅲ染成橘黄色，需显微镜观察；蛋白质加双缩脲试剂，先A后B不需加热。","example":"例：苹果匀浆加斐林试剂不加热无砖红色沉淀，水浴加热后才出现，说明其中含有还原糖。","tip":"斐林试剂现配现用且需加热；双缩脲试剂先A后B不需加热，二者别混。"},"0|0|d|3":{"explain":"分类记牢：脂肪属于脂质，不是糖类更不是多糖；固醇包含胆固醇、性激素、维生素D三类；几丁质是含氮多糖，是虾蟹外壳和真菌细胞壁成分。糖类元素C、H、O。","example":"例：判断：脂肪是储能的多糖（错），胆固醇属于脂质中的固醇（对），几丁质是含氮多糖（对）。","tip":"归类题先看大类别再细分，脂质不等于脂肪，固醇不等于胆固醇。"},"0|0|e|0":{"explain":"高考常考：给氨基酸数和肽链数求肽键数、脱水数、游离氨基羧基数、相对分子质量；或给蛋白质实例考结构与功能对应。解题先列公式：肽键等于氨基酸减链数。","tip":"题中含二硫键时，分子质量还要减去2乘二硫键数（脱去氢）。"},"0|0|e|1":{"explain":"区分DNA与RNA三大差异：五碳糖不同（脱氧核糖对核糖）、特有碱基不同（T对U）、结构不同（双链对多单链）。判断时先找T或U，再看五碳糖，双保险。","tip":"ATP含核糖和腺嘌呤，属RNA成分，别误归入DNA。"},"0|0|e|2":{"explain":"三个鉴定实验必背：还原糖加斐林试剂水浴加热变砖红色；脂肪加苏丹Ⅲ染成橘黄色，用显微镜观察；蛋白质加双缩脲试剂变紫色。选材要含待测物且颜色浅，避免用西瓜。","tip":"甘蔗、甜菜主要含蔗糖非还原糖，不能做还原糖鉴定材料。"},"0|0|e|3":{"explain":"元素含量排序记两个场景：鲜重（含水多）中O最多、C次之；干重（脱水后）中C最多、O次之。原因：鲜重中水占绝大部分，O质量大；干重以有机物为主，以碳链为骨架。","tip":"看清题目问鲜重还是干重，排序相反是常见陷阱。"},"0|0|e|4":{"explain":"蛋白质功能五大类：催化（绝大多数酶是蛋白质）、运输（血红蛋白运氧）、免疫（抗体）、调节（胰岛素等激素）、结构（角蛋白）。命题常给实例问功能。","example":"例：唾液淀粉酶催化淀粉水解属催化功能；血红蛋白运氧属运输功能，各归其类，结构决定功能。","tip":"少数酶是RNA；性激素是脂质不是蛋白质，别把激素都当蛋白质。"},"0|1|k|0":{"explain":"细胞膜以磷脂双分子层为基本支架，蛋白质镶嵌或贯穿其中，糖类与蛋白质结合成糖蛋白。磷脂和蛋白质大多能运动，故膜有流动性；蛋白质种类决定功能，使膜有选择透过性。","example":"例：荧光标记小鼠与人细胞融合，40分钟后两种荧光均匀分布，证明细胞膜具有流动性。","tip":"流动性是结构特性，选择透过性是功能特性，前者是后者的结构基础。"},"0|1|k|1":{"explain":"细胞膜三大功能：把细胞与外界隔开，保障内部稳定；控制物质进出，但控制是相对的；进行细胞间信息交流，通过糖蛋白识别、胞间连丝等方式传递信号。功能由结构决定。","example":"例：激素与靶细胞膜上受体结合传递信息，体现细胞膜进行细胞间信息交流的功能，受体起识别作用。","tip":"信息交流三方式：直接接触、化学物质传递（激素）、胞间连丝（植物）。"},"0|1|k|2":{"explain":"细胞器分工用车间比喻：线粒体是动力车间（有氧呼吸二三阶段、供能），叶绿体是养料制造车间和能量转换站（光合作用），核糖体是蛋白质合成车间（翻译场所）。","example":"例：心肌细胞耗能多，线粒体数量多；根尖细胞无叶绿体，但有核糖体合成蛋白质，体现分工。","tip":"原核细胞只有核糖体一种细胞器，无线粒体也能有氧呼吸（在细胞膜上）。"},"0|1|k|3":{"explain":"内质网分粗面（附核糖体，加工分泌蛋白）和滑面（合成脂质）；高尔基体对蛋白质进一步加工、包装成囊泡分泌，植物细胞中还与新细胞壁形成有关。分泌蛋白经核糖体到内质网到高尔基体到细胞膜。","example":"例：胰岛B细胞分泌胰岛素，需核糖体合成、内质网和高尔基体加工，高尔基体受损则分泌受阻。","tip":"高尔基体在动植物细胞功能不同：动物管分泌，植物还管细胞壁形成。"},"0|1|k|4":{"explain":"溶酶体含多种水解酶，能分解衰老损伤的细胞器、吞噬消化侵入的细菌，是消化车间；液泡内含细胞液，使植物细胞坚挺，与渗透吸水直接相关，色素使花瓣果实有颜色。","example":"例：白细胞吞噬细菌后由溶酶体消化；植物萎蔫是因液泡失水，细胞液浓度升高，体现各自功能。","tip":"溶酶体膜能保护自身不被酶分解；水解酶作用的场所是溶酶体内部。"},"0|1|k|5":{"explain":"细胞核含染色质（DNA和蛋白质），DNA携带遗传信息，所以细胞核是遗传信息库，控制细胞代谢和遗传。核膜上有核孔，是大分子（mRNA、蛋白质）进出通道；核仁与核糖体形成有关。","example":"例：变形虫去核后代谢减弱、不能摄食，植入细胞核后恢复，证明细胞核控制细胞代谢，是控制中心。","tip":"核孔对进出有选择性；mRNA从核孔出来去核糖体翻译。"},"0|1|d|0":{"explain":"两类特殊细胞器重点记：能量转换器是线粒体（化学能转活跃化学能）和叶绿体（光能转化学能）；含核酸的细胞器是叶绿体、线粒体（含DNA和RNA）、核糖体（只含rRNA）。","example":"例：含DNA的细胞器是线粒体和叶绿体；核糖体只含RNA，高尔基体不含核酸，判断要分清。","tip":"含DNA的只有线粒体和叶绿体，含RNA的还有核糖体，别漏。"},"0|1|d|1":{"explain":"分泌蛋白的旅程：核糖体合成多肽链，内质网加工折叠，高尔基体进一步加工包装，囊泡运到细胞膜，胞吐释放。用3H标记亮氨酸追踪，放射性依次出现在核糖体、内质网、高尔基体、细胞膜。","example":"例：用3H标记亮氨酸培养胰岛细胞，放射性最先出现在核糖体，随后内质网、高尔基体依次增强。","tip":"线粒体全程供能但不参与组装路线；胞吐体现膜的流动性，需能量。"},"0|1|d|2":{"explain":"原核细胞（细菌、蓝细菌等）与真核细胞最大区别：无核膜包被的细胞核，DNA裸露在拟核，无染色体；细胞器只有核糖体。但原核细胞也有细胞膜、细胞壁（肽聚糖）、核糖体。","example":"例：蓝细菌无叶绿体却能光合作用，因含藻蓝素和叶绿素；无线粒体但能在细胞膜上有氧呼吸。","tip":"原核细胞壁成分是肽聚糖；支原体是唯一无细胞壁的原核生物。"},"0|1|d|3":{"explain":"流动性指磷脂分子和蛋白质可以运动，是膜的结构特点，是选择透过性的结构基础；选择透过性指膜允许某些物质通过而阻止另一些，是膜的功能特点。流动性实例：胞吞胞吐、细胞融合。","example":"例：质壁分离复原时细胞膜面积变化、白细胞吞噬细菌体现流动性；离子选择性吸收体现选择透过性。","tip":"问结构基础答流动性，问功能特性答选择透过性，别答反。"},"0|1|e|0":{"explain":"常考分泌蛋白合成运输全过程：核糖体到内质网到高尔基体到细胞膜，伴随囊泡运输，线粒体供能。同位素标记法（3H标记氨基酸）追踪放射性转移顺序，判断各细胞器先后参与。","example":"例：分泌蛋白合成中，内质网膜面积减小、高尔基体膜先增后减、细胞膜面积增大，总膜面积不变。","tip":"膜面积变化题：内质网减少、细胞膜增加、高尔基体先增后减，总量不变。"},"0|1|e|1":{"explain":"流动镶嵌模型要点：磷脂双分子层构成基本支架，蛋白质镶在表面或贯穿其中，糖蛋白在细胞膜外侧起识别作用。膜蛋白功能多样：受体（信息传递）、载体（物质运输）、酶（催化）。","example":"例：癌细胞膜上糖蛋白减少导致易扩散转移；载体蛋白缺失导致物质运输受阻，说明膜蛋白功能多样。","tip":"糖蛋白分布在细胞膜外侧，据此可判断细胞膜内外侧。"},"0|1|e|2":{"explain":"三个经典实验证明细胞核是控制中心：美西螈核移植（后代颜色取决于供核个体，证明核控制遗传）；蝾螈受精卵横缢（有核部分能分裂，无核不能）；变形虫切割（核控制代谢）。","example":"例：黑白美西螈核移植实验，后代颜色取决于供核个体，证明细胞核控制性状遗传，结论明确。","tip":"核移植结论是核控制遗传，横缢结论是核控制分裂代谢，分清楚。"},"0|1|e|3":{"explain":"细胞器按膜分类：双层膜（线粒体、叶绿体）、单层膜（内质网、高尔基体、溶酶体、液泡）、无膜（核糖体、中心体）。含核酸的：线粒体、叶绿体（含DNA和RNA）、核糖体（含RNA）。","example":"例：双层膜且含DNA的细胞器是线粒体和叶绿体；中心体无膜、无核酸，与有丝分裂有关。","tip":"中心体存在于动物和低等植物细胞，高等植物细胞没有中心体。"},"0|1|e|4":{"explain":"观察叶绿体选黑藻或藓类叶片（叶薄、叶绿体大而清晰），临时装片直接观察，不需染色；细胞质流动可作为生命活动标志。观察线粒体用健那绿（活细胞染料，染成蓝绿色）。","example":"例：观察叶绿体选黑藻叶，因为叶片薄、叶绿体少而大，方便观察形态和流动，不需染色。","tip":"健那绿是活细胞染料，染线粒体呈蓝绿色；观察叶绿体不需染色。"},"0|2|k|0":{"explain":"渗透作用记三点：水分子从低浓度一侧透过半透膜流向高浓度一侧；条件是膜两侧有浓度差且有半透膜。浓度差指单位体积溶质微粒数差，水总是向溶质多的一侧净移动。","example":"例：漏斗内装蔗糖溶液、烧杯装清水，中间用半透膜隔开，液面上升，说明水向蔗糖侧渗透。","tip":"渗透是水的净移动方向，两侧水分子都在运动，只是方向有净差。"},"0|2|k|1":{"explain":"自由扩散最省事：物质顺浓度梯度从高到低直接穿过磷脂双分子层，不需载体、不需能量。适合气体（O2、CO2）和脂溶性小分子（甘油、乙醇、苯）。动力是浓度差。","example":"例：肺泡中O2浓度高于血液，O2顺浓度梯度自由扩散进入血液，方向由浓度差决定，不需载体。","tip":"记忆脂溶气体自由过：乙醇、甘油、苯、O2、CO2都是自由扩散。"},"0|2|k|2":{"explain":"协助扩散是有人帮忙但不费力：顺浓度梯度运输，不需能量，但需载体蛋白（如葡萄糖载体）或通道蛋白（如水通道）协助。因为载体数量有限，运输速率有饱和现象。","example":"例：葡萄糖进入红细胞是协助扩散；水主要通过水通道蛋白以协助扩散方式快速进出细胞。","tip":"曲线出现饱和平台说明有载体参与（协助扩散或主动运输），自由扩散无饱和。"},"0|2|k|3":{"explain":"主动运输最努力：逆浓度梯度（从低到高）运输，需载体蛋白并消耗能量（ATP），能保证细胞按需吸收或排出物质。实例：K+进细胞、小肠上皮细胞吸收葡萄糖。载体有专一性。","example":"例：肾小管重吸收葡萄糖是主动运输；若用呼吸抑制剂处理，运输受阻，说明消耗细胞呼吸的能量。","tip":"判断主动运输的杀手锏：逆浓度梯度加耗能，缺一不可。"},"0|2|k|4":{"explain":"原生质层是植物细胞的半透膜：由细胞膜、液泡膜和两膜之间的细胞质组成，具有选择透过性。细胞壁是全透性的。当外界溶液浓度大于细胞液浓度时，细胞失水，发生质壁分离。","example":"例：把紫色洋葱外表皮放入0.3g/mL蔗糖溶液，液泡紫色变深、体积变小，发生质壁分离。","tip":"原生质层不等于原生质体：原生质层是三层结构，原生质体是去壁后的细胞。"},"0|2|k|5":{"explain":"质壁分离及复原实验三大用途：证明原生质层相当于半透膜、证明细胞是活的、测定细胞液浓度范围。活的成熟植物细胞置于高浓度溶液中失水分离，放回清水中能复原；死细胞不能。","example":"例：某细胞在高浓度蔗糖溶液中不分离，可能是死细胞，也可能细胞液浓度大于外界溶液浓度。","tip":"选材要成熟植物细胞且有中央大液泡（如洋葱外表皮），分生区细胞无大液泡不能做。"},"0|2|d|0":{"explain":"判断跨膜运输三看：一看方向，逆浓度梯度必是主动运输；二看载体，顺浓度但需载体是协助扩散；三看能量，消耗ATP是主动运输。自由扩散只靠浓度差，按三步排查。","example":"例：物质从高浓度到低浓度且需载体不需能量，属协助扩散；从低到高需载体耗能，属主动运输。","tip":"先看方向最省事：逆浓度必主动；顺浓度再看有无载体。"},"0|2|d|1":{"explain":"质壁分离实验条件：材料选紫色洋葱鳞片叶外表皮（有大液泡且含紫色色素，便于观察）；外界溶液浓度要大于细胞液浓度（如0.3g/mL蔗糖溶液）；细胞必须是活的成熟植物细胞。","example":"例：0.3g/mL蔗糖溶液中洋葱外表皮质壁分离，换清水后复原；浓度过大则失水过多死亡不复原。","tip":"外界溶液浓度过大细胞会死亡，不能再复原；内表皮无色不适合观察。"},"0|2|d|2":{"explain":"渗透是扩散的特殊形式：特指水分子透过半透膜由低溶质浓度向高溶质浓度一侧的净移动；扩散泛指物质从高浓度向低浓度运动。渗透的浓度差指两侧不能透过半透膜的溶质浓度差。","example":"例：蔗糖不能透过半透膜，两侧蔗糖浓度差驱动渗透；葡萄糖能透过则不产生渗透压差，先判溶质。","tip":"做题先看溶质能否透过半透膜，能透过的溶质不算渗透压差。"},"0|2|d|3":{"explain":"主动运输的意义：细胞能逆浓度梯度主动选择吸收所需营养（如K+、氨基酸），排出代谢废物，不受环境浓度影响，保证生命活动正常进行。主动运输需载体和能量，体现选择透过性。","example":"例：海水鱼细胞中Na+浓度低于海水，仍能排出Na+，靠主动运输维持细胞内环境稳定。","tip":"按需吸收四字是主动运输的核心意义，答题要点到选择透过性。"},"0|2|e|0":{"explain":"高频考法：给浓度差与运输速率曲线判断运输方式。自由扩散曲线过原点直线上升；协助扩散过原点先升后饱和（载体限制）；主动运输可逆浓度运输、受能量和载体双重限制。","example":"例：曲线随浓度差增大速率趋于平台，且不受呼吸抑制剂影响，属协助扩散；受抑制则属主动运输。","tip":"加呼吸抑制剂后运输减慢的是主动运输（耗能），不影响协助扩散。"},"0|2|e|1":{"explain":"实验题必答要点：选紫色洋葱外表皮（有紫色大液泡）；滴加0.3g/mL蔗糖溶液后观察液泡变小、紫色变深、原生质层与细胞壁分离；换清水后复原。还可据此测细胞液浓度、判断细胞死活。","example":"例：某细胞置于蔗糖溶液中质壁分离后不能复原，可能是细胞已死亡或浓度过大导致失水过度。","tip":"现象描述写全：液泡体积、颜色、原生质层位置三方面变化。"},"0|2|e|2":{"explain":"两条曲线对比：自由扩散运输速率随浓度差线性增大，无饱和；协助扩散因载体蛋白数量有限，浓度差增大到一定程度后速率不再增加，出现饱和平台。","example":"例：葡萄糖进入红细胞速率随浓度增大先升后平，出现饱和，说明载体有限，属协助扩散。","tip":"出现平台说明受载体数量限制，可排除自由扩散；是否耗能再加药判断。"},"0|2|e|3":{"explain":"主动运输依赖细胞呼吸提供能量和膜上载体蛋白，二者任一受阻运输即停止。这体现细胞膜的选择透过性（功能特性），说明物质运输与细胞代谢密切相关。","example":"例：加入呼吸抑制剂后某物质运输立即停止，说明该运输是主动运输，消耗细胞呼吸产生的ATP。","tip":"抑制呼吸影响主动运输但不影响自由扩散和协助扩散（不耗能）。"},"0|2|e|4":{"explain":"常设陷阱：水分子虽是小分子，但主要通过水通道蛋白快速进出细胞，属协助扩散（不需能量）；甘油、乙醇等脂溶性小分子直接穿过磷脂双分子层，是自由扩散。","example":"例：判断题：水分子的跨膜运输一定属于自由扩散（错），水主要通过水通道蛋白协助扩散。","tip":"水的运输方式看有没有通道蛋白，考场上见到水等于自由扩散要警惕。"},"1|0|k|0":{"explain":"酶是活细胞产生的有机物（绝大多数是蛋白质，少数是RNA），起催化作用，反应前后本身不变。三大特性：高效性、专一性（一种酶催化一种或一类反应）、作用条件温和。","example":"例：过氧化氢酶催化H2O2分解比Fe3+快得多，体现高效性；唾液淀粉酶只催化淀粉水解，体现专一性。","tip":"酶不等于激素：酶是催化剂不调节代谢，激素是信息分子；RNA酶证明酶不都是蛋白质。"},"1|0|k|1":{"explain":"活化能是分子从常态变为活跃状态所需能量。酶通过与底物结合降低活化能，使反应更容易进行，加快反应速率；但酶不改变反应的平衡点，也不提供能量，反应前后酶不变，可反复利用。","example":"例：加酶与不加酶都能让底物反应完，只是加酶更快到达平衡，证明酶只改速率不改平衡点。","tip":"酶只能加快反应速率，不能改变反应方向和平衡点；高温破坏酶结构后才真正失活。"},"1|0|k|2":{"explain":"ATP中文名三磷酸腺苷，结构简式A-P~P~P，A为腺苷，P为磷酸基团，~为高能磷酸键。ATP水解高能磷酸键释放能量，供生命活动直接利用；ADP加Pi加能量可再合成ATP。","example":"例：肌肉收缩、主动运输、神经传导直接消耗的能源物质都是ATP，而非葡萄糖，ATP是直接能源。","tip":"ATP是直接能源、糖类是主要能源、脂肪是主要储能物质，三者别混。"},"1|0|k|3":{"explain":"有氧呼吸三阶段记场所：第一阶段在细胞质基质，葡萄糖分解成丙酮酸加少量[H]；第二阶段在线粒体基质，丙酮酸加水生成CO2和大量[H]；第三阶段在线粒体内膜，[H]与O2结合生成水。","example":"例：向线粒体悬液中加入葡萄糖不产生CO2，因葡萄糖需先在细胞质基质分解为丙酮酸才能进入线粒体。","tip":"葡萄糖不能直接进入线粒体，先进细胞质基质变丙酮酸；CO2产生于第二阶段。"},"1|0|k|4":{"explain":"有氧呼吸的实质是有机物彻底氧化分解。葡萄糖先分解成丙酮酸，丙酮酸再彻底分解为CO2，同时脱下的[H]与O2在线粒体内膜结合生成水，能量分阶段释放，大部分以热能散失。","example":"例：1mol葡萄糖彻底氧化分解释放2870kJ能量，其中约1161kJ储存在ATP中，其余以热能散失。","tip":"[H]是NADH的简写；有氧呼吸释放的能量大部分以热能形式散失。"},"1|0|k|5":{"explain":"无氧呼吸全程在细胞质基质进行，不消耗O2。两种类型：酒精发酵（葡萄糖生成酒精加CO2），如酵母菌、大多数植物；乳酸发酵（葡萄糖生成乳酸），如动物、乳酸菌。都只释放少量能量。","example":"例：剧烈运动后肌肉酸胀，是肌细胞无氧呼吸产生乳酸；苹果腐烂有酒味，是无氧呼吸产生酒精。","tip":"高等动物细胞无氧呼吸只产乳酸不产CO2；酵母菌无氧呼吸产酒精和CO2。"},"1|0|d|0":{"explain":"三阶段对照记：一阶段细胞质基质，葡萄糖变丙酮酸加[H]；二阶段线粒体基质，丙酮酸加水变CO2加[H]；三阶段线粒体内膜，[H]加O2变水。CO2在第二阶段产生，水在第三阶段产生。","example":"例：有氧呼吸产生的水中的氧来自O2，CO2中的氧来自葡萄糖和水，可用18O标记验证。","tip":"O2在第三阶段被利用，所以缺O2最先影响第三阶段，[H]积累、ATP减少。"},"1|0|d|1":{"explain":"三个速率分清：呼吸速率（黑暗下测）、净光合速率（光照下测，即CO2吸收量或O2释放量）、总光合速率等于净光合加呼吸速率。曲线中CO2吸收量、O2释放量是净光合。","example":"例：光照下测得CO2吸收量为5，黑暗下呼吸释放CO2为2，则总光合速率等于5加2等于7。","tip":"抓住吸收释放是净、固定产生是总，暗处理测呼吸。"},"1|0|d|2":{"explain":"光照强度曲线：起点为呼吸速率（负值），补偿点处光合等于呼吸、净光合为0，饱和点后光不再是限制因素；CO2浓度曲线类似，饱和点后受光照和温度限制。温度通过影响酶活性起作用。","example":"例：光补偿点左移说明呼吸减弱或光合增强；增加CO2浓度可使CO2饱和点右移，注意限制因素。","tip":"饱和点后的限制因素是CO2浓度、温度等；补偿点与呼吸速率直接相关。"},"1|0|d|3":{"explain":"温度、pH影响酶活性：低温只降低活性、空间结构未破坏，升温可恢复；高温、强酸、强碱破坏酶的空间结构，使酶永久失活，不可恢复。曲线为钟形，最适温度、pH时活性最高。","example":"例：加酶洗衣粉用温水效果好；煮沸后冷却，酶活性不恢复，因高温破坏酶的空间结构，不可逆。","tip":"低温缓、高温毁，失活不可逆的是高温强酸碱，答题写明空间结构被破坏。"},"1|0|e|0":{"explain":"图解题套路：先定位场所（叶绿体类囊体薄膜或基质、线粒体基质或内膜等），再写物质变化（光反应：水光解产[H]和O2、ATP合成；暗反应：CO2固定、C3还原），最后答能量变化。","example":"例：光照下叶绿体产生O2，可被线粒体利用进行有氧呼吸，也可释放到外界，去向看浓度。","tip":"答题按场所、物质、能量三步写全，别只答物质变化。"},"1|0|e|1":{"explain":"四个经典实验记结论：普利斯特利（植物更新空气）、萨克斯（暗处理加碘蒸汽，证明产物是淀粉）、恩格尔曼（水绵加好氧细菌，证明O2由叶绿体释放）、鲁宾和卡门（18O标记，O2来自水）。","example":"例：鲁宾和卡门用18O分别标记水和CO2，发现标记水的组释放的O2含18O，证明O2来自水。","tip":"O2来自水不是CO2，这是同位素标记实验的经典结论。"},"1|0|e|2":{"explain":"实验设计思路：黑暗下测CO2释放量或O2吸收量得呼吸速率；光照下测CO2吸收量或O2释放量得净光合速率；总光合速率等于净光合加呼吸。可用黑白瓶法测定，注意控制单一变量。","example":"例：黑白瓶法：黑瓶测呼吸耗氧量a，白瓶测净产氧量b，总光合产氧量等于a加b，公式要记牢。","tip":"总光合等于净光合加呼吸，缺一不可；装置要密闭并设对照。"},"1|0|e|3":{"explain":"呼吸作用应用原理：抑制呼吸可延长储存时间。种子储存用低温、干燥、低氧（降低自由水）；果蔬保鲜用低温、低氧（保持一定湿度）。也可促进呼吸：松土透气促进根系有氧呼吸。","example":"例：粮食入仓前要晒干，减少自由水，降低呼吸强度；果蔬保鲜用低氧高CO2环境，抑制呼吸。","tip":"种子要干，果蔬要湿，都是低温低氧；无氧呼吸对植物体有害（产酒精）。"},"1|0|e|4":{"explain":"两大易错点：ATP在细胞内含量很少，靠ATP与ADP快速转化维持供能，是能量货币而非储能物质（储能物质是脂肪）；酶只降低活化能，不提供能量也不被消耗，高温失活后不能恢复。","example":"例：判断题：细胞内ATP含量多、储存大量能量（错），ATP含量少、转化速度快，是能量货币。","tip":"见到ATP储存能量多、酶提供能量直接判错。"},"1|1|k|0":{"explain":"细胞增殖分两个阶段：物质准备（间期，完成DNA复制和有关蛋白质合成）和细胞分裂（分裂期，染色体均分）。真核生物体细胞增殖主要是有丝分裂，产生与亲代遗传物质相同的子细胞。","example":"例：人的肝细胞通过有丝分裂增殖，子细胞染色体数目与母细胞相同，都是46条，遗传物质不变。","tip":"有丝分裂是真核体细胞增殖方式，原核生物是二分裂，减数分裂产生配子。"},"1|1|k|1":{"explain":"间期最忙：DNA复制（数目加倍）和蛋白质合成。分裂期四步记口诀：前期膜仁消失现两体（核膜核仁消失、染色体纺锤体出现）；中期形定数清赤道齐；后期点裂数增均两极；末期两消两现重开始。","example":"例：某细胞有丝分裂后期着丝粒分裂，染色体数目暂时加倍为92条（体细胞46条），末期再减半。","tip":"间期DNA加倍但染色体数目不变（有姐妹染色单体）；后期才加倍。"},"1|1|k|2":{"explain":"各时期特征对照记：前期染色体散乱分布、纺锤体形成；中期染色体最清晰、着丝粒整齐排在赤道板（观察染色体形态数目的最佳时期）；后期着丝粒一分为二，染色体数目加倍；末期核膜核仁重现。","example":"例：观察染色体形态和数目选中期，此时染色体排列最整齐、最清晰，是计数的最佳时期。","tip":"赤道板不是真实结构，只是位置；后期着丝粒分裂由纺锤丝牵引完成。"},"1|1|k|3":{"explain":"细胞分化本质是基因的选择性表达：不同细胞表达不同基因（如红细胞表达血红蛋白基因），遗传物质（DNA）不变，只是读了不同部分。分化使细胞形态、结构、功能出现差异，是个体发育的基础。","example":"例：红细胞含血红蛋白基因也含胰岛素基因，但只表达血红蛋白基因，这就是选择性表达。","tip":"分化不改变遗传物质、降低全能性；分化是基因不同表达不是基因丢失。"},"1|1|k|4":{"explain":"细胞衰老五大特征记口诀水少酶低色积累、核大呼吸慢：水分减少（细胞萎缩）、多种酶活性降低、色素积累（老年斑）、细胞核体积增大、呼吸速率减慢。个体衰老是细胞普遍衰老的结果。","example":"例：老年人出现老年斑是色素积累；白发是酪氨酸酶活性降低导致黑色素合成减少，都属衰老特征。","tip":"衰老细胞核体积增大、细胞体积减小，方向别记反。"},"1|1|k|5":{"explain":"细胞凋亡是由基因决定的细胞自动结束生命的过程（程序性死亡），如蝌蚪尾消失，对生物体有利；细胞坏死是受外界不利因素（缺氧、损伤）引起的被动死亡，对生物体有害。区分看是否由基因调控。","example":"例：被病原体感染的细胞被效应T细胞诱导裂解，属于细胞凋亡（细胞免疫的正常清除）。","tip":"凋亡是主动自杀，坏死是被动他杀；效应T细胞使靶细胞裂解属凋亡。"},"1|1|d|0":{"explain":"数目变化核心看着丝粒：着丝粒未分裂时有姐妹染色单体，DNA数等于2乘染色体数；分裂后单体消失，DNA数等于染色体数。以2n为例：间期、前期、中期DNA等于4n、染色体等于2n。","example":"例：体细胞染色体数2n等于4，有丝分裂中期染色体4条、DNA 8个、染色单体8条。","tip":"问染色体数看着丝粒数，问DNA数看DNA分子数，后期单体数为0。"},"1|1|d|1":{"explain":"全能性指已分化细胞发育成完整个体的潜能。分化程度越高，全能性越低（受精卵大于胚胎干细胞大于成体干细胞）。但分化的体细胞仍含全套遗传物质，只是表达部分基因。","example":"例：胡萝卜韧皮部细胞能培育成完整植株，证明已分化细胞仍含全套遗传物质、有全能性。","tip":"分化细胞全能性低不等于没全能性；克隆羊证明细胞核有全能性。"},"1|1|d|2":{"explain":"三概念对比：衰老是正常生命历程，特征为代谢减慢；凋亡是基因控制的程序性死亡，主动、对机体有利（如清除衰老细胞）；坏死是外界损伤引起的被动死亡，对机体有害。判断看是否受基因调控。","example":"例：吸烟导致肺部细胞死亡是坏死；人体每天清除衰老红细胞是凋亡，前者被动后者主动。","tip":"凡基因控制、程序性、对机体有利都是凋亡，别把病理坏死说成凋亡。"},"1|1|d|3":{"explain":"癌细胞三大特征：无限增殖（失去接触抑制）、形态结构改变（球形）、细胞膜上糖蛋白减少导致黏着性降低、易分散转移。根本原因：原癌基因和抑癌基因发生突变，多个基因突变累积导致癌变。","example":"例：癌细胞表面糖蛋白减少，细胞间黏着性降低，所以癌细胞容易扩散和转移，危害极大。","tip":"癌变是多个基因突变累积的结果，不是单个基因；癌细胞能无限增殖且代谢旺盛。"},"1|1|e|0":{"explain":"曲线记忆法：DNA在间期加倍（曲线上升），末期随细胞分裂减半；染色体在后期着丝粒分裂时加倍，末期减半。看曲线判断时期：DNA加倍对应间期，染色体加倍对应后期。","example":"例：曲线中染色体数目突然加倍的点对应后期，因为着丝粒分裂、姐妹染色单体分开所致。","tip":"先分清纵轴是染色体还是DNA，二者加倍时期不同，最易错。"},"1|1|e|1":{"explain":"实验四步记顺序解离漂洗染色制片：解离（盐酸和酒精混合液，使细胞分离）、漂洗（洗去解离液）、染色（龙胆紫或醋酸洋红）、制片（压片使细胞分散）。解离后细胞已死亡，看到的是静态图像。","example":"例：解离后不经漂洗直接染色，盐酸会干扰染色效果，染色浅、看不清染色体，顺序不能颠倒。","tip":"先漂洗后染色顺序不能颠倒；显微镜下看到的大多数细胞处于间期。"},"1|1|e|2":{"explain":"细胞分化实质是基因选择性表达，不同细胞表达基因的种类不同。常考结合题：植物组织培养（胡萝卜韧皮部细胞到完整植株）证明已分化细胞仍含全套遗传物质、具有全能性。","example":"例：同一株植物不同组织细胞基因相同，但形态功能不同，因为表达基因不同，属选择性表达。","tip":"答题写基因的选择性表达，别写成基因改变或遗传物质改变。"},"1|1|e|3":{"explain":"辨析题要点：衰老细胞水分减少、酶活性降低、核体积增大；癌细胞无限增殖、糖蛋白减少、形态改变。原癌基因主要调控细胞周期，抑癌基因抑制细胞不正常增殖，二者突变是癌变根本原因。","example":"例：癌细胞特征包括无限增殖和糖蛋白减少，但酶活性普遍降低是衰老特征不是癌变特征。","tip":"把衰老与癌变特征混搭是常见陷阱，逐条对照排除。"},"1|1|e|4":{"explain":"两个高频陷阱：赤道板只是细胞中央的一个位置，不是真实结构，细胞板才是植物细胞末期真实形成的结构；减数分裂有联会、四分体、同源染色体分离，有丝分裂无这些行为。","example":"例：判断题：赤道板是细胞分裂时出现的细胞结构（错），赤道板不是真实结构，细胞板才是。","tip":"看到赤道板是结构判错；区分两分裂先找同源染色体行为（联会、分离）。"},"1|2|k|0":{"explain":"孟德尔成功四原因：选豌豆作材料（自花传粉闭花受粉，天然纯种，性状易区分）；先研究一对相对性状再研究多对（由简到繁）；运用统计学方法分析数据；科学实验程序（假说演绎法）。","example":"例：豌豆自花传粉闭花受粉使自然状态下都是纯种，这是孟德尔选豌豆的重要原因之一，实验可靠。","tip":"杂交操作要点：去雄（母本花蕾期）、套袋、人工授粉、再套袋，防止外来花粉干扰。"},"1|2|k|1":{"explain":"分离定律实质：减数分裂形成配子时，等位基因随同源染色体分开而分离，各入一配子。如Aa产生A和a两种配子，比例1比1。F1（Aa）自交，后代基因型AA比Aa比aa等于1比2比1。","example":"例：Aa自交，A配子占1/2、a配子占1/2，随机结合得aa概率等于1/2乘1/2等于1/4。","tip":"分离定律的细胞学基础是减Ⅰ后期同源染色体分离，不是减Ⅱ姐妹染色单体分开。"},"1|2|k|2":{"explain":"3比1是统计学结果，需满足条件：F1（Aa）产生A、a两种配子数量相等且生活力相同；雌雄配子随机结合；各基因型存活率相同；子代数目足够多。任一条件不满足，比例会偏离。","example":"例：若AA致死，Aa自交后代显性比隐性等于2比1而非3比1，因为AA个体死亡，条件改变。","tip":"看到非3比1比例，先想致死、配子不育、统计数目少等原因。"},"1|2|k|3":{"explain":"测交是让待测个体与隐性纯合子（aa）杂交：隐性纯合子只产生a配子，不掩盖待测个体配子，所以后代表现型直接反映待测个体产生配子的种类和比例。后代显性比隐性等于1比1则待测个体是Aa。","example":"例：高茎豌豆与矮茎（aa）测交，后代高茎比矮茎等于1比1，证明该高茎豌豆基因型为Aa。","tip":"测交意义是测配子：后代比例等于配子比例，这是理解测交的关键。"},"1|2|k|4":{"explain":"自由组合定律实质：位于非同源染色体上的非等位基因，在减数分裂时随非同源染色体的自由组合而自由组合。如AaBb产生AB、Ab、aB、ab四种配子，自交后代表现型为9比3比3比1。","example":"例：AaBb乘AaBb，后代双显性（A_B_）占9/16，因为A_B_等于3/4乘3/4。","tip":"若两对基因位于同一对染色体上，则不遵循自由组合定律，注意题干条件。"},"1|2|k|5":{"explain":"遗传符号记牢：P（亲本）、F1（子一代）、F2（子二代）、乘（杂交）、圈乘（自交）、雌、雄。遗传图解书写规范：写P基因型表现型，配子写种类和比例，F1写基因型表现型及比例。","example":"例：高茎（DD）乘矮茎（dd），F1全为高茎Dd，F1自交得F2高茎比矮茎等于3比1。","tip":"书写遗传图解时配子要写全，自交用圈乘符号，别漏写表现型比例。"},"1|2|d|0":{"explain":"两大定律的适用范围：真核生物（有染色体和减数分裂）、有性生殖（配子形成过程）、核基因（位于细胞核染色体上）。原核生物无染色体，不遵循；细胞质基因（线粒体、叶绿体基因）也不遵循。","example":"例：大肠杆菌抗药性遗传不遵循孟德尔定律，因原核生物无染色体、无减数分裂，不适用。","tip":"题干出现原核、细胞质遗传、母系遗传，立即排除孟德尔定律。"},"1|2|d|1":{"explain":"概率计算三步法（分解组合法）：先确定亲本基因型；再把多对性状拆成单对分别算概率（如Aa乘Aa，显性占3/4）；最后用乘法原理把各对概率相乘。自由交配用配子法，自交用基因型比例。","example":"例：AaBb乘AaBb求后代aabb概率：aa等于1/4、bb等于1/4，相乘得1/16。","tip":"分解组合法先拆后乘；自由交配必用配子法或基因频率法。"},"1|2|d|2":{"explain":"判断显隐性两口诀：无中生有为隐性（双亲都正常，生出患病孩子，该病是隐性遗传）；有中生无为显性（双亲都患病，生出正常孩子，该病是显性遗传）。若都不符合，则需假设显隐性分别推导。","example":"例：正常夫妇生一白化病孩子，双亲正常孩子有病，无中生有，故白化病是隐性遗传病，口诀可记。","tip":"无中生有的有指患病孩子，口诀的对象是病，别找错性状。"},"1|2|d|3":{"explain":"自交是相同基因型个体间交配（如AA乘AA、Aa乘Aa），可用基因型比例直接推下一代；自由交配（随机交配）需先算群体产生的配子频率，再组合算后代基因型频率。二者算法完全不同。","example":"例：群体中AA比Aa等于1比2，自由交配时配子A等于2/3、a等于1/3，后代aa等于1/9。","tip":"看到自由交配或随机交配立即用配子法，别用自交算法。"},"1|2|e|0":{"explain":"实质辨析考点：分离定律实质是等位基因随同源染色体分开而分离（减Ⅰ后期）；自由组合定律实质是非同源染色体上的非等位基因自由组合（减Ⅰ后期）。常结合减数分裂图考。","example":"例：减Ⅰ后期同源染色体分离、非同源染色体自由组合，是分离定律和自由组合定律的细胞学基础。","tip":"实质题抓等位基因分离和非同源染色体上非等位基因自由组合。"},"1|2|e|1":{"explain":"9比3比3比1变式由基因互作产生：两显性基因同时存在表现一种性状（9比7）；单显表现一种、双显另一种（9比6比1）；存在显性基因即表现某性状（15比1）。先还原9比3比3比1。","example":"例：两白花植株杂交F1全紫花，F2紫比白等于9比7，说明紫花需A和B同时存在（互补作用）。","tip":"变式题先写出9比3比3比1四种组合，再按题意合并表现型类别。"},"1|2|e|2":{"explain":"遗传题解题流程：判断显隐性（无中生有或有中生无），判断基因位置（常染色体或X染色体），推断个体基因型（由子代表现型反推），计算概率（条件概率要重新计算）。","example":"例：系谱中Ⅱ-3患病，其父母正常，则病为隐性；若男性患者多于女性，倾向于伴X隐性。","tip":"概率计算时先看题目是否给出个体表现型已知，已知则用条件概率。"},"1|2|e|3":{"explain":"验证两定律四方法：自交法（分离看3比1，自由组合看9比3比3比1）；测交法（看1比1或1比1比1比1）；花粉鉴定法（看花粉类型比例）；单倍体育种法。植物用自交测交，动物用测交。","example":"例：验证AaBb产生四种配子可用测交：AaBb乘aabb后代四种表现型1比1比1比1。","tip":"动物（无法自交）验证基因型只能测交；花粉鉴定法直接反映配子类型。"},"1|2|e|4":{"explain":"连续自交规律：Aa自交n代，杂合子Aa比例等于（1/2）的n次方，纯合子比例等于1减（1/2）的n次方。连续自交使杂合子比例逐代减半，纯合子比例增大，育种中用于提高纯合度。","example":"例：Aa自交3代，杂合子比例等于（1/2）的3次方等于1/8，纯合子占7/8，纯合度提高。","tip":"自交改变基因型频率（提高纯合度），自由交配只保持基因频率不变，二者别混。"},"1|3|k|0":{"explain":"减数分裂特点复制一次、分裂两次：间期DNA复制一次，连续进行减Ⅰ和减Ⅱ两次分裂，结果染色体数目减半（2n变n）。只发生在有性生殖的配子形成过程，保证前后代染色体数目恒定。","example":"例：精原细胞（2n等于46）经减数分裂形成精子含23条染色体，受精后恢复46条。","tip":"减数分裂染色体减半发生在减Ⅰ完成时（同源染色体分开），减Ⅱ不减半。"},"1|3|k|1":{"explain":"减Ⅰ前期同源染色体两两配对（联会），每对含4条染色单体构成四分体，非姐妹染色单体可能交叉互换；后期同源染色体分开、分别移向两极（非同源染色体自由组合）；末期染色体数目减半。","example":"例：2n等于4的细胞减Ⅰ前期形成2个四分体，后期同源染色体分离，染色体数减半为2。","tip":"减Ⅰ有同源染色体，减Ⅱ无同源染色体，这是区分两分裂的重要依据。"},"1|3|k|2":{"explain":"减Ⅱ相当于一次特殊有丝分裂：无同源染色体、无联会。后期姐妹染色单体分开（着丝粒分裂），染色体数目暂时加倍（n变2n），末期再减半形成两个子细胞。减Ⅱ后期染色体数与体细胞相同。","example":"例：2n等于4的细胞减Ⅱ后期染色体数为4，与体细胞相同，且无同源染色体，据此判断。","tip":"减Ⅱ后期染色体暂时加倍但无同源染色体，判断减Ⅱ关键看无同源染色体。"},"1|3|k|3":{"explain":"精子形成路线：精原细胞（2n）经间期复制变初级精母细胞（2n），减Ⅰ后变两个次级精母细胞（n），减Ⅱ后变四个精细胞（n），再变形为四个精子（n）。细胞质均等分裂。","example":"例：一个基因型为Aa的精原细胞产生4个精子，类型为A、A、a、a两种（无交叉互换）。","tip":"一个精原细胞产生2种4个精子；一个含n对同源染色体的个体可产生2的n次方种精子。"},"1|3|k|4":{"explain":"卵细胞形成特点：细胞质不均等分裂（初级卵母细胞减Ⅰ后形成大的次级卵母细胞和小的第一极体；次级卵母细胞减Ⅱ后形成大的卵细胞和小的第二极体）。一个卵原细胞最终产生1个卵细胞和3个极体。","example":"例：一个基因型为Aa的卵原细胞产生1个卵细胞（A或a）和3个极体，极体两两相同。","tip":"卵细胞只有1个、极体3个；细胞质不均等分裂是卵细胞形成标志。"},"1|3|k|5":{"explain":"受精作用：精子的细胞核与卵细胞的细胞核融合，染色体合二为一，受精卵染色体数恢复体细胞数目（n加n等于2n）。意义：减数分裂使配子染色体减半，受精作用使其恢复，维持前后代数目恒定。","example":"例：人精子23条加卵细胞23条变受精卵46条，与亲代体细胞相同，保证遗传稳定，意义重大。","tip":"受精卵的细胞质主要来自卵细胞（母系），细胞质基因表现为母系遗传。"},"1|3|d|0":{"explain":"图像判断三步法：一看有无同源染色体（无则减Ⅱ或生殖细胞）；二看有无特殊行为（联会、四分体、同源染色体分离则减Ⅰ；无同源染色体着丝粒分裂则减Ⅱ后期）；三看细胞质是否均等。","example":"例：细胞中含同源染色体且出现联会，属减Ⅰ前期；无同源染色体着丝粒分裂，属减Ⅱ后期。","tip":"先看有没有同源染色体再判断，别一看到着丝粒分裂就答有丝分裂。"},"1|3|d|1":{"explain":"减数分裂数目变化关键点：间期DNA加倍（2n变4n），减Ⅰ末期染色体减半（2n变n）、DNA减半，减Ⅱ后期染色体暂时加倍（n变2n）但DNA不变。注意减Ⅱ后期染色体数与体细胞相同。","example":"例：2n等于4时，减Ⅰ后期染色体4条DNA 8个；减Ⅱ后期染色体4条DNA 4个，对照记忆。","tip":"看曲线先分纵轴是染色体还是DNA；减Ⅱ后期染色体加倍而DNA不加倍。"},"1|3|d|2":{"explain":"伴性遗传判断流程：先判显隐性（无中生有隐性、有中生无显性）；再判位置：伴X隐性遗传男患者多于女患者、交叉遗传，女患者的父亲和儿子一定患病；伴X显性遗传女患者多于男患者。","example":"例：红绿色盲是伴X隐性遗传，男性发病率约7%远高于女性，且呈交叉遗传，特征明显。","tip":"口诀：X隐母病子必病、女病父必病；X显父病女必病、子病母必病。"},"1|3|d|3":{"explain":"交叉互换：减Ⅰ前期（四分体时期），同源染色体的非姐妹染色单体之间交换相应片段，导致基因重组（产生新组合的配子）。它是配子多样性的来源之一，另一来源是非同源染色体自由组合。","example":"例：基因型AaBb（A、B连锁在同一染色体）的个体，四分体期交叉互换后可产生Ab、aB型配子。","tip":"交叉互换发生在减Ⅰ前期四分体时期，不是减Ⅱ；互换对象是非姐妹染色单体。"},"1|3|e|0":{"explain":"比较考查要点：有丝分裂有同源染色体、无联会分离；减Ⅰ有联会、四分体、同源染色体分离；减Ⅱ无同源染色体。看图先找特殊行为：联会、四分体则减Ⅰ；无同源染色体着丝粒分裂则减Ⅱ后期。","example":"例：图中出现四分体即为减Ⅰ前期；细胞一极含姐妹染色单体且无同源染色体为减Ⅱ后期。","tip":"后期图看移向一极的染色体有无同源染色体判断减Ⅰ还是减Ⅱ或有丝分裂。"},"1|3|e|1":{"explain":"伴X隐性遗传三大特点：男性患者多于女性；交叉遗传（男患者的致病基因来自母亲，传给女儿）；女性患者的父亲和儿子都患病。系谱分析先判显隐性再判位置，用口诀验证。","example":"例：色盲男患者（XbY）与正常女性（XBXB）婚配，儿子全正常、女儿全为携带者（XBXb）。","tip":"色盲基因只位于X染色体，Y染色体上没有等位基因，所以男性XbY即患病。"},"1|3|e|2":{"explain":"减数分裂异常分析：减Ⅰ后期同源染色体未分离，产生的配子多一条或少一条同源染色体（如21三体综合征）；减Ⅱ后期姐妹染色单体未分开，配子中某染色体出现两条相同或缺失。","example":"例：21三体综合征患者体细胞47条染色体，因亲本减Ⅰ或减Ⅱ时21号染色体未分离。","tip":"分析异常配子先判断发生在减Ⅰ（同源未分开）还是减Ⅱ（姐妹未分开）。"},"1|3|e|3":{"explain":"两个经典论证：萨顿用类比推理法（基因与染色体行为平行）提出假说基因在染色体上，但类比推理不是实验证据；摩尔根用果蝇红白眼杂交实验（F2白眼全为雄性）证明基因位于染色体上。","example":"例：摩尔根果蝇实验F2白眼性状只在雄性出现，符合伴X遗传，证明控制眼色的基因在X染色体上。","tip":"萨顿是类比推理提假说，摩尔根是实验证明，别把类比推理当证据。"},"1|3|e|4":{"explain":"两个易错点：染色体数目减半发生在减Ⅰ末期（同源染色体分离），不是减Ⅱ；观察减数分裂选蝗虫精母细胞（雄性可产生大量精子，材料易得），植物常用花药，动物常用精巢。","example":"例：蝗虫精巢切片中能同时观察到减Ⅰ、减Ⅱ各时期图像，是观察减数分裂的好材料，易得量大。","tip":"观察减数分裂不选卵巢（数量少）；染色体减半在减Ⅰ，减Ⅱ是着丝粒分裂。"},"1|4|k|0":{"explain":"DNA双螺旋结构要点：两条脱氧核苷酸链反向平行盘绕；外侧是磷酸和脱氧核糖交替连接构成基本骨架；内侧碱基通过氢键互补配对（A配T两个氢键、G配C三个氢键）。","example":"例：DNA一条链碱基顺序为A-T-C，则互补链对应T-A-G，遵循A配T、G配C。","tip":"嘌呤（A、G）与嘧啶（T、C）配对，所以双链DNA中嘌呤数等于嘧啶数。"},"1|4|k|1":{"explain":"DNA复制特点半保留复制：每个新DNA分子含一条母链和一条新链。解旋酶解开双链后，以每条母链为模板，脱氧核苷酸按碱基互补配对，DNA聚合酶连接形成新链。","example":"例：15N标记的亲代DNA在14N培养基复制一代，子代DNA都是一条15N链加一条14N链。","tip":"解旋酶断氢键，DNA聚合酶连磷酸二酯键，别与RNA聚合酶（转录用）混淆。"},"1|4|k|2":{"explain":"DNA复制四要素：模板（两条母链）、原料（4种游离脱氧核苷酸）、能量（ATP）、酶（解旋酶、DNA聚合酶）。复制结果：一个DNA变两个完全相同DNA，遗传信息随复制传递。","example":"例：体外DNA复制体系中缺DNA聚合酶，则新链无法延伸，只能解旋不能完整复制，酶不可缺。","tip":"答题模板、原料、能量、酶四要素写全；原料是脱氧核苷酸不是核糖核苷酸。"},"1|4|k|3":{"explain":"基因是DNA上有遗传效应的片段，是遗传的基本功能单位。转录：以DNA一条链（模板链）为模板，按碱基互补配对（A配U、T配A、G配C）合成mRNA，需RNA聚合酶，场所主要是细胞核。","example":"例：DNA模板链为A-T-G，转录出的mRNA对应U-A-C（A配U，T配A）。","tip":"转录以DNA为模板、产物是RNA；模板是其中一条链，不是两条。"},"1|4|k|4":{"explain":"翻译过程：mRNA进入细胞质，核糖体沿mRNA移动，tRNA一端携带氨基酸、另一端反密码子与mRNA密码子互补配对，连接成多肽链。一个mRNA可结合多个核糖体，提高效率。","example":"例：mRNA上密码子AUG对应起始密码子，tRNA反密码子UAC携带甲硫氨酸与之配对。","tip":"翻译场所是核糖体，模板是mRNA；一个mRNA上多个核糖体合成多条相同肽链。"},"1|4|k|5":{"explain":"中心法则五条路径：DNA复制、转录（DNA到RNA）、翻译（RNA到蛋白质）、RNA复制、逆转录（RNA到DNA，如HIV）。DNA到DNA是传递，DNA到RNA到蛋白质是表达。","example":"例：HIV是RNA病毒，侵入细胞后先逆转录（RNA到DNA）再整合到宿主基因组。","tip":"逆转录需逆转录酶，只发生在RNA病毒（HIV）侵染时；正常细胞无逆转录。"},"1|4|d|0":{"explain":"双链DNA计算核心：因A配T、G配C，故A等于T、G等于C，嘌呤总数（A加G）等于嘧啶总数（T加C）等于碱基总数一半。两条链碱基关系：一条链的A加T等于另一链的A加T。","example":"例：双链DNA中A占20%，则T等于20%、G等于C等于30%，嘌呤等于嘧啶等于50%。","tip":"求某碱基占双链比例先看是单链还是双链，单链不能直接用A等于T。"},"1|4|d|1":{"explain":"复制计算规律：DNA复制n次产生2的n次方个DNA，其中含母链的始终2个。复制n次共需（2的n次方减1）乘该碱基在一条链中的个数；第n次复制需2的（n减1）次方乘该碱基个数。","example":"例：含100个A的DNA复制3次，共需A等于700个；第3次复制需400个，共需减1份。","tip":"共需减1，第n次不减；先算DNA分子增加数再乘每条链碱基数。"},"1|4|d|2":{"explain":"三概念分清：转录以DNA为模板产RNA（mRNA、tRNA、rRNA），需RNA聚合酶；翻译在核糖体，以mRNA为模板、tRNA运氨基酸，产物是多肽，密码子在mRNA上共64个。","example":"例：mRNA上UAA是终止密码子，翻译到此停止，不结合氨基酸，翻译提前结束，要注意。","tip":"密码子在mRNA上、共64个；反密码子在tRNA上；起始密码子AUG编码甲硫氨酸。"},"1|4|d|3":{"explain":"密码子表记忆要点：64个密码子编码20种氨基酸（简并性：多个密码子编码同一种氨基酸），3个终止密码子（UAA、UAG、UGA）不编码氨基酸；AUG既是起始密码子又编码甲硫氨酸。","example":"例：DNA碱基改变但密码子可能仍编码同种氨基酸（简并性），所以基因突变不一定改变性状。","tip":"终止密码子不编码氨基酸、没有对应tRNA；tRNA有61种。"},"1|4|e|0":{"explain":"三个过程对比记：复制（DNA到DNA，原料脱氧核苷酸，酶解旋酶与聚合酶）；转录（DNA到RNA，原料核糖核苷酸，酶RNA聚合酶）；翻译（RNA到蛋白质，原料氨基酸，核糖体）。","example":"例：转录与复制都用DNA作模板，但原料和产物不同，转录原料是核糖核苷酸，产物是RNA。","tip":"复制解整条链、转录解局部；RNA聚
