压强化学状态无关","核反应方程书写：质量数与电荷数守恒，分清裂变、聚变、人工转变","质能方程E=mc^2，核能ΔE=Δmc^2，1u对应约931.5MeV","比结合能越大核越稳定，轻核聚变与重核裂变都释放能量"],"difficultPoints":["半衰期理解：只对大量原子核成立，个别核不能用半衰期预言","核反应类型判断：α衰变、β衰变、人工核反应、裂变、聚变区分","质能方程计算：质量亏损Δm=反应前总质量减反应后总质量，再乘c^2","三种射线在电场磁场中偏转区分：α带正电、β带负电、γ不带电"],"examPoints":["核反应方程书写与配平是必考，注意质量数电荷数守恒","质能方程求核能：ΔE=Δmc^2，单位换算931.5MeV/u","半衰期计算：剩余质量与时间关系","三种射线性质与应用：示踪、放疗、探伤","易错：β衰变是中子转化为质子放出电子、半衰期不适用于个别核"]},{"title":"实验专题","keyPoints":["力学实验：打点计时器测加速度、验证牛顿第二定律、验证机械能守恒、验证动量守恒","电学实验：伏安法测电阻、测电源电动势内阻、描绘小灯泡伏安特性、多用电表使用","数据处理核心：图像法（斜率截距）、逐差法、列表法，减小偶然误差","游标卡尺精度0.1/0.05/0.02mm不估读，螺旋测微器0.01mm估读到0.001mm","电表读数：最小分度1估读下一位，其余按1/2、1/5估读，注意量程","滑动变阻器：分压式从零开始可调范围大，限流式省电，按需求选择","误差分析：系统误差源于原理，偶然误差源于读数，内外接法影响显著"],"difficultPoints":["验证牛顿第二定律：平衡摩擦力、m远小于M条件、a-1/M图不过原点分析","电学实验设计：内外接判断、分压限流选择、电表量程选择","测电源电动势内阻三方案：伏安法、安阻法、伏阻法及误差比较","纸带数据处理：逐差法求a、中间时刻法求瞬时速度","图像处理：U-I图截距为E斜率为r，a-F图不过原点原因分析"],"examPoints":["力学实验三年必考一题，测加速度与验证机械能守恒频率最高","电学实验常考伏安法测电阻与测电源电动势内阻","实验题命题趋势：新情境、开放性问题（改进方案、误差分析）","游标卡尺、螺旋测微器读数几乎每年出现","实验原理与误差分析是得分关键，图像处理是重点","易错：有效数字位数、平衡摩擦力漏做、内外接选择错误"]},{"title":"综合复习专题","keyPoints":["板块模型：比较μ板地、μ块板判断相对运动，分段受力分析，画v-t图辅助","图像问题：v-t、x-t、a-t、F-t图像转换，斜率、面积、截距物理意义综合运用","多过程问题：拆分为匀变速、圆周、平抛等子过程，衔接点速度是桥梁","传送带问题：水平与倾斜传送带，摩擦力方向随相对运动变化，多段分析","电磁场综合：带电粒子在电场、磁场、复合场中运动，轨迹与几何结合","三大观点选择：涉及时间用动量定理、涉及位移用动能定理、系统用动量守恒"],"difficultPoints":["板块共速后是否一起运动：比较摩擦条件，用v-t图判断临界","多过程连接点：速度是各段公共量，碰撞与摩擦生热Q=fΔs相对计算","电磁感应综合：导体棒导轨磁场，用动量定理求电荷量与位移","多图结合互推：F-t、v-t、B-t图像综合分析，注意坐标起点与单位","三大观点选择与转换：时间、位移、系统守恒三类问题方法不同"],"examPoints":["板块模型是力学压轴常客，全国卷与新高考卷反复出现","电磁场综合题常为物理卷最后压轴，考查轨迹分析能力","图像题每年必考，选择题与实验题都涉及","传送带与能量结合：摩擦生热Q=fΔs相对计算","多过程与能量结合：动能定理与机械能守恒综合应用","易错：板块共速后摩擦力突变、传送带痕迹长度用相对位移"]}]}]},{"id":"chemistry","name":"化学","icon":"⚗️","color":"#ff922b","intro":"从宏观现象与微观本质认识物质及其变化，通过证据推理、模型认知与科学探究形成学科核心素养。","examTrend":["立足主干知识：离子反应、氧化还原、元素化合物、化学平衡、电化学、有机推断年年必考，分值稳定。","情境化命题：以新材料、新能源、化工流程、传统文化为情境，考查知识迁移与信息加工能力。","强化实验探究：实验题分值占比高，考查操作正误判断、方案设计、现象解释与误差分析。","注重图像与数据：平衡图像、速率曲线、滴定曲线、Ksp曲线等数形结合题逐年增多。","考查规范表达：化学用语与文字表述要求规范，按操作-现象-结论三步式作答。"],"periods":[{"period":"高一（上）","textbook":"必修一","tips":["严格规范化学用语：元素符号、化合价、离子符号、化学方程式从第一课抓起。","建立宏微结合思维：用原子、离子、电子转移视角解释宏观现象与反应本质。","重视实验观察与安全：认真记录现象，理解每个操作的目的与注意事项。","及时整理错题：离子方程式、氧化还原、NA等易错点每周回顾巩固。"],"modules":[{"title":"物质分类与转化（胶体）","keyPoints":["物质分类依据：纯净物与混合物、单质与化合物、酸、碱、盐、氧化物，掌握树状分类法。","分散系按分散质粒子直径分类：溶液小于1 nm、胶体1~100 nm、浊液大于100 nm。","胶体三大性质：丁达尔效应、布朗运动、电泳，丁达尔效应用于区分溶液与胶体。","Fe(OH)3胶体制备：FeCl3饱和溶液滴入沸水，FeCl3+3H2O=Fe(OH)3(胶体)+3HCl，不能搅拌或久煮。","胶体聚沉方法：加电解质、加热、加带相反电荷的胶体，如豆浆点卤成豆腐。","物质转化规律：单质、氧化物、酸、碱、盐之间可按类别通性相互转化。"],"difficultPoints":["胶体与溶液的本质区别是分散质粒子直径大小，不是是否透明、有无颜色。","胶体整体不带电、胶粒带电荷，如Fe(OH)3胶粒带正电，电泳是胶粒定向移动。","丁达尔效应是光的散射，浊液也有类似现象，不能仅凭此区分胶体与浊液。","制Fe(OH)3胶体若长时间煮沸或搅拌会聚沉生成Fe(OH)3沉淀，现象判断是易错点。"],"examPoints":["胶体叙述正误判断：丁达尔效应、胶体带电、渗析分离等经典陷阱。","常见胶体实例辨析：烟、云、雾、豆浆、墨水、血液均为胶体。","制胶体实验对比：FeCl3滴入沸水制胶体，滴入NaOH溶液则生成红褐色沉淀。","结合纳米材料情境考查胶体概念：粒子直径处于胶体范围即具有胶体性质。"]},{"title":"离子反应（离子方程式、离子共存）","keyPoints":["电解质与非电解质均为化合物：水溶液或熔融态能导电的化合物是电解质，单质和混合物都不是。","强电解质完全电离（强酸强碱大多数盐），弱电解质部分电离（弱酸弱碱水）。","离子方程式书写四步：写、拆、删、查，强酸、强碱、可溶性盐拆为离子。","离子反应发生条件：生成沉淀、气体或弱电解质（如水），或发生氧化还原反应。","常见有色离子：Cu2+蓝色、Fe3+黄色、Fe2+浅绿色、MnO4-紫红色。","离子方程式正误判断三角度：是否符合客观事实、拆写是否正确、原子与电荷是否守恒。"],"difficultPoints":["微溶物处理：作反应物可拆（澄清石灰水），作生成物不拆（如CaSO4沉淀）。","浓盐酸、浓硫酸、浓硝酸处理不同：浓盐酸拆为离子，浓硫酸不拆，浓硝酸拆写。","NH4HCO3与过量NaOH反应：OH-先与HCO3-再与NH4+作用，须写总量离子方程式。","滴加顺序不同产物不同：Na2CO3与盐酸互滴、AlCl3与NaOH互滴现象与方程式均不同。"],"examPoints":["离子方程式正误判断为必考：从事实、拆写、守恒三个角度快速找错。","离子共存题隐含条件：无色、pH=1、与Al反应放出H2、水电离c(H+)=1×10-13等。","与量有关的离子方程式：过量少量、滴加顺序不同须分类讨论。","实验情境离子方程式：沉淀洗涤、除杂、检验中涉及的离子反应书写。"]},{"title":"氧化还原反应（概念、配平、常见氧化剂还原剂）","keyPoints":["氧化还原反应本质是电子转移，判断依据（特征）是元素化合价升降。","氧化剂得电子被还原发生还原反应，还原剂失电子被氧化发生氧化反应。","常见氧化剂：O2、Cl2、浓稀HNO3、浓H2SO4、KMnO4、Fe3+、H2O2。","常见还原剂：活泼金属、H2、C、CO、Fe2+、I-、SO2、H2S。","氧化性强弱比较：氧化剂氧化性大于氧化产物，还原剂还原性大于还原产物。","配平步骤：标化合价、列升降、求最小公倍数、配平变价物质、观察配平其他物质。","电子转移表示：双线桥表示得失电子，单线桥由还原剂指向氧化剂。"],"difficultPoints":["电子转移数目易错：1 mol Na2O2与足量水反应只转移1 mol电子（歧化反应）。","部分氧化还原：MnO2+4HCl(浓)中仅2 mol HCl被氧化，电子转移数须按被氧化部分计算。","陌生方程式书写：先定氧化剂还原剂与产物，用化合价升降法配平并补加介质。","归中与歧化规律：同种元素不同价态反应遵循价态归中不交叉原则。"],"examPoints":["判断氧化剂还原剂与电子转移数目，常与NA陷阱结合考查。","比较氧化性还原性强弱并判断反应能否发生。","陌生氧化还原方程式配平与书写，是高考主观题高频考查点。","氧化还原滴定计算：如KMnO4滴定草酸、I2滴定Na2S2O3，用电子守恒求解。"]},{"title":"钠及其化合物（钠、氧化钠过氧化钠、碳酸钠碳酸氢钠）","keyPoints":["钠的物理性质：银白色、质软、密度小于水大于煤油、熔点低，保存在煤油中。","钠与水反应：2Na+2H2O=2NaOH+H2↑，现象为浮、熔、游、响、红（加酚酞变红）。","钠与氧气：常温生成白色Na2O，点燃生成淡黄色Na2O2，2Na+O2=Na2O2（点燃）。","过氧化钠与水、二氧化碳：2Na2O2+2H2O=4NaOH+O2↑，2Na2O2+2CO2=2Na2CO3+O2。","Na2O2既是氧化剂又是还原剂，用作供氧剂与漂白剂。","碳酸钠与碳酸氢钠热稳定性：2NaHCO3=Na2CO3+H2O+CO2↑（加热），Na2CO3受热不分解。","Na2CO3与盐酸互滴现象不同：滴入盐酸立即冒气泡，盐酸滴入Na2CO3先无气泡后有气泡。"],"difficultPoints":["钠与盐溶液反应先与水反应：钠投入CuSO4溶液生成H2与Cu(OH)2沉淀而非置换出铜。","Na2O2参与反应时氧元素-1价发生歧化，1 mol Na2O2转移1 mol电子。","Na2CO3与NaHCO3相互转化：加CO2或加NaOH（加热）实现互变。","侯氏制碱法原理：NaCl+NH3+CO2+H2O=NaHCO3↓+NH4Cl，先通NH3后通CO2。"],"examPoints":["钠与水、氧气反应现象与方程式，焰色反应呈黄色用于鉴别钠元素。","Na2O2与H2O、CO2反应定量计算：固体质量变化与气体体积差法。","Na2CO3与NaHCO3鉴别（加热、加盐酸、加CaCl2）与除杂方法。","钠及其化合物转化关系图综合推断，注意Na2O与Na2O2性质差异。"]},{"title":"氯及其化合物（氯气、氯水、次氯酸、漂白粉）","keyPoints":["氯气黄绿色有毒、密度大于空气，能溶于水，易液化，实验室用NaOH溶液吸收尾气。","氯气与金属非金属：2Na+Cl2=2NaCl、Cu+Cl2=CuCl2（棕黄色烟）、H2+Cl2=2HCl（苍白色火焰）。","氯气与水反应：Cl2+H2O⇌HCl+HClO，氯水中含Cl2、HClO、H2O及H+、Cl-、ClO-。","次氯酸性质：弱酸性、强氧化性（漂白消毒），不稳定，2HClO=2HCl+O2↑（光照）。","氯气与碱：Cl2+2NaOH=NaCl+NaClO+H2O，2Cl2+2Ca(OH)2=Ca(ClO)2+CaCl2+2H2O制漂白粉。","漂白粉有效成分Ca(ClO)2，漂白原理：Ca(ClO)2+CO2+H2O=CaCO3+2HClO。","实验室制氯气：MnO2+4HCl(浓)=MnCl2+Cl2↑+2H2O（加热），须用浓盐酸并加热。"],"difficultPoints":["新制氯水与久置氯水成分不同：久置后HClO分解，氯水最终变为稀盐酸。","Cl2制备中稀盐酸不反应，除HCl用饱和食盐水，干燥用浓硫酸，收集用向上排空气法。","漂白粉久置失效：Ca(ClO)2与空气中CO2、H2O生成HClO后又分解。","氯气氧化性强，与Fe反应生成FeCl3而非FeCl2。"],"examPoints":["氯水成分多角度考查：加石蕊先变红后褪色，设计实验检验各成分。","实验室制氯气装置连接：制备、除杂、收集、尾气处理的顺序与选择。","次氯酸与漂白粉漂白原理辨析：氧化型漂白与SO2化合型漂白本质不同。","Cl-检验：加AgNO3溶液产生白色沉淀，再加稀硝酸沉淀不溶解。"]},{"title":"物质的量（摩尔质量、气体摩尔体积、物质的量浓度）","keyPoints":["物质的量n表示含有一定数目粒子的集合体，单位mol，阿伏加德罗常数NA约为6.02×10的23次方 mol-1。","摩尔质量M数值上等于相对原子质量或相对分子质量，单位g/mol，m=n·M。","气体摩尔体积Vm：标准状况（0 ℃、101 kPa）约22.4 L/mol，V=n·Vm。","阿伏加德罗定律：同温同压下同体积任何气体含相同分子数，由pV=nRT可推各种比例关系。","物质的量浓度c=n/V，单位mol/L，配制一定浓度溶液需使用容量瓶。","配制溶液步骤：计算、称量或量取、溶解、冷却、转移、洗涤、定容、摇匀。"],"difficultPoints":["22.4 L/mol使用条件严格：必须是标准状况下的气体，非标况或非气体（如SO3、CCl4）不能用。","容量瓶标有温度和容积，不能溶解固体、不能长期存放溶液，定容要平视刻度线。","配制误差分析：砝码放反、未洗涤烧杯、定容俯视或仰视对浓度的影响须逐项判断。","混合溶液浓度计算注意体积变化与粒子组成：如Fe2(SO4)3中Fe3+与SO4(2-)浓度之比为2比3。"],"examPoints":["NA陷阱：微粒数、标况状态、可逆反应、氧化还原转移电子数四类经典错误。","浓度计算与稀释定律：c1V1=c2V2，混合溶液离子浓度计算。","阿伏加德罗定律推论：同温同压下气体密度之比等于摩尔质量之比。","配制一定物质的量浓度溶液的实验操作与误差分析选择题。"]}]},{"period":"高一（下）","textbook":"必修二","tips":["用价-类二维图整理元素化合物：横轴物质类别、纵轴化合价，系统记忆转化关系。","有机物学习抓主线：官能团决定性质，对比甲烷乙烯苯、乙醇乙酸的典型性质。","速率与平衡概念抽象：结合图像与具体反应（如合成氨）理解，不机械背诵结论。","关注化学与生产生活：能源、材料、环境问题积累真实情境素材。"],"modules":[{"title":"铁及其化合物与金属材料","keyPoints":["铁三角转化：Fe、Fe2+、Fe3+相互转化，Fe+2Fe3+=3Fe2+，Fe2+被氧化剂氧化为Fe3+。","Fe3+检验：加KSCN溶液变红；Fe2+检验：先加KSCN不变红，再加氯水变红。","Fe(OH)2制备与转化：白色沉淀迅速变为灰绿再变红褐色，4Fe(OH)2+O2+2H2O=4Fe(OH)3。","铁的氧化物：FeO黑色、Fe2O3红棕色（铁红）、Fe3O4黑色有磁性（磁性氧化铁）。","铁与水蒸气：3Fe+4H2O(g)=Fe3O4+4H2（高温）。","铝的两性：2Al+2NaOH+2H2O=2NaAlO2+3H2↑，铝热反应2Al+Fe2O3=Al2O3+2Fe（高温）。","金属材料：钢含碳0.03%~2%，铝合金密度小强度大，用途广泛。"],"difficultPoints":["Fe2+与Fe3+转化条件：加氧化剂（Cl2、O2、H2O2）氧化，加还原剂（Fe、Cu、I-）还原。","制Fe(OH)2须隔绝氧气：胶头滴管伸入液面下、液面加植物油，否则迅速被氧化变色。","铁与稀硝酸产物随硝酸量变化：Fe过量生成Fe(NO3)2，硝酸过量生成Fe(NO3)3。","区分俗名：铁红Fe2O3、磁性氧化铁Fe3O4、氧化亚铁FeO，推断题常设陷阱。"],"examPoints":["铁三角转化与Fe2+、Fe3+检验、除杂（除FeCl2中FeCl3可加铁粉）。","铁及其化合物在工艺流程中的浸取、沉淀转化，是高考流程题高频金属。","金属冶炼方法对应：电解法（Na、Al）、热还原法（Fe、Cu）、热分解法（Hg、Ag）。","铝热反应用于焊接钢轨与冶炼高熔点金属。"]},{"title":"硫及其化合物（二氧化硫、硫酸）","keyPoints":["硫是黄色固体，难溶于水、微溶于酒精、易溶于CS2，常见价态-2、0、+4、+6。","SO2是酸性氧化物：SO2+H2O=H2SO3，与NaOH反应SO2+2NaOH=Na2SO3+H2O。","SO2的还原性：催化氧化2SO2+O2=2SO3，能使氯水、溴水、酸性KMnO4褪色。","SO2的漂白性：与品红结合生成不稳定无色物质，加热后红色恢复。","浓硫酸特性：吸水性、脱水性、强氧化性，Cu+2H2SO4(浓)=CuSO4+SO2↑+2H2O（加热）。","浓硫酸与碳：C+2H2SO4(浓)=CO2↑+2SO2↑+2H2O（加热）。","酸雨防治：减少SO2、氮氧化物排放，进行脱硫脱硝处理。"],"difficultPoints":["SO2漂白与氯水漂白本质不同：SO2是化合型漂白可逆，Cl2是氧化型漂白不可逆。","SO2使溴水、KMnO4褪色是还原性而非漂白性，概念辨析是高频陷阱。","足量Cu与浓硫酸加热反应后仍有Cu剩余：硫酸变稀后不再反应。","SO2与CO2混合气体检验顺序：品红检验SO2、酸性KMnO4除尽SO2、再用品红确认、最后石灰水检验CO2。"],"examPoints":["SO2性质综合：漂白性、还原性、酸性氧化物的多角度实验设计。","浓硫酸三大特性辨析：吸水性（干燥）、脱水性（蔗糖炭化）、强氧化性（钝化、氧化Cu）。","接触法制硫酸流程：沸腾炉、接触室、吸收塔及各步反应。","含硫物质转化的离子方程式书写与尾气处理计算。"]},{"title":"氮及其化合物（氨、硝酸）","keyPoints":["N2性质稳定（N≡N键能大），放电时N2+O2=2NO，2NO+O2=2NO2。","NO无色有毒不溶于水，NO2红棕色有毒，3NO2+H2O=2HNO3+NO。","氨极易溶于水（约1:700），NH3+H2O⇌NH3·H2O⇌NH4++OH-，可做喷泉实验。","氨的实验室制备：2NH4Cl+Ca(OH)2=CaCl2+2NH3↑+2H2O（加热），向下排空气收集，碱石灰干燥。","铵盐性质：受热分解（NH4Cl=NH3↑+HCl↑），与碱反应NH4++OH-=NH3↑+H2O。","硝酸强氧化性：Cu+4HNO3(浓)=Cu(NO3)2+2NO2↑+2H2O，3Cu+8HNO3(稀)=3Cu(NO3)2+2NO↑+4H2O。","工业合成氨：N2+3H2⇌2NH3（高温、高压、催化剂）。"],"difficultPoints":["硝酸与金属反应不产生H2，产物为NO或NO2；金属过量时先与硝酸反应再与盐反应。","氨气不能用浓硫酸、无水CaCl2干燥，不能用排水法收集，只能用向下排空气法。","喷泉实验原理：气体极易溶于水或与溶液反应造成容器内压强骤降。","氮氧化物溶于水计算：NO2与O2按4:1混合恰好被水完全吸收，4NO2+O2+2H2O=4HNO3。"],"examPoints":["氮及其化合物转化关系（雷雨发庄稼：N2到NO到NO2到硝酸）推断题。","喷泉实验与铵盐检验：加碱加热产生使湿润红色石蕊试纸变蓝的气体。","硝酸与金属反应定量计算：用电子守恒与氮原子守恒法快速求解。","氮氧化物污染治理：汽车尾气催化转化2NO+2CO=N2+2CO2。"]},{"title":"无机非金属材料（硅）","keyPoints":["硅是半导体材料，用于制芯片、太阳能电池，晶体硅结构类似金刚石。","SiO2是酸性氧化物但不与水反应，与NaOH：SiO2+2NaOH=Na2SiO3+H2O。","SiO2与氢氟酸反应：SiO2+4HF=SiF4↑+2H2O，故HF能雕刻玻璃。","硅酸钠Na2SiO3水溶液俗称水玻璃，是矿物胶，可作黏合剂和防火剂。","硅的制备：SiO2+2C=Si+2CO↑（高温），再经Cl2与H2提纯得高纯硅。","传统硅酸盐材料：水泥、玻璃、陶瓷；新型材料：光导纤维（SiO2）、半导体（Si）。"],"difficultPoints":["SiO2是酸性氧化物但只与HF这一种酸反应，不能写SiO2+H2O=H2SiO3。","盛NaOH溶液的试剂瓶用橡胶塞：NaOH与玻璃中SiO2反应生成Na2SiO3黏住瓶口。","硅酸只能通过可溶性硅酸盐与酸反应制取：Na2SiO3+2HCl=H2SiO3↓+2NaCl。","CO2是分子晶体、SiO2是共价晶体，SiO2熔点高硬度大，二者结构性质差异大。"],"examPoints":["SiO2与CO2性质对比辨析：酸性氧化物共性与特殊性（与水、酸反应差异）。","硅及其化合物在芯片、光纤、太阳能电池等科技情境中的应用。","传统无机非金属材料与新型材料判断。","高纯硅制备流程：粗硅到SiCl4再到高纯硅的反应方程式。"]},{"title":"化学反应与能量（热能与电能、原电池）","keyPoints":["化学键断裂吸收能量、形成释放能量，反应热取决于断键与成键能量之差。","常见放热反应：燃烧、中和、金属与酸、大多数化合反应；常见吸热反应：大多数分解、C与CO2等。","原电池原理：负极失电子发生氧化反应，正极得电子发生还原反应，电子由负极经导线流向正极。","铜锌稀硫酸原电池：负极Zn-2e-=Zn2+，正极2H++2e-=H2↑，总反应Zn+2H+=Zn2++H2↑。","原电池构成条件：两种活泼性不同的电极、电解质溶液、形成闭合回路、能自发氧化还原反应。","常见电池：干电池、铅蓄电池、锂电池，氢氧燃料电池碱性介质中负极H2-2e-+2OH-=2H2O。"],"difficultPoints":["电极判断易错：电子流出端为负极，电流方向与电子方向相反，阳离子移向正极。","燃料电池电极反应书写：酸性、碱性、熔融碳酸盐介质中产物不同。","盐桥原电池中盐桥作用：平衡两池电荷、形成闭合回路，阴离子移向负极池。","能量图像分析：反应物能量高于生成物为放热反应，反之为吸热反应。"],"examPoints":["原电池正负极判断、电极反应式书写、电子与电流方向辨析。","新型电池（锂电、燃料电池）情境题：由总反应拆分电极反应式。","由金属活动性设计简单原电池及正负极判断。","吸放热反应判断与能量变化图像分析。"]},{"title":"化学反应速率与限度","keyPoints":["化学反应速率用单位时间内反应物浓度减少或生成物浓度增加表示，单位mol/(L·s)或mol/(L·min)。","同一反应用不同物质表示速率之比等于化学计量数之比。","影响速率因素：浓度越大越快、温度越高越快、催化剂加快、气体压强增大加快、接触面积增大加快。","化学平衡状态标志：v正=v逆不等于0，各组分浓度保持不变。","可逆反应存在限度：反应物不能完全转化，如N2+3H2⇌2NH3。","平衡标志判断：直接标志（v正=v逆、浓度不变）与间接标志（颜色、压强、密度、平均摩尔质量）。"],"difficultPoints":["速率比较须换算为同一物质同一单位，注意mol/(L·s)与mol/(L·min)换算。","恒容等体反应（如H2+I2⇌2HI）中压强、总物质的量始终不变，不能作平衡标志。","密度、平均摩尔质量是否变化取决于反应前后气体总质量与总物质的量是否变化。","用有效碰撞理论解释浓度、温度、催化剂对速率影响的本质。"],"examPoints":["速率计算与大小比较、v-t图像判断平衡状态与条件改变。","平衡标志选择题陷阱：变量恒定与恒定量（压强、密度）的区分。","影响速率因素实验探究：控制变量法设计对比实验。","三段式求转化率与平衡浓度，结合图像读取数据。"]},{"title":"有机化合物基础（甲烷乙烯苯、乙醇乙酸、基本营养物质）","keyPoints":["甲烷正四面体结构，CH4+2O2=CO2+2H2O，光照下与Cl2发生取代反应生成四种氯代物。","乙烯含碳碳双键：CH2=CH2+Br2=CH2BrCH2Br使溴水褪色，能被酸性KMnO4氧化，可加聚成聚乙烯。","苯是平面正六边形，碳碳键介于单双键之间，易取代（卤代、硝化）难加成，不能使溴水褪色。","乙醇与钠：2C2H5OH+2Na=2C2H5ONa+H2↑，催化氧化2C2H5OH+O2=2CH3CHO+2H2O（Cu催化加热）。","乙酸弱酸性，酯化反应CH3COOH+C2H5OH=CH3COOC2H5+H2O（浓硫酸加热，可逆）。","基本营养物质：葡萄糖C6H12O6、蔗糖水解得葡萄糖和果糖、淀粉遇碘变蓝、油脂水解制肥皂、蛋白质水解得氨基酸。"],"difficultPoints":["取代与加成辨析：甲烷卤代是取代、乙烯与溴是加成、苯环是取代为主难加成。","酯化反应实质是酸脱羟基醇脱氢，生成水中的氧来自羧基，可用同位素标记验证。","淀粉与纤维素通式同为(C6H10O5)n但n值不同，不是同分异构体。","蛋白质盐析（可逆物理变化）与变性（不可逆化学变化）严格区分。"],"examPoints":["甲烷、乙烯、苯、乙醇、乙酸性质判断与鉴别（溴水、KMnO4、Na、NaHCO3）。","官能团与性质对应、结构简式书写与简单同分异构体数目。","乙醇催化氧化与乙酸乙酯制备实验：浓硫酸作用、饱和Na2CO3溶液作用、导管不伸入液面下。","营养物质检验：葡萄糖银镜反应、淀粉遇碘变蓝、蛋白质颜色反应。"]}]},{"period":"高二（上）","textbook":"选择性必修一","tips":["原理学习重理解：平衡常数、电离常数、溶度积等系列常数横向对比，弄清表达式与影响因素。","图像题专项训练：先看横纵坐标与特殊点，再结合勒夏特列原理分析。","电化学规范书写：电极反应式注意介质参与配平与电荷守恒。","计算多用守恒法：电荷守恒、物料守恒、电子守恒提高解题效率。"],"modules":[{"title":"化学反应的热效应（焓变、热化学方程式、盖斯定律）","keyPoints":["焓变ΔH等于生成物总能量减反应物总能量，也等于反应物键能总和减生成物键能总和，单位kJ/mol。","放热反应ΔH为负值，吸热反应ΔH为正值。","热化学方程式书写：须注明物质状态（s、l、g、aq），系数可以是分数，ΔH与系数成正比。","中和热：稀溶液中强酸与强碱反应生成1 mol水放出57.3 kJ，H++OH-=H2O，ΔH=-57.3 kJ/mol。","燃烧热：1 mol可燃物完全燃烧生成稳定氧化物时放出的热量，如H2生成液态水、C生成CO2气体。","盖斯定律：反应热只与始态终态有关与途径无关，热化学方程式可相加减求目标反应的ΔH。"],"difficultPoints":["燃烧热与中和热的严格定义：必须是1 mol物质、完全燃烧生成稳定产物。","弱酸弱碱参与的中和热小于57.3 kJ/mol：电离过程吸热。","热化学方程式正误判断：状态漏写、ΔH符号数值与系数不对应、可逆反应中ΔH指完全转化。","键能计算须乘以化学键数目：如1 mol CH4含4 mol C-H键，不可漏乘系数。"],"examPoints":["热化学方程式书写与正误判断，重点考查状态标注与ΔH对应关系。","盖斯定律计算：由多个已知反应求目标反应焓变。","中和热测定实验：保温杯、环形玻璃搅拌棒、温度计读数的规范操作。","能量图像分析：反应物生成物能量高低判吸放热，催化剂降低活化能。"]},{"title":"化学反应速率","keyPoints":["速率表达式v=Δc/Δt，固体和纯液体的浓度视为常数，不能用于表示速率。","影响速率因素：浓度、温度、压强（对气体）、催化剂、接触面积。","催化剂降低活化能，同等程度加快正逆反应速率，不改变平衡状态与反应热。","有效碰撞理论：升温或加催化剂提高活化分子百分数，速率显著加快。","速率方程与速率常数：v=k·c(A)的m次方·c(B)的n次方，指数由实验数据确定。"],"difficultPoints":["压强影响只适用于有气体参与的反应，本质是浓度改变：恒容充入惰性气体速率不变。","催化剂只缩短达到平衡的时间，不改变平衡移动方向与转化率。","放热反应过程中速率先增大后减小的v-t曲线解释是难点。","不同物质表示速率之比等于化学计量数之比，换算时注意单位统一。"],"examPoints":["速率计算（三段式）、不同物质速率比较与比值应用。","控制变量法探究影响速率因素的实验设计与结论。","v-t图像分析：突变点判断改变的条件（升温、加压、加催化剂）。","活化能图像：正逆反应活化能之差等于反应热。"]},{"title":"化学平衡（平衡常数、勒夏特列原理、平衡图像）","keyPoints":["平衡常数K等于生成物浓度幂之积比反应物浓度幂之积，只与温度有关，与浓度压强无关。","浓度商Q与K比较判断方向：Q小于K正向移动，Q大于K逆向移动，Q等于K处于平衡。","三段式计算：起始量、转化量、平衡量列表求转化率与平衡浓度。","勒夏特列原理：改变影响平衡的一个条件，平衡向能减弱这种改变的方向移动。","催化剂不影响平衡移动，只改变到达平衡的时间。","平衡图像：c-t图、v-t图、转化率-温度或压强图，遵循先拐先平数值大。"],"difficultPoints":["压强对平衡移动只适用于气体反应且前后气体计量数之和不相等。","恒容充入惰性气体平衡不移动，恒压充入对气体体积变化的反应有影响。","增大某反应物浓度，自身转化率降低、另一反应物转化率提高。","等效平衡判断：恒温恒容不等体反应须起始量完全相等才等效。"],"examPoints":["K的计算、影响因素与Q、K比较判断移动方向，每年必考。","勒夏特列原理应用：判断颜色、转化率、百分含量的变化。","平衡图像综合：温度压强对转化率影响图、投料比与转化率关系图。","合成氨条件选择：高温高压催化剂兼顾速率、转化率与成本。"]},{"title":"电离平衡与水的离子积（pH计算）","keyPoints":["强电解质完全电离，弱电解质部分电离，存在电离平衡：CH3COOH⇌CH3COO-+H+。","电离常数K只与温度有关，可用于比较弱电解质相对强弱。","电离平衡移动：加水稀释促进电离但离子浓度减小，同离子效应抑制电离。","水的离子积Kw=c(H+)·c(OH-)=1×10-14（25 ℃），升温增大，适用于任何水溶液。","pH=-lg c(H+)，25 ℃时中性溶液pH=7。","强酸强碱混合求pH：先判断过量，酸过量直接算c(H+)，碱过量先算c(OH-)再换算。"],"difficultPoints":["稀释弱酸时pH变化小于强酸：加水促进电离，c(H+)下降慢。","pH=7不一定中性：100 ℃时中性pH=6，判断中性看c(H+)是否等于c(OH-)。","Kw适用于酸、碱、盐任何水溶液，酸溶液中c(OH-)由Kw除以c(H+)求得。","同浓度强弱酸pH不同、与金属反应速率不同，但中和碱的能力相同。"],"examPoints":["pH计算：稀释、混合、酸过量碱过量分类讨论。","水电离出的c(H+)或c(OH-)计算：酸碱抑制、盐水解三种情形。","强弱电解质比较实验设计：同浓度测pH、测导电性、与金属反应快慢。","电离常数应用：比较酸性强弱、判断反应方向与离子共存。"]},{"title":"盐类水解与沉淀溶解平衡","keyPoints":["盐类水解本质：盐电离出的离子与水电离的H+或OH-结合生成弱电解质，促进水的电离。","水解规律：有弱才水解、无弱不水解、谁弱谁水解、越弱越水解、谁强显谁性。","Na2CO3分步水解：CO3(2-)+H2O⇌HCO3-+OH-，HCO3-+H2O⇌H2CO3+OH-。","水解平衡影响因素：升温促进、稀释促进、加酸碱抑制或促进、同离子抑制。","水解应用：明矾净水、纯碱加热去油污、配制FeCl3溶液加盐酸抑制水解。","沉淀溶解平衡：AgCl(s)⇌Ag++Cl-，Ksp=c(Ag+)·c(Cl-)只与温度有关。","Ksp应用：Q大于Ksp生成沉淀，Q小于Ksp沉淀溶解；沉淀可转化如AgCl到AgI到Ag2S。"],"difficultPoints":["双水解不共存：Al3+与HCO3-、CO3(2-)、S2-、AlO2-，如Al3++3HCO3-=Al(OH)3↓+3CO2↑。","离子浓度大小比较用三守恒：电荷守恒、物料守恒、质子守恒。","酸式盐判断：NaHCO3中HCO3-水解大于电离显碱性，NaHSO3电离大于水解显酸性。","蒸干灼烧盐溶液产物：FeCl3蒸干灼烧得Fe2O3，AlCl3得Al2O3，Na2CO3不变。"],"examPoints":["盐溶液酸碱性判断、pH大小比较、离子浓度大小排序（三守恒）。","水解平衡移动图像：稀释、升温曲线中离子浓度变化。","Ksp计算与沉淀生成判断、沉淀转化应用（锅炉除垢、废水处理）。","用盐类水解原理设计实验比较CH3COOH与H2CO3酸性强弱。"]},{"title":"电化学（原电池、电解池、金属腐蚀与防护）","keyPoints":["原电池：负极发生氧化反应、正极发生还原反应，电子由负极经外电路流向正极，阳离子移向正极。","电解池：阳极（接电源正极）发生氧化反应，阴极（接负极）发生还原反应，阳离子移向阴极。","电解饱和食盐水（氯碱工业）：2NaCl+2H2O=2NaOH+H2↑+Cl2↑（通电）。","电解精炼铜：粗铜作阳极、纯铜作阴极、CuSO4溶液作电解液，阳极泥回收金银。","金属腐蚀：吸氧腐蚀为主，负极Fe-2e-=Fe2+，正极O2+2H2O+4e-=4OH-；酸性环境发生析氢腐蚀。","金属防护：牺牲阳极保护法（连接更活泼金属）、外加电流阴极保护法、镀层与涂层。"],"difficultPoints":["放电顺序：阳极阴离子S2-、I-、Br-、Cl-先于OH-放电，阴极阳离子按金属活动性逆序放电。","电解后恢复原浓度：电解CuSO4溶液加CuO或CuCO3恢复，电解NaCl溶液通入HCl。","吸氧腐蚀与析氢腐蚀条件区分及铁锈生成过程（Fe(OH)2到Fe(OH)3脱水）。","燃料电池电极反应书写须结合介质：酸性、碱性、熔融碳酸盐产物不同。"],"examPoints":["原电池、电解池综合判断：电极、产物、电子转移数与pH变化。","电解计算：电子守恒法，串联电路转移电子数相等，求气体与析出金属量。","金属腐蚀快慢比较：电解原理腐蚀最快，原电池次之，化学腐蚀较慢。","电冶金与工业应用：电解熔融NaCl制钠、电解Al2O3制铝。"]}]},{"period":"高二（下）","textbook":"选择性必修二、三","tips":["结构决定性质：从原子结构、分子结构、晶体结构解释物质性质差异。","晶胞计算掌握均摊法：顶点1/8、棱心1/4、面心1/2、体心1，注意单位换算。","有机建立转化网络：卤代烃到醇到醛到羧酸到酯的转化关系反复默写。","同分异构体有序书写：先类别异构、再碳链异构、再位置异构，防止漏写重写。"],"modules":[{"title":"原子结构与性质（能级、电子排布、电离能、电负性）","keyPoints":["能层与能级：K、L、M、N能层含s、p、d、f能级，各能级最多容纳2(2l+1)个电子。","构造原理：1s、2s、2p、3s、3p、4s、3d、4p顺序填充，遵循能量最低原理、泡利原理、洪特规则。","电子排布式书写：Fe为1s2 2s2 2p6 3s2 3p6 3d6 4s2，注意3d6写在4s2前。","第一电离能：同周期从左到右增大（ⅡA、ⅤA反常），同主族从上到下减小。","电负性：F最大为4.0，同周期增大、同主族减小，用于判断化学键极性。","原子半径：同周期从左到右减小，同主族从上到下增大。"],"difficultPoints":["洪特规则特例：半充满、全充满稳定，如Cr为3d5 4s1、Cu为3d10 4s1。","第一电离能反常：Mg大于Al（3s2全满）、N大于O（2p3半满）、P大于S。","阳离子排布先失最外层电子：Fe2+为3d6而非3d4 4s2，书写顺序易错。","电子云与轨道形状辨析：s轨道球形、p轨道哑铃形，电子云密度表示出现概率。"],"examPoints":["电子排布式、价电子排布与元素推断，是高考结构题第一问常考点。","电离能、电负性比较及用半满全满稳定性解释反常。","元素周期律综合：由位置推性质、由电离能电负性推位置。","基态与激发态、光谱与焰色反应本质概念辨析。"]},{"title":"分子结构与性质（共价键、杂化轨道、分子间作用力）","keyPoints":["共价键类型：σ键头碰头可单独存在，π键肩并肩随σ键存在，单键1个σ、双键1σ+1π、三键1σ+2π。","键参数：键能、键长、键角决定分子的稳定性与空间结构。","杂化类型：sp3（CH4正四面体）、sp2（C2H4平面形）、sp（C2H2直线形）。","VSEPR理论：由价层电子对数判断分子空间构型，注意孤对电子排斥作用。","分子极性：正负电荷中心重合为非极性分子（CO2、CH4），不重合为极性分子（H2O、NH3）。","分子间作用力：范德华力随相对分子质量增大而增强；氢键存在于F、O、N与H之间。","氢键影响：H2O沸点反常高于H2S，影响溶解性与生物大分子结构。","配位键与配合物：Cu2++4NH3=[Cu(NH3)4]2+呈深蓝色，配位数4。"],"difficultPoints":["σ键π键数目计算：C2H4含5个σ键1个π键，N2含1个σ键2个π键。","杂化类型判断：由价层电子对数确定，如SO2为sp2、NH3为sp3（含孤对电子）。","分子极性判断：H2O、NH3为极性分子，CO2、CH4为非极性分子。","氢键是分子间作用力不是化学键，HF分子间氢键使其沸点反常高。","等电子体应用：CO与N2、SO2与O3等电子体结构与性质相似。"],"examPoints":["σ键π键数目、杂化轨道类型判断，高考结构题高频考点。","键角比较与解释：孤对电子对成键电子对排斥更大。","沸点、溶解性比较：相似相溶规律与氢键、范德华力分析。","配合物书写与结构分析：中心离子、配体、配位数。"]},{"title":"晶体结构与性质（晶胞计算）","keyPoints":["晶体类型：离子晶体（NaCl、CaO）、共价晶体（金刚石、SiO2）、分子晶体（干冰、冰）、金属晶体。","晶体性质：共价晶体熔点高硬度大，分子晶体熔沸点低，离子晶体熔点较高，金属晶体导电导热。","均摊法：晶胞顶点粒子贡献1/8、棱心1/4、面心1/2、体心1，计算晶胞中粒子数。","NaCl晶胞：Na+与Cl-配位数均为6，晶体中无独立分子。","金刚石中每个C连4个C，1 mol金刚石含2 mol C-C键；SiO2中每个Si连4个O。","晶胞密度计算：密度等于晶胞质量除以晶胞体积，晶胞质量等于粒子数乘摩尔质量除以NA。"],"difficultPoints":["均摊法计数易错：粒子位于顶点、棱心、面心、体心的贡献不同。","密度与晶胞参数换算：注意pm、nm与cm单位换算及NA代入。","化学键数计算：1 mol SiO2含4 mol Si-O键，1 mol P4含6 mol P-P键，1 mol石墨含1.5 mol C-C键。","熔点比较：共价晶体大于离子晶体大于分子晶体，离子晶体看离子半径与电荷。"],"examPoints":["晶胞粒子数、配位数与化学式推断，均摊法必考。","密度、阿伏加德罗常数、晶胞参数三者换算的计算题。","晶体类型判断与熔沸点比较：金刚石、NaCl、干冰、冰。","石墨、C60、石墨烯等新型材料结构性质分析。"]},{"title":"有机物的分类命名与同分异构体","keyPoints":["常见官能团：羟基-OH（醇酚）、醛基-CHO、羧基-COOH、酯基-COO-、羰基、氨基。","系统命名法：选含官能团的最长碳链为主链，编号使官能团位次最小，取代基按位次名称书写。","烷烃命名：如2,2-二甲基丙烷、3-甲基戊烷，数字与汉字间用短线连接。","同分异构体类型：碳链异构、位置异构、官能团异构。","常见官能团异构：CnH2n+2O醇与醚、CnH2nO2羧酸与酯互为同分异构体。","常见数目：C4H10有2种、C5H12有3种、C4H9Cl有4种、C4H8烯烃有3种。","手性碳：连有四个不同原子或基团的碳原子，存在手性异构。"],"difficultPoints":["命名易错：烯烃双键位次最小原则、支链合并、苯环上取代基编号。","同分异构体有序书写：先类别异构再碳链异构再位置异构，防止遗漏。","限定条件同分异构体：含苯环、含指定官能团，先定骨架再排位置。","一氯代物数目判断用等效氢法：对称位置氢等效。"],"examPoints":["有机物命名与官能团识别，是高考有机大题第一问。","同分异构体数目判断与书写：C4H10O、C5H10O2等常考。","限定条件下同分异构体推断：结合核磁共振氢谱峰数与特征反应。","有机物分类辨析：脂肪烃与芳香烃、醇酚醚醛酮羧酸酯。"]},{"title":"烃及其衍生物（卤代烃醇酚醛酮羧酸酯）","keyPoints":["烷烃：通式CnH2n+2，特征反应取代（光照卤代）与燃烧，不能加成。","烯烃：通式CnH2n，能加成（H2、X2、HX、H2O）、加聚，使溴水与KMnO4褪色。","乙炔CH≡CH直线形，加成分两步：CH≡CH+2Br2=CHBr2CHBr2。","苯能取代（卤代、硝化）难加成，甲苯侧链能被KMnO4氧化为苯甲酸。","卤代烃水解（NaOH水溶液加热）与消去（NaOH醇溶液加热），检验卤素须先水解再加硝酸酸化。","醇：与Na反应、浓硫酸170 ℃消去、催化氧化（-CH2OH氧化为醛、-CHOH氧化为酮）。","苯酚弱酸性：与NaOH、Na2CO3反应不与NaHCO3反应，与FeCl3显紫色，与饱和溴水生成三溴苯酚。","醛：银镜反应与Cu(OH)2加热生成砖红色沉淀，可被氧化为羧酸。","羧酸与酯：酯化反应酸脱羟基醇脱氢，酯在碱性条件下水解（皂化）完全。"],"difficultPoints":["卤代烃消去与水解条件辨析：NaOH醇溶液加热消去，NaOH水溶液加热水解。","醇催化氧化规律：羟基碳上有2个H氧化为醛、1个H氧化为酮、无H不能催化氧化。","银镜反应条件：水浴加热、碱性环境、试管洁净，1 mol醛基定量生成2 mol Ag。","由反应条件反推官能团：与Na放氢是羟基或羧基、溴水褪色是碳碳双键、银镜是醛基。"],"examPoints":["烃燃烧规律与气态烃体积变化计算。","乙醇、苯酚、乙酸酸性比较：用Na、NaOH、Na2CO3、NaHCO3分步检验。","有机反应类型判断：取代、加成、消去、氧化、还原、加聚、缩聚。","卤代烃到醇到醛到羧酸到酯的转化推断，高考有机大题骨架。"]},{"title":"糖类油脂蛋白质核酸","keyPoints":["葡萄糖C6H12O6是多羟基醛，能发生银镜反应与新制Cu(OH)2反应生成砖红色沉淀。","葡萄糖与果糖互为同分异构体，蔗糖与麦芽糖互为同分异构体（C12H22O11）。","蔗糖水解：C12H22O11+H2O=C6H12O6+C6H12O6（葡萄糖与果糖），麦芽糖水解生成两分子葡萄糖。","淀粉遇碘变蓝，水解最终产物为葡萄糖；纤维素水解也生成葡萄糖但人体不能消化。","油脂是高级脂肪酸甘油酯，水解生成高级脂肪酸与甘油，皂化反应制肥皂；不饱和油脂能使溴水褪色。","蛋白质由氨基酸脱水缩合形成，水解最终产物为氨基酸，具有两性。","蛋白质性质：盐析（可逆）、变性（不可逆）、颜色反应（浓硝酸变黄）、灼烧有烧焦羽毛气味。","核酸DNA、RNA由核苷酸聚合而成，是遗传信息的载体。"],"difficultPoints":["单糖（葡萄糖果糖）不能水解，二糖（蔗糖麦芽糖）与多糖（淀粉纤维素）可水解。","淀粉水解程度检验：先加NaOH中和硫酸，再检验葡萄糖，同时用碘水检验淀粉是否剩余。","油脂是混合物不是高分子化合物，淀粉、纤维素、蛋白质是天然高分子化合物。","盐析与变性区分：盐析加轻金属盐可逆，变性加热或加重金属盐不可逆。"],"examPoints":["营养物质检验实验：葡萄糖银镜与Cu(OH)2、淀粉遇碘、蛋白质颜色反应与灼烧。","糖类水解产物与水解条件、蔗糖与麦芽糖关系判断。","油脂皂化反应方程式、肥皂去污原理与硬化油（加氢）。","蛋白质变性在消毒杀菌中的应用与重金属盐中毒急救（喝牛奶）。"]},{"title":"有机合成与推断","keyPoints":["核心转化链：卤代烃水解得醇、醇氧化得醛、醛氧化得羧酸、醇酸酯化得酯。","引入碳碳双键：卤代烃或醇的消去反应；引入卤原子：烷烃光照取代或烯烃加成。","加成反应引入官能团：烯烃与水加成得醇、与HX加成得卤代烃、加氢还原。","氧化还原：醇到醛到羧酸是氧化，醛、酮、烯烃加氢是还原。","逆合成分析：从目标产物官能团倒推原料与中间体，设计合成路线。","常见条件记忆：NaOH水溶液加热（水解）、NaOH醇溶液加热（消去）、浓硫酸170 ℃（醇消去）、Cu加热（醇催化氧化）。"],"difficultPoints":["逆合成思维：考虑碳骨架变化与官能团转化，从目标产物逐级切断。","官能团保护：酚羟基、氨基在氧化或酯化前需先保护后脱保护。","推断突破口：分子式算不饱和度，特征反应定官能团，核磁共振氢谱定结构。","合成路线评价：比较步骤数、产率、原子经济性与条件温和度。"],"examPoints":["高考有机大题：填结构简式、写方程式、判断反应类型、写同分异构体。","应用题给新信息（陌生反应）设计合成路线。","有机推断综合：分子式、不饱和度、红外与核磁数据联合推断。","官能团转化路线书写：要求试剂、催化剂、温度等条件齐全。"]}]},{"period":"高三","textbook":"高考总复习","tips":["一轮构建知识网络，二轮专题突破高频考点，三轮回归教材与真题。","限时训练与规范表达：选择题限时训练，大题按评分标准规范作答。","建立错题本并按板块归类，分析错因：概念不清、审题失误或表述不规范。","精做近5年高考真题，总结命题角度与答案组织规律。"],"modules":[{"title":"化学实验基础（仪器操作、分离提纯、气体制备）","keyPoints":["常用仪器使用要点：容量瓶、分液漏斗、冷凝管、坩埚、蒸发皿的用途与注意事项。","分离提纯方法：过滤、蒸发、蒸馏、萃取分液、结晶、渗析、盐析的选择依据。","常见离子检验：Cl-加AgNO3与稀硝酸，SO4(2-)先加盐酸无沉淀再加BaCl2，NH4+加碱加热。","气体制备装置：固固加热（O2、NH3）、固液不加热（H2、CO2）、固液加热（Cl2、SO2）。","气体净化与尾气处理：除杂试剂选择、防倒吸装置、安全瓶。","药品保存：钠放煤油、白磷放冷水、NaOH密封用橡胶塞、浓硝酸棕色瓶避光。","实验安全：酒精灯使用、加碎瓷片防暴沸、通风橱防中毒、事故应急处理。"],"difficultPoints":["蒸馏与蒸发区分：蒸馏分离沸点不同的互溶液体，蒸发浓缩结晶得固体。","萃取分液操作：检漏、振荡放气、下层从下口放出、上层从上口倒出。","气体收集方法：依据密度选排空气法、依据溶解性选排水法、与空气反应不能排空气收集。","除杂原则：不引入新杂质、不减少被提纯物、易分离，除杂试剂过量须再处理。"],"examPoints":["实验操作正误判断（必考选择题）：读数、定容、洗涤、加热等细节。","分离提纯方法选择：依据溶解度、沸点、密度等性质差异。","装置组合题：制备、除杂、收集、尾气处理连接与评价。","实验方案评价：可行性、安全性、环保性（绿色化学）。"]},{"title":"实验综合探究（定量实验、探究性实验设计）","keyPoints":["定量实验：中和滴定（指示剂选择、终点判断、误差分析）、配制溶液、气体体积测定。","探究实验设计思路：明确目的、提出假设、控制变量设计对比实验、预测现象、得出结论。","检验验证实验的逻辑：证伪与证实结合，如SO2与CO2混合气体逐一检验。","规范表述：操作、现象、结论三步式，取样品、加试剂、若出现某现象则证明某结论。","数据处理：多次测量取平均、异常数据舍弃、计算相对误差。"],"difficultPoints":["中和滴定终点判断：滴入最后半滴溶液变色且半分钟内不褪色，滴定管读数须估读。","定量实验误差分析：从操作对消耗体积的影响推理，如俯视仰视读数方向。","控制变量法：探究实验中只改变一个变量，其他条件保持相同。","陌生实验方案设计：结合题给信息设计检验、定量测定或性质探究方案。"],"examPoints":["酸碱中和滴定计算与误差分析，高考实验大题高频。","探究性实验综合题：解释现象、得出结论、评价与改进方案。","方案严谨性评价：有无对照实验、能否达到实验目的。","定量测定样品纯度：关系式法计算，如碳酸钙与盐酸反应测CO2体积。"]},{"title":"工艺流程题专项","keyPoints":["流程结构：原料预处理（粉碎、焙烧、酸浸、碱浸）、核心反应、分离提纯、产品获得。","操作目的：粉碎增大接触面积加快反应，加热提高速率与溶解度，搅拌使反应充分。","酸浸碱浸作用：溶解目标金属或氧化物、除去杂质。","氧化还原调节：加氧化剂将Fe2+氧化为Fe3+便于后续沉淀除去。","调节pH沉淀法：控制pH使杂质离子（如Fe3+）先沉淀而目标离子不沉淀。","结晶方法：溶解度随温度变化大用蒸发浓缩冷却结晶，变化小用蒸发结晶。","绿色化学：母液循环利用、尾气处理、废渣回收再利用。"],"difficultPoints":["隐含信息挖掘：由pH范围判断离子沉淀顺序，由Ksp计算沉淀完全所需pH。","流程中离子方程式书写：结合酸碱性环境确定产物与介质离子。","氧化剂还原剂选择与过量原因、沉淀洗涤与检验是否洗净。","判断流程中可循环利用的物质：返回前面步骤再利用的原料。"],"examPoints":["金属冶炼与提纯流程（Fe、Al、Cu、Mg、Ti）综合大题。","化工生产中条件控制目的解释：温度、pH、过量试剂。","流程中化学方程式与离子方程式书写、产率计算。","陌生元素流程（Li、Co、Mn电池材料回收）信息迁移应用。"]},{"title":"阿伏加德罗常数（NA）陷阱","keyPoints":["微粒数陷阱：分子、原子、离子、质子、中子、电子数目计算，如1 mol Na2O2含2 mol Na+和1 mol O2(2-)。","标况状态陷阱：SO3是固体、NO2存在聚合、HF、CCl4、苯、乙醇标况下不是气体。","可逆反应陷阱：N2与H2、SO2与O2、Cl2与H2O等反应不能完全转化。","电子转移陷阱：Na2O2与H2O反应1 mol转移1 mol电子，Cl2与NaOH歧化1 mol转移1 mol电子。","溶剂与溶液陷阱：水中也含氧原子，氨水中的溶质视为NH3·H2O。","特殊结构：1 mol SiO2含4 mol Si-O键，1 mol P4含6 mol P-P键，1 mol石墨含1.5 mol C-C键。"],"difficultPoints":["电离与水解影响离子数：弱电解质部分电离、盐类水解使离子数目变化。","气体摩尔体积条件辨析：必须标准状况且为气体才能用22.4 L/mol。","聚集状态陷阱：标准状况下水为液态，NO2与N2O4存在平衡。","核素计算：D2O、T2O、18O2中中子、质子数计算易错。"],"examPoints":["NA选择题每年必考：逐项从状态、可逆、电子转移、结构四类陷阱排查。","结合氧化还原与电化学计算转移电子数。","结合电解质溶液计算离子数目，考虑电离与水解。","混合气体平均摩尔质量与分子总数计算。"]},{"title":"离子方程式与离子共存专项","keyPoints":["离子方程式书写规范：符合客观事实、强酸强碱可溶盐拆写、原子与电荷守恒。","与量有关的反应：过量少量与滴加顺序，如Ca(OH)2与NaHCO3、Na2CO3与盐酸互滴。","离子共存隐含条件：无色排除Cu2+、Fe3+、Fe2+、MnO4-，强酸或强碱性环境判断。","因氧化还原不共存：Fe3+与I-、S2-，MnO4-与Fe2+、I-、SO3(2-)，ClO-与还原性离子。","因双水解不共存：Al3+与HCO3-、CO3(2-)、AlO2-、S2-，Fe3+与HCO3-、CO3(2-)。","因络合不共存：Fe3+与SCN-形成血红色配合物，Cu2+与过量NH3形成深蓝色配合物。"],"difficultPoints":["隐含条件识别：水电离c(H+)=1×10-13 mol/L时溶液可能显酸性也可能显碱性。","加铝放出氢气：溶液可能是强酸（无硝酸）也可能是强碱，两种情况都要考虑。","书写陷阱：氨水是弱碱不拆、微溶物生成不拆、浓硫酸不拆。","与量有关方程式突破口：少量物质按1 mol完全反应确定计量关系。"],"examPoints":["离子共存选择题必考：综合隐含条件、氧化还原、双水解三类限制。","离子方程式正误判断：从事实、拆写、守恒、量的关系四角度找错。","给定反应物与现象书写离子方程式，常见于工艺流程与实验情境。","除杂提纯中的离子反应：除CO3(2-)加盐酸、除SO4(2-)加BaCl2。"]},{"title":"氧化还原与电化学综合","keyPoints":["守恒法计算：电子守恒、原子守恒、电荷守恒三守恒解氧化还原计算题。","强弱比较：氧化剂氧化性大于氧化产物，还原剂还原性大于还原产物。","陌生方程式书写：标价态、定产物、配平、补介质（酸性补H+、碱性补OH-）。","电化学综合：原电池电解池判断、电极反应书写、离子迁移方向、pH变化。","电解计算：电子守恒，气体体积与析出金属质量换算。","金属腐蚀防护：牺牲阳极保护法、外加电流阴极保护法。"],"difficultPoints":["电子转移与计量数对应：3Cu+8HNO3(稀)转移6 mol电子，按比例计算。","离子交换膜作用：质子交换膜、阴离子交换膜只允许特定离子通过。","二次电池充放电：放电时负极充电时作阴极接电源负极，电极反应互逆。","多种元素变价：如Cu2S与O2反应，需逐元素分析电子转移。"],"examPoints":["氧化还原计算：金属与硝酸反应生成气体的电子守恒速解。","电化学综合题：二次电池、燃料电池的充放电分析。","含介质补全的氧化还原方程式书写与配平。","金属腐蚀快慢比较与防护方法判断。"]},{"title":"反应速率与平衡图像专项","keyPoints":["图像类型：浓度-时间、速率-时间、转化率-温度或压强、等温线等压线、投料比图。","v-t图分析：突变点判断条件改变，浓度突变速率跳变，温度压强渐变，催化剂不移动平衡。","先拐先平数值大：先达平衡的曲线对应温度高或压强大。","K与温度图像：升温K增大为吸热反应，K减小为放热反应。","投料比与转化率：两种反应物按化学计量数比投料时转化率最大。","平衡计算：三段式求转化率、平衡常数、平均摩尔质量。"],"difficultPoints":["条件改变与平衡移动对应：看平衡点移动后正逆速率相对大小。","恒温线恒压线辨析：转化率随压强变化图像判断气体计量数大小关系。","等效平衡与图像结合：不同投料比达到同一平衡状态。","加压与加催化剂都使速率增大，但加压改变平衡、催化剂不改变平衡。"],"examPoints":["平衡图像选择题必考：判断吸放热、气体计量数、平衡移动方向。","平衡常数计算与图像结合，高考大题高频。","工业条件选择：合成氨转化率与温度压强关系，选择最佳条件。","三段式计算与图像数据读取：起始量、平衡量、转化率。"]},{"title":"有机合成推断专项","keyPoints":["推断突破口：分子式与不饱和度、特征反应（银镜、FeCl3显色、溴水褪色）、光谱数据。","官能团特征反应归纳：醛基银镜与Cu(OH)2、酚羟基FeCl3显色、羧基与NaHCO3放CO2。","合成路线设计：目标产物逆推法，兼顾碳骨架增减与官能团转化。","题给新信息应用：理解陌生反应的断键成键位置后迁移书写。","分子式确定：燃烧法、元素分析、质谱相对分子质量。","限定条件同分异构体：含苯环、核磁峰数、特征反应逐一排查。"],"difficultPoints":["逆合成分析思维：从目标产物出发分段切断，规划合理路线。","官能团保护与反应顺序：多官能团物质反应先后选择。","新信息反应迁移：读懂信息中断键成键位置再书写产物。","限定条件同分异构体书写是区分度最大的难点，须有序系统思考。"],"examPoints":["有机推断综合大题必考：推断结构简式、写方程式、判断反应类型。","限定条件同分异构体书写与数目判断。","合成路线设计：用给定原料合成目标化合物，高考新题型。","有机综合计算与信息迁移应用。"]}]}]},{"id":"biology","name":"生物","icon":"🧬","color":"#38d9a9","intro":"高中生物涵盖分子与细胞、遗传与进化、稳态与调节、生物与环境、生物技术与工程五大模块，注重科学探究与理性思维，是高考理综的重要得分科目。","examTrend":["重视基础概念与核心过程考查，如光合作用、呼吸作用、遗传规律、调节机制的过程图解分析。","情境化命题增多：以科研、生产、生活、健康为背景考查知识应用能力与科学思维。","实验探究题比重加大，考查实验设计、变量控制、结果预测与评价改进。","长句表述题增加，考查用规范生物学语言准确描述原因、过程与结论。","图表信息题高频出现：曲线、柱状图、系谱图、流程图、装置图的解读与绘制。","跨模块综合考查：光合与呼吸综合、遗传与变异综合、调节网络综合、生态与进化综合。"],"periods":[{"period":"高一（上）","textbook":"必修一","tips":["必修一以分子与细胞为主线，重在理解结构与功能相适应，先记牢细胞器与生物大分子的基础概念。","重视实验操作与原理，蛋白质鉴定、质壁分离、显微镜使用等实验要会设计对照、分析现象。","建议用概念图梳理知识网络，区分易混概念（如自由扩散与协助扩散、肽键数与脱水数）。","注意与化学衔接，有机分子组成、元素推断等需扎实掌握。"],"modules":[{"title":"组成细胞的分子","keyPoints":["蛋白质基本单位是氨基酸，约20种，至少含一个氨基和一个羧基，且连在同一碳原子上。","氨基酸通过脱水缩合形成肽链，肽键数等于脱去水分子数，等于氨基酸数减肽链数。","蛋白质结构多样性由氨基酸种类、数目、排列顺序及肽链空间结构决定，功能具有多样性。","核酸包括DNA和RNA，基本单位是核苷酸，DNA含脱氧核糖和T，RNA含核糖和U。","糖类是主要能源物质，单糖可直接被吸收，多糖包括淀粉、纤维素和糖原。","脂质包括脂肪（储能）、磷脂（构成生物膜）和固醇（胆固醇、性激素、维生素D）。"],"difficultPoints":["蛋白质相关计算易错：脱水数等于肽键数，环状肽肽键数等于氨基酸数，需留意游离氨基羧基计数。","氨基酸判断易错：R基上含氨基或羧基的不算数，必须同时含氨基和羧基且连在同一碳原子上。","还原糖、脂肪、蛋白质鉴定实验的条件易混：斐林试剂需水浴加热且现配现用。","糖类脂质分类易混：脂肪不是多糖，胆固醇属于固醇，几丁质是含氮多糖。"],"examPoints":["蛋白质结构与功能、脱水缩合计算是高频考点，常以选择题考查肽键数和相对分子质量。","DNA与RNA碱基、五碳糖差异判断是经典考点，注意T与U、脱氧核糖与核糖的对应。","检测生物组织中糖类、脂肪和蛋白质实验常考，注意试剂选择、条件与颜色反应。","组成细胞的元素含量排序易考：鲜重中O最多、C次之，干重中C最多。","蛋白质功能举例（催化、运输、免疫、调节）常结合具体蛋白质实例命题。"]},{"title":"细胞的基本结构","keyPoints":["细胞膜主要由磷脂双分子层和蛋白质组成，还有少量糖类，具有流动性和选择透过性。","细胞膜功能：将细胞与外界环境隔开、控制物质进出细胞、进行细胞间的信息交流。","细胞器分工：线粒体是有氧呼吸主要场所，叶绿体是光合作用场所，核糖体是蛋白质合成场所。","内质网参与蛋白质加工和脂质合成，高尔基体与蛋白质加工分泌及植物细胞壁形成有关。","溶酶体含多种水解酶是消化车间，液泡含细胞液与植物细胞渗透吸水密切相关。","细胞核是遗传信息库、细胞代谢和遗传的控制中心，核孔实现核质间物质交换和信息交流。"],"difficultPoints":["细胞器分工易混：与能量转换有关的是线粒体和叶绿体，含核酸的是叶绿体、线粒体和核糖体。","分泌蛋白合成运输途径易错：核糖体→内质网→高尔基体→细胞膜，需同位素标记法追踪。","原核细胞与真核细胞区别易错：原核无核膜和染色体，只有核糖体一种细胞器。","细胞膜流动性与选择透过性概念易混：流动性是结构基础，选择透过性体现功能特性。"],"examPoints":["分泌蛋白的合成、加工和运输过程是高频考点，常结合同位素标记法考查。","细胞膜流动镶嵌模型及膜蛋白功能是经典考点，常考结构、功能与实例对应。","细胞核功能实验（黑白美西螈核移植、蝾螈受精卵横缢实验）是经典实验考查点。","细胞器结构功能比较（有无膜、有无核酸）常以选择题形式考查。","观察叶绿体和细胞质流动、健那绿染线粒体实验易考材料选择与操作细节。"]},{"title":"细胞的物质输入与输出","keyPoints":["渗透作用：水分子从低浓度溶液一侧透过半透膜向高浓度溶液一侧扩散，条件是半透膜和浓度差。","自由扩散：顺浓度梯度、不需载体和能量，如O2、CO2、甘油、乙醇、苯等脂溶性物质。","协助扩散：顺浓度梯度、需载体蛋白或通道蛋白、不需能量，如葡萄糖进入红细胞。","主动运输：逆浓度梯度、需载体蛋白和能量，如K+进入细胞、葡萄糖和氨基酸进入小肠上皮细胞。","原生质层由细胞膜、液泡膜及两膜之间的细胞质组成，相当于半透膜，是质壁分离实验的基础。","质壁分离及复原实验证明原生质层相当于半透膜，且可判断细胞死活。"],"difficultPoints":["三种跨膜运输方式判断易混：抓住浓度梯度、是否需要载体、是否需要能量三个维度分析。","质壁分离实验易错：选材需紫色洋葱鳞片叶外表皮，外界溶液浓度要大于细胞液浓度。","渗透作用与扩散概念易混：渗透是水分子透过半透膜的特殊扩散，浓度差指不能透过半透膜的溶质差。","主动运输意义理解难：保证活细胞按需吸收营养、排出废物，体现细胞膜的选择透过性。"],"examPoints":["物质跨膜运输方式判断是高频考点，常结合浓度、能量、载体三条曲线考查。","质壁分离及复原实验是经典实验题，常考选材、操作、现象及细胞死活判断。","自由扩散与协助扩散曲线区别易考：协助扩散受载体数量限制出现饱和现象。","主动运输与细胞代谢的关系：缺能量或载体时运输受阻，体现膜的功能特性。","陷阱：水分子主要通过水通道蛋白协助扩散，甘油乙醇等脂溶性小分子以自由扩散为主。"]}]},{"period":"高一（下）","textbook":"必修一（后段）与必修二","tips":["必修二遗传部分抽象性强，建议结合减数分裂理解分离定律和自由组合定律的细胞学基础。","光合作用与呼吸作用是难点，务必分清场所、物质变化、能量变化，多做过程图解练习。","遗传概率计算要多练，掌握分解组合法和配子法，注意自交与自由交配的区别。","必修一后段（细胞代谢、生命历程）与必修二衔接紧密，注意前后知识整合。"],"modules":[{"title":"细胞的能量供应和利用","keyPoints":["酶是活细胞产生的具有催化作用的有机物，绝大多数是蛋白质，具有高效性、专一性和作用条件温和。","酶催化机理是降低化学反应的活化能，不改变化学反应的平衡点，反应前后酶本身不变。","ATP是细胞直接能源物质，结构简式A-P~P~P，与ADP相互转化伴随能量的储存和释放。","有氧呼吸第一阶段在细胞质基质，第二阶段在线粒体基质，第三阶段在线粒体内膜。","有氧呼吸过程：葡萄糖分解为丙酮酸和[H]，[H]与O2结合生成水并释放大量能量。","无氧呼吸在细胞质基质进行，产物是酒精和CO2（植物、酵母菌）或乳酸（动物、乳酸菌）。"],"difficultPoints":["有氧呼吸三个阶段场所与产物易混：第三阶段在线粒体内膜，[H]与O2结合生成水。","光合与呼吸综合题难在净光合速率、总光合速率与呼吸速率的区分及曲线分析。","影响光合作用因素（光照强度、CO2浓度、温度）的曲线分析是难点，注意光补偿点与饱和点。","酶活性受温度、pH影响的曲线易错：高温、强酸强碱使酶空间结构破坏而永久失活。"],"examPoints":["光合作用与细胞呼吸过程图解是高频考点，常考场所、物质变化和能量变化。","光合作用探究历程（萨克斯、恩格尔曼、鲁宾和卡门）是经典实验考查点。","净光合与呼吸速率测定实验常考：黑暗测呼吸，光照测净光合，总光合等于二者之和。","种子储存、果蔬保鲜等实际应用考查呼吸原理：低温、低氧、干燥可抑制呼吸作用。","陷阱：ATP不是储能物质，含量少转化快；酶不提供能量，只降低活化能。"]},{"title":"细胞的生命历程","keyPoints":["细胞增殖包括物质准备和细胞分裂两个阶段，有丝分裂是真核生物体细胞增殖的主要方式。","有丝分裂间期完成DNA复制和有关蛋白质合成，分裂期分为前期、中期、后期、末期。","有丝分裂各期：前期染色体出现，中期着丝粒排列在赤道板，后期着丝粒分裂，末期核膜核仁重现。","细胞分化是基因选择性表达的结果，细胞中遗传物质不变，形成形态结构功能不同的细胞。","细胞衰老特征：水分减少、酶活性降低、色素积累、细胞核体积增大、呼吸减慢。","细胞凋亡是基因控制的程序性死亡，对生物体有利；细胞坏死是被动的不利死亡。"],"difficultPoints":["有丝分裂各时期染色体、DNA、染色单体数目变化计算易错，需区分着丝粒分裂前后。","细胞分化与全能性理解难：分化程度越高全能性越低，但分化的细胞仍含全套遗传物质。","细胞衰老与凋亡、坏死概念易混：凋亡是主动的基因控制过程，坏死是被动的病理过程。","癌细胞特征难：无限增殖、形态改变、糖蛋白减少易转移，与原癌基因和抑癌基因突变有关。"],"examPoints":["有丝分裂过程中染色体和DNA数目变化曲线是高频考点，常结合图像识别时期。","观察根尖分生组织细胞有丝分裂实验常考：解离、漂洗、染色、制片步骤及显微镜观察。","细胞分化实质（基因选择性表达）常考，注意与细胞全能性实例（植物组织培养）结合。","细胞癌变与衰老特征辨析常以选择题出现，注意原癌基因主要调控细胞周期。","陷阱：赤道板不是真实结构；减数分裂与有丝分裂的区别是高考常考易错点。"]},{"title":"遗传因子的发现","keyPoints":["孟德尔成功原因：豌豆自花传粉闭花受粉、性状易区分、由一对到多对研究、运用统计学。","分离定律：减数分裂时等位基因随同源染色体分开而分离，分别进入不同配子，控制相对性状。","性状分离比3:1出现条件是F1产生两种等量配子且随机结合、各基因型存活率相同。","测交（Aa×aa）后代比例1:1可验证F1产生两种数量相等的配子，用于判断基因型。","自由组合定律：控制不同性状的非等位基因位于非同源染色体上，减数分裂时自由组合。","孟德尔遗传实验常用符号：P亲本、F1子一代、×杂交、⊗自交，遗传图解书写规范。"],"difficultPoints":["分离定律与自由组合定律适用条件易错：必须是真核生物有性生殖、核基因位于染色体上。","遗传概率计算难：先确定亲本基因型，再逐对分析，用乘法原理组合各对性状概率。","显隐性判断易错：无中生有为隐性，有中生无为显性，不能确定的需假设验证。","自交与自由交配概率计算易混：自由交配需用配子法或基因频率法计算。"],"examPoints":["分离定律和自由组合定律的实质辨析是高频考点，常结合减数分裂过程考查。","9:3:3:1及其变式（如9:7、15:1、9:6:1）是经典考查形式，注意基因互作。","显隐性判断、基因型推断及概率计算是遗传题核心考点，常以系谱图或实验形式出现。","验证分离定律和自由组合定律的方法：自交法、测交法、花粉鉴定法、单倍体育种法。","陷阱：Aa自交n代后杂合子比例为(1/2)的n次方，连续自交可提高纯合度。"]},{"title":"基因与染色体的关系","keyPoints":["减数分裂：染色体复制一次、细胞分裂两次，结果染色体数目减半，发生于配子形成过程。","减数第一次分裂前期同源染色体联会形成四分体，后期同源染色体分离分别移向细胞两极。","减数第二次分裂无同源染色体，后期姐妹染色单体分开，染色体数目暂时加倍。","精子形成过程：精原细胞→初级精母细胞→两个次级精母细胞→四个精细胞，细胞质均等分裂。","卵细胞形成过程：一个初级卵母细胞→一个卵细胞和三个极体，细胞质不均等分裂。","受精作用使精卵结合，染色体恢复体细胞数目，维持前后代染色体数目恒定。"],"difficultPoints":["减数分裂与有丝分裂图像辨析难：先看有无同源染色体，再看有无联会、四分体及分离行为。","减数分裂中染色体、DNA、染色单体数目变化曲线易错，注意间期复制和分裂各期变化。","伴性遗传判断难：先判断显隐性，再看是否为伴X遗传，注意男患者多于女患者的特征。","四分体时期交叉互换导致基因重组，理解其发生于减Ⅰ前期，是配子多样性的来源之一。"],"examPoints":["减数分裂过程图解与各时期染色体行为是高频考点，常与有丝分裂比较考查。","伴性遗传（红绿色盲、血友病）遗传特点与系谱分析是经典考题，注意交叉遗传。","减数分裂异常（同源染色体未分离、姐妹染色单体未分开）导致染色体数目变异是难点考点。","基因在染色体上的证据：萨顿类比推理、摩尔根果蝇实验证明基因位于染色体上。","陷阱：减数分裂中染色体数目减半发生在减Ⅰ完成时；观察减数分裂常用蝗虫精母细胞。"]},{"title":"基因的本质与表达","keyPoints":["DNA双螺旋：两条链反向平行，外侧磷酸与脱氧核糖交替构成基本骨架，内部碱基互补配对。","DNA复制是半保留复制，边解旋边复制，需要解旋酶和DNA聚合酶，场所主要是细胞核。","DNA复制条件：模板（DNA两条链）、原料（4种脱氧核苷酸）、能量（ATP）、酶。","基因是有遗传效应的DNA片段，转录以DNA一条链为模板合成mRNA，场所主要是细胞核。","翻译以mRNA为模板、tRNA为运载工具，在核糖体上合成蛋白质，密码子与反密码子互补配对。","中心法则：DNA复制→转录→翻译，还包括RNA复制和逆转录，体现遗传信息的传递与表达。"],"difficultPoints":["碱基互补配对计算易错：双链DNA中A=T、G=C，嘌呤总数等于嘧啶总数。","复制计算易混：复制n次共需(2的n次方减1)个碱基，第n次需2的(n-1)次方个。","转录翻译辨析难：转录产物是RNA，翻译在核糖体进行，mRNA上三个相邻碱基是一个密码子。","密码子与反密码子、氨基酸对应关系易错：64个密码子中3个终止密码子不编码氨基酸。"],"examPoints":["DNA复制、转录、翻译过程图解是高频考点，常考原料、酶、场所和产物。","噬菌体侵染细菌实验和肺炎链球菌转化实验证明DNA是遗传物质，是经典实验考题。","基因表达相关计算：DNA碱基数、mRNA碱基数、氨基酸数比例约为6:3:1。","中心法则及RNA病毒（HIV逆转录）遗传信息流向是常考内容。","陷阱：复制和转录以DNA为模板，翻译以mRNA为模板；tRNA一端携氨基酸一端是反密码子。"]},{"title":"基因突变基因重组染色体变异与育种","keyPoints":["基因突变是DNA分子中碱基对的增添、缺失或替换，产生新基因，是生物变异的根本来源。","基因突变特点：普遍性、随机性、不定向性、低频性、多害少利性。","基因重组包括非同源染色体非等位基因自由组合和同源染色体非姐妹染色单体交叉互换。","染色体变异包括结构变异（缺失、重复、倒位、易位）和数目变异（个别染色体增减、成倍增减）。","单倍体育种：花药离体培养获得单倍体，再用秋水仙素处理使染色体加倍，可缩短育种年限。","多倍体育种：秋水仙素（或低温）抑制纺锤体形成使染色体数目加倍，如无子西瓜、八倍体小黑麦。"],"difficultPoints":["基因突变与基因重组的区别易混：突变产生新基因，重组只产生新的基因型组合。","染色体组判断难：看细胞内形态大小各不相同的一组染色体，配子中含一个染色体组。","二倍体、多倍体、单倍体概念易错：单倍体不一定含一个染色体组，含本物种配子染色体数。","育种方法选择难：杂交育种、诱变育种、单倍体育种、多倍体育种的原理和优缺点比较。"],"examPoints":["基因突变、基因重组、染色体变异三种可遗传变异的比较是高频考点。","染色体变异类型判断（缺失、重复、倒位、易位图解）和染色体组数判断是经典考题。","杂交育种、诱变育种、单倍体育种流程图及原理是常考内容，注意育种年限长短。","基因突变实例：镰状细胞贫血是碱基对替换，基因突变不一定引起性状改变（密码子简并性）。","陷阱：基因重组不产生新基因；基因突变改变基因结构，但染色体上基因位置不变。"]},{"title":"生物的进化","keyPoints":["现代生物进化理论核心：种群是生物进化的基本单位，突变和基因重组提供进化的原材料。","自然选择决定生物进化的方向，生物进化的实质是种群基因频率的改变。","隔离是物种形成的必要条件，生殖隔离是新物种形成的标志，地理隔离可导致生殖隔离。","基因频率计算方法：某基因频率等于该基因数目占全部等位基因总数的比例。","共同进化指不同物种之间、生物与无机环境之间在相互影响中不断进化和发展。","生物多样性包括基因多样性、物种多样性和生态系统多样性，是共同进化的结果。"],"difficultPoints":["基因频率与基因型频率计算易错：哈代-温伯格平衡需种群大、随机交配、无突变迁移选择。","进化的实质与物种形成区别易混：基因频率改变即进化，但物种形成必须有生殖隔离。","自然选择作用对象易错：直接作用于个体的表现型，间接作用于基因型，使基因频率定向改变。","共同进化与生物多样性层次理解难：生物多样性三个层次与进化关系易混淆。"],"examPoints":["基因频率和基因型频率计算是高频考点，常结合遗传题考查（如伴X遗传基因频率）。","现代生物进化理论与达尔文自然选择学说的比较是常考内容，注意遗传变异来源差异。","隔离与物种形成过程（加拉帕戈斯群岛地雀）是经典考题，注意地理隔离不等于生殖隔离。","抗生素抗药性形成分析：突变不定向，自然选择定向，抗药基因频率上升。","陷阱：生物进化的基本单位是种群不是个体；自然选择决定进化方向，突变和基因重组提供原材料。"]}]},{"period":"高二（上）","textbook":"选择性必修一","tips":["选择性必修一以稳态与调节为核心，重在构建神经-体液-免疫调节网络的整体观念。","内环境与稳态、血糖调节、免疫过程多用流程图和表格比较记忆。","实验设计（如探究生长素类似物促进生根）与调节机制结合是常考方向。","结合生活实例（糖尿病、过敏、植物生长调节剂）理解抽象概念。"],"modules":[{"title":"人体的内环境与稳态","keyPoints":["内环境是细胞外液构成的液体环境，包括血浆、组织液和淋巴液，是细胞直接生活的环境。","血浆、组织液、淋巴液关系：血浆与组织液可相互渗透，组织液单向进入淋巴，淋巴汇入血浆。","内环境成分包括水、无机盐、葡萄糖、氨基酸、血浆蛋白等，不含血红蛋白和呼吸酶。","内环境理化性质：渗透压（主要与Na+和Cl-有关）、pH约7.35-7.45、温度37℃。","稳态是内环境理化性质保持相对稳定的状态，调节机制是神经-体液-免疫调节网络。","内环境是细胞与外界环境进行物质交换的媒介，各器官系统协调活动维持稳态。"],"difficultPoints":["内环境成分判断易错：血红蛋白、载体蛋白、呼吸酶在细胞内，不属于内环境成分。","组织水肿原因分析难：血浆蛋白减少、淋巴回流受阻、过敏反应等导致组织液增多。","体液、细胞内液、细胞外液概念易混：内环境是细胞外液，不包括细胞内液。","渗透压概念易错：血浆渗透压主要与无机盐（NaCl）和蛋白质有关。"],"examPoints":["内环境成分与理化性质判断是高频考点，常以选择题考查哪些物质属于内环境成分。","血浆、组织液、淋巴液三者关系图解是经典考题，注意单向与双向箭头含义。","组织水肿原因分析是常考热点，需理解渗透压变化导致水分移动方向。","内环境稳态调节机制（神经-体液-免疫）及意义是命题重点，结合具体实例考查。","陷阱：汗液、尿液、消化液等与外界相通的液体不属于内环境。"]},{"title":"神经调节","keyPoints":["神经调节基本方式是反射，反射弧由感受器、传入神经、神经中枢、传出神经、效应器组成。","静息电位外正内负（K+外流），动作电位外负内正（Na+内流），兴奋在神经纤维上双向传导。","兴奋在神经纤维上以电信号（神经冲动）形式传导，在突触处通过神经递质传递，方向是单向的。","突触结构包括突触前膜、突触间隙和突触后膜，神经递质与突触后膜受体结合引起兴奋或抑制。","兴奋在神经元间传递特点：单向传递、有突触延搁，递质发挥作用后被降解或回收。","大脑皮层是高级中枢，低级中枢（脊髓）受高级中枢调控，体现分级调节。"],"difficultPoints":["静息电位与动作电位的形成机制易混：K+外流形成静息电位，Na+内流形成动作电位。","电流计指针偏转方向和次数判断难：刺激不同位置，分析兴奋传导方向与到达时间。","兴奋在神经纤维与突触处传导方向不同易错：纤维上双向传导，突触处单向传递。","反射与反射弧关系理解难：反射必须通过完整反射弧，任何环节受损反射不能完成。"],"examPoints":["反射弧组成及损伤分析是高频考点，常考查切断某神经后的表现。","兴奋在神经纤维上的传导和突触传递图解是经典考题，注意膜电位变化曲线。","神经递质种类（兴奋性、抑制性）及作用机理是常考内容，注意抑制性递质的作用特点。","电流计偏转问题、药物对兴奋传导的影响是常见命题角度。","陷阱：效应器包括传出神经末梢及其支配的肌肉或腺体；反射是神经调节的基本方式。"]},{"title":"体液调节","keyPoints":["激素调节是体液调节的主要内容，激素由内分泌腺（细胞）分泌，通过体液运输作用于靶器官靶细胞。","血糖调节：胰岛素降低血糖（促进组织细胞摄取利用葡萄糖），胰高血糖素升高血糖，二者相互拮抗。","血糖调节为神经-体液调节：胰岛素由胰岛B细胞分泌，胰高血糖素由胰岛A细胞分泌。","甲状腺激素分泌存在分级调节（下丘脑-垂体-甲状腺）和反馈调节，维持含量相对稳定。","体温调节：寒冷时皮肤血管收缩、骨骼肌战栗、甲状腺激素和肾上腺素分泌增加。","水盐平衡调节：抗利尿激素由下丘脑合成、垂体释放，促进肾小管和集合管重吸收水。"],"difficultPoints":["分级调节与反馈调节综合题难：下丘脑、垂体、甲状腺之间的促进与抑制关系易混。","血糖调节中激素关系易错：胰高血糖素与肾上腺素协同升高血糖，与胰岛素拮抗。","激素作用特点易混：微量高效、通过体液运输、作用于靶器官靶细胞、不直接参与代谢。","激素与酶的区别难：激素是信息分子起调节作用，发挥作用后失活；酶是催化剂不被消耗。"],"examPoints":["血糖平衡调节过程及糖尿病分析是高频考点，常考胰岛素和胰高血糖素的作用。","甲状腺激素分泌的分级调节和反馈调节是经典考题，注意切除甲状腺后激素变化。","体温调节和水盐平衡调节常结合运动、高温等情境考查抗利尿激素作用。","下丘脑功能总结（调节中枢、分泌激素、感受渗透压）是常考内容。","陷阱：激素不提供能量、不组成细胞结构、不起催化作用，只传递信息调节代谢。"]},{"title":"免疫调节","keyPoints":["免疫系统由免疫器官、免疫细胞和免疫活性物质（抗体、淋巴因子、溶菌酶）组成。","三道防线：皮肤黏膜是第一道，杀菌物质和吞噬细胞是第二道，特异性免疫是第三道。","体液免疫：抗原→吞噬细胞→T细胞→B细胞增殖分化为浆细胞和记忆细胞，浆细胞分泌抗体。","细胞免疫：T细胞增殖分化为效应T细胞和记忆细胞，效应T细胞使靶细胞裂解死亡。","记忆细胞特点：再次接触相同抗原时迅速增殖分化，产生更快更强的二次免疫反应。","免疫失调：过敏反应、自身免疫病（风湿性心脏病）、免疫缺陷病（艾滋病）。"],"difficultPoints":["体液免疫与细胞免疫过程辨析难：浆细胞由B细胞增殖分化而来，效应T细胞由T细胞增殖分化而来。","抗原与抗体关系易错：抗体是蛋白质，只能与特定抗原特异性结合，浆细胞不能识别抗原。","二次免疫反应曲线分析难：第二次应答更快更强，记忆细胞迅速增殖分化产生大量抗体。","艾滋病机理易错：HIV主要攻击T细胞，导致免疫系统功能几乎全部丧失。"],"examPoints":["体液免疫和细胞免疫过程图解是高频考点，常考细胞名称、先后顺序和功能。","二次免疫应答特点（更快更强）常以曲线图形式考查抗体浓度变化。","免疫失调实例判断（过敏反应、自身免疫病、免疫缺陷病）是常考选择题。","疫苗和免疫预防原理常考：疫苗是抗原，接种后产生抗体和记忆细胞。","陷阱：效应T细胞与靶细胞接触使其裂解属于细胞免疫；抗体与抗原结合后由吞噬细胞吞噬消化。"]},{"title":"植物生命活动的调节","keyPoints":["生长素发现历程：达尔文（胚芽鞘向光性）、詹森、拜尔、温特（命名生长素），本质是吲哚乙酸。","生长素产生部位主要是幼嫩的芽、叶和发育中的种子，分布广泛，集中在生长旺盛部位。","生长素运输：极性运输（形态学上端到下端，为主动运输）和横向运输（单侧光引起分布不均）。","生长素作用具有两重性：低浓度促进生长、高浓度抑制生长，如顶端优势、根的向地性。","顶端优势：顶芽优先生长、侧芽受抑制，原因是顶芽产生的生长素向下运输积累抑制侧芽。","其他植物激素：赤霉素促伸长和萌发，细胞分裂素促分裂，脱落酸促休眠，乙烯促果实成熟。"],"difficultPoints":["生长素两重性曲线分析难：不同器官对生长素敏感性不同（根大于芽大于茎），注意曲线交叉点含义。","极性运输与横向运输方向易混：极性运输是从形态学上端到形态学下端，不受重力影响。","植物激素间的协同与拮抗关系易错：赤霉素与生长素协同促进生长，脱落酸与赤霉素拮抗。","生长素发现实验的对照设计分析难：理解各实验的自变量、对照和结论。"],"examPoints":["生长素发现实验（达尔文、温特等）是经典实验考题，常考实验设计思路与结论。","生长素两重性应用（顶端优势、除草剂、根的向地性）是高频考点。","植物激素功能判断及植物生长调节剂应用（无子番茄、香蕉催熟）常考。","探究生长素类似物促进扦插枝条生根的最适浓度实验是常考实验设计题。","陷阱：生长素促细胞纵向伸长，细胞分裂素促分裂；无子番茄用生长素处理，无子西瓜是三倍体。"]}]},{"period":"高二（下）","textbook":"选择性必修二、三","tips":["选择性必修二生态部分重在能量流动与物质循环的计算和分析，需熟练掌握传递效率计算。","选择性必修三生物技术部分流程多、步骤细，建议用流程图整理每一步的目的和条件。","微生物培养、发酵、细胞工程、基因工程的比较记忆是关键。","关注生物技术与伦理、环境问题等社会议题，培养社会责任素养。"],"modules":[{"title":"种群及其动态","keyPoints":["种群是生活在一定区域的同种生物全部个体的总和，是生物进化和繁殖的基本单位。","种群特征：种群密度（最基本）、出生率和死亡率、迁入率和迁出率、年龄结构、性别比例。","年龄结构预测种群数量变化趋势：增长型、稳定型、衰退型，性别比例影响出生率。","种群数量增长J形：理想条件，增长率不变；S形：环境阻力限制，K值是环境容纳量。","调查种群密度方法：样方法（植物、活动能力弱动物）、标志重捕法（活动能力强动物）。","K/2时种群增长速率最大，是捕捞、狩猎的最佳时期，K值附近增长缓慢。"],"difficultPoints":["J形与S形曲线区别易混：J形增长率不变，S形增长速率先增大后减小，K值时增长速率为0。","标志重捕法计算易错：种群数量等于初次标记数乘重捕数再除以重捕中标记数，注意标记物脱落影响。","年龄结构与性别比例对种群数量影响易错：年龄结构预测趋势，性别比例影响出生率。","样方法取样原则易错：随机取样，用等距取样法或五点取样法，样方大小和数量要适宜。"],"examPoints":["种群密度调查方法选择及计算是高频考点，注意样方法和标志重捕法的适用对象。","种群数量变化曲线（J形、S形）分析是经典考题，常考λ值含义与K值应用。","种群特征相互关系判断（出生率死亡率决定密度，年龄结构预测趋势）是常考内容。","渔业捕捞、害虫防治等实际应用考查K/2原理和K值策略。","陷阱：种群密度是种群最基本的数量特征；年龄结构不直接决定种群密度大小。"]},{"title":"群落及其演替","keyPoints":["群落是同一时间内聚集在一定区域中各种生物种群的集合，物种丰富度是物种数目的多少。","种间关系：捕食、竞争、寄生、互利共生，互利共生（豆科与根瘤菌）对双方都有利。","群落空间结构：垂直结构（分层现象，与光照有关）和水平结构（镶嵌分布，与地形光照水分有关）。","群落演替是随着时间的推移一个群落被另一个群落代替的过程，包括初生演替和次生演替。","初生演替：裸岩→地衣→苔藓→草本→灌木→乔木，起点无土壤和种子。","次生演替：弃耕农田→草本→灌木→乔木，起点保留土壤条件，速度比初生演替快。"],"difficultPoints":["种间关系曲线辨析难：捕食（先增加者先减少）与竞争（一方占优一方淘汰）曲线区别。","垂直结构与水平结构判断易混：分层是垂直结构，地形起伏导致的镶嵌是水平结构。","初生演替与次生演替判断易错：关键在于起点有无土壤和种子等繁殖体。","群落演替方向与人类活动影响理解难：人类活动可使演替速度改变或方向改变。"],"examPoints":["种间关系判断（捕食、竞争、寄生、互利共生）是高频考点，常结合曲线和实例考查。","群落结构（垂直、水平）及影响因素分析是常考内容，注意植物分层与光照有关。","演替类型判断及实例（裸岩、弃耕农田）是经典考题。","土壤中小动物类群丰富度研究实验：取样器取样法，记名计算法或目测估计法统计。","陷阱：群落演替中优势种改变，但总物种数不一定一直增加；演替不一定到森林阶段。"]},{"title":"生态系统及其稳定性","keyPoints":["生态系统组成：非生物的物质和能量、生产者（主要成分）、消费者、分解者（必需成分）。","食物链起点是生产者，终点是最高营养级，不包含分解者和非生物成分，营养级一般不超过5级。","能量流动特点：单向流动、逐级递减，传递效率10%-20%，沿食物链方向进行。","能量流动计算：同化量等于摄入量减粪便量，粪便量属于上一营养级的同化量。","物质循环：组成生物体的C、H、O、N等元素在生物群落与无机环境之间循环往复。","碳循环：CO2经光合作用进入生物群落，通过呼吸作用、分解作用和化石燃料燃烧返回大气。"],"difficultPoints":["能量流动计算难：涉及多条食物链、最少最多消耗量计算（传递效率10%-20%反向计算）。","同化量、摄入量、粪便量、呼吸消耗量关系易错：粪便量不属于本营养级同化量。","生态系统稳定性理解难：抵抗力稳定性与恢复力稳定性一般呈负相关，自我调节能力是基础。","信息传递类型辨析易错：物理信息（光声温度）、化学信息（化学物质）、行为信息（蜜蜂跳舞）。"],"examPoints":["能量流动图解和计算是高频考点，常考能量金字塔、传递效率计算。","碳循环过程图解是经典考题，注意生产者、消费者、分解者、大气CO2库的箭头关系。","食物链食物网中营养级判断及某生物数量变化对其他生物的影响是常考内容。","生态系统的稳定性、负反馈调节及抵抗力恢复力稳定性比较是命题重点。","陷阱：能量流动是单向逐级递减的，物质循环是往复循环的；能量金字塔不会倒置。"]},{"title":"人与环境","keyPoints":["人口增长对环境的影响：资源消耗加快、环境污染加剧、生物多样性下降。","全球性环境问题：全球气候变化（温室效应）、臭氧层破坏、土地荒漠化、生物多样性锐减。","温室效应主要是CO2等温室气体增多，臭氧层破坏与氟氯烃排放有关。","生物多样性包括基因多样性、物种多样性和生态系统多样性，是共同进化的结果。","生物多样性价值：直接价值（食用药用）、间接价值（生态功能）、潜在价值。","保护生物多样性措施：就地保护（最有效，建立自然保护区）、易地保护、建立种子库和基因库。"],"difficultPoints":["生物多样性三个层次辨析易混：基因多样性对应基因种类，物种多样性对应物种数目。","生物多样性价值判断易错：保持水土、调节气候属于间接价值（生态价值）。","外来物种入侵危害理解难：缺少天敌、繁殖快，破坏本地生态平衡，导致生物多样性下降。","就地保护与易地保护适用对象易混：就地保护是保护生态系统和物种的最有效措施。"],"examPoints":["全球性环境问题的原因与对策是常考内容，注意温室效应与臭氧层破坏的原因区别。","生物多样性三个层次及保护措施判断是高频考点。","外来物种入侵的实例（水葫芦、薇甘菊）及危害分析是常见命题材料。","可持续发展与生态农业（物质循环再生、能量多级利用）是命题方向。","陷阱：保护生物多样性不是禁止开发利用，而是合理利用；就地保护是根本措施。"]},{"title":"发酵工程","keyPoints":["微生物培养：培养基配制（碳源氮源水无机盐）、高压蒸汽灭菌、接种、培养。","无菌技术：消毒（煮沸、巴氏消毒）与灭菌（灼烧、干热、高压蒸汽）的区别。","传统发酵：果酒（酵母菌无氧产酒精）、果醋（醋酸菌有氧产醋酸）、泡菜（乳酸菌）。","果酒：酵母菌18-25℃先通气后密封；果醋：醋酸菌30-35℃始终通气。","发酵工程基本环节：菌种选育→扩大培养→配制培养基灭菌→接种发酵→分离提纯产品。","发酵工程应用：青霉素、味精、柠檬酸、啤酒、酱油、转基因工程菌生产胰岛素。"],"difficultPoints":["果酒果醋制作条件比较易错：菌种、温度、是否需氧、产物不同，注意先后顺序。","微生物计数方法易混：稀释涂布平板法（活菌计数）、显微镜直接计数（含死菌，数值偏大）。","平板划线法与稀释涂布平板法分离纯化目的相同但操作不同，易混淆。","培养基种类易错：选择培养基（筛选特定微生物）与鉴别培养基（区分微生物）的区别。"],"examPoints":["传统发酵技术（果酒、果醋、腐乳、泡菜）的原理和条件是高频考点。","微生物培养与无菌操作（灭菌消毒区别、倒平板、接种）是常考实验内容。","微生物计数方法及误差分析（涂布平板法统计菌落数可能偏小）是经典考题。","发酵工程流程与应用实例是命题方向，注意菌种选育和扩大培养。","陷阱：果酒发酵时先通气利于酵母菌繁殖，后密封产生酒精；醋酸发酵需持续通气。"]},{"title":"细胞工程","keyPoints":["植物组织培养原理是细胞全能性，过程：外植体→脱分化（愈伤组织）→再分化→完整植株。","植物组织培养条件：无菌、适宜温度、植物激素（生长素与细胞分裂素比例调控分化）。","植物体细胞杂交：纤维素酶果胶酶去壁→原生质体融合→杂种细胞→再生壁→组织培养。","动物细胞培养条件：无菌无毒、加血清、适宜温度pH、95%空气加5%CO2。","动物细胞培养过程：取组织→胰蛋白酶分散→原代培养→传代培养，50代内是二倍体细胞。","单克隆抗体：杂交瘤细胞（骨髓瘤细胞与B淋巴细胞融合）既能无限增殖又能产生特异性抗体。"],"difficultPoints":["植物组织培养与动物细胞培养条件比较易混：动物培养需加血清、需CO2维持pH。","脱分化与再分化概念易错：脱分化是形成愈伤组织，再分化是愈伤组织形成根芽。","杂交瘤细胞筛选过程难：HAT培养基筛选杂交瘤细胞，还需抗体检测筛选产生特定抗体的细胞。","动物细胞融合与植物原生质体融合方法区别易混：动物可用灭活病毒（仙台病毒）诱导。"],"examPoints":["植物组织培养流程与原理是高频考点，注意外植体、愈伤组织、脱分化再分化。","动物细胞培养条件及胰蛋白酶作用（分散细胞）是常考内容。","单克隆抗体制备流程（两次筛选）是经典考题，注意各步骤目的。","植物体细胞杂交可克服远缘杂交不亲和障碍，是育种新方法。","陷阱：植物组织培养体现细胞全能性；杂交瘤细胞产生的单抗特异性强、灵敏度高。"]},{"title":"基因工程","keyPoints":["基因工程工具：限制酶和DNA连接酶都作用于磷酸二酯键，运载体常用质粒、噬菌体。","基因工程操作：目的基因获取→表达载体构建→导入受体细胞→检测与鉴定。","基因表达载体组成：目的基因、启动子、终止子、标记基因（抗生素抗性基因用于筛选）。","目的基因导入方法：植物用农杆菌转化法（Ti质粒），动物用显微注射法，微生物用感受态细胞法。","检测与鉴定：DNA杂交查导入，分子杂交查转录，抗原抗体杂交查翻译。","PCR技术：变性、复性、延伸三个步骤，需要引物和耐高温的DNA聚合酶（Taq酶）。"],"difficultPoints":["限制酶与DNA连接酶作用部位易错：都作用于磷酸二酯键，限制酶切割产生黏性末端或平末端。","基因表达载体构建易错：启动子是RNA聚合酶结合位点，标记基因用于筛选含目的基因的细胞。","PCR引物设计与扩增计算难：每轮循环DNA数量加倍，n轮后为2的n次方个。","基因工程与细胞工程综合题难：转基因植物培育、抗虫棉（Bt毒蛋白基因）流程分析。"],"examPoints":["基因工程操作步骤排序与各步骤目的（构建表达载体是核心步骤）是高频考点。","工具酶的功能辨析（限制酶、连接酶、解旋酶作用不同）是常考选择题。","目的基因检测与鉴定的三种方法对应关系（DNA、mRNA、蛋白质水平）是经典考题。","基因工程应用（抗虫棉、转基因动物、基因治疗）及安全性讨论是命题方向。","陷阱：限制酶识别特定核苷酸序列并切割磷酸二酯键；基因工程的核心是基因表达载体的构建。"]},{"title":"胚胎工程与生物技术安全伦理","keyPoints":["胚胎工程包括体外受精、胚胎移植、胚胎分割和胚胎干细胞培养等技术。","体外受精过程：卵母细胞采集与培养（MⅡ中期）、精子获能处理、体外受精、早期胚胎培养。","胚胎移植：将早期胚胎移入同种生理状态相同的受体子宫，实质是早期胚胎的空间转移。","胚胎移植的生理基础：供受体同期发情、受体对移入胚胎基本不产生免疫排斥。","胚胎分割：将囊胚（内细胞团均等分割）或桑葚胚分割，属于无性繁殖，后代基因型相同。","胚胎干细胞来源于早期胚胎或原始性腺，具有全能性，可分化为各种组织细胞。"],"difficultPoints":["胚胎移植与胚胎分割关系易混：移植是基础，分割提高胚胎利用率，二者都属无性繁殖范畴。","体外受精与体内受精区别易错：体外受精需获能处理，精子获能在体外进行。","胚胎干细胞全能性最高，与成体干细胞比较易混，注意来源和分化潜能。","生物技术安全性争论（转基因、克隆人、基因检测）分析难，需理性看待。"],"examPoints":["胚胎移植的基本程序和生理基础是高频考点，注意供受体关系。","体外受精、早期胚胎培养条件（培养液成分、气体环境）是常考内容。","胚胎分割的注意事项（内细胞团均等分割、无性繁殖后代相同）是经典考题。","试管婴儿（体外受精、有性生殖）与克隆（核移植、无性生殖）区别是常考点。","陷阱：胚胎移植的受体不提供遗传物质；胚胎分割后个体遗传物质相同、性别相同。"]}]},{"period":"高三","textbook":"高考总复习","tips":["一轮复习回归教材，夯实基础概念和过程，建立完整知识体系。","二轮专题复习突破重难点：遗传计算、代谢综合、实验设计、长句表述。","刷真题总结命题规律，注意图表题、实验题和长句题的答题规范。","三轮模拟训练限时完成，训练审题和规范作答，减少非智力失分。"],"modules":[{"title":"细胞代谢综合","keyPoints":["光合与呼吸综合题核心：总光合速率等于净光合速率加呼吸速率，注意气体交换图分析。","净光合用CO2吸收量、O2释放量、有机物积累量表示；呼吸速率在黑暗下测定。","光补偿点：光合速率等于呼吸速率时的光照强度；光饱和点后限制因素主要是CO2浓度和温度。","影响光合作用的环境因素：光照强度、CO2浓度、温度、水分、矿质元素，多因子协同作用。","夏季中午光合午休：气孔部分关闭，CO2供应不足，暗反应减慢。","同位素标记法追踪：鲁宾和卡门（18O2）、卡尔文（14CO2）研究光合作用物质变化。"],"difficultPoints":["光合与呼吸综合计算难：密闭容器中CO2浓度变化、植物与外界气体交换曲线分析。","净光合与总光合速率判断易错：CO2吸收量是净光合，CO2固定量是总光合。","多因子影响光合作用的曲线分析难：改变一个因素时另一因素的限制作用判断。","实验测定光合速率与呼吸速率的装置设计是难点，注意遮光与光照条件对照。"],"examPoints":["光合作用和细胞呼吸综合图解及气体交换分析是高考高频压轴考点。","净光合速率、呼吸速率、总光合速率的计算与曲线分析是常考题型。","光合作用影响因素实验（探究光照强度、CO2浓度对光合作用的影响）是经典实验题。","农业生产应用（合理密植、通风透光、增施有机肥）与光合原理结合命题。","陷阱：光补偿点时植物净光合速率为0、有机物无积累；光饱和点后限制因素是CO2和温度。"]},{"title":"遗传规律与遗传系谱图","keyPoints":["遗传系谱图分析步骤：先判断显隐性（无中生有为隐性），再判断基因位置（常染色体或X染色体）。","判断基因位置方法：隐性遗传看女病，父子无病非伴性；显性遗传看男病，母女无病非伴性。","常染色体遗传与伴X遗传概率计算：注意性别比例、患者性别差异。","遗传病类型：单基因遗传病（白化病、红绿色盲）、多基因遗传病、染色体异常遗传病。","基因检测与遗传咨询：产前诊断（羊水检查、B超）、基因诊断用于预防遗传病。","系谱图解题常用方法：假设法验证伴性遗传，口诀法快速判断遗传方式。"],"difficultPoints":["系谱图中基因型推断和概率计算难：注意条件概率，已知个体表现型后需重新计算。","伴X遗传与常染色体遗传区分难：利用男性患者比例、女患者父亲儿子情况判断。","遗传病发病率与遗传方式的调查易错：发病率在人群中随机调查，遗传方式在家族中调查。","两对基因位于不同染色体上的综合计算难：用分解组合法，逐对分析再相乘。"],"examPoints":["遗传系谱图分析（显隐性判断、基因位置判断、概率计算）是高考必考压轴题。","遗传方式的判断口诀（无中生有为隐性，隐性遗传看女病）是解题核心。","人类遗传病监测预防（遗传咨询、产前诊断、基因检测）是常考内容。","伴性遗传与常染色体遗传结合计算、异常配子产生分析是命题热点。","陷阱：X隐性遗传中女患者的父亲和儿子一定患病；X显性遗传中男患者的母亲和女儿一定患病。"]},{"title":"变异与育种专题","keyPoints":["可遗传变异三种来源：基因突变、基因重组、染色体变异，都能遗传给后代。","杂交育种原理是基因重组，流程：亲本杂交→F1→自交→选优→连续自交直至纯合。","诱变育种原理是基因突变，用物理（辐射）或化学（诱变剂）方法提高突变频率。","单倍体育种：杂交→F1花药离体培养→单倍体→秋水仙素加倍→纯合植株，缩短育种年限。","多倍体育种：秋水仙素（或低温）抑制纺锤体形成，染色体数目加倍，如无子西瓜。","基因工程育种：定向改造生物性状，原理是基因重组，克服远缘杂交不亲和障碍。"],"difficultPoints":["育种方法选择易错：快速获得纯合子用单倍体育种，提高变异频率用诱变育种。","无子西瓜培育过程难：二倍体与四倍体杂交得三倍体，三倍体减数分裂联会紊乱不能形成正常配子。","单倍体育种与多倍体育种的区别易混：单倍体育种先离体培养再加倍，多倍体育种直接加倍。","染色体变异与基因突变、基因重组的判断难：从基因数目、位置、种类变化区分。"],"examPoints":["四种育种方法（杂交、诱变、单倍体、多倍体）的原理、流程、优缺点比较是高频考点。","育种流程设计题（给定目标选方法、写步骤）是常考题型。","无子西瓜、无子番茄、多倍体小黑麦实例分析是经典考题。","基因突变与基因重组、染色体变异的判断（基因数目、位置、种类变化）是常考内容。","陷阱：单倍体育种能明显缩短育种年限；多倍体育种获得的是染色体组加倍的个体。"]},{"title":"调节综合","keyPoints":["神经调节与体液调节关系：体液调节是神经调节的重要环节，二者协调配合。","体温调节、水盐调节、血糖调节都是神经-体液调节的实例，下丘脑是调节枢纽。","免疫调节与神经体液调节共同构成神经-体液-免疫调节网络，维持内环境稳态。","下丘脑功能总结：体温调节中枢、水盐平衡调节中枢、血糖调节中枢、内分泌调控枢纽。","反馈调节（正反馈、负反馈）是维持稳态的重要机制，以负反馈为主。","激素分泌的分级调节：下丘脑→垂体→靶腺体，甲状腺激素等存在分级调节和反馈调节。"],"difficultPoints":["体温调节综合难：寒冷时神经调节（血管收缩、战栗）与体液调节（甲状腺激素、肾上腺素）协同。","水盐平衡调节易错：抗利尿激素由下丘脑合成、垂体释放，促进肾小管集合管重吸收水。","血糖调节综合难：胰岛素、胰高血糖素、肾上腺素协调及糖尿病病因分析。","神经调节与体液调节比较易混：神经调节迅速准确短暂，体液调节缓慢持久广泛。"],"examPoints":["神经-体液-免疫调节网络综合题是高考高频考点，常结合具体情境（运动、应激）考查。","体温、水盐、血糖三大调节过程图解是常考内容，注意下丘脑的中枢作用。","激素分泌的分级调节与反馈调节分析（切除、注射实验）是经典考题。","免疫调节与神经体液调节的联系（细胞因子、神经递质、激素作为信息分子）是命题方向。","陷阱：抗利尿激素是下丘脑合成、垂体释放的；胰岛素是唯一降血糖的激素。"]},{"title":"生态系统能量流动与食物网分析","keyPoints":["食物链食物网分析：数食物链条数、判断营养级、分析生物数量变化的影响。","能量流动起点是生产者固定的太阳能，流经生态系统的总能量是生产者固定的太阳能总量。","能量流动特点：单向流动、逐级递减，传递效率10%-20%，注意能量金字塔不会倒置。","能量流动计算：最少消耗按20%传递效率计算，最多消耗按10%计算。","能量金字塔、数量金字塔比较：数量金字塔可倒置（一棵树上的昆虫），能量金字塔不能。","研究能量流动意义：帮助人们合理调整能量流动关系，使能量持续高效流向对人类最有益部分。"],"difficultPoints":["食物网中能量流动计算难：多条食物链、不同比例分配时消耗量或获得量的计算。","生物数量变化分析易错：天敌减少导致被捕食者先增后减，最终趋于稳定。","能量传递效率与利用率易混：传递效率是营养级间10%-20%，利用率是人类利用比例。","分解者在能量流动和物质循环中的作用易错：分解者不参与食物链但参与物质循环。"],"examPoints":["食物链食物网营养级判断及能量流动计算是高考必考内容，常以综合题出现。","能量流动图解分析（同化量、呼吸消耗、流向分解者、流向下一营养级）是经典考题。","生物富集（重金属、DDT沿食物链积累）现象分析是常考内容。","能量金字塔与数量金字塔、生物量金字塔比较是命题点。","陷阱：粪便量属于上一营养级的同化量；最高营养级能量去向不包括流向下一营养级。"]},{"title":"实验设计与对照原则","keyPoints":["实验设计基本原则：科学性原则、单一变量原则、对照原则、平行重复原则。","对照类型：空白对照、自身对照、条件对照、相互对照，注意对照组与实验组的设置。","实验设计步骤：明确目的→提出假设→分组处理观察记录→预期结果→得出结论。","自变量是人为改变的因素，因变量是观察记录的指标，无关变量需保持相同且适宜。","探究性实验与验证性实验区别：探究实验结果有多种可能需讨论，验证性实验结论唯一。","实验材料选择原则：易获得、易观察、材料本身不影响实验结果。"],"difficultPoints":["对照实验设计难：如何设置单一变量，确保无关变量相同且适宜（如温度、时间、数量）。","实验评价题易错：找实验设计错误（未设对照、无关变量不统一、材料选择不当）。","探究性实验结论书写难：分情况讨论，用若则句式（若…说明…，若…说明…）。","实验步骤书写规范易错：分组编号、处理、观察记录三步缺一不可。"],"examPoints":["实验设计题（探究影响光合、呼吸、酶活性的因素）是高考必考题型，注意对照与变量。","实验评价与改进题是常考题型，找出错误并说明理由或给出改正方案。","经典实验的方法与结论对应（同位素标记、差速离心、荧光标记）是常考内容。","实验结果的预测与结论表述（若则句式、分情况讨论）是得分关键。","陷阱：对照实验必须是单一变量；预实验不能减少实验误差但可避免浪费。"]},{"title":"长句表述与答题规范","keyPoints":["长句答题模板：原因类（因为…所以…）、依据类（据图可知…）、设计类（分组处理…）。","原因类题目答题思路：先写变化的直接原因，再写导致的结果，逻辑链完整。","实验设计长句：取材随机均分、处理控制自变量、观察记录因变量、统计分析。","遗传题长句表述：写清亲本基因型、配子类型、后代基因型表现型及比例。","曲线图描述规范：先总述趋势，再分段描述，注明关键点（起点、拐点、终点）。","生物学术语书写规范：如纺锤体、着丝粒、渗透压、神经递质等不要写错别字。"],"difficultPoints":["长句表述易失分点：只答结果不答原因、逻辑链断裂、未用术语。","实验设计表述难：步骤不完整（缺分组、缺对照、缺重复、缺观察指标）。","遗传图解书写易错：基因型、表现型、比例书写不规范，需按规范格式。","原因分析类题目易混：区分直接原因与根本原因，如质壁分离的直接原因与根本原因。"],"examPoints":["长句表述题是近年高考新趋势，考查语言表达与逻辑推理能力，分值占比增大。","实验设计、实验评价、原因分析三类长句是常考题型。","遗传规律、调节机制、代谢过程的原理阐述是命题重点。","答题规范（术语使用、序号化、要点化）是得分关键。","陷阱：长句题要求因果关系完整，只写结论不写过程不得分或扣分。"]}]}]}],"enrich":{"chinese":{"0|0|k|0":{"explain":"上阕以“看”字领起，铺开寒秋壮景，“竞自由”把静景写活，暗含礼赞生机；下阕以“忆”字转昔，追忆峥嵘岁月，以问句回答“谁主沉浮”的豪情。景是情的铺垫，情是景的升华，二者交融境界自开。","example":"上阕“万类霜天竞自由”写万物争胜的生机，下阕“谁主沉浮”一问，由景入情，豪情尽显。","tip":"分析景情关系先找“看”“忆”两个领起字，分清写景句与抒情句。"},"0|0|k|1":{"explain":"意象是融入情感的具体物象，诗人选什么颜色、动静、空间层次的物象，就是情感的暗示：冷色调多悲愁，暖色调多欣悦。连缀意象成画面，再辨特征，主旨便呼之欲出。记忆口诀：抓色、抓动、抓空间。","example":"“霜天”“红遍”“碧透”冷暖相映，阔大空间烘托博大胸襟；枯藤老树则透出萧瑟。","tip":"意象题先点物象名称，再谈特征与情感，勿空泛。"},"0|0|k|2":{"explain":"直抒胸臆是情感直接喷涌，借景抒情是情附景物，托物言志是借物寄志，三者常综合运用：先写景造境，再托物寓意，最后直抒情怀。答题先辨方式，再说情感如何借之传达，勿张冠李戴。","example":"《沁园春·长沙》写景是借景抒情，“谁主沉浮”是直抒胸臆。","tip":"借景抒情写整体景物，托物言志聚焦单一之物，勿混淆。"},"0|0|k|3":{"explain":"“清、静、悲凉”是统摄全篇的文眼，郁达夫选取北平寻常风物，五幅秋景图看似散漫，实则全部围绕这一情感基调展开，这正是形散神聚的典范。抓住文眼词，散文的魂就握住了。","example":"牵牛花的蓝白冷色、槐树落蕊的无声，都紧扣“清、静、悲凉”。","tip":"概括文眼注意作者对色彩声音的选择，冷色静景多指向悲凉。"},"0|0|k|4":{"explain":"形散指取材自由、联想跳跃，神聚指主旨与情感线索贯穿始终。理解时先找反复出现的中心词或文眼句，再检验每则材料与它的关联。用“材料都指向……”的句式梳理，形散神聚便一目了然。","example":"《故都的秋》从庭院写到秋雨秋果，材料杂而散，却都服务于“清、静、悲凉”。","tip":"答形散神聚必先点出“神”是什么，再谈形如何聚。"},"0|0|k|5":{"explain":"语言赏析有固定角度：炼字看动词形容词的传神，句式看长短整散的变化，修辞看比喻拟人的生动，叠词看音韵与情味。答题按“角度＋例句＋效果”组织，效果要落到画面、情感与节奏上。","example":"“像花而又不是花的那一种落蕊”，“落蕊”状其细软，写出秋的清寂。","tip":"赏析语言必引具体词句，忌空泛说“语言优美”。"},"0|0|d|0":{"explain":"意象是单个物象，意境是多个意象组合的整体氛围。答题先列举意象，再概括意境，不能混为一谈。记忆口诀：意象是零件，意境是整机；由零件组装，才见整体氛围。","example":"“枯藤老树昏鸦”三个意象并列，共同营造萧瑟苍凉的意境。","tip":"答题顺序勿颠倒：先具体意象，后整体意境，再谈情感。"},"0|0|d|1":{"explain":"散文主旨常藏在文眼句、反复出现的词语与结尾升华段。路径三步：圈高频词与抒情议论句，联系写作背景与作者经历，把“写了什么”提升为“想表达什么”。表层是景事，深层是人生感悟。","example":"郁达夫身处乱世流离，故都秋味中既有闲适，更有迟暮与忧思的悲凉。","tip":"概括主旨忌拔高，须以文本词句为据，联系背景立足原文。"},"0|0|d|2":{"explain":"现代诗追求凝练，常省略主语谓语或关联词，句间跳跃大。读懂三步：补足省略成分还原通顺句子，想象画面，连缀意象把握情感脉络。可用“谁＋做什么＋在什么环境”的句式还原。","example":"“粪土当年万户侯”省略主语“我们”，补足后豪情立现。","tip":"还原画面时保持原有意象，勿添原文没有的内容。"},"0|0|e|0":{"explain":"意象赏析三步：指出意象，分析特征与氛围，说承载的情感。注意意象有固定文化内涵（月思乡、柳送别），但须结合本诗语境，不可生搬硬套。","tip":"意象情感勿套模板，须结合本诗语境分析独特内涵。"},"0|0|e|1":{"explain":"标题作用四角度：作线索贯穿全文，揭示或暗示主旨，奠定情感基调，制造悬念吸引读者。答题逐角度检验标题与文章的关系，能对应的才写，分点作答。","tip":"标题题分点作答，先写最明显的线索或主旨作用。"},"0|0|e|2":{"explain":"句子赏析三步完整：点明修辞或表现手法，结合原句分析手法如何呈现，说表达的情感效果。只写“用了比喻”不分析只得一半分，分析要具体到本体喻体与画面。","tip":"手法名称要准，分析引原文，情感要具体，三要素缺一不可。"},"0|0|e|3":{"explain":"作用题最易漏答结构层面：句子段落常起承上启下、铺垫伏笔、呼应结尾等作用。按“内容＋结构＋情感”三层面自查，先想情节线索功能，再想主题情感作用，即能避免漏点。","tip":"检查答案是否覆盖内容、结构、情感三层面。"},"0|0|e|4":{"explain":"景情关系题答“借什么景抒什么情”，用“寓情于景、以乐景衬哀情”等术语；主旨题抓文眼与抒情议论句；语言特色题从炼字、句式、修辞、叠词归纳整体风格。三类题都须引文为证。","tip":"语言特色题先给整体风格词，再举例印证。"},"0|1|k|0":{"explain":"这些名句围绕“学不可以已”立论：“青出于蓝”喻学习能超越本原，“锲而不舍”喻坚持之力。理解抓住比喻的喻体与所寓之理，默写注意“锲”“镂”等易错字笔画。","example":"“冰，水为之而寒于水”说明学习使人进步，“骐骥一跃”与“驽马十驾”对比坚持之要。","tip":"默写注意“锲”与“镂”的写法，勿写成“契”或“缕”。"},"0|1|k|1":{"explain":"韩愈先立“古之学者必有师”，界定师之职责，再用古今、爱子与自身、巫医百工与士大夫三组对比批驳耻学之风。对比正反相形，论证有力。概括论证方法时“对比论证”是核心。","example":"“古之圣人犹且从师而问焉”与“今之众人耻学于师”，古今对比鲜明。","tip":"概括《师说》论证方法，对比论证是核心，勿答成举例论证。"},"0|1|k|2":{"explain":"主客问答是赋体经典结构：客悲源于人生短暂，主乐来自“变与不变”的哲理——从变者看天地曾不能以一瞬，从不变者看物与我皆无尽。苏轼借主客之辩完成自我开解，旷达源于对永恒的领悟。","example":"客叹“哀吾生之须臾”，主答“惟江上之清风”，转悲为乐。","tip":"分析主客问答要点出“变与不变”的哲理内核。"},"0|1|k|3":{"explain":"这些实词均为一词多义，须据语境选义。记忆方法：记本义，推引申义，代入原文验证。如“劝”本义勉励，“绝”有断绝、横渡、极多义，“假”在“假舟楫”中是凭借。","example":"“劝学”的“劝”是勉励，“而绝江河”的“绝”是横渡。","tip":"一词多义须代入原句验证，先排除明显不通的义项。"},"0|1|k|4":{"explain":"虚词用法由语法位置决定：连词看连接关系，代词看指代对象，介词看介引内容。辨析先定词性，再定用法，代入翻译通顺即可。如“而”表并列承接转折修饰递进，看前后成分关系。","example":"“青，取之于蓝”的“于”是介词从，“而青于蓝”的“于”表比较。","tip":"虚词辨析先看位置定词性，再代入语境验证。"},"0|1|k|5":{"explain":"特殊句式有标志可循：定语后置常为“中心词＋之＋定语＋者”，状语后置即介宾短语后置，宾语前置有疑问代词或“之”“是”作标志。翻译先还原现代语序再直译。","example":"“马之千里者”是定语后置，应译作“日行千里的马”。","tip":"翻译特殊句式先按现代语序调整，再逐词落实。"},"0|1|k|6":{"explain":"词类活用看语法功能改变：名词作状语时修饰动词，如“日”意为每天；意动是主观认为，如“耻学于师”即以学于师为耻。判断关键看词在句中的位置与功能。","example":"“君子博学而日参省乎己”中“日”作状语，“孔子师郯子”中“师”是意动。","tip":"意动是认为，使动是使怎么样，看主语主观还是客观。"},"0|1|d|0":{"explain":"“而”的用法看连接成分关系：地位平等为并列，先后相继为承接，意思相反为转折，前修饰后动作为修饰，层层加深为递进。逐一代入翻译验证最可靠。","example":"“积善成德，而神明自得”表承接，“青出于蓝，而青于蓝”表转折。","tip":"判断“而”先看连接关系，代入翻译验证，勿凭语感。"},"0|1|d|1":{"explain":"古今异义是形同义异，词类活用是词性临时改变。区别方法：按古义翻译通顺即古今异义，词性变化即活用。如“用心”古义指因用心思，“至于”古义是到达。","example":"“用心一也”的“用心”是“因为用心思”，与今义不同。","tip":"遇双音节词警惕古今异义，勿以今义套古义。"},"0|1|d|2":{"explain":"特殊句式与现代汉语语序不同，翻译得分关键在于调整语序后仍字字落实：定语后置提前定语，状语后置移介宾，宾语前置归位宾语。调整后再直译，避免漏译虚词。","example":"“句读之不知，惑之不解”是宾语前置，应译为“不懂得句读，不能解决疑惑”。","tip":"翻译先圈出特殊句式并调整语序，再逐词直译。"},"0|1|d|3":{"explain":"苏轼借流水明月阐释哲理：水逝月移是变，水流月存是不变；人生短促是变，物我皆尽是不变。由此消解客悲，得出“取之无禁”的旷达。理解抓住变与不变的对照。","example":"“逝者如斯，而未尝往也”一“变”一“不变”对举成理。","tip":"谈《赤壁赋》哲理必扣“变与不变”，勿泛泛说乐观。"},"0|1|e|0":{"explain":"三篇为理解性默写高频篇目，复习要全文背诵并逐字过关：易错点集中在形近字、通假字（生通性）、易混虚词与生僻字（镂、跬）。按句整理错字本，反复听写。","tip":"默写后立即回读全句检查错别字，一字出错即不得分。"},"0|1|e|1":{"explain":"断句有规律：名词代词常作主宾可作断点，句首语气词前断、句尾语气词后断，“曰”后断，四六骈偶对称句式天然成对。综合运用标志，再以句意验证。","tip":"断句先圈语气词与“曰”，再找对称句式，最后默读验证。"},"0|1|e|2":{"explain":"翻译按点给分：重点实词、词类活用、关键虚词、特殊句式各设采分点。流程：圈采分点，逐词直译，调整句式语序，补省略成分，最后通读检查。宁可多译不省译。","example":"“假舟楫者，非能水也”中“假”译凭借，“水”名词作动词译游水。","tip":"翻译先圈采分点再动笔，保证字字落实。"},"0|1|e|3":{"explain":"内容理解选项错误有规律：张冠李戴、时序颠倒、强加因果、无中生有、以偏概全。解题逐项回文定位，重点核对主语人物、时间词与因果关系词，逐句比对。","tip":"比对先查人物对号，再看时间先后与因果逻辑。"},"0|1|e|4":{"explain":"干支纪年用十天干十二地支组合循环，月相中朔为初一、望为十五、既望为十六、晦为月末。理解要结合语境，如“戊申晦”即戊申日恰逢月末，靠积累并回归课本例句。","example":"《登泰山记》“是月丁未”是干支纪日，“五鼓”约凌晨三至五时。","tip":"月相记口诀“朔初一望十五晦月末”，再结合句意判断。"},"0|2|k|0":{"explain":"曹操用典与比喻言志：“周公吐哺”以周公自比明礼贤下士，“乌鹊南飞”喻贤才择主。典故须知出处才能领会用意，比喻要抓本体喻体的相似点。两者都服务求贤若渴的主旨。","example":"“山不厌高，海不厌深”以山海喻胸怀，暗含广纳贤才之意。","tip":"用典题先结合注释弄清典故，再联系诗人处境说用意。"},"0|2|k|1":{"explain":"白描是不事雕琢、简练勾勒的写法。诗中“方宅十余亩”“榆柳荫后檐”全是寻常景物平实罗列，却真切传达归隐的宁静喜悦。白描重真不重华，以少胜多。","example":"“狗吠深巷中，鸡鸣桑树颠”，以朴素声音写出乡村安宁。","tip":"答白描要强调不加渲染、如实勾勒，并指出平淡质朴的效果。"},"0|2|k|2":{"explain":"白居易以“大珠小珠落玉盘”等比喻化声为形，以通感打通视听，再以“东船西舫悄无言”侧面烘托演奏效果。多重手法叠加使无形音乐可触可感，答题分别指出手法并析效果。","example":"“银瓶乍破水浆迸”以比喻写出乐声的高亢激越。","tip":"通感题要说清由哪种感觉转哪种感觉，并点出相似点。"},"0|2|k|3":{"explain":"诗歌鉴赏四把钥匙：意象意境看画面氛围，语言风格看用词格调，表达技巧看手法运用，思想情感看情志指向。答题先归位要素再组织语言，四要素互相印证。","tip":"拿到诗默念四要素过一遍，判断题目考哪把钥匙。","example":"炼字题“春风又绿江南岸”考语言，景情题“感时花溅泪”考技巧与情感，四要素各有对应题型。"},"0|2|k|4":{"explain":"各种手法有识别标志：写景后抒情是借景抒情，眼前与回忆并存是虚实结合，静景配动景是动静结合，用古人古事是用典，以他物衬此物是衬托，朴素直陈是白描。先点名称再析作用。","example":"“明月松间照，清泉石上流”以动衬静，更显山居清幽。","tip":"手法题“名称＋诗句分析＋效果”三件套，缺分析只得一半分。"},"0|2|d|0":{"explain":"用典分事典与语典，理解两步走：先看注释弄清典故内容与出处，再想诗人为何用典——自比明志、借古讽今或寄托感慨。典故是浓缩信息包，打开它诗人心思便现。","example":"辛弃疾“廉颇老矣，尚能饭否”，以廉颇自比，抒发报国无门之愤。","tip":"用典答题先复述典故大意，再说诗人借它表达什么。"},"0|2|d|1":{"explain":"通感是把一种感官体验移用到另一种感官，赏析关键是说清“像什么、为什么像”。“大珠小珠落玉盘”以视觉写听觉，相似点在清脆圆润错落。按“感官转换＋相似点＋效果”组织。","example":"“银瓶乍破”写乐声由低回转高亢，视觉意象强化听觉冲击。","tip":"通感必答相似点，只说“化抽象为具体”不算到位。"},"0|2|d|2":{"explain":"诗歌情感藏在字面下，须知人论世。白居易被贬江州，“同是天涯沦落人”正源于自身遭际。把握情感三步：读懂字面、联系背景、体会深层，复杂情感常交织，须分层表述。","example":"“江州司马青衫湿”，泪湿青衫实为自身贬谪之悲。","tip":"情感题勿只写“悲伤”，要结合身世说清悲什么、为何悲。"},"0|2|e|0":{"explain":"炼字题完整答题链：释字义（含活用词性），描绘字在句中的画面情境，点出手法或表达效果，说情感意境。四步缺一不可，尤其不能漏“画面”一步。","example":"“春风又绿江南岸”的“绿”形容词作动词，写出满目生机。","tip":"炼字先释字义词性，再谈画面情感，忌跳过字义。"},"0|2|e|1":{"explain":"手法赏析得分要点：先准确说出手法名称，再引用诗句具体分析手法如何体现，最后说表达效果或情感。只贴“用了比喻”标签没有分析只得一半分。","tip":"手法名称判断要准，分析须引诗句，效果勿空泛。"},"0|2|e|2":{"explain":"诗歌情感常不止一种，须逐联逐句分层挖掘。先总说主要情感，再分条列次要情感，每条附诗句依据。顺序按诗句先后或情感主次，术语要具体。","tip":"情感题分条作答，每条“诗句＋情感”配对。"},"0|2|e|3":{"explain":"比较鉴赏落点在“同中求异”：比意象看选材特征，比情感看基调层次，比手法看技巧效果。答题用“分点对照”式：先共同点，再分条不同点，每条引双方诗句佐证。","tip":"比较题双方都要提及，只写一方不构成比较。"},"0|2|e|4":{"explain":"形象题答题框架：先用两三个词概括形象特征，再逐条引用诗句分析形象如何呈现，最后点明形象意义。忌只堆形容词而无诗句依据。","tip":"形象概括词要精准，每条特征必须有诗句支撑。"},"0|3|k|0":{"explain":"文体知识建框架记忆：古体诗不拘格律，近体诗讲平仄对仗；词按风格分豪放婉约，按字数分小令中调长调；散文重抒情议论，小说重虚构叙事。记关键区分点即可应对选择题。","example":"《登高》是七言律诗，《将进酒》是古体诗，格式差异一目了然。","tip":"判断近体诗看平仄对仗与字数句式，词先看风格再看字数。"},"0|3|k|1":{"explain":"记作家作品要把“人—号—朝代—风格—代表作”连成信息链：陶渊明号五柳先生东晋田园鼻祖，李白号青莲居士浪漫飘逸，辛弃疾号稼轩南宋豪放词宗。按时代串联记忆更牢。","example":"“笔落惊风雨，诗成泣鬼神”是杜甫评李白，可见其浪漫风格。","tip":"选择题常在号、朝代、流派设错，号与姓名要一一对应。"},"0|3|k|2":{"explain":"纪年两大系统：年号纪年用帝王年号加年次，干支纪年六十年一循环。月相按月亮圆缺：初一朔、十五望、十六既望、月末晦。理解时把纪年月相放入句意推算即可。","example":"“壬戌之秋”是干支纪年，“戊申晦”兼有干支纪日与月相。","tip":"干支题记天干地支顺序，按句意推算年岁。"},"0|3|k|3":{"explain":"官职知识分升降授罢四类：拜除授征是授官，迁擢升是升官，贬谪左迁是降官，罢黜是免官。科举层级为院试乡试会试殿试，及第即考中。分类记忆最不易混。","example":"“左迁”即降职，“除”是授官，“擢”是提升。","tip":"官职题先判断升降方向，左迁必为降职。"},"0|3|k|4":{"explain":"称谓看对象：自称用谦称（臣、仆、愚），称人用敬称（君、子、足下），尊长者用尊称（陛下、殿下）。区分关键在说话人与听话人身份，口诀：自称谦、称人敬。","example":"与友书信自称“仆”，称对方“足下”；对帝王称“陛下”。","tip":"谦敬称看称呼对象，自称用谦、称人用敬。"},"0|3|k|5":{"explain":"阴阳命名有固定规则：山南水北为阳，山北水南为阴。分野是星空与地域对应，五岳为东西南北中五山。记阴阳用“山南水北晒太阳”的口诀，其余靠积累。","example":"“汉阳”在汉水之北，“华阴”在华山之北。","tip":"阴阳题先背口诀“山南水北为阳”，勿记反。"},"0|3|d|0":{"explain":"官职词方向是高频易错点：拜除授征是授官，迁擢拔陟是升迁，贬谪左迁放是降职，徙调是调动。记忆按“上中下”三档归类，做题先判方向再解释。","example":"“拜为上卿”是授官，“谪守巴陵郡”是降职外调。","tip":"官职题第一步判断升降方向，凡“左”字多与降职相关。"},"0|3|d|1":{"explain":"纪年月日组合出现时分层解读：年号加干支是年，干支记月日按顺序推。先判断是纪年还是纪日，再把干支序号排出先后，结合文意判断时间跨度。","example":"“元丰七年六月丁丑”，元丰是年号纪年，丁丑是纪日。","tip":"遇干支先想纪年还是纪日，再据上下文推断先后。"},"0|3|d|2":{"explain":"谦敬称原则是“自卑而尊人”：说自己用谦称（家父、拙作），说对方用敬称（令尊、大作）。判断先确认称呼指向谁，再检查是否符合“自称谦、称人敬”。","example":"称自己父亲“家父”，称对方父亲“令尊”，一字之差见尊卑。","tip":"谦敬题先看称呼对象，“家舍”谦，“令尊贵”敬。"},"0|3|e|0":{"explain":"常识选择题常见陷阱：张冠李戴、以今释古、无中生有、范围失当。解题逐项与课本核对，遇到不确定的回想教材原文例句，以课内为据最稳妥。","tip":"拿不准的选项回想课本原句，教材例句是最终依据。"},"0|3|e|1":{"explain":"三类称号各有来源：庙号是死后立庙奉祀（祖、宗），谥号是据生平评定（文、武、哀），尊号是生前加的美称。记忆：庙号看祖宗，谥号看褒贬字眼。","example":"“汉高祖”是庙号，“汉武帝”是谥号。","tip":"见“祖宗”想庙号，见褒贬字眼想谥号。"},"0|3|e|2":{"explain":"科举四级链：院试取秀才，乡试取举人，会试取贡士，殿试取进士（一甲状元榜眼探花）。三试第一名分别称解元、会元、状元，连中三元即三试皆第一。记“层层递进、名次对应”。","example":"“连中三元”指解元、会元、状元全部高中。","tip":"注意“三元”对应三级考试，勿把名次记反。"},"0|3|e|3":{"explain":"高考文化常识常回扣课内例句。复习把课文中的纪年、月相、官职、称谓例句整理成卡片，如“壬戌之秋”“戊申晦”，课内例句是考点最佳载体。","tip":"考前把课文中纪年月相官职例句过一遍，考到即得分。"},"0|4|k|0":{"explain":"中心论点须正确、鲜明、有针对性，是全文灵魂；分论点从不同侧面支撑中心，形成“一纲多目”。动笔前先写清中心论点，全文处处回扣，分论点之间不交叉。","example":"中心论点“青年当以奋斗书写青春”，分论点从个人、时代、国家展开。","tip":"中心论点一句话写清，全文每段回扣，忌中途偷换。"},"0|4|k|1":{"explain":"论据贵精不贵多：典型（有代表性）、真实（不编造）、新颖（不雷同）。事实论据与道理论据结合，事实提供支撑，道理提升深度。宁用深刻一例，不用平庸十例。","example":"论证坚守，可用苏武牧羊之例，引“艰难困苦，玉汝于成”作道理。","tip":"事例叙述要概括，围绕论点剪裁，忌完整讲故事。"},"0|4|k|2":{"explain":"五种论证方法各司其职：举例以事实服人，道理以理服人，对比在正反相形中见是非，比喻化抽象为形象，引用借权威增信。好议论文常以对比为主干、举例为血肉。","example":"“骐骥一跃，不能十步”以对比加比喻论证坚持之力。","tip":"论证方法要“方法＋作用”一起写，忌只报名称。"},"0|4|k|3":{"explain":"议论文三段式骨架：引论亮中心论点，本论分层论证（并列、递进或对比），结论总结升华。引论短而有力，本论占大半篇幅，结论回扣论点提出希望。","tip":"本论至少分两层展开，每层有独立分论点。","example":"引论提出“青年当担时代之责”，本论从个人、社会、国家分三层论证，结论回扣升华。"},"0|4|k|4":{"explain":"分论点三种架构：并列式平列支撑、递进式层层深入、对比式正反相映。关键是角度统一：都从“是什么、为什么、怎么办”同一维度切分，避免内容交叉重复。","example":"写“诚信”，并列式分“立身、兴业、兴邦”三层。","tip":"分论点写成对称句式更醒目，角度务必统一。"},"0|4|k|5":{"explain":"好题目是文章眼睛：比喻式形象，引用式典雅，对偶式工整。无论哪种都必须或明或暗指向中心论点，让阅卷者一眼看出立意。","example":"写创新可拟“问渠那得清如许，为有源头活水来”。","tip":"拟题忌大而空，忌与论点脱节，题目即论点最好。"},"0|4|d|0":{"explain":"用例的黄金法则：事例后必须回扣分析，点明与论点的联系，即“叙例＋析例”。析例可用因果追问或假设反推。只叙不析，事例就成了孤立材料堆。","example":"举袁隆平之例后追问：正因心怀苍生，方能躬耕田亩数十载。","tip":"每个事例后至少写两行分析句，把事例与论点焊在一起。"},"0|4|d|1":{"explain":"分论点交叉的根源是角度未界定。先确定切分维度（是什么为什么怎么办或个人社会国家），每个分论点独占一个侧面，写前列提纲检查内涵独立。","example":"写“自律”从“修身基石、成才阶梯、时代呼唤”三层递进。","tip":"列提纲给每个分论点标注角度，发现重复立即调整。"},"0|4|d|2":{"explain":"论证深度来自因果追问：不只说“他成功了”，要问“为什么成功”。常用句式：正因为……所以……；如果……那么……。把事例放进因果链，论证就从罗列升华为说理。","example":"追问：若无日复一日训练，全红婵何以技压群芳？可见坚持是卓越之母。","tip":"每段追问一次“为什么”，用因果句收束。"},"0|4|e|0":{"explain":"审题四步：抓材料关键词句，理任务指令，辨情境范围，明文体要求。审题是写作生命线，偏题一切归零。","tip":"审题先圈关键词与任务指令，动笔前复述题意自检。"},"0|4|e|1":{"explain":"标准主体段五步：观点句亮分论点，阐释句解释内涵，事例句列典型论据，分析句扣题析例，小结句回扣总结。五步成段论证完整，是阅卷最认可的段落形态。","tip":"每段第一句亮分论点，末句回扣，段内不跑题。"},"0|4|e|2":{"explain":"满分60分构成：基础等级40分（内容语言）看切题中心内容语言，发展等级20分看深刻丰富文采创意。想上50分，基础要稳，发展要有亮点。","tip":"保基础等级先求切题完整，再求发展等级亮点。"},"0|4|e|3":{"explain":"三大失分点提前防范：偏题靠圈关键词写提纲，观点模糊靠首段鲜明亮论点，素材陈旧靠分类素材本储备时代新例。知己知彼方能避坑。","tip":"考前准备好最熟的五个新鲜素材，考场直接迁移。"},"0|4|e|4":{"explain":"开头快速入题：引材料、析关键、亮观点三步，150字内完成；结尾回扣中心并升华：重申论点、联系时代、发出号召。首尾呼应、观点鲜明是印象分保障。","tip":"开头结尾各三至五行，开头见观点、结尾见升华。"},"1|0|k|0":{"explain":"小说以塑造人物为中心，情节是人物性格的发展史，环境是活动舞台。主题不直接说出，藏在三要素相互作用里：人物命运揭示、情节推动、环境暗示。分析从三要素入手。","example":"《祝福》中祥林嫂的悲剧命运与冷漠环境共同指向封建礼教吃人。","tip":"概括主题时把人物情节环境三方面证据都摆出来。"},"1|0|k|1":{"explain":"倒叙把结局提前：开篇写祥林嫂死在祝福之夜，再回溯一生遭遇。一石三鸟：悬念先行，悲剧与喜庆反差强烈，突出礼教杀人于无形。分析作用抓住悬念、对比、主题。","example":"开篇“我”遇见沦为乞丐的祥林嫂，再倒叙她两次嫁人两次丧夫。","tip":"答倒叙作用必提“悬念”“对比”“突出主题”三点。"},"1|0|k|2":{"explain":"祥林嫂是“勤劳善良却被礼教吃掉的悲剧典型”：安分耐劳、易于满足，却因再嫁丧夫被视为不祥，捐门槛也赎不了罪。分析抓“她做了什么、别人如何待她、结果如何”三线。","example":"她“头上扎着白头绳”，肖像变化透出精神逐步崩溃。","tip":"分析祥林嫂扣住“勤劳善良”与“礼教摧残”的对照。"},"1|0|k|3":{"explain":"风雪描写多维作用：推动情节（风雪紧促林冲沽酒、草屋塌夜宿山神庙），烘托人物（隐忍坚韧），象征黑暗压迫。答题覆盖情节、人物、主题三角度。","example":"“那雪正下得紧”的“紧”字既写雪势，又暗示形势危急。","tip":"环境描写作用题按情节人物主题三角度作答。"},"1|0|k|4":{"explain":"戏剧靠冲突推进：周朴园与鲁侍萍的冲突是情爱良心的旧账，与鲁大海的冲突是劳资对立。两条线交织，把家庭恩怨上升为社会矛盾。分析抓冲突双方、焦点、实质。","example":"周朴园对侍萍“怀念”与“冷酷”的矛盾，正是伪善性格的暴露。","tip":"分析《雷雨》冲突必点“阶级对立”的实质。"},"1|0|k|5":{"explain":"描写分正面侧面：正面有肖像、语言、动作、心理、神态与细节，侧面借他人他物烘托。分析先找描写句，判方法，再谈效果——写出什么性格、推动什么情节。","example":"祥林嫂反复说“我真傻”，语言描写揭示她被礼教毒害而不自知。","tip":"答描写方法“方法＋例句＋性格效果”三步。"},"1|0|k|6":{"explain":"环境作用四板斧：渲染氛围、塑造人物、推动情节、暗示主题。自然环境多渲染烘托，社会环境多揭示根源。答题先分自然与社会，再四角度筛选。","example":"《林教头》大风雪既渲染紧张氛围，又推动林冲走向山神庙。","tip":"环境题先分自然与社会环境，再按四角度作答。"},"1|0|d|0":{"explain":"祥林嫂之死是多因合力：封建礼教是根源，鲁四老爷冷漠、柳妈说教、看客嘲讽都是帮凶，加上自身迷信愚昧。分析悲剧分层：直接原因、深层原因、根本原因。","example":"捐门槛仍不被接纳，直接击垮精神支柱，背后是礼教的集体围剿。","tip":"悲剧原因题按“直接＋深层＋根本”分层作答。"},"1|0|d|1":{"explain":"次要人物承担多重功能：推动情节、映衬主角、代表环境、揭示主题。柳妈以好心劝捐门槛，鲁四老爷以礼驱逐，都是礼教的执行者与帮凶；看客麻木构成生存土壤。","example":"鲁四老爷的“皱眉”与“不干不净”之语，正是礼教杀人的化身。","tip":"次要人物题谈“帮凶性”与“环境象征”作用。"},"1|0|d|2":{"explain":"潜台词是台词背后的言外之意，读懂三步：结合人物性格、结合矛盾冲突、结合上下文。潜台词常表里不一：表面客气实则威胁，表面怀旧实则试探。","example":"周朴园问“你——你贵姓？”实为试探侍萍身份，藏着惊慌戒备。","tip":"解读潜台词先想人物动机，再说言外之意。"},"1|0|e|0":{"explain":"人物形象题框架：先用两至四个词概括性格特征，再逐条引用细节佐证。概括要准确分层，佐证要具体到引文。忌只贴形容词不给依据。","tip":"性格词要精准分层，每条配一处细节引文。"},"1|0|e|1":{"explain":"情节作用两大角度：结构上答铺垫、伏笔、悬念、承上启下、照应；内容上答塑造人物、揭示主题、渲染氛围。按“结构＋内容”分点，每点结合具体情节。","tip":"情节题先答结构再答内容，两角度缺一不可。"},"1|0|e|2":{"explain":"环境题先分类型：自然环境答渲染、烘托、推动、象征；社会环境答交代背景、揭示根源、塑造人物、深化主题。用四点法自查是否答全，分点作答层次分明。","tip":"环境题先定类型再套四点法，两类环境勿混写。"},"1|0|e|3":{"explain":"标题含义题两层作答：表层是字面意思，深层是象征与讽刺。如《祝福》在祝福声中写祥林嫂之死，喜庆反衬悲剧，讽刺礼教虚伪。答题由表及里联系主题。","tip":"标题题必答表层与深层义，深层常含讽刺或象征。"},"1|0|e|4":{"explain":"细节题答“写了什么细节＋有何作用”。山神庙细节（搬石头顶门、听仇人对话）既推动情节转折，又刻画人物。训练先找细节，再连情节与人物分析。","example":"林冲“把枪和酒葫芦放在纸堆上”，写出亡命途中的谨慎。","tip":"细节题先定位细节句，再从情节与人物两方面作答。"},"1|1|k|0":{"explain":"烛之武说理精妙在以利诱之、以害惧之：先示弱降戒备，再析亡郑利晋弊秦、存郑惠秦，最后点破晋贪。全程站秦国立场说利害，层层递进。说服关键是换位思考。","example":"“邻之厚，君之薄也”直指灭郑对秦百害而无一利。","tip":"分析说理艺术抓“站在对方立场谈利害”的核心。"},"1|1|k|1":{"explain":"鸿门宴是性格决定命运的现场演示：刘邦能屈能伸善用人，项羽刚愎自用妇人之仁。对比手法贯穿：语言、用人、处事处处对照，性格差异推动情节走向。","example":"刘邦“臣与将军戮力而攻秦”的谦辞，对照项羽“此沛公左司马曹无伤言之”的轻率。","tip":"分析《鸿门宴》人物必用对比法。"},"1|1|k|2":{"explain":"魏征以“积德义”为治国根本，提出居安思危、戒奢以俭十思。论证多用比喻：以“求木之长者必固其根本”喻治国须固本，以“载舟覆舟”喻民水君舟。","example":"“臣闻求木之长者，必固其根本”，以树喻国说明根基稳固之要。","tip":"答比喻论证要说出喻体与所喻之理。"},"1|1|k|3":{"explain":"王安石以“名实之辩”立论：先正名，再逐条反驳司马光“侵官、生事、征利、拒谏”四项责难，最后申明“度义而后动”的决心。驳论先立靶子、逐条击破。","example":"“盖儒者所争，尤在于名实”，先定辩论规则再据实反驳。","tip":"概括驳论按“立标准—逐条驳—表态度”三步。"},"1|1|k|4":{"explain":"这些实词结合语境记多义：贰有从属二主、不专一义，鄙有边邑、粗俗、轻视义，谢有道歉、辞别、凋谢义，坐有坐下、因为、获罪义。本义加语境选义。","example":"“微夫人之力不及此”的“微”是没有，表假设否定。","tip":"一词多义把词义代入原文试译，通顺者优先。"},"1|1|k|5":{"explain":"通假字是借音同音近字代替本字：按字面译不通时考虑通假，按本字翻译。如“共”通“供”、“距”通“拒”、“要”通“邀”、“籍”通“藉”。成对记忆最牢。","example":"“距关，毋内诸侯”中“距”通“拒”，“内”通“纳”。","tip":"翻译遇不通先想通假，按本字义译出。"},"1|1|k|6":{"explain":"古今异义是形同义异，防以今律古：山东古指崤山以东，婚姻古指儿女亲家，非常古指意外变故，行李古指外交使者。双音节词按今义译不通时拆单音词解释。","example":"“备他盗之出入与非常也”中“非常”是意外变故。","tip":"见双音节词先拆开看，按古义通顺即古今异义。"},"1|1|d|0":{"explain":"三类用法靠动宾关系区分：使动是使宾语怎么样，意动是认为宾语怎么样，为动是为宾语怎么样。先译宾语再看关系：使、认为、为，三选一即定。","example":"“沛公旦日从百余骑来见项王”中“从”为使动。","tip":"活用题先译宾语再看关系，三类关系三选一。"},"1|1|d|1":{"explain":"对话体省略频繁：承前省、蒙后省、对话省。翻译须依据上下文补出省略的主语宾语，补全后再直译才文从句顺。给省略成分加括号标出既是规范也是得分提示。","example":"“夜缒而出”省略主语“烛之武”，翻译须补出。","tip":"翻译前先判断省略了谁，补出后再译。"},"1|1|d|2":{"explain":"文体不同功用有别：疏是臣下向皇帝陈述政见（《谏太宗十思疏》），表是陈情言志（《陈情表》），书是书信（《答司马谏议书》）。奏疏说理多“提出问题—分析利害—提出建议”。","example":"《陈情表》先陈身世，再述忠孝两难，终达辞官之愿。","tip":"文体题先记功用差异，奏疏注意陈情与说理结合。"},"1|1|e|0":{"explain":"翻译考语境中选义：同一词在不同句子意义不同，须据上下文定夺。如“谢”在“旦日不可不蚤自来谢项王”中是道歉。做题先通读全句定语境再选义。","tip":"多义实词先看搭配对象与语境，勿套记固定义。"},"1|1|e|1":{"explain":"断句双保险：先用标志词定位（曰后断、乎也矣后断、句首发语词前断），再用句意验证——断出的每段意义完整、语法通顺。","tip":"标志词断完必默读验证，冲突时以文意为准。"},"1|1|e|2":{"explain":"内容概括错误主要有：无中生有、张冠李戴、强加因果、时序颠倒。解题唯一可靠方法是回文比对：逐句定位选项对应原文，核对人物、事件、因果三要素。","tip":"比对先对人物，再对事件，最后对因果。"},"1|1|e|3":{"explain":"《谏太宗十思疏》高频默写句：居安思危、戒奢以俭；载舟覆舟，所宜深慎。这些句子都围绕守成须积德义展开，理解语境记忆更牢，注意“覆”“慎”写法。","tip":"默写注意“覆舟”的“覆”与“深慎”的“慎”。"},"1|1|e|4":{"explain":"赏析劝谏艺术看三点：立场（是否站对方角度）、策略（利诱、以古为鉴）、语言（委婉得体还是直陈利弊）。答题按“策略＋语言＋效果”组织。","tip":"劝谏题必点“对方立场＋利害分析＋语言得体”。"},"1|2|k|0":{"explain":"新闻家族各有分工：消息短平快报事实，通讯详实展开，特写聚焦瞬间，评论表明观点。共同底线是真实性与时效性。识别看侧重：消息看导语，通讯看细节，评论看论点。","example":"突发事件快讯是消息，深度报道人物故事是通讯。","tip":"体裁题看内容侧重：重事实快报是消息，重观点是评论。"},"1|2|k|1":{"explain":"消息五部分：标题点要事，导语概括核心事实，主体展开详情，背景交代来龙去脉，结语收束。导语最重要，是倒金字塔顶端，读完导语即知大意。","example":"导语通常回答何人何时何地做了何事五个W。","tip":"概括消息以导语为主、主体为辅。"},"1|2|k|2":{"explain":"六要素是新闻骨架，相当于五W一H：时间、地点、人物、事件、原因、经过。阅读带着六要素提问，信息自然清晰；概括新闻就是压缩六要素。","example":"“5月20日，神舟十六号飞船在酒泉发射成功”即含时间地点事件。","tip":"概括新闻先找六要素，缺项回原文补全。"},"1|2|k|3":{"explain":"新闻要求客观，但倾向性藏在选材、措辞与引语中：报什么不报什么、用褒词贬词、引谁的话。阅读既要信事实，也要留意倾向，区分“报道了什么”与“暗示了什么”。","tip":"分析倾向性看选材与措辞，勿把倾向当失实。","example":"同是报道地震，一方聚焦救援细节，一方引用官员表态，选材与措辞不同，倾向自见。"},"1|2|k|4":{"explain":"信息题三步法：据题干关键词定位原文区间，与选项逐词比对防偷换扩大绝对化，归纳概括时合并同类项提炼上位词。定位准、比得细、概括精。","tip":"概括要点合并同类信息，用总分结构作答。","example":"题干问“阅读率变化”，先在材料二定位数据段，再与选项逐词比对，最后概括为“总体上升”。"},"1|2|k|5":{"explain":"图表读法：先看标题与单位，再看数据极值与变化趋势，最后把数据与文字结合推结论。表述要准确：“逐年上升”与“总体上升”不同。","example":"柱状图显示读书时长逐年递增，可概括为全民阅读持续升温。","tip":"图表表述忌绝对化，趋势词要与图相符。"},"1|2|d|0":{"explain":"事实是可验证的陈述，观点是主观判断。评论中二者交织：事实是观点的依据。辨别办法：看能否验证——能验证的是事实，含“应该、必须、我认为”的是观点。","example":"“某校开展劳动课”是事实，“劳动教育刻不容缓”是观点。","tip":"区分题先问“能否验证”，带主观判断词为观点。"},"1|2|d|1":{"explain":"整合两大敌人是遗漏与重复。对策是合并同类项：把意思相近的信息归并成一条，提炼上位概念；分点前先列清单，确保每点独立不重叠。语言概括，忌照抄原文。","tip":"整合前圈出所有要点，合并归类防重复。","example":"两则材料都谈垃圾分类，可将“定时投放”“专人督导”合并为“健全管理机制”一条。"},"1|2|d|2":{"explain":"图表转文字三要素：单位、极值、变化趋势。表述句式常用“总体呈……趋势，其中……最高，……最低”。数字表述要严谨，“翻一番”与“增长一倍”要分清。","tip":"图表表述先总体趋势再极值，数字单位务必准确。","example":"折线图显示某市GDP逐年上升，可表述为“经济总量总体呈上升趋势，其中第三产业增幅最大”。"},"1|2|e|0":{"explain":"实用类三大陷阱：偷换概念、以偏概全、强加因果。解题逐项回文比对，关注限定词（所有、都、只有）与因果词。比对是唯一可靠方法。","tip":"比对时圈出限定词与因果词，与原文逐词核对。"},"1|2|e|1":{"explain":"非连续性文本答题两步：先各则分别概括要点，再横向比较共同与差异。作答常用“三则材料共同关注……，差异在于……”的结构，互补材料看信息如何互相补充。","tip":"比较题先概括单则再比异同，忌只抄原文。"},"1|2|e|2":{"explain":"评论分析三角度：立场（支持反对、站在谁一边）、针对性（针对什么现象）、论证方式（举例、引用、对比、因果）。按“立场＋靶子＋方法”组织。","tip":"评论题先亮立场，再说针对什么，最后谈论证。"},"1|2|e|3":{"explain":"情境任务考综合表达：拟标题要准确醒目，写推荐语要扣主题有文采字数合规。先审清任务指令（给谁写、写什么、多少字），内容抓核心，表达得体生动。","tip":"拟标题先概括核心事件再提炼亮点，勿超字数。"},"1|3|k|0":{"explain":"前五回是全书总纲：冷子兴演说介绍家世人物，黛玉进贾府借其眼写布局与人物登场，葫芦僧判案引出四大家族，判词预示命运。读透前五回，全书脉络尽在掌握。","example":"黛玉进贾府一回，让宝玉、王熙凤等主要人物集中亮相。","tip":"前五回信息密集，可做人物关系表与判词对照表。"},"1|3|k|1":{"explain":"宝黛是知己之恋，宝钗婚姻是家族联姻，悲剧根源不在个人而在家族利益与礼教规范：金玉良缘胜过木石前盟。理解要从“个人选择vs家族制度”的冲突看。","example":"黛玉焚稿断痴情、宝玉出家，都是个性被礼教碾碎后的绝唱。","tip":"谈爱情悲剧必上到“家族与礼教压抑个性”层面。"},"1|3|k|2":{"explain":"主要人物各具标签又立体复杂：宝玉痴情叛逆、黛玉孤高多愁、宝钗圆融世故、凤姐精明泼辣。把握人物抓典型言行：宝玉摔玉显痴，黛玉葬花见愁。","example":"凤姐“我来迟了”的出场，先声夺人，泼辣性格立现。","tip":"人物题用“性格词＋典型情节”作答。"},"1|3|k|3":{"explain":"关键情节各有功能：元妃省亲写极盛奢华，刘姥姥进园以村妪之眼看贵族生活并伏家族衰败，抄检大观园是内讧与败落的转折。记情节要连功能。","example":"抄检大观园中晴雯之死，预示众芳凋零的命运。","tip":"情节题答“内容＋在全书的作用”，勿只复述故事。"},"1|3|k|4":{"explain":"居所是性格的外化：潇湘馆翠竹幽静映黛玉清高，蘅芜苑朴素清冷映宝钗内敛，怡红院富丽映宝玉痴顽。环境描写暗示性格命运，是以物写人的经典手法。","example":"潇湘馆“凤尾森森，龙吟细细”，正是黛玉孤高气节的写照。","tip":"环境映衬题把“住所特征＋人物性格”对应作答。"},"1|3|k|5":{"explain":"曹雪芹善用草蛇灰线、伏脉千里的笔法：前文不经意的细节后文必有照应。判词、灯谜、酒令都是谶语暗示命运，如“玉带林中挂”暗指黛玉。留意伏笔与照应。","example":"第五回金陵十二钗判词，实为全书人物命运的提纲。","tip":"谈伏笔要“前文何处埋线、后文何处照应”成对说出。"},"1|3|d|0":{"explain":"红楼人物拒绝脸谱化：宝钗的圆融既是体贴周全，也是藏愚守拙的世故；黛玉的多愁既有诗意深情，也有尖刻小性。分析要一分为二，优缺点并存，结合情节两面作答。","example":"宝钗替湘云办螃蟹宴见其周到，劝王夫人又见其冷漠。","tip":"人物评价用“既……又……”句式辩证作答。"},"1|3|d|1":{"explain":"判词用拆字、谐音、隐喻写命运：“玉带林中挂”拆“林”指黛玉，倒挂寓悲剧；“金簪雪里埋”谐宝钗。解读步骤：拆字谐音定位人物，再结合情节验证命运。","example":"“机关算尽太聪明，反算了卿卿性命”明指王熙凤的精明反噬。","tip":"判词题先拆字谐音找人物，再以情节印证。"},"1|3|d|2":{"explain":"红楼情节如蛛网：一处闲笔常牵动全局。理解靠前后勾连：读后文回看前文，把伏笔、暗示、人物关系连成因果链。读时做笔记：人物关系、关键事件、预言照应三张表。","tip":"分析情节因果先定位伏笔处，再找照应处成对作答。","example":"前文宝钗扑蝶偶听小红的闲笔，后文滴翠亭嫁祸相照应，一伏一应，情节因果环环相扣。"},"1|3|e|0":{"explain":"高考整本书常给材料（描写、对话、回目）让判断人物、情节或分析主题。应对：熟记主要人物标志性言行、关键回目内容与主题脉络，考时先定位材料出处再作答。","tip":"材料定位法：抓言行特征与场景标志，先定位再作答。"},"1|3|e|1":{"explain":"人物分析要细节说话：抓典型言行、心理、他人评价，从性格、处境、命运多角度作答，每条结论配一处细节依据。","tip":"每条性格概括后紧跟引文依据，多角度防漏分。"},"1|3|e|2":{"explain":"红楼梦主题多层：表层是宝黛爱情悲剧，中层是家族兴衰，深层是对封建礼教的批判。探究题分层作答，由爱情到家族再到社会，每层引情节佐证。","tip":"主题题按“爱情—家族—社会”三层递进。"},"1|3|e|3":{"explain":"细节题考熟读程度，如刘姥姥三进荣国府：一进打秋风写排场，二进游园观贵族生活，三进救巧姐写败落后的世态。精读关键回目，把反复情节串成线索记忆。","tip":"考前把“三进”等反复情节列表整理，考到即答。"},"1|4|k|0":{"explain":"思辨核心是一分为二：任何事物都有两面，好坏利弊常并存转化。避免非黑即白的绝对化与只看一面的片面化。常用“诚然……但是……”句式让观点更周严。","example":"论网络，既看到信息便捷，也警惕信息茧房。","tip":"用“诚然……但是……”让步再转折，思辨感立增。"},"1|4|k|1":{"explain":"思辨有固定角度：现象与本质、整体与局部、继承与创新、利与弊。选一个角度深挖比面面俱到更有深度。角度即思维的切入口。","example":"谈传统文化，既谈继承的根脉意义，又谈创新的时代价值。","tip":"每个分论点锁定一个思辨角度，角度统一论证不散。"},"1|4|k|2":{"explain":"递进结构是思辨作文骨架：先界定是什么，再分析为什么，最后谈怎么办。三步层层深入，逻辑链条清晰。重心放在“为什么”上。","example":"写“奋斗”：什么是奋斗→为何要奋斗→如何奋斗。","tip":"递进结构重心放“为什么”，原因越透越有深度。"},"1|4|k|3":{"explain":"批判思维是不轻信、敢质疑：对现成观点设问（真的如此吗？有无例外），多角度审视，避免盲从。写作中体现为“他人观点—我的质疑—我的判断”的思辨过程。","example":"论“出名要趁早”，可质疑：早成名是否必然幸福？","tip":"质疑要有理有据，批判后须亮自己的判断。"},"1|4|k|4":{"explain":"好作文要与现实对话：论点回应时代热点，论据联系身边事例与自身体验，让说理落地。空谈道理不如一个有体温的例子。写作时问“这与我、与当下有什么关系”。","tip":"每篇至少用一两个时代热点或身边实例增强现实感。","example":"论“双减”政策，联系身边同学课业负担的实际变化与感受，比空谈理念更有说服力。"},"1|4|d|0":{"explain":"辩证不等于骑墙：分析两面后必须亮明主次倾向——肯定什么、否定什么、以何为主。先辩证后表态，观点才有锋芒；只摆两面不表态就是和稀泥。","example":"论“快与慢”，先析两者价值，再亮“张弛有度”的主见。","tip":"辩证段末必有“总而言之，我认为……”的明确表态。"},"1|4|d|1":{"explain":"举例只是论证起点，深度来自追问：因果分析、价值判断、假设推演。每例之后补上“因为……所以……”“这启示我们……”的分析句，深度即提升。","example":"举屠呦呦之例后追问：若非数十年坚守与中西合璧，青蒿素何来？","tip":"例后至少写两行因果式分析，把事例转化为说理。"},"1|4|d|2":{"explain":"立意求新是双刃剑：新角度脱离材料核心就成了跑题。对策：立意前锁定材料关键词与任务指令，新角度必须在材料射程之内。先保准确，再求新颖。","tip":"立意后回读材料自检，不跑题再求新。","example":"材料谈“快与慢”，新角度“慢是沉淀”须回扣材料中的事例，脱离材料空谈养生即为跑题。"},"1|4|e|0":{"explain":"关系型作文难点在“关系”：不是分别谈坚守和变通，而要谈二者如何统一——坚守原则与灵活变通相辅相成。先界定内涵，再谈辩证关系，最后给兼顾的结论。","tip":"关系型作文必用“二者并非对立，而是统一”点明关系。"},"1|4|e|1":{"explain":"立意流程：先从材料挖掘多个角度，再比较哪个最切题、最深刻、最有话说，最后选定深耕。多角度是广度，选优是判断力，深挖是执行力。","tip":"立意前列三个角度比较，选“切题＋深刻＋可写”者。"},"1|4|e|2":{"explain":"高考“深刻”等级看两点：观点辩证与说理透彻。达成路径：立意加辩证维度，论证多问为什么，语言善用层递与让步句式。","tip":"想得深刻分，每段追问一次为什么。"},"1|4|e|3":{"explain":"时评作文四步：引述事件、亮明观点、就事论理、联系拓展。层次清晰，观点先行，说理针对事件本身而非泛泛而谈。","tip":"时评开头先引事件再亮观点，紧贴事件分析。"},"2|0|k|0":{"explain":"诗歌流变是一条河：诗经四言、楚辞骚体、汉乐府五言、魏晋文人诗、唐诗宋词元曲各领风骚。记忆按“时代—体裁—代表”串线，如唐诗近体诗成熟、宋词婉约豪放。","example":"从《诗经》四言到《离骚》骚体，再到乐府五言，句式愈趋自由。","tip":"记流变用时间轴串联体式与代表作。"},"2|0|k|1":{"explain":"唐诗题材按内容分类，各有情感密码：送别惜别劝慰，边塞豪壮或厌战，山水田园闲适隐逸，咏史借古讽今，羁旅思乡念亲。读诗先判题材，题材定调。","example":"《送杜少府之任蜀州》是送别诗，但“天涯若比邻”一反哀愁，豁达豪迈。","tip":"判题材看标题关键词，题材是情感的第一把钥匙。"},"2|0|k|2":{"explain":"豪放婉约两大风格：豪放（苏辛）境界阔大、情感激昂，多用大意象；婉约（柳李）含蓄细腻，多写景抒情小景。鉴赏从选材、意象、语言、情感四方面对比。","example":"“大江东去”豪迈奔放，“杨柳岸晓风残月”婉约缠绵。","tip":"风格看意象大小与情感基调，豪放未必无柔情。"},"2|0|k|3":{"explain":"散文体裁各有功能：论是议论说理，说是阐明事理，记是记事写景，序是赠言或书序，表是陈情，书是书信，赋是铺陈。记“体裁—功能—代表篇目”三件套。","example":"《谏太宗十思疏》是疏（奏章），《项脊轩志》是志（记事）。","tip":"文体题先记“体裁—功能—代表篇目”，考试直接匹配。"},"2|0|k|4":{"explain":"重要篇目要一篇一档：作家风格、题材情感、名句、手法、常考默写句。如《将进酒》豪放不羁、以酒写愁转乐。复习给每篇做知识卡片，考点尽收其中。","example":"《蜀道难》“蜀道之难，难于上青天”反复咏叹，极言其险。","tip":"篇目复习做卡片：作者、情感、名句、手法四项。"},"2|0|k|5":{"explain":"高频虚词建“用法树”：每个虚词按词性分叉，如“之”作代词、助词（的、取消独立性、提宾标志）、动词。以课本例句为枝叶，一句一用法，挂例句记忆最牢。","example":"“之二虫又何知”的“之”是代词这，“鹏之徙于南冥”取消独立性。","tip":"虚词梳理用例句卡片法，每个用法配课本原句。"},"2|0|d|0":{"explain":"怀古诗是古今对话：诗人临古迹，忆古事，看今景，抒己情。三层结构“古事—今景—己情”是解读钥匙，答题逐层提取，再谈古今对比中的情感落差。","example":"《念奴娇·赤壁怀古》怀周瑜雄姿，对赤壁之景，抒华发早生之叹。","tip":"怀古诗题按“古事、今景、己情”三层作答。"},"2|0|d|1":{"explain":"赋体语言两大特征：铺陈排比（大量对偶骈句渲染场面）与韵散结合（骈散相间、韵脚灵活）。赏析从对偶、铺陈、韵律、虚实几个角度谈。","example":"“诵明月之诗，歌窈窕之章”骈偶工整，开篇即见赋味。","tip":"赏析赋体抓“铺陈对偶＋韵散相间”，举原句印证。"},"2|0|d|2":{"explain":"虚词辨义靠“位置定词性”：在动词前多为介词，在句末多为助词；介词语义再依宾语判断。先位置后语义，两步定用法。如“以刀劈狼首”的“以”是用。","example":"“于”在“取之于蓝”是从，“而青于蓝”是比较，“不拘于时”表被动。","tip":"虚词题先看位置定词性，再代入语境选义项。"},"2|0|e|0":{"explain":"选择题常考题材归类与情感基调双判断，错误常设题材张冠李戴或情感拔高贬低。应对：读诗三步先定题材，再依诗句定基调，排除情感过度解读的选项。","tip":"情感判断忌拔高，以诗句实际内容为准。"},"2|0|e|1":{"explain":"诗眼是统摄全诗情感意境的字词，或在一句或在全篇。答题三步：指出诗眼，解释字面义，分析它如何统摄——贯穿意象、奠定基调、统领情感。","example":"《早梅》“昨夜一枝开”的“一”字突出其早其孤，正是诗眼。","tip":"诗眼题必答“统摄作用”，勿只释字义。"},"2|0|e|2":{"explain":"抒情方式四类：直抒胸臆、借景抒情、托物言志、用典抒怀。辨析看情感如何呈现：有抒情句是直抒，全写景是借景，聚焦一物是托物，引古人古事是用典。","example":"“念天地之悠悠，独怆然而涕下”直抒；“零落成泥碾作尘”托物。","tip":"抒情方式题先判呈现方式再答情感。"},"2|0|e|3":{"explain":"翻译按踩分点给分：重点实词约两处、关键虚词一处、特殊句式一处、整体文意一处。备考养成圈采分点习惯：先圈后译，确保每点译到位。","tip":"翻译先圈实词活用与句式采分点，逐点落实。"},"2|0|e|4":{"explain":"高二默写范围横跨初高中与选择性必修，新增篇目是命题热点。复习按“新增优先、高频重复”：先背熟选择性必修新增，再滚动复习必修高频，建错字清单。","tip":"选择性必修新增篇目优先背诵，易错字单独建清单。"},"2|1|k|0":{"explain":"论述文结构四式：总分、并列、递进、对比。梳理思路就是解剖结构：先找中心论点，再看分论点如何组织，最后概括为“先……再……最后……”的链条。","example":"《师说》先立论再用三组对比展开，属对比式结构。","tip":"思路题用“首先……接着……然后……最后……”连缀作答。"},"2|1|k|1":{"explain":"论据分事实与道理两类：事实论据以具体支撑论点（典型性），道理论据以权威增强说服力（深刻性）。答题点明类型，再说它如何支撑相应论点。","example":"论证“苦难铸就辉煌”，举司马迁著《史记》为事实论据，引“生于忧患”为道理论据。","tip":"论据题先判类型，再说支撑哪个论点。"},"2|1|k|2":{"explain":"常见逻辑谬误要对号入座：偷换概念、以偏概全、强加因果、因果倒置、扩大缩小范围。识别靠比对关键词：概念词、范围词、因果词。","example":"“小明数学好，全班数学都好”是以偏概全。","tip":"判断题先圈范围词与因果词，再对照谬误类型。"},"2|1|k|3":{"explain":"论述文动笔阅读法：第一遍圈中心论点与分论点（常在段首尾），标论据句，第二遍理句间关系。圈点让骨架现形，做题定位又快又准。","tip":"阅读时用笔圈论点句、划论据句，动笔比动眼有效。","example":"阅读《乡土中国》，圈出“差序格局”的界定句，再标“像石子入水”的比喻论据，结构立现。"},"2|1|k|4":{"explain":"三种推理各具方向：归纳从个别到一般，演绎从一般到个别，类比由相似到相似。论述文中：举例论证是归纳，引用原理分析是演绎，比喻论证近于类比。","example":"由张骞、玄奘、郑和皆开拓者，归纳出交流促进文明的结论。","tip":"推理题看方向：例到理是归纳，理到例是演绎。"},"2|1|k|5":{"explain":"概念有内涵（本质属性）与外延（所指范围）两维。逻辑错误常发生在偷换概念：字面相同而内涵外延被暗中改变。阅读留意同一词在不同句中的含义。","example":"“公平”在“机会公平”与“结果公平”中内涵不同，混用即偷换。","tip":"概念题先界定内涵再查外延，两维符合才算一致。"},"2|1|d|0":{"explain":"思路题是把段意连成文脉：先逐段概括大意，再判断段间关系（总分、并列、递进、对比），最后用“先……再……最后……”连缀。写论证过程，不是复述内容。","tip":"思路题用连接词串段意，末句点明论证方法。","example":"先概括“礼治社会”段意，再连缀成“先提出概念，再从礼俗、教化两层论证”的思路表述。"},"2|1|d|1":{"explain":"因果成立须满足“先后＋必然联系”：先有因后有果，且因确实导致果。强加因果是仅有先后或相关就断言因果。判断问“真的是它导致的吗”。","example":"“他迟到了，所以考砸了”中迟到与考砸无必然联系。","tip":"因果题先验“先后”，再验“必然”，缺一即强加。"},"2|1|d|2":{"explain":"推理分析不能靠感觉，要靠规则：归纳看样本是否典型充分，演绎看前提是否真实、推理是否合式，类比看相似点是否本质相关。考前系统梳理规则。","tip":"推理题套“样本、前提、相似性”三把尺子检验。","example":"归纳推理先查样本是否典型充分，如仅举一例便断言普遍规律，即犯样本不足的谬误。"},"2|1|e|0":{"explain":"论述文选择题围绕论证三要素设题：论证方法、论证思路、论据作用。错误常是方法误判、思路错位、论据错配，逐项回文定位核对。","tip":"选择题先定位选项对应原文段，再核对三要素。"},"2|1|e|1":{"explain":"两大高频设错：程度失当（原文可能变选项必然）与范围扩大（局部变整体）。应对：比对时圈出程度副词与范围词，与原文逐一对照，凡升级必错。","example":"原文“有助于”被偷换成“一定能”，程度失当即错。","tip":"看到“必然、一定、所有”等绝对词，回原文找限定。"},"2|1|e|2":{"explain":"论证特点三角度：结构特点（总分、递进、对比）、论证方法（举例、对比、引用）、语言特点（严密、准确、形象）。分点作答，各配文本依据。","tip":"论证特点题按“结构＋方法＋语言”分点，各配依据。"},"2|1|e|3":{"explain":"迁移题是“借观点、析新例”：先明确文中核心观点，再把观点套到新材料新问题，用“观点＋材料印证＋结论”结构作答。关键是观点提取准确。","tip":"迁移题先摘观点句，再对新例逐条对应。"},"2|2|k|0":{"explain":"魔幻现实主义“魔幻的外衣，现实的骨肉”：把神话、荒诞元素织入真实生活，用夸张变形揭示现实本质。魔幻细节往往有象征义，剥开外壳即见现实内核。","example":"《百年孤独》中马孔多下四年大雨，以极端意象写灾难与衰落。","tip":"解读魔幻细节先问“它象征什么”，勿当真实情节。"},"2|2|k|1":{"explain":"全知视角是上帝视角，知晓一切，便于全景展开与评点；限知视角借某人物之眼叙事，增强真实感、悬念与代入感。效果题先判视角类型再谈效果。","example":"《祝福》以“我”的所见所闻展开，是限知视角，增强悲剧现场感。","tip":"视角题必答“类型＋效果”，限知常答真实感代入感。"},"2|2|k|2":{"explain":"圆形人物性格复杂、有发展变化；扁平人物性格单一、特征突出。区分看是否有性格变化与内心矛盾。圆形答性格轨迹，扁平答特征与象征。","example":"阿Q是圆形人物，假洋鬼子近扁平人物。","tip":"人物题先判圆扁，圆形答变化轨迹，扁平答特征。"},"2|2|k|3":{"explain":"学术随笔是学者的随笔：观点鲜明、论证严谨，笔调比论文轻松。阅读抓核心观点（常在首尾段），辨材料类型，看观点与材料的对应关系。","tip":"学术随笔阅读先标观点句，再标支撑句。","example":"学术随笔谈人工智能，先亮“工具理性须受价值约束”的观点，再举算法偏见的实例支撑。"},"2|2|k|4":{"explain":"反复出现的物象往往承载象征义：大海象征人生战场与命运，大鱼象征理想尊严。解读三步：找重复物象，析其特征，连主题谈象征。象征义须结合全篇主题确定。","example":"桑地亚哥与大鱼搏斗的意象，象征人类与命运的抗争。","tip":"象征题先定主题再定象征义，勿乱贴标签。"},"2|2|k|5":{"explain":"外国作品承载异域价值观，阅读要求同存异：尊重文化差异，同时寻找人类共通主题（爱与牺牲、成长与尊严）。答题既谈文化特色，也谈普世价值。","tip":"跨文化题分两层：文化差异＋人类共通。","example":"读《老人与海》，既见西方个人奋斗的价值取向，也见人类共通的尊严、坚韧等普世主题。"},"2|2|d|0":{"explain":"魔幻现实主义难在亦真亦幻：写实处是现实，荒诞处是象征。解读路径：先把荒诞情节翻译成现实问题，再找象征义，最后统一到主题。以象征为桥，魔幻与现实自通。","example":"《百年孤独》的失眠症蔓延，象征外来文明对传统记忆的侵蚀。","tip":"解读魔幻文本先问“荒诞背后指什么现实”。"},"2|2|d|1":{"explain":"叙事分析要具体化：视角题答“谁在看＋看到什么＋效果”，节奏题答“详略疏密＋作用”（详写造悬念，略写推进情节）。落到具体文本处加具体效果上。","example":"《祝福》详写祥林嫂三次到鲁镇，略写中间遭遇，详略间见命运沉浮。","tip":"叙事分析必引文本具体位置，忌空谈套话。"},"2|2|d|2":{"explain":"学术随笔信息密度高，阅读要抓主干：先读首尾段与段首句锁定核心观点，跳读支撑性举例，遇到密集概念只抓其功能。用“观点树”笔记整理。","tip":"读学术随笔先看首尾段，用一句话概括观点。","example":"读《乡土中国》先抓首段“差序格局”的核心观点句，再理后续举例与展开，主干立现。"},"2|2|e|0":{"explain":"视角作用题答题链：判断视角类型，指出叙述者身份位置，分析效果（真实感、代入感、悬念、情感距离）。以“我”为视角增强真实感，也便于抒情与设悬。","example":"《祝福》中“我”的所见所闻让祥林嫂之死更真切。","tip":"“我”的视角必答“真实感＋情感距离”两层。"},"2|2|e|1":{"explain":"物象题双线作答：内容线答象征义与情感承载，结构线答线索作用（贯穿全文、串联情节、照应标题）。两条线都答全即满分。","example":"《白杨礼赞》的白杨既是精神符号，也是贯穿全文的线索。","tip":"物象题先答象征义再答结构作用。"},"2|2|e|2":{"explain":"观点提取关键在区分主从：观点句是判断性陈述（含应、必须、可见），支撑句是例证解释。先删支撑留观点，再把分散观点整合成连贯文段。","tip":"提取观点先划掉举例引文，只留判断句再连缀。"},"2|2|e|3":{"explain":"中西比较题考查思辨：先分别概括两种文化的特质，再统一角度比较异同，最后谈互补与启示。答题结构“各自特点—比较异同—启示评价”。","tip":"比较题统一比较角度，双方都要概括。"},"2|3|k|0":{"explain":"诸子散文三种体式：语录体（论语）短章记录言简意赅，对话体（孟子）问答论辩气势充沛，寓言体（庄子）以故事说理想象奇崛。看体式定阅读策略。","example":"“三人行必有我师”是语录体，“庖丁解牛”是寓言体。","tip":"体式判断题看行文：短句记录是语录，故事说理是寓言。"},"2|3|k|1":{"explain":"《屈原列传》以“志洁行廉”为核心：才华出众却遭谗被疏，见疏而作《离骚》，被放逐而沉江。太史公既赞“虽与日月争光可也”，又寓感慨于叙事。读时区分史实与议论。","example":"“信而见疑，忠而被谤”八字概括屈原命运。","tip":"分析《屈原列传》要区分叙事与“太史公曰”的议论。"},"2|3|k|2":{"explain":"这些实词一词多义且高频：闻（听说闻名）、迁（迁移升迁贬谪）、伐（攻打夸耀）、疏（疏通疏远奏疏）、间（间隔离间暗中）。记本义推引申，列义项配例句。","example":"“谗谄之蔽明也”中“蔽”是蒙蔽。","tip":"实词复习用“一词一表”，本义居首按逻辑排引申。"},"2|3|k|3":{"explain":"被动句四大标志：见、于、为、被；无标志被动靠语境判断（主语是受事者）。识别两步：找标志词，无标志则看主语是施事还是受事。","example":"“为天下笑”是“为”字被动，“函谷举”中“举”为无标志被动。","tip":"无标志被动最易漏，主语是受事者就译成被动。"},"2|3|k|4":{"explain":"儒道互补是传统文化重要结构：儒家进取入世，道家超脱自然。二者互补：得意时儒家济世，失意时道家自处。当代价值：儒给担当，道给豁达。","example":"苏轼“达则兼济，穷则独善”正是儒道互补的人格写照。","tip":"谈儒道价值用“互补”框架：进取与超脱并说。"},"2|3|k|5":{"explain":"史传文阅读四步：划时间词理经历线，抓典型事件看品质，看作者评价词把握褒贬，连缀事件概括形象。时间线是骨架，品质是血肉，褒贬是态度。","example":"《屈原列传》按“任—疏—放—沉”时间线写屈原一生。","tip":"史传阅读先划时间词排经历，再概括品质看评价。"},"2|3|d|0":{"explain":"庄子思想玄奥，常以寓言显理：庖丁解牛“以无厚入有间”喻顺应规律、游刃有余。读寓言三步：明故事、悟寓意、连思想。","example":"庖丁“依乎天理”解牛，寓意做事须循规律避锋芒。","tip":"寓言题三步答：故事＋寓意＋学派主张。"},"2|3|d|1":{"explain":"被动句难点在无标志：无见于为被而主语实为受事（如“帝感其诚”）。判断技巧：动词及物且主语非施事者，即可能被动，再结合语境验证。","example":"“屈原放逐”中“放逐”是受事，“忠而被谤”有“被”字标志。","tip":"翻译遇“主语＋动词”而主语不能施事，先试译被动。"},"2|3|d|2":{"explain":"史传文中叙事是传，议论是评。辨明立场看三处：篇首序论、篇中夹评、篇末“太史公曰”。这些议论或直接褒贬，或借事寓评，还常含作者自况。","example":"太史公赞屈原“虽与日月争光可也”，立场鲜明。","tip":"评价立场题先找“太史公曰”，再概括褒贬态度。"},"2|3|e|0":{"explain":"史传文是高考文言主角，人物品质概括几乎必考。概括方法：从典型事件提炼品质词（忠勇、清廉、正直），一词一据，用“品质＋事件”配对作答。","tip":"品质概括用“词＋事例”配对，一词一据防空洞。"},"2|3|e|1":{"explain":"“信而见疑，忠而被谤”是经典被动句：见、被皆表被动，应译“诚信却被怀疑，忠诚却被诽谤”。翻译被动句要译出“被”字，勿漏标志。","tip":"翻译被动句务必译出“被”，漏译即失分。"},"2|3|e|2":{"explain":"思想理解题是文本加现实的结合：先概括材料中的思想主张，再谈现实意义（对个人修养、社会发展的启示），最后可作评价。结构“观点—阐释—现实意义”。","tip":"思想题按“主张＋启示”作答，现实意义要具体。"},"2|3|e|3":{"explain":"高考断句多选课外文段，但规律与课内一致：标志词、对称句式、句意验证。迁移能力来自课内熟练：把课内规律迁移到课外，用课内实词义推断课外词义。","tip":"课外断句先套课内规律，再结合语境验证。"},"2|3|e|4":{"explain":"实词题常用课内勾连课外：课外句子中的实词与课内学过的一致。推断方法：代入课内义项试译，结合语境筛选，辅以字形、成语印证。","example":"课外“欲求其政”的“求”，可借课内“求木之长者”的“求”推断。","tip":"实词推断先想课内例句，义项代入通顺者即答案。"},"2|4|k|0":{"explain":"病句六类是判断框架：语序不当、搭配不当、成分残缺赘余、结构混乱、表意不明、不合逻辑。判断逐类排除，先找主干后查枝叶。","example":"“通过这次活动，使我明白了道理”缺主语。","tip":"判病句先压缩主干查搭配，再查枝叶，六类逐项过。"},"2|4|k|1":{"explain":"标志词是病句报警器：两面词（能否、是否）须前后照应，介词开头易致缺主语，关联词查搭配位置，数量短语查修饰矛盾。见标志词即提高警惕。","example":"“能否成功，取决于我们的努力”两面配一面，搭配不当。","tip":"见“能否、是否”先查两面呼应，标志词即考点。"},"2|4|k|2":{"explain":"成语误用三大类：望文生义（按字面理解）、褒贬误用、对象误用。判断先看字源本义，再看色彩与对象。如“不刊之论”实为不可修改的言论。","example":"“七月流火”指天气转凉，非酷暑，望文生义即错。","tip":"成语先想本义出处，再查色彩对象，三关都过。"},"2|4|k|3":{"explain":"衔接四标尺：话题一致、逻辑顺序（时间空间事理）、句式呼应、关联词照应。选项代入后逐项检验，通顺连贯者胜出。","tip":"衔接题先找话题主语，再验逻辑顺序。","example":"“他不仅学习好，而且品德佳”，关联词“不仅……而且”递进搭配、前后呼应，句子才连贯。"},"2|4|k|4":{"explain":"补写是戴镣铐跳舞：内容上衔接上下文语义（总分、因果、转折、举例），形式上与前后句式、标点呼应。做题先定位置（总起、承转、总结），再定内容句式。","example":"前句“读书有三到”，后句补“谓心到、眼到、口到”，总分照应。","tip":"补写先看标点定句式，再看上下文定内容。"},"2|4|k|5":{"explain":"得体是看人下菜碟：用语合场合、合对象、合文体。谦敬辞是考点：自称用谦（家、拙、愚），称他用敬（令、贵、大作）。","example":"请柬宜用“敬请光临”，日常邀请可用“欢迎来玩”。","tip":"得体题先判场合对象文体，再查谦敬辞。"},"2|4|d|0":{"explain":"句式杂糅是两套句式套在一起：如“原因是……造成的”混搭两种说法。识别：压缩主干后看是否一谓多主，或找常见杂糅模板。熟记高频杂糅句式可快速识别。","example":"“他的成功是由于努力造成的”杂糅，改为“是由于努力”或“是努力造成的”。","tip":"见“原因、由于、造成”组合出现，警惕句式杂糅。"},"2|4|d|1":{"explain":"多层定语排列有规律：领属＋时间处所＋数量＋性状＋性质；多层状语大致：时间＋处所＋方式＋对象。按从大到小、从旧到新排序。","example":"“我们学校的一位有三十年教龄的语文老师”语序正确。","tip":"定语排序口诀“领时数性”，代入检验。"},"2|4|d|2":{"explain":"近义成语差在一字：不孚众望（不能使人信服）与不负众望（不辜负期望），一贬一褒。辨析方法：拆字解义，查对象与色彩，放入语境验证。","example":"“他不负众望，夺冠而归”用“负”（辜负）。","tip":"近义成语拆字辨析，先解关键字义再查色彩对象。"},"2|4|e|0":{"explain":"病句题年年必考，备考要例句支撑：每类语病记两三个典型例句，考试对照识别。修改题遵循最小改动：改语病不改原意，能调语序不换词语。","tip":"修改病句坚持最小改动，改完再读一遍。"},"2|4|e|1":{"explain":"成语题必须语境优先：同一成语在不同语境可能有不同色彩，判断结合句子褒贬。高频陷阱是对象误用与色彩误用。做题先解本义，再对语境。","tip":"成语题先看句子褒贬色彩，再核对象，双重验证。"},"2|4|e|2":{"explain":"补写句得分标准是严丝合缝：内容与上下文语义连贯，句式与标点呼应，字数与位置相称。先定句位功能，再搜上下文关键词，最后仿句式成句。","tip":"补写完成代入原文通读两遍，衔接不畅立即修改。"},"2|4|e|3":{"explain":"语段综合题把病句、成语、衔接放同一语段：考查真实语境运用。应对：先通读语段把握大意，再逐题定位（成语看语境、病句找标志、衔接验逻辑）。","tip":"综合题先通读全段再逐题做，勿孤立看单句。"},"2|4|e|4":{"explain":"标点作用题考语境义：引号可表引用、特殊含义、反语、强调；破折号表解释、话题转换、声音延长；省略号表列举省略、语意未尽。判断看语境。","example":"“他是个‘聪明人’”中引号表反语，讽刺其自作聪明。","tip":"标点题先想该标点的所有作用，再结合语境选。"},"3|0|k|0":{"explain":"论述文快读三步动笔法：标论点（中心与分论点常在首尾）、圈论据（事例引文数据）、理结构（段间关系）。动笔让观点与材料关系显形，做题定位快比对准。","tip":"考场阅读必动笔，标论点圈论据。","example":"快速读完一段，先圈段首的论点句，再标“例如”“可见”后的论据句，论证结构图即现。"},"3|0|k|1":{"explain":"三大设错类型：偷换曲解（改词换意）、逻辑关系错（因果条件颠倒）、过度推断（推过头）。识别靠比对加追问：选项与原文逐词比对，追问“原文说了吗、推得对吗”。","tip":"比对重点盯概念词、因果词、程度词。","example":"原文只说“读书有益”，选项却称“读书必能成就大事业”，由或然变必然，即过度推断。"},"3|0|k|2":{"explain":"论证分析三要素：结构严密（层次清晰）、方法得当（论证方法服务论点）、语言严密（限定词准确）。答题从三要素切入，结合文本具体说明。","tip":"论证严密性常体现在限定词，可引原文限定词佐证。","example":"论证分析可答：本文采用总分结构，运用举例与引用论证，语言多用“可能”等限定词显严密。"},"3|0|k|3":{"explain":"论述文是论点树：中心论点是树干，分论点是枝，论据是叶。把握层级先找中心论点（常开头或结尾），再梳分论点及其从属关系（并列还是递进）。","tip":"把握论点关系先定位中心论点，再列分论点清单。","example":"《师说》的中心论点是“古之学者必有师”，三个分论点并列支撑中心，层级关系一目了然。"},"3|0|k|4":{"explain":"比对是论述文解题核武器：选项与原文逐词对照，重点盯限定词——可能往往（或然）与一定必然（必然）、部分与全部。凡选项把限定升级或删除即为设错。","example":"原文“可能有益”被说成“必然有益”，程度失当即错。","tip":"比对时圈出绝对词（必、全、唯一），回原文查限定。"},"3|0|d|0":{"explain":"界限在有根据：合理推断是原文信息合乎逻辑的延伸，无中生有是原文毫无依据的编造。判断问“原文哪里支持它”，有推理链条是合理推断，找不到即无中生有。","example":"原文说A有利于B，推出应推广A是合理推断；推出A是唯一办法则过度。","tip":"推断题先找原文依据，再验逻辑链。"},"3|0|d|1":{"explain":"强加因果是无因说因，因果倒置是因果互换。区分靠理逻辑链：先确定原文的因果方向，再看选项是颠倒还是虚构。","example":"“因为他写作勤奋，所以喜欢读书”颠倒了“喜欢读书是因”的方向。","tip":"因果题先定原文因果方向，再查选项颠倒还是虚构。"},"3|0|d|2":{"explain":"选项常把原文长句压缩成概括句，比对要双向转换：把原文长句压缩主干与选项对照，把选项概括句还原展开看是否与原意相符。主语谓语限定词逐一对应。","tip":"比对先压缩原文主干，再还原选项，双向对照。","example":"原文长句“通过改进工艺，我们提高了效率”，选项压缩为“改进工艺提高效率”，比对主干一致方为正确。"},"3|0|e|0":{"explain":"论述文前三题有固定分工：第1题概念理解（定位概念句比对）、第2题论证分析（方法思路论据）、第3题推断正误（合理推断判断）。按题型备好套路。","tip":"按题号分工作答：一题比对概念，二题查论证，三题验推断。"},"3|0|e|1":{"explain":"高频陷阱集中在“度”上：范围扩大（局部变整体）、程度加深（可能变必然）。识别看副词：选项出现“所有、全部、必然、彻底、唯一”时回原文查范围程度。","tip":"见绝对化副词立即回原文核对范围与程度。"},"3|0|e|2":{"explain":"新考法把思路概括与特色分析合并：先概述论证过程（先……再……最后……），再点论证特色（结构、方法、语言选一深入）。答题两段式。","tip":"新题型先概括过程后析特色，两问分开答。"},"3|0|e|3":{"explain":"高考论述文常以课内整本书（《乡土中国》）为材料，考查课内知识迁移。备考熟悉核心概念（差序格局、礼治社会），遇相关材料快速调用概念分析。","tip":"考前梳理《乡土中国》核心概念，材料出现直接迁移。"},"3|1|k|0":{"explain":"实用文本各具特征：新闻重时效真实（倒金字塔），报告重数据结论（图表多），科普文重通俗准确，访谈重问答交锋。读前先辨体裁，阅读策略随之调整。","ti
