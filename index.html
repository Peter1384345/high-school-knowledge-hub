道物体不是卫星，不能用万有引力等于向心力，用a=ω^2r。"},"1|2|d|4":{"explain":"万有引力与重力区分：万有引力分解为重力与随地球自转的向心力，赤道处向心力最大、重力最小，两极向心力为零、重力最大，所以g随纬度升高而增大。","example":"例：同一物体在赤道比在两极稍轻，因为赤道处随地球自转的向心力最大、重力最小，自转越快差别越大。","tip":"赤道g最小、两极g最大，g随纬度升高而增大。"},"1|2|e|0":{"explain":"天体运动每年必考，常以卫星变轨、空间站对接为情境出选择。抓住万有引力提供向心力这一核心，比较各量大小。","tip":"高轨低速长周期，变轨看点火方向。"},"1|2|e|1":{"explain":"估算天体质量、密度用环绕法M=4π^2r^3/GT^2或黄金代换M=gR^2/G，注意单位与数量级计算。","tip":"环绕法求M，黄金代换求g或M，注意R与r。"},"1|2|e|2":{"explain":"比较不同轨道卫星的v、ω、a、T大小，用万有引力提供向心力推导：r越大v、ω、a越小、T越大，即高轨低速长周期。","tip":"高轨低速长周期，加速度与轨道半径平方成反比。"},"1|2|e|3":{"explain":"双星、三星系统作为新情境题考查，核心仍是万有引力提供向心力，注意多星系统每颗星受多个引力，合力指向圆心。","tip":"多星系统合力是各引力矢量和，各星周期相同。"},"1|2|e|4":{"explain":"易错点：近地卫星与赤道物体混淆、变轨中速度与加速度判断错误。赤道物体不满足环绕公式，变轨点火瞬间速度突变但向心加速度不变。","tip":"赤道物体与卫星分开处理，变轨点火处a不变。"},"1|3|k|0":{"explain":"功W=Fxcosθ，θ是力与位移的夹角，是恒力做功公式；功是标量有正负，正功表示动力、负功表示阻力，力与位移垂直时做功为零。变力做功用动能定理或图像面积。","example":"例：力10N与位移5m夹角60度，W=10×5×cos60度=25J；力与位移垂直时做功为零。","tip":"力与位移垂直不做功；变力做功不能直接用W=Fx。"},"1|3|k|1":{"explain":"功率P=W/t=Fv，F与v同向时P=Fv。机车启动：恒定功率启动做加速度减小的变加速，恒定加速度启动先匀加速、P增大到额定功率后变加速，最终匀速。","example":"例：汽车额定功率60kW、阻力恒定，v=20m/s时牵引力F=P/v=3000N。","tip":"P=Fv中v是沿力方向的速度；匀加速阶段P不断增大。"},"1|3|k|2":{"explain":"动能Ek=mv^2/2，动能定理W合=ΔEk=mv2^2/2-mv1^2/2：合外力做功等于动能变化。适用于变力、曲线、多过程问题，是力学大题的常用方法。","example":"例：物体沿粗糙斜面滑下，重力做正功、摩擦力做负功，W合=ΔEk可直接求末速度，免去求加速度。","tip":"W合是合外力做的总功，等于所有力做功的代数和。"},"1|3|k|3":{"explain":"重力势能Ep=mgh与参考面选取有关，是相对量；重力做功等于重力势能的减少量：WG=Ep1-Ep2，与路径无关，只由起末位置的高度差决定。","example":"例：物体从10m高处降到2m（g=10），重力做功mg×8，重力势能减少mg×8，与走什么路径无关。","tip":"重力做正功势能减少，减少量等于重力做功。"},"1|3|k|4":{"explain":"机械能守恒条件：只有重力或弹簧弹力做功。表达式Ep1+Ek1=Ep2+Ek2。有摩擦力、其他力做功时机械能不守恒，改用动能定理或功能关系。","example":"例：物体自由下落或沿光滑斜面下滑，只有重力做功，机械能守恒；沿粗糙斜面下滑机械能减少。","tip":"先判断是否只有重力弹力做功，再决定能否用机械能守恒。"},"1|3|k|5":{"explain":"功能关系：合外力做功等于动能变化（ΔEk），除重力弹力外其他力做功等于机械能变化（ΔE），重力做功等于负的势能变化。能量转化与做功一一对应。","example":"例：物体沿粗糙斜面下滑，克服摩擦力做的功等于机械能的减少量，这个值等于摩擦生热，可用于能量守恒列式。","tip":"克服阻力做功等于机械能减少，这个关系常用来求摩擦生热。"},"1|3|k|6":{"explain":"弹性势能Ep=kx^2/2与形变量的平方成正比，弹簧被压缩或拉伸相同量时势能相同。常与动能、重力势能综合，弹性势能最大时往往速度为零或两物体相对静止。","example":"例：弹簧压缩5cm的弹性势能是压缩1cm的25倍，因为Ep与x^2成正比，压缩与拉伸相同形变量时势能相同。","tip":"Ep与x^2成正比，压缩拉伸相同形变量势能相同。"},"1|3|d|0":{"explain":"机车启动两类问题图像复杂：恒定功率启动P不变、F=P/v减小、a减小，v-t图斜率减小；恒定加速度启动先匀加速后变加速，两阶段分界是达到额定功率。","example":"例：恒定功率启动，P=60kW、阻力2000N，最大速度v=P/f=30m/s。","tip":"最大速度时P=f阻v，匀加速阶段结束时达到额定功率。"},"1|3|d|1":{"explain":"变力做功不能用W=Fx，可用三种方法：动能定理（最常用）、F-x图像面积、平均功率乘时间（力随位移线性变化时）。摩擦力做功要算路程。","example":"例：弹簧弹力做功用平均力kx/2乘形变量x得kx^2/2，或用F-x图像三角形面积。","tip":"变力做功首选动能定理，图像面积法看F-x图。"},"1|3|d|2":{"explain":"机械能守恒判定：绳拉力、摩擦力做功时机械能不守恒。注意绳拉力若始终与速度垂直不做功（如圆周运动）则仍守恒，摩擦力做功必不守恒。判定看有哪些力做功。","example":"例：沿光滑曲面下滑机械能守恒，沿粗糙曲面因摩擦力做功不守恒；圆周运动中绳拉力始终垂直速度不做功，机械能仍守恒。","tip":"看做功的力而不只看受力：只有重力或弹力做功才守恒。"},"1|3|d|3":{"explain":"多物体系统机械能守恒需注意速度关系与能量分配：绳轮系统两端物体速度大小相同，能量在物体间转移，对系统列守恒方程，不必分析每个力做功。","example":"例：定滑轮两端挂两物体，系统机械能守恒，两物体速度大小相等，列势能减少等于动能增加。","tip":"先找速度关系（绳连接速度相等），再对系统列守恒方程。"},"1|3|d|4":{"explain":"弹簧类问题：弹性势能最大时弹簧形变量最大，往往两物体速度相等（如碰撞压缩过程）；全过程用能量守恒，注意弹性势能与动能、重力势能的相互转化。","example":"例：物块压缩弹簧到最短时速度为零，弹性势能最大，等于初动能减去克服阻力做的功，这是弹簧类题目的关键状态。","tip":"弹簧最短（势能最大）时两物体共速，是解题关键条件。"},"1|3|e|0":{"explain":"动能定理是计算大题常用方法，多过程问题首选：全程列式W合=ΔEk，不必逐段求加速度，变力恒力一视同仁。","tip":"多过程全程列动能定理，比逐段运动学更简洁。"},"1|3|e|1":{"explain":"机械能守恒与圆周最高点临界综合，如绳球模型过最高点最小速度根号(gr)：最高点临界条件加机械能守恒可求最低点速度与绳的拉力。","tip":"最高点临界条件加机械能守恒求各点速度。"},"1|3|e|2":{"explain":"机车启动v-t图、P-t图常出选择题：恒定功率启动加速度减小，恒定加速度启动两阶段，图像拐点对应达到额定功率的时刻。","tip":"图像拐点即额定功率时刻，之后匀加速转变加速。"},"1|3|e|3":{"explain":"验证机械能守恒实验用重锤下落纸带测速度，验证mgh与mv^2/2的关系，注意先接通电源再释放纸带，误差来自空气阻力与打点摩擦。","tip":"先通电再放纸带，v用中间时刻法求，误差分析写阻力。"},"1|3|e|4":{"explain":"易错点：机械能守恒条件判断错误、参考面选取不当。参考面选好后全程一致，势能差与参考面选取无关。","tip":"参考面先选好，比较的是势能变化量，与参考面选取无关。"},"2|0|k|0":{"explain":"库仑定律F=kq1q2/r^2，k=9×10^9N·m^2/C^2，适用于点电荷，力的方向在两电荷连线上：同种电荷排斥、异种电荷吸引。与万有引力公式形式类似。","example":"例：q1=q2=1C相距1m，F=9×10^9N，非常巨大，所以库仑定律要求点电荷理想化条件。","tip":"只适用于点电荷，r是电荷间距；不能视为点电荷时不可用。"},"2|0|k|1":{"explain":"电场强度E=F/q是定义式，适用于任何电场，是矢量，方向为正电荷受力方向；点电荷场强E=kQ/r^2是决定式；匀强电场E=U/d。场强由电场本身决定，与试探电荷无关。","example":"例：q=2C试探电荷受电场力10N，E=5N/C；距场源电荷r处E=kQ/r^2。","tip":"E与试探电荷q无关，定义式与决定式要区分开。"},"2|0|k|2":{"explain":"电场线从正电荷出发到负电荷（或无穷远）终止，疏密表示强弱、切线方向表示场强方向，不闭合、不相交。匀强电场的电场线平行且等距。","example":"例：正点电荷的电场线从电荷向外辐射，越靠近电荷越密、场强越大；负点电荷电场线指向电荷，同样越近越密。","tip":"电场线是假想线，疏密表示强弱，不相交不闭合。"},"2|0|k|3":{"explain":"电势φ=Ep/q是标量，沿电场线方向电势降低，等势面与电场线垂直，沿等势面移动电荷电场力不做功。电势高低与场强大小没有必然关系。","example":"例：正点电荷电场中，离电荷越远电势越低；匀强电场沿电场线方向电势均匀降低，等势面与电场线处处垂直。","tip":"沿电场线电势降低，等势面与电场线垂直。"},"2|0|k|4":{"explain":"电势差Uab=φa-φb=Wab/q，电场力做功W=qU与路径无关，只由起末位置决定。W大于0表示电场力做正功、电势能减少。","example":"例：q=2C从a移到b，Uab=5V，W=qU=10J，电场力做正功，电势能减少10J。","tip":"W=qU中q、U都带符号，正电荷沿电场线移动电场力做正功。"},"2|0|k|5":{"explain":"电容器C=Q/U是定义式，平行板电容C=εS/4πkd是决定式。动态分析分两类：断开电源Q不变，接电源U不变，再用E=U/d判断场强变化。","example":"例：平行板电容器接电源，d增大时U不变、C减小、Q减小、E=U/d减小；若断开电源则Q不变、E不变。","tip":"先判Q不变还是U不变，再一步步推C、Q、E。"},"2|0|k|6":{"explain":"带电粒子加速用qU=mv^2/2（动能定理），偏转是类平抛：水平v0匀速，竖直a=qE/m=qU'/(md)匀加速，侧移y=qU'L^2/2mdv0^2。","example":"例：电子经电压U加速后垂直进入偏转电场（U'、d、L已知），按类平抛分解求侧移与偏转角。","tip":"加速用qU，偏转是类平抛，先求vy再求偏转角。"},"2|0|d|0":{"explain":"场强与电势关系易混：E大处φ不一定高（如负电荷附近E大但φ低），φ=0处E不一定为0（如等量异种电荷连线中点φ=0但E最大）。用电场线判断。","example":"例：等量异种电荷连线中点电势为零（取无穷远为零势）但场强不为零，说明电势为零处场强不一定为零，两者无必然关系。","tip":"场强看电场线疏密，电势沿电场线降低，两者别混。"},"2|0|d|1":{"explain":"电场力做功与电势能变化：W=Ep1-Ep2，电场力做正功电势能减少、做负功增加。正电荷在高电势处电势能大，负电荷相反，计算时电荷与电势差都带符号。","example":"例：负电荷沿电场线移动，电场力做负功、电势能增加；正电荷沿电场线移动则电势能减少，判断时先看电荷正负。","tip":"负电荷在高电势处电势能小，判断电势能先看电荷正负。"},"2|0|d|2":{"explain":"带电粒子偏转是类平抛：水平L=v0t，竖直vy=at，a=qU/md，偏转角tanθ=vy/v0。侧移与偏转角公式易混淆，注意与U、v0、L、d的依赖关系。","example":"例：粒子以v0垂直进入偏转电场，出射时tanθ=qUL/mdv0^2，侧移y=qUL^2/2mdv0^2，两式对照记忆。","tip":"侧移y正比于U、L^2，偏转角tanθ正比于U、L，对照记忆。"},"2|0|d|3":{"explain":"电容器动态分析关键是分清Q不变还是U不变：断开电源Q不变（d变化时E不变），接电源U不变（d变化时E变化）。综合C=εS/4πkd与E=U/d判断。","example":"例：断开电源后插入介质，C增大、Q不变、U=Q/C减小、E减小；若接电源则U不变、Q增大。","tip":"断开电源Q不变、接电源U不变，两类情形分别处理。"},"2|0|d|4":{"explain":"等量同种点电荷连线中点场强为零、电势最高（正电荷）；等量异种点电荷连线中垂线上场强最大在中点、中垂线是等势面（电势处处为零）。","example":"例：等量异种电荷连线中垂线上各点电势均为零，中点处场强最大；等量同种电荷连线中点场强为零、电势最高。","tip":"同种中点场强零、异种中垂线等势面，分布规律记牢。"},"2|0|e|0":{"explain":"场强、电势、电势能概念辨析是选择必考，常给电场线或等势面图：沿电场线电势降低、疏密定场强、正负电荷电势能不同。","tip":"看图先定电场线方向，再判电势与电势能。"},"2|0|e|1":{"explain":"带电粒子在电场中加速加偏转是计算大题高频：加速用qU=mv^2/2，偏转类平抛分解，最后算侧移、偏转角或打在屏上的位置。","tip":"加速求v0、偏转求y和tanθ，分步列式。"},"2|0|e|2":{"explain":"电容器动态变化分析常出选择题：先判断Q不变还是U不变，再按C、Q、E顺序逐步分析，用εS/4πkd与E=U/d两个式子。","tip":"判断Q、U谁不变是关键，按顺序推。"},"2|0|e|3":{"explain":"静电场中能量问题：电场力做功等于电势能变化，结合动能定理W电+W其他=ΔEk处理多力问题。","tip":"电场力做功W=qU，与动能定理结合使用。"},"2|0|e|4":{"explain":"易错点：正负电荷电势能判断反、侧移与偏转角公式混淆。正电荷高电势处势能大，侧移公式与偏转角公式对照记。","tip":"电荷正负影响电势能判断，两个偏转公式分开记。"},"2|1|k|0":{"explain":"欧姆定律I=U/R适用于纯电阻电路（金属导体、电解液），伏安特性曲线中I-U图斜率是1/R、U-I图斜率是R。非线性元件不能直接套用。","example":"例：R=10Ω电阻加20V电压，I=U/R=2A；I-U图斜率0.1即1/R，而U-I图斜率才是R，两图斜率含义不同。","tip":"欧姆定律只适用于纯电阻，I-U图与U-I图斜率含义不同。"},"2|1|k|1":{"explain":"电阻定律R=ρL/S，ρ是电阻率只由材料与温度决定，金属电阻率随温度升高而增大（白炽灯冷态热态电阻不同），半导体随温度升高减小。","example":"例：同材料导线长度加倍电阻加倍、横截面积加倍电阻减半，由R=ρL/S可推：R与L成正比、与S成反比。","tip":"R与L成正比、与S成反比，ρ只由材料和温度决定。"},"2|1|k|2":{"explain":"串联电路电流处处相等，总电阻等于各电阻之和，电压按电阻分配U1/U2=R1/R2，功率也按电阻分配。串联分压：大电阻分大电压。","example":"例：R1=2Ω、R2=6Ω串联在8V电源上，U1=2V、U2=6V，按电阻比分配电压。","tip":"串联分压按电阻比，各电阻电流相同。"},"2|1|k|3":{"explain":"并联电路电压相等，总电阻倒数等于各电阻倒数之和，电流按电阻反比分配I1/I2=R2/R1。并联总电阻比任一支路电阻都小。","example":"例：R1=2Ω、R2=6Ω并联，总电阻R=2×6/(2+6)=1.5Ω，电流比I1:I2=3:1。","tip":"并联总电阻小于任一支路，电流按电阻反比分配。"},"2|1|k|4":{"explain":"电功W=UIt、电功率P=UI适用于任何电路；纯电阻电路P=I^2R=U^2/R，非纯电阻（电动机）只能用P=UI，I^2R只是发热功率。","example":"例：电动机额定220V、2A，输入功率440W，发热功率I^2r，输出机械功率440-I^2r。","tip":"非纯电阻不能用P=U^2/R，只能用P=UI。"},"2|1|k|5":{"explain":"伏安法测电阻：外接法（电压表接在电阻外侧）测小电阻，内接法测大电阻。外接时电压表分流、内接时电流表分压产生系统误差，用R与根号(RVRA)比较判断。","example":"例：待测电阻约5Ω远小于电压表内阻，用外接法（电压表分流影响小）；约5000Ω时用内接法（电流表分压影响小）。","tip":"小电阻外接、大电阻内接，与根号(RVRA)比较判断。"},"2|1|d|0":{"explain":"非纯电阻电路（电动机）：欧姆定律I=U/R不成立，只能用P=UI算输入功率、P热=I^2r算发热功率，机械功率P机=UI-I^2r，且UI大于I^2r。","example":"例：电动机U=220V、I=5A、r=2Ω，输入功率1100W、发热50W、机械功率1050W。","tip":"非纯电阻I不等于U/R，算功率要区分输入、发热、输出三种。"},"2|1|d|1":{"explain":"电路动态分析：先判总电阻变化（某支路电阻增大则总电阻增大、总电流减小），再用串反并同：与变化电阻串联的电表读数同向变化、并联的反向变化。","example":"例：滑动变阻器滑片右移电阻增大，与其串联的电流表读数减小，并联的电压表读数增大。","tip":"先总后分，串反并同快速判断各表读数。"},"2|1|d|2":{"explain":"含容电路：电容器视为断路（稳定时无电流通过），其电压等于所在支路两端的电势差，Q=CU。改变电阻时先分析支路电压变化再判断充放电。","example":"例：电容器与电阻并联，电阻增大时其两端电压增大、Q=CU增大，电容器充电；稳定时电容断路，电压等于并联支路两端电压。","tip":"稳定时电容断路，电压按并联关系找，Q=CU。"},"2|1|d|3":{"explain":"电表改装：电流表串联大电阻成电压表（量程扩大n倍串R=(n-1)Rg），并联小电阻成电流表（量程扩大n倍并R=Rg/(n-1)）。","example":"例：表头Rg=100Ω、Ig=1mA改装成3V电压表，需串联R=3/0.001-100=2900Ω。","tip":"串联分压成电压表、并联分流成电流表，改装公式记牢。"},"2|1|e|0":{"explain":"伏安法测电阻及滑动变阻器分压限流接法选择是实验高频考点：小电阻外接、大电阻内接；要求从零开始调或电压范围大用分压式，节能用限流式。","tip":"分压式从零起调，限流式简单节能，按需选择。"},"2|1|e|1":{"explain":"电路动态变化、含容电路分析常出选择题：动态用串反并同，含容电路先找电容器电压对应的支路。","tip":"含容电路稳定时断路，只看两端电压。"},"2|1|e|2":{"explain":"电功电功率计算特别注意非纯电阻电路：纯电阻三个公式通用，非纯电阻只用P=UI，发热P=I^2r。","tip":"非纯电阻P不等于U^2/R，先判电路类型。"},"2|1|e|3":{"explain":"伏安特性曲线注意U-I图与I-U图区别：I-U图斜率是1/R，U-I图斜率是R，灯泡伏安特性曲线弯曲说明电阻随温度变化。","tip":"先看坐标轴，斜率含义不同，弯曲表示电阻变化。"},"2|1|e|4":{"explain":"易错点：非纯电阻用P=U^2/R、混联电路简化错误。先化简电路再计算，判明纯电阻与非纯电阻。","tip":"混联先化简成串并联，非纯电阻电路分开算三种功率。"},"2|2|k|0":{"explain":"闭合电路欧姆定律I=E/(R+r)，路端电压U=E-Ir=ER/(R+r)：外电阻越大路端电压越大，内阻越小路端电压越稳定。","example":"例：E=6V、r=1Ω，R=2Ω时I=2A、U=4V；R=5Ω时I=1A、U=5V。","tip":"U=E-Ir，外电阻增大路端电压增大。"},"2|2|k|1":{"explain":"外电阻为零时短路，短路电流I短=E/r最大，路端电压为零；外电路断开时I=0、路端电压U=E等于电动势。短路电流很大易烧毁电源。","example":"例：E=6V、r=0.5Ω，短路电流12A，路端电压为零；断路时电流为零、电压表读数6V即电动势。","tip":"断路U=E，短路I=E/r，两种情况别混淆。"},"2|2|k|2":{"explain":"电源功率：总功率P总=EI，输出功率P出=UI，内耗P内=I^2r，满足P总=P出+P内。输出功率随外电阻变化，R=r时输出功率最大。","example":"例：E=6V、I=2A，P总=12W；U=4V时P出=8W、P内=4W，验证P总=P出+P内=12W。","tip":"总功率EI、输出UI、内耗I^2r，三者满足P总=P出+P内。"},"2|2|k|3":{"explain":"输出功率P出=E^2R/(R+r)^2，当R=r时最大，P出max=E^2/4r，此时效率50%。R偏离r越远输出功率越小。","example":"例：E=6V、r=2Ω，R=2Ω时P出max=36/8=4.5W，此时效率50%。","tip":"R=r时输出功率最大，此时效率只有50%。"},"2|2|k|4":{"explain":"电源效率η=P出/P总=U/E=R/(R+r)：外电阻越大效率越高，但R=r时效率仅50%，R越大效率越接近100%（此时输出功率变小）。","example":"例：R=4r时η=4r/5r=80%；R=r时η=50%，说明外电阻越大效率越高，但此时输出功率变小。","tip":"效率随R增大而增大，与输出功率最大的条件不同。"},"2|2|k|5":{"explain":"多用电表欧姆挡原理是闭合电路欧姆定律：表内电池、调零电阻与被测电阻串联，中值电阻等于欧姆表内阻，刻度不均匀（右密左疏）。","example":"例：欧姆表中值电阻10Ω表示指针指中央时被测电阻为10Ω，等于欧姆表内阻；欧姆表刻度不均匀，右密左疏。","tip":"欧姆表刻度不均匀，指针中央附近读数较准确。"},"2|2|d|0":{"explain":"输出功率与外电阻的P-R曲线是单峰曲线：R=r时最大，R小于r段随R增大而增大，R大于r段随R增大而减小；同一输出功率对应两个外电阻值。","example":"例：P出=8W对应两个R值，一个小于r一个大于r，由P-R单峰曲线可知输出功率最大时R=r。","tip":"P-R曲线单峰，R=r处最大，同功率两解。"},"2|2|d|1":{"explain":"电源的U-I图是直线，纵截距是电动势E、斜率的绝对值是内阻r；与元件伏安特性图的交点即工作点，两图联立可求工作电流与电压。","example":"例：电源U-I直线与灯泡伏安曲线的交点坐标即灯泡实际工作的电流与电压；直线纵截距是E、斜率绝对值是r。","tip":"电源U-I图截距E、斜率绝对值r，交点即工作点。"},"2|2|d|2":{"explain":"多用电表操作流程：选挡（估测选合适量程）、机械调零（指针校零）、欧姆调零（红黑表笔短接调零），换挡后必须重新欧姆调零，读数乘倍率。","example":"例：测约50Ω电阻选×1挡，红黑表笔短接欧姆调零后测量读数约50，欧姆挡无需估读；换挡后必须重新调零。","tip":"换挡必重新欧姆调零，读数等于示数乘倍率。"},"2|2|d|3":{"explain":"测电源电动势和内阻用U-I图像：纵截距为E、斜率绝对值为r。电压表直接测路端电压时其分流使E、r测量值偏小，误差分析是高频考点。","example":"例：电压表内阻有限产生分流，实测路端电压偏小，图像斜率偏小，r测小于r真、E测小于E真。","tip":"电压表分流使E、r都偏小；电流表外接时分压使r偏大。"},"2|2|e|0":{"explain":"测电源电动势和内阻实验用U-I图像法：图像纵截距E、斜率绝对值r，误差分析注意电压表分流或电流表分压的影响，多组数据减小偶然误差。","tip":"图像法处理数据，误差方向要能分析清楚。"},"2|2|e|1":{"explain":"闭合电路动态分析判断各电表读数变化：先判总电阻，再用串反并同，注意电源内阻的影响。","tip":"先判总电阻变化，再按串反并同判断各电表读数。"},"2|2|e|2":{"explain":"电源功率、效率与R关系图像问题：P出-R单峰曲线、η-R递增曲线，读懂图像信息并计算最大值与效率。","tip":"图像题先看坐标轴，P出最大在R=r处。"},"2|2|e|3":{"explain":"多用电表使用与读数新高考实验题常考：机械调零、欧姆调零、选挡换挡、读数乘倍率，注意黑表笔接内部电池正极。","tip":"欧姆挡黑表笔接电池正极，红黑表笔别接反。"},"2|2|e|4":{"explain":"易错点：U-I图像斜率理解为内阻负值、短路电流计算错误。斜率取绝对值是r，短路电流I=E/r。","tip":"斜率绝对值是r，断路U=E、短路I=E/r。"},"2|3|k|0":{"explain":"动量p=mv、冲量I=Ft都是矢量，方向分别与速度、力相同；动量定理Ft=mv2-mv1：合外力冲量等于动量变化，变力用平均力，适用于任何过程。","example":"例：m=2kg速度从3m/s变为5m/s，Δp=2×(5-3)=4kg·m/s，合外力冲量4N·s。","tip":"动量冲量都是矢量，先定正方向再算变化量。"},"2|3|k|1":{"explain":"动量守恒条件：系统合外力为零，或内力远大于外力（碰撞、爆炸、子弹打木块）。系统动量守恒指总动量不变，与机械能是否守恒无关。","example":"例：两球碰撞瞬间内力远大于外力（如摩擦力），系统近似动量守恒，与碰撞中机械能是否损失无关。","tip":"合外力为零或内力远大于外力才守恒，与机械能守恒相互独立。"},"2|3|k|2":{"explain":"动量守恒式m1v1+m2v2=m1v1'+m2v2'是矢量式，先规定正方向，各速度带符号代入，未知速度先假设正方向求解再判断实际方向。","example":"例：m1=2kg以5m/s撞静止的m2=3kg并粘在一起，2×5=(2+3)v，v=2m/s。","tip":"先定正方向，速度带符号，未知量先设正方向。"},"2|3|k|3":{"explain":"弹性碰撞动量与动能均守恒，m2静止时碰后v1'=(m1-m2)v1/(m1+m2)、v2'=2m1v1/(m1+m2)。质量相等时两球交换速度。","example":"例：m1=m2弹性碰撞，碰后交换速度：v1'=0、v2'=v1；质量不等时用v1'=(m1-m2)v1/(m1+m2)计算。","tip":"弹性碰撞双守恒，等质量交换速度是速记结论。"},"2|3|k|4":{"explain":"完全非弹性碰撞碰后速度相同，动能损失最大：ΔE=m1m2(v1-v2)^2/2(m1+m2)。碰撞后粘在一起是典型例子。","example":"例：m1=1kg以4m/s撞静止的m2=1kg并粘在一起，碰后v=2m/s，动能损失4J。","tip":"完全非弹性碰撞共速且动能损失最大，公式记熟。"},"2|3|k|5":{"explain":"反冲与人船模型动量守恒：人船系统水平方向动量守恒，m1s1=m2s2，位移与质量成反比，且s1+s2等于相对位移（船长）。","example":"例：人50kg、船150kg、船长4m，人从船头走到船尾，船后退1m、人相对岸前进3m。","tip":"人船位移与质量成反比，s人+s船=相对位移。"},"2|3|d|0":{"explain":"守恒条件判断看系统合外力：子弹打木块、绳突然绷紧、爆炸等内力远大于外力时近似守恒；系统受摩擦力但合外力为零时仍严格守恒。","example":"例：光滑水平面上两滑块碰撞，系统合外力为零动量守恒，虽然碰撞中机械能有损失；粗糙面上若合外力仍为零，动量也守恒。","tip":"看合外力不看单个力，内力不影响系统总动量。"},"2|3|d|1":{"explain":"碰撞可能性三条件：动量守恒、碰后总动能不大于碰前（动能不增）、速度分配合理（后面的不能越过前面的）。用于检验计算结果是否合理。","example":"例：验算碰撞题答案：动量守恒、碰后动能不大于碰前、速度分配合理，若碰后动能大于碰前则说明计算错误。","tip":"验算三条件：动量守恒、动能不增、速度次序合理。"},"2|3|d|2":{"explain":"人船模型位移关系m1s1=m2s2由动量守恒两边乘时间得到，s1+s2等于相对位移，用于求位移，注意系统初动量为零。","example":"例：气球载人问题同人船模型，m1s1=m2s2可求气球上升高度；系统初动量为零，位移比等于质量反比。","tip":"人船模型初动量为零，位移比等于质量反比。"},"2|3|d|3":{"explain":"动量与能量综合：弹簧连接体、板块系统，动量守恒求共速速度，能量守恒求摩擦生热Q=fΔs相对，两者结合是压轴题的核心套路。","example":"例：子弹射入木块后共速，动量守恒求共同速度v，能量守恒求产生的热量，两式联立是动量能量综合题的套路。","tip":"动量守恒求速度、能量守恒求热量，两式联立。"},"2|3|e|0":{"explain":"动量守恒与能量综合是计算压轴高频：子弹打木块、板块、碰撞模型，列动量守恒加能量守恒两式，注意共速条件。","tip":"先列动量守恒，再列能量关系求热量。"},"2|3|e|1":{"explain":"碰撞中动量守恒与动能关系判断碰撞类型：弹性碰撞动能守恒，完全非弹性碰撞动能损失最大，一般碰撞动能减少但不少于完全非弹性。","tip":"动能守恒是弹性，共速是完全非弹性。"},"2|3|e|2":{"explain":"验证动量守恒实验（斜槽小球碰撞）：入射球每次从同一高度释放保证初速相同，用水平射程代替速度，验证m1OP=m1OM+m2ON，注意落点确定。","tip":"水平射程正比于速度，同一高度释放保证v0相同。"},"2|3|e|3":{"explain":"动量定理求变力冲量、流体冲击力问题：Ft=Δp，对流体先取Δt时间内通过的质量，再列动量定理，注意正方向。","tip":"流体问题取时间Δt分析质量，再用动量定理。"},"2|3|e|4":{"explain":"易错点：动量矢量忘记定正方向、碰后速度不合理未验证。先定正方向带符号，算完用三条件检验。","tip":"定正方向、带符号、验三条件，一步不能少。"},"2|4|k|0":{"explain":"简谐运动回复力F=-kx，与位移成正比且方向相反，x-t图像为正弦曲线。振幅、周期、频率描述振动特征，平衡位置速度最大、加速度为零。","example":"例：弹簧振子从平衡位置向极端位置运动，位移增大回复力增大、加速度增大、速度减小。","tip":"回复力指向平衡位置，平衡位置a=0、v最大。"},"2|4|k|1":{"explain":"单摆周期T=2π根号(L/g)，与质量、振幅无关（小角度条件），秒摆周期2s、摆长约1m。测重力加速度实验用g=4π^2L/T^2。","example":"例：L=1m时T=2π根号(1/10)约2s，即秒摆；单摆周期与质量、振幅无关，只由L和g决定。","tip":"单摆周期与质量振幅无关，只由L和g决定。"},"2|4|k|2":{"explain":"弹簧振子周期T=2π根号(m/k)，由系统本身决定，与振幅无关（等时性）。振幅增大时速度增大但周期不变。","example":"例：弹簧振子m=1kg、k=100N/m，T=2π根号0.01=0.63s，改变振幅周期不变。","tip":"弹簧振子周期看m和k，与振幅无关。"},"2|4|k|3":{"explain":"受迫振动频率等于驱动力频率，与固有频率无关；驱动力频率等于固有频率时振幅最大，发生共振。共振可应用（共振筛）也可危害（桥梁）。","example":"例：队伍过桥踏步频率接近桥的固有频率会引起共振，故改为便步走；共振时受迫振动振幅最大。","tip":"受迫振动频率看驱动力，共振条件f驱=f固。"},"2|4|k|4":{"explain":"机械波产生需波源与介质，传播的是振动形式与能量，质点不随波迁移。v=λf，波速由介质决定、频率由波源决定。横波纵波区别在振动方向与传播方向垂直或平行。","example":"例：绳波是横波，声波是纵波；同一介质中波速相同、频率不同波长不同；传播的是振动形式与能量，质点不随波迁移。","tip":"波速看介质、频率看波源，质点不随波迁移。"},"2|4|k|5":{"explain":"波动图像是某时刻各质点的位移分布，横轴是位置；判断质点振动方向用同侧法（波形与振动方向在传播方向同侧）或上下坡法。","example":"例：波向右传播，某质点在波形上坡处，用上下坡法判断其向下振动；也可用同侧法：波形与振动方向在传播方向同侧。","tip":"先定传播方向，用同侧法或上下坡法判断振动方向。"},"2|4|d|0":{"explain":"振动图像横轴是时间、表示一个质点不同时刻的位移；波动图像横轴是位置、表示同一时刻不同质点的位移。区分关键是看横轴，题目常混给出。","example":"例：题给振动图像求周期，波动图像求波长，两者结合求波速v=λ/T；区分关键是横轴是时间还是位置。","tip":"横轴是时间还是位置，决定是振动图像还是波动图像。"},"2|4|d|1":{"explain":"波传播方向与质点振动方向互判：带动法（前一质点带动后一质点）、同侧法、上下坡法、平移法，掌握一种熟练运用即可。","example":"例：波向右传播，波峰左侧的质点向上振动、右侧的质点向下振动；带动法认为前一质点带动后一质点振动。","tip":"同侧法：波形与振动方向在传播方向的同一侧。"},"2|4|d|2":{"explain":"波的多解问题源于双向性（传播方向不明）与周期性（距离差为波长的整数倍），需讨论n的取值，答案常为通式：t=nT+Δt等形式。","example":"例：两质点相距Δx，间距可能是λ/4也可能是3λ/4等，产生多解；传播方向不明时也有双向性多解，需讨论n取值。","tip":"多解题讨论n=0、1、2…，不漏解不臆造。"},"2|4|d|3":{"explain":"波的干涉是频率相同的两列波叠加：加强点路程差为波长的整数倍（Δs=nλ），减弱点为半波长的奇数倍（Δs=(2n+1)λ/2）。干涉是波的特性。","example":"例：两相干波源到某点的路程差恰为λ，该点为振动加强点；路程差为半波长奇数倍时为减弱点。","tip":"加强Δs=nλ、减弱Δs=(2n+1)λ/2，先算路程差。"},"2|4|d|4":{"explain":"受迫振动振幅与驱动力频率关系图像：f=f0处振幅最大，两侧减小，图像反映共振特性，用于判断共振频率与固有频率。","example":"例：共振曲线峰值对应固有频率f0，驱动力频率远离f0振幅变小；受迫振动频率等于驱动力频率与固有频率无关。","tip":"共振曲线峰值处f驱=f固，两侧振幅减小。"},"2|4|e|0":{"explain":"振动图像与波动图像结合判断振动方向是高考常考：先由波动图像定某点振动方向，再与振动图像对照确定时刻或波的传播方向。","tip":"两种图像横轴不同，先标清再判断。"},"2|4|e|1":{"explain":"波长、波速、周期计算用v=λf=λ/T，多解问题注意讨论双向性与周期性，写通解再代入n验证。","tip":"用v=λf计算，多解问题写通式再讨论n。"},"2|4|e|2":{"explain":"用单摆测重力加速度实验：g=4π^2L/T^2，测多次全振动求周期、摆长从悬点到球心，用L-T^2图像（斜率4π^2/g）处理减小误差。","tip":"摆长算到球心，测多次全振动求T。"},"2|4|e|3":{"explain":"干涉衍射条件与应用、多普勒效应判断：频率相同波才干涉、缝宽与波长可比衍射明显、相对运动产生多普勒效应（靠近频率升高）。","tip":"多普勒：靠近频率升高、远离降低。"},"2|4|e|4":{"explain":"易错点：振动图像与波动图像横轴混淆、波的多解漏讨论。先看横轴是时间还是位置再解题，多解问题要讨论n取整数，避免漏解。","tip":"横轴决定图像类型，多解讨论n取值。"},"2|5|k|0":{"explain":"折射定律n=sinθ1/sinθ2，θ1是入射角、θ2是折射角；折射率n=c/v，光从真空进入介质偏向法线（折射角小于入射角）。频率越高的光折射率越大。","example":"例：光从空气射入玻璃n=1.5，入射角45度，sinθ2=sin45度/1.5，θ2约28度。","tip":"光从光疏介质进光密介质偏向法线，n大折射角小。"},"2|5|k|1":{"explain":"全反射条件：光从光密介质射入光疏介质，且入射角大于等于临界角C，sinC=1/n。全反射时光能全部反射，用于光导纤维、全反射棱镜。","example":"例：水到空气n=4/3，sinC=3/4，C约48.6度，入射角大于48.6度发生全反射。","tip":"全反射两条件缺一不可：光密到光疏加入射角大于等于临界角。"},"2|5|k|2":{"explain":"全反射应用：光导纤维靠光在纤芯与包层界面反复全反射传播，损耗小；全反射棱镜使光路偏转90度或180度，用于潜望镜、望远镜。","example":"例：光纤内芯折射率大于包层，光以大于临界角入射在界面全反射传输，损耗小，用于通信与医疗内窥。","tip":"光纤要求内芯折射率大于包层折射率。"},"2|5|k|3":{"explain":"双缝干涉条纹间距Δx=Lλ/d，L是缝到屏的距离、d是双缝间距。亮暗纹由路程差决定：路程差为波长整数倍是亮纹、半波长奇数倍是暗纹。","example":"例：d减小则条纹间距增大；波长增大（红光比紫光）条纹间距增大，均由Δx=Lλ/d判断。","tip":"Δx=Lλ/d，缝越密条纹越密，波长越长条纹越宽。"},"2|5|k|4":{"explain":"单缝衍射：缝宽与波长可比时衍射明显，衍射条纹中央亮纹最宽最亮，两侧亮纹渐窄渐暗。缝越窄衍射越明显。","example":"例：单缝衍射中央亮纹宽度约为两侧亮纹的2倍，缝变窄时中央亮纹变宽；缝宽与波长可比时衍射才明显。","tip":"缝宽与波长可比才衍射明显，中央亮纹最宽。"},"2|5|k|5":{"explain":"偏振现象说明光是横波，偏振片只让特定方向振动的光通过；薄膜干涉用于增透膜（厚度λ/4）与检查平面平整度，光程差决定明暗。","example":"例：戴偏振太阳镜可减弱水面反射的眩光，说明反射光具有偏振性；偏振现象证明光是横波。","tip":"偏振证明光是横波，增透膜厚度为λ/4。"},"2|5|d|0":{"explain":"光进入介质频率不变、波长变短：n=c/v=λ0/λ（λ0为真空波长）。折射率大的介质光速小、波长短，红光n小紫光n大。","example":"例：紫光n=1.53、红光n=1.51，同一介质中紫光传播速度更小；光进入介质频率不变、波长变短。","tip":"频率不变、波长变短，n=c/v=λ0/λ。"},"2|5|d|1":{"explain":"全反射判断顺序：先判光密光疏（从哪个介质射入哪个），再比较入射角与临界角，两条件都满足才全反射。漏判条件是最常见错误。","example":"例：光从空气射入玻璃不可能全反射（光疏到光密），从玻璃射向空气才可能，且入射角必须大于等于临界角。","tip":"先判光路方向，入射角还要大于临界角。"},"2|5|d|2":{"explain":"条纹间距公式Δx=Lλ/d的应用：增大L或λ条纹变宽，增大d条纹变窄；白光干涉中央为白色、两侧为彩色条纹。","example":"例：红光波长大于紫光，同一装置中红光干涉条纹间距更大，由Δx=Lλ/d可知波长越大条纹间距越大。","tip":"用Δx=Lλ/d判断变化，白光干涉呈彩色。"},"2|5|d|3":{"explain":"薄膜干涉增透膜：光程差决定明暗，增透膜最小厚度为λ/4（两反射光光程差λ/2恰好相消），增反膜厚度为λ/2。","example":"例：增透膜厚度取λ/4，两反射光光程差为λ/2恰好相消，反射减弱、透射增强，是薄膜干涉的重要应用。","tip":"增透膜λ/4、增反膜λ/2，别记反。"},"2|5|e|0":{"explain":"折射定律与全反射计算是选考计算题高频：画光路图、找几何关系（角度、三角形），用n=sinθ1/sinθ2与sinC=1/n求解。","tip":"画光路图找几何角，全反射先判条件。"},"2|5|e|1":{"explain":"干涉、衍射、偏振概念辨析常出选择题：干涉条纹等间距、衍射中央亮纹宽、偏振证明横波，分清现象与条件。","tip":"干涉等间距、衍射中央宽，偏振是横波标志。"},"2|5|e|2":{"explain":"双缝干涉测波长实验：用Δx=Lλ/d，测条纹间距（测多条取平均）、L与d，代入求λ，注意单位换算与读数。","tip":"条纹间距测多条取平均，公式变形求λ。"},"2|5|e|3":{"explain":"三棱镜色散、玻璃砖等几何光学综合：色散因不同色光折射率不同偏折不同，玻璃砖有侧移，画图找几何关系求解。","tip":"色散是n不同，红光偏折小紫光大。"},"2|5|e|4":{"explain":"易错点：全反射条件漏判、频率与波长关系搞反。频率不变、波长变短，全反射两条件齐备才发生。","tip":"全反射两条件，频率不变波长变。"},"3|0|k|0":{"explain":"磁感应强度B=F/IL是矢量，方向即磁场方向（小磁针N极指向），单位特斯拉T。磁感线闭合、不相交，疏密表示强弱。","example":"例：F=2N、I=1A、L=1m且导线垂直磁场放置，B=2T；B的方向即磁场方向，磁感线闭合不相交。","tip":"B=F/IL要求导线垂直磁场，磁感线闭合无起点终点。"},"3|0|k|1":{"explain":"安培力F=BILsinθ，θ是B与I的夹角，垂直时F=BIL，方向用左手定则。安培力垂直于B与I决定的平面。电动机利用安培力工作。","example":"例：B=0.5T、I=2A、L=0.4m且垂直，F=0.5×2×0.4=0.4N，方向用左手定则判断。","tip":"左手定则判安培力，F垂直B与I所在平面，平行时F=0。"},"3|0|k|2":{"explain":"洛伦兹力f=qvBsinθ，速度垂直磁场时f=qvB，方向用左手定则（注意负电荷四指方向与运动方向相反），永不做功，只改变速度方向。","example":"例：电子以速度v垂直B运动，f=evB，用左手定则时四指指向与电子运动方向相反。","tip":"洛伦兹力永不做功，负电荷用左手定则时四指指反方向。"},"3|0|k|3":{"explain":"带电粒子垂直进入匀强磁场做匀速圆周运动：qvB=mv^2/r，r=mv/qB，周期T=2πm/qB与速度、半径无关。回旋加速器基于此原理。","example":"例：粒子在B=1T磁场中，v越大半径越大，但周期T=2πm/qB不变，周期只由m、q、B决定与速度无关。","tip":"周期与速度无关，只由m、q、B决定，T=2πm/qB。"},"3|0|k|4":{"explain":"质谱仪先用电场加速qU=mv^2/2，再进入磁场偏转，测半径r求比荷q/m=2U/B^2r^2，用于分析同位素。","example":"例：质谱仪中加速电压U、磁场B、测出半径r，代入q/m=2U/(B^2r^2)求比荷，用于分析同位素。","tip":"加速用qU、偏转用qvB，两式联立消去v求比荷。"},"3|0|k|5":{"explain":"速度选择器电场力与洛伦兹力平衡：qE=qvB，v=E/B的粒子直线通过，与电荷正负、质量无关。速度不等于E/B的粒子发生偏转。","example":"例：E=1000V/m、B=0.1T，只有v=E/B=10^4m/s的粒子能直线通过，与电荷正负、质量无关。","tip":"v=E/B直线通过，与q、m、电荷正负无关。"},"3|0|d|0":{"explain":"左手定则判安培力、洛伦兹力方向，右手定则判感应电流方向，口诀左力右电。用错手是最常见错误，做题前先默念左力右电。","example":"例：判断导体切割磁感线的电流方向用右手定则，判断通电导线受力方向用左手定则，口诀左力右电，用错手是最常见错误。","tip":"左力右电：安培力洛伦兹力用左手，感应电流用右手。"},"3|0|d|1":{"explain":"带电粒子在有界磁场中运动：找圆心（两速度垂线交点或弦中垂线）、定半径（几何关系）、求圆心角（等于速度偏转角），运动时间t=θT/2π。","example":"例：粒子从圆形磁场边界射入，圆心在速度垂线与弦中垂线交点，圆心角等于速度偏转角，运动时间t=θT/2π。","tip":"三步：找圆心、定半径、求圆心角，t=θT/2π。"},"3|0|d|2":{"explain":"临界与极值问题如恰能射出边界、最小速度：用放缩圆（速度大小变化）与旋转圆（速度方向变化）动态分析，找出轨迹与边界相切的临界条件。","example":"例：粒子恰不穿出磁场边界，轨迹圆与边界相切，切点即临界点；用放缩圆定速度大小、旋转圆定方向。","tip":"放缩圆定大小、旋转圆定方向，相切是临界。"},"3|0|d|3":{"explain":"洛伦兹力方向始终垂直速度，永不做功，只改变速度方向不改变动能；电场力做功改变动能。复合场中粒子动能变化只由电场力、重力引起。","example":"例：粒子在磁场中做匀速圆周运动，速率不变、动能不变，因为洛伦兹力始终垂直速度、永不做功。","tip":"洛伦兹力不做功，动能变化只看电场力与重力做功。"},"3|0|d|4":{"explain":"复合场（重力、电场、磁场叠加）中粒子可能做匀速直线运动（三力平衡）、匀速圆周运动（洛伦兹力提供向心力、重力与电场力平衡）或复杂曲线运动，先分析受力。","example":"例：三场叠加中粒子做匀速圆周运动，须重力与电场力平衡，洛伦兹力单独提供向心力；先受力分析再判断运动形式。","tip":"匀速圆周条件是重力电场力平衡，洛伦兹力提供向心力。"},"3|0|e|0":{"explain":"带电粒子在磁场中运动是压轴计算常客：几何找圆心定半径、三角函数算角度、求运动时间，考查数学与物理结合能力。","tip":"几何关系画准，圆心角等于速度偏转角。"},"3|0|e|1":{"explain":"安培力与力学综合：通电导体棒平衡与运动问题，先受力分析画出安培力方向（左手定则），再列平衡方程或牛顿第二定律。","tip":"安培力方向用左手，通电导体受力分析别漏安培力。"},"3|0|e|2":{"explain":"质谱仪、回旋加速器、速度选择器原理常出选择：质谱仪测比荷、回旋加速器加速带电粒子（D形盒间电场加速、盒内磁场回旋）、速度选择器选速度。","tip":"回旋加速器在盒间加速、盒内偏转，周期与速度无关。"},"3|0|e|3":{"explain":"有界磁场临界问题（圆形、三角形磁场）考查数学能力：轨迹与边界相切、恰好射出等条件，用几何关系列方程。","tip":"相切即临界，画轨迹图找几何关系。"},"3|0|e|4":{"explain":"易错点：粒子电性判断偏转方向出错、误以为周期与速度有关。负电荷左手定则四指反向，周期与速度无关。","tip":"先判电性再判偏转，T与v无关。"},"3|1|k|0":{"explain":"磁通量Φ=BScosθ，θ是B与面法线的夹角，单位韦伯Wb。磁通量变化是产生感应电动势的条件，注意有效面积是垂直磁场方向的投影。","example":"例：B=2T、S=0.5m^2且垂直放置，Φ=1Wb；平行放置时Φ=0，磁通量用垂直磁场方向的投影面积计算。","tip":"Φ=BScosθ用垂直投影，磁通量是标量但有正负。"},"3|1|k|1":{"explain":"楞次定律：感应电流的方向总是阻碍引起感应电流的磁通量变化，口诀增反减同：磁通量增大时感应电流产生的磁场与原磁场方向相反。阻碍的是变化而非磁通量本身。","example":"例：磁铁N极插入线圈，线圈中感应电流的磁场向上，阻碍磁通量增大；增反减同，阻碍的是变化。","tip":"增反减同，阻碍磁通量的变化而不是磁通量本身。"},"3|1|k|2":{"explain":"右手定则判断导体切割磁感线时的感应电流方向：伸右手，让磁感线穿入手心，拇指指向导体运动方向，四指指向即电流方向。","example":"例：导体棒向右切割竖直向下的磁场，用右手定则判断感应电流方向；让磁感线穿入手心、拇指指运动方向、四指指电流方向。","tip":"切割用右手定则，与左手定则（判力）严格区分。"},"3|1|k|3":{"explain":"法拉第电磁感应定律E=nΔΦ/Δt：感应电动势与磁通量变化率成正比，n为匝数。ΔΦ/Δt越大E越大，与磁通量本身大小无关。","example":"例：n=100匝、ΔΦ/Δt=0.02Wb/s，E=nΔΦ/Δt=2V；电动势与磁通量变化率成正比，与磁通量大小无关。","tip":"看变化率不看磁通量大小，E=nΔΦ/Δt。"},"3|1|k|4":{"explain":"切割公式E=BLvsinθ，B、L、v两两垂直时E=BLv，常用于平动切割。v是有效切割速度（垂直B与L方向的分量），L是有效切割长度。","example":"例：B=0.5T、L=0.4m、v=2m/s垂直切割，E=0.5×0.4×2=0.4V。","tip":"v、L取有效分量，B、L、v两两垂直才E=BLv。"},"3|1|k|5":{"explain":"自感是线圈自身电流变化产生自感电动势阻碍电流变化。断电自感中灯泡闪亮的条件：原来通过线圈的电流大于通过灯泡的电流（线圈与灯泡并联且线圈电阻小）。","example":"例：断电自感中，若线圈电阻远小于灯泡电阻，断电瞬间灯泡闪亮一下再熄灭，因为原来通过线圈的电流大于通过灯泡的电流。","tip":"自感阻碍电流变化不是阻止，闪亮条件是比较原电流大小。"},"3|1|k|6":{"explain":"涡流是块状金属在变化磁场中产生的感应电流，像水中的漩涡，产生焦耳热。应用于电磁炉加热、涡流制动，也造成变压器铁芯发热损耗。","example":"例：电磁炉锅底产生涡流发热；变压器铁芯用硅钢片叠成以减小涡流损耗，涡流还用于涡流制动与安检。","tip":"涡流生热应用广，铁芯用硅钢片是减小涡流。"},"3|1|d|0":{"explain":"感应电流方向判断：先判磁通量增大还是减小，用楞次定律增反减同定感应磁场方向，再用安培定则（右手螺旋）定感应电流方向；切割问题直接用右手定则。","example":"例：磁铁拔出线圈时磁通量减小，感应电流的磁场与原磁场同向，阻碍磁通量减小；导体切割问题直接用右手定则判断电流方向。","tip":"楞次定律加安培定则两步走，切割问题直接右手定则。"},"3|1|d|1":{"explain":"电磁感应与电路综合：导体棒等效为电源（电动势E=BLv、内阻r），画等效电路求电流、电功率，注意串并联关系与欧姆定律应用。","example":"例：导轨上导体棒切割磁感线，棒等效为电源，外电阻与棒内阻串联，I=E/(R+r)。","tip":"切割棒是电源，画等效电路再算电流功率。"},"3|1|d|2":{"explain":"单杆导轨模型：安培力F安=B^2L^2v/R随速度增大而增大，最终安培力与外力平衡做匀速运动（收尾速度），此时合力为零速度最大。","example":"例：恒力拉导体棒，速度增大F安增大，当F=F安时匀速，收尾速度v=FR/B^2L^2。","tip":"收尾速度即合力为零时，F安=B^2L^2v/R。"},"3|1|d|3":{"explain":"双杆问题：系统合外力为零时用动量守恒或动量定理；安培力冲量等于动量变化，电荷量q=nΔΦ/R与平均感应电流有关，常用来求位移。","example":"例：双杆在光滑导轨上，系统动量守恒求末速度，q=nΔΦ/R求滑行距离；安培力冲量等于系统动量变化。","tip":"动量定理求速度，q=nΔΦ/R求电荷量与位移。"},"3|1|d|4":{"explain":"导线框穿磁场分段分析：进入过程磁通量增大有感应电流，完全进入后磁通量不变无感应电流不受安培力，穿出过程磁通量减小产生反向电流。","example":"例：线框完全在磁场中匀速运动时磁通量不变、无感应电流不受安培力，只有进入和穿出过程有感应电流，需分段分析。","tip":"完全在磁场内无感应电流，进出过程分段分析。"},"3|1|e|0":{"explain":"电磁感应综合题是高考压轴：单杆双杆、线框切割与能量动量结合，用动量定理求电荷量与位移、能量守恒求热量。","tip":"电荷量q=nΔΦ/R，能量守恒求焦耳热。"},"3|1|e|1":{"explain":"E=nΔΦ/Δt用于磁通量变化（感生），E=BLv用于平动切割（动生），选择题常考区分：B变化用前者、切割用后者。","tip":"磁通量变用nΔΦ/Δt，切割用BLv。"},"3|1|e|2":{"explain":"电磁感应图像问题（B-t、Φ-t、i-t图像）分析常出选择：由斜率、变化趋势判断感应电动势与电流，注意分段分析与初始值。","tip":"Φ-t图斜率即E，图像分段分析。"},"3|1|e|3":{"explain":"电荷量q=nΔΦ/R总与平均感应电流相关，q=I(平均)t，与时间无关只由磁通量变化与电阻决定，常用来求位移。","tip":"q=nΔΦ/R与时间无关，是求位移的桥梁。"},"3|1|e|4":{"explain":"楞次定律与能量守恒：安培力做负功将机械能转化为电能，再转化为焦耳热，安培力做功大小等于回路产生的总热量。","tip":"安培力做负功等于产生热量，用能量守恒列式。"},"3|1|e|5":{"explain":"易错点：Φ大不代表E大（看变化率）、BLv中v用错方向。E与ΔΦ/Δt成正比，v取有效切割分量。","tip":"看变化率不看Φ大小，v取有效分量。"},"3|2|k|0":{"explain":"线圈在匀强磁场中匀速转动产生正弦式交变电流：e=Emsinωt，峰值Em=NBSω，ω是转动角速度。从中性面开始计时是正弦，从峰值位置开始是余弦。","example":"例：N=100、B=0.5T、S=0.2m^2、ω=100rad/s，Em=1000V。","tip":"Em=NBSω，计时起点决定写正弦还是余弦。"},"3|2|k|1":{"explain":"正弦式电流有效值与峰值关系：E=Em/根号2、I=Im/根号2、U=Um/根号2。有效值按热效应等效定义，交流电表读数、电器铭牌标注的都是有效值。","example":"例：市电峰值Um=311V，有效值U=311/根号2约220V；交流电表读数、电器铭牌标注的都是有效值。","tip":"峰值除根号2只适用于正弦式电流，电表读数是有效值。"},"3|2|k|2":{"explain":"有效值按热效应等效定义：交流与直流在相同电阻、相同时间内产生相同热量，该直流值即有效值。非正弦波须用焦耳定律分段计算，不能套峰值除根号2。","example":"例：方波电流不能用峰值除根号2，要按相同电阻相同时间产生相同热量的等效关系求有效值。","tip":"非正弦波按热效应定义计算，别乱套根号2。"},"3|2|k|3":{"explain":"我国市电220V、50Hz，峰值Um约311V，角频率ω=2πf=100πrad/s，周期0.02s，瞬时值表达式u=311sin100πtV。","example":"例：u=311sin100πtV中，T=0.02s、f=50Hz、Um=311V。","tip":"220V是有效值，311V是峰值，写表达式用峰值。"},"3|2|k|4":{"explain":"理想变压器U1/U2=n1/n2电压与匝数成正比，输入功率等于输出功率，电流关系I1/I2=n2/n1。原副线圈电流频率相同。","example":"例：n1=1000、n2=200，U1=220V则U2=44V，是降压变压器；电流关系I1/I2=n2/n1与匝数成反比。","tip":"电压比匝数、电流比反比，输入功率由输出决定。"},"3|2|k|5":{"explain":"远距离输电：P损=I^2R，为减小损耗需升压降压配合，电压越高电流越小损耗越小。分析三段：升压变压器、输电线、降压变压器。","example":"例：P=100kW送电，220V时电流约455A损耗巨大；升到11kV电流约9A，损耗降为原来的约1/2500。","tip":"升压降流减损，P损=I^2R，三段分析。"},"3|2|d|0":{"explain":"交变电流四值适用场合：瞬时值写表达式、峰值判击穿（电容器耐压）、有效值算功率热量、平均值算电荷量q=I(平均)Δt=nΔΦ/R。各用各的场合。","example":"例：电容器耐压看峰值Um，电热、电功率用有效值，电荷量用平均值，瞬时值用于写电动势表达式。","tip":"击穿看峰值、功率看有效值、电荷量看平均值。"},"3|2|d|1":{"explain":"变压器动态分析：负载变化时输入功率由输出决定（P入=P出），副线圈负载电阻减小则I2增大、I1也随之增大，各表读数按关系变化。","example":"例：副线圈负载电阻减小，I2增大、I1也随之增大，但U2不变；输入功率由输出功率决定，P入=P出。","tip":"P入=P出，负载变化先分析副线圈再推原线圈。"},"3|2|d|2":{"explain":"原线圈含电阻或接二极管的特殊变压器：原线圈电阻分压使输入电压不等于电源电压，二极管使电流单向，需用有效值定义处理。","example":"例：原线圈串联电阻，U1不等于电源电压，先求原线圈两端实际电压；接二极管时电流单向，用有效值定义处理。","tip":"原线圈有电阻时U1不等于E，注意电压关系。"},"3|2|d|3":{"explain":"远距离输电三段分析：升压变（升压）、输电线（电压损失ΔU=I线R、功率损失P损=I线^2R）、降压变（降压），各段电压电流功率关系要理清。","example":"例：输电线电压损失ΔU=I线R，功率损失P损=I^2R，降压变输入电压等于升压变输出电压减ΔU。","tip":"输电线上ΔU=I线R、P损=I^2R，三段逐一分析。"},"3|2|e|0":{"explain":"交变电流瞬时值、有效值计算是选择必考：读图像求Em、T、f，写瞬时值表达式，算有效值与功率。","tip":"图像读Em、T，表达式用峰值写。"},"3|2|e|1":{"explain":"变压器原理与动态分析：匝数比、负载变化影响，电压由匝数决定、电流由负载决定，P入=P出。","tip":"电压看匝数、电流看负载，输入功率等于输出。"},"3|2|e|2":{"explain":"远距离输电计算：P损=I^2R与升压降压比配合，先求输电电流再算损耗与降压变压器参数。","tip":"输电电流I=P/U，损耗I^2R。"},"3|2|e|3":{"explain":"交变电流图像问题：读Em、T、f并写瞬时值表达式e=Emsin(2πt/T)，注意计时起点。","tip":"计时起点中性面写sin，峰值位置写cos。"},"3|2|e|4":{"explain":"易错点：峰值除根号2误用于非正弦、变压器电流关系漏匝数比。正弦式才除根号2，I1/I2=n2/n1。","tip":"有效值公式限正弦式，变压器电流反比别漏。"},"3|3|k|0":{"explain":"LC振荡电路周期T=2π根号(LC)，频率f=1/2π根号(LC)，由电感L与电容C决定，改变L或C可调谐（收音机选台原理）。","example":"例：L=1mH、C=100pF，T=2π根号(10^-3×10^-10)，约2π×10^-6.5s量级。","tip":"T=2π根号(LC)，调谐靠改变L、C。"},"3|3|k|1":{"explain":"振荡过程电场能与磁场能周期性转化：电流最大时电容器放电完毕、电压为零、电场能为零磁场能最大；电流为零时电场能最大。","example":"例：放电过程中电流增大、电压减小，能量从电场能转化为磁场能；充电过程相反，磁场能转化为电场能。","tip":"电流最大则电场能为零，记住对应关系。"},"3|3|k|2":{"explain":"电磁波产生：周期性变化的电场产生周期性变化的磁场，交替产生并向外传播形成电磁波。麦克斯韦预言、赫兹验证。均匀变化的电场只产生恒定磁场。","example":"例：振荡电路是电磁波波源，开放电路有利于电磁波辐射；周期性变化的电场产生周期性变化的磁场，交替传播形成电磁波。","tip":"周期性变化才产生电磁波，均匀变化只产生恒定场。"},"3|3|k|3":{"explain":"电磁波在真空中速度c=3×10^8m/s，v=λf，传播不需介质。电磁波是横波，能传播能量与信息，频率越高波长越短。","example":"例：频率100MHz的电磁波，波长λ=c/f=3m；电磁波在真空中速度c=3×10^8m/s，传播不需介质。","tip":"真空中c=3×10^8m/s，v=λf，传播不需介质。"},"3|3|k|4":{"explain":"电磁波谱按频率从低到高：无线电波、红外线、可见光、紫外线、X射线、γ射线，频率越高能量越大、穿透越强，各波段有不同应用。","example":"例：红外线用于遥控测温、紫外线杀菌、X射线透视、γ射线探伤放疗；频率越高能量越大、穿透越强。","tip":"按频率顺序记电磁波谱，应用与波段对应。"},"3|3|d|0":{"explain":"振荡电路各量随时间变化的对应关系：q增大则电场能增大、电流减小；q最大时i=0、U最大；q=0时i最大、U=0。用LC电路图像分析。","example":"例：电容器充电过程q增大、i减小、电场能增大；q最大时i=0、U最大，q=0时i最大、U=0。","tip":"用能量转化记对应：电场能大则电流小。"},"3|3|d|1":{"explain":"电磁波谱各波段应用与产生机理辨析：无线电波由振荡电路产生、红外线有热效应、紫外线有荧光效应、X射线穿透力强、γ射线由核反应产生。","tip":"各波段产生机理与应用对应记忆。"},"3|3|d|2":{"explain":"麦克斯韦电磁场理论：均匀变化电场产生恒定磁场，周期性变化电场产生周期性变化磁场（电磁波），振荡的电场是电磁波源。","tip":"均匀变化产生恒定场，周期变化产生电磁波。"},"3|3|e|0":{"explain":"LC振荡电路周期频率计算与图像分析常出选择：读T，由T=2π根号(LC)求L或C，分析各量对应变化。","tip":"图像读T，T=2π根号(LC)变形求未知量。"},"3|3|e|1":{"explain":"电磁波谱与应用对应关系：手机用无线电波、微波炉用微波、遥控器用红外线等，记波段与应用。","tip":"微波炉微波、遥控红外，对应记牢。"},"3|3|e|2":{"explain":"电磁波与机械波区别：机械波需要介质、电磁波不需要；电磁波都是横波，机械波有横波纵波；真空中电磁波速度c，机械波不能传播。","tip":"电磁波不需介质、机械波需介质。"},"3|3|e|3":{"explain":"易错点：电流最大时误以为电场能最大、放电完毕状态判断错误。电流最大则磁场能最大、电场能为零。","tip":"电流大磁场能大、电压大电场能大。"},"3|4|k|0":{"explain":"传感器原理：非电学量经敏感元件转化为电学量，由敏感元件与转换电路组成，把温度、光照、压力等非电学量转化为电压电流等电学量。","example":"例：光控路灯：光照变化引起光敏电阻阻值变化，电路输出控制信号；传感器把非电学量转化为电学量。","tip":"敏感元件感知非电学量，转换电路变电学量。"},"3|4|k|1":{"explain":"光敏电阻光照增强电阻减小；热敏电阻负温度系数：温度升高电阻减小（正温度系数反之）。阻值变化引起电路电流电压变化。","example":"例：光照增强时光敏电阻阻值减小，串联电路中电流增大；负温度系数热敏电阻温度升高阻值减小。","tip":"光强阻小、温度高阻小（负温度系数）。"},"3|4|k|2":{"explain":"霍尔元件：载流子在磁场中受洛伦兹力偏转积累形成霍尔电压UH=kIB/d，k为霍尔系数、d为厚度。可用于测磁场、测电流。","example":"例：电流增大或磁场增强，霍尔电压增大，UH与IB成正比、与厚度d成反比，可测磁场或电流。","tip":"UH=kIB/d，与I、B成正比、与d成反比。"},"3|4|k|3":{"explain":"力传感器：电容式（压力改变极板间距改变电容）、压阻式（压力改变电阻），把压力转化为电容或电阻变化再转成电信号。","example":"例：电子秤用压阻式传感器，压力增大电阻变化，电路输出与压力对应的信号；电容式传感器靠压力改变极板间距改变电容。","tip":"压力引起形变，再引起电容或电阻变化。"},"3|4|k|4":{"explain":"传感器应用：路灯光控（光敏电阻）、温控开关（热敏电阻）、位移速度测量、火灾报警（烟雾、温度），把物理量转化为电信号实现自动控制。","example":"例：恒温箱用热敏电阻控制加热电路的通断；路灯光控、温控开关、火灾报警等都是传感器的应用。","tip":"自动控制核心：敏感元件感知加电路处理。"},"3|4|d|0":{"explain":"敏感元件特性与电路结合：光照、温度变化时元件阻值变化，用串并联规律分析电流电压变化，先判阻值变化方向再分析电路各量。","example":"例：光照增强光敏电阻阻值减小，分压式接法中其两端电压减小；分析时先判阻值变化方向再推电路各量。","tip":"先判阻值变大变小，再分析电路各量。"},"3|4|d|1":{"explain":"霍尔电压方向判断：用左手定则判断载流子偏转方向，注意载流子正负——半导体中载流子可能是空穴（正电荷），偏转方向与电子相反，霍尔电压极性也不同。","example":"例：N型半导体电子导电，P型半导体空穴导电，同样条件下霍尔电压极性相反；判断方向用左手定则看载流子偏转。","tip":"先判载流子正负，左手定则四指方向相应调整。"},"3|4|d|2":{"explain":"传感器控制电路设计：根据控制要求选择元件与连接方式，如温度达到某值动作，用热敏电阻串接继电器或比较电路，注意阈值与动作逻辑。","tip":"设计题先明确控制逻辑，再选元件接电路。"},"3|4|e|0":{"explain":"传感器原理与电路应用常以新情境选择题出现：给传感器原理图，判断敏感元件与电路作用，抓住阻值变化到电路响应的主线。","tip":"新情境抓主线：物理量到阻值再到电路。"},"3|4|e|1":{"explain":"光敏电阻、热敏电阻在控制电路中的动态分析：环境变化引起阻值变化，分析电表读数与执行元件动作。","tip":"环境变则阻值变，再推电流电压变。"},"3|4|e|2":{"explain":"霍尔元件电压与磁场、电流关系及方向判断：UH=kIB/d，方向由载流子类型与磁场方向决定。","tip":"UH与IB成正比，方向看载流子正负。"},"3|4|e|3":{"explain":"易错点：负温度系数热敏电阻阻值随温度升高而减小、光敏电阻亮时电阻小。光越强、温度越高（负温度系数）电阻越小。","tip":"光强阻小、温度高阻小（负温度系数），别记反。"},"4|0|k|0":{"explain":"分子动理论三内容：物质由大量分子组成、分子永不停息做无规则运动、分子间存在引力和斥力。分子直径约10^-10m数量级，是热学微观基础。","example":"例：1mol水约有6.02×10^23个分子，说明分子数量极其巨大；分子直径约10^-10m数量级，分子间有引力和斥力。","tip":"分子动理论三条内容要完整，引力斥力同时存在。"},"4|0|k|1":{"explain":"阿伏伽德罗常数NA=6.02×10^23/mol联系宏观量与微观量：分子质量m0=M/NA、分子体积v0=Vmol/NA，估算题用宏观量除以NA。","example":"例：水的摩尔质量18g/mol，分子质量m0=18×10^-3/6.02×10^23约3×10^-26kg。","tip":"估算分子质量大小用NA，固体液体用体积、气体用间距。"},"4|0|k|2":{"explain":"布朗运动是悬浮微粒的无规则运动，不是分子运动，但反映液体（气体）分子无规则运动。微粒越小、温度越高布朗运动越明显。","example":"例：显微镜下花粉颗粒的跳动是布朗运动，间接证明水分子在做无规则运动；微粒越小、温度越高布朗运动越明显。","tip":"布朗运动是微粒运动不是分子运动，是分子运动的反映。"},"4|0|k|3":{"explain":"温度是分子平均动能的标志（温度相同平均动能相同），内能包括分子动能与分子势能之和，与温度、体积、质量有关，理想气体内能只与温度有关。","example":"例：同温度的氢气和氧气分子平均动能相同，但总内能不同（分子数不同）；温度是分子平均动能的标志。","tip":"温度标志平均动能，理想气体内能只看温度。"},"4|0|k|4":{"explain":"气体实验定律：玻意耳定律p1V1=p2V2等温，查理定律p1/T1=p2/T2等容，盖-吕萨克定律V1/T1=V2/T2等压。温度必须用热力学温标T=t+273。","example":"例：等温压缩气体体积减半压强加倍，pV乘积保持不变；气体定律中温度必须用热力学温标。","tip":"温度一律用热力学温标，先判等温等压等容再选定律。"},"4|0|k|5":{"explain":"理想气体状态方程pV/T=C或p1V1/T1=p2V2/T2，适用于理想气体（分子间无作用力、忽略分子体积）。三个量都变化时用它，一个量不变退化为对应实验定律。","example":"例：p1V1/T1=p2V2/T2，已知初末状态中三个量求第四个量；适用于理想气体，温度用热力学温标。","tip":"三量变化用状态方程，温度用热力学温标。"},"4|0|d|0":{"explain":"分子力与分子势能随距离变化：r=r0时分子力为零、势能最小；r小于r0表现为斥力、r大于r0表现为引力；从r0拉远或压缩，势能都增大。","example":"例：分子从r0被拉远，引力做负功势能增大；从r0被压缩，斥力做负功势能增大；r=r0时分子力为零、势能最小。","tip":"r=r0势能最小、分子力为零，这是平衡位置。"},"4|0|d|1":{"explain":"气体压强微观解释：大量分子频繁碰撞器壁产生压强，p=nkT（n是分子数密度、T是温度）；宏观上用受力分析或液柱法求封闭气体压强。","example":"例：液柱封闭气体压强：液柱下方p=p0+ρgh、液柱上方p=p0-ρgh；气缸活塞则用受力平衡求压强。","tip":"封闭气体压强用受力分析或液柱法，注意深度方向。"},"4|0|d|2":{"explain":"变质量问题（打气、抽气、漏气）：不能用原状态方程直接计算，用pV=nRT转化：打气后总物质的量等于原来的加上打入的，等效为压强体积相加。","example":"例：打气筒打气，把打入的气体等效为同温下的体积相加，用pV守恒处理；抽气、漏气同理先转化为定质量。","tip":"变质量先转化为定质量（等效法），再列方程。"},"4|0|d|3":{"explain":"液柱与气缸问题：等高处压强相等（连通器原理），液体深度产生压强p=ρgh，气缸活塞用受力平衡求压强，注意活塞面积与大气压。","example":"例：气缸内活塞平衡：pS=p0S+mg，得p=p0+mg/S；注意活塞面积S与大气压p0，液柱用p=ρgh。","tip":"液柱p=ρgh看深度差，活塞用受力平衡求p。"},"4|0|e|0":{"explain":"气体实验定律计算题是选考必考：液柱、气缸、活塞模型，先确定初末状态参量，选定律列方程，温度用热力学温标。","tip":"找初末状态p、V、T，选定律列式。"},"4|0|e|1":{"explain":"分子动理论、阿伏伽德罗常数估算常出选择：求分子数N=nNA、分子质量、分子间距，注意单位换算。","tip":"估算用NA，注意数量级与单位。"},"4|0|e|2":{"explain":"布朗运动与分子热运动辨析、温度与内能关系：布朗运动是微粒运动、分子热运动是分子运动，温度升高分子平均动能增大。","tip":"布朗运动不是分子运动，温度标志平均动能。"},"4|0|e|3":{"explain":"气体状态变化图像（p-V、V-T、p-T图）分析：p-V等温是双曲线、p-T等容是过原点直线、V-T等压是过原点直线，读图判过程。","tip":"p-V等温双曲线，p-T过原点直线是等容。"},"4|0|e|4":{"explain":"易错点：气体定律用摄氏温标、变质量问题直接套pV/T。温度用热力学温标，变质量问题先转化。","tip":"温度用K，变质量问题先等效转化。"},"4|1|k|0":{"explain":"热力学第一定律ΔU=W+Q：内能变化等于外界做功与吸热之和。规定：外界对气体做功W为正、气体吸热Q为正。符号判断是解题关键。","example":"例：等温压缩气体，等温ΔU=0、压缩W大于0，由ΔU=W+Q得Q小于0即放热；符号规定要记牢。","tip":"记住符号规定：压缩W正、膨胀W负，吸热Q正、放热Q负。"},"4|1|k|1":{"explain":"热力学第二定律：热量不能自发地从低温传到高温，第二类永动机（从单一热源吸热全部做功）不可能制成。反映宏观过程的方向性。","example":"例：空调制冷需耗电才能把热量从低温搬到高温，说明热量不能自发从低温传到高温，非自发过程需外界做功。","tip":"第二类永动机不违反能量守恒但违反第二定律。"},"4|1|k|2":{"explain":"能量守恒定律：能量不会凭空产生或消失，只发生转化或转移，总量不变。第一类永动机（不消耗能量而做功）不可能制成，违反能量守恒。","example":"例：摩擦生热是机械能转化为内能，总能量守恒；第一类永动机不消耗能量做功，违反能量守恒不可能制成。","tip":"第一类永动机违反能量守恒，第二类违反方向性。"},"4|1|k|3":{"explain":"热力学第二定律微观解释：自然过程朝着熵增加的方向进行，熵是系统无序程度的量度，自发过程熵增，系统从有序走向无序。","example":"例：气体自由膨胀体积增大、熵增加，不能自发收缩回去；自然过程朝着熵增加的方向进行，从有序走向无序。","tip":"自发过程熵增，熵表示无序程度。"},"4|1|k|4":{"explain":"气体做功W=pΔV：等压膨胀体积增大气体对外做功、W为负，等压压缩外界对气体做功、W为正；非等压过程用p-V图面积求功。","example":"例：等压膨胀p=10^5Pa、ΔV=0.01m^3，气体对外做功1000J，按符号规定膨胀对外做功W为负。","tip":"膨胀对外做功W负，p-V图面积表示做功大小。"},"4|1|d|0":{"explain":"ΔU=W+Q符号规则：压缩W为正、膨胀为负，吸热Q为正、放热为负，内能增加ΔU为正。先判过程类型再定符号，避免正负搞反。","example":"例：绝热压缩Q=0、W大于0，ΔU大于0，温度升高；先判过程类型（绝热、等温等）再定各量符号。","tip":"绝热Q=0、等温ΔU=0，先判过程再定符号。"},"4|1|d|1":{"explain":"理想气体内能只与温度有关：温度不变ΔU=0（等温），绝热过程Q=0则ΔU=W。温度升高内能增大，与体积、压强无关。","example":"例：绝热膨胀W小于0、Q=0，ΔU小于0，温度降低；理想气体内能只与温度有关，温度不变ΔU=0。","tip":"理想气体内能看温度，绝热Q=0。"},"4|1|d|2":{"explain":"热力学第二定律理解：不违反能量守恒但过程有方向性——热量自发从低温到高温不可能、从单一热源吸热做功不可能，机械能可完全转化为内能而反之不能完全。","example":"例：摩擦生热可自发发生，但热变功需要温差或外界干预；热力学第二定律说明宏观过程有方向性。","tip":"第二定律讲方向性，与能量守恒不矛盾。"},"4|1|d|3":{"explain":"p-V图循环过程：图线围成的面积是净功（顺时针为正功），各段判断做功与吸放热，等温线与绝热线斜率不同，结合ΔU=W+Q分析每段内能变化。","example":"例：顺时针循环对外做正功，p-V图面积即净功，吸热大于放热；逐段分析各过程的W、Q、ΔU。","tip":"循环面积是净功，顺时针为正，逐段分析。"},"4|1|e|0":{"explain":"热力学第一定律与气体状态变化结合是选考高频：给出p-V过程判断W、Q、ΔU，用ΔU=W+Q列式。","tip":"符号定清楚，ΔU=W+Q列式。"},"4|1|e|1":{"explain":"p-V图中循环过程吸放热、做功、内能变化判断：面积是净功、顺时针为正功，逐段分析等温等压绝热过程。","tip":"面积净功，逐段定W、Q、ΔU。"},"4|1|e|2":{"explain":"热力学第二定律方向性与永动机辨析常出选择：第一类永动机违反能量守恒、第二类违反第二定律。","tip":"第一类违反能量守恒、第二类违反方向性，别混。"},"4|1|e|3":{"explain":"易错点：符号正负搞反、绝热与等温过程内能变化判断错误。绝热Q=0、等温ΔU=0。","tip":"绝热Q=0、等温ΔU=0，先判过程。"},"4|2|k|0":{"explain":"晶体有确定熔点，单晶体各向异性、多晶体各向同性；非晶体无确定熔点、各向同性。区分晶体与非晶体看有无确定熔点。","example":"例：食盐是单晶体各向异性，铁是多晶体各向同性但有熔点，玻璃是非晶体无熔点；区分晶体与非晶体看有无确定熔点。","tip":"有无确定熔点区分晶体非晶体，各向异性只有单晶体。"},"4|2|k|1":{"explain":"液晶介于晶体与液体之间：具有液体的流动性，又显示晶体的光学各向异性，应用于液晶显示。","example":"例：液晶显示器利用液晶的光学各向异性控制透光；液晶介于晶体与液体之间，具有流动性。","tip":"液晶有流动性加光学各向异性，是特殊物质状态。"},"4|2|k|2":{"explain":"液体表面层分子间距大、分子间表现为引力，使液面有收缩趋势，这就是表面张力，方向沿液面切线。露珠成球形、水黾站立水面都是表面张力作用。","example":"例：水黾能站在水面、露珠成球形，都是表面张力使表面积最小的结果；表面张力方向沿液面切线。","tip":"表面张力沿液面切线，不是指向液体内部。"},"4|2|k|3":{"explain":"浸润与不浸润由附着层分子受力决定：附着层分子受液体引力强则浸润（水与玻璃），受固体引力强则不浸润（水银与玻璃）。毛细现象管径越小液面升降越明显。","example":"例：水在细玻璃管中上升（浸润），水银下降（不浸润），管越细现象越明显；浸润与否由附着层分子受力决定。","tip":"浸润上升不浸润下降，管径越小现象越明显。"},"4|2|k|4":{"explain":"饱和汽压只与温度有关、与体积无关（温度一定时饱和汽压一定），相对湿度等于实际压强与同温饱和汽压之比，相对湿度越大越潮湿。","example":"例：温度不变压缩密闭容器中的饱和汽，饱和汽压不变、部分蒸汽液化；饱和汽压只与温度有关与体积无关。","tip":"饱和汽压只看温度，相对湿度是比值。"},"4|2|d|0":{"explain":"晶体各向异性原因：微观排列规则，不同方向原子排列不同导致物理性质不同；多晶体内部晶粒排列杂乱故各向同性，但仍有确定熔点。","example":"例：单晶硅各向异性，多晶硅各向同性，但都是晶体都有熔点；各向异性源于微观排列规则，多晶体晶粒排列杂乱。","tip":"各向异性是单晶体，多晶体各向同性但有熔点。"},"4|2|d|1":{"explain":"表面张力方向沿液面切线，使液面收缩，不是指向液体内部；液滴呈球形是表面张力使表面积最小，肥皂膜收缩也体现这一作用。","example":"例：肥皂膜收缩成最小面积，表面张力沿膜面方向作用，不是指向液体内部；液滴呈球形也是表面张力所致。","tip":"表面张力沿液面切线收缩，方向别搞错。"},"4|2|d|2":{"explain":"相对湿度计算与露点：相对湿度等于实际压强除以饱和汽压，温度降到露点时实际压强等于饱和汽压、相对湿度达100%，出现液化（露、雾）。","example":"例：气温下降到露点，空气中水汽达到饱和、相对湿度达100%，凝结成露；相对湿度等于实际压强除以饱和汽压。","tip":"露点即饱和点，相对湿度达100%。"},"4|2|e|0":{"explain":"晶体非晶体、液晶、表面张力概念辨析常出选择：有无熔点、是否各向异性、表面张力方向与作用。","tip":"晶体看有无确定熔点，各向异性只属于单晶体。"},"4|2|e|1":{"explain":"毛细现象与浸润不浸润现象解释：浸润液体沿毛细管上升、不浸润液体下降，管径越小升降越明显。","tip":"浸润液体沿管上升、不浸润下降，管径越小越明显。"},"4|2|e|2":{"explain":"饱和汽压与相对湿度理解：饱和汽压只与温度有关，相对湿度是实际压强与饱和汽压之比。","tip":"饱和汽压只由温度决定，与体积无关。"},"4|2|e|3":{"explain":"易错点：多晶体各向同性却有熔点、表面张力方向判断错误。多晶体是晶体有熔点，表面张力沿液面切线。","tip":"多晶体有熔点但各向同性，表面张力沿液面。"},"4|3|k|0":{"explain":"α粒子散射实验（卢瑟福）：大多数α粒子穿过金箔不偏转、少数大角度偏转、极少数反弹，由此提出核式结构：原子核很小带正电、质量集中，电子绕核运动。","example":"例：α粒子散射中极少数被反弹，说明原子核质量大、带正电且体积很小；大多数穿过说明原子内部很空，电子绕核运动。","tip":"核式结构由散射实验得出，记住实验现象与结论对应。"},"4|3|k|1":{"explain":"玻尔模型：轨道量子化（电子只能在特定轨道），能级En=-13.6/n^2eV，跃迁辐射或吸收光子hν=Em-En（m大于n时辐射光子），能量量子化。","example":"例：氢原子从n=2跃迁到n=1，辐射光子能量13.6-3.4=10.2eV；玻尔模型核心是轨道与能量量子化。","tip":"跃迁光子能量hν=|Em-En|，能级差越大频率越高。"},"4|3|k|2":{"explain":"氢原子能级跃迁：高能级向低能级跃迁放光子，光子能量等于能级差，能级差越大频率越高、波长越短；吸收光子从低能级到高能级必须恰等于能级差。","example":"例：从n=3到n=2放光子能量1.89eV，从n=2到n=1放10.2eV，后者频率更高。","tip":"光子能量必须恰等于能级差，大于能级差可使原子电离。"},"4|3|k|3":{"explain":"光电效应方程Ek=hν-W0：光子能量一部分克服逸出功W0，剩余为最大初动能。光子说解释瞬时性与极限频率，ν小于ν0=W0/h时不发生光电效应。","example":"例：W0=2eV，光子能量5eV时Ek=3eV；频率低于极限频率则不产生光电子。","tip":"Ek=hν-W0，ν0=W0/h，极限频率以下无光电子。"},"4|3|k|4":{"explain":"光电效应规律：存在极限频率、最大初动能与频率成线性增大（与光强无关）、光强决定光电子数目（饱和电流）、发生是瞬时的。光子说统一解释。","example":"例：W0=2eV，光子能量5eV时Ek=hν-W0=3eV；频率低于极限频率ν0=W0/h则不产生光电子，最大初动能随频率线性增大。","tip":"频率决定最大初动能，光强决定光电子数目。"},"4|3|k|5":{"explain":"波粒二象性：光既有波动性又有粒子性，波动性体现在干涉衍射，粒子性体现在光电效应；德布罗意波λ=h/p，一切实物粒子都有波动性。","example":"例：电子衍射实验证明电子有波动性，λ=h/p波长与动量成反比；光既有波动性又有粒子性，是波粒二象性。","tip":"干涉衍射显波动、光电效应显粒子，λ=h/p。"},"4|3|d|0":{"explain":"光电效应Ek-hν图像：斜率是h（普朗克常量）、横截距是极限频率ν0、纵截距绝对值是逸出功W0。由图像可求W0=hν0。","example":"例：Ek-hν图像横截距ν0=5×10^14Hz，则W0=hν0可求；图像斜率是h、纵截距是-W0。","tip":"Ek-hν图斜率h、纵截距-W0、横截距ν0。"},"4|3|d|1":{"explain":"能级跃迁光谱线数：一群氢原子从n能级跃迁可发出C(n,2)=n(n-1)/2条谱线；一个氢原子最多发出n-1条（逐级跃迁）。注意一群与一个的区别。","example":"例：一群n=4的氢原子跃迁发出C(4,2)=6条谱线，一个n=4的氢原子最多发3条（逐级跃迁），一群与一个要分清。","tip":"一群n(n-1)/2条，一个最多n-1条。"},"4|3|d|2":{"explain":"光电效应与波动说矛盾：波动理论认为能量连续积累、任何频率都应发生光电效应，无法解释瞬时性与极限频率，只有光子说（能量一份一份）能解释。","example":"例：极限频率以下即使强光照射也无光电子，波动说无法解释，光子说可以；光电效应瞬时性也只有光子说能解释。","tip":"瞬时性与极限频率是光子说的有力证据。"},"4|3|d|3":{"explain":"波粒二象性理解：波动性与粒子性在不同情境体现，不是机械叠加；光传播表现波动性、与物质相互作用表现粒子性，波是概率波。","example":"例：光在双缝干涉中表现波动性，在光电效应中表现粒子性；波动性与粒子性在不同情境体现，不是机械叠加而是概率波。","tip":"波动性粒子性不同情境体现，用概率波理解。"},"4|3|e|0":{"explain":"光电效应方程与图像是选择必考：计算逸出功、极限频率、最大初动能，用Ek=hν-W0与图像截距。","tip":"图像截距即W0、ν0，公式Ek=hν-W0。"},"4|3|e|1":{"explain":"氢原子能级跃迁：能量计算、光谱线数目、电离能，光子能量等于能级差，基态氢原子电离能是13.6eV。","tip":"能级差定光子能量，电离能13.6eV。"},"4|3|e|2":{"explain":"光电效应实验装置：饱和电流、遏止电压概念辨析，遏止电压对应最大初动能，eUc=Ek。","tip":"eUc=Ek，饱和电流对应光电子数目。"},"4|3|e|3":{"explain":"波粒二象性、德布罗意波概念题：λ=h/p，动量越大波长越短，宏观物体波长极短难以观察波动性，微观粒子的波动性显著。","tip":"宏观物体λ极小，波动性不明显。"},"4|3|e|4":{"explain":"易错点：hν=Em-En中ν取正值、光强与频率作用混淆。光子能量为正，频率定初动能、光强定数目。","tip":"频率定初动能、光强定数目，ν取正值。"},"4|4|k|0":{"explain":"天然放射现象放出α、β、γ三种射线：α射线是氦核、电离本领最强穿透最弱，β射线是电子流，γ射线是电磁波、穿透最强电离最弱。","example":"例：α射线电离最强穿透最弱，β射线是电子流，γ射线是电磁波穿透最强电离最弱，用于工业探伤。","tip":"α电离强、γ穿透强，性质对应记牢。"},"4|4|k|1":{"explain":"衰变规律：α衰变质量数减4、电荷数减2（如U238衰变成Th234加He4）；β衰变质量数不变、电荷数加1（中子转化为质子放出电子）。","example":"例：U238经α衰变成Th234，Th234再经β衰变成Pa234；α衰变质量数减4、电荷数减2，β衰变质量数不变电荷数加1。","tip":"α衰变A减4Z减2，β衰变A不变Z加1。"},"4|4|k|2":{"explain":"半衰期：N=N0(1/2)^(t/τ)，原子核衰变一半所需时间，是统计规律，只对大量原子核成立，与温度、压强、化学状态无关。","example":"例：半衰期10天，40g样品30天后剩40×(1/2)^3=5g；半衰期是统计规律，与温度、压强、化学状态无关。","tip":"半衰期只对大量核成立，外界条件不影响。"},"4|4|k|3":{"explain":"核反应方程书写：质量数与电荷数守恒，分清裂变（重核分裂）、聚变（轻核聚合）、人工转变（粒子轰击）、衰变（自发）。","example":"例：U235+n→Ba141+Kr92+3n是裂变，H2+H3→He4+n是聚变。","tip":"配平看质量数电荷数守恒，判断类型看反应特点。"},"4|4|k|4":{"explain":"质能方程E=mc^2，核能ΔE=Δmc^2，质量亏损Δm是反应前后质量差，1u对应约931.5MeV。亏损的质量转化为能量释放。","example":"例：质量亏损Δm=0.02u，核能ΔE=Δmc^2=0.02×931.5约18.6MeV；Δm是反应前后总质量差，用u换算更简便。","tip":"质量亏损乘c^2，1u=931.5MeV换算。"},"4|4|k|5":{"explain":"比结合能越大核越稳定；轻核聚变与重核裂变都向中等质量核靠拢、比结合能增大、释放能量。铁附近的核比结合能最大。","example":"例：聚变生成比结合能更大的核释放能量，裂变同样释放能量；比结合能越大核越稳定，铁附近比结合能最大。","tip":"比结合能大核稳定，聚变裂变都放能。"},"4|4|d|0":{"explain":"半衰期理解：是统计规律，只对大量原子核成立，个别核不能用半衰期预言何时衰变，只能说概率；温度、压强、化学状态不影响半衰期。","example":"例：一个原子核不能说经过半衰期一定衰变，半衰期只对大量核才有统计意义，个别核只能说衰变概率。","tip":"个别核不谈半衰期，统计规律与外界条件无关。"},"4|4|d|1":{"explain":"核反应类型判断：衰变是自发放出射线，人工转变是粒子轰击（如发现中子、质子），裂变是重核分裂，聚变是轻核聚合，用反应特点区分。","example":"例：N14+He4→O17+H1是人工转变，U235+n→裂变产物是裂变；自发放出射线是衰变，轻核聚合成重核是聚变。","tip":"自发是衰变、轰击是人工、重核分裂聚合成。"},"4|4|d|2":{"explain":"质能方程计算：质量亏损Δm=反应前总质量减反应后总质量，ΔE=Δmc^2，单位可用u乘931.5MeV，注意反应前要包括入射粒子质量。","example":"例：反应前后质量差0.0186u，ΔE=0.0186×931.5约17.3MeV。","tip":"Δm是前后总质量差，别漏入射粒子质量。"},"4|4|d|3":{"explain":"三种射线在电场磁场中偏转区分：α带正电、β带负电偏转方向相反，γ不带电不偏转；α质量大偏转小、β质量小偏转大。","example":"例：垂直纸面向外的磁场中，α带正电左偏、β带负电右偏、γ不带电直线通过，据此区分三种射线。","tip":"α正β负γ不带电，偏转方向由此判断。"},"4|4|e|0":{"explain":"核反应方程书写与配平是必考：质量数与电荷数守恒，先写已知核素，未知核素由守恒求出质量数A与电荷数Z，再确定核素名称。","tip":"按质量数、电荷数守恒配平，求未知核素。"},"4|4|e|1":{"explain":"质能方程求核能：ΔE=Δmc^2，单位换算931.5MeV/u，注意质量单位统一。","tip":"1u=931.5MeV，质量亏损算核能。"},"4|4|e|2":{"explain":"半衰期计算：剩余质量与时间关系N=N0(1/2)^(t/τ)，求剩余比例或时间。","tip":"N=N0(1/2)^(t/τ)直接代入。"},"4|4|e|3":{"explain":"三种射线性质与应用：示踪（同位素标记）、放疗（γ射线）、探伤（γ穿透强）、测厚等。","tip":"γ射线穿透力最强，用于探伤与放疗。"},"4|4|e|4":{"explain":"易错点：β衰变是中子转化为质子放出电子、半衰期不适用于个别核。β衰变本质是中子转质子，半衰期是统计规律。","tip":"β衰变中子转质子，半衰期对个别核无意义。"},"4|5|k|0":{"explain":"力学实验：打点计时器测加速度、验证牛顿第二定律、验证机械能守恒、验证动量守恒，核心都是纸带处理：测瞬时速度用平均速度法、求加速度用逐差法。","tip":"力学实验共性是纸带处理，方法统一。"},"4|5|k|1":{"explain":"电学实验：伏安法测电阻、测电源电动势内阻、描绘小灯泡伏安特性、多用电表使用，核心是电路连接、读数规则与数据处理。","tip":"电学实验先画电路图再接线，注意电表量程。"},"4|5|k|2":{"explain":"数据处理核心：图像法（斜率截距）、逐差法、列表法，图像法能直观找关系、减小偶然误差，逐差法利用全部数据。","tip":"图像法处理数据，多组数据减小误差。"},"4|5|k|3":{"explain":"游标卡尺精度0.1/0.05/0.02mm不估读，读数等于主尺读数加游标对齐格数乘精度；螺旋测微器精度0.01mm需估读到0.001mm。","example":"例：游标卡尺20分度，主尺读数加游标第n格乘0.05mm；螺旋测微器读数要估读到第三位小数。","tip":"卡尺不估读、螺旋测微器估读，读数别漏单位。"},"4|5|k|4":{"explain":"电表读数：最小分度为1估读到下一位（如0.1A量程读0.25A），最小分度为2或5按二分之一、五分之一估读（如0.2V读0.14V、0.5V读0.35V）。","example":"例：量程3V电压表最小分度0.1V，读数如2.35V，估读到百分位；最小分度为2或5时按二分之一、五分之一估读。","tip":"分度1估到下一分度，分度2、5按半格或五分之一估。"},"4|5|k|5":{"explain":"滑动变阻器：分压式从零开始、电压调节范围大；限流式省电、接法简单，但电压不能从零调。按实验要求选择接法。","example":"例：描绘小灯泡伏安特性要求电压从零开始，用分压式；粗略测电阻用限流式省电；分压式调节范围大但耗电。","tip":"从零开始调必须分压式，省电用限流式。"},"4|5|k|6":{"explain":"误差分析：系统误差源于实验原理（如内外接选择、伏安法），偶然误差源于读数与测量；系统误差可分析偏大偏小方向，偶然误差靠多次测量减小。","example":"例：伏安法外接测小电阻，电压表分流使电流偏大、R测偏小，属于系统误差；内接时电流表分压使R测偏大。","tip":"系统误差看原理、偶然误差靠多次测量，误差方向要会分析。"},"4|5|d|0":{"explain":"验证牛顿第二定律实验：平衡摩擦力（垫高木板）、m远小于M条件（钩码重力近似等于绳拉力）、a-1/M图不过原点分析（平衡过度或不足）。","example":"例：a-F图像不过原点，纵截距为正说明未完全平衡摩擦力或平衡过度；实验中还需满足m远小于M，使钩码重力近似等于绳拉力。","tip":"平衡摩擦力加远小于条件，图像不过原点分析原因。"},"4|5|d|1":{"explain":"电学实验设计：内外接判断（比较R与根号RVRA）、分压限流选择（从零开始用分压）、电表量程选择（指针偏转过半），综合设计电路。","tip":"大电阻内接小电阻外接，量程选使指针过半。"},"4|5|d|2":{"explain":"测电源电动势内阻三方案：伏安法、安阻法（I-R）、伏阻法（U-R）及误差比较，伏安法电压表分流使E、r偏小，电流表外接时分压使r偏大。","tip":"三种方案图像不同，误差方向要会分析。"},"4|5|d|3":{"explain":"纸带数据处理：逐差法求a=(x4+x5+x6-x1-x2-x3)/9T^2，中间时刻法求瞬时速度v=(x1+x2)/2T，注意单位与T的取值。","tip":"逐差法用全部数据，T是计数点间时间。"},"4|5|d|4":{"explain":"图像处理：U-I图纵截距为E、斜率为r，a-F图不过原点原因分析（平衡摩擦力问题），图像法找规律并减小误差。","tip":"图像斜率截距的物理意义要明确，不过原点找原因。"},"4|5|e|0":{"explain":"力学实验三年必考一题：测加速度与验证机械能守恒频率最高，纸带处理与误差分析是得分点。","tip":"纸带处理要熟练，误差分析写完整不丢分。"},"4|5|e|1":{"explain":"电学实验常考伏安法测电阻与测电源电动势内阻：电路连接、读数、数据处理、误差分析。","tip":"内外接与分压限流选择是电学实验得分关键。"},"4|5|e|2":{"explain":"实验题命题趋势：新情境、开放性问题（改进方案、误差分析），抓住实验原理本质迁移应用。","tip":"新情境实验抓原理本质，迁移已学方法。"},"4|5|e|3":{"explain":"游标卡尺、螺旋测微器读数几乎每年出现：卡尺不估读、螺旋测微器估读到0.001mm。","tip":"读数题要细心，游标卡尺与螺旋测微器估读规则记牢。"},"4|5|e|4":{"explain":"实验原理与误差分析是得分关键，图像处理是重点：原理决定实验方法，误差分析要写出偏大或偏小方向，图像斜率截距要说明物理意义。","tip":"原理决定方法、误差写方向，三步完整作答。"},"4|5|e|5":{"explain":"易错点：有效数字位数、平衡摩擦力漏做、内外接选择错误。读数注意估读，实验操作按规范步骤。","tip":"估读位数、平衡摩擦力、内外接三处易错。"},"4|6|k|0":{"explain":"板块模型：比较μ板地、μ块板判断相对运动：μ块板大于等于μ板地时共速后一起运动，否则板块分离；分段受力分析、画v-t图辅助。","example":"例：μ块板小于μ板地，共速后物块相对木板继续滑动，需分别受力分析；μ块板大于等于μ板地则共速后一起运动。","tip":"比较两μ判断共速后是否一起，画v-t图辅助。"},"4|6|k|1":{"explain":"图像问题：v-t、x-t、a-t、F-t图像转换，斜率、面积、截距的物理意义综合运用，图像之间通过导数、积分关系转换。","tip":"斜率、面积、截距含义逐个明确。"},"4|6|k|2":{"explain":"多过程问题：拆分为匀变速、圆周、平抛等子过程，衔接点速度是桥梁，各段分别列式，能量方法可全程列式更简洁。","tip":"衔接点速度相等，分段列式能量全程。"},"4|6|k|3":{"explain":"传送带问题：水平与倾斜传送带，摩擦力方向随相对运动变化，多段分析：先判断相对运动方向再定摩擦力方向，注意共速后的突变。","tip":"比较物体与带速度定摩擦力，共速后重新判断。"},"4|6|k|4":{"explain":"电磁场综合：带电粒子在电场、磁场、复合场中运动，轨迹与几何结合：电场中类平抛、磁场中圆周运动，衔接点速度是桥梁。","tip":"电场类平抛、磁场圆周，几何关系画准。"},"4|6|k|5":{"explain":"三大观点选择：涉及时间用动量定理、涉及位移用动能定理、系统守恒用动量守恒，选对方法事半功倍。","example":"例：求时间用动量定理Ft=Δp，求位移用动能定理，系统碰撞用动量守恒；按已知量与所求量选观点，事半功倍。","tip":"时间用动量定理、位移用动能定理、系统用动量守恒。"},"4|6|d|0":{"explain":"板块共速后是否一起运动：比较摩擦力条件，μ块板大于等于μ板地则一起减速，否则继续相对滑动；用v-t图判断临界。","tip":"共速后比μ，画v-t图判断临界。"},"4|6|d|1":{"explain":"多过程连接点：速度是各段公共量，碰撞与摩擦生热Q=fΔs相对计算，相对位移要分清是对地位移还是相对位移。","example":"例：摩擦生热Q=fΔs相对，Δs是两物体相对滑过的距离，不是对地位移；传送带痕迹长度也用相对位移。","tip":"生热用相对位移，速度是连接点。"},"4|6|d|2":{"explain":"电磁感应综合：导体棒导轨磁场，用动量定理求电荷量与位移：q=nΔΦ/R、BILt=mΔv，能量守恒求热量。","tip":"动量定理求q和位移，能量守恒求热量。"},"4|6|d|3":{"explain":"多图结合互推：F-t、v-t、B-t图像综合分析，注意坐标起点与单位，图像间关系用物理规律联系（F=ma、E=nΔΦ/Δt）。","tip":"多图互推注意单位与起点，用规律联系。"},"4|6|d|4":{"explain":"三大观点选择与转换：时间、位移、系统守恒三类问题方法不同，先分析已知量与所求量再选方法，可用多种方法相互验证。","tip":"按已知量选观点，时间位移系统三选一。"},"4|6|e|0":{"explain":"板块模型是力学压轴常客：多过程加摩擦力突变加临界，画v-t图辅助分析，分段列牛顿定律与运动学方程。","tip":"v-t图辅助，共速与相对滑动分界。"},"4|6|e|1":{"explain":"电磁场综合题常为物理卷最后压轴：轨迹分析加几何计算加能量动量综合，画轨迹图是关键。","tip":"画轨迹找圆心，几何关系列方程。"},"4|6|e|2":{"explain":"图像题每年必考：选择题与实验题都涉及，先看坐标轴再分析，斜率、面积、截距的物理意义要熟练运用并会互相转换。","tip":"先看坐标轴再分析，斜率、面积、截距含义逐个用。"},"4|6|e|3":{"explain":"传送带与能量结合：摩擦生热Q=fΔs相对计算，电动机多消耗的电能等于物块动能增加加摩擦生热。","tip":"摩擦生热用相对位移，能量转化理清。"},"4|6|e|4":{"explain":"多过程与能量结合：动能定理与机械能守恒综合应用，全程列式比分段更简洁，注意各力做功的正负与能量转化方向。","tip":"全程动能定理，注意各力做功正负。"},"4|6|e|5":{"explain":"易错点：板块共速后摩擦力突变、传送带痕迹长度用相对位移。共速后重新判断摩擦力，痕迹长度等于相对位移。","tip":"共速后判突变，痕迹用相对位移。"}},"chemistry":{"0|0|k|0":{"explain":"先看是否由一种物质组成：由一种物质组成且组成固定的是纯净物，否则是混合物。纯净物再按元素种类分单质和化合物。树状分类法先粗后细、层层细分，做到不重不漏。","example":"例：O2、NaOH是纯净物；空气和NaCl溶液是混合物，因为后者都由多种物质组成。","tip":"单质和化合物都是纯净物；溶液、空气、合金都是混合物。"},"0|0|k|1":{"explain":"分散系都是混合物，核心看分散质粒子直径：小于1 nm是溶液，1~100 nm是胶体，大于100 nm是浊液。直径决定稳定性：溶液最稳定、胶体较稳定、浊液易沉降。","example":"例：FeCl3饱和溶液滴入沸水得红褐色胶体（直径1~100 nm）；滴入NaOH溶液则生成沉淀，属浊液。","tip":"胶体与溶液、浊液的本质区别是粒子直径，不是颜色和透明度。"},"0|0|k|2":{"explain":"胶粒直径与光波长相近，光通过时发生散射形成明亮光路，即丁达尔效应，溶液无此现象。布朗运动是胶粒受分子撞击做无规则运动；电泳是胶粒在电场下定向移动，说明胶粒带电。","example":"例：用激光笔照射，出现明亮光路的是胶体，无光路的是溶液，这就是丁达尔效应，常用于鉴别。","tip":"丁达尔效应是胶体特征现象，但浊液也可能有类似现象，不能单凭它区分胶体与浊液。"},"0|0|k|3":{"explain":"原理是FeCl3在沸水中水解生成Fe(OH)3胶体，方程式写「Fe(OH)3(胶体)」不写沉淀符号。操作要点：饱和溶液逐滴滴入沸水，加热至红褐色立即停止；搅拌或久煮会聚沉。","example":"例：向沸水中滴加饱和FeCl3溶液至红褐色即得胶体；若继续煮沸，胶体聚沉为红褐色沉淀。","tip":"制备必须用沸水而非冷水，且不能搅拌、不能久煮，否则胶体变沉淀。"},"0|0|k|4":{"explain":"胶体稳定靠胶粒带电相互排斥，破坏稳定性就能聚沉。加电解质中和胶粒电荷，加热加快胶粒碰撞，加带相反电荷的胶体相互中和电荷，均可使胶粒聚集成大颗粒而沉降。","example":"例：豆浆是蛋白质胶体，点卤加盐卤中和胶粒电荷使胶粒聚沉，蛋白质与水分离成豆腐，体现加电解质聚沉。","tip":"聚沉是物理变化，加电解质、加热、加相反电荷胶体三种方法都要记住。"},"0|0|k|5":{"explain":"各类物质有通性：金属单质可与非金属、酸反应；酸性氧化物与水生成酸、与碱生成盐；碱与酸性氧化物、酸、盐反应。抓住通性可推未知反应，如CaO遇水生成Ca(OH)2。","example":"例：CaO+H2O=Ca(OH)2，Ca(OH)2+CO2=CaCO3↓+H2O，体现碱性氧化物到碱到盐的转化。","tip":"通性有适用范围，如酸性氧化物SiO2不与水反应，特殊性质需单独记。"},"0|0|d|0":{"explain":"判断分散系类型唯一标准是分散质粒子直径：溶液小于1 nm、胶体1~100 nm、浊液大于100 nm。有的胶体也有颜色、也透明，所以不能凭透明、颜色、均一判断。","example":"例：Fe(OH)3胶体是红褐色透明液体，与CuSO4蓝色溶液外观相似，但前者粒子直径1~100 nm属胶体。","tip":"看到「透明、有色」不能断言是溶液，先想粒子直径。"},"0|0|d|1":{"explain":"胶体是电中性的，带电的是胶粒——它吸附了溶液中的离子，如Fe(OH)3胶粒带正电。电泳时带正电的胶粒向阴极移动，说明带电的是胶粒而非整个胶体。","example":"例：将Fe(OH)3胶体通电，阴极附近红褐色加深，说明带正电的胶粒移向阴极，即电泳。","tip":"「胶体带电」是错误说法，应为「胶粒带电」；胶体整体呈电中性。"},"0|0|d|2":{"explain":"丁达尔效应的本质是胶粒直径与光波长相近发生光的散射；浊液粒子太大主要反射光，但浓浊液在光照下也可能出现光路。区分胶体与浊液要看粒子直径和稳定性。","example":"例：泥水在激光照射下也有明亮光路，但它是不稳定易沉降的浊液，不能因为有光路就说是胶体。","tip":"丁达尔效应只能区分胶体和溶液；区分胶体与浊液要看直径与稳定性。"},"0|0|d|3":{"explain":"制备中加热使水解加快生成胶体，但长时间煮沸或搅拌使胶粒碰撞加剧、失去电荷保护而聚沉，红褐色胶体变成红褐色沉淀。题目常考「继续加热会怎样」，答案是聚沉。","example":"例：制Fe(OH)3胶体时加热过度，体系由红褐色胶体变为红褐色沉淀，此过程是胶体聚沉。","tip":"久煮或搅拌导致聚沉，现象是出现沉淀，而不是颜色变浅。"},"0|0|e|0":{"explain":"正误判断题高频陷阱：胶体不带电但胶粒带电；丁达尔效应只能区分溶液与胶体；渗析用半透膜分离胶体与溶液中的小分子离子；布朗运动不是胶体独有。","tip":"见「胶体带电」即错，正确说法是胶粒带电；渗析分离胶粒与小分子。"},"0|0|e|1":{"explain":"胶体实例要熟记：烟、云、雾是气溶胶，豆浆、牛奶、血液、墨水、Fe(OH)3胶体是液溶胶。判断关键是分散质粒子直径在1~100 nm。","tip":"淀粉溶液是胶体、蔗糖溶液是溶液；烟、云、雾都是气溶胶。"},"0|0|e|2":{"explain":"同是FeCl3，环境不同产物不同：滴入沸水发生水解生成Fe(OH)3胶体；滴入NaOH溶液发生复分解反应生成红褐色Fe(OH)3沉淀。","tip":"沸水得胶体、NaOH得沉淀，关键看反应是水解还是复分解。"},"0|0|e|3":{"explain":"纳米材料的粒子直径常在1~100 nm，落在胶体范围，故其分散系具有丁达尔效应等胶体性质。这类题本质还是考胶体定义，抓「直径1~100 nm」判断即可。","tip":"纳米材料本身不是胶体，其分散系才是；看直径是否在胶体范围。"},"0|1|k|0":{"explain":"判断电解质先看是不是化合物：水溶液或熔融状态下能导电的化合物是电解质，两种状态下都不导电的是非电解质。单质和混合物既不是电解质也不是非电解质。","example":"例：NaCl、H2SO4、NaOH是电解质；蔗糖、酒精、CO2是非电解质；铜和盐酸都不是电解质。","tip":"单质和混合物永远不参与电解质判断；CO2、SO2、NH3导电靠生成物。"},"0|1|k|1":{"explain":"强弱电解质看电离程度：完全电离的是强电解质，包括强酸、强碱和大多数盐；部分电离的是弱电解质，包括弱酸、弱碱和水。强弱与溶解性、导电能力无关。","example":"例：CaCO3难溶于水但溶于水的部分完全电离，是强电解质；CH3COOH易溶于水但部分电离，是弱电解质。","tip":"难溶盐（CaCO3、BaSO4）是强电解质；NH3·H2O、CH3COOH、水是弱电解质。"},"0|1|k|2":{"explain":"书写流程：先写化学方程式，再把溶于水的强电解质拆成离子，删去两边相同离子，最后检查原子守恒与电荷守恒。拆写规则：强酸、强碱、可溶性盐拆，其余不拆。","example":"例：NaOH与CuSO4反应，写方程后拆开，删去两边重复的Na+，得Cu2++2OH-=Cu(OH)2↓。","tip":"拆与不拆是核心：弱电解质、沉淀、气体、氧化物一律不拆。"},"0|1|k|3":{"explain":"复分解型离子反应能否进行看产物：有沉淀、气体或弱电解质（水、弱酸、弱碱）生成即可发生。此外氧化还原型离子反应只要满足电子转移也能发生。","example":"例：CaCl2与Na2CO3反应生成CaCO3沉淀能发生；NaCl与KNO3混合无沉淀、气体、水生成，不能发生。","tip":"离子共存题就用这个条件判断：三种产物型加氧化还原型。"},"0|1|k|4":{"explain":"记牢常见有色离子：Cu2+蓝色、Fe3+黄色、Fe2+浅绿色、MnO4-紫红色。无色溶液题先排除这些离子；K+、Na+、Cl-、SO4(2-)、NO3-均无色。","example":"例：某无色溶液中不可能大量存在Cu2+、Fe3+、Fe2+、MnO4-，因为这四种离子均有颜色。","tip":"无色溶液一定不含Cu2+、Fe3+、Fe2+、MnO4-等有色离子。"},"0|1|k|5":{"explain":"判断正误三步走：一看是否符合客观事实（产物是否正确，如Fe与盐酸生成Fe2+不是Fe3+）；二看拆写是否正确；三看两边原子数与电荷是否守恒。","example":"例：Fe+2H+=Fe3++H2↑错误，事实是Fe+2H+=Fe2++H2↑且电荷不守恒。","tip":"检查顺序固定：事实、拆写、守恒，先看事实最省时间。"},"0|1|d|0":{"explain":"微溶物（Ca(OH)2、CaSO4等）拆不拆看状态：作反应物若是澄清溶液（如澄清石灰水）写成离子，若是悬浊液（石灰乳）不拆；作生成物一律写沉淀不拆。","example":"例：CO2通入澄清石灰水：CO2+Ca2++2OH-=CaCO3↓+H2O；用石灰乳吸收Cl2时Ca(OH)2不拆。","tip":"澄清石灰水拆、石灰乳不拆；微溶物作生成物一律不拆。"},"0|1|d|1":{"explain":"浓盐酸含大量H+和Cl-，拆写；浓硫酸主要以H2SO4分子存在，不拆；浓硝酸虽浓但完全电离，拆写。这与MnO2+4HCl(浓)制Cl2中HCl拆为H+和Cl-一致。","example":"例：MnO2与浓盐酸共热：MnO2+4H++2Cl-=Mn2++Cl2↑+2H2O，浓盐酸拆、MnO2不拆。","tip":"浓硫酸不拆、浓盐酸和浓硝酸拆，写方程式先看试剂状态。"},"0|1|d|2":{"explain":"NH4HCO3中HCO3-与NH4+都能与OH-反应，且HCO3-优先。过量NaOH时两个反应都进行，总量式：NH4++HCO3-+2OH-=NH3↑+CO3(2-)+2H2O。","example":"例：NH4HCO3与过量NaOH反应：NH4++HCO3-+2OH-=NH3↑+CO3(2-)+2H2O。","tip":"过量问题先写总量：各离子按需配足，勿漏NH4+的反应。"},"0|1|d|3":{"explain":"互滴顺序决定反应进程：盐酸滴入Na2CO3先生成HCO3-无气泡，过量后再放CO2；Na2CO3滴入盐酸则立即放CO2。AlCl3与NaOH互滴现象也相反。","example":"例：向Na2CO3中滴盐酸：CO3(2-)+H+=HCO3-；向盐酸中滴Na2CO3：CO3(2-)+2H+=CO2↑+H2O。","tip":"互滴题先确定「谁过量」，少量物质按1 mol定计量关系。"},"0|1|e|0":{"explain":"考场快检三步：一看产物事实（如Na2O2与水、Fe与稀硝酸的产物），二看拆写（弱电解质、沉淀、气体不拆），三看原子电荷守恒。先找明显错误再细看。","tip":"用「事实、拆写、守恒」三把尺子逐项排除，先排明显的。"},"0|1|e|1":{"explain":"审题先抓隐含条件：无色排除有色离子；pH=1是强酸性，排除OH-、CO3(2-)等；与Al放出H2可能是强酸（无NO3-）或强碱；水电离c(H+)=1×10-13则溶液酸碱两可。","example":"例：pH=1的溶液中，OH-、CO3(2-)、S2-、SO3(2-)不能大量共存，因为都与H+反应。","tip":"水电离出10-13 mol/L时溶液可能是强酸也可能是强碱，两种情况都要想。"},"0|1|e|2":{"explain":"与量有关先定「少量物质」：少量物质按1 mol完全反应，确定它消耗的离子比例，再写方程式。过量与少量、滴加顺序不同都可能改变产物。","example":"例：少量CO2通入NaOH：CO2+2OH-=CO3(2-)+H2O；过量CO2：CO2+OH-=HCO3-。","tip":"少量物质按1 mol写，这是与量问题统一突破口。"},"0|1|e|3":{"explain":"实验情境题把离子反应放进操作里考：除杂用沉淀或气体反应，检验用特征现象反应，洗涤验证是否洗净看滤液中是否还有特征离子。","tip":"洗涤检验是否洗净：取最后一次洗涤液检验其中特征离子。"},"0|2|k|0":{"explain":"本质是电子转移（得失或偏移），特征是化合价升降：有元素化合价变化的反应就是氧化还原反应。判断某反应是否氧化还原，先标出各元素化合价，看有无升降。","example":"例：2Na+Cl2=2NaCl中Na由0升到+1、Cl由0降到-1，是氧化还原反应；NaCl+AgNO3=AgCl↓+NaNO3价态不变，不是。","tip":"判断氧化还原反应唯一依据是化合价有无升降，与有无氧气无关。"},"0|2|k|1":{"explain":"口诀「升失氧、降得还」：化合价升高的物质失电子，是还原剂，被氧化，发生氧化反应；化合价降低的物质得电子，是氧化剂，被还原，发生还原反应。","example":"例：CuO+H2=Cu+H2O中H由0升到+1失电子，是还原剂被氧化；Cu由+2降到0得电子，是氧化剂被还原。","tip":"记住「升失氧化还原剂」：升高、失电子、被氧化、作还原剂四者一体。"},"0|2|k|2":{"explain":"常见氧化剂都是易得电子的物质：活泼非金属单质O2、Cl2，含高价态元素的酸浓H2SO4、HNO3，以及KMnO4、K2Cr2O7、H2O2、Fe3+，它们化合价有下降空间。","example":"例：氧化性由强到弱常排序Cl2大于KMnO4大于H2O2大于Fe3+，高价态物质多作氧化剂。","tip":"氧化剂看「化合价有下降空间」，高价态元素化合物多为氧化剂。"},"0|2|k|3":{"explain":"还原剂是易失电子的物质：活泼金属（Na、Mg、Al、Zn、Fe）、非金属单质H2、C，低价态化合物CO、SO2、H2S，以及Fe2+、I-等，它们化合价有上升空间。","example":"例：Zn与CuSO4反应中Zn由0升到+2作还原剂；CO还原CuO时C由+2升到+4作还原剂。","tip":"低价态是还原剂，高价态是氧化剂，中间价态两者皆可。"},"0|2|k|4":{"explain":"由自发反应比较强弱：氧化性顺序为氧化剂大于氧化产物，还原性顺序为还原剂大于还原产物。如Fe+Cu2+=Fe2++Cu中氧化性Cu2+大于Fe2+。多个反应用传递性排序。","example":"例：由2Fe3++2I-=2Fe2++I2知氧化性Fe3+大于I2；由Cl2+2Fe2+=2Fe3++2Cl-知Cl2大于Fe3+，故Cl2大于Fe3+大于I2。","tip":"比较强弱只比「氧化剂与氧化产物」，中间物质不参与比较。"},"0|2|k|5":{"explain":"化合价升降法五步：标出变价元素化合价，列出升降数值，求最小公倍数确定系数比，先配平变价物质，再用观察法配平不变价物质，最后检查原子与电荷守恒。","example":"例：配平Cu与稀硝酸：Cu升2、N降3，最小公倍数6，得3Cu和2NO，配平为3Cu+8HNO3=3Cu(NO3)2+2NO↑+4H2O。","tip":"检查时数两边原子数和电荷，尤其H、O个数。"},"0|2|k|6":{"explain":"双线桥：两条线分别从氧化剂指向还原产物、还原剂指向氧化产物，线上标「得e-×n」或「失e-×n」；单线桥：一条线从还原剂指向氧化剂，标转移电子总数，不标得失。","example":"例：2Na+Cl2=2NaCl用单线桥：从Na指向Cl2，标「2e-」，表示Na共失2 mol电子转移给Cl2。","tip":"双线桥标得失、单线桥标总数不标得失，箭头方向别画反。"},"0|2|d|0":{"explain":"Na2O2中氧为-1价，与水反应时歧化：一半升到0价生成O2，一半降到-2价。2 mol Na2O2转移2 mol电子，故1 mol只转移1 mol电子，是NA题高频陷阱。","example":"例：1 mol Na2O2与足量水反应生成0.5 mol O2，转移电子1 mol；1 mol Cl2与NaOH歧化也转移1 mol电子。","tip":"歧化反应电子转移按「得电子数」算，勿按化学计量数翻倍。"},"0|2|d|1":{"explain":"有的反应中氧化剂或还原剂部分参与氧化还原，其余起酸性或成盐作用。MnO2+4HCl(浓)反应中4 mol HCl只有2 mol被氧化，转移2 mol电子。","example":"例：该反应中4 mol HCl参与，被氧化的HCl为2 mol，转移电子2 mol，生成Cl2为1 mol。","tip":"先算被氧化或被还原的物质的量，再乘每摩尔转移电子数。"},"0|2|d|2":{"explain":"写陌生氧化还原方程式：先找变价元素定氧化剂、还原剂及产物，用化合价升降法配平变价物质，再根据介质（酸性补H+、碱性补OH-）配平电荷，最后用H2O配平氢氧原子。","example":"例：酸性KMnO4氧化Fe2+：MnO4-+5Fe2++8H+=Mn2++5Fe3++4H2O，先配平电子转移再补H+。","tip":"介质判断：酸性补H+、碱性补OH-、中性看产物，最后用H2O配平。"},"0|2|d|3":{"explain":"同一元素不同价态相遇，高价降、低价升，产物价态介于两者之间且「就近归中不交叉」：如H2S与SO2反应中-2价与+4价都归中到0价。歧化则是同价态既升又降。","example":"例：2H2S+SO2=3S+2H2O中S由-2和+4归中到0价，符合就近归中；写中间价态产物则违背不交叉原则。","tip":"归中产物的价态不能超过反应物中较高价态，画数轴检查交叉。"},"0|2|e|0":{"explain":"先标化合价找变价元素，判断谁得电子谁失电子，再按「每摩尔转移电子数×物质的量」算总数。与NA结合时注意歧化、部分氧化还原、可逆反应三类陷阱。","tip":"转移电子数=被氧化（或还原）物质的量×每个粒子转移电子数。"},"0|2|e|1":{"explain":"依据「强者优先」规律：氧化性强的氧化剂可氧化还原性强的还原剂，反应方向是强氧化剂+强还原剂生成弱氧化剂+弱还原剂。","tip":"反应能否发生看「强者组合」：强氧化剂配强还原剂才反应。"},"0|2|e|2":{"explain":"套路固定：标价态→找升降→最小公倍数→配平变价物质→补介质配电荷→H2O配氢氧。介质由溶液酸碱性决定，写完后检查原子与电荷守恒。","tip":"补介质口诀：酸性补H+、碱性补OH-，缺几个补几个。"},"0|2|e|3":{"explain":"滴定计算用电子守恒：氧化剂得电子总数等于还原剂失电子总数。KMnO4滴定草酸：Mn由+7降到+2得5 e-，C2O4(2-)中C由+3升到+4失2 e-，据此列比例求浓度。","example":"例：c(KMnO4)=0.02 mol/L滴定25 mL草酸耗20 mL，n(KMnO4)×5=n(H2C2O4)×2，得c(H2C2O4)=0.1 mol/L。","tip":"滴定计算只列电子守恒，别写化学方程式硬算。"},"0|3|k|0":{"explain":"钠是银白色软金属，密度0.97 g/cm3，比水小比煤油大，所以浮在水面、沉在煤油中。熔点低，与水反应时熔成小球。因钠极易与O2、H2O反应，保存在煤油中。","example":"例：钠块投入水中浮在水面（密度小于水）；保存在煤油中，煤油密度比钠小，钠沉底且隔绝空气和水。","tip":"密度比水小比煤油大：浮水面、沉煤油，故保存在煤油中。"},"0|3|k|1":{"explain":"现象口诀「浮熔游响红」：钠浮在水面、熔成闪亮小球（反应放热熔点低）、四处游动（H2推动）、发出嘶嘶响声（反应剧烈）、滴酚酞变红（生成NaOH）。","example":"例：钠投入滴有酚酞的水中，浮水面熔成小球游动，溶液变红，方程式2Na+2H2O=2NaOH+H2↑。","tip":"现象按「浮熔游响红」五字记，答题时五条齐全才完整。"},"0|3|k|2":{"explain":"条件决定产物：常温缓慢氧化生成白色Na2O（4Na+O2=2Na2O）；点燃或加热生成淡黄色Na2O2。钠表面变暗就是生成了Na2O，考试常考条件与产物颜色的对应。","example":"例：钠在空气中点燃产生黄色火焰，生成淡黄色Na2O2；切开钠表面很快变暗是生成了Na2O。","tip":"常温Na2O白、点燃Na2O2淡黄，写方程式先看条件。"},"0|3|k|3":{"explain":"Na2O2与水、CO2反应都生成O2，可用作供氧剂（如潜艇、呼吸面具）。两个方程式计量关系相同：2 mol Na2O2对应1 mol O2，且Na2O2中氧元素发生歧化。","example":"例：2Na2O2+2CO2=2Na2CO3+O2，吸收CO2同时放出O2，1 mol Na2O2转移1 mol电子。","tip":"两个反应都是2 mol Na2O2产1 mol O2，每摩尔Na2O2转移1 mol电子。"},"0|3|k|4":{"explain":"Na2O2中氧为-1价中间价态，与水、CO2反应时既升到0价又降到-2价，自身既是氧化剂又是还原剂。因其有强氧化性可漂白，又因放出O2可作供氧剂。","example":"例：Na2O2与水反应中氧从-1价歧化为0价和-2价，既作氧化剂又作还原剂，同时体现漂白和供氧用途。","tip":"-1价氧可升可降，说Na2O2「只作氧化剂」是错的。"},"0|3|k|5":{"explain":"NaHCO3受热分解生成Na2CO3、水和CO2，Na2CO3受热稳定不分解，故可用加热法鉴别或除杂：加热可除去Na2CO3中的NaHCO3。","example":"例：将固体加热，产生使澄清石灰水变浑浊气体的是NaHCO3，不产生的是Na2CO3。","tip":"鉴别二者先考虑加热，NaHCO3分解、Na2CO3稳定。"},"0|3|k|6":{"explain":"顺序不同反应分步不同：Na2CO3滴入盐酸（盐酸过量）立即放CO2；盐酸滴入Na2CO3先发生CO3(2-)+H+=HCO3-无气泡，过量后才放CO2。","example":"例：向Na2CO3溶液中逐滴加盐酸，开始无气泡后产生气泡；向盐酸中逐滴加Na2CO3，立即产生气泡。","tip":"互滴鉴别：谁滴谁决定先发生哪步反应，现象不同可互相鉴别。"},"0|3|d|0":{"explain":"钠太活泼，遇水先反应：2Na+2H2O=2NaOH+H2↑，NaOH再与CuSO4反应生成Cu(OH)2蓝色沉淀，不会置换出Cu。总反应可合并书写。","example":"例：钠投入CuSO4溶液：浮熔游响后生成蓝色Cu(OH)2沉淀，方程式2Na+CuSO4+2H2O=Cu(OH)2↓+Na2SO4+H2↑。","tip":"钠与任何盐溶液反应都先与水反应，产物是碱和H2。"},"0|3|d|1":{"explain":"Na2O2中氧-1价，反应时部分升到0价生成O2、部分降到-2价，属于歧化。2 mol Na2O2完全反应转移2 mol电子，所以1 mol Na2O2只转移1 mol电子。","example":"例：2Na2O2+2H2O=4NaOH+O2↑中2 mol Na2O2转移2 mol电子，故1 mol Na2O2转移1 mol电子。","tip":"每摩尔Na2O2参与反应转移1 mol电子，与H2O还是CO2反应无关。"},"0|3|d|2":{"explain":"Na2CO3转化为NaHCO3：通入过量CO2（Na2CO3+CO2+H2O=2NaHCO3）；NaHCO3转化为Na2CO3：加热分解，或加适量NaOH。","example":"例：除去Na2CO3中的NaHCO3用加热；除去NaHCO3溶液中的Na2CO3通入足量CO2。","tip":"转化方向配试剂：正方向通CO2，反方向加热或加NaOH。"},"0|3|d|3":{"explain":"原理是氨盐水吸收CO2生成溶解度较小的NaHCO3析出。先通NH3使溶液呈碱性、增大CO2吸收量，再通CO2；NaHCO3溶解度小析出，母液中NH4Cl可作氮肥。","example":"例：饱和食盐水中先通足量NH3再通CO2，析出NaHCO3晶体，过滤后母液含NH4Cl。","tip":"顺序是「先氨后碳」，先通CO2则吸收量太少，产量低。"},"0|3|e|0":{"explain":"钠的焰色反应呈黄色，是Na元素的特征，可鉴别钠元素（用洁净铂丝蘸取）。注意焰色反应是物理变化，鉴别的是元素而非单质。","tip":"焰色反应是物理变化，黄色焰色鉴别钠元素而非钠单质。"},"0|3|e|1":{"explain":"Na2O2与CO2、H2O反应时固体质量增加：2Na2O2+2CO2生成2Na2CO3+O2，相当于固体增重2 mol CO的质量，即吸收CO、放出O2。用差量法巧算。","example":"例：2Na2O2+2CO2=2Na2CO3+O2中气体体积减少1体积，固体增重为2 mol CO的质量56 g。","tip":"差量法：固体增重等于吸收气体质量减去放出O2质量。"},"0|3|e|2":{"explain":"鉴别方法：加热看能否产生CO2；加盐酸看气泡快慢（NaHCO3更剧烈）；加CaCl2，Na2CO3生成白色沉淀而NaHCO3无现象。除杂：Na2CO3中除NaHCO3用加热。","example":"例：分别向两溶液中加CaCl2，产生白色沉淀的是Na2CO3，无明显现象的是NaHCO3。","tip":"加CaCl2鉴别最清晰；加盐酸鉴别注意「立即」与「随后」现象。"},"0|3|e|3":{"explain":"熟记转化链：Na→Na2O或Na2O2→NaOH→Na2CO3→NaHCO3。推断题抓住颜色（Na2O白、Na2O2淡黄）、与H2O和CO2反应差异以及黄色焰色来定位钠元素。","tip":"看到淡黄色固体优先想到Na2O2，看到黄色火焰想到钠。"},"0|4|k|0":{"explain":"Cl2是黄绿色有刺激性气味的有毒气体，密度比空气大，可溶于水，加压易液化。因有毒，制取时尾气用NaOH溶液吸收：Cl2+2NaOH=NaCl+NaClO+H2O。","example":"例：实验室制Cl2后尾气通入NaOH溶液吸收，方程式Cl2+2NaOH=NaCl+NaClO+H2O。","tip":"收集用向上排空气法，尾气必须用NaOH溶液吸收防污染。"},"0|4|k|1":{"explain":"Cl2氧化性强，与变价金属反应生成高价氯化物：Cu生成CuCl2（棕黄色烟）、Fe生成FeCl3（棕褐色烟）。与H2点燃产生苍白色火焰，生成HCl；混合光照会爆炸。","example":"例：铁丝在Cl2中燃烧生成FeCl3（棕褐色烟）：2Fe+3Cl2=2FeCl3，不能生成FeCl2。","tip":"Cl2与变价金属反应一律生成高价氯化物，是FeCl3不是FeCl2。"},"0|4|k|2":{"explain":"Cl2溶于水部分与水反应生成HCl和HClO，是可逆反应。新制氯水中含三分子（Cl2、HClO、H2O）和四离子（H+、Cl-、ClO-、少量OH-），Cl2分子使溶液呈浅黄绿色。","example":"例：新制氯水滴入石蕊先变红（H+酸性）后褪色（HClO漂白），说明氯水既有酸性又有漂白性。","tip":"氯水成分「三分子四离子」要会默写，久置后只剩稀盐酸。"},"0|4|k|3":{"explain":"HClO是弱酸（酸性比碳酸弱），有强氧化性能杀菌消毒、漂白（氧化型漂白不可逆）；不稳定，见光分解成HCl和O2，所以氯水要避光保存，久置氯水只剩稀盐酸。","example":"例：久置氯水无色无漂白性，有效成分HClO已分解：2HClO=2HCl+O2↑，故氯水要现用现配。","tip":"HClO漂白是氧化型、不可逆，见光分解导致氯水变质。"},"0|4|k|4":{"explain":"Cl2与碱反应生成氯化物、次氯酸盐和水（歧化）。与NaOH反应制漂白液，与石灰乳反应制漂白粉，漂白粉成分为Ca(ClO)2和CaCl2混合物，有效成分是Ca(ClO)2。","example":"例：工业制漂白粉：2Cl2+2Ca(OH)2=Ca(ClO)2+CaCl2+2H2O，须用石灰乳而非澄清石灰水。","tip":"漂白粉有效成分Ca(ClO)2，成分为混合物，两者别混。"},"0|4|k|5":{"explain":"漂白粉不直接漂白，需与空气中CO2、H2O反应生成HClO：Ca(ClO)2+CO2+H2O=CaCO3+2HClO，HClO氧化有色物质，这是漂白原理。","example":"例：漂白粉露置空气中：Ca(ClO)2+CO2+H2O=CaCO3+2HClO，HClO再分解使漂白粉失效。","tip":"漂白粉失效两步：先生成HClO，HClO再见光分解。"},"0|4|k|6":{"explain":"实验室用MnO2氧化浓盐酸制Cl2，条件缺一不可：浓盐酸（稀盐酸不反应）和加热。装置顺序：发生、除杂（饱和食盐水）、干燥（浓硫酸）、收集（向上排空气）、尾气（NaOH吸收）。","example":"例：制Cl2时若盐酸变稀，反应停止，剩余MnO2不再反应，故要缓慢滴加浓盐酸并加热。","tip":"稀盐酸与MnO2不反应，制Cl2必须浓盐酸且加热。"},"0|4|d|0":{"explain":"新制氯水含Cl2、HClO、H2O及H+、Cl-、ClO-，呈浅黄绿色有漂白性；久置后HClO见光分解（2HClO=2HCl+O2↑），最终只剩稀盐酸，无色无漂白性。","example":"例：新制氯水滴加石蕊先变红后褪色，久置氯水只变红不褪色，因HClO已分解完，成分变为稀盐酸。","tip":"看到「久置氯水」立刻想到只剩HCl，无Cl2无HClO。"},"0|4|d|1":{"explain":"装置与试剂选择有讲究：饱和食盐水能溶解HCl而抑制Cl2溶解，用来除HCl；浓硫酸作干燥剂；Cl2密度大于空气用向上排空气法；Cl2有毒且溶于水，不能用排水法。","example":"例：制纯净Cl2顺序：发生→饱和食盐水（除HCl）→浓硫酸（干燥）→向上排空气收集→NaOH尾气吸收。","tip":"除杂「先除HCl后干燥」，顺序颠倒则Cl2含水不纯。"},"0|4|d|2":{"explain":"漂白粉久置空气中：先发生Ca(ClO)2+CO2+H2O=CaCO3+2HClO，HClO再见光分解（2HClO=2HCl+O2↑），次氯酸盐不断消耗而失效，所以密封避光保存。","example":"例：漂白粉敞口久置会失效，因Ca(ClO)2先与CO2、H2O生成HClO，HClO再分解，有效成分不断损耗。","tip":"失效是两步：生成HClO加HClO分解，回答要写全两步。"},"0|4|d|3":{"explain":"Cl2氧化性强，与变价金属Fe、Cu直接化合生成高价盐：Fe生成FeCl3、Cu生成CuCl2。Cl2与FeCl2溶液反应也生成FeCl3：2FeCl2+Cl2=2FeCl3。","example":"例：Cl2与Fe反应2Fe+3Cl2=2FeCl3；而Fe与盐酸反应生成FeCl2，条件不同产物不同。","tip":"氯气与铁只生成三价铁，盐酸与铁生成二价铁。"},"0|4|e|0":{"explain":"检验氯水成分：加石蕊先变红（H+）后褪色（HClO漂白）；加AgNO3产生白色沉淀（Cl-）；加NaHCO3产生气泡（H+）；久置氯水性质变化（HClO分解）。","tip":"检验Cl-先加稀硝酸酸化排除CO3(2-)干扰，再加AgNO3。"},"0|4|e|1":{"explain":"装置连接顺序固定：发生→除杂（饱和食盐水除HCl）→干燥（浓硫酸）→收集（向上排空气）→尾气（NaOH）。注意洗气瓶长进短出，尾气吸收可用倒扣漏斗防倒吸。","tip":"洗气瓶「长进短出」，收集「向上排空气」，尾气NaOH吸收。"},"0|4|e|2":{"explain":"HClO漂白是氧化型：氧化有色物质生成无色物质，不可逆，加热不复色；SO2漂白是化合型：与有色物质结合成不稳定无色物质，可逆，加热恢复红色。","tip":"氧化漂白不可逆、化合漂白可逆，用加热复色实验鉴别。"},"0|4|e|3":{"explain":"检验Cl-先加稀硝酸酸化（排除CO3(2-)、SO3(2-)等干扰），再加AgNO3，若产生不溶于稀硝酸的白色沉淀（AgCl）则含Cl-。","example":"例：检验NaCl中的Cl-：先加足量稀硝酸无沉淀，再加AgNO3出现白色沉淀，证明含Cl-。","tip":"顺序是先加硝酸酸化再加AgNO3，先加AgNO3会被碳酸根干扰。"},"0|5|k|0":{"explain":"物质的量是七个基本物理量之一，衡量微观粒子（分子、原子、离子、电子）数目的集合，单位mol。1 mol任何粒子含NA个粒子，NA约6.02×10的23次方每摩尔。n=N/NA。","example":"例：1 mol H2O含NA个水分子、2NA个H原子；说「1 mol 氧」不指明是O还是O2就不规范。","tip":"使用mol必须指明粒子种类，「1 mol 氧」是错误表述。"},"0|5|k|1":{"explain":"摩尔质量是单位物质的量的物质的质量，数值等于相对原子或相对分子质量，但单位不同（g/mol）。如M(H2O)=18 g/mol与Mr(H2O)=18数值相等。m=n·M。","example":"例：9 g H2O的物质的量n=m/M=9/18=0.5 mol，含0.5 mol水分子。","tip":"摩尔质量数值与相对分子质量相同但单位是g/mol，别写漏单位。"},"0|5|k|2":{"explain":"气体摩尔体积是单位物质的量的气体所占体积，标准状况（0 ℃、101 kPa）下约22.4 L/mol。使用前提：标准状况且是气体。同温同压下Vm相同，与气体种类无关。","example":"例：标准状况下11.2 L CO2的物质的量为11.2/22.4=0.5 mol，质量为0.5×44=22 g。","tip":"22.4 L/mol只在标准状况且是气体时可用，看到「常温常压」即错。"},"0|5|k|3":{"explain":"阿伏加德罗定律：同温同压下，同体积的气体含相同分子数。推论：同温同压下体积比等于物质的量比；密度比等于摩尔质量比；同温同容下压强比等于物质的量比。","example":"例：同温同压下，2 g H2与16 g O2体积比为(2/2):(16/32)=1:0.5=2:1。","tip":"记住四个正比：V正比n、p正比n、密度正比M、质量正比M。"},"0|5|k|4":{"explain":"c=n/V，n是溶质物质的量，V是溶液体积（不是溶剂体积）。配制一定物质的量浓度溶液必须用容量瓶定容，容量瓶有规格，只能配对应规格体积的溶液。","example":"例：称4.0 g NaOH溶于水配成500 mL溶液，c=0.1 mol/L；溶解后必须冷却至室温再转移定容。","tip":"公式中V是溶液体积；容量瓶不能溶解、不能加热、不能久存。"},"0|5|k|5":{"explain":"流程八步要按序：计算、称量或量取、烧杯溶解、冷却至室温（关键！热溶液定容体积偏小）、转移入容量瓶、洗涤烧杯和玻璃棒并转移洗涤液、定容、摇匀。","example":"例：配500 mL 0.1 mol/L NaCl：称2.925 g NaCl，溶解冷却后转移，洗涤液并入，定容时平视刻度线。","tip":"冷却与洗涤两步最易漏：热溶液定容、洗涤液不倒都使浓度不准。"},"0|5|d|0":{"explain":"用22.4 L/mol换算体积时两个条件缺一不可：标准状况（0 ℃、101 kPa）和气体状态。标况下SO3是固体、CCl4和苯是液体、水是液体，都不能用。","example":"例：标况下22.4 L SO3不是1 mol（SO3是固体）；常温常压下11.2 L O2也不是0.5 mol。","tip":"NA题先查状态：标况且气体才用22.4，水、SO3、CCl4、苯、乙醇都是陷阱。"},"0|5|d|1":{"explain":"容量瓶是精密仪器，标注温度和容积（温度影响体积），只用于定容：不能溶解固体或稀释、不能加热、不能久存溶液。定容平视刻度线，俯视使体积偏小浓度偏大，仰视相反。","example":"例：定容时俯视刻度线，加水偏少，体积偏小，浓度偏高；仰视则偏大偏小，记住俯小仰大。","tip":"俯视偏小偏大、仰视偏大偏小：先判体积再看浓度。"},"0|5|d|2":{"explain":"误差分析看「n偏大还是偏小、V偏大还是偏小」：砝码放反且用游码使m偏小、浓度偏低；未洗涤烧杯使溶质残留、浓度偏低；俯视定容V偏小浓度偏高；仰视V偏大浓度偏低。","example":"例：称量时砝码与药品放反且用了游码，实际m偏小，c偏低；定容俯视，V偏小，c偏高。","tip":"逐项想c=n/V：先判n和V的偏大偏小，再合成判断。"},"0|5|d|3":{"explain":"离子浓度=溶质浓度×离子个数：如c(Fe3+)=2c[Fe2(SO4)3]、c(SO4(2-))=3c[Fe2(SO4)3]，比例2:3。混合溶液用c1V1+c2V2=c混V混。","example":"例：0.1 mol/L Fe2(SO4)3溶液中c(Fe3+)=0.2 mol/L、c(SO4(2-))=0.3 mol/L，比例为2:3。","tip":"离子浓度=溶质浓度×角标个数，先写电离方程式再算。"},"0|5|e|0":{"explain":"四大陷阱逐一排查：微粒数（如Ne单原子、Na2O2含O2(2-)）；标况状态（SO3、水、CCl4非气体）；可逆反应不能完全转化；氧化还原转移电子数（歧化、部分氧化还原）。","tip":"NA题按「状态、可逆、电子转移、微粒数」四关逐项排查。"},"0|5|e|1":{"explain":"稀释前后溶质物质的量不变：c1V1=c2V2。混合溶液求浓度：总溶质物质的量除以总体积，注意体积可否直接相加。离子浓度按溶质浓度乘角标。","example":"例：100 mL 0.5 mol/L NaCl稀释至500 mL，c=0.5×100/500=0.1 mol/L。","tip":"稀释定律只对溶质物质的量守恒成立，体积不能想当然相加。"},"0|5|e|2":{"explain":"由pV=nRT推出：同温同压下密度之比等于摩尔质量之比，也等于相对密度。同温同压下体积比等于物质的量比，同温同容下压强比等于物质的量比。","example":"例：同温同压下，CO2与O2密度之比为44:32=11:8，直接比较摩尔质量即可。","tip":"密度之比=摩尔质量之比，看到密度比较直接比M。"},"0|5|e|3":{"explain":"操作正误与误差常考细节：容量瓶规格选择、溶解冷却、洗涤转移、定容平视、摇匀后液面下降不能再加水。误差按c=n/V逐项分析。","tip":"摇匀后液面低于刻度是正常现象，不能再加水，否则浓度偏低。"},"1|0|k|0":{"explain":"铁三角是核心网络：Fe被弱氧化剂（H+、Cu2+）氧化为Fe2+，被强氧化剂（Cl2、浓HNO3）氧化为Fe3+；Fe3+可被Fe、Cu还原为Fe2+；Fe2+既能氧化又能还原。","example":"例：Fe+2FeCl3=3FeCl2，2FeCl2+Cl2=2FeCl3，Fe+CuSO4=FeSO4+Cu，体现铁三角互变。","tip":"氧化剂强弱决定产物价态：弱氧化剂得Fe2+、强氧化剂得Fe3+。"},"1|0|k|1":{"explain":"Fe3+与SCN-生成血红色配合物，是检验Fe3+的特征反应。检验Fe2+要两步：先加KSCN不变红（排除Fe3+），再加氯水（氧化Fe2+为Fe3+）变红，说明原溶液含Fe2+。","example":"例：某溶液加KSCN不变红，滴加氯水后变红，说明含Fe2+；若直接变红说明含Fe3+。","tip":"检验Fe2+必须「先KSCN后氯水」两步，一步结论不完整。"},"1|0|k|2":{"explain":"Fe(OH)2是白色沉淀，极易被O2氧化：4Fe(OH)2+O2+2H2O=4Fe(OH)3，故观察时白色迅速变灰绿色再变红褐色。制备要隔绝氧气：滴管伸入液面下、液面加植物油或苯。","example":"例：FeSO4溶液中滴NaOH，先见白色沉淀立即变灰绿，最终红褐色，说明Fe(OH)2被氧化。","tip":"现象顺序「白→灰绿→红褐」，制备须隔绝空气。"},"1|0|k|3":{"explain":"三种氧化物要分清：FeO黑色（+2价）、Fe2O3红棕色（+3价，俗称铁红）、Fe3O4黑色有磁性（含+2、+3价，俗称磁性氧化铁）。Fe3O4可看作FeO·Fe2O3。","example":"例：铁红是Fe2O3（红棕色），磁性氧化铁是Fe3O4（黑色有磁性），FeO是黑色无磁性。","tip":"铁红Fe2O3、磁性氧化铁Fe3O4、FeO黑色，俗名与价态对应记。"},"1|0|k|4":{"explain":"铁在高温下与水蒸气反应生成Fe3O4和H2，注意条件：水是气态（高温）、产物是Fe3O4不是Fe2O3，且常温下铁与水不反应。","example":"例：高温下红热铁丝与水蒸气反应，生成黑色Fe3O4并放出H2：3Fe+4H2O(g)=Fe3O4+4H2。","tip":"铁与水蒸气产物是Fe3O4，条件是高温、水为气态。"},"1|0|k|5":{"explain":"铝既能与酸又能与强碱反应（两性金属），与NaOH反应实质是Al先与水反应再与NaOH作用，生成NaAlO2和H2。铝热反应：Al还原金属氧化物放出大量热，用于焊接钢轨。","example":"例：铝粉与Fe2O3混合点燃：2Al+Fe2O3=Al2O3+2Fe，放出大量热使铁熔化，可焊接钢轨。","tip":"铝与NaOH反应中H2来自水，方程式两边要配平水的系数。"},"1|0|k|6":{"explain":"钢是铁碳合金，含碳量0.03%~2%，硬而韧；生铁含碳2%~4.3%，硬而脆。铝合金密度小、强度大，用于航空航天、汽车制造。","example":"例：生铁含碳2%~4.3%硬而脆，钢含碳0.03%~2%硬而韧，铝合金密度约为钢的三分之一而强度接近钢。","tip":"生铁含碳高于钢：生铁2%~4.3%，钢0.03%~2%，别记反。"},"1|0|d|0":{"explain":"转化要选对试剂：Fe2+→Fe3+需氧化剂，常用Cl2、O2、H2O2（不引入杂质）；Fe3+→Fe2+需还原剂，常用Fe、Cu（Fe+2Fe3+=3Fe2+不引入新杂质）。","example":"例：除FeCl2中FeCl3加足量铁粉：Fe+2FeCl3=3FeCl2，过滤除去剩余铁粉，不引入新杂质。","tip":"除杂选试剂看「不引入新杂质」：氧化用Cl2或H2O2、还原用Fe。"},"1|0|d|1":{"explain":"Fe(OH)2极易被O2氧化，制备要点：新配FeSO4溶液、NaOH溶液煮沸除氧、胶头滴管伸入液面下滴加、液面覆盖植物油或苯隔绝空气，否则白色沉淀瞬间变色。","example":"例：向FeSO4溶液中滴NaOH时滴管尖端伸入液面下，液面加苯，才能观察到白色Fe(OH)2沉淀。","tip":"见到「白色沉淀迅速变色」说明未隔绝空气，操作题先写防氧化措施。"},"1|0|d|2":{"explain":"稀硝酸有强氧化性，Fe先被氧化为Fe(NO3)3；若Fe过量，Fe再与Fe(NO3)3反应：Fe+2Fe(NO3)3=3Fe(NO3)2，最终产物为Fe(NO3)2。","example":"例：足量Fe与稀硝酸反应最终生成Fe(NO3)2：3Fe+8HNO3=3Fe(NO3)2+2NO↑+4H2O。","tip":"Fe与稀硝酸产物看谁过量：Fe过量得Fe(NO3)2，HNO3过量得Fe(NO3)3。"},"1|0|d|3":{"explain":"俗名与化学式对应要熟：铁红/红棕色=Fe2O3（+3价铁）、磁性氧化铁/黑色=Fe3O4（含+2和+3价）、FeO黑色（+2价）。推断题给颜色给磁性反推化学式。","example":"例：红棕色粉末作红色颜料的是Fe2O3（铁红），有磁性的黑色固体是Fe3O4，FeO是黑色无磁性。","tip":"看到「红棕色」写Fe2O3，看到「有磁性」写Fe3O4，FeO是黑色无磁性。"},"1|0|e|0":{"explain":"铁三角是铁及其化合物题的骨架：互变试剂、检验方法、除杂选择都要熟练。除杂口诀：FeCl2中除FeCl3加铁粉，FeCl3中除FeCl2通Cl2或加H2O2。","tip":"除杂「加铁粉除三价、通氯气除二价」，试剂选不引入杂质的。"},"1|0|e|1":{"explain":"流程题中铁常考：酸浸（Fe与H+）、氧化Fe2+为Fe3+（加H2O2）、调节pH使Fe3+沉淀除去（Fe3+在pH约3到4完全沉淀而目标离子不沉淀）。","tip":"流程题「调pH沉淀Fe3+」是高频设问，注意pH范围的选择依据。"},"1|0|e|2":{"explain":"冶炼方法由金属活泼性决定：很活泼金属（Na、Mg、Al）电解熔融化合物；中等活泼（Fe、Cu）热还原法；不活泼（Hg、Ag）热分解法。Au、Pt以游离态存在。","example":"例：Na用电解熔融NaCl制取，Fe用CO还原Fe2O3制取，Hg用加热HgO分解制取。","tip":"记住「电解活泼、热还中等、热解不活泼」，Al不能电解AlCl3（共价化合物）。"},"1|0|e|3":{"explain":"铝热反应2Al+Fe2O3=Al2O3+2Fe放出大量热，温度可达2000 ℃以上，使铁熔化，用于焊接钢轨；也用于冶炼难熔金属（如V、Cr、Mn）。","example":"例：野外焊接钢轨：2Al+Fe2O3=Al2O3+2Fe，利用反应放热熔化生成的铁填满缝隙。","tip":"铝热反应条件是高温引发（镁条引燃），Al是还原剂、Fe2O3是氧化剂。"},"1|1|k|0":{"explain":"硫单质是黄色固体（俗称硫黄），溶解性特点：难溶于水、微溶于酒精、易溶于二硫化碳，故可用CS2洗去试管壁的硫。硫的常见价态-2、0、+4、+6。","example":"例：试管壁附着的硫用CS2洗涤，因硫易溶于CS2而难溶于水；硫的价态从-2到+6都有对应化合物。","tip":"硫易溶于CS2，实验室洗硫用CS2或热碱液。"},"1|1|k|1":{"explain":"SO2是酸性氧化物，与水反应生成亚硫酸（弱酸），与碱反应生成亚硫酸盐和水：SO2+2NaOH=Na2SO3+H2O，NaOH过量时生成NaHSO3。SO2有毒，尾气用碱液吸收。","example":"例：SO2通入NaOH溶液：少量时SO2+2OH-=SO3(2-)+H2O；过量时SO2+OH-=HSO3-。","tip":"SO2与碱反应过量少量产物不同，与CO2通入碱类比记忆。"},"1|1|k|2":{"explain":"SO2中硫+4价可升到+6价，有还原性：催化氧化生成SO3（接触法制硫酸核心反应）；能使氯水、溴水、KMnO4褪色是因为被氧化，这是还原性而非漂白性。","example":"例：SO2使酸性KMnO4溶液褪色：5SO2+2MnO4-+2H2O=5SO4(2-)+2Mn2++4H+，体现还原性。","tip":"SO2使溴水、KMnO4褪色是还原性，使品红褪色才是漂白性。"},"1|1|k|3":{"explain":"SO2的漂白是化合型：与品红等有色物质结合成不稳定的无色化合物，加热或久置可复原，所以SO2使品红褪色后加热又变红。这区别于HClO的氧化型漂白（不可逆）。","example":"例：SO2通入品红溶液褪色，加热恢复红色，说明是化合型漂白；Cl2使品红褪色后加热不复色。","tip":"品红褪色后加热恢复红色是SO2漂白的标志，用于鉴别SO2与Cl2。"},"1|1|k|4":{"explain":"浓硫酸三特性：吸水性（吸收游离水，可干燥气体）、脱水性（按2:1脱去有机物中氢氧元素，蔗糖炭化）、强氧化性（加热氧化Cu、C等）。稀硫酸不与Cu反应。","example":"例：浓硫酸与Cu共热：Cu+2H2SO4(浓)=CuSO4+SO2↑+2H2O，浓硫酸既显强氧化性又显酸性。","tip":"吸水性与脱水性区别：吸水是吸收游离水，脱水是夺取有机物中氢氧元素。"},"1|1|k|5":{"explain":"浓硫酸氧化非金属碳：C被氧化为CO2，浓硫酸被还原为SO2。产物气体经检验可证明反应发生：先品红检验SO2，再KMnO4除SO2，最后石灰水检验CO2。","example":"例：C与浓硫酸共热产物依次通过品红（褪色）、KMnO4（褪色）、澄清石灰水（变浑浊），证明生成SO2和CO2。","tip":"检验CO2和SO2混合气：先检验SO2、再除去SO2、最后检验CO2。"},"1|1|k|6":{"explain":"酸雨主因是SO2和氮氧化物排放：SO2氧化成SO3溶于水成硫酸，NOx生成硝酸。防治：煤脱硫（加石灰石）、烟气脱硫（石灰乳吸收）、汽车尾气催化转化、开发新能源。","example":"例：燃煤电厂用石灰石脱硫：CaCO3分解成CaO再与SO2反应生成CaSO3，减少SO2排放。","tip":"酸雨pH小于5.6，硫酸型酸雨是SO2引起、硝酸型是NOx引起。"},"1|1|d|0":{"explain":"本质区别：SO2与有色物质化合生成不稳定无色物，加热可复原，是可逆漂白，且不能漂白石蕊（生成亚硫酸显酸性变红）；Cl2或HClO氧化有色物质生成稳定无色物，不可逆。","example":"例：将SO2和Cl2分别通入品红，均褪色；加热后SO2组恢复红色，Cl2组不复色。","tip":"加热复色是SO2漂白，不复色是氧化漂白；SO2不能漂白石蕊。"},"1|1|d|1":{"explain":"褪色原因要分清：使品红褪色是漂白（化合型）；使溴水、碘水、酸性KMnO4褪色是被氧化（还原性）；使石蕊变红不褪色（酸性）。","example":"例：SO2通入溴水，Br2被还原：SO2+Br2+2H2O=H2SO4+2HBr，溶液褪色体现SO2还原性。","tip":"溴水、KMnO4褪色=还原性；品红褪色=漂白性；石蕊变红=酸性。"},"1|1|d|2":{"explain":"浓硫酸与Cu反应过程中浓度不断降低，变成稀硫酸后不再与Cu反应，所以即使Cu过量，反应也会因硫酸变稀而停止。计算时不能用「足量Cu」推硫酸完全消耗。","example":"例：一定量浓硫酸与足量Cu共热，反应停止后仍有Cu剩余，说明硫酸未完全反应，因变稀后不再反应。","tip":"浓硫酸变稀反应停止，计算题注意「硫酸不能完全消耗」。"},"1|1|d|3":{"explain":"CO2使石灰水变浑浊，SO2也能（生成CaSO3），且SO2会干扰CO2检验。正确顺序：品红检验SO2→KMnO4除尽SO2→再用品红确认除尽→石灰水检验CO2。","example":"例：混合气经品红（褪色，含SO2）、KMnO4（褪色，除SO2）、品红（不褪色，除尽）、石灰水（变浑浊，含CO2）。","tip":"检验CO2前必须先除尽SO2并确认，缺「确认」一步方案不严谨。"},"1|1|e|0":{"explain":"实验设计抓住各性质的特征反应：漂白用品红（加热复色）、还原性用溴水或KMnO4、酸性氧化物用石蕊变红或与碱反应。题目常要求区分褪色原因。","tip":"答褪色原因时看清试剂：品红答漂白，溴水、KMnO4答还原。"},"1|1|e|1":{"explain":"三特性对应典型实验：吸水性——干燥气体（但不干燥NH3、H2S等碱性还原性气体）；脱水性——蔗糖滴浓硫酸变黑膨胀；强氧化性——加热氧化Cu、C，常温使Fe、Al钝化。","example":"例：蔗糖中加入浓硫酸变黑并膨胀，体现脱水性（炭化）和强氧化性（生成CO2、SO2使体积膨胀）。","tip":"常温浓硫酸使Fe、Al钝化是强氧化性，可用铁罐车运浓硫酸。"},"1|1|e|2":{"explain":"三步反应：沸腾炉中4FeS2+11O2=2Fe2O3+8SO2；接触室中2SO2+O2=2SO3（催化剂加热）；吸收塔中用98.3%浓硫酸吸收SO3（防止形成酸雾）。","example":"例：吸收塔用98.3%浓硫酸吸收SO3生成发烟硫酸，不用水吸收是因为会形成酸雾、吸收率低。","tip":"SO3用98.3%浓硫酸吸收，不用水；设备与反应对应记。"},"1|1|e|3":{"explain":"含硫物质转化：S→SO2→SO3→H2SO4，或H2S→S→SO2。写离子方程式注意硫的价态与介质；尾气SO2用NaOH或氨水吸收。","tip":"尾气SO2用碱液吸收，吸收产物过量少量要区分。"},"1|2|k|0":{"explain":"N2分子含N≡N三键，键能大、性质稳定，常温不反应。放电条件下与O2化合生成NO：N2+O2=2NO，NO再与O2反应生成NO2。这是「雷雨发庄稼」的第一步。","example":"例：雷电时N2+O2=2NO，NO被氧化2NO+O2=2NO2，NO2溶于水成硝酸随雨入土。","tip":"氮气常温稳定，高温放电才与O2反应，产物是NO不是NO2。"},"1|2|k|1":{"explain":"NO无色、难溶于水、不与水反应；NO2红棕色有刺激性气味，与水反应生成硝酸和NO：3NO2+H2O=2HNO3+NO。工业上利用此反应制硝酸。","example":"例：NO2溶于水：3NO2+H2O=2HNO3+NO；收集NO只能用排水法（难溶于水、与空气反应）。","tip":"NO难溶于水且与O2反应，收集用排水法；NO2溶于水生成硝酸。"},"1|2|k|2":{"explain":"NH3极易溶于水（1体积水溶约700体积氨），使容器内压强骤降产生喷泉。氨水中NH3·H2O是弱碱部分电离：NH3+H2O⇌NH3·H2O⇌NH4++OH-，氨水显碱性。","example":"例：充满NH3的烧瓶倒扣水中，打开止水夹形成红色喷泉（水中加酚酞），证明NH3极易溶于水且显碱性。","tip":"氨水中溶质主要是NH3·H2O，书写离子方程式时NH3·H2O不拆。"},"1|2|k|3":{"explain":"实验室用NH4Cl与Ca(OH)2固体加热制NH3：固固加热装置，向下排空气法收集（密度小于空气），碱石灰干燥（不能用浓硫酸、CaCl2，会与NH3反应）。","example":"例：制NH3时干燥用碱石灰，收集用向下排空气法，检验用湿润红色石蕊试纸变蓝，三步缺一不可。","tip":"氨气干燥用碱石灰，不能用浓硫酸和无水CaCl2。"},"1|2|k|4":{"explain":"铵盐共性：受热易分解（NH4Cl分解为NH3和HCl，遇冷又化合）；与碱共热放出NH3：NH4++OH-=NH3↑+H2O，这是检验NH4+的方法：加碱加热，湿润红色石蕊试纸变蓝。","example":"例：检验NH4+：取样品加NaOH溶液加热，产生使湿润红色石蕊试纸变蓝的气体，证明含NH4+。","tip":"检验NH4+要「加碱、加热」两个条件，试纸用湿润红色石蕊。"},"1|2|k|5":{"explain":"硝酸是强氧化性酸，与金属反应不放H2：浓硝酸被还原为NO2（红棕色），稀硝酸被还原为NO（无色）。浓度不同还原产物不同。常温浓硝酸使Fe、Al钝化。","example":"例：Cu与浓硝酸：Cu+4HNO3(浓)=Cu(NO3)2+2NO2↑+2H2O；Cu与稀硝酸：3Cu+8HNO3(稀)=3Cu(NO3)2+2NO↑+4H2O。","tip":"硝酸与金属产物：浓硝酸出NO2、稀硝酸出NO，绝不生成H2。"},"1|2|k|6":{"explain":"合成氨是可逆反应：N2+3H2⇌2NH3，条件高温（500 ℃）、高压（10~30 MPa）、铁触媒。催化剂加快速率不改变平衡，选择条件要兼顾速率、转化率与设备成本。","example":"例：合成氨采用500 ℃、20 MPa和铁触媒，兼顾了速率、转化率与设备成本，是可逆反应工业化的典型。","tip":"合成氨条件「高温高压催化剂」，可逆反应不能完全转化。"},"1|2|d|0":{"explain":"硝酸氧化性太强，与金属反应时H+不直接得电子，产物是NO（稀）或NO2（浓），绝不会放H2。若金属过量，先与硝酸反应生成硝酸盐，过量的Fe等再与Fe(NO3)3反应。","example":"例：足量Fe与稀硝酸：先生成Fe(NO3)3，Fe过量再与Fe(NO3)3反应得Fe(NO3)2。","tip":"见「硝酸与金属生成H2」即错；金属过量要考虑与生成盐的后续反应。"},"1|2|d|1":{"explain":"NH3是碱性气体，浓硫酸会与它反应，无水CaCl2会与NH3生成加合物，都不能作干燥剂，用碱石灰。NH3极易溶于水不能用排水法，密度小于空气用向下排空气法收集。","example":"例：干燥NH3只能用碱石灰；收集用向下排空气法，管口放棉花团防对流，不能用浓硫酸和CaCl2。","tip":"干燥剂选择看气体酸碱性：碱性气体不能用酸性干燥剂。"},"1|2|d|2":{"explain":"喷泉实验本质是压强差：气体在液体中溶解度极大（如NH3、HCl）或与溶液反应消耗气体，容器内气压骤降，外界大气压把液体压入形成喷泉。","example":"例：NH3喷泉：烧瓶内气压因NH3溶解骤降，水被压入，含酚酞的水变红，说明氨水显碱性。","tip":"喷泉成因=气体溶解或反应导致压强差，溶解度小的气体不能形成。"},"1|2|d|3":{"explain":"NO2与O2混合通入水，两个反应叠加，总反应4NO2+O2+2H2O=4HNO3。按4:1混合恰好完全吸收无气体剩余；NO与O2按4:3恰好完全吸收。","example":"例：NO2与O2体积比4:1通入水，恰好完全生成HNO3；剩余气体是NO（NO2过量）或O2（O2过量）。","tip":"记两组「恰好比」：NO2:O2=4:1，NO:O2=4:3，完全吸收。"},"1|2|e|0":{"explain":"转化链：N2→NO→NO2→HNO3→硝酸盐。「雷雨发庄稼」即放电生成NO，NO氧化成NO2，NO2溶于水成硝酸，随雨水入土生成硝酸盐作氮肥。","tip":"按价态推断：-3是NH3和铵盐，0是N2，+2是NO，+4是NO2，+5是HNO3。"},"1|2|e|1":{"explain":"NH4+检验标准操作：取样加NaOH溶液共热，产生的气体使湿润红色石蕊试纸变蓝，证明含NH4+。试纸必须湿润（NH3溶于水显碱性），必须加热（加快NH3逸出）。","tip":"检验铵根三要素：加碱、加热、湿润红色石蕊试纸变蓝。"},"1|2|e|2":{"explain":"计算套路：电子守恒（金属失电子数=n(NO2)×1+n(NO)×3）与氮原子守恒（参加反应的硝酸=被还原部分+成盐部分）两守恒联立速解。","example":"例：Cu与稀硝酸生成0.2 mol NO，转移电子0.6 mol，被还原硝酸0.2 mol，成盐硝酸0.6 mol。","tip":"求被还原硝酸看气体中氮原子数，求总硝酸加成盐部分。"},"1|2|e|3":{"explain":"汽车尾气中NO、CO有害，催化转化：2NO+2CO=N2+2CO2，把有毒气体变成无害的N2和CO2。此外可用NH3还原NOx（脱硝）。","tip":"尾气处理核心「NO+CO→N2+CO2」，把氮氧化物还原为N2。"},"1|3|k|0":{"explain":"晶体硅是共价晶体，结构与金刚石类似，熔点高硬度大，是良好的半导体材料，用于芯片、太阳能电池。硅在地壳中含量第二（仅次于氧），主要以SiO2和硅酸盐形式存在。","example":"例：芯片和太阳能电池都用晶体硅，因其是半导体材料；地壳中硅含量居第二位，仅次于氧。","tip":"硅是半导体，芯片与太阳能电池用晶体硅；SiO2是光导纤维原料。"},"1|3|k|1":{"explain":"SiO2是酸性氧化物，能与碱反应：SiO2+2NaOH=Na2SiO3+H2O，但特殊的是不与水反应（不能生成硅酸），也不与一般酸反应。盛碱液的试剂瓶不能用玻璃塞。","example":"例：玻璃瓶塞被NaOH腐蚀：SiO2+2NaOH=Na2SiO3+H2O，Na2SiO3有黏性使瓶塞黏住，故用橡胶塞。","tip":"酸性氧化物通性中SiO2「不与水反应」是特殊点，别写SiO2+H2O=H2SiO3。"},"1|3|k|2":{"explain":"SiO2的特殊性：能与HF反应生成SiF4气体和水，因此氢氟酸能腐蚀玻璃，用于雕刻玻璃。盛HF不能用玻璃瓶，要用塑料瓶。","example":"例：在玻璃上刻字：SiO2+4HF=SiF4↑+2H2O，故HF须贮存在塑料瓶中。","tip":"唯一能与SiO2反应的酸是HF，HF溶液不能用玻璃瓶盛装。"},"1|3|k|3":{"explain":"Na2SiO3的水溶液叫水玻璃（泡花碱），是矿物胶：可作黏合剂、木材防火剂（受热生成SiO2覆盖隔绝空气）、防腐剂。水玻璃是混合物。","example":"例：木材浸过水玻璃后不易燃烧，因受热时Na2SiO3分解生成的SiO2覆盖表面隔绝空气。","tip":"水玻璃=Na2SiO3水溶液，是混合物，可防火、黏合。"},"1|3|k|4":{"explain":"工业制硅两步：粗硅SiO2+2C=Si+2CO↑（高温）；提纯：Si+2Cl2=SiCl4（高温），SiCl4+2H2=Si+4HCl（高温），得到高纯硅。","example":"例：粗硅提纯：Si+2Cl2=SiCl4，SiCl4与H2反应SiCl4+2H2=Si+4HCl得高纯硅。","tip":"制硅方程式条件都是高温，产物粗硅须经Cl2、H2提纯。"},"1|3|k|5":{"explain":"传统三大硅酸盐材料：水泥（黏土+石灰石煅烧）、玻璃（纯碱+石灰石+石英高温熔融）、陶瓷（黏土烧制）。新型：光导纤维用SiO2、芯片用单晶硅。","example":"例：水泥、玻璃、陶瓷是传统硅酸盐材料，光导纤维用SiO2，芯片用单晶硅，属于新型材料。","tip":"光导纤维是SiO2不是Si；水泥玻璃陶瓷是硅酸盐传统材料。"},"1|3|d|0":{"explain":"酸性氧化物通性对SiO2部分适用：能与强碱反应，但不与水反应生成硅酸，也几乎不与除HF外的酸反应。SiO2+4HF=SiF4↑+2H2O是其与酸反应的唯一特例。","example":"例：错误写法SiO2+H2O=H2SiO3；正确：SiO2与NaOH生成Na2SiO3，与HF生成SiF4。","tip":"SiO2「不溶于水、不与水反应、不与除HF外酸反应」，三不记牢。"},"1|3|d|1":{"explain":"玻璃含SiO2，NaOH与其反应生成有黏性的Na2SiO3，会把玻璃瓶塞与瓶口黏结，故盛碱液的试剂瓶用橡胶塞。","example":"例：盛NaOH溶液的试剂瓶若用玻璃塞，久置后Na2SiO3黏住瓶塞打不开，故用橡胶塞。","tip":"见「碱液+玻璃瓶塞」想SiO2与碱反应生成Na2SiO3黏结。"},"1|3|d|2":{"explain":"H2SiO3不能用SiO2与水直接反应制得（SiO2不溶于水），只能由可溶性硅酸盐与酸（或通CO2）反应：Na2SiO3+2HCl=H2SiO3↓+2NaCl。","example":"例：Na2SiO3溶液中通入CO2：Na2SiO3+CO2+H2O=H2SiO3↓+Na2CO3，证明碳酸酸性强于硅酸。","tip":"制硅酸用「硅酸盐+酸」，不能用SiO2与水反应。"},"1|3|d|3":{"explain":"CO2是分子晶体（分子间范德华力，熔沸点低，常温气体）；SiO2是共价晶体（Si-O键网状结构，熔点高硬度大，常温固体）。结构决定性质，二者物理性质差异极大。","example":"例：干冰易升华（分子晶体），石英熔点1710 ℃（共价晶体），因SiO2中Si-O共价键需大量能量破坏。","tip":"判断晶体类型：CO2分子晶体、SiO2共价晶体，性质差异源于结构。"},"1|3|e|0":{"explain":"对比记忆：同为酸性氧化物，都能与碱反应；不同：CO2能与水反应生成H2CO3、SiO2不能；SiO2能与HF反应、CO2不能。抓住共性中的特殊性。","tip":"对比表记差异：与水、与酸（HF）、与盐溶液三点不同。"},"1|3|e|1":{"explain":"科技情境对应物质：芯片、太阳能电池用单晶硅（半导体）；光导纤维用SiO2（全反射传光）；高温结构陶瓷用新型陶瓷。看到情境先定位物质再答性质。","tip":"芯片、电池是Si；光纤是SiO2；半导体材料选Si。"},"1|3|e|2":{"explain":"传统：水泥、玻璃、陶瓷（硅酸盐材料）；新型：光导纤维、高温结构陶瓷（Si3N4）、碳纤维复合材料、半导体材料。判断看成分与用途。","tip":"玻璃、水泥、陶瓷是传统硅酸盐，光纤、氮化硅陶瓷是新型。"},"1|3|e|3":{"explain":"三步方程式：SiO2+2C=Si+2CO↑（高温）；Si+2Cl2=SiCl4（高温）；SiCl4+2H2=Si+4HCl（高温）。注意第一步产物是CO不是CO2。","example":"例：粗硅制备SiO2+2C=Si+2CO↑，提纯SiCl4+2H2=Si+4HCl，条件均高温。","tip":"制粗硅产物是CO不是CO2，条件高温，别写错。"},"1|4|k|0":{"explain":"化学反应实质是旧键断裂、新键形成：断键吸热、成键放热。反应热=断键吸收总能量-成键放出总能量，结果为负放热、为正吸热。","example":"例：已知H-H键能436、Cl-Cl键能243、H-Cl键能431 kJ/mol，反应热=436+243-2×431=-183 kJ/mol，放热。","tip":"反应热=反应物键能总和-生成物键能总和，公式别带反符号。"},"1|4|k|1":{"explain":"放热反应要熟：一切燃烧、中和反应、活泼金属与酸、大多数化合反应、铝热反应。吸热反应：大多数分解反应（CaCO3分解）、C+CO2=2CO、C与H2O、盐类水解。","example":"例：CaCO3高温分解吸热；H2在Cl2中燃烧放热；碳与CO2反应吸热，注意C+CO2是吸热的化合反应。","tip":"「大多数」是关键：化合一般放热、分解一般吸热，但C+CO2是吸热化合要特殊记。"},"1|4|k|2":{"explain":"原电池是把化学能转化为电能的装置：较活泼金属作负极失电子被氧化，正极得电子被还原；电子经外电路从负极流向正极，电流方向相反；阳离子向正极移动。","example":"例：铜锌原电池中Zn作负极失电子，H+在正极（Cu）得电子放H2，电子从Zn经导线到Cu。","tip":"口诀「负极氧、正极还」，电子出负进正，电流方向与电子相反。"},"1|4|k|3":{"explain":"经典原电池：Zn较活泼作负极：Zn-2e-=Zn2+（氧化反应）；Cu作正极：2H++2e-=H2↑（还原反应）；总反应Zn+2H+=Zn2++H2↑。","example":"例：锌片质量减少（负极溶解）、铜片表面有气泡，负极Zn-2e-=Zn2+，正极2H++2e-=H2↑。","tip":"负极写氧化（失电子）、正极写还原（得电子），电极式配平电荷守恒。"},"1|4|k|4":{"explain":"构成原电池四条件缺一不可：两种活泼性不同的电极材料、电解质溶液、形成闭合回路、能自发进行的氧化还原反应。","example":"例：Cu、Ag与稀硫酸不能构成原电池，因Cu、Ag均不与稀硫酸自发反应；换Zn即可。","tip":"判断能否构成原电池先看「能否自发发生氧化还原反应」。"},"1|4|k|5":{"explain":"常见电池要会说：干电池（锌锰，一次性）、铅蓄电池（可充电，二次电池）、锂电池（比能量高）。氢氧燃料电池负极通H2：H2-2e-+2OH-=2H2O（碱性介质），正极通O2。","example":"例：碱性氢氧燃料电池负极：H2-2e-+2OH-=2H2O，总反应2H2+O2=2H2O。","tip":"燃料电池电极式必须结合介质写：碱性补OH-，酸性补H+。"},"1|4|d|0":{"explain":"判断电极核心：电子流出的极是负极（失电子），电子流入的是正极；电流方向与电子方向相反；溶液中阳离子移向正极得电子、阴离子移向负极。四者捆绑记忆。","example":"例：某原电池电子从A极流出，则A是负极、B是正极，电流从B流向A，阳离子移向B极。","tip":"电子出=负极，电流与电子反向，阳离子追正极。"},"1|4|d|1":{"explain":"介质决定产物：酸性介质H+参加反应，碱性介质OH-参加反应，熔融碳酸盐用CO3(2-)平衡。如氢氧燃料电池：酸性负极H2-2e-=2H+，碱性负极H2-2e-+2OH-=2H2O。","example":"例：氢氧燃料电池酸性负极：H2-2e-=2H+；碱性负极：H2-2e-+2OH-=2H2O，产物不同。","tip":"电极式按「介质定产物、电荷守恒配平、H2O补氧氢」三步写。"},"1|4|d|2":{"explain":"盐桥（含饱和KCl琼脂）作用：沟通两池形成闭合回路、平衡电荷——负极池Zn2+增多带正电，盐桥中Cl-移向负极池、K+移向正极池维持电中性。没有盐桥电流会中断。","example":"例：双池原电池中盐桥内Cl-向负极池移动，K+向正极池移动，形成闭合回路并平衡电荷。","tip":"盐桥中阴离子移向负极池、阳离子移向正极池。"},"1|4|d|3":{"explain":"看能量图先比较反应物总能量与生成物总能量：前者高为放热（多余能量以热放出），前者低为吸热。催化剂降低活化能但不改变反应热。","example":"例：图像中反应物能量高于生成物，该反应放热，ΔH为负；加催化剂后活化能降低，ΔH不变。","tip":"比高低定吸放热，催化剂只降活化能不改变ΔH。"},"1|4|e|0":{"explain":"解题顺序：先判电极（活泼金属负极、电子流出端），再写电极式（负极氧化失电子、正极还原得电子），最后分析离子移动与电流方向。","tip":"电极式检查三守恒：原子、电荷、电子得失数相等。"},"1|4|e|1":{"explain":"拆电极式方法：标出总反应中元素化合价变化，失电子的物质在负极反应、得电子的在正极反应，再补介质离子配平电荷与原子。","example":"例：总反应2Li+H2O2=2LiOH，Li失电子作负极：Li-e-=Li+，H2O2得电子作正极：H2O2+2e-=2OH-。","tip":"拆电极式：先找失电子物质作负极，产物由介质决定。"},"1|4|e|2":{"explain":"金属活动性顺序中较活泼的作负极：如Zn-Cu-H2SO4中Zn负极、Cu正极；Fe-Cu中Fe负极。设计时选两种活泼性不同的金属插入电解质溶液并连成回路。","example":"例：由Fe和Cu设计原电池：Fe作负极（活泼），Cu作正极，电解质用稀硫酸，正极产生H2。","tip":"活泼性强的金属一般作负极，但注意「能与电解质反应的组合」。"},"1|4|e|3":{"explain":"判断吸放热：看能量图反应物与生成物能量高低、看ΔH符号、看键能计算。图像题先看横纵坐标、比较能量，再判断活化能与催化剂影响。","tip":"图像题先比反应物生成物能量高低，ΔH=生成物能量-反应物能量。"},"1|5|k|0":{"explain":"速率=浓度变化量/时间：v=Δc/Δt，反应物速率用浓度减少量、生成物用浓度增加量，均为正值。单位mol/(L·s)或mol/(L·min)。不用固体、纯液体表示。","example":"例：2 min内N2浓度由2 mol/L降为1 mol/L，v(N2)=0.5 mol/(L·min)。","tip":"速率只用溶液或气体浓度变化表示，固体、纯液体浓度视为常数。"},"1|5|k|1":{"explain":"同一反应中不同物质表示的速率之比等于化学计量数之比：aA+bB=cC中v(A):v(B):v(C)=a:b:c。比较快慢时换算成同一物质或除以系数比较。","example":"例：2SO2+O2⇌2SO3中v(SO2):v(O2):v(SO3)=2:1:2，v(SO2)=0.4时v(O2)=0.2。","tip":"比较速率：速率除以各自化学计量数后数值大的反应快。"},"1|5|k|2":{"explain":"五因素口诀「浓热压催面」：增大浓度、升高温度、增大气体压强、加催化剂、增大接触面积（粉碎、搅拌）都能加快反应速率。压强只对气体反应有效。","example":"例：工业合成氨用铁触媒、加压升温加快速率；煤粉碎后燃烧更旺是增大接触面积，两者都加快反应。","tip":"压强只影响气体反应，恒容充惰性气体不改变各气体浓度，速率不变。"},"1|5|k|3":{"explain":"化学平衡的本质标志：正逆反应速率相等且不等于0（反应仍在进行，是动态平衡）；表现标志：各组分浓度（百分含量）不再改变。","example":"例：N2+3H2⇌2NH3达到平衡时v正(N2)=v逆(N2)，各物质浓度不再变化，但不是停止反应。","tip":"平衡是动态的：v正=v逆且不等于0，浓度不变不等于反应停止。"},"1|5|k|4":{"explain":"可逆反应在同一条件下既能正向又能逆向进行，故反应物转化率小于100%，存在限度。工业合成氨中N2、H2不能完全变成NH3，平衡时三者共存。","example":"例：1 mol N2与3 mol H2合成氨，平衡时N2、H2仍有剩余，不可能生成2 mol NH3。","tip":"可逆反应转化率恒小于100%，平衡时反应物产物共存。"},"1|5|k|5":{"explain":"直接标志：v正=v逆、各组分浓度不再变化。间接标志（须随反应变化的量）：颜色不变、压强（仅气体计量数不等时）、密度（仅气体质量变化时）、平均摩尔质量不变。恒定量不能作标志。","example":"例：恒容下H2+I2(g)⇌2HI，压强始终不变，不能作平衡标志；I2蒸气颜色不变可以。","tip":"判断标志看「该量是否随反应进行而变」：变到不变的量才是标志。"},"1|5|d|0":{"explain":"比较速率先统一：换算到同一物质（除以系数）且同一单位（1 min=60 s）。如v(A)=0.3 mol/(L·min)、v(B)=0.2 mol/(L·s)，须先统一单位再比。","example":"例：v(A)=0.2 mol/(L·min)与v(A)=0.3 mol/(L·s)比，后者等于18 mol/(L·min)，更快。","tip":"单位换算1 min=60 s，比较前先统一物质和单位。"},"1|5|d|1":{"explain":"恒容下气体反应前后计量数相等的反应（如H2+I2⇌2HI），反应过程中气体总物质的量不变、压强不变，这两个量「本来就不变」，不能作为平衡标志。","example":"例：恒容密闭容器H2+I2(g)⇌2HI中压强不变不能说明平衡，I2蒸气颜色不变才能说明。","tip":"「始终不变」的量（等体反应压强）不是平衡标志，「变到不变」的量才是。"},"1|5|d|2":{"explain":"恒容下ρ=m/V，V不变时看气体总质量变不变（有固体参加或生成则变）；平均摩尔质量=m/n，看总质量与总物质的量是否变化。两者都变才是平衡标志。","example":"例：C(s)+CO2⇌2CO恒容：气体质量增加、物质的量增加，密度和平均摩尔质量均变化，能作平衡标志。","tip":"先判断气体m与n是否变化：都变可作标志；有不变则不可作。"},"1|5|d|3":{"explain":"有效碰撞理论：只有活化分子间的有效碰撞才能反应。增大浓度、加压使单位体积活化分子数增多；升温使活化分子百分数增大；催化剂降低活化能，使更多分子成为活化分子。","example":"例：升温速率加快是因为活化分子百分数增大；加催化剂是因为活化能降低、活化分子百分数增大。","tip":"升温与催化剂都增大「活化分子百分数」，增大浓度只增多「活化分子数目」。"},"1|5|e|0":{"explain":"速率计算用三段式或公式v=Δc/Δt；比较快慢统一到同一物质；v-t图像中曲线平直且v正=v逆时达到平衡，突变点表示改变条件。","tip":"v-t图看突变：浓度突变是跳变，温度压强渐变，催化剂不改变平衡点。"},"1|5|e|1":{"explain":"解题核心：该量在反应过程中是否改变。改变的量保持不变则达到平衡；恒定的量（等体反应压强、恒容等质量密度）始终不变，不能作平衡标志。","tip":"先判断「是否变量」：变量不变是平衡标志，恒量不是。"},"1|5|e|2":{"explain":"控制变量法：探究某一因素时只改变该因素，其他条件完全相同。如探究浓度对速率影响：改变Na2S2O3浓度，其余（温度、体积、其他试剂）相同，比较出现浑浊的时间。","tip":"设计对比实验「一变多不变」，控制变量是探究题得分关键。"},"1|5|e|3":{"explain":"三段式：起始量、变化量、平衡量列表。转化率=变化量/起始量×100%；平衡浓度由平衡量除以体积。图像题从图中读取起始与平衡浓度，差值即变化量。","example":"例：起始c(N2)=1、平衡c(N2)=0.6，变化量0.4，转化率40%，H2按计量比变化0.4×3=1.2。","tip":"变化量之比=化学计量数之比，这是三段式的核心。"},"1|6|k|0":{"explain":"CH4是正四面体，键角109.5°。性质稳定，能燃烧和取代：光照下与Cl2逐级取代生成CH3Cl、CH2Cl2、CHCl3、CCl4四种产物和HCl。","example":"例：CH4与Cl2光照取代，产物有四种氯代甲烷和HCl，其中CH3Cl是气体，其余为液体。","tip":"甲烷取代「光照条件、生成4种氯代物+氯化氢」，注意不是加成。"},"1|6|k|1":{"explain":"乙烯含碳碳双键，性质活泼：与Br2加成使溴水褪色（CH2=CH2+Br2→CH2BrCH2Br）；被KMnO4氧化（褪色）；与H2、HX、H2O加成；加聚成聚乙烯。","example":"例：乙烯通入溴水褪色是加成，通入KMnO4褪色是氧化，二者原理不同但都证明含双键。","tip":"溴水褪色是加成、KMnO4褪色是氧化，鉴别烷烃烯烃用溴水或KMnO4。"},"1|6|k|2":{"explain":"苯分子是平面正六边形，6个碳碳键完全等同（介于单双键之间），没有典型双键，故易取代（与Br2在FeBr3催化下卤代、与浓硝酸硝化）难加成，不能使溴水、KMnO4褪色。","example":"例：苯与溴水混合振荡后分层、溴水不褪色（萃取使上层橙红），证明苯无双键性质，与烯烃不同。","tip":"苯「难加成易取代、不使溴水褪色」，与烯烃性质对比记忆。"},"1|6|k|3":{"explain":"乙醇含羟基：与Na反应放H2（比水缓和，证明羟基氢活泼性弱于水）；催化氧化（Cu或Ag催化加热）：2C2H5OH+O2→2CH3CHO+2H2O，羟基碳上有2个H氧化成醛。","example":"例：铜丝加热变黑（CuO）插入乙醇中又变红（CuO被还原），闻到刺激性气味乙醛。","tip":"催化氧化口诀「醇脱氢」：羟基碳上有几个H决定产物是醛还是酮。"},"1|6|k|4":{"explain":"乙酸有羧基显弱酸性（比碳酸强）：与Na、NaOH、Na2CO3、NaHCO3反应放CO2。酯化反应：酸脱羟基醇脱氢，浓硫酸作催化剂和吸水剂，可逆反应，产物乙酸乙酯有香味。","example":"例：制乙酸乙酯：试管中加乙醇、乙酸、浓硫酸加热，饱和Na2CO3溶液吸收产物，导管口有果香味液体。","tip":"酯化「酸脱羟基醇脱氢」，浓硫酸催化加吸水，产物收集用饱和Na2CO3。"},"1|6|k|5":{"explain":"营养物质主线：葡萄糖是多羟基醛，能银镜反应；蔗糖水解生成葡萄糖和果糖；淀粉遇碘变蓝、水解最终得葡萄糖；油脂碱性水解（皂化）制肥皂；蛋白质水解最终得氨基酸。","example":"例：向淀粉溶液中滴碘水变蓝；淀粉水解后用NaOH中和，再加新制Cu(OH)2加热有砖红色沉淀，证明水解产物葡萄糖。","tip":"检验水解产物先加NaOH中和硫酸，否则Cu(OH)2被酸消耗。"},"1|6|d|0":{"explain":"取代是「有进有出」（一个原子被替换，如CH4卤代生成CH3Cl和HCl）；加成是「只进不出」（双键打开两边各连一个原子，如CH2=CH2+Br2）。苯介于两者间。","example":"例：CH4+Cl2→CH3Cl+HCl是取代（生成HCl）；CH2=CH2+Br2→CH2BrCH2Br是加成（无其他产物）。","tip":"看产物：有「小分子副产物（HCl、H2O）」是取代，只生成一种产物是加成。"},"1|6|d|1":{"explain":"酯化机理：羧酸脱去-OH，醇脱去羟基上的H，二者结合成水，水中的氧来自羧基而非醇。用18O标记醇羟基可验证：生成的酯含18O而水中无18O。","example":"例：用含18O的乙醇与乙酸酯化，18O进入乙酸乙酯，水中无18O，证明水来自酸脱羟基。","tip":"同位素标记实验结论：水中氧来自羧基，酯中氧来自醇。"},"1|6|d|2":{"explain":"淀粉和纤维素通式都是(C6H10O5)n，但n值（聚合度）不同且结构不同，所以不是同分异构体（同分异构体要求分子式相同）。它们是天然高分子化合物。","example":"例：淀粉与纤维素分子式(C6H10O5)n中n不同，分子式不同，不属于同分异构体。","tip":"「通式相同不等于分子式相同」，高分子化合物的n不同就不能比同分异构。"},"1|6|d|3":{"explain":"盐析：加轻
