合酶既能解旋又能连磷酸二酯键。"},"1|4|e|1":{"explain":"两个经典实验：肺炎链球菌转化实验（格里菲思发现转化因子；艾弗里证明DNA是转化因子）；噬菌体侵染实验（32P标记DNA、35S标记蛋白质，证明DNA是遗传物质）。","example":"例：噬菌体侵染实验中35S标记蛋白质，上清液放射性高，说明蛋白质未进入细菌，DNA是遗传物质。","tip":"32P标记DNA、35S标记蛋白质；搅拌使噬菌体外壳与细菌分离，离心后上清含外壳。"},"1|4|e|2":{"explain":"比例关系记忆：DNA双链碱基数比mRNA碱基数比氨基酸数等于6比3比1（DNA双链、mRNA单链、每3个碱基一个密码子编码一个氨基酸，忽略终止密码子）。","example":"例：某蛋白质含100个氨基酸，则mRNA至少300个碱基，DNA至少600个碱基。","tip":"算至少要忽略终止密码子；算实际数目要加上终止密码子和内含子。"},"1|4|e|3":{"explain":"中心法则应用：DNA病毒（噬菌体）流向DNA到RNA到蛋白质；RNA病毒分两类：RNA复制型（烟草花叶病毒）和逆转录型（HIV，RNA到DNA到RNA到蛋白质）。写清箭头酶。","example":"例：HIV侵染T细胞后，遗传信息流向：RNA到DNA到RNA到蛋白质，先逆转录再转录翻译。","tip":"逆转录和RNA复制只发生在相应RNA病毒侵染的细胞中，正常细胞不含这两步。"},"1|4|e|4":{"explain":"三个易混点：复制、转录模板是DNA（复制用两条链、转录用一条链），翻译模板是mRNA；tRNA一端携带氨基酸，另一端三个碱基是反密码子，与mRNA密码子互补配对。","example":"例：判断题：翻译以DNA为模板（错），翻译以mRNA为模板，tRNA转运氨基酸。","tip":"反密码子书写与密码子互补配对（U配A、A配U、G配C、C配G），注意方向。"},"1|5|k|0":{"explain":"基因突变本质：DNA分子中碱基对的增添、缺失或替换，导致基因结构改变（碱基序列改变），产生新基因（等位基因），是生物变异的根本来源、进化的原材料。发生在DNA复制时。","example":"例：镰状细胞贫血是β-珠蛋白基因中一个碱基对替换，导致谷氨酸变缬氨酸，产生新基因。","tip":"基因突变产生新基因（等位基因），基因重组只产生新基因型，别混淆。"},"1|5|k|1":{"explain":"基因突变五大特点记口诀普随不低害：普遍性（所有生物都可发生）、随机性（可发生在任何时期、任何部位）、不定向性（一个基因可突变成多种等位基因）、低频性、多害少利性。","example":"例：紫外线照射可提高基因突变频率，但突变方向不定，需大量筛选有利个体，成本较高。","tip":"不定向性指突变方向不定（可产生多种等位基因），自然选择才是定向的。"},"1|5|k|2":{"explain":"基因重组两大来源：减Ⅰ后期非同源染色体上非等位基因自由组合（如AaBb产生AB、ab、Ab、aB）；减Ⅰ前期（四分体时期）同源染色体非姐妹染色单体交叉互换。基因重组产生新的基因型。","example":"例：AaBb个体产生Ab、aB新组合配子，来自非同源染色体自由组合，属基因重组。","tip":"基因重组发生在减数分裂过程（配子形成），受精作用本身不算基因重组。"},"1|5|k|3":{"explain":"染色体变异两大类：结构变异四种（缺失、重复、倒位、易位，改变基因数目顺序）；数目变异两种（个别染色体增减如21三体、成倍增减如多倍体）。基因突变是点变化，染色体变异是段或整条变化。","example":"例：染色体片段移接到非同源染色体上是易位；基因突变只是碱基对改变，二者本质不同，要分清。","tip":"易位（非同源染色体间）与交叉互换（同源非姐妹染色单体间）别混，后者是基因重组。"},"1|5|k|4":{"explain":"单倍体育种流程：杂交获得F1，取F1花药（花粉）离体培养得单倍体幼苗，秋水仙素处理使染色体加倍得纯合二倍体植株。优点：明显缩短育种年限（当年即可获得纯合子）；缺点：技术复杂。","example":"例：AaBb的F1花药离体培养得四种单倍体，秋水仙素加倍后都是纯合子，当年可得纯种。","tip":"单倍体育种是先单倍体再加倍两步；加倍后植株都是纯合子，无需连续自交。"},"1|5|k|5":{"explain":"多倍体育种原理：秋水仙素（或低温）抑制纺锤体形成，导致复制后的染色体不能分到两个细胞，染色体数目加倍。实例：无子西瓜（三倍体，联会紊乱无子）、八倍体小黑麦。优点：茎秆粗壮、果实大。","example":"例：秋水仙素处理二倍体西瓜幼苗得四倍体，与二倍体杂交得三倍体种子，种后得无子西瓜。","tip":"秋水仙素作用于细胞分裂前期（纺锤体形成时），只加倍染色体不改变基因种类。"},"1|5|d|0":{"explain":"两大变异对比：基因突变改变基因结构、产生新基因（新性状的根本来源），是生物变异的根本来源；基因重组只是已有基因重新组合、产生新基因型，不产生新基因，只在有性生殖发生。","example":"例：判断：基因重组产生新基因（错），基因重组只产生新基因型，基因突变才产生新基因。","tip":"见到产生新基因选基因突变；新基因型、新组合选基因重组。"},"1|5|d|1":{"explain":"染色体组判断要点：一个染色体组是一组非同源染色体，形态、大小、功能各不相同，含有控制生物生长发育的全部遗传信息。判断方法：细胞内形态大小相同的染色体有几条就有几个染色体组。","example":"例：体细胞含4条染色体两两相同（如AABB），则含2个染色体组；配子AB含1个。","tip":"看相同形态染色体的条数等于染色体组数；单倍体配子含一个染色体组是特例。"},"1|5|d|2":{"explain":"三个概念按来源定义：由受精卵发育而来、含2个染色体组是二倍体，含3个及以上是多倍体；由配子直接发育而来（无论含几个染色体组）都是单倍体。单倍体含本物种配子的染色体数。","example":"例：四倍体水稻（4n）的花药离体培养得到2n植株，含2个染色体组但仍是单倍体，看来源判断。","tip":"判断单倍体看是否由配子发育，不能只看染色体组数。"},"1|5|d|3":{"explain":"育种方法总表：杂交育种（原理基因重组，操作简单，缺点年限长）；诱变育种（原理基因突变，产生新基因）；单倍体育种（原理染色体变异，缩短年限）；多倍体育种（器官大）。","example":"例：要快速获得纯合子选单倍体育种；要产生新性状（新基因）选诱变育种，按目标选择。","tip":"选择依据看目标：纯合快选单倍体，新基因选诱变，大果实选多倍体，常规改良选杂交。"},"1|5|e|0":{"explain":"三变异比较表：基因突变（碱基对增添缺失替换，产生新基因，根本来源）；基因重组（基因重新组合，新基因型，有性生殖）；染色体变异（结构或数目改变）。共同点：遗传物质改变、可遗传。","example":"例：判断变异类型：碱基对替换属基因突变；非同源染色体片段交换属染色体结构变异（易位）。","tip":"交叉互换是基因重组，易位是染色体变异，二者都涉及交换但对象不同。"},"1|5|e|1":{"explain":"结构变异看图判断：某片段丢失属缺失；某片段重复出现属重复；片段位置颠倒属倒位；片段移到非同源染色体属易位。染色体组数判断：数相同形态染色体条数，或看基因型中相同字母出现次数。","example":"例：基因型AAaaBbbb含4个染色体组；染色体上某段在另一条上重复出现是重复。","tip":"看图先找丢失、重复、颠倒、异位特征；基因型法看相同字母个数。"},"1|5|e|2":{"explain":"流程题要点：杂交育种（亲本杂交，F1自交，F2选优，连续自交提纯，年限长）；单倍体育种（F1花药离体培养，秋水仙素加倍，直接得纯合，年限短）；诱变育种（物理化学诱变，大量筛选）。","example":"例：培育抗倒伏抗病纯种水稻：杂交得F1，单倍体育种当年得纯合抗倒伏抗病植株，年限短。","tip":"单倍体育种比杂交育种明显缩短年限，因为无需连续自交提纯。"},"1|5|e|3":{"explain":"镰状细胞贫血：β-珠蛋白基因中一个碱基对替换，谷氨酸变缬氨酸，红细胞镰状。基因突变不一定改变性状：因密码子简并性、隐性突变（Aa不表现）或发生在非编码区。","example":"例：基因突变后mRNA密码子由UUU变为UUC，都编码苯丙氨酸，蛋白质不变，性状不变。","tip":"简并性、隐性突变、非编码区突变都不改变性状，答题写这三点。"},"1|5|e|4":{"explain":"两个易错判断：基因重组只是已有基因重新组合，不产生新基因、不改变基因频率；基因突变改变基因内部碱基序列，但基因在染色体上的位置不变（位置改变是易位等染色体变异）。","example":"例：判断题：基因突变改变了基因在染色体上的位置（错），位置改变属于染色体结构变异。","tip":"突变变内容（碱基序列），易位变位置，重组变组合，三词分清。"},"1|6|k|0":{"explain":"现代进化理论核心观点：种群是生物进化的基本单位（个体进化无意义）；突变和基因重组产生可遗传变异，为进化提供原材料；自然选择决定进化方向；隔离导致物种形成。注意变异不定向，选择定向。","example":"例：一个种群内不同个体的抗药性变异是突变产生的，自然选择使抗药基因频率上升，进化发生。","tip":"进化的基本单位是种群不是个体；变异先于选择存在，选择不诱导变异。"},"1|6|k|1":{"explain":"自然选择作用机理：直接作用于个体的表现型，适者生存、不适者被淘汰，使种群基因频率定向改变。自然选择决定进化方向，进化实质是基因频率改变，基因频率改变不一定是物种形成。","example":"例：工业区桦尺蠖黑色个体增多，是自然选择使黑色基因频率定向上升的结果，方向明确。","tip":"进化等于基因频率改变；物种形成等于基因频率改变加生殖隔离，二者不能画等号。"},"1|6|k|2":{"explain":"隔离分地理隔离（因地理障碍不能相遇交配）和生殖隔离（不能交配或交配后不能产生可育后代）。物种形成通常过程：地理隔离，各自基因库改变，生殖隔离，新物种。生殖隔离是物种形成的标志。","example":"例：加拉帕戈斯群岛地雀因地理隔离各自进化，最终形成生殖隔离的多个物种，是经典实例。","tip":"物种形成标志是出现生殖隔离，不是地理隔离；同一物种能交配产生可育后代。"},"1|6|k|3":{"explain":"基因频率计算两种方法：直接法（某基因频率等于该基因数目除以全部等位基因总数乘100%，注意X染色体基因在男性只有1个）；基因型频率法（纯合子频率加1/2杂合子频率）。","example":"例：种群中AA 30个、Aa 60个、aa 10个，A频率等于（30乘2加60）除以200等于60%。","tip":"性染色体上基因按基因数算：Xb频率等于雌性Xb数加雄性Xb数除以总X染色体数。"},"1|6|k|4":{"explain":"共同进化三层含义：不同物种之间相互选择（捕食者与被捕食者共同提高）；生物与无机环境相互影响（生物改变环境、环境选择生物）；导致生物多样性形成。共同进化是生物多样性形成的原因。","example":"例：兰花花距与蛾口器长度相互选择、共同进化，形成形态上的精确匹配，互利发展，相互适应。","tip":"共同进化既包括物种间也包括生物与环境间，答题别漏无机环境。"},"1|6|k|5":{"explain":"生物多样性三个层次：基因多样性（基因种类多，是根本）、物种多样性（物种数目多）、生态系统多样性（生态系统类型多，是前两者的保障）。三个层次由低到高，是共同进化的结果。","example":"例：同一物种不同个体基因不同体现基因多样性；保护生态系统多样性是保护物种多样性的根本。","tip":"三个层次递进关系：基因多样性是基础，生态系统多样性是保障。"},"1|6|d|0":{"explain":"哈代温伯格平衡（遗传平衡）五条件：种群足够大、随机交配、无突变、无迁入迁出、无自然选择。满足时基因频率和基因型频率一代代不变：设A等于p、a等于q（p加q等于1）。","example":"例：遗传平衡种群中a频率为0.2，则aa等于0.04，Aa等于2乘0.8乘0.2等于0.32。","tip":"用p平方加2pq加q平方等于1前必须先确认满足遗传平衡条件，否则算错。"},"1|6|d|1":{"explain":"进化与物种形成关系：基因频率改变即发生进化，这是进化的实质；但进化不等于物种形成，物种形成必须产生生殖隔离。所以进化了不一定形成新物种，答题先区分这两个概念。","example":"例：某种群基因频率改变（进化了），但未与原始种群产生生殖隔离，仍是同一物种，要区分。","tip":"判断题进化了就形成新物种是错的，物种形成必须有生殖隔离。"},"1|6|d|2":{"explain":"自然选择的作用层次：直接作用于个体的表现型（表现型不同，生存繁殖机会不同）；通过选择表现型间接影响基因型频率；最终使种群基因频率定向改变。选择的是个体和表现型，不是基因本身。","example":"例：抗药性强的个体存活下来（表现型被选择），抗药基因频率随之上升（基因频率定向改变）。","tip":"答题写直接作用于表现型、间接作用于基因型，别写成直接作用于基因。"},"1|6|d|3":{"explain":"理解链条：共同进化（物种间、生物与环境间相互选择）导致生物多样性形成；三个层次相互关联：基因多样性是物种多样性的基础，物种多样性是生态系统多样性的基础。","example":"例：捕食者与被捕食者共同进化使双方更适应，同时增加了生态系统和物种多样性，双赢发展。","tip":"答生物多样性形成原因写共同进化，别写自然选择单一原因。"},"1|6|e|0":{"explain":"计算题套路：常染色体基因频率等于纯合子频率加1/2杂合子频率，或按基因数目算；伴X基因按X染色体总数算（女性2个、男性1个）。注意群体是否达到遗传平衡，未平衡不能直接用p平方。","example":"例：男性中XbY占8%，则Xb频率等于8%，女性携带者频率约等于2乘0.92乘0.08。","tip":"男性X染色体上隐性基因频率等于男性发病率，这是伴X计算的快捷方法。"},"1|6|e|1":{"explain":"两学说比较：达尔文学说局限在于没有遗传变异的本质认识（认为变异是环境诱导）和没有从个体到种群；现代理论以种群为单位、明确变异来源是突变和基因重组、阐明进化的实质是基因频率改变。","example":"例：达尔文认为长颈鹿脖子长是用进废退，现代理论认为是突变产生变异、自然选择保留。","tip":"达尔文学说与现代理论最大区别：变异来源和进化单位（个体对种群）。"},"1|6|e|2":{"explain":"物种形成经典模型：地理隔离（不同岛屿地雀无法交配），不同环境自然选择使基因库差异积累，生殖隔离（即使相遇也不能交配或后代不育），新物种形成。只有地理隔离没到生殖隔离，还是同一物种。","example":"例：两个种群被大河隔开但人工杂交可育，说明只存在地理隔离，仍属同一物种，判断有据。","tip":"生殖隔离的本质是不能进行基因交流；判断物种看能否交配产生可育后代。"},"1|6|e|3":{"explain":"抗药性形成过程：细菌种群中突变是随机的、不定向的，有的个体突变产生抗药基因；抗生素（环境选择）定向淘汰无抗药性个体，保留有抗药性个体；抗药基因频率逐代上升。","example":"例：滥用抗生素使抗药菌增多，是抗生素定向选择的结果，不是抗生素诱导突变，方向不同。","tip":"答题陷阱：抗生素不诱导突变，只是选择已有的抗药变异。"},"1|6|e|4":{"explain":"两大易错：进化基本单位是种群（个体基因型会死亡消失，种群基因库才延续）；变异（突变和基因重组）是不定向的，为进化提供原材料，自然选择是定向的、决定进化方向。","example":"例：判断题：个体是进化的基本单位（错），自然选择使变异定向（错，选择只筛变异）。","tip":"见到个体是进化单位、突变定向直接判错。"},"2|0|k|0":{"explain":"内环境等于细胞外液，包括血浆（血细胞直接生活的环境）、组织液（绝大多数体细胞的环境）、淋巴液。内环境是体内细胞直接生活的液体环境，区别于外界环境。注意：细胞内液不属于内环境。","example":"例：组织细胞直接生活的内环境是组织液；血细胞直接生活的内环境是血浆，各有所属，要分清。","tip":"汗液、尿液、泪液、消化液与外界相通，不属于内环境。"},"2|0|k|1":{"explain":"三者关系记箭头：血浆和组织液双向渗透（毛细血管壁处）；组织液单向进入淋巴（毛细淋巴管盲端）；淋巴单向汇入血浆。组织液是细胞与血浆交换的桥梁，淋巴是组织液的回流通道。","example":"例：组织水肿是组织液增多，可通过淋巴回流和血浆渗透两条途径缓解，体现动态平衡的调节。","tip":"画三液体关系图：血浆与组织液双向箭头，组织液进淋巴、淋巴进血浆是单向。"},"2|0|k|2":{"explain":"内环境成分判断：属于内环境的物质有水、无机盐、葡萄糖、氨基酸、激素、抗体、血浆蛋白、代谢废物（尿素、CO2）。不属于内环境的：细胞内物质（血红蛋白等）、细胞膜成分、外界液体。","example":"例：血红蛋白在红细胞内，不属于内环境成分；血浆蛋白在内环境，属于内环境成分，位置判断。","tip":"判断口诀：看物质是在细胞内、细胞膜上还是细胞外液中，前两者不属于内环境。"},"2|0|k|3":{"explain":"内环境三大理化性质：渗透压（主要与Na+和Cl-有关，血浆渗透压约770kPa）；酸碱度（pH 7.35到7.45，靠缓冲物质维持）；温度（37℃左右，靠产热散热平衡维持）。","example":"例：大量出汗丢失NaCl，血浆渗透压下降；喝大量清水后渗透压也下降，注意补充盐分。","tip":"血浆渗透压主要与NaCl有关，细胞外液渗透压90%以上来自Na+和Cl-。"},"2|0|k|4":{"explain":"稳态概念：正常机体通过调节作用，使内环境各种理化性质（渗透压、pH、温度等）保持相对稳定（不是绝对不变，是动态平衡）。调节机制：神经、体液、免疫调节网络。","example":"例：剧烈运动后血液pH仍保持7.35到7.45，是缓冲物质和调节网络共同作用的结果。","tip":"稳态是相对稳定不是恒定不变；各器官系统协调活动也参与维持稳态。"},"2|0|k|5":{"explain":"内环境的功能：细胞与外界环境之间的物质交换（氧气、营养物质进入，CO2、废物排出）必须通过内环境完成，内环境是媒介。维持稳态需要消化、呼吸、循环、泌尿等系统协调活动。","example":"例：细胞需要的O2经呼吸系统到循环系统到组织液再到细胞，全程以内环境为媒介传递。","tip":"答题写内环境是细胞与外界环境进行物质交换的媒介，强调媒介作用。"},"2|0|d|0":{"explain":"易错成分归类：血红蛋白（红细胞内）、呼吸酶（细胞内）、DNA聚合酶（细胞核内）、载体、受体（膜上）都不属内环境；血浆蛋白、抗体、激素、葡萄糖等属于内环境。标准：是否位于细胞外液。","example":"例：判断题：血浆蛋白属于内环境（对），血红蛋白属于内环境（错，在红细胞内），位置决定。","tip":"蛋白不一定在内环境：血红蛋白、载体蛋白、呼吸酶都在细胞内或膜上。"},"2|0|d|1":{"explain":"组织水肿等于组织液过多，三大原因方向：血浆蛋白减少（营养不良）使血浆渗透压降低，水进入组织液；淋巴回流受阻使组织液不能及时回流；毛细血管通透性增大（过敏、炎症）使血浆蛋白渗出。","example":"例：过敏反应使毛细血管通透性增大，血浆蛋白渗出到组织液，组织液渗透压升高而水肿。","tip":"组织水肿统一思路：组织液渗透压升高或血浆渗透压降低，水就向组织液移动。"},"2|0|d|2":{"explain":"概念层级：体液等于细胞内液（占2/3）加细胞外液（占1/3）；细胞外液等于血浆加组织液加淋巴等于内环境。内环境专指细胞外液，不含细胞内液。易错：血浆蛋白在细胞外液。","example":"例：判断题：内环境包括细胞内液（错），内环境就是细胞外液，细胞内液不属于，概念要清。","tip":"做题先圈内环境还是体液，体液范围更大，包含细胞内液。"},"2|0|d|3":{"explain":"渗透压决定因素：血浆渗透压大小主要与无机盐（尤其是Na+和Cl-，占90%以上）和血浆蛋白含量有关。答题易错点：只说与蛋白质有关（蛋白质影响较小）。","example":"例：细胞外液渗透压主要来源于Na+和Cl-，血浆渗透压还与血浆蛋白有关，主次分清。","tip":"渗透压题主答Na+和Cl-，再补血浆蛋白；别答成K+。"},"2|0|e|0":{"explain":"选择题解题步骤：先判断物质存在位置（细胞内、膜上、细胞外液），细胞外液中的才属于内环境；再判断理化性质（渗透压、pH、温度）。常考干扰项：血红蛋白。","example":"例：下列属于内环境成分的是：血浆蛋白（是）、呼吸酶（否）、消化液中的蛋白酶（否）。","tip":"见到酶、蛋白先想位置：细胞内的酶不属于内环境，血浆蛋白属于。"},"2|0|e|1":{"explain":"图解题要点：双向箭头只有血浆和组织液（毛细血管壁处双向交换）；单向箭头是组织液到淋巴（毛细淋巴管盲端）和淋巴到血浆。看懂箭头方向就能判断水肿、回流等问题。","example":"例：图中若箭头只画组织液到淋巴，说明淋巴回流受阻，会导致组织水肿，方向很关键。，箭头是图解关键。","tip":"毛细淋巴管只进不出（单向），毛细血管双向，这是图解关键。"},"2|0|e|2":{"explain":"答题模板：水总是向渗透压高的一侧移动。组织水肿原因归类：血浆蛋白减少使血浆渗透压降低，水流入组织液；组织液渗透压升高（过敏、炎症渗出蛋白）吸水；淋巴回流受阻；毛细血管通透性增大。","example":"例：肾病综合征患者大量蛋白尿，血浆蛋白减少，血浆渗透压下降，导致组织水肿，因果清晰。","tip":"先判断哪侧渗透压变高或变低，再写水移动方向，逻辑链要完整。"},"2|0|e|3":{"explain":"稳态调节机制神经、体液、免疫调节网络：神经系统快速调节、体液（激素）较慢持久调节、免疫系统清除病原和异常细胞。意义：内环境稳态是机体进行正常生命活动的必要条件。","example":"例：血糖升高，胰岛素分泌增多，血糖下降，属于体液调节，是稳态维持的实例，动态平衡。","tip":"答题写全神经、体液、免疫调节网络，再答必要条件的意义。"},"2|0|e|4":{"explain":"陷阱总结：与外界环境相通的管道内液体（汗液、尿液、泪液、唾液、胃液等消化液）不属于内环境，因它们与外界直接相通、不是细胞外液。只有血浆、组织液、淋巴及其直接成分才是内环境。","example":"例：判断题：胃液属于内环境成分（错），胃液是消化道内的消化液，与外界相通，排除外部液。","tip":"与外界相通四字判断法：汗、尿、泪、消化液全排除。"},"2|1|k|0":{"explain":"神经调节的基本方式是反射，反射的结构基础是反射弧：感受器到传入神经到神经中枢到传出神经到效应器（运动神经末梢加肌肉或腺体）。反射弧任一环节受损，反射不能完成。","example":"例：膝跳反射的反射弧由5部分构成，敲击肌腱刺激感受器产生兴奋，经传入神经传到脊髓。","tip":"效应器包括传出神经末梢及其支配的肌肉或腺体，别只写肌肉。"},"2|1|k|1":{"explain":"电位形成机理：静息时K+外流形成外正内负的静息电位；受刺激时Na+通道打开，Na+内流形成外负内正的动作电位；随后K+外流恢复静息电位。兴奋在神经纤维上以电信号双向传导。","example":"例：神经纤维受刺激部位膜电位由外正内负变为外负内正，这是Na+内流的结果，离子动因。","tip":"静息靠K+外流、动作靠Na+内流，二者都是顺浓度梯度的协助扩散，不耗能。"},"2|1|k|2":{"explain":"兴奋传导两段式：神经纤维上是电信号（局部电流）传导，双向；到达突触小体后，突触前膜释放神经递质到突触间隙，与突触后膜受体结合，电信号转化学信号再转回电信号。递质只能前膜释放故单向。","example":"例：兴奋由轴突末梢传向下一个神经元，只能从突触前膜传向突触后膜，不能反向，单向传递。","tip":"突触处信号转变：电信号到化学信号到电信号，答题写全三步。"},"2|1|k|3":{"explain":"突触三部分：突触前膜（轴突末梢膜）、突触间隙、突触后膜（树突或胞体膜）。递质与后膜受体特异性结合：兴奋性递质（如乙酰胆碱）使后膜产生动作电位，抑制性递质使后膜更难兴奋。","example":"例：乙酰胆碱与突触后膜受体结合后Na+通道开放，产生动作电位，引起下一个神经元兴奋。","tip":"递质发挥作用后立即被降解或回收，否则后膜持续兴奋或抑制。"},"2|1|k|4":{"explain":"突触传递两特点：单向传递（递质只能前膜释放、后膜接收，故反射弧中兴奋单向）；突触延搁（递质释放扩散结合需要时间，故反射有延迟）。递质发挥作用后被酶降解或被前膜回收，防止持续作用。","example":"例：有机磷农药抑制分解乙酰胆碱的酶，递质持续作用，导致肌肉持续收缩，危害明显，机理清楚。","tip":"突触延搁的原因：递质的释放、扩散、结合需要时间。"},"2|1|k|5":{"explain":"神经中枢分级：大脑皮层是最高级中枢（语言、感觉、运动等高级功能）；脊髓是低级中枢（膝跳、排尿等）；低级中枢受高级中枢调控。如成人能憋尿（大脑皮层控制脊髓的排尿中枢），婴儿不能。","example":"例：脊髓损伤病人大小便失禁，是因为大脑皮层对脊髓排尿中枢的控制中断，分级调节失常。","tip":"分级调节实例常考：憋尿、膝跳反射受大脑皮层控制与否。"},"2|1|d|0":{"explain":"电位机制对照记：静息电位（外正内负）是K+外流形成；动作电位（外负内正）是Na+内流形成；恢复静息电位是K+外流。注意离子运输方式都是协助扩散（顺浓度梯度、经通道蛋白）。","example":"例：提高膜外K+浓度，静息电位绝对值减小（K+外流减少）；提高Na+浓度，动作电位峰值增大。","tip":"静息K+外、动作Na+内，记口诀静K动Na。"},"2|1|d|1":{"explain":"电流计偏转规律：指针偏转方向由电流方向决定（膜外电流从正电位流向负电位，指针向电流方向偏转）。神经纤维上：刺激两点中间，兴奋同时到达，不偏转；刺激偏向一侧，共偏转2次。","example":"例：刺激神经纤维左端，兴奋先到左侧电极，指针先向左偏，再到右侧电极再向右偏，共2次。","tip":"判断偏转先画兴奋传导方向和时间差，注意突触单向性导致的不偏转。"},"2|1|d|2":{"explain":"传导方向对比：神经纤维上（离体）兴奋双向传导；完整反射弧中因突触单向，兴奋只能沿反射弧一个方向传递；突触处因递质只能前膜释放，兴奋只能单向传递。做题先看题干是离体纤维还是反射弧。","example":"例：离体神经纤维中点刺激，兴奋向两端双向传导；在突触处只能前膜到后膜单向，方向对比。","tip":"双向只适用于离体神经纤维，涉及突触或反射弧必是单向。"},"2|1|d|3":{"explain":"反射完成条件：刺激必须达到一定强度（阈值）、反射弧必须完整。反射弧五部分任一受损，反射不能完成，但感受器仍能产生兴奋。传入神经断则感觉消失；传出神经断则运动丧失。","example":"例：切断传出神经后刺激感受器，能产生感觉（传入通路完整）但不能完成反射（效应器收不到指令）。","tip":"反射弧损伤分析：先看损伤部位在传入还是传出，再分别判断感觉与运动。"},"2|1|e|0":{"explain":"解题思路：看图确定五部分位置（感受器到传入到中枢到传出到效应器）；切断传入神经：刺激感受器无感觉无反射；切断传出神经：刺激感受器有感觉但无反射。答题写明感觉有没有、运动有没有。","example":"例：切断b（传出神经），刺激感受器：有感觉（传到了中枢）但效应器无反应，反射不能完成。","tip":"判断有感觉看感受器到传入到中枢到大脑通路是否完整；反射看整个反射弧。"},"2|1|e|1":{"explain":"膜电位曲线分析：静息时约负70mV（外正内负）；受刺激后Na+内流迅速上升至正35mV（动作电位峰值）；随后K+外流恢复静息。曲线上升段对应Na+内流、下降段对应K+外流。","example":"例：膜电位曲线上升阶段是Na+通道开放、Na+内流的结果，峰值后下降是K+外流恢复。","tip":"曲线看阶段对应离子：上升Na+内流、下降K+外流，恢复期靠钠钾泵耗能维持。"},"2|1|e|2":{"explain":"递质两类：兴奋性递质（乙酰胆碱等）使突触后膜Na+通道开放，产生动作电位；抑制性递质（甘氨酸等）使后膜Cl-通道开放，后膜更难产生动作电位。注意抑制性递质不是不作用。","example":"例：突触后膜接受抑制性递质后，Cl-内流使膜电位更负，不能产生动作电位，被抑制。","tip":"抑制性递质使膜电位更负（超极化），答题别写成无反应。"},"2|1|e|3":{"explain":"电流计题三步：标兴奋传导方向，算到达各电极时间差，判断偏转次数方向（先到先偏）。药物影响题：抑制递质释放则后膜无反应；抑制递质降解则后膜持续兴奋；阻断受体则递质不能发挥作用。","example":"例：药物使突触后膜受体失活，递质释放正常但后膜不产生动作电位，兴奋传递中断，靶点明确。","tip":"药物作用分析看作用于哪一环：释放、受体结合、还是降解回收。"},"2|1|e|4":{"explain":"两个必记判断：效应器等于传出神经末梢加它所支配的肌肉或腺体；反射是神经调节的基本方式，反射弧是结构基础。另外注意：感觉的产生在大脑皮层，不叫反射。","example":"例：判断题：针刺手产生痛觉属于反射（错），痛觉在大脑皮层产生，不属于反射，概念辨析。","tip":"产生感觉不等于反射，反射必须有完整反射弧和效应器反应。"},"2|2|k|0":{"explain":"体液调节主要内容是激素调节：激素由内分泌腺或内分泌细胞分泌，随体液（血液）运输到全身，但只作用于有特异性受体的靶器官、靶细胞。激素具微量高效、体液运输、作用靶细胞等特点。","example":"例：胰岛素由胰岛B细胞分泌，经血液运输，作用于肝细胞、肌肉细胞等靶细胞，特异性强。","tip":"激素只作用于有相应受体的靶细胞，受体是激素作用的钥匙孔。"},"2|2|k|1":{"explain":"血糖调节两激素：胰岛素（胰岛B细胞分泌）是唯一降血糖激素，通过促进组织细胞摄取、利用、储存葡萄糖降血糖；胰高血糖素（胰岛A细胞分泌）促进肝糖原分解升血糖。二者作用相反，相互拮抗。","example":"例：血糖升高，胰岛素分泌增加，血糖降低；血糖降低，胰高血糖素分泌增加，血糖升高。","tip":"胰岛素促进三条路：摄取、利用、储存；胰高血糖素只促进肝糖原分解（肌糖原不能分解成血糖）。"},"2|2|k|2":{"explain":"血糖调节是神经、体液调节：血糖浓度变化直接刺激胰岛（体液路径）；下丘脑也可经神经支配胰岛（神经路径）。分泌细胞别混：B细胞分泌胰岛素（降糖）、A细胞分泌胰高血糖素（升糖）。","example":"例：血糖升高可直接刺激胰岛B细胞分泌胰岛素，也可经下丘脑血糖调节中枢调节，双路径。","tip":"记B降A升：B细胞降血糖（胰岛素），A细胞升血糖（胰高血糖素）。"},"2|2|k|3":{"explain":"分级调节：下丘脑分泌促甲状腺激素释放激素（TRH）到垂体分泌TSH到甲状腺分泌甲状腺激素。反馈调节：甲状腺激素增多，反过来抑制下丘脑和垂体分泌（负反馈），维持含量稳定。","example":"例：切除甲状腺后，血中TRH和TSH增多（负反馈减弱）；注射甲状腺激素后TRH、TSH减少。","tip":"分级调节下丘脑到垂体到甲状腺三层，反馈是甲状腺激素抑制下丘脑和垂体。"},"2|2|k|4":{"explain":"体温调节是神经、体液调节：寒冷时皮肤冷觉感受器到下丘脑体温调节中枢，传出：皮肤血管收缩（减少散热）、骨骼肌战栗（增加产热）、甲状腺激素、肾上腺素增多；炎热时血管舒张、汗腺分泌增多。","example":"例：寒冷环境中人体产热途径：骨骼肌战栗、甲状腺激素和肾上腺素增多促进代谢，双重途径。","tip":"体温恒定的关键是产热等于散热；下丘脑是体温调节中枢，冷热觉在大脑皮层产生。"},"2|2|k|5":{"explain":"水盐调节核心：细胞外液渗透压升高，下丘脑渗透压感受器兴奋，下丘脑合成、垂体释放抗利尿激素增多，促进肾小管、集合管重吸收水，尿量减少、渗透压恢复。同时大脑皮层产生渴觉，主动饮水。","example":"例：大量出汗后细胞外液渗透压升高，抗利尿激素分泌增多，尿量减少，维持水平衡，反馈调节。","tip":"合成在下丘脑、释放靠垂体，答题两词都要写对，漏一个就扣分。"},"2|2|d|0":{"explain":"关系图记忆：TRH促进TSH促进甲状腺激素；甲状腺激素抑制下丘脑和垂体（负反馈）。做题方法：切除甲状腺，甲状腺激素减少，对下丘脑垂体抑制减弱，TRH、TSH增多；注射激素则相反。","example":"例：甲状腺功能亢进患者血中甲状腺激素多，TRH和TSH低于正常（负反馈抑制），相互制约。","tip":"分级调节层层促进，反馈调节是末端激素抑制上游两级，别画反箭头。"},"2|2|d|1":{"explain":"升糖激素有两个：胰高血糖素（促进肝糖原分解）和肾上腺素（促进肝糖原分解、代谢加快），二者协同升血糖；胰岛素与它们作用相反，相互拮抗。答题别漏肾上腺素。","example":"例：低血糖时胰高血糖素和肾上腺素分泌都增多，协同升高血糖；胰岛素分泌减少，配合默契。","tip":"升血糖两兄弟：胰高血糖素加肾上腺素；只有胰岛素降血糖。"},"2|2|d|2":{"explain":"激素作用四大特点：微量高效（含量极微作用大）；通过体液运输（血液运到全身）；作用于靶器官靶细胞（需特异性受体）；既不组成细胞结构、不提供能量、也不起催化作用，只传递信息、调节代谢。","example":"例：判断题：激素能为细胞代谢提供能量（错），激素只起信息传递和调节作用，不供能。","tip":"激素传信息不干活：不催化、不供能、不构成结构，别与酶混。"},"2|2|d|3":{"explain":"激素与酶对照：激素由内分泌细胞分泌、是信息分子、随体液运输、作用于靶细胞、发挥作用后被灭活；酶由活细胞产生、是催化剂、反应前后不变可反复利用。二者都具微量高效、特异性。","example":"例：胰岛素调节血糖后失活；唾液淀粉酶催化淀粉水解后仍保持活性，可反复利用，性质不同。","tip":"答题关键词：激素灭活、调节、靶细胞，酶不消耗、催化、活细胞产生。"},"2|2|e|0":{"explain":"血糖调节链条：血糖升高，胰岛素增多，促进摄取利用储存，血糖下降；血糖下降，胰高血糖素加肾上腺素增多，肝糖原分解，血糖回升。糖尿病分析：Ⅰ型胰岛素分泌不足；Ⅱ型受体异常。","example":"例：糖尿病患者血糖居高不下，可能是胰岛素分泌不足或靶细胞受体异常，病因不同，要分析。","tip":"糖尿病不等于一定缺胰岛素，Ⅱ型是受体问题，口服胰岛素无效（蛋白质被消化）。"},"2|2|e|1":{"explain":"经典考题模式：切除甲状腺，甲状腺激素减少，负反馈减弱，TRH、TSH增多；注射过量甲状腺激素则相反；缺碘，TSH增多，甲状腺代偿性增生。答题按分级促进、反馈抑制逻辑推导。","example":"例：给正常小鼠注射TSH，甲状腺激素增多，进而抑制下丘脑和垂体，TRH和TSH减少。","tip":"反馈抑制的是下丘脑和垂体两个器官，答题都写上。"},"2|2|e|2":{"explain":"情境题套路：剧烈运动大量出汗，失水失盐，细胞外液渗透压升高，下丘脑渗透压感受器，抗利尿激素分泌增多，肾小管集合管重吸收水增强，尿量减少；同时渴觉产生饮水。","example":"例：长时间运动后尿量减少，原因是抗利尿激素分泌增多促进肾小管集合管重吸收水，保水机制。","tip":"汗液是外界液体，大量出汗失水使渗透压升高，抗利尿激素分泌增多。"},"2|2|e|3":{"explain":"下丘脑功能全总结：神经中枢（体温、水盐、血糖调节中枢、生物节律）；感受器（渗透压感受器）；内分泌枢纽（分泌TRH、抗利尿激素，调控垂体）。见三大调节想下丘脑。","example":"例：下丘脑既能感受渗透压变化，又能分泌抗利尿激素，还能作为体温调节中枢，功能多样。","tip":"下丘脑是调节枢纽是高频答案句，别与大脑皮层（感觉、语言中枢）混。"},"2|2|e|4":{"explain":"高频陷阱句：激素是信息分子，只起调节作用：不提供能量（供能靠ATP）、不构成细胞结构、不催化反应（催化靠酶）。命题常把提供能量、催化作用安到激素头上，见到直接判错。","example":"例：判断题：甲状腺激素能为细胞代谢提供能量（错），激素只传递信息调节代谢，不供能。","tip":"三不原则记牢：激素不供能、不构成、不催化，只调节。"},"2|3|k|0":{"explain":"免疫系统三部分：免疫器官（骨髓、胸腺、脾、淋巴结、扁桃体）、免疫细胞（T、B细胞等）、免疫活性物质（抗体、淋巴因子、溶菌酶）。骨髓是免疫细胞发生场所，胸腺是T细胞成熟场所。","example":"例：T细胞在胸腺中成熟，B细胞在骨髓中成熟，成熟后分布到淋巴器官，分工明确。，成熟场所要记牢。","tip":"溶菌酶是免疫活性物质但属于第二道防线（非特异性免疫）。"},"2|3|k|1":{"explain":"三道防线记层次：第一道（皮肤和黏膜，阻挡病原体）；第二道（体液中的杀菌物质如溶菌酶、吞噬细胞，非特异性）；第三道（特异性免疫：体液免疫和细胞免疫）。前两道非特异，第三道特异。","example":"例：胃酸杀死病原体属于第二道防线；注射疫苗产生的免疫属于第三道防线，层次分明。，层次对应清楚。","tip":"第一道皮肤黏膜、第二道杀菌吞噬、第三道特异性，别把溶菌酶归第一道。"},"2|3|k|2":{"explain":"体液免疫过程：抗原被吞噬细胞摄取处理，呈递给T细胞，T细胞分泌淋巴因子，B细胞受刺激后增殖分化，浆细胞（分泌抗体，与抗原特异性结合）和记忆细胞。抗体与抗原结合后由吞噬细胞消化。","example":"例：破伤风杆菌侵入后，B细胞增殖分化产生浆细胞分泌抗体，抗体与杆菌结合，消灭抗原。","tip":"浆细胞不能识别抗原、不能分裂，只能分泌抗体；记忆细胞能长期存活。"},"2|3|k|3":{"explain":"细胞免疫针对被病原体侵入的宿主细胞（靶细胞）：T细胞受抗原刺激增殖分化，效应T细胞（与靶细胞密切接触，使其裂解死亡，释放抗原）和记忆细胞。释放的抗原再由体液免疫的抗体消灭。","example":"例：效应T细胞与被病毒感染的靶细胞接触，使其裂解，释放出病毒再由抗体消灭，分工合作。","tip":"效应T细胞接触裂解靶细胞，抗体结合游离抗原，两者分工不同。"},"2|3|k|4":{"explain":"记忆细胞是初次免疫时保留的特种兵：再次接触相同抗原时迅速增殖分化成浆细胞（或效应T）和新记忆细胞，产生二次免疫：更快（潜伏短）、更强（抗体多、维持久）。疫苗原理即产抗体和记忆细胞。","example":"例：接种疫苗后再次感染同种病原体，记忆细胞迅速增殖分化，抗体大量产生，不发病或症状轻。","tip":"二次免疫曲线：初次缓慢低峰，再次快速高峰，答题写快而强。"},"2|3|k|5":{"explain":"免疫失调三类：过敏反应（对过敏原异常反应，发作快消退快）；自身免疫病（免疫系统攻击自身组织，如风湿性心脏病）；免疫缺陷病（免疫功能不足，如艾滋病HIV攻击T细胞）。","example":"例：青霉素过敏属于过敏反应；胰岛素依赖型糖尿病可能是自身免疫攻击胰岛B细胞，方向不同。","tip":"过敏反应和自身免疫病都是过强，免疫缺陷病是过弱，方向别混。"},"2|3|d|0":{"explain":"两免疫对照记：体液免疫主力是浆细胞（由B细胞增殖分化，分泌抗体消灭游离抗原）；细胞免疫主力是效应T细胞（由T细胞增殖分化，裂解靶细胞）。记忆：B到浆（体液），T到效应T（细胞）。","example":"例：被病毒侵染的细胞由效应T细胞裂解，释放的病毒由抗体（浆细胞分泌）消灭，两者配合。","tip":"浆细胞和效应T细胞都是终末细胞，不能增殖，只能由记忆细胞或相应淋巴细胞分化。"},"2|3|d|1":{"explain":"抗体是浆细胞分泌的蛋白质，具有特异性，只能与特定抗原结合（锁钥关系）；抗体由浆细胞产生，但浆细胞本身不能识别抗原（识别靠B细胞、T细胞表面的受体）。","example":"例：抗体与抗原结合是特异性结合；浆细胞不能识别抗原，它只负责分泌抗体，各司其职。","tip":"识别抗原的细胞：吞噬细胞（非特异）、B细胞、T细胞；浆细胞和效应T细胞不识别抗原。"},"2|3|d|2":{"explain":"曲线分析要点：初次免疫潜伏期长、抗体产生慢、峰值低、维持短；二次免疫（再次接触相同抗原）记忆细胞迅速增殖分化成浆细胞，潜伏期短、抗体产生快、峰值高、维持时间长。","example":"例：注射疫苗后抗体曲线第一次低平，再次接触抗原抗体迅速大量产生，峰值远高于第一次。","tip":"二次免疫快、强、久三个字，曲线看起点时间和峰值高度。"},"2|3|d|3":{"explain":"艾滋病（AIDS）由HIV引起：HIV主要侵染辅助性T细胞，T细胞大量死亡，导致细胞免疫几乎丧失、体液免疫也受严重影响，免疫系统功能几乎全部丧失。HIV是逆转录病毒，含逆转录酶。","example":"例：HIV感染者T细胞数量持续下降，免疫监视和防卫功能严重受损，易患机会性感染。","tip":"HIV攻击T细胞导致免疫系统崩溃，传播途径：性接触、血液、母婴传播。"},"2|3|e|0":{"explain":"图解题答题要点：按流程写细胞名称（吞噬细胞到T细胞到B细胞到浆细胞或记忆细胞；T细胞到效应T细胞或记忆细胞）和功能（吞噬处理呈递、分泌淋巴因子、分泌抗体、裂解靶细胞）。","example":"例：图解中箭头指向浆细胞的细胞是B细胞，浆细胞的功能是分泌抗体，识别靠B、T细胞。","tip":"写流程用箭头串联：抗原到吞噬细胞到T细胞到（淋巴因子）B细胞到浆细胞到抗体。"},"2|3|e|1":{"explain":"曲线题答题模板：初次免疫抗体产生慢、量少、维持短；再次接触相同抗原，记忆细胞迅速增殖分化，抗体产生快、量多、维持时间长。答题必写记忆细胞迅速增殖分化这一关键过程。","example":"例：图中第二次抗体峰值明显高于第一次且出现早，原因是记忆细胞迅速增殖分化，更快更强。","tip":"二次免疫答题三要素：记忆细胞、增殖分化、快而强，缺一扣分。"},"2|3|e|2":{"explain":"判断方法看攻击对象和原因：对过敏原（花粉、海鲜）异常反应属过敏反应；攻击自身正常组织属自身免疫病（风湿性心脏病）；免疫系统功能不足属免疫缺陷病（艾滋病）。选择题先找关键词。","example":"例：吃海鲜后皮肤起疹属于过敏反应；免疫系统攻击关节滑膜属于自身免疫病，方向相反。","tip":"关键词：过敏原属过敏；自身组织属自身免疫病；HIV或免疫缺陷属免疫缺陷病。"},"2|3|e|3":{"explain":"疫苗本质是经过处理的抗原（灭活或减毒病原体、抗原蛋白），接种后刺激机体产生抗体和记忆细胞，不致病但能建立免疫记忆；再次接触真病原体时记忆细胞迅速反应。注意：疫苗是抗原不是抗体。","example":"例：接种乙肝疫苗后体内产生乙肝抗体和记忆细胞，再次接触乙肝病毒时迅速免疫，不发病。","tip":"疫苗等于抗原（主动免疫），抗体血清等于被动免疫，两者别混。"},"2|3|e|4":{"explain":"两个易错点：效应T细胞裂解靶细胞属于细胞免疫（针对胞内感染）；抗体与抗原结合后并不能直接消灭抗原，而是形成沉淀或细胞集团，最后由吞噬细胞吞噬消化。答题写全两步。","example":"例：抗体使病毒凝集成团，吞噬细胞将其吞噬消化，这是体液免疫的完整过程，两步配合。","tip":"抗体标记抗原，吞噬细胞吃掉，两环节都要写。"},"2|4|k|0":{"explain":"生长素发现四步：达尔文（胚芽鞘实验：单侧光使胚芽鞘向光弯曲，提出某种影响传下部）；詹森（琼脂块传递）；拜尔（黑暗中证明弯曲是分布不均）；温特（琼脂块实验证明是化学物质）。","example":"例：温特实验：接触过胚芽鞘尖端的琼脂块放一侧，胚芽鞘弯向对侧，证明尖端产生化学物质。","tip":"温特命名生长素、本质吲哚乙酸；达尔文只提出某种影响未提生长素。"},"2|4|k|1":{"explain":"生长素的合成和分布：合成部位主要是幼嫩的芽、叶和发育中的种子（色氨酸转变而来），分布广泛但主要集中在生长旺盛的部位（如胚芽鞘尖端、根尖、芽、发育中的果实）。","example":"例：胚芽鞘尖端是生长素合成部位，向光弯曲实验中的尖端处理就是改变生长素来源，关键变量。","tip":"生长素合成在尖端、作用在下部，尖端产生后向下运输。"},"2|4|k|2":{"explain":"生长素运输两条路：极性运输（从形态学上端运向下端，逆浓度梯度、需载体耗能，是主动运输）；横向运输（单侧光、重力使生长素在尖端横向移动，向光侧到背光侧）。极性运输只能单向。","example":"例：单侧光下胚芽鞘尖端生长素向背光侧横向运输，背光侧生长素多、生长快，弯向光源。","tip":"极性运输形态学上端到下端且是主动运输（耗能），横向运输受单侧光重力影响。"},"2|4|k|3":{"explain":"两重性：同一浓度的生长素对不同器官作用不同，低促高抑。实例：顶端优势（顶芽生长素向下运输积累，侧芽浓度高被抑制）；根的向地性（近地侧生长素多，根敏感被抑制，根弯向地）。","example":"例：根的向地性中近地侧生长素浓度高反而抑制生长，体现根对生长素敏感（两重性），浓度判断。","tip":"判断促进还是抑制看浓度是否超过该器官的最适浓度；敏感性：根大于芽大于茎。"},"2|4|k|4":{"explain":"顶端优势机制：顶芽产生的生长素向基部极性运输，在侧芽处积累，浓度过高抑制侧芽生长，顶芽浓度适中促进生长。解除方法：去掉顶芽，侧芽处生长素浓度下降，解除抑制，侧芽发育成侧枝。","example":"例：园林工人修剪树冠去掉顶芽，解除顶端优势，促进侧芽生长形成更多侧枝，应用广泛。","tip":"顶端优势体现两重性：顶芽低浓度促进、侧芽高浓度抑制，去除顶芽解除抑制。"},"2|4|k|5":{"explain":"五大激素功能记口诀赤伸胞分脱休乙熟：生长素（促生长）、赤霉素（促茎伸长、解除休眠）、细胞分裂素（促细胞分裂）、脱落酸（抑制生长、促进休眠）、乙烯（促果实成熟）。脱落酸与赤霉素拮抗。","example":"例：种子萌发时赤霉素增多、脱落酸减少；果实成熟时乙烯增多，激素协调配合，各司其职。","tip":"乙烯催熟、脱落酸休眠两个最常考；果实发育用生长素，成熟用乙烯，别混。"},"2|4|d|0":{"explain":"敏感性曲线要点：同一生长素浓度下，根、芽、茎反应不同，敏感性排序根大于芽大于茎；不同器官最适浓度不同（茎最适浓度最高）。曲线交点含义：同一浓度对两种器官作用相同。","example":"例：浓度10的负8次方mol/L对茎促进、对根抑制，说明根对生长素更敏感，最适浓度更低。","tip":"敏感性根大于芽大于茎，浓度大时根先被抑制；交点表示作用效果相同。"},"2|4|d|1":{"explain":"两种运输对比：极性运输是从形态学上端到下端（主动运输、耗能），方向固定，与重力无关（把茎倒过来，生长素仍从原形态学上端流向下端）；横向运输是受单侧光或重力影响，在尖端横向移动。","example":"例：倒置的茎段中生长素仍从形态学上端运向下端，说明极性运输不受重力影响，方向固定。","tip":"极性运输考形态学上端下端，横向运输考单侧光、重力，方向不同。"},"2|4|d|2":{"explain":"激素关系记三对：协同：生长素加赤霉素（都促进生长）、生长素加细胞分裂素（促分裂分化）；拮抗：脱落酸与赤霉素（休眠对萌发）、脱落酸与细胞分裂素。答题写协同或拮抗要配对正确。","example":"例：赤霉素促进种子萌发、脱落酸促进休眠，二者拮抗；赤霉素与生长素协同促进茎伸长。","tip":"脱落酸是抑制派，赤霉素是促进派，两派互拮抗。"},"2|4|d|3":{"explain":"实验分析四要素：达尔文实验（自变量：尖端遮光与否，结论：感光在尖端）；詹森（自变量：有无琼脂块，结论：可透过琼脂）；拜尔（结论：弯曲是分布不均）；温特（结论：化学物质引起弯曲）。","example":"例：温特实验中用未接触尖端的琼脂块作对照，排除琼脂块本身的影响，对照严谨。，排除干扰因素。","tip":"分析实验先找自变量和对照组，结论要对应自变量（尖端产生某种物质）。"},"2|4|e|0":{"explain":"实验题答题套路：描述实验现象，分析自变量和对照，得出结论。常考：感光部位在尖端（遮尖端不弯曲、遮下部仍弯曲）；弯曲部位在尖端下部；生长素分布不均导致弯曲（背光侧多生长快）。","example":"例：胚芽鞘尖端遮光、下部照光，仍弯向光源，证明感光部位是尖端不是下部，结论明确。","tip":"结论写尖端产生生长素、感光部位在尖端，别写成弯曲部位在尖端。"},"2|4|e|1":{"explain":"两重性应用三例：顶端优势（顶芽优先生长、侧芽受抑，去顶解除）；除草剂（双子叶杂草对生长素敏感，高浓度2,4-D杀死杂草）；根的向地性（近地侧生长素多抑制根生长）。","example":"例：麦田用2,4-D除草：双子叶杂草敏感被高浓度抑制杀死，单子叶小麦不敏感正常生长。","tip":"应用题先写低浓度促进、高浓度抑制，再套实例，体现两重性。"},"2|4|e|2":{"explain":"应用实例归类：无子番茄（生长素处理未受粉的雌蕊柱头，促进子房发育成果实）；香蕉催熟（乙烯利）；矮壮素（抑制茎伸长）；青鲜素（抑制发芽延长储存）。判断激素功能先看情境。","example":"例：无子番茄是生长素处理未受精子房发育而来，无子西瓜是三倍体（染色体变异），原理不同。","tip":"无子番茄（生长素、无性）对无子西瓜（三倍体、染色体变异），两原理常混考。"},"2|4|e|3":{"explain":"实验设计要点：自变量是生长素类似物浓度（设梯度0、10的负8、负6次方mol/L等）；因变量是生根数目（或根长度）；无关变量控制（枝条种类、长度、芽数相同）。预实验确定浓度范围。","example":"例：设置浓度梯度后分别处理枝条，统计各组成根数，生根最多的浓度即最适浓度，梯度设计。","tip":"必须设清水组作对照；预实验的目的是确定大致浓度范围，不能减少误差。"},"2|4|e|4":{"explain":"两组易混点：生长素促进细胞纵向伸长（不是分裂），细胞分裂素促进细胞分裂，二者作用机制不同但都促生长；无子番茄是生长素处理（基因型不变），无子西瓜是三倍体（染色体变异）。","example":"例：判断题：生长素促进细胞分裂（错），生长素促进细胞纵向伸长，细胞分裂素促分裂。","tip":"见到无子先想是哪种：番茄用生长素，西瓜是三倍体染色体变异。"},"3|0|k|0":{"explain":"种群三要素：同一区域、同种生物、全部个体（如一个池塘中所有鲫鱼）。种群不是个体的简单相加，而是有年龄结构、性别比例、密度等群体特征，是生物繁殖和进化的基本单位。","example":"例：一个鱼塘里所有鲤鱼是一个种群；鱼塘里所有鱼（多种类）是群落不是种群，区分对象。","tip":"同种生物和一定区域缺一不可，不同区域同种鱼不是同一种群。"},"3|0|k|1":{"explain":"种群特征五要素：种群密度（最基本数量特征）；出生率死亡率（直接决定种群密度）；迁入率迁出率（直接决定）；年龄结构（预测变化趋势）；性别比例（影响出生率）。","example":"例：年龄结构为增长型的种群，未来种群密度可能增大（预测趋势，不是直接决定密度）。","tip":"年龄结构预测趋势，出生率死亡率直接决定密度，措辞要准确。"},"3|0|k|2":{"explain":"年龄结构三型：增长型（幼年多老年少，出生率大于死亡率，数量增大）；稳定型（各年龄比例适中，数量相对稳定）；衰退型（老年多幼年少，数量减小）。性别比例通过影响出生率间接影响密度。","example":"例：某种群幼年个体比例大，为增长型，未来种群数量呈上升趋势，可提前规划利用，预测价值。","tip":"年龄结构只是预测，实际变化还受环境、迁入迁出影响。"},"3|0|k|3":{"explain":"两种增长模型：J形（理想条件：食物充足、无天敌，增长率恒定，曲线指数上升，无K值）；S形（现实条件：环境阻力，种群增长先快后慢，达到K值即环境容纳量后稳定）。K值受环境资源限制。","example":"例：外来物种入侵初期近似J形增长；资源有限后转为S形，数量稳定在K值附近，模型对比。","tip":"J形无K值、增长率不变；S形有K值、增长速率先增后减，K/2处速率最大。"},"3|0|k|4":{"explain":"调查方法选择：样方法适用植物和弱活动力动物（如昆虫卵），关键随机取样（五点或等距取样）；标志重捕法适用活动能力强、活动范围大的动物，公式：N等于初标记数乘重捕数除以重捕中标记数。","example":"例：调查蒲公英密度用样方法；调查田鼠密度用标志重捕法（需标记后再捕捉统计），选法关键。","tip":"样方法随机取样、样方大小数量适宜；标志重捕法标记物不能影响动物活动。"},"3|0|k|5":{"explain":"S形曲线应用：K/2处增长速率最大（种群增长最快），渔业捕捞后使剩余量维持在K/2附近，种群能快速恢复，实现可持续利用；害虫防治要早，防止其快速增长。","example":"例：渔业捕捞后鱼群数量保持在K/2左右，种群能迅速恢复，既获渔获又保持产量，可持续利用。","tip":"捕后留K/2可持续；防虫趁早，K值附近增长最慢。"},"3|0|d|0":{"explain":"两曲线对比：J形增长率（λ减1）恒定不变，增长速率持续增大，无K值；S形增长速率先增大（K/2前）后减小（K/2后），K值时增长速率为0。答题先区分增长率和增长速率。","example":"例：S形曲线中K/2时增长速率最大，K值时增长速率为0，但种群数量最大，要分清。","tip":"增长率不等于增长速率：增长率是比值，增长速率是斜率（单位时间数量变化）。"},"3|0|d|1":{"explain":"公式记忆：N等于初次标记数M乘重捕数n除以重捕中标记数m。误差分析：标记物脱落或标记个体易被捕，m偏小，N偏大；标记使个体易被捕，m偏大，N偏小。答题按分母变小结果变大推理。","example":"例：初捕标记40只，重捕50只中标记8只，则种群数量等于40乘50除以8等于250只。","tip":"误差口诀分母小则N大：标记物脱落导致重捕标记少，N偏大。"},"3|0|d|2":{"explain":"作用层次分清：出生率死亡率、迁入迁出率直接决定种群密度；年龄结构预测种群数量变化趋势（间接）；性别比例只影响出生率（不直接影响死亡率）。答题措辞：年龄结构预测，性别比例影响出生率。","example":"例：性引诱剂诱杀雄虫改变性别比例，使出生率下降，种群密度降低（害虫防治方法），有效手段。","tip":"预测与决定两词是采分点，年龄结构只能预测。"},"3|0|d|3":{"explain":"样方法操作要点：随机取样（避免主观）；方法有等距取样法和五点取样法；样方大小（植物常用1米乘1米、乔木10米乘10米）和数量要适宜；计数原则：样方内和相邻两边及其夹角上的个体。","example":"例：调查某草本植物用1米乘1米样方，五点取样，计数时样方边线上的个体按规则计数。","tip":"计数边界规则计上不计下、计左不计右，防止重复或遗漏。"},"3|0|e|0":{"explain":"选择方法看活动能力：植物、活动能力弱的动物（蚜虫、昆虫卵）用样方法；活动能力强、范围大的动物（鸟、鼠、鱼）用标志重捕法。计算题套公式N等于Mn除以m，注意单位。","example":"例：调查某草原鼠种群密度用标志重捕法；调查蒲公英种群密度用样方法，按活动能力选。","tip":"活动能力弱用样方法，活动能力强用标志重捕法，判断题干对象。"},"3|0|e|1":{"explain":"λ值含义：λ等于当年数量除以前一年数量。λ大于1种群增长（λ恒定则J形）；λ等于1数量稳定；λ小于1数量下降。S形曲线分析：K/2增长最快（捕捞策略）、K值最大数量（环境容纳量）。","example":"例：某种群λ等于1.2且恒定，为J形增长；λ逐年下降至1，转为S形接近K值，λ值判断。","tip":"λ是倍数不是增长率，增长率等于λ减1，别算错。"},"3|0|e|2":{"explain":"关系网络记忆：种群密度（核心）由出生率死亡率、迁入迁出率直接决定；年龄结构预测密度趋势；性别比例影响出生率进而影响密度。答题用箭头表示：直接决定用决定，预测用预测。","example":"例：增长型年龄结构预示种群数量将增大，但需出生率死亡率配合才真正增大，预测非决定。","tip":"选择题常把年龄结构直接决定密度当正确项，这是错的，只有预测。"},"3|0|e|3":{"explain":"应用策略：渔业捕大留小，捕捞后维持K/2左右，种群增长最快、恢复迅速，产量最高；害虫防治趁早，在种群数量低于K/2时防治，防止指数增长；也可改变K值降低环境容纳量。","example":"例：渔船在种群数量为K/2时捕捞，剩余量仍在K/2，种群快速恢复，可持续高产，策略正确。","tip":"K/2最大增长速率是解题钥匙，渔业和害虫防治策略都围绕它。"},"3|0|e|4":{"explain":"高频判断：种群密度是种群最基本的数量特征；年龄结构不直接决定密度（只预测趋势）；性别比例影响出生率不影响死亡率；迁入迁出直接影响密度。判断题见年龄结构决定密度判错。","example":"例：判断题：年龄结构直接决定种群密度（错），年龄结构预测种群数量变化趋势，措辞准确。","tip":"特征措辞题：最基本是密度，直接决定是出生死亡迁入迁出，预测是年龄结构。"},"3|1|k|0":{"explain":"群落概念要点：同一时间、一定区域、各种生物种群（动物加植物加微生物）的集合。物种丰富度指群落中物种数目的多少（丰富度高则物种多）。群落区别于种群：种群是同种生物，群落是多种生物。","example":"例：一片草原上所有生物（草、兔、鹰、微生物等）构成群落，其中物种数即丰富度，集合概念。","tip":"群落是所有生物，种群是同种生物，调查丰富度用取样器取样法。"},"3|1|k|1":{"explain":"四种种间关系：捕食（一种生物吃另一种，如狼吃羊）；竞争（争夺资源空间）；寄生（一方受益一方受害，如蛔虫寄生人体）；互利共生（双方都受益，如豆科植物与根瘤菌）。判断看双方利害关系。","example":"例：根瘤菌固氮供豆科植物利用，豆科植物提供有机物，二者互利共生，双方受益，共生关系。","tip":"寄生与互利共生：寄生一方受害，互利共生双方受益。"},"3|1|k|2":{"explain":"群落结构两层：垂直结构（在垂直方向分层：森林乔木层、灌木层、草本层，植物分层与光照有关，动物分层随植物分层）；水平结构（水平方向镶嵌分布，与地形起伏、光照、水分等差异有关）。","example":"例：森林中乔木、灌木、草本分层是垂直结构（光照）；草原上不同地段草种不同是水平结构。","tip":"垂直结构关键词分层，水平结构关键词镶嵌，别混。"},"3|1|k|3":{"explain":"演替概念：一个群落被另一个群落替代的过程（优势种逐渐替换）。两类演替：初生演替（起点无土壤、无种子等繁殖体，如裸岩、沙丘）；次生演替（起点有土壤条件或繁殖体，如弃耕农田）。","example":"例：火山喷发后裸岩上的演替是初生演替；森林火灾后恢复是次生演替，起点不同。，起点区分关键。","tip":"判断演替类型看起点有无土壤和繁殖体，不是看速度快慢。"},"3|1|k|4":{"explain":"初生演替典型顺序：裸岩到地衣（分泌有机酸分解岩石，最先出现）到苔藓（积累土壤）到草本到灌木到乔木（森林）。特点：起点无土壤、无种子，速度慢、时间长。","example":"例：裸岩上地衣最先定居，分泌地衣酸加速岩石风化形成土壤，为苔藓出现创造条件，先锋种。","tip":"初生演替首先生物是地衣，答题别写成草本；演替终点不一定是森林。"},"3|1|k|5":{"explain":"次生演替典型顺序：弃耕农田到一年生杂草到多年生草本到灌木到乔木林。起点保留土壤条件（甚至原有种子库），所以速度快、经历时间短。人类活动可改变演替速度和方向。","example":"例：弃耕农田上原有土壤和种子库保留，很快长出杂草，再逐渐演替为森林，速度快，有基础。","tip":"次生演替有土壤底子速度快；初生演替从零开始速度慢。"},"3|1|d|0":{"explain":"曲线辨析：捕食曲线两物种数量交替变化、一峰一谷错开（先增加者先减少者是被捕食者）；竞争曲线一方上升一方下降（竞争力强者增、弱者减甚至消失）；互利共生曲线同升同降同步变化。","example":"例：两条曲线A、B交替升降，A先升先降，A是被捕食者；B跟随变化，是捕食者，曲线判断。","tip":"先增先减是被捕食者是捕食曲线判断口诀；竞争看此消彼长。"},"3|1|d|1":{"explain":"判断口诀：上下分层是垂直结构（森林乔木灌木草本，都因光照等差异分层）；左右镶嵌是水平结构（地形起伏、光照水分盐碱差异导致不同地段分布不同）。答题看描述的是层还是片。","example":"例：湖泊中挺水植物、浮水植物、沉水植物分布是垂直结构（分层）；岸边到湖心变化是水平结构。","tip":"只要出现分层二字答垂直结构；镶嵌、不同地段答水平结构。"},"3|1|d|2":{"explain":"判断标准只有一个：起点有无土壤和种子等繁殖体。有则次生演替（弃耕农田、火烧迹地、砍伐森林）；无则初生演替（裸岩、沙丘、火山岩、冰川泥）。注意火灾后起点有土壤和种子，属次生演替。","example":"例：火灾后的森林土壤仍存、种子库保留，重新演替属次生演替而非初生演替，看起点判型。","tip":"看到火灾、弃耕、砍伐都是次生演替（有土壤），别被从头开始误导。"},"3|1|d|3":{"explain":"人类活动对演替的影响：可加快或延缓演替速度（如退耕还林加快、过度放牧延缓甚至逆行）；可使演替方向改变（围湖造田属逆行演替）。但人类活动不能决定演替的最终方向，演替取决于环境条件。","example":"例：过度放牧使草原向荒漠化方向演替，是人类活动改变演替方向的实例，影响显著。，方向可以改变。","tip":"人类活动影响演替速度和方向，但演替方向根本上是环境决定的。"},"3|1|e|0":{"explain":"判断四步：看利害关系（双方受益属互利共生；一方受害属寄生；一方受益一方受害且捕食者捕食属捕食；双方受损属竞争）；看曲线形态（同步升降属互利共生；交替升降属捕食；此消彼长属竞争）。","example":"例：菟丝子缠绕大豆吸取养料，大豆受害、菟丝子受益，属寄生关系，利害分明，判断依据。","tip":"竞争双方都受损（争夺资源），捕食者受益被食者受害，判断看利害方向。"},"3|1|e|1":{"explain":"答题模板：垂直结构的影响因素：植物分层与光照强度有关（光照减弱自上而下），动物分层与食物和栖息条件有关；水平结构与地形、光照、水分、土壤盐碱度等有关。","example":"例：森林中光照自上而下减弱，耐阴植物分布在下层，这是植物垂直分层的直接原因，光照主导。","tip":"植物分层原因写光照，动物分层原因写食物、栖息条件。"},"3|1|e|2":{"explain":"经典实例记牢：裸岩、沙丘、冰川泥、火山岩属初生演替；弃耕农田、火灾迹地、砍伐林地属次生演替。演替过程体现优势种更替和物种多样性增加、群落结构复杂、稳定性增强。","example":"例：弃耕农田演替为森林属次生演替，起点有土壤和种子库，速度较快，先判起点再写特点。","tip":"判断题常给裸岩上先长草本（错，先长地衣），初生演替起点是地衣。"},"3|1|e|3":{"explain":"实验要点：取样用取样器取样法（取表层土壤，用诱虫器或吸虫器分离）；统计丰富度两种方法：记名计算法（个体大种类少，直接数物种数）和目测估计法（个体小、种类多的群落，估测多度等级）。","example":"例：用诱虫器利用土壤动物避光趋湿的特性，把动物从土壤中分离出来统计，方法巧妙。，分离原理清楚。","tip":"丰富度是物种数，不是个体总数；记名计算法适用种类少个体大。"},"3|1|e|4":{"explain":"两个易错判断：演替过程中优势种不断更替，但物种总数不一定持续增加（后期可能稳定甚至减少）；演替终点不一定是森林（受水分、温度等环境条件限制，干旱地区演替到草原或荒漠为止）。","example":"例：干旱地区弃耕农田演替终点是草本或灌木群落，不会形成森林（受水分限制），条件决定。","tip":"判断题见演替一定到森林、物种数一定增多都要警惕，看环境条件。"},"3|2|k|0":{"explain":"生态系统四大成分：非生物的物质和能量（光、热、水、空气、无机盐）；生产者（绿色植物等，自养，主要成分）；消费者（动物等，促进物质循环）；分解者（细菌真菌等，必需成分）。","example":"例：生态系统中不可缺少的成分是生产者和分解者；消费者可有可无，成分判断要分清。，成分主次分明。","tip":"生产者主要、分解者必需、消费者非必需，答题按这个逻辑判断成分缺失影响。"},"3|2|k|1":{"explain":"食物链书写规则：起点必须是生产者（第一营养级），终点是最高营养级的消费者，中间是捕食关系；食物链不含分解者和非生物成分；营养级一般不超过5级（能量逐级递减）。一条食物链至少3环节。","example":"例：草到蝗虫到青蛙到蛇到鹰是5个营养级的食物链，不含分解者（细菌），书写规则明确。","tip":"食物链第一营养级是生产者；植物到动物到微生物不是食物链（微生物是分解者）。"},"3|2|k|2":{"explain":"能量流动两大特点：单向流动（能量沿食物链逐级传递，不能逆转，呼吸散失的热能不能再利用）；逐级递减（每营养级大部分耗于呼吸和分解者，仅10%到20%传下一级）。","example":"例：生产者固定1000kJ能量，下一营养级最多获得200kJ（20%），再下一级最多40kJ。","tip":"传递效率等于下一营养级同化量除以本营养级同化量乘100%，用同化量不是摄入量。"},"3|2|k|3":{"explain":"能量收支关系：摄入量等于同化量加粪便量；同化量等于呼吸消耗加用于生长发育繁殖（后者又分为流向下一营养级加流向分解者加未利用）。关键易错：粪便量不属于本营养级同化量。","example":"例：兔子吃草，草中能量一部分成为兔粪便（属草的同化量流向分解者），剩余才是兔同化量。","tip":"粪便归上一营养级，是高频陷阱；呼吸散失的热能不能再被利用。"},"3|2|k|4":{"explain":"物质循环概念：组成生物体的化学元素（C、H、O、N、P、S等）在生物群落和无机环境之间循环往复运动（是元素循环）。特点：全球性、循环往复。物质是能量载体，能量是循环动力。","example":"例：碳元素以CO2形式在无机环境与生物群落间循环，以有机物形式在生物群落内传递。","tip":"循环的是元素不是化合物；物质循环具全球性，能量流动是单向的。"},"3|2|k|5":{"explain":"碳循环路径：无机环境中的CO2经（光合作用或化能合成）进入生物群落（有机物）；生物群落内沿食物链以有机物形式传递；返回途径：动植物呼吸作用、分解者分解作用、化石燃料燃烧。","example":"例：碳从生物群落返回无机环境的三条途径：呼吸作用、分解者的分解、化石燃料燃烧，写全三条。","tip":"碳循环图判断：双向箭头连接的是大气CO2库和生产者，写全三条返回途径。"},"3|2|d|0":{"explain":"计算技巧：已知高营养级求低营养级消耗量：最多消耗按10%算，最少消耗按20%算；已知低营养级求高营养级获得量：最多获得按20%算，最少按10%算。多条食物链时按比例分配后相加。","example":"例：鹰增重1kg，经草到鼠到鹰，最少消耗草等于1除以20%除以20%等于25kg，最多等于100kg。","tip":"逆向求消耗至少用20%；正向求获得至多用20%，两个方向别混。"},"3|2|d|1":{"explain":"能量收支链条：摄入量等于同化量加粪便量；同化量等于呼吸消耗量加用于生长发育繁殖量；用于生长发育繁殖量等于流向下一营养级加流向分解者加未利用。易错点：粪便量属上一营养级同化量。","example":"例：狐狸摄入能量100，粪便20，呼吸消耗50，则同化80，用于生长发育繁殖30。","tip":"计算题先标摄入、粪便、同化，同化等于摄入减粪便，一切分配从同化开始。"},"3|2|d|2":{"explain":"两种稳定性：抵抗力稳定性（抵抗干扰保持原状的能力，营养结构越复杂越高）；恢复力稳定性（受破坏后恢复原状的能力，营养结构简单的恢复快）。二者一般负相关。基础是负反馈调节。","example":"例：热带雨林抵抗力稳定性强（结构复杂）、恢复力稳定性弱（破坏后恢复极慢），负相关。","tip":"生态系统稳定性大小与营养结构复杂程度正相关（抵抗力），别与恢复力混淆。"},"3|2|d|3":{"explain":"信息传递三类：物理信息（光、声、温度、湿度，如萤火虫发光）；化学信息（化学物质如性外激素、植物气味）；行为信息（动物特殊行为如蜜蜂跳舞）。判断看信息载体为何物。","example":"例：性外激素诱杀害虫属化学信息；蜜蜂跳8字舞通知蜜源位置属行为信息，载体判断。，载体分类明确。","tip":"声音颜色属物理信息，激素气味属化学信息，动作姿态属行为信息。"},"3|2|e|0":{"explain":"能量金字塔：各营养级能量（同化量）从低到高逐级递减，塔形不会倒置（数量金字塔可倒置：一棵树上的昆虫）。计算题用传递效率等于同化量之比，先找准各营养级同化量。","example":"例：草到兔到鹰，草同化1000，兔同化200，传递效率等于200除以1000等于20%。","tip":"能量金字塔不倒置，数量金字塔可倒置，判断题别混。"},"3|2|e|1":{"explain":"碳循环图解识图法：找双向箭头：与大气CO2库有双向箭头的成分是生产者（光合作用加呼吸作用）；只有指向大气CO2库箭头的为分解者和消费者。答题：进入靠光合，返回靠呼吸分解燃烧。","example":"例：图中A与大气CO2双向箭头，A是生产者；B、C箭头只指向大气，是消费者和分解者。","tip":"双向箭头指生产者是碳循环图解题钥匙，先找双向箭头。"},"3|2|e|2":{"explain":"营养级判断：生产者第一营养级，沿食物链依次递增；同一生物在不同食物链中可处于不同营养级。数量变化分析：天敌减少导致被捕食者先增后减趋于稳定（反馈调节）。答题按食物链逐级推理。","example":"例：蛇减少，鼠因天敌减少先增，后因食物（植物）和密度制约趋于稳定，动态平衡，负反馈。","tip":"分析某生物数量变化先看它有几条食物链、几个营养级，逐一分析再综合。"},"3|2|e|3":{"explain":"负反馈调节是生态系统自我调节的基础（如捕食者增多导致被捕食者减少导致捕食者减少，回归平衡）。稳定性比较：营养结构越复杂，自我调节能力越强，抵抗力稳定性越高，恢复力稳定性越低。","example":"例：草原上草多导致兔多导致狼多导致草被过度啃食导致兔减少，这一调节过程是负反馈。","tip":"负反馈是结果抑制原因（越多越少），正反馈是结果加强原因（越少越少）。"},"3|2|e|4":{"explain":"两大对比必记：能量流动单向、逐级递减（散失热能不能再用）；物质循环往复循环、全球性（元素在群落与无机环境间往返）。能量金字塔始终正立；数量金字塔可倒置。答题能量单行、物质循环。","example":"例：判断题：物质循环和能量流动都是往复循环的（错），能量流动单向递减、物质循环往复。","tip":"见能量循环判错；见物质单向判错，二者方向是相反特征。"},"3|3|k|0":{"explain":"人口增长的环境影响链条：人口增多，资源需求增大（粮食、水、能源消耗加快），过度开发导致环境污染加剧，栖息地破坏、物种灭绝，生物多样性下降。人口增长是环境问题的根本原因之一。","example":"例：人口增长使粮食需求增加，开垦草原导致土地荒漠化，生物多样性下降，环环相扣，影响链。","tip":"答题链条人口增、资源消耗增、污染增、多样性降，逻辑要完整。"},"3|3|k|1":{"explain":"四大全球环境问题记成因：温室效应（CO2等温室气体增多，全球气候变暖）；臭氧层破坏（氟氯烃排放，臭氧层变薄）；土地荒漠化（过度放牧）；生物多样性锐减（栖息地破坏、入侵）。","example":"例：氟利昂（氟氯烃）排放破坏臭氧层，使到达地面的紫外线增多，危害健康，成因对应。","tip":"温室效应归因CO2增多，臭氧层破坏归因氟氯烃，两者成因别混。"},"3|3|k|2":{"explain":"温室效应机理：化石燃料燃烧、森林破坏使大气CO2等温室气体增多，温室气体阻止地面长波辐射散失，全球气温升高，致冰川融化、海平面上升。臭氧层破坏：氟氯烃与臭氧反应，紫外线辐射增强。","example":"例：减少温室效应措施：减少化石燃料使用、开发新能源、植树造林增加CO2吸收，对策明确。","tip":"温室效应写CO2、燃烧、砍伐；臭氧层写氟氯烃，归因别混。"},"3|3|k|3":{"explain":"生物多样性三层次：基因多样性（物种内基因差异，是根本）；物种多样性（物种数目多）；生态系统多样性（生态系统类型多，是物种多样性的保障）。三者层次递进，是长期共同进化的结果。","example":"例：同种水稻不同品种基因不同体现基因多样性；不同生态系统体现生态系统多样性，层次判断。","tip":"三个层次由低到高：基因到物种到生态系统，答题按序写。"},"3|3|k|4":{"explain":"生物多样性三大价值：直接价值（食用、药用、工业原料、科学研究）；间接价值（生态功能：保持水土、调节气候、涵养水源，是主要价值）；潜在价值（用途未知）。生态功能类都是间接价值。","example":"例：森林保持水土、调节气候属于间接价值；人参药用属于直接价值，功能判断。，价值分类明确。","tip":"生态功能等于间接价值是高频考点，别把保持水土归为直接价值。"},"3|3|k|5":{"explain":"保护措施分级：就地保护（建立自然保护区，保护生态系统和物种最有效措施）；易地保护（迁到动物园、植物园等，适用濒危或就地保护困难的物种）；建立种子库、基因库；辅以立法、宣传教育。","example":"例：保护大熊猫：就地保护（自然保护区）为主，辅以人工繁育（易地保护），双管齐下。","tip":"就地保护最有效是答题关键句；易地保护是补充手段不是首选。"},"3|3|d|0":{"explain":"三个层次判断：基因多样性看同一物种内基因差异（品种、个体差异）；物种多样性看物种数目多少（不同种生物数量）；生态系统多样性看生态系统类型多少（森林、草原等）。先看描述对象。","example":"例：我国有500多种两栖动物体现物种多样性；水稻有数千品种体现基因多样性，对象判断。","tip":"题目说品种、品系是基因多样性；说物种数是物种多样性。"},"3|3|d|1":{"explain":"价值判断陷阱：凡描述生态功能（保持水土、调节气候等）的都是间接价值；直接被人利用（食用药用等）是直接价值；未来可能利用是潜在价值。间接价值远大于直接。","example":"例：湿地净化水质、蓄洪防旱属于间接价值；湿地旅游观光属于直接价值，功能分类。，判断不会出错。","tip":"生态功能一律间接价值，这是最常考的判断。"},"3|3|d|2":{"explain":"入侵物种危害机制：引入地缺少天敌和竞争者，快速繁殖（J形增长），占据大量资源、排挤本地物种，本地物种减少甚至灭绝，生物多样性下降，破坏生态平衡。实例：水葫芦泛滥、薇甘菊覆盖。","example":"例：水葫芦在南方水域疯长覆盖水面，遮挡光照使水生植物死亡，鱼类缺氧，多样性下降。","tip":"外来物种入侵是人爲引入加缺天敌，答题写破坏本地生态平衡、多样性下降。"},"3|3|d|3":{"explain":"两种保护比较：就地保护（建立自然保护区，保护生态系统和物种多样性，最有效措施）；易地保护（动物园、植物园、基因库，适用就地保护困难的珍稀濒危物种）。答题先判断物种状况再选措施。","example":"例：大熊猫野外种群数量少，以就地保护（自然保护区）为主，辅以人工圈养繁殖（易地保护）。","tip":"首选就地保护；濒危、圈养、迁出才用易地保护。"},"3|3|e|0":{"explain":"归因对比：温室效应（CO2等温室气体增多，来源化石燃料燃烧、森林砍伐；对策：节能减排、植树造林）；臭氧层破坏（氟氯烃排放；对策：禁用氟利昂）。答题原因、对策配对写，别交叉。","example":"例：减少温室效应应减少CO2排放（减排加造林），保护臭氧层应禁止氟氯烃排放，对策对应。","tip":"对策题一一对应：温室效应写减排造林，臭氧层写禁氟利昂。"},"3|3|e|1":{"explain":"答题要点：判断层次看对象（基因、物种、生态系统）；保护措施排序（就地保护最有效到易地保护补充到种子库基因库保基因）；价值判断（生态功能等于间接价值）。综合题按三块答。","example":"例：建立种子库保护的是基因多样性；建立自然保护区属于就地保护，一一对应，措施明确。","tip":"种子库、基因库对应基因多样性，自然保护区对应就地保护。"},"3|3|e|2":{"explain":"分析模板：引入，缺天敌、适应力强、繁殖快，数量暴增（近似J形），与本地物种竞争资源，本地物种减少、生物多样性下降，破坏生态平衡。对策：加强检疫、人工或生物防治。","example":"例：薇甘菊入侵后攀援覆盖树木，使其无法光合作用死亡，本地植被被排挤，危害明显。，后果严重。","tip":"危害分析写竞争排挤加多样性下降，别漏缺少天敌这一原因。"},"3|3|e|3":{"explain":"生态农业原理：物质循环再生（废弃物资源化，如秸秆还田、沼气池）、能量多级利用（食物链加环、提高能量利用率）。可持续发展：既满足当代人需求又不损害后代人，核心是人与自然和谐。","example":"例：桑基鱼塘：桑叶养蚕、蚕粪喂鱼、塘泥肥桑，实现物质循环再生和能量多级利用，生态农业。","tip":"生态农业关键词循环、多级利用，别写成能量高效传递（传递效率不变）。"},"3|3|e|4":{"explain":"两个判断陷阱：保护不等于绝对不开发（合理开发利用与保护结合，如适度捕捞、生态旅游）；保护生物多样性最有效措施是就地保护（自然保护区）。判断题见禁止一切开发利用判错。","example":"例：判断题：保护生物多样性就是禁止开发利用（错），应合理利用与保护相结合，理性看待。","tip":"见到禁止、杜绝一切这类绝对化表述要警惕，保护是合理利用。"},"3|4|k|0":{"explain":"微生物培养四步：配制培养基（成分：碳源、氮源、水、无机盐，有的需生长因子；可加琼脂成固体培养基）；灭菌（高压蒸汽灭菌121℃）；接种（无菌操作）；培养（适宜温度、氧气）。","example":"例：培养大肠杆菌用液体培养基（LB），需碳源（葡萄糖）、氮源（蛋白胨）、无机盐和水。","tip":"培养基灭菌用高压蒸汽灭菌法，接种环灭菌用灼烧法，方法别混。"},"3|4|k|1":{"explain":"消毒与灭菌：消毒是杀死物体表面部分微生物（不杀死芽孢和孢子），方法：煮沸、巴氏消毒（牛奶）、酒精擦拭；灭菌是杀死所有微生物（包括芽孢孢子），方法：灼烧、干热、高压蒸汽。","example":"例：培养基用高压蒸汽灭菌；牛奶用巴氏消毒（保持营养、杀死病原菌），方法不同，目的不同。","tip":"灭菌更彻底（杀芽孢）；灭菌用于培养基和器具，消毒用于实验者皮肤和牛奶。"},"3|4|k|2":{"explain":"三大传统发酵记菌种和条件：果酒用酵母菌（先通气繁殖、后密封无氧产酒精）；果醋用醋酸菌（有氧、30到35℃产醋酸）；泡菜用乳酸菌（无氧产乳酸）。各自产物：酒精、醋酸、乳酸。","example":"例：制作泡菜时坛口密封，乳酸菌无氧呼吸产生乳酸，使泡菜变酸，厌氧是产酸关键。，条件不能改变。","tip":"菌种别混：酵母菌（酒）、醋酸菌（醋）、乳酸菌（泡菜），各自代谢类型不同。"},"3|4|k|3":{"explain":"果酒果醋条件对比：果酒18到25℃，先通气（酵母菌有氧繁殖增多）后密封（无氧发酵产酒精）；果醋30到35℃，始终通气（醋酸菌是好氧菌，缺O2停止产醋）。果醋可在果酒基础上继续发酵。","example":"例：果酒发酵后期打开坛口通气，醋酸菌把酒精氧化成醋酸，果酒变果醋，需氧条件改变。","tip":"先通气后密封是果酒特征，始终通气是果醋特征，顺序和通气别写错。"},"3|4|k|4":{"explain":"发酵工程流程五步：菌种选育（诱变、基因工程获得优良菌种）；扩大培养（让菌种大量繁殖）；配制培养基并灭菌；接种到发酵罐发酵（控制温度pH溶氧）；分离提纯产品。答题按顺序写全五步。","example":"例：生产青霉素：选育高产青霉菌，扩大培养，发酵罐发酵，提取青霉素，流程完整，步骤齐全。","tip":"流程顺序不能颠倒；扩大培养在接种前，目的是获得足够菌种。"},"3|4|k|5":{"explain":"应用归类：抗生素（青霉素、头孢，青霉菌等）；食品（啤酒用酵母菌、酱油用霉菌、味精用谷氨酸棒杆菌）；基因工程产品（用转基因工程菌（大肠杆菌）生产人胰岛素）。答题写菌种加产品配对。","example":"例：用转基因大肠杆菌发酵生产人胰岛素，需把人的胰岛素基因导入大肠杆菌，工程菌生产。","tip":"味精是谷氨酸棒杆菌发酵产生谷氨酸钠；酱油是曲霉发酵，菌种别混。"},"3|4|d|0":{"explain":"对比表记四项：菌种（酵母菌、醋酸菌）；温度（18到25℃、30到35℃）；需氧（先氧后无氧、始终有氧）；产物（酒精加CO2、醋酸）。先酒后醋可连续进行。答题先判断是哪一步再写条件。","example":"例：某装置先密封18到25℃产酒，后开盖30到35℃通氧产醋，是果酒果醋连续发酵。","tip":"醋酸菌最适30到35℃、始终需氧，酵母菌先氧后无氧，对照记。"},"3|4|d|1":{"explain":"两种计数法对比：稀释涂布平板法（统计活菌，因只数形成菌落的活菌，结果偏小，两菌可能重叠成一菌落）；显微镜直接计数法（数全部菌体含死菌，偏大）。答题写涂布法偏小、镜检法偏大。","example":"例：稀释涂布平板法统计的菌落数比实际活菌数偏小，因多个菌体可能聚成一个菌落，误差分析。","tip":"涂布法数活菌偏小，镜检法数全部偏大，两个偏方向别记反。"},"3|4|d|2":{"explain":"两法对比：平板划线法（接种环在培养基表面划线，通过连续划线逐渐稀释，得到单个菌落，不需稀释菌液，只用于分离纯化）；稀释涂布平板法（菌液稀释后涂布，每个菌落来自单个菌，可计数）。","example":"例：要统计样品中活菌数用稀释涂布平板法；只需纯化单菌落可用平板划线法，按需选择。","tip":"计数只能用稀释涂布平板法（划线法不能计数）；两法都能分离纯化。"},"3|4|d|3":{"explain":"两类特殊培养基：选择培养基（允许目标菌生长、抑制其他，如加青霉素筛选抗青霉素菌）；鉴别培养基（添加指示剂或特定底物，通过颜色反应区分微生物，如加伊红美蓝鉴别大肠杆菌）。","example":"例：培养基中加高浓度NaCl筛选耐盐菌是选择培养基；加伊红美蓝鉴别大肠杆菌是鉴别培养基。","tip":"选择培养基让目标长、别人不长；鉴别培养基都长但颜色不同。"},"3|4|e|0":{"explain":"四种传统发酵汇总：果酒（酵母菌，先氧后无氧）；果醋（醋酸菌，有氧）；腐乳（毛霉等，蛋白酶脂肪酶分解豆腐）；泡菜（乳酸菌，无氧）。答题写菌种加原理加条件加产物。","example":"例：腐乳制作中毛霉分泌蛋白酶和脂肪酶，将豆腐中蛋白质分解为小分子肽和氨基酸，风味形成。","tip":"腐乳用毛霉、需氧；泡菜用乳酸菌、厌氧，需氧条件别搞反。"},"3|4|e|1":{"explain":"操作要点：倒平板（培养基灭菌后冷却至50℃左右倒平板，倒置培养防冷凝水）；接种（接种环灼烧灭菌、冷却后蘸取菌液划线）；无菌操作（超净工作台、酒精灯旁操作）。答题写关键操作及其目的。","example":"例：平板倒置培养的目的是防止培养基表面凝结的水珠滴落污染菌落，细节决定成败，操作规范。","tip":"倒平板后倒置培养防冷凝水污染，这是常考细节。"},"3|4|e|2":{"explain":"误差分析套路：涂布平板法结果偏小（多个菌体聚成一个菌落、稀释倍数过大）；显微镜计数偏大（含死菌）。答题选30到300菌落的平板计数（太多难数、太少误差大），取平均值并乘稀释倍数。","example":"例：稀释10的5次方倍涂布，平板上平均50个菌落，则原液活菌数等于50乘10的5次方除以涂布量。","tip":"计数选30到300菌落的平板，小于30或大于300误差大。"},"3|4|e|3":{"explain":"流程题答题：菌种选育（诱变育种、基因工程育种获得高产菌）；扩大培养（数量足够）；配制培养基、灭菌；接种、发酵（控制温度、pH、溶氧）；分离提纯。应用实例写菌种加产品。","example":"例：谷氨酸棒杆菌发酵生产味精需控制pH和通气量，提高谷氨酸产量，条件关键，严格调控。","tip":"发酵条件控制温度、pH、溶氧三要素常考，答题写全。"},"3|4|e|4":{"explain":"高频陷阱：果酒先通气后密封两阶段目的不同：通气阶段酵母菌有氧呼吸大量繁殖（增多菌量），密封阶段无氧呼吸产酒精；醋酸发酵始终通气（醋酸菌好氧，无氧不产醋酸）。","example":"例：判断题：果酒发酵全程密封（错），先通气繁殖后密封产酒精，醋酸发酵始终通气，条件不同。","tip":"果酒两阶段、果醋一阶段（始终有氧），密封和通气要按菌种判断。"},"3|5|k|0":{"explain":"植物组织培养核心：原理是细胞全能性（已分化细胞含全套遗传物质）；过程：外植体（离体组织）到脱分化（形成愈伤组织）到再分化（分化出根芽）到完整植株。条件：无菌、适宜营养和激素。","example":"例：取胡萝卜韧皮部细胞作外植体，经脱分化、再分化培育成完整植株，证明细胞全能性。","tip":"脱分化形成愈伤组织、再分化形成根芽，顺序不能反。"},"3|5|k|1":{"explain":"组织培养条件要点：无菌（外植体消毒、培养基灭菌）；适宜温度（25℃）；植物激素调控：生长素与细胞分裂素比例不同，诱导不同分化方向（高促根低促芽）；光照（脱分化避光）。","example":"例：培养基中生长素与细胞分裂素比值高时促进生根，比值低时促进生芽，比例调控分化。","tip":"激素比例影响分化方向，这是组织培养的调控关键。"},"3|5|k|2":{"explain":"植物体细胞杂交流程：用纤维素酶和果胶酶去除细胞壁，获得原生质体，物理（离心、电激）或化学（聚乙二醇PEG）方法诱导融合，杂种细胞，再生出细胞壁，组织培养成杂种植株。","example":"例：番茄细胞与马铃薯细胞去壁融合，再生壁后组织培养，培育出番茄马铃薯杂种植株，跨种杂交。","tip":"去壁用纤维素酶和果胶酶（不是胰蛋白酶），动物细胞分散才用胰蛋白酶。"},"3|5|k|3":{"explain":"动物细胞培养四条件：无菌无毒；营养（必需氨基酸、糖类、动物血清）；适宜温度（36.5加减0.5℃）、pH（7.2到7.4）；气体环境95%空气加5%CO2（CO2维持pH）。","example":"例：动物细胞培养液中加入5%CO2的作用是维持培养液pH稳定，条件关键，不可缺少。","tip":"动物培养加血清、CO2维持pH；植物培养不需要血清，靠激素。"},"3|5|k|4":{"explain":"培养流程：取动物胚胎或幼龄动物组织，剪碎，用胰蛋白酶处理分散成单个细胞，原代培养，贴壁生长、接触抑制后传代培养。一般传至10代左右开始衰退，50代内保持二倍体核型。","example":"例：胰蛋白酶的作用是消化细胞间质蛋白，使组织分散成单个细胞便于培养，关键步骤。，分散是前提。","tip":"胰蛋白酶分散细胞是动物细胞培养的标志操作，植物去壁用纤维素酶果胶酶。"},"3|5|k|5":{"explain":"单克隆抗体原理：B淋巴细胞能产生特异性抗体但不能无限增殖，骨髓瘤细胞能无限增殖但不产抗体；二者融合成杂交瘤细胞，兼具无限增殖加产生特异性抗体两大优点。筛选：HAT培养基筛选。","example":"例：制备抗乙肝病毒单抗：骨髓瘤细胞加免疫后的B淋巴细胞，杂交瘤细胞，筛选，培养产生单抗。","tip":"两次筛选：第一次筛杂交瘤细胞（HAT），第二次筛能产生特定抗体的杂交瘤细胞。"},"3|5|d|0":{"explain":"对比记忆：植物组织培养（固体培养基、激素调控、不需血清）；动物细胞培养（液体培养基、需加动物血清（含生长因子）、需5%CO2维持pH、贴壁生长）。共同点：无菌、适宜温度pH。","example":"例：动物细胞培养需加血清和5%CO2，植物组织培养不需血清，靠植物激素调控，条件对比。","tip":"见到血清、CO2选动物细胞培养；见到激素比例选植物组织培养。"},"3|5|d|1":{"explain":"两个过程区分：脱分化（已分化的细胞失去原有结构和功能，形成愈伤组织，未分化的细胞团，此阶段一般避光）；再分化（愈伤组织在激素作用下重新分化出根、芽等器官，此阶段需光）。","example":"例：外植体培养几天后形成一团排列疏松的愈伤组织，这是脱分化的结果，未分化状态，过程识别。","tip":"脱分化变原始（愈伤组织），再分化变高级（根芽），方向别反。"},"3|5|d|2":{"explain":"两次筛选各司其职：第一次用HAT培养基（骨髓瘤缺酶死亡，B细胞不能增殖，只有杂交瘤存活），筛出杂交瘤细胞；第二次用抗原抗体检测，筛出产生特定抗体的细胞。","example":"例：HAT培养基中只有杂交瘤细胞能存活（B细胞不能增殖、骨髓瘤细胞缺酶死亡），筛选原理。","tip":"第一次筛是不是杂交瘤，第二次筛能不能产所需抗体，两次目的不同。"},"3|5|d|3":{"explain":"融合方法对比：植物原生质体融合：物理法（离心、振动、电激）加化学法（聚乙二醇PEG）；动物细胞融合：物理法加PEG加灭活病毒（仙台病毒）诱导。答题写动物特有病毒诱导。","example":"例：制备单克隆抗体时用灭活的仙台病毒或PEG诱导骨髓瘤细胞与B淋巴细胞融合，诱导方法。","tip":"灭活病毒诱导是动物细胞融合特有；植物融合没有病毒法。"},"3|5|e|0":{"explain":"流程题答题：外植体（消毒）到接种到培养基到脱分化形成愈伤组织到再分化形成根芽到移栽成活。原理：细胞全能性。应用：快速繁殖（兰花）、脱毒苗（取茎尖培养，茎尖几乎无病毒）。","example":"例：取兰花茎尖作外植体组织培养，可获得大量脱毒兰花苗，体现快速繁殖和脱毒，应用价值。","tip":"茎尖脱毒是常考应用，因为茎尖分生区病毒极少。"},"3|5|e|1":{"explain":"答题要点：条件四件套（无菌无毒、营养加血清、适宜温度pH、95%空气加5%CO2）；胰蛋白酶作用（消化间质蛋白、分散细胞、传代消化）；贴壁生长、接触抑制。","example":"例：传代培养时用胰蛋白酶处理贴壁细胞，使其脱落分散，再分瓶培养，继续增殖。，传代更顺利。","tip":"胰蛋白酶分散细胞两处用：取材分散和传代消化；别写成分解细胞。"},"3|5|e|2":{"explain":"流程三步：免疫小鼠获得能产抗体的B淋巴细胞（脾细胞）；与骨髓瘤细胞融合（PEG或灭活病毒），HAT筛选杂交瘤细胞；抗体检测筛选产生特定抗体的杂交瘤细胞，克隆化培养，提取单抗。","example":"例：用单抗作生物导弹可把抗癌药物定向带到肿瘤部位，因单抗特异性识别肿瘤抗原，靶向治疗。","tip":"答题写两次筛选：HAT筛杂交瘤、检测筛产特异抗体的杂交瘤，别漏第二次。"},"3|5|e|3":{"explain":"植物体细胞杂交的意义：克服不同种、属植物间远缘杂交不亲和（传统有性杂交做不到），如番茄与马铃薯杂交。流程：去壁（纤维素酶果胶酶），原生质体融合，杂种细胞再生壁，组织培养。","example":"例：白菜与甘蓝体细胞杂交获得白菜甘蓝杂种植株，克服了种间杂交不亲和障碍，育种突破。","tip":"克服远缘杂交不亲和是植物体细胞杂交区别于传统育种的独特意义。"},"3|5|e|4":{"explain":"两个高频判断：植物组织培养从单个已分化细胞（外植体）育成完整植株，体现细胞全能性；单克隆抗体由单一杂交瘤细胞克隆产生，化学性质单一、特异性强、灵敏度高。","example":"例：判断题：杂交瘤细胞既能无限增殖又能产生特异性抗体（对），这是单抗制备基础，优点兼备。","tip":"单抗单一、特异、灵敏三词；植物组织培养体现全能性。"},"3|6|k|0":{"explain":"三大工具：限制酶（识别特定核苷酸序列并切割磷酸二酯键，产生黏性末端或平末端）；DNA连接酶（连接磷酸二酯键，把DNA片段连起来）；运载体（质粒、噬菌体，能自我复制、有标记基因）。","example":"例：EcoRI识别GAATTC序列并切割，产生黏性末端，由DNA连接酶把目的基因与质粒连起来。","tip":"限制酶切磷酸二酯键（不是氢键），解旋酶才断氢键，工具酶作用别混。"},"3|6|k|1":{"explain":"基因工程四步：获取目的基因（从基因文库、PCR扩增、化学合成）；构建基因表达载体（核心步骤：目的基因加启动子加终止子加标记基因）；导入受体细胞（转化）；检测与鉴定。","example":"例：抗虫棉培育：获取Bt毒蛋白基因，构建表达载体，农杆菌转化导入棉花，检测抗虫性。","tip":"核心步骤是基因表达载体的构建，不是导入受体细胞。"},"3|6|k|2":{"explain":"表达载体四部分：目的基因（要表达的基因）；启动子（RNA聚合酶识别结合位点，启动转录）；终止子（终止转录）；标记基因（抗生素抗性基因等，用于筛选含目的基因的受体细胞）。","example":"例：质粒上的氨苄青霉素抗性基因是标记基因，含该质粒的细胞能在含抗生素培养基中存活。","tip":"启动子不等于起始密码子：启动子是DNA上转录起点，起始密码子在mRNA上。"},"3|6|k|3":{"explain":"导入方法三对应：植物：农杆菌转化法（农杆菌Ti质粒的T-DNA能转移并整合到植物染色体）；动物：显微注射法（注入受精卵）；微生物（大肠杆菌）：感受态细胞法（Ca2+增大通透性）。","example":"例：转基因棉花用农杆菌转化法：农杆菌的Ti质粒携带Bt基因，T-DNA把基因转入棉花细胞。","tip":"农杆菌转化法只能用于植物；显微注射用于动物受精卵；受体是受精卵才能遗传给后代。"},"3|6|k|4":{"explain":"检测三层次：DNA分子杂交（检测目的基因是否导入）；分子杂交（检测是否转录出mRNA）；抗原抗体杂交（检测是否翻译出蛋白质）。个体水平：抗虫、抗病性状观察。答题写三级检测。","example":"例：用含标记的Bt基因作探针与棉花DNA杂交，出现杂交带说明目的基因已导入，检测明确。","tip":"检测层次对应：DNA查导入、mRNA查转录、蛋白质查翻译，别错位。"},"3|6|k|5":{"explain":"PCR三步循环：变性（90到95℃解旋）；复性（55℃引物与模板结合）；延伸（72℃左右Taq酶沿模板合成新链）。条件：模板、引物、脱氧核苷酸、Taq酶。每轮DNA数量翻倍。","example":"例：PCR扩增某基因30轮，DNA数量为2的30次方个拷贝（理论值），指数增长，扩增迅速。","tip":"PCR用高温变性替代解旋酶，用Taq酶耐高温；引物是人工合成的短DNA片段。"},"3|6|d|0":{"explain":"两酶对比：限制酶（识别特定序列、切割磷酸二酯键，切出黏性末端或平末端）；DNA连接酶（连接磷酸二酯键，把相同末端的DNA片段缝合）。都作用于磷酸二酯键，都不作用于氢键。","example":"例：用同一种限制酶切割目的基因和质粒，产生相同黏性末端，再用DNA连接酶连接，配套使用。","tip":"限制酶加连接酶对应磷酸二酯键是判断题高频点；解旋酶才断开氢键。"},"3|6|d|1":{"explain":"构建要点：启动子（位于目的基因上游，RNA聚合酶识别结合并启动转录）；终止子（位于下游终止转录）；标记基因（抗生素抗性基因，用于筛选）。易错点：启动子不是起始密码子。","example":"例：含标记基因的细胞能在含抗生素培养基中存活，不含的死亡，从而筛选出转化细胞，筛选原理。","tip":"答题区分：启动子启动转录、标记基因筛选，功能别混。"},"3|6|d|2":{"explain":"PCR计算规律：每轮循环，每个DNA分子复制出2个，n轮后DNA总数等于2的n次方；所需引物数等于2的（n加1）次方减2（每合成一条新链需一个引物）。答题套公式。","example":"例：1个DNA经PCR扩增5轮得32个DNA；共需引物等于2的6次方减2等于62个。","tip":"引物数等于新合成链数等于2乘（2的n次方减1），别只算DNA数。"},"3|6|d|3":{"explain":"综合题套路：抗虫棉培育流程：获取Bt毒蛋白基因（目的基因）；构建表达载体；农杆菌转化法导入棉花体细胞；组织培养成植株；检测（DNA杂交、分子杂交、抗原抗体杂交）；抗虫性鉴定。","example":"例：抗虫棉的抗虫性状由Bt毒蛋白基因控制，导入和表达都成功才表现出抗虫性，双重检测。","tip":"综合题写全四步操作加检测层次，植物受体细胞用体细胞时需组织培养成植株。"},"3|6|e|0":{"explain":"排序题记四步：获取目的基因，构建表达载体（核心），导入受体细胞，检测鉴定。各步目的：构建载体（让目的基因能复制、表达、便于筛选）；导入（转化）；检测（确认导入、转录、翻译）。","example":"例：正确顺序：获取目的基因，构建表达载体，导入受体细胞，检测与鉴定，不可颠倒，流程固定。","tip":"排序题先找构建表达载体（必在导入前），再前后排。"},"3|6|e|1":{"explain":"三酶辨析：限制酶（识别序列、切磷酸二酯键，基因工程用）；DNA连接酶（连接磷酸二酯键，基因工程用）；解旋酶（复制时断氢键）；RNA聚合酶（转录时合成RNA）。断氢键的是解旋酶。","example":"例：DNA复制需要解旋酶和DNA聚合酶；基因工程需要限制酶和DNA连接酶，按过程选酶。","tip":"做题先看过程：复制用解旋酶加聚合酶；转录用RNA聚合酶；基因工程用限制酶加连接酶。"},"3|6|e|2":{"explain":"三级检测对应：DNA分子杂交（目的基因是否导入）；分子杂交（是否转录出mRNA）；抗原抗体杂交（是否翻译出蛋白质）。个体水平鉴定：抗虫实验等。答题写导入、转录、翻译、性状层层递进。","example":"例：提取棉花叶片总DNA与Bt基因探针杂交有杂交带，说明目的基因已导入，检测水平对应。","tip":"杂交三用法：DNA-DNA、DNA-mRNA、抗原-抗体，检测层次不同。"},"3|6|e|3":{"explain":"应用实例：抗虫棉（Bt毒蛋白基因抗虫）；转基因动物（乳腺生物反应器产药用蛋白，如转基因羊产人凝血因子）；基因治疗（把正常基因导入有缺陷的细胞）。安全性讨论：理性看待转基因产品。","example":"例：乳腺生物反应器：把目的基因与乳腺蛋白基因启动子相连，在乳汁中生产药用蛋白，定向生产。","tip":"乳腺生物反应器启动子用乳腺蛋白基因启动子，让蛋白只在乳腺表达。"},"3|6|e|4":{"explain":"两个必记判断：限制酶具有专一性（识别特定序列、切特定位置），作用对象是磷酸二酯键；基因工程核心步骤是基因表达载体构建，不是导入受体细胞。判断题见核心是导入判错。","example":"例：判断题：基因工程的核心是目的基因导入受体细胞（错），核心是表达载体的构建，判断明确。","tip":"核心等于构建表达载体是最高频判断点，务必记牢。"},"3|7|k|0":{"explain":"胚胎工程技术体系：体外受精（试管动物）、胚胎移植（借腹怀胎）、胚胎分割（一胚多胎）、胚胎干细胞培养。共同基础：早期胚胎发育规律。应用：良种繁殖、保护濒危动物、医学治疗。","example":"例：良种奶牛快速繁殖：超数排卵，体外受精或体内受精，胚胎移植到普通母牛子宫，借腹怀胎。","tip":"胚胎工程操作对象是早期胚胎，不是受精卵直接发育后的成体。"},"3|7|k|1":{"explain":"体外受精流程：卵母细胞采集（从卵巢取出，培养到MⅡ中期成熟）；精子获能处理（在获能液中处理，获得受精能力）；二者在受精液中体外受精；受精卵在培养液中发育到桑葚胚或囊胚。","example":"例：体外受精前精子需获能处理，卵母细胞需培养到MⅡ中期（次级卵母细胞）才能受精。","tip":"获能是精子在体外获得受精能力；卵母细胞要成熟到MⅡ中期才能受精。"},"3|7|k|2":{"explain":"胚胎移植操作：供体母牛超数排卵（促性腺激素）、体内或体外受精，冲取早期胚胎，移植到受体子宫。实质：早期胚胎在相同生理环境下的空间转移，不改变胚胎遗传物质。意义：一牛多胎。","example":"例：把良种奶牛胚胎移植到普通奶牛子宫内，生出的犊牛遗传物质来自良种供体，受体只提供场所。","tip":"胚胎移植是借腹怀胎，后代遗传物质来自供体，受体只提供孕育场所。"},"3|7|k|3":{"explain":"胚胎移植成功的生理学基础两点：供体与受体同期发情（子宫环境同步，胚胎才能着床发育）；受体对移入胚胎基本不发生免疫排斥（早期胚胎未被免疫系统识别，属同种移植）。","example":"例：受体母牛与供体母牛同期发情处理，使子宫环境与胚胎发育阶段一致，利于着床，生理基础。","tip":"同期发情加免疫不排斥两条生理基础是答题得分点。"},"3|7|k|4":{"explain":"胚胎分割：用分割针把桑葚胚或囊胚分割成2份或多份，各份继续发育成完整胚胎。注意：囊胚分割时须将内细胞团均等分割（否则影响发育）。后代遗传物质相同，属无性繁殖，性别相同。","example":"例：一枚良种胚胎分割成两枚移植，产出两头基因型相同（同卵）的犊牛，一胚多胎，提高利用率。","tip":"囊胚分割内细胞团均等分割是注意事项；分割后代无性繁殖、性别相同。"},"3|7|k|5":{"explain":"胚胎干细胞（ES细胞）来源：早期胚胎（囊胚内细胞团）或原始性腺；特点：具有全能性（可分化为各种组织细胞）、体外可无限增殖、可冷冻保存。应用：治疗性克隆、器官移植研究。","example":"例：囊胚的内细胞团细胞是胚胎干细胞，可分化为神经细胞、心肌细胞等多种细胞，全能性高。","tip":"ES细胞全能性最高（胚胎来源），成体干细胞分化潜能低（多能或专能）。"},"3|7|d|0":{"explain":"关系辨析：胚胎移植是基础技术（把胚胎移入受体）；胚胎分割把一枚胚胎分成多枚，提高胚胎利用率（一胚多胎）。胚胎分割后的胚胎还需移植才能发育成个体。二者组合使用：先分割再移植。","example":"例：一枚囊胚分割成两枚，分别移植到两头受体，获得两头基因型相同的牛犊，无性繁殖。","tip":"分割提高利用率，移植提供发育场所，先分割后移植。"},"3|7|d|1":{"explain":"区别要点：体内受精（自然交配，精子在雌性生殖道内获能，无需人工处理）；体外受精（人工取出精卵，精子需在获能液中获能、卵母细胞培养成熟，在受精液中完成受精）。答题写体外获能关键词。","example":"例：试管牛培育中精子在体外获能液中获能，卵母细胞培养到MⅡ中期后体外受精，步骤完整。","tip":"获能本质上都要发生，只是体外受精在体外进行获能。"},"3|7|d|2":{"explain":"干细胞比较：胚胎干细胞（来源早期胚胎内细胞团、原始性腺；全能性最高，可分化为各种组织细胞）；成体干细胞（来源成体组织如骨髓造血干细胞；多能或专能，只能分化成特定组织细胞）。","example":"例：骨髓造血干细胞只能分化为血细胞（多能），不能分化为神经细胞，分化潜能低于ES细胞。","tip":"全能性最高等于胚胎干细胞，成体干细胞分化潜能有限。"},"3|7|d|3":{"explain":"伦理与安全讨论要点：转基因食品（需科学评估安全性、标识管理，不盲目恐慌）；克隆人（违反伦理道德、法律禁止，治疗性克隆用于医学研究可讨论）；基因检测（隐私保护、避免基因歧视）。","example":"例：我国禁止生殖性克隆人，但支持治疗性克隆研究（用于医学治疗），立场明确，区分对待。","tip":"答题用理性看待、科学评估、遵守伦理法规的表述，别走极端。"},"3|7|e|0":{"explain":"程序要点：供体超数排卵（促性腺激素），同期发情处理，配种或体外受精，冲取胚胎，检查质量，移植到受体，受体妊娠产仔。生理基础：同期发情加受体不排斥。答题写供体提供胚胎、受体提供环境。","example":"例：良种母牛用促性腺激素超数排卵，与普通母牛同期发情后移植胚胎，程序完整，步骤规范。","tip":"受体牛不提供遗传物质，只提供子宫环境，答题强调这一点。"},"3|7|e|1":{"explain":"培养条件要点：培养液成分（水、无机盐、有机盐、维生素、激素、氨基酸、核苷酸、血清等）；气体环境（95%空气加5%CO2，CO2维持pH）；温度37℃左右；定期更换培养液。","example":"例：体外培养胚胎需5%CO2维持培养液pH，加血清提供营养和生长因子，条件关键。","tip":"胚胎培养与动物细胞培养条件相似：血清加95%空气5%CO2。"},"3|7|e|2":{"explain":"分割要点：材料选桑葚胚或囊胚（发育早期、细胞未分化）；囊胚分割必须将内细胞团均等分割（内细胞团将来发育成胎儿）；滋养层细胞将来发育成胎膜胎盘。分割后代遗传物质相同、性别相同。","example":"例：分割囊胚时若内细胞团分配不均，一半胚胎可能发育不良，故必须均等分割，注意事项。","tip":"内细胞团到胎儿、滋养层到胎膜胎盘分工别混；分割后性别相同。"},"3|7|e|3":{"explain":"两大技术对比：试管婴儿（体外受精加移植，精卵结合，有性生殖）；克隆（核移植：体细胞核加去核卵细胞，无性生殖，遗传物质主要来自供核体）。答题判断有无受精作用。","example":"例：试管婴儿是精子和卵细胞体外受精（有性生殖）；多莉羊是体细胞核移植（无性生殖）。","tip":"试管婴儿不等于克隆：前者有受精、后者无受精，这是判断关键。"},"3|7|e|4":{"explain":"两个高频判断：胚胎移植受体只提供孕育场所，不提供遗传物质（后代遗传物质来自供体胚胎）；胚胎分割后代来自同一受精卵，遗传物质相同、性别相同（同卵多胎）。答题写遗传物质不变。","example":"例：判断题：胚胎移植后代的遗传物质来自受体母牛（错），来自供体胚胎，受体不提供遗传物质。","tip":"受体不提供遗传物质是判断题高频陷阱，务必记牢。"},"4|0|k|0":{"explain":"核心公式：总光合速率等于净光合速率加呼吸速率。气体交换图分析：光照下测的CO2吸收量、O2释放量都是净光合；黑暗下CO2释放量、O2吸收量是呼吸速率。答题先判断数据是净还是总光合。","example":"例：光照下CO2吸收量6、黑暗中CO2释放量2，总光合速率等于6加2等于8，公式应用。","tip":"吸收、释放是净光合，固定、产生是总光合，先判断再计算。"},"4|0|k|1":{"explain":"三个表示角度：净光合等于CO2吸收量等于O2释放量等于有机物积累量；总光合等于CO2固定量等于O2产生量；呼吸等于黑暗下CO2释放量。测定：黑暗测呼吸，光照测净光合。","example":"例：某植物光照下每小时O2释放5mg、黑暗下每小时O2吸收2mg，总光合产O2为7mg/h。","tip":"净等于积累、总等于制造两个词对应好，有机物积累量是净光合。"},"4|0|k|2":{"explain":"两个关键点：光补偿点（光合等于呼吸，净光合为0，有机物不积累）；光饱和点（光合不再随光照增强而增大，此时限制因素转为CO2浓度、温度等）。答题写补偿点净光合为0。","example":"例：光补偿点时植物白天有机物积累为0（光合等于呼吸）；超过饱和点增加CO2浓度可再增产。","tip":"补偿点后净光合为正；饱和点后限制因素是CO2和温度，不是光照。"},"4|0|k|3":{"explain":"五大环境因素：光照强度（光反应限制）、CO2浓度（暗反应限制）、温度（影响酶活性）、水分、矿质元素。多因子作用：改变一因素时另一因素制约显现（如光照充足时增CO2有效）。","example":"例：光照饱和点后增施CO2肥，光合速率继续增大，说明CO2成为限制因素，因素判断。","tip":"限制因素题：饱和点后找CO2、温度，别答光照。"},"4|0|k|4":{"explain":"光合午休机理：夏季中午光照强、温度高，蒸腾作用过强，叶片气孔部分关闭（保水），CO2吸收减少，暗反应（CO2固定）减慢，光合速率下降，出现午休现象。午后气孔恢复，光合回升。","example":"例：夏季晴天中午植物光合速率下降，原因是气孔关闭、CO2供应不足，暗反应受抑制。","tip":"午休写气孔关闭、CO2减少、暗反应减慢，写全因果链。"},"4|0|k|5":{"explain":"两个同位素实验：鲁宾和卡门用18O分别标记水和CO2，证明光合作用释放的O2全部来自水；卡尔文用14C标记CO2，追踪14C：CO2到C3到（CH2O），发现暗反应中C3还原。","example":"例：鲁宾和卡门：标记水的组释放18O2，标记CO2的组无18O2，证明O2来自水，实验严谨。","tip":"O2来自水、CO2先固定成C3再还原成糖，两个结论常考。"},"4|0|d|0":{"explain":"密闭装置：容器中CO2浓度降低（光合吸收大于呼吸释放）或升高（呼吸大于光合）；光照下植物从外界吸收CO2量等于净光合，黑暗中释放CO2等于呼吸。答题三步：判条件、标净总、套公式。","example":"例：密闭容器光照下CO2浓度持续下降，说明光合吸收大于呼吸释放，净光合为正，装置分析。","tip":"密闭装置看CO2浓度升降判断净光合正负；别忘了呼吸始终在进行。"},"4|0|d|1":{"explain":"判断技巧：凡吸收、释放到外界的量都是净光合（如CO2吸收、O2释放）；凡固定、产生在叶绿体内的量都是总光合（CO2固定、O2产生）。答题先圈关键词：吸收或释放是净，固定或产生是总。","example":"例：叶绿体CO2固定量等于呼吸释放的CO2加从外界吸收的CO2，是总光合，数据相加。","tip":"做题先圈吸收、释放、固定、产生四个词，再定净总。"},"4|0|d|2":{"explain":"多因子曲线分析：多条曲线代表不同CO2浓度下的光照与光合曲线。判断限制因素：曲线重合段（不同CO2浓度结果相同）限制因素是光照；曲线分开段限制因素是CO2。先看曲线是否重合。","example":"例：两CO2浓度下的光饱和点不同，饱和点后两曲线分开，说明CO2是限制因素，曲线判断。","tip":"曲线重合是共同限制因素（光照），曲线分开是差异因素（CO2）。"},"4|0|d|3":{"explain":"装置设计要点：测呼吸：装置遮光（黑布），测CO2释放量或O2吸收量；测净光合：装置光照，测CO2吸收量或O2释放量；总光合等于光照装置数据加黑暗装置数据。控制变量：温度、装置相同。","example":"例：两个装置一组遮光一组光照，遮光组测得呼吸速率，光照组测得净光合，相加得总光合。","tip":"装置题先标遮光等于呼吸、光照等于净光合，再用公式。"},"4|0|e|0":{"explain":"综合题解题框架：看图定场所（叶绿体、线粒体），标物质流向（CO2、O2、葡萄糖），判断净总光合，套公式计算，分析曲线趋势。答题按场所、物质、数据、结论组织，箭头代表气体进出。","example":"例：图示光照下叶绿体产O2部分进线粒体、部分释放外界，进线粒体的量加释放量等于总产O2量。","tip":"压轴题先列公式总等于净加呼，再逐项对数据，别急于计算。"},"4|0|e|1":{"explain":"计算套路：找数据（吸收或释放等于净，固定或产生等于总）；套公式（总等于净加呼）；换算（单位统一）。曲线分析：纵轴为CO2吸收量时，与横轴交点为光补偿点，曲线最高点为光饱和点。","example":"例：25℃下测得净光合10、呼吸4，总光合14；温度升高呼吸增大，补偿点右移，数据分析。","tip":"温度变化影响呼吸：呼吸增强导致光补偿点右移、光饱和点可能下降。"},"4|0|e|2":{"explain":"实验设计：探究光照强度：自变量光照（不同距离的灯），因变量气泡数（O2释放量），无关变量（温度、CO2浓度、植物种类）相同；探究CO2浓度：自变量NaHCO3浓度，因变量气泡数。","example":"例：用不同功率灯泡调节光照强度，观察金鱼藻产生气泡速率，气泡数代表净光合，因变量明确。","tip":"气泡数是净光合指标（释放到外界的O2）；用NaHCO3提供CO2。"},"4|0|e|3":{"explain":"农业应用原理：合理密植（充分利用光照，避免相互遮阴）；通风透光（增加CO2供应）；增施有机肥（微生物分解产生CO2和无机盐，提高光合）。答题写增大光合面积、提高CO2浓度等原理。","example":"例：温室栽培增施CO2气肥提高光合速率；合理密植避免过密导致光照不足，增产有据。","tip":"应用题扣光照、CO2、温度三因素：密植写光，通风增肥写CO2，大棚写温度。"},"4|0|e|4":{"explain":"两大陷阱：光补偿点光合等于呼吸，净光合为0，有机物不积累（不是不进行光合）；光饱和点后光照不再是限制因素，限制因素是CO2浓度和温度（增加光照无效）。","example":"例：判断题：光补偿点时植物不进行光合作用（错），光合仍在进行，只是光合等于呼吸。","tip":"补偿点光合进行但净为0，饱和点加光无效加CO2有效。"},"4|1|k|0":{"explain":"系谱分析两步：第一步判显隐性：无中生有（双亲正常生出患病孩子）属隐性；有中生无（双亲患病生出正常孩子）属显性。第二步判位置：隐性遗传看女病（女患者的父亲和儿子都患病则伴X隐性）。","example":"例：系谱中双亲正常、儿子患病属隐性遗传；若该女患者的父亲也患病则可能伴X隐性，逐步判断。","tip":"无中生有为隐性、有中生无为显性是第一步，位置判断用口诀。"},"4|1|k|1":{"explain":"两句口诀：隐性遗传看女病：若女患者的父亲或儿子正常，则排除伴X隐性，为常染色体隐性；显性遗传看男病：若男患者的母亲或女儿正常，则排除伴X显性，为常染色体显性。","example":"例：某隐性病女患者父亲正常，可排除伴X隐性（X隐女病父必病），应为常染色体隐性。","tip":"口诀只说排除不说确定：无病只能排除伴性，不能直接确定常染色体。"},"4|1|k|2":{"explain":"概率计算差异：常染色体遗传中男女患病机会均等；伴X隐性遗传男性患者多于女性；伴X显性女性多于男性。计算时先写基因型（男XY、女XX），再按配子组合算，注意生男孩患病与患病男孩之别。","example":"例：XAXa乘XAY，后代中患病男孩（XaY）等于1/4；男孩患病等于1/2（男孩中1/2患病）。","tip":"患病男孩先算患病再算性别（乘1/2）；男孩患病在男孩范围内算。"},"4|1|k|3":{"explain":"遗传病三类：单基因遗传病（一对等位基因控制，如白化病常隐、红绿色盲伴X隐）；多基因遗传病（多对基因加环境）；染色体异常遗传病（如21三体综合征）。注意遗传病不都是基因病。","example":"例：红绿色盲是单基因（伴X隐性）遗传病；21三体综合征是染色体数目异常遗传病，类型区分。","tip":"遗传病不等于基因病：染色体异常遗传病不是基因突变引起；先天性疾病不等于遗传病。"},"4|1|k|4":{"explain":"预防措施：遗传咨询（推算再发风险、提出建议）；产前诊断（羊水检查、B超、基因诊断）。基因诊断：用DNA探针检测胎儿是否携带致病基因。答题写遗传咨询加产前诊断两级预防。","example":"例：高龄孕妇做羊水检查（染色体分析）和基因诊断，可检测胎儿染色体异常和致病基因。","tip":"遗传咨询是预防第一步，产前诊断是第二步，答题顺序别反。"},"4|1|k|5":{"explain":"两种方法配合：口诀法快速判断（无中生有或有中生无定显隐；看女病或男病定位置）；假设法验证：当口诀不能确定时，假设是伴X遗传代入系谱，若与系谱矛盾则排除。","example":"例：不能确定的遗传方式用假设法：假设伴X隐性，若女患者父亲正常则矛盾，排除，验证严谨。","tip":"假设法检验患病个体父母子女关系是否符合伴性特点，矛盾即排除。"},"4|1|d|0":{"explain":"条件概率要点：题目已知某个体表现型正常，计算时要把该个体的基因型限定在正常范围内重新算比例。例：Aa乘Aa后代正常个体中，AA比Aa等于1比2，她是Aa的概率为2/3。","example":"例：白化病携带者夫妇生一正常孩子，该孩子为携带者（Aa）的概率等于2/3（排除aa后重算）。","tip":"看到表现型正常四个字，先剔除隐性纯合子再算比例。"},"4|1|d|1":{"explain":"区分依据：伴X隐性遗传男性患者多于女性、女患者的父亲和儿子必患病；伴X显性女性患者多于男性、男患者的母亲和女儿必患病；常染色体遗传男女机会均等。系谱中出现女患者父亲正常即排除伴性。","example":"例：系谱中某患病女性父亲正常，则该病不可能是伴X隐性（X隐女病父必病），排除法。","tip":"关键句：女病父儿病是X隐、男病母女病是X显，不符即排除。"},"4|1|d|2":{"explain":"两种调查区分：调查遗传病发病率：在人群中随机抽样调查（样本足够大），发病率等于患病人数除以调查总人数；调查遗传方式：在患者家系中调查（系谱分析）。答题写人群随机对家系调查。","example":"例：调查红绿色盲发病率在人群中随机调查；判断其遗传方式需绘制患者家系系谱图，对象不同。","tip":"发病率写人群随机，遗传方式写家系，调查对象别搞反。"},"4|1|d|3":{"explain":"多对基因计算：分解组合法三步：逐对分析（Aa乘Aa显性3/4；Bb乘bb显性1/2）；按题意组合（求A_B_等于3/4乘1/2等于3/8）；特殊问法（至少一对显性等于1减全隐）。","example":"例：AaBb乘Aabb，后代Aabb概率等于1/2（Aa）乘1/2（bb）等于1/4。","tip":"拆开后逐对写比例再相乘；至少或最多用1减反面法。"},"4|1|e|0":{"explain":"压轴题四步流程：判显隐（无中生有或有中生无）；判位置（口诀排除伴性）；写基因型（先写已知，再推未知）；算概率（注意条件概率和性别限定）。答题写全每一步的依据（因为所以）。","example":"例：双亲正常生患病儿子属隐性；患病女性父亲正常则排除X隐，为常染色体隐性遗传，理由完整。","tip":"每一步都要写判断依据，只写结论不给分。"},"4|1|e|1":{"explain":"口诀全解：无中生有为隐性；有中生无为显性；隐性遗传看女病（女患者的父亲儿子都病则X隐）；显性遗传看男病（男患者的母亲女儿都病则X显）。配合假设法排除，确定常染色体或伴性。","example":"例：系谱符合无中生有且女患者父亲正常，为常染色体隐性遗传，口诀加验证，双重确认。","tip":"口诀是排除法：只能排除不能直接确定，确定需看是否所有患者都符合伴性特征。"},"4|1|e|2":{"explain":"预防体系三层：遗传咨询（婚前、孕前咨询，推算风险）；产前诊断（羊水检查染色体、B超、基因诊断）；新生儿筛查。基因检测：鉴定携带者、产前诊断。答题写遗传咨询和产前诊断两个关键词。","example":"例：对孕妇进行羊水穿刺检查胎儿染色体，可预防21三体综合征患儿出生，产前诊断有效。","tip":"禁止近亲结婚能降低隐性遗传病发病率（近亲增加杂合子相遇风险）。"},"4|1|e|3":{"explain":"综合计算：两病同算时分别算每病概率再相乘；异常配子分析：减Ⅰ同源染色体未分离，配子含一对同源染色体；减Ⅱ姐妹染色单体未分开，配子含两条相同染色体。答题先写异常发生的时期。","example":"例：某男XbY与XBXb女婚配，生色盲男孩概率等于1/2（Xb配子）乘1/2（男孩）等于1/4。","tip":"异常配子题先判同源未分（减Ⅰ）还是姐妹未分（减Ⅱ），再推配子。"},"4|1|e|4":{"explain":"两条必背规律：伴X隐性：女性患者（XbXb）的Xb一个来自父亲、一个传给儿子，故女病父儿必病；伴X显性：男性患者（XAY）的XA来自母亲、传给女儿，故男病母女必病。判断题直接套。","example":"例：判断题：X隐性遗传病中女患者的父亲一定患病（对），因女儿两条X一条来自父亲。","tip":"女病父儿病、男病母女病两条规律是判断题和系谱题的万能钥匙。"},"4|2|k|0":{"explain":"可遗传变异三来源：基因突变（碱基对改变，产生新基因）；基因重组（基因重新组合）；染色体变异（结构或数目改变）。共同点：遗传物质（基因或染色体）发生改变，能遗传给后代。","example":"例：水肥充足使小麦穗大粒饱，遗传物质未变，属不可遗传变异，不能遗传给后代，环境影响。","tip":"判断可遗传变异看遗传物质是否改变，光、水肥引起的表型改变不遗传。"},"4|2|k|1":{"explain":"杂交育种：原理基因重组（不同品种优良性状组合到同一品种）。流程：亲本杂交，F1（集中优良性状），自交，F2出现性状分离，选优，连续自交筛选直至纯合。优点简单，缺点年限长。","example":"例：高秆抗病乘矮秆不抗病，F1，F2选矮秆抗病，连续自交得纯合矮秆抗病品种，选育流程。","tip":"杂交育种后期连续自交是为了提高纯合度，答案常写自交至不再发生性状分离。"},"4|2|k|2":{"explain":"诱变育种：原理基因突变；方法物理诱变（X射线、紫外线、激光）和化学诱变（EMS等诱变剂）；特点：能提高突变频率、产生新基因，但变异不定向、有利变异少，需大量筛选。应用：太空育种。","example":"例：用射线照射种子提高突变频率，从中筛选出高产抗病的新品种（需大量种植筛选），筛选量大。","tip":"诱变育种产生新基因、不定向、需筛选三个关键词；航天育种本质是诱变育种。"},"4|2|k|3":{"explain":"单倍体育种流程：杂交得F1，取F1花药（花粉）离体培养得单倍体幼苗，秋水仙素处理使染色体加倍得纯合二倍体植株。优点：明显缩短育种年限；缺点：技术复杂。原理：染色体变异。","example":"例：F1（AaBb）花药离体培养得AB、Ab、aB、ab单倍体，秋水仙素加倍后四种纯合子。","tip":"单倍体育种花药离体培养加秋水仙素两步缺一不可；后代都是纯合子。"},"4|2|k|4":{"explain":"多倍体育种：原理染色体变异；方法秋水仙素（或低温）处理萌发的种子或幼苗，抑制纺锤体形成，使染色体不能移向两极，数目加倍。实例：无子西瓜（三倍体，联会紊乱无子）、八倍体小黑麦。","example":"例：秋水仙素处理二倍体西瓜幼苗得四倍体，与二倍体杂交得三倍体种子，种出的西瓜无子。","tip":"多倍体器官大、营养丰富但结实率低；无子西瓜是三倍体（染色体变异）。"},"4|2|k|5":{"explain":"基因工程育种：把目的基因导入受体细胞，定向改造性状（如抗虫棉导入Bt毒蛋白基因）；原理基因重组；优点：定向改造、克服远缘杂交不亲和障碍。需检测鉴定。","example":"例：抗虫棉导入苏云金芽孢杆菌的Bt毒蛋白基因，定向获得抗虫性状，跨物种改造，定向育种。","tip":"基因工程育种定向是最大优点，原理是基因重组（与杂交育种同原理）。"},"4|2|d|0":{"explain":"方法选择依据：快速获得纯合子用单倍体育种；提高变异频率、产生新基因用诱变育种；常规改良、组合优良性状用杂交育种；获得大果实用多倍体育种；定向改造用基因工程育种。按目标选方法。","example":"例：要快速获得纯合的抗病品种选单倍体育种；要产生抗除草剂的新基因选诱变育种，按目标选。","tip":"选择题关键句：快速纯合选单倍体、新基因选诱变、大果实选多倍体、定向选基因工程。"},"4|2|d|1":{"explain":"无子西瓜机理：秋水仙素处理二倍体幼苗得四倍体；四倍体（母本）乘二倍体（父本）得三倍体种子；三倍体植株减数分裂联会紊乱，不能形成正常配子（不产生种子），子房在生长素刺激下发育成果实。","example":"例：三倍体西瓜无子的直接原因是减数分裂联会紊乱，不能形成正常配子，机理关键。，无子原因清楚。","tip":"无子西瓜写染色体变异、联会紊乱；无子番茄写生长素处理，两机理别混。"},"4|2|d|2":{"explain":"两育种对比：单倍体育种（先花药离体培养得单倍体，再秋水仙素加倍成纯合二倍体，目的获纯合子、缩短年限）；多倍体育种（直接秋水仙素处理二倍体幼苗得四倍体）。共同点：都用秋水仙素。","example":"例：单倍体育种是花药、单倍体、加倍、纯合；多倍体育种是幼苗直接加倍、多倍体，步骤不同。","tip":"秋水仙素两处用：单倍体育种加倍变纯合，多倍体育种直接加倍，对象不同。"},"4|2|d|3":{"explain":"判断三看：基因种类变化（产生新基因）属基因突变；基因组合变化（重新组合不改变种类数目）属基因重组；基因数目或位置变化（整条染色体增减、片段缺失重复易位）属染色体变异。","example":"例：染色体片段缺失使基因数目减少，属染色体结构变异；碱基替换产生新基因，属基因突变。","tip":"变异类型判断：基因数目变属染色体，种类变属突变，组合变属重组。"},"4|2|e|0":{"explain":"比较表记忆：杂交育种（重组，简单，年限长）；诱变育种（突变，新基因，不定向）；单倍体育种（染色体变异，缩短年限）；多倍体育种（染色体变异，器官大）；基因工程育种（重组定向）。","example":"例：比较题：能产生新基因的是诱变育种；能明显缩短育种年限的是单倍体育种，对比记忆。","tip":"表格对比题抓关键词：新基因选诱变、纯合快选单倍体、器官大选多倍体、定向选基因工程。"},"4|2|e|1":{"explain":"流程设计模板：明确目标（如获得纯合抗病品种）；选方法（单倍体育种或杂交育种）；写步骤（杂交，F1，花药离体培养，秋水仙素，筛选）。分步写，注明每步目的。","example":"例：培育纯合抗病小麦：A品种（抗病）乘B品种（高产），F1，花药离体培养，秋水仙素加倍，筛选。","tip":"流程题按亲本杂交、F1、处理、筛选模板写，别漏筛选步骤。"},"4|2|e|2":{"explain":"三个实例区分：无子西瓜（三倍体，染色体变异，联会紊乱无子）；无子番茄（生长素处理未受粉子房，遗传物质不变）；八倍体小黑麦（六倍体小麦乘二倍体黑麦，F1加倍）。答题写各自原理。","example":"例：无子番茄用生长素处理（不改变遗传物质），无子西瓜是三倍体（染色体变异），原理不同。","tip":"无子番茄等于生长素、无子西瓜等于染色体变异是最高频对比。"},"4|2|e|3":{"explain":"判断要点：基因突变（碱基对变，基因种类变、产生新基因，基因数目位置不变）；基因重组（基因组合变，种类数目位置不变）；染色体变异（基因数目变、位置变）。按种类、数目、位置三问判断。","example":"例：某染色体片段移接到非同源染色体上，基因位置改变，属染色体结构变异（易位），位置判断。","tip":"判断三问：新基因属突变，重新组合属重组，数目位置变属染色体变异。"},"4|2|e|4":{"explain":"两个高频判断：单倍体育种明显缩短育种年限（当年获纯合子，省去连续自交）；多倍体育种获得染色体组加倍的个体（4n、6n等），器官大但结实率低。判断题见单倍体育种年限长判错。","example":"例：判断题：杂交育种比单倍体育种更快获得纯合子（错），单倍体育种明显缩短育种年限。","tip":"缩短年限等于单倍体育种是必考判断；多倍体关键词染色体组加倍。"},"4|3|k|0":{"explain":"两调节关系：体液调节受神经调节的调控（大多数内分泌腺受神经系统支配）；体液调节是神经调节的重要环节（神经调节的效应常通过激素实现）；二者协调配合共同维持稳态。","example":"例：血糖调节中下丘脑通过神经支配胰岛分泌激素，是神经调节与体液调节结合的实例，双调节。","tip":"关系关键词：体液调节是神经调节的重要环节，别写成神经调节从属于体液调节。"},"4|3|k|1":{"explain":"三大调节的共同点：都是神经、体液调节（下丘脑作为神经中枢，通过神经和激素两条途径调节）；下丘脑是调节枢纽（体温、水盐、血糖调节中枢都在下丘脑）。答题写下丘脑是枢纽。","example":"例：体温调节中下丘脑体温调节中枢整合信息，通过神经（血管、战栗）和体液（甲状腺激素）双重调节。","tip":"三大调节神经、体液双机制加下丘脑枢纽，是综合题答案模板。"},"4|3|k|2":{"explain":"三大调节网络：神经系统（快速精确）、内分泌系统（激素调节）、免疫系统（清除病原和衰老细胞）相互联系：神经递质、激素、细胞因子都是信息分子。共同维持内环境稳态。","example":"例：剧烈运动后体温升高，神经调节散热、体液调节代谢、免疫调节防感染，共同维持稳态。","tip":"神经、体液、免疫调节网络是稳态调节机制的完整表述，答题必写。"},"4|3|k|3":{"explain":"下丘脑功能四块：神经中枢（体温、水盐、血糖调节中枢、生物节律）；感受器（渗透压感受器）；分泌（抗利尿激素、促激素释放激素）；调控垂体（内分泌枢纽）。答题见三大调节先写下丘脑。","example":"例：下丘脑既是体温调节中枢，又能分泌抗利尿激素，还能通过垂体调控甲状腺激素分泌。","tip":"下丘脑中樞加感受器加分泌加调控四功能，选择题常考不属于下丘脑功能项。"},"4|3|k|4":{"explain":"反馈调节：负反馈（结果抑制原因，如甲状腺激素抑制下丘脑垂体，维持稳定，是主要机制）；正反馈（结果加强原因，如排尿反射，使过程加速完成）。答题判断结果是加强还是抑制原过程。","example":"例：血糖升高导致胰岛素增多导致血糖下降（负反馈）；排尿时膀胱收缩加强排尿（正反馈）。","tip":"负反馈维稳，正反馈加速，稳态维持主要靠负反馈。"},"4|3|k|5":{"explain":"分级调节链条：下丘脑（促释放激素）到垂体（促激素）到靶腺体（甲状腺、肾上腺、性腺）分泌激素；靶腺激素增多反馈抑制下丘脑和垂体。分级调节意义：放大调节效应、精细调控。","example":"例：甲状腺激素分级调节：TRH到TSH到甲状腺激素；甲状腺激素多则TRH、TSH减少。","tip":"分级调节层层放大，反馈调节末端抑制上游，综合题两个都要写。"},"4|3|d|0":{"explain":"寒冷调节两条途径：神经调节：皮肤冷觉感受器，下丘脑，皮肤血管收缩（减少散热）、骨骼肌战栗产热；体液调节：甲状腺激素增多、肾上腺素增多（促进代谢产热）。炎热时血管舒张、汗腺分泌增多。","example":"例：寒冷时人打寒颤（骨骼肌战栗）是神经调节，甲状腺激素增多是体液调节，二者协同产热。","tip":"体温调节产热靠战栗和激素，散热靠血管和出汗，方向别写反。"},"4|3|d|1":{"explain":"水盐调节链条：细胞外液渗透压升高，下丘脑渗透压感受器，（神经）大脑皮层渴觉（主动饮水）；下丘脑合成、垂体释放抗利尿激素增多，肾小管集合管重吸收水增强，尿量减少、渗透压恢复。","example":"例：大量出汗后抗利尿激素分泌增多，肾小管集合管重吸收水增强，尿量减少，保水保盐。","tip":"合成下丘脑、释放垂体两词必写；渴觉在大脑皮层产生。"},"4|3|d|2":{"explain":"血糖调节三角：胰岛素（降糖，促摄取利用储存）；胰高血糖素（升糖，促肝糖原分解）与肾上腺素（升糖）协同；血糖浓度直接刺激和神经调节双途径。糖尿病：Ⅰ型胰岛素分泌不足；Ⅱ型受体异常。","example":"例：Ⅱ型糖尿病患者胰岛素正常甚至偏高，但靶细胞受体减少，胰岛素不能发挥作用，受体异常。","tip":"升糖激素两个（胰高血糖素、肾上腺素），降糖只有一个（胰岛素）。"},"4|3|d|3":{"explain":"对比表：神经调节（速度快、准确、作用时间短、范围局限）；体液调节（速度慢、作用时间长、范围广泛）。联系：体液调节受神经调节调控，是神经调节的重要环节。答题写快准短对慢久广。","example":"例：看到迅速选神经调节，看到持久广泛选体液调节（激素），六字口诀快准短慢久广，秒杀技巧。","tip":"六字对比快准短、慢久广是选择题秒杀口诀。"},"4|3|e|0":{"explain":"情境题答题框架：运动或应激，交感神经兴奋，（神经）心跳加快、血管收缩；（体液）肾上腺素、甲状腺激素增多促进代谢；（免疫）免疫系统参与防御。答题按神经、体液、免疫三层写。","example":"例：剧烈运动时血糖下降，胰高血糖素增多（体液），同时下丘脑调节（神经），共同升血糖。","tip":"综合题分层作答：先神经后体液，最后总结共同维持稳态。"},"4|3|e|1":{"explain":"图解答题模板：感受器（温度、渗透压、血糖感受器），下丘脑中枢整合，传出途径（神经：血管、肌肉；体液：激素），效应（产热散热平衡、水平衡、血糖平衡）。答题写下丘脑是调节中枢。","example":"例：血糖调节图：血糖升高，胰岛B细胞，胰岛素，血糖降低，同时下丘脑血糖调节中枢参与。","tip":"三大调节图解都从感受器到下丘脑到效应主线展开。"},"4|3|e|2":{"explain":"实验分析套路：切除靶腺体，激素减少，反馈减弱，上游激素（TRH、TSH）增多；注射激素，反馈增强，上游激素减少。答题按激素变化、反馈方向、上游激素增减推理。","example":"例：切除甲状腺，甲状腺激素减少，对下丘脑垂体抑制减弱，TRH、TSH增多，反馈可逆。","tip":"实验题先定哪级激素变了，再推反馈是加强还是减弱。"},"4|3|e|3":{"explain":"联系桥梁：信息分子三类：神经递质（神经）、激素（体液）、细胞因子（免疫）；三者通过信息分子相互影响：如免疫细胞释放细胞因子影响神经内分泌。答题写信息分子是桥梁。","example":"例：白细胞介素（细胞因子）既能增强免疫，也能影响下丘脑体温调节中枢（发热），信息分子。","tip":"神经递质、激素、细胞因子都是信息分子是联系题的答案要点。"},"4|3|e|4":{"explain":"两个高频陷阱：抗利尿激素是下丘脑合成、垂体释放（不是垂体合成）；降血糖激素只有胰岛素一个（胰高血糖素、肾上腺素都升血糖）。判断题见垂体合成抗利尿激素判错。","example":"例：判断题：抗利尿激素由垂体合成（错），由下丘脑合成、垂体释放，别记反，部位关键。","tip":"下丘脑合成、垂体释放和唯一降糖激素两句必背。"},"4|4|k|0":{"explain":"食物网分析三问：数链条数（从生产者到最高营养级，不重不漏）；判断营养级（生产者第一营养级，同一生物在不同食物链可处于不同营养级）；分析数量变化（天敌减少则被捕食者先增后减）。","example":"例：草到兔到鹰与草到鼠到鹰构成食物网，鹰占据第三营养级（两条链中都是第三级），营养级判断。","tip":"数食物链条数从生产者分叉数；某生物营养级不唯一时按最长链判断。"},"4|4|k|1":{"explain":"能量来源与起点：生态系统的能量最终来自太阳能；能量流动起点是生产者固定太阳能（光合作用）；流经生态系统的总能量等于生产者固定的太阳能总量。答题写生产者固定。","example":"例：流经某草原生态系统的总能量是该草原上所有生产者光合作用固定的太阳能总量，能量起点。","tip":"总能量等于生产者固定的太阳能，别写成照射的太阳能。"},"4|4|k|2":{"explain":"能量流动两大特点：单向（捕食关系不可逆、散失热能不可再用）；逐级递减（每营养级同化量部分呼吸消耗、流向分解者、未利用，只有10%到20%传给下一级）。能量金字塔不会倒置。","example":"例：能量传递效率10%到20%指相邻营养级间同化量之比，不是个体间能量之比，口径要准。","tip":"10%到20%是相邻营养级同化量的传递效率，答题写同化量。"},"4|4|k|3":{"explain":"计算方向口诀：求消耗：至少除以20%，最多除以10%；已知低营养级求高营养级（获得量）：最多获得乘20%，最少乘10%。记忆：求消耗至少20最多10。","example":"例：鹰增重1kg，经草到鼠到鹰，最少消耗草等于1除以20%除以20%等于25kg，最多等于100kg。","tip":"先确定是求消耗还是求获得，再选效率10%还是20%。"},"4|4|k|4":{"explain":"三种金字塔：能量金字塔（按同化量分层，恒正立，不会倒置）；数量金字塔（按个体数分层，可倒置，如一棵树上的昆虫）；生物量金字塔（一般正立，海洋浮游生物季节波动可倒置）。","example":"例：一棵大树上的昆虫数量远多于树，数量金字塔倒置，但能量金字塔仍正立，对比记忆。","tip":"能量金字塔不倒置是必考点，数量金字塔可倒置。"},"4|4|k|5":{"explain":"研究能量流动的意义：帮助人们科学规划、设计人工生态系统（如生态农业），合理调整能量流动关系；使能量持续高效地流向对人类最有益的部分。注意：是提高能量利用率不是改变传递效率。","example":"例：稻田养鱼、清除田间杂草，都是调整能量流向，让能量更多流向水稻（人类有益部分）。","tip":"意义题写持续高效流向对人类最有益部分，别写提高传递效率。"},"4|4|d|0":{"explain":"多链计算步骤：先画出各食物链；按题意分配比例（如草占1/2、鼠占1/2）；分别沿每条链计算再相加；每条链注意传递效率方向（求消耗用除法、求获得用乘法）。先分链再汇总。","example":"例：鹰增重1kg，食物中1/2来自兔、1/2来自鼠，最少消耗草等于1/2除以20%除以20%加1/2除以20%除以20%等于25kg。","tip":"多链计算分链算、按比例分配、最后相加，别混成一条链。"},"4|4|d|1":{"explain":"数量变化规律：天敌减少，被捕食者数量先增（天敌压力减小），食物消耗增大、密度增大，种内竞争加剧、天敌回升，数量回降，最终在动态平衡附近波动（负反馈调节）。答题写先增后减趋于稳定。","example":"例：狼减少，兔先增，草减少，兔因食物不足减少，狼也减少，最终动态平衡，负反馈调节。","tip":"先增后减、趋于稳定是反馈调节的经典表述，别写一直增加。"},"4|4|d|2":{"explain":"两个概念：能量传递效率（相邻营养级同化量之比，恒为10%到20%，不可改变）；能量利用率（人类对能量的利用程度，可通过多级利用提高，如生态农业）。答题区分效率不可变、利用率可提高。","example":"例：生态农业使能量多级利用、提高能量利用率，但相邻营养级传递效率仍是10%到20%。","tip":"判断题生态农业提高传递效率是错的，提高的是利用率。"},"4|4|d|3":{"explain":"分解者作用辨析：分解者不在食物链中（食物链只有生产者和消费者），但它是生态系统必需成分：把动植物遗体残骸分解成无机物，归还无机环境，参与物质循环；不把能量传给下一营养级。","example":"例：蘑菇（分解者）分解枯枝落叶释放CO2和无机盐，参与碳循环，但不构成食物链，作用辨析。","tip":"食物链不含分解者；分解者是物质循环不可缺少环节。"},"4|4|e|0":{"explain":"综合题框架：数食物链，标营养级（生产者第一级），写能量去向（同化量等于呼吸消耗加生长繁殖，其中流向下一级加分解者加未利用），按效率计算，分析数量变化。答题分步骤写。","example":"例：食物网中有4条食物链，鹰在两条链中营养级不同（第三、第四级），计算时按比例分配。","tip":"综合题先画食物链草稿，标清营养级和能量数据再动笔。"},"4|4|e|1":{"explain":"图解识读：摄入量等于同化量加粪便量；同化量等于呼吸消耗量加用于生长发育繁殖量；用于生长发育繁殖等于流向下一营养级加流向分解者加未利用。看图先找各数值归属，粪便量归上一营养级。","example":"例：图解中兔同化100、呼吸60，则用于生长发育繁殖40，其中流向下一营养级和分解者。","tip":"图解题先标摄入、粪便、同化、呼吸四个框，再算分配。"},"4|4|e|2":{"explain":"生物富集机理：不易分解的物质（重金属、DDT、有机氯）沿食物链逐级富集，营养级越高浓度越大（最高营养级浓度最大）；因物质不分解、不断积累，而能量递减。答题写沿食物链逐级浓缩。","example":"例：DDT沿浮游植物、浮游动物、鱼、鸟逐级富集，鹰体内DDT浓度最高，营养级越高越大。","tip":"富集方向与能量相反：能量递减、毒物递增，别混。"},"4|4|e|3":{"explain":"三种金字塔对比：能量金字塔（恒正立，最稳定）；数量金字塔（可倒置：一棵树与昆虫）；生物量金字塔（一般正立，海洋浮游生物季节变化时可倒置）。答题判断能否倒置。","example":"例：判断：能量金字塔可以倒置（错），能量金字塔始终正立，数量金字塔可倒置，判断要点。","tip":"能量金字塔不倒置一句话记牢，其余金字塔按实例判断。"},"4|4|e|4":{"explain":"两个陷阱：粪便量是未消化食物残渣，属上一营养级同化量中流向分解者的部分；最高营养级（顶级消费者）能量去向只有呼吸消耗、流向分解者、未利用，没有流向下一营养级。","example":"例：鹰（最高营养级）的能量去向：呼吸消耗、流向分解者、未利用，不包括流向下一营养级。","tip":"最高营养级无下一级和粪便归上营养级是能量题两大陷阱。"},"4|5|k|0":{"explain":"实验设计四原则：科学性原则（依据科学原理）；单一变量原则（只改变一个自变量）；对照原则（设置对照组排除干扰）；平行重复原则（重复求平均减误差）。答题写单一变量、对照为核心。","example":"例：探究光照对种子萌发的影响，只改变光照，其他条件（温度、水分）相同，设黑暗对照。","tip":"四原则中单一变量、对照最常考，答题写其他条件相同且适宜。"},"4|5|k|1":{"explain":"四种对照：空白对照（不施加处理因素，如清水组）；自身对照（同一对象前后对比，如质壁分离与复原前后）；条件对照（施加非实验处理）；相互对照（几个实验组互为对照，如不同浓度梯度组）。","example":"例：探究生长素最适浓度，各组浓度不同互为对照（相互对照）；另设清水组（空白对照）。","tip":"对照类型题看怎么对照：无处理属空白，前后对比属自身，多组互比属相互。"},"4|5|k|2":{"explain":"设计步骤五步：明确实验目的；提出假设（可检验的预测）；设计分组处理（设自变量、控制无关变量、设对照）；观察记录（因变量、重复）；预期结果得出结论（若则）。答题按五步模板写。","example":"例：探究酶的最适温度：分组（不同温度），处理（加酶与底物），观察（产物量），预期，结论。","tip":"步骤题按分组、处理、观察、结论写，别漏对照组。"},"4|5|k|3":{"explain":"三变量辨析：自变量（实验要探究的因素，人为改变，如光照强度）；因变量（随自变量变化的观察指标，如气泡数）；无关变量（可能影响结果的其他因素，如温度、材料，须保持相同且适宜）。","example":"例：探究CO2浓度对光合的影响：自变量NaHCO3浓度，因变量气泡数，温度、光照等无关变量相同。","tip":"找自变量看人为改变的，找因变量看观察测量的，别混。"},"4|5|k|4":{"explain":"两类实验区别：探究性实验（结果未知、假设可能对也可能错，结论需分情况讨论，用若则）；验证性实验（结论已知、预期结果唯一，只需验证）。答题先判断类型再写结论格式。","example":"例：探究光对种子萌发有无影响（探究性）：若光照组萌发多则光促进；若无差异则光无影响。","tip":"探究性实验结论必须分情况讨论，验证性实验结论唯一。"},"4|5|k|5":{"explain":"选材三原则：易获得（来源方便）；易观察（现象明显，如紫色洋葱便于观察质壁分离）；不干扰结果（如还原糖鉴定不用西瓜，因红色干扰显色）。答题写材料不影响实验结果。","example":"例：鉴定还原糖选苹果匀浆不选西瓜，因西瓜红色干扰砖红色沉淀的观察，选材有讲究，不干扰。","tip":"选材理由答题模板：材料加优点，且不影响观察或测定。"},"4|5|d|0":{"explain":"设计要点：对照实验只改变一个因素（自变量），其余（温度、时间、材料数量、浓度、体积）全部相同且适宜；设置对照组（不处理或常规处理）与实验组对比。答题写除自变量外其他条件相同且适宜。","example":"例：探究温度对酶活性影响，各试管底物、酶量、pH相同，只改变温度，设最适温度组对照。","tip":"答题万能句：控制单一变量，其余无关变量保持相同且适宜。"},"4|5|d|1":{"explain":"评价题找错四看：一看有无对照（没对照组属错误）；二看无关变量是否统一（材料、温度、时间不同属错误）；三看材料选择是否恰当（影响观察属错误）；四看操作是否合理。指出错误加说明后果。","example":"例：实验只设实验组无对照组，无法排除其他因素影响，结论不可靠，评价要点明确。，对照必不可少。","tip":"评价题答题格式：错误是、因为、导致、应（错误加理由加改正）。"},"4|5|d|2":{"explain":"结论书写模板：分情况讨论所有可能结果：若甲组现象优于乙组，说明自变量有促进（抑制）作用；若两组无差异，说明自变量无影响。用若则句式。答题先想全所有可能再写。","example":"例：探究某激素对生长有无作用：若实验组生长快则促进；若慢则抑制；若无差异则无作用。","tip":"结论必须覆盖促进、抑制、无影响三种可能，漏一种扣分。"},"4|5|d|3":{"explain":"步骤书写三步：分组编号（取若干生长状况相同的材料，随机均分并编号）；处理（实验组施加自变量处理，对照组不处理或常规处理，无关变量相同）；观察记录（定时观察测量因变量，重复求平均）。","example":"例：步骤：取30株长势相同的幼苗随机均分3组编号；分别用不同浓度生长素处理；一周后测株高。","tip":"步骤题分组编号、处理、观察记录三步模板，注意随机均分、相同且适宜。"},"4|5|e|0":{"explain":"光合呼吸酶活性实验设计：自变量（光照、CO2、温度、pH）；因变量（气泡数、CO2吸收量、产物量）；对照（不同梯度互为对照加空白对照）；无关变量（材料、时间相同）。答题按四块写。","example":"例：探究pH对过氧化氢酶活性影响：不同pH缓冲液处理，观察气泡产生速率，设最适pH对照。","tip":"实验题答案四要素：自变量、因变量、对照设置、无关变量控制，缺一不可。"},"4|5|e|1":{"explain":"评价改进答题模板：错误点（未设对照、变量不唯一、材料不当、无重复）；理由（无法排除干扰或不能说明）；改正（增设对照组、统一无关变量、增加重复）。答题错误加理由加改正三段式。","example":"例：实验未设置空白对照，应增设一组不做处理的对照组，以排除其他因素影响，改正方案。","tip":"三段式答题错误、理由、改正是得分结构。"},"4|5|e|2":{"explain":"方法对应记：同位素标记（3H追踪分泌蛋白、18O研究O2来源、14C循环）；差速离心（分离细胞器）；荧光标记（人鼠细胞融合证明膜流动性）。写方法、实验、结论配对。","example":"例：鲁宾和卡门用18O同位素标记证明光合O2来自水；荧光标记证明细胞膜具有流动性。","tip":"方法配对题：同位素标去向，差速离心分细胞器，荧光标记证流动。"},"4|5|e|3":{"explain":"预测结论答题规范：探究性实验分情况讨论（若则说明，若则说明，若则说明）；验证性实验结论唯一。答题先判断实验类型，再按格式写。注意结论要与假设对应、表述完整。","example":"例：预测：若实验组光合速率显著高于对照组，说明该因素促进光合作用，反之则抑制，分情况讨论。","tip":"若则句式加分情况讨论，是探究题结论的得分模板。"},"4|5|e|4":{"explain":"两个陷阱：对照实验必须遵循单一变量原则（多个变量同时改变无法归因）；预实验的作用是确定大致浓度范围、避免盲目浪费，不能减少正式实验的误差（误差靠平行重复减少）。","example":"例：判断题：预实验能减少实验误差（错），预实验是确定适宜范围，误差靠重复实验减少。","tip":"预实验定范围、重复实验减误差两句话记牢。"},"4|6|k|0":{"explain":"三类长句模板：原因类（因为所以，因果关系完整）；依据类（据图可知，从图中获取信息作答）；设计类（取材料随机均分，一组处理，另一组对照，观察指标）。答题先判断题型再套模板。","example":"例：原因题：因为光照增强，光反应加快，产生的ATP和[H]增多，所以暗反应加快，光合速率升高。","tip":"长句题先定题型（原因、依据、设计），再套对应模板，别混用。"},"4|6|k|1":{"explain":"原因题答题链条：因为（直接原因）所以（中间过程）所以（最终结果），逻辑链不能断。如：温度升高，酶活性增强，光合作用加快。答题写因为所以，层层递进，写全中间环节。","example":"例：为什么夏季中午光合减弱？因为中午温度过高气孔关闭，CO2供应不足，暗反应减慢，光合速率下降。","tip":"原因题逻辑链原因、过程、结果三环，只写结果不写原因不给分。"},"4|6|k|2":{"explain":"实验设计长句四要素：取材（长势相同材料随机均分）；处理（实验组施加自变量，对照组常规或不处理，无关变量相同且适宜）；观察记录（定时测因变量）；统计分析（重复求平均）。","example":"例：取30株长势相同的幼苗随机均分3组，分别置于不同光照下培养，一周后测量株高并求平均值。","tip":"设计长句取材、处理、观察、统计四步，术语随机均分、相同且适宜必写。"},"4|6|k|3":{"explain":"遗传长句规范：写亲本基因型（Aa乘Aa）；写配子（A、a）；写后代基因型（AA、Aa、aa）比例（1比2比1）；写表现型及比例（显性比隐性3比1）。遗传图解或文字表述，符号规范。","example":"例：亲本Aa乘Aa产生A、a两种配子，后代基因型AA比Aa比aa等于1比2比1，表现型显性比隐性等于3比1。","tip":"遗传表述基因型、配子、后代比例三要素，符号（乘、圈乘）书写规范。"},"4|6|k|4":{"explain":"曲线描述三步：总述（随什么增大，什么先什么后）；分段（在什么范围内什么增加，超过什么后什么）；关键点（起点、拐点、平衡点、终点数值和含义）。答题先写整体趋势再写细节。","example":"例：随光照强度增大，光合速率先增大，达到光饱和点后基本不变；起点对应呼吸速率，曲线描述。","tip":"曲线题先总后分加点明关键点，别只描述局部。"},"4|6|k|5":{"explain":"高频易错字：纺锤体、着丝粒、渗透压、神经递质、突触、光合作用、丙酮酸、染色体。答题写错别字扣分，考前默写易错术语。规范书写是长句题得分基础。","example":"例：规范写法：纺锤体、着丝粒、神经递质、渗透压、细胞质；错写纺缍体要扣分，术语严谨。","tip":"术语书写零容忍，平时默写易错词（如纺锤体、递质、渗透）。"},"4|6|d|0":{"explain":"三大失分点：只答结果不答原因；逻辑链断裂（中间环节缺失）；未用生物学专业术语（口语化表述不给分）。答题检查原因、过程、结果是否完整、术语是否准确。","example":"例：失分答案：光合变慢了；得分答案：光照减弱使光反应减慢，产生的ATP和[H]减少，暗反应减慢，光合速率下降。","tip":"写完自查三问：有原因吗？链条完整吗？用术语了吗？"},"4|6|d|1":{"explain":"步骤完整性检查：分组（随机均分编号）；对照（对照组设置）；重复（每组多份取平均）；观察指标（因变量具体测量方法）。答题按分组、对照、重复、观察四要素自查，缺一即失分。","example":"例：只写处理并观察不写分组和对照，步骤不完整，无法体现单一变量原则，完整性自查。","tip":"步骤自查清单：编号？对照？重复？指标？四项齐全才完整。"},"4|6|d|2":{"explain":"遗传图解规范：P（亲本）写基因型和表现型；配子写类型（字母、比例）；F1写基因型、表现型及比例；用箭头连接，符号（乘、圈乘）正确。易错：配子只写一半、比例漏写。","example":"例：P：高茎AA乘矮茎aa，配子A、a，F1：高茎Aa（全部），比例书写完整，格式规范。","tip":"遗传图解基因型、配子、表现型、比例四项齐全，箭头符号规范。"},"4|6|d|3":{"explain":"原因分层答题：直接原因（最接近现象的原因，如质壁分离直接原因：外界溶液浓度大于细胞液浓度，细胞失水）；根本原因（深层原因，如质壁分离根本原因：原生质层与细胞壁伸缩性不同）。","example":"例：质壁分离直接原因：细胞失水；根本原因：原生质层与细胞壁伸缩性不同，分层作答，层次清楚。","tip":"问直接原因答最表层机理，问根本原因答结构基础，别混。"},"4|6|e|0":{"explain":"备考策略：平时训练因果链条完整的表达（因为所以）；积累答题模板（原因类、依据类、设计类）；规范使用术语。答题时间分配：长句题留足时间，先打草稿理清逻辑再写。","example":"例：训练方式：把每道选择题的为什么对、为什么错写成完整因果句，练表达，提能力。，训练长期坚持。","tip":"长句题先理逻辑后动笔，写因为所以完整链条。"},"4|6|e|1":{"explain":"三类题型答题要点：实验设计（分组编号、处理、观察记录、统计分析四步）；实验评价（找错误加理由加改正三段式）；原因分析（直接原因、过程、结果逻辑链）。答题按各题型模板作答。","example":"例：评价题答：错误是未设对照，导致无法排除无关因素影响，应增设对照组，三段式作答。","tip":"三类题型模板：设计四步、评价三段、原因三环，考前背熟。"},"4|6|e|2":{"explain":"原理阐述答题：遗传（写基因型、配子、后代比例，结合定律实质）；调节（写感受器到中枢到效应途径，激素名称和功能）；代谢（写场所、物质变化、能量变化、酶和条件）。答题概念加过程加结论。","example":"例：阐述血糖调节：血糖升高，胰岛B细胞分泌胰岛素，促进摄取利用储存，血糖降低，链条完整。","tip":"原理题写过程性语言：从起点写到终点，中间环节不省略。"},"4|6|e|3":{"explain":"规范三化：术语化（用生物学专业术语，不用口语）；序号化（分点作答①②③）；要点化（关键词前置，如场所、条件、产物）。答题要点齐全、表述规范是得分关键。","example":"例：答光合作用条件：场所：叶绿体；条件：光照、CO2、酶；产物：有机物和O2，要点化，分点答。","tip":"分点作答加关键词前置，阅卷老师按要点给分。"},"4|6|e|4":{"explain":"长句题评分规则：采分点分布在原因、过程、结果各环节；只写结论（如光合速率下降）不写原因过程，只能得部分分甚至不得分。答题写因为、导致、所以完整链条。","example":"例：失分：光合速率下降；得分：光照减弱导致光 函数的应用：用一次函数、二次函数、分段函数模型解决实际问题，步骤为建模、求解、检验。","单调性与奇偶性的应用：判断函数图象特征、比较函数值大小、解不等式。"],"0|3":["n次方根：x^n=a，x叫a的n次方根；n为偶数时a需大于等于0，且√[n]{a^n}=|a|。","分数指数幂：a^(m/n)=√[n]{a^m}（a为正数），a^(-m/n)=1/a^(m/n)，0的正分数指数幂为0。","指数幂运算性质：a^r·a^s=a^(r+s)、(a^r)^s=a^(rs)、(ab)^r=a^r·b^r（a、b为正数）。","指数函数：y=a^x（a大于0且a≠1），定义域R、值域(0,+∞)，图象过定点(0,1)。","指数函数单调性：a大于1时在R上递增，0小于a小于1时在R上递减，底数大小影响图象位置。","对数的概念：a^x=N等价于x=log_aN（a大于0且a≠1，N大于0），常用对数lgN、自然对数lnN。","对数恒等式：a^(log_aN)=N，log_a(a^x)=x，指数式与对数式互化。","对数运算性质：log_a(MN)=log_aM+log_aN，log_a(M/N)=log_aM-log_aN，log_aM^n=nlog_aM。","换底公式：log_ab=log_cb/log_ca，推论log_ab·log_ba=1，用于不同底数对数运算。","对数函数：y=log_ax（a大于0且a≠1），定义域(0,+∞)、值域R，图象过定点(1,0)。","反函数：y=a^x与y=log_ax互为反函数，图象关于直线y=x对称。","函数零点：f(x)的零点即方程f(x)=0的实数解，即图象与x轴交点的横坐标。","零点存在定理：f(x)在[a,b]上连续且f(a)·f(b)小于0，则f(x)在(a,b)内存在零点。","二分法求零点近似值：反复取中点缩小区间，直至区间长度小于精确度ε；比较直线、指数、对数三种增长模型。"],"0|4":["任意角的概念：按旋转方向分为正角、负角、零角；与α终边相同的角为β=α+2kπ（k∈Z）。","弧度制：长度等于半径的弧所对圆心角为1弧度，π rad=180°，弧度与角度互化。","弧长与扇形面积：l=|α|r，S=1/2·lr=1/2·αr^2（α为弧度）。","任意角三角函数定义：终边上一点P(x,y)、r=√(x^2+y^2)，sinα=y/r、cosα=x/r、tanα=y/x。","三角函数值的符号：一全正、二正弦、三正切、四余弦，由角所在象限确定。","同角三角函数基本关系：sin^2α+cos^2α=1，tanα=sinα/cosα（cosα≠0）。","诱导公式：2kπ±α、π±α、-α、π/2±α的化简规律，奇变偶不变、符号看象限。","正弦函数性质：周期2π，递增区间[-π/2+2kπ,π/2+2kπ]，对称轴x=π/2+kπ，对称中心(kπ,0)。","余弦函数性质：周期2π，递增区间[-π+2kπ,2kπ]，对称轴x=kπ，对称中心(π/2+kπ,0)。","正切函数性质：定义域{x|x≠π/2+kπ}，周期π，在每个开区间(-π/2+kπ,π/2+kπ)内单调递增。","两角和与差公式：sin(α±β)=sinαcosβ±cosαsinβ，cos(α±β)=cosαcosβ∓sinαsinβ。","二倍角公式：sin2α=2sinαcosα，cos2α=cos^2α-sin^2α=2cos^2α-1=1-2sin^2α。","辅助角公式：asinx+bcosx=√(a^2+b^2)sin(x+φ)，其中tanφ=b/a。","y=Asin(ωx+φ)的性质：A为振幅、周期T=2π/ω、初相φ，由图象求A、ω、φ及平移伸缩变换规律。"],"1|0":["向量的概念：既有大小又有方向的量，用有向线段表示；零向量、单位向量、相等向量、共线向量。","向量加法：三角形法则与平行四边形法则，满足交换律、结合律，|a+b|≤|a|+|b|。","向量减法：a-b=a+(-b)，共起点连终点、指向被减向量。","数乘向量：λa的长度为|λ||a|，λ大于0同向、λ小于0反向；λ(a+b)=λa+λb。","向量共线定理：a=λb（b≠0）等价于a与b共线，用于证明三点共线。","平面向量基本定理：e1、e2不共线可作基底，任一向量a=λ1e1+λ2e2且表示唯一。","向量坐标运算：a=(x1,y1)、b=(x2,y2)，a±b=(x1±x2,y1±y2)，λa=(λx1,λy1)。","共线向量坐标条件：a∥b等价于x1y2-x2y1=0。","数量积定义与性质：a·b=|a||b|cosθ=x1x2+y1y2，a⊥b等价于a·b=0，a·a=|a|^2。","夹角与模的坐标公式：cosθ=(x1x2+y1y2)/(|a||b|)，|a|=√(x1^2+y1^2)，投影概念。","余弦定理：a^2=b^2+c^2-2bc·cosA，变形cosA=(b^2+c^2-a^2)/(2bc)，已知两边夹角求第三边。","正弦定理：a/sinA=b/sinB=c/sinC=2R（R为外接圆半径），实现边与对角正弦互化。","三角形面积公式：S=1/2·bc·sinA=1/2·ac·sinB=1/2·ab·sinC；向量用于几何与物理问题。"],"1|1":["数系的扩充与复数的概念：引入虚数单位i，i^2=-1，复数z=a+bi（a、b∈R），a为实部、b为虚部。","复数的分类：b=0时为实数，b≠0时为虚数，a=0且b≠0时为纯虚数。","复数相等的充要条件：a+bi=c+di等价于a=c且b=d，用于列方程求参数。","复数的加减法：(a+bi)±(c+di)=(a±c)+(b±d)i，实部、虚部分别相加减。","复数的乘法：(a+bi)(c+di)=(ac-bd)+(ad+bc)i，按多项式乘法展开并代i^2=-1。","共轭复数：z=a+bi的共轭为z̄=a-bi，z·z̄=|z|^2，共轭复数在复平面内关于实轴对称。","复数的除法：分子分母同乘分母的共轭复数，分母实数化，结果化为a+bi形式。","复数的几何意义：复数与复平面内的点Z(a,b)、向量一一对应，|z|表示点到原点的距离。","复数模的运算性质：|z1z2|=|z1||z2|，|z1/z2|=|z1|/|z2|，|z^n|=|z|^n。","i的幂的周期性：i^(4n)=1、i^(4n+1)=i、i^(4n+2)=-1、i^(4n+3)=-i。","复数的三角表示：z=r(cosθ+isinθ)（了解），r为模、θ为辐角，用于乘除运算。"],"1|2":["棱柱、棱锥、棱台的结构特征：底面、侧面、侧棱的关系，侧棱平行相等或交于一点。","旋转体：圆柱、圆锥、圆台分别由矩形、直角三角形、直角梯形绕轴旋转而成，球面与球的概念。","三视图与直观图：由三视图还原几何体，斜二测画法x轴方向长度不变、y轴方向减半。","圆柱表面积与体积：S=2πr(r+l)，V=Sh；棱柱体积V=Sh。","锥体与台体：V锥=1/3·Sh，V台=1/3(S'+√(S'S)+S)h，圆锥侧面积S=πrl。","球的表面积与体积：S=4πR^2，V=4/3·πR^3。","平面的基本事实：不共线三点确定一个平面；直线上的两点在平面内则整条直线在平面内；两平面有公共点则交于一条直线。","确定平面的推论：直线与直线外一点、两条相交直线、两条平行直线分别确定一个平面。","空间位置关系：两直线平行、相交或异面；直线与平面平行、相交或含于平面内；两平面平行或相交。","异面直线所成角：通过平移转化为相交直线所成角，范围(0°,90°]。","线面平行：判定（线线平行推线面平行）与性质（过平行线的平面与已知平面的交线平行于该直线）。","面面平行：判定（一个平面内两条相交直线都平行于另一平面）与性质（一个平面内的直线平行于另一平面）。","线面垂直：判定（垂直于面内两条相交直线）与性质（垂直于同一平面的两直线平行）。","面面垂直：判定（一个平面过另一平面的垂线）与性质（垂直平面内垂直于交线的直线垂直于另一平面）。"],"1|3":["基本概念：总体、个体、样本、样本容量；全面调查（普查）与抽样调查。","简单随机抽样：抽签法、随机数法，每个个体被抽到的概率相等，适合总体较小。","分层随机抽样：按比例从各层独立抽取，各层样本数=该层个体数/总体个数×样本容量。","获取数据的途径：通过调查、试验、观察、查询等方式获得数据。","频率分布直方图：组距、组数，小矩形面积=频率，各面积之和为1，频率=频数/样本容量。","频率分布折线图与总体密度曲线：由直方图绘制，总体密度曲线反映总体分布（了解）。","百分位数：n个数据从小到大排序，按定义求第p百分位数，中位数即第50百分位数。","平均数：x̄=(x1+x2+...+xn)/n，加权平均数，反映数据的集中趋势。","中位数与众数：中位数位置居中、众数是出现次数最多的数，注意适用情形。","方差与标准差：s^2=1/n·Σ(xi-x̄)^2，s=√(s^2)，方差、标准差越大数据越分散。","用样本估计总体：用样本频率分布估计总体分布，用样本数字特征估计总体数字特征。"],"1|4":["随机试验与样本空间：随机试验的每个可能结果叫样本点，全体样本点组成样本空间Ω。","随机事件：样本空间的子集称为随机事件，必然事件Ω、不可能事件∅。","事件的关系与运算：包含、相等，并事件A∪B、交事件A∩B及其含义。","互斥事件与对立事件：互斥即A∩B=∅；对立即A∪Ā=Ω且互斥，对立一定互斥、互斥不一定对立。","古典概型：样本点有限且每个样本点等可能，P(A)=n(A)/n(Ω)。","概率的基本性质：0≤P(A)≤1，P(Ω)=1，P(∅)=0。","概率加法公式：互斥事件P(A∪B)=P(A)+P(B)；一般情形P(A∪B)=P(A)+P(B)-P(A∩B)。","对立事件概率：P(Ā)=1-P(A)，用于求至少一个发生的概率。","频率与概率：大量重复试验中事件频率稳定于概率，频率是概率的近似值。","事件的相互独立性：P(AB)=P(A)P(B)则A、B相互独立，独立事件同时发生用乘法。","随机模拟：用随机数模拟试验过程估计概率（蒙特卡洛方法）。"],"2|0":["空间向量的概念与运算：加减、数乘与平面向量一致，满足交换律、结合律、分配律。","空间向量数量积：a·b=|a||b|cos〈a,b〉，a·a=|a|^2，a⊥b等价于a·b=0。","共线向量定理：p与a（a≠0）共线等价于存在唯一λ使p=λa。","共面向量定理：p与不共线的a、b共面等价于p=xa+yb。","空间向量基本定理：三个不共面向量a、b、c构成基底，任一向量p=xa+yb+zc且表示唯一。","坐标运算：a±b=(x1±x2,y1±y2,z1±z2)，λa=(λx1,λy1,λz1)，a·b=x1x2+y1y2+z1z2。","模与夹角坐标公式：|a|=√(x^2+y^2+z^2)，cos〈a,b〉=a·b/(|a||b|)。","方向向量与法向量：直线的方向向量，平面的法向量由面内两不共线向量列方程组求得。","平行关系的向量表示：线线平行看方向向量共线，线面平行看方向向量与法向量垂直，面面平行看法向量共线。","垂直关系的向量表示：线线垂直看方向向量数量积为0，线面垂直看方向向量与法向量共线，面面垂直看法向量数量积为0。","空间角公式：线线角cosθ=|a·b|/(|a||b|)，线面角sinθ=|a·n|/(|a||n|)，二面角用两法向量夹角并判断锐钝。","空间距离：点到平面距离d=|n·PA|/|n|（n为法向量），点到直线距离、线面距离可转化求解。"],"2|1":["倾斜角与斜率：倾斜角α∈[0,π)，斜率k=tanα（α≠π/2），k=(y2-y1)/(x2-x1)。","平行与垂直的斜率关系：l1∥l2等价于k1=k2，l1⊥l2等价于k1·k2=-1，注意斜率不存在情形。","直线方程的点斜式与斜截式：y-y0=k(x-x0)、y=kx+b。","直线方程的两点式与截距式：两点式、截距式x/a+y/b=1（a、b为截距且不为0）。","直线的一般式：Ax+By+C=0（A、B不同时为0），各形式可互化。","两直线交点：联立方程组求解，有唯一解相交、无解平行、无穷多解重合。","两点间距离：|P1P2|=√((x2-x1)^2+(y2-y1)^2)。","点到直线距离：d=|Ax0+By0+C|/√(A^2+B^2)；两平行直线间距离d=|C1-C2|/√(A^2+B^2)。","圆的标准方程：(x-a)^2+(y-b)^2=r^2，圆心(a,b)、半径r。","圆的一般方程：x^2+y^2+Dx+Ey+F=0，圆心(-D/2,-E/2)，半径r=√(D^2+E^2-4F)/2（D^2+E^2-4F大于0）。","直线与圆位置关系：相离、相切、相交，由圆心到直线距离d与半径r比较或用判别式判断，弦长=2√(r^2-d^2)。","圆与圆位置关系：外离、外切、相交、内切、内含，由圆心距与两半径和差比较，公共弦所在直线为两圆方程相减。"],"2|2":["椭圆的定义：|PF1|+|PF2|=2a（2a大于|F1F2|），轨迹为椭圆，F1、F2为焦点。","椭圆标准方程：x^2/a^2+y^2/b^2=1（a大于b大于0，焦点在x轴），c^2=a^2-b^2。","椭圆几何性质：范围、对称性、顶点、长轴2a、短轴2b、焦距2c，离心率e=c/a（0小于e小于1）。","椭圆焦半径：|PF1|=a+ex0、|PF2|=a-ex0（P(x0,y0)），用于求距离和的最值。","双曲线定义：||PF1|-|PF2||=2a（0小于2a小于|F1F2|），注意绝对值与焦点位置。","双曲线标准方程：x^2/a^2-y^2/b^2=1（焦点在x轴），c^2=a^2+b^2，实轴虚轴概念。","双曲线渐近线：y=±(b/a)x；等轴双曲线x^2-y^2=a^2的渐近线y=±x、离心率e=√2。","双曲线离心率：e=c/a（e大于1），反映开口大小，与渐近线斜率相关。","抛物线定义：平面内到定点F与定直线l（F不在l上）距离相等的点的轨迹。","抛物线标准方程：y^2=2px、y^2=-2px、x^2=2py、x^2=-2py，对应焦点与准线。","抛物线性质：y^2=2px焦点(p/2,0)、准线x=-p/2，范围、对称轴、顶点、离心率e=1、通径2p。","直线与圆锥曲线：联立方程用判别式判断位置关系，韦达定理设而不求，弦长|AB|=√(1+k^2)|x1-x2|。"],"3|0":["数列的概念：按确定顺序排列的一列数，数列是定义在正整数集或其有限子集上的函数。","数列的表示：通项公式、递推公式、列表与图象表示；an=Sn-S(n-1)（n≥2），a1=S1。","等差数列的定义：从第2项起每项与前一项之差等于同一常数d，d为公差。","等差数列通项公式：an=a1+(n-1)d=am+(n-m)d，d≠0时an是关于n的一次函数。","等差中项：2A=a+b，A为a、b的等差中项，一个等差中项。","等差数列前n项和：Sn=n(a1+an)/2=na1+n(n-1)d/2，是关于n的二次函数且无常数项。","等差数列性质：若m+n=p+q则am+an=ap+aq；Sk、S2k-Sk、S3k-S2k仍成等差数列。","等比数列的定义：从第2项起每项与前一项之比等于同一常数q（q≠0），q为公比。","等比数列通项与等比中项：an=a1·q^(n-1)；G^2=ab（a、b同号）时G为等比中项。","等比数列前n项和：q=1时Sn=na1；q≠1时Sn=a1(1-q^n)/(1-q)=(a1-an·q)/(1-q)。","等比数列性质：若m+n=p+q则am·an=ap·aq；Sk、S2k-Sk、S3k-S2k成等比数列（q≠-1）。","数学归纳法：证明与正整数n有关的命题，先验证n=n0成立，再假设n=k成立证明n=k+1成立。"],"3|1":["导数的概念：f'(x0)=lim(Δx→0)[f(x0+Δx)-f(x0)]/Δx，即函数在x0处的瞬时变化率。","导数的几何意义：f'(x0)为曲线y=f(x)在点(x0,f(x0))处切线的斜率，切线方程y-f(x0)=f'(x0)(x-x0)。","基本初等函数求导公式：C'=0、(x^α)'=αx^(α-1)、(sinx)'=cosx、(cosx)'=-sinx、(e^x)'=e^x、(a^x)'=a^x·lna。","对数函数求导公式：(lnx)'=1/x、(log_ax)'=1/(xlna)。","导数运算法则：(u±v)'=u'±v'、(uv)'=u'v+uv'、(u/v)'=(u'v-uv')/v^2。","复合函数求导法则：y=f(g(x))时y'=f'(g(x))·g'(x)，由外到内逐层求导相乘。","导数与单调性：f'(x)大于0则f(x)单调递增、f'(x)小于0则单调递减，求单调区间先求定义域。","函数的极值：f'(x0)=0且左右两侧导数异号，则x0为极值点，极大值与极小值的判定。","函数的最值：连续函数在闭区间上必有最大值与最小值，比较极值与端点函数值。","恒成立与参数范围：转化为最值问题，分离参数后研究新函数的最值。","生活中的优化问题：用料最省、利润最大等实际问题，用导数求最值并检验。"],"3|2":["分类加法计数原理：完成一件事有n类不同办法，各类办法互斥，总方法数为各类方法数之和。","分步乘法计数原理：完成一件事需依次完成n个步骤，总方法数为各步方法数之积。","排列的概念：从n个不同元素中取出m个元素按一定顺序排成一列；排列数A(n,m)=n!/(n-m)!。","全排列：n个不同元素的排列数A(n,n)=n!，规定0!=1。","组合的概念：从n个不同元素中取出m个元素组成一组，与顺序无关；组合数C(n,m)=n!/[m!(n-m)!]。","排列与组合的关系：A(n,m)=C(n,m)·m!，先选后排。","组合数性质：C(n,m)=C(n,n-m)，C(n,m)+C(n,m-1)=C(n+1,m)。","二项式定理：(a+b)^n=C(n,0)a^n+C(n,1)a^(n-1)b+...+C(n,k)a^(n-k)b^k+...+C(n,n)b^n，共n+1项。","二项展开式的通项：T(k+1)=C(n,k)·a^(n-k)·b^k，用于求指定项、指定项系数。","二项式系数性质：对称性C(n,k)=C(n,n-k)；各二项式系数和为2^n，奇数项系数和=偶数项系数和=2^(n-1)。","二项式系数最大项：n为偶数时中间一项最大，n为奇数时中间两项相等且最大；注意与系数最大项区分。"],"3|3":["条件概率：P(B|A)=P(AB)/P(A)（P(A)大于0），表示在A发生的条件下B发生的概率。","乘法公式：P(A
