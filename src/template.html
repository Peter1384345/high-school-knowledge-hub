        ctx.strokeStyle = rgba(dark() ? [220, 180, 120] : [176, 128, 66], .4); ctx.lineWidth = 1; ctx.stroke();
      }
    }
    if (mode === 'home'){
      for (let i = 0; i < 12; i++){
        const x = ((i * 97 + t * .012) % (W + 40)) - 20, y = ((i * 61 + t * .02) % (H + 40)) - 20;
        ctx.beginPath(); ctx.arc(x, y, 1 + i % 3, 0, 6.283);
        ctx.fillStyle = rgba(dark() ? [210, 205, 190] : [60, 56, 50], .1); ctx.fill();
      }
    }
    drawSubjectEls(mode, t);
    if (mode === 'chinese' || mode === 'biology' || mode === 'english' || mode === 'home') drawForeground();
    drawVignette();
    drawNoise();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============ 知识关系图谱 ============ */
const CROSS_RULES = [
  ['math', '导数', 'physics', '运动的描述'],
  ['math', '导数', 'physics', '电磁感应'],
  ['math', '三角函数', 'physics', '圆周运动'],
  ['math', '三角函数', 'physics', '交变电流'],
  ['math', '三角函数', 'physics', '机械振动与机械波'],
  ['math', '平面向量', 'physics', '抛体运动'],
  ['math', '平面向量', 'physics', '静电场'],
  ['math', '指数函数', 'physics', '牛顿运动定律'],
  ['math', '随机变量', 'biology', '遗传'],
  ['math', '计数原理', 'biology', '遗传'],
  ['math', '统计', 'biology', '种群'],
  ['math', '圆锥曲线', 'physics', '万有引力'],
  ['physics', '分子动理论', 'chemistry', '物质的量'],
  ['chemistry', '化学反应速率', 'biology', '能量供应'],
  ['chemistry', '氧化还原反应', 'biology', '细胞的能量供应'],
  ['chemistry', '有机化合物基础', 'biology', '组成细胞的分子'],
  ['chemistry', '盐类水解', 'biology', '人体的内环境'],
  ['chemistry', '电化学', 'physics', '恒定电流'],
  ['chemistry', '化学平衡', 'biology', '生态系统'],
  ['physics', '静电场', 'chemistry', '原子结构']
];
const GRAPH = { nodes: [], edges: [], scale: 1, tx: 0, ty: 0, built: false, filters: {}, simRaf: null };
const SVGNS = 'http://www.w3.org/2000/svg';

function buildGraph(){
  const nodes = [], edges = [], bySubj = {};
  DATA.forEach((s, si) => {
    bySubj[s.id] = [];
    s.periods.forEach((p, pi) => {
      p.modules.forEach((m, mi) => {
        const items = CATS.reduce((n, c) => n + (m[c.key] || []).length, 0);
        nodes.push({
          id: s.id + '|' + pi + '|' + mi, sid: s.id, si, pi, mi,
          title: m.title, items, r: 5 + Math.min(14, Math.sqrt(items) * 1.35),
          x: 0, y: 0, vx: 0, vy: 0, pinned: false
        });
        bySubj[s.id].push(nodes[nodes.length - 1]);
      });
    });
  });
  for (const arr of Object.values(bySubj))
    for (let i = 0; i < arr.length - 1; i++) edges.push({ s: arr[i], t: arr[i + 1], cross: false });
  const findNode = (sid, kw) => { const arr = bySubj[sid] || []; for (const n of arr) if (n.title.includes(kw)) return n; return null; };
  for (const [a, ka, b, kb] of CROSS_RULES){
    const na = findNode(a, ka), nb = findNode(b, kb);
    if (na && nb && na !== nb) edges.push({ s: na, t: nb, cross: true });
  }
  /* 初始位置：按学科分布在圆环上 */
  const subs = DATA.map((s) => s.id);
  subs.forEach((sid, k) => {
    const arr = bySubj[sid];
    const ang = (k / subs.length) * 6.283;
    const cx = Math.cos(ang) * 260, cy = Math.sin(ang) * 200;
    arr.forEach((n, i) => {
      const a2 = ang + (i / Math.max(1, arr.length)) * 0.9 - 0.45;
      n.x = cx + Math.cos(a2) * 130;
      n.y = cy + Math.sin(a2) * 100;
    });
  });
  return { nodes, edges };
}
function simTick(){
  const N = GRAPH.nodes;
  for (let i = 0; i < N.length; i++){
    for (let j = i + 1; j < N.length; j++){
      const a = N[i], b = N[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 4){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 4; }
      const d = Math.sqrt(d2);
      const f = 2400 / d2;
      const fx = dx / d * f, fy = dy / d * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  for (const e of GRAPH.edges){
    const a = e.s, b = e.t;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    const f = (d - 96) * 0.02;
    const fx = dx / d * f, fy = dy / d * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  for (const n of N){
    n.vx += -n.x * 0.012; n.vy += -n.y * 0.012;
    n.vx *= 0.85; n.vy *= 0.85;
    const sp = Math.hypot(n.vx, n.vy);
    if (sp > 4){ n.vx *= 4 / sp; n.vy *= 4 / sp; }
    if (!n.pinned){ n.x += n.vx; n.y += n.vy; }
  }
}
function renderGraph(){
  const svg = $('#gvSvg');
  svg.innerHTML = '';
  const g = document.createElementNS(SVGNS, 'g');
  g.id = 'gvMain';
  g.setAttribute('transform', 'translate(' + GRAPH.tx + ',' + GRAPH.ty + ') scale(' + GRAPH.scale + ')');
  svg.appendChild(g);
  GRAPH.edgeEls = GRAPH.edges.map((e) => {
    const l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('class', 'gv-edge' + (e.cross ? ' cross' : ''));
    g.appendChild(l);
    return { el: l, e };
  });
  GRAPH.nodeEls = GRAPH.nodes.map((n) => {
    const s = DATA[n.si];
    const ng = document.createElementNS(SVGNS, 'g');
    ng.setAttribute('class', 'gv-node');
    ng.dataset.id = n.id;
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', n.r);
    c.setAttribute('fill', s.color);
    c.setAttribute('fill-opacity', '.88');
    ng.appendChild(c);
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('class', 'gv-label');
    t.setAttribute('y', -(n.r + 9));
    t.textContent = n.title;
    ng.appendChild(t);
    g.appendChild(ng);
    return { el: ng, n };
  });
  updateGraphPositions();
  updateGraphVisibility();
}
function updateGraphPositions(){
  for (const o of GRAPH.nodeEls) o.el.setAttribute('transform', 'translate(' + o.n.x + ',' + o.n.y + ')');
  for (const o of GRAPH.edgeEls){
    o.el.setAttribute('x1', o.e.s.x); o.el.setAttribute('y1', o.e.s.y);
    o.el.setAttribute('x2', o.e.t.x); o.el.setAttribute('y2', o.e.t.y);
  }
}
function updateGraphVisibility(){
  for (const o of GRAPH.nodeEls) o.el.style.display = GRAPH.filters[o.n.sid] === false ? 'none' : '';
  for (const o of GRAPH.edgeEls){
    const sHide = GRAPH.filters[o.e.s.sid] === false, tHide = GRAPH.filters[o.e.t.sid] === false;
    o.el.style.display = (sHide || tHide) ? 'none' : '';
  }
}
function highlightGraph(id){
  for (const o of GRAPH.nodeEls) o.el.classList.remove('hl', 'dim');
  for (const o of GRAPH.edgeEls) o.el.classList.remove('hl');
  if (!id) return;
  const adj = new Set([id]);
  for (const o of GRAPH.edgeEls){
    if (o.e.s.id === id || o.e.t.id === id){ o.el.classList.add('hl'); adj.add(o.e.s.id); adj.add(o.e.t.id); }
  }
  for (const o of GRAPH.nodeEls){
    if (o.n.id === id) o.el.classList.add('hl');
    else if (!adj.has(o.n.id)) o.el.classList.add('dim');
  }
}
function startSim(ms){
  if (GRAPH.simRaf) return;
  const t0 = performance.now();
  const loop = () => {
    simTick();
    updateGraphPositions();
    if (performance.now() - t0 < ms) GRAPH.simRaf = requestAnimationFrame(loop);
    else GRAPH.simRaf = null;
  };
  loop();
}
function stopSim(){ if (GRAPH.simRaf){ cancelAnimationFrame(GRAPH.simRaf); GRAPH.simRaf = null; } }

function openGraph(){
  if (!DATA_OK) return;
  if (!GRAPH.built){
    const g = buildGraph();
    GRAPH.nodes = g.nodes; GRAPH.edges = g.edges;
    DATA.forEach((s) => { GRAPH.filters[s.id] = true; });
    GRAPH.built = true;
  }
  const wrap = $('#gvWrap');
  GRAPH.tx = wrap.clientWidth / 2;
  GRAPH.ty = wrap.clientHeight / 2;
  GRAPH.scale = 1;
  /* 过滤条 */
  $('#gvFilters').innerHTML = DATA.map((s) => `
    <button class="gv-fchip on" data-sid="${s.id}"><span class="fd" style="background:${s.color}"></span>${esc(s.name)}</button>`).join('');
  $$('#gvFilters .gv-fchip').forEach((b) => {
    b.addEventListener('click', () => {
      const sid = b.dataset.sid;
      GRAPH.filters[sid] = !(GRAPH.filters[sid] === false);
      b.classList.toggle('on', GRAPH.filters[sid] !== false);
      b.classList.toggle('off', GRAPH.filters[sid] === false);
      updateGraphVisibility();
    });
  });
  $('#graphView').classList.remove('hidden');
  document.body.classList.add('no-scroll');
  renderGraph();
  startSim(2800);
}
function closeGraph(){
  $('#graphView').classList.add('hidden');
  document.body.classList.remove('no-scroll');
  stopSim();
  highlightGraph(null);
}
/* 图谱交互 */
(function graphInteractions(){
  const wrap = $('#gvWrap');
  const tip = $('#gvTip');
  let panning = false, px = 0, py = 0;
  let dragNode = null, dragMoved = 0, dx0 = 0, dy0 = 0;
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left - GRAPH.tx, my = e.clientY - rect.top - GRAPH.ty;
    const ns = Math.min(3.2, Math.max(.25, GRAPH.scale * Math.exp(-e.deltaY * .0012)));
    GRAPH.tx += mx - mx * (ns / GRAPH.scale);
    GRAPH.ty += my - my * (ns / GRAPH.scale);
    GRAPH.scale = ns;
    $('#gvMain').setAttribute('transform', 'translate(' + GRAPH.tx + ',' + GRAPH.ty + ') scale(' + GRAPH.scale + ')');
  }, { passive: false });
  wrap.addEventListener('pointerdown', (e) => {
    const nodeG = e.target.closest('.gv-node');
    if (nodeG){
      const n = GRAPH.nodes.find((x) => x.id === nodeG.dataset.id);
      if (n){
        dragNode = n; n.pinned = true;
        dragMoved = 0; dx0 = e.clientX; dy0 = e.clientY;
        stopSim();
        nodeG.setPointerCapture(e.pointerId);
        return;
      }
    }
    panning = true; px = e.clientX; py = e.clientY;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (dragNode){
      const rect = wrap.getBoundingClientRect();
      dragNode.x = (e.clientX - rect.left - GRAPH.tx) / GRAPH.scale;
      dragNode.y = (e.clientY - rect.top - GRAPH.ty) / GRAPH.scale;
      dragMoved = Math.max(dragMoved, Math.hypot(e.clientX - dx0, e.clientY - dy0));
      updateGraphPositions();
      return;
    }
    if (panning){
      GRAPH.tx += e.clientX - px; GRAPH.ty += e.clientY - py;
      px = e.clientX; py = e.clientY;
      $('#gvMain').setAttribute('transform', 'translate(' + GRAPH.tx + ',' + GRAPH.ty + ') scale(' + GRAPH.scale + ')');
    }
  });
  wrap.addEventListener('pointerup', (e) => {
    if (dragNode){
      const n = dragNode;
      dragNode = null;
      n.pinned = false;
      if (dragMoved < 6) jumpTo({ s: n.sid, pi: n.pi, mi: n.mi });
      else startSim(1400);
      return;
    }
    panning = false;
  });
  wrap.addEventListener('pointerover', (e) => {
    const nodeG = e.target.closest('.gv-node');
    if (nodeG){
      const n = GRAPH.nodes.find((x) => x.id === nodeG.dataset.id);
      if (n){
        const s = DATA[n.si];
        highlightGraph(n.id);
        tip.innerHTML = '<b>' + s.icon + ' ' + esc(s.name) + '</b> · ' + esc(s.periods[n.pi].period) + '<br/>' + esc(n.title) + '<br/><span style="color:var(--faint)">' + n.items + ' 条知识点</span>';
        tip.classList.remove('hidden');
        const r = wrap.getBoundingClientRect();
        tip.style.left = Math.min(e.clientX - r.left + 16, r.width - 300) + 'px';
        tip.style.top = Math.max(e.clientY - r.top + 14, 8) + 'px';
      }
    } else {
      highlightGraph(null);
      tip.classList.add('hidden');
    }
  });
})();

/* ============ 电子课本 ============ */
const ETB = { sid: null, bIdx: 0, uIdx: 0, sIdx: 0 };
function etbBooks(sid){
  const t = TOC[sid] || {};
  const books = [];
  Object.keys(t).forEach((pi) => {
    (t[pi] || []).forEach((b) => { books.push({ pi: Number(pi), book: b.book, units: b.units || [] }); });
  });
  return books;
}
function openEtb(){
  if (!DATA_OK) return;
  state.view = 'etb';
  state.subject = null;
  stopTyping();
  if (!ETB.sid) ETB.sid = DATA[0].id;
  setBgMode(ETB.sid);
  const books = etbBooks(ETB.sid);
  if (ETB.bIdx >= books.length) ETB.bIdx = 0;
  if (books[ETB.bIdx] && ETB.uIdx >= books[ETB.bIdx].units.length) ETB.uIdx = 0;
  const book = books[ETB.bIdx];
  if (book && book.units[ETB.uIdx] && ETB.sIdx >= book.units[ETB.uIdx].sections.length) ETB.sIdx = 0;
  swapView(renderEtb);
  closeDrawer();
  window.scrollTo({ top: 0 });
  try { document.title = '高中全科知识库 · 电子课本'; } catch (e) {}
  updateSidebar();
}
function renderEtb(){
  const s = DATA.find((x) => x.id === ETB.sid) || DATA[0];
  const books = etbBooks(s.id);
  const book = books[ETB.bIdx] || null;
  const unit = book ? book.units[ETB.uIdx] || null : null;
  const sec = unit ? unit.sections[ETB.sIdx] || null : null;
  const subjChips = DATA.map((x) => `<button class="etb-subj${x.id === s.id ? ' on' : ''}" data-sid="${x.id}" style="--accent:${x.color}">${x.icon} ${esc(x.name)}</button>`).join('');
  const bookChips = books.map((b, i) => `<button class="etb-book${i === ETB.bIdx ? ' on' : ''}" data-b="${i}">${esc(b.book)}</button>`).join('');
  const unitsHtml = book ? book.units.map((u, ui) => {
    const open = ui === ETB.uIdx;
    return `<div class="etb-unit${open ? ' open' : ''}">
      <button class="etb-ut" data-u="${ui}"><span class="etb-ar">${open ? '▾' : '▸'}</span>${esc(u.unit)}</button>
      ${open ? `<div class="etb-secs">${u.sections.map((sx, si) => `<button class="etb-sec${si === ETB.sIdx ? ' on' : ''}" data-s="${si}">${esc(sx.sec)}</button>`).join('')}</div>` : ''}
    </div>`;
  }).join('') : '<div class="etb-empty">暂无目录数据</div>';
  $('#view').innerHTML = `
    <div class="etb-head reveal" style="--accent:${s.color}">
      <span class="sh-ico" style="background:${s.color}22;border-color:${s.color}55">📖</span>
      <div class="sh-info">
        <h1>电子课本</h1>
        <p>按人教版 / 统编版新教材真实单元目录浏览，每一节配知识点精要，可一键进入对应模块深度学习。</p>
      </div>
    </div>
    <div class="etb-res reveal">
      <span class="etb-res-t">📚 官方正版电子教材：</span>
      <a class="etb-res-link" href="https://basic.smartedu.cn/" target="_blank" rel="noopener">🏫 国家中小学智慧教育平台<span>教育部官方 · 免费在线阅读各科教材</span></a>
      <a class="etb-res-link" href="https://www.pep.com.cn/" target="_blank" rel="noopener">🏢 人民教育出版社官网<span>教材出版方 · 教材资讯与电子资源</span></a>
      <a class="etb-res-link" href="https://www.pep.com.cn/jc/" target="_blank" rel="noopener">📖 人教社·教材频道<span>中小学教材电子版入口</span></a>
    </div>
    <div class="etb-body reveal">
      <aside class="etb-toc">
        <div class="etb-subjects">${subjChips}</div>
        <div class="etb-books">${bookChips}</div>
        <div class="etb-units">${unitsHtml}</div>
      </aside>
      <section class="etb-detail">${renderEtbDetail(s, book, unit, sec)}</section>
    </div>`;
  bindEtb();
  revealAll();
}
function renderEtbDetail(s, book, unit, sec){
  if (!sec) return '<div class="etb-empty">请在左侧选择一个节查看内容</div>';
  const ref = sec.module;
  let mod = null, pi = null, mi = null;
  if (ref){
    const parts = ref.split('|');
    pi = Number(parts[0]); mi = Number(parts[1]);
    if (s.periods[pi] && s.periods[pi].modules[mi]) mod = s.periods[pi].modules[mi];
  }
  const crumb = `<div class="etb-crumb">${esc(s.name)} · ${esc(book ? book.book : '')} · ${esc(unit ? unit.unit : '')} · <b>${esc(sec.sec)}</b></div>`;
  if (!mod){
    return `<div class="etb-sec-detail">${crumb}
      <h3 class="etb-sec-title">${esc(sec.sec)}</h3>
      <div class="etb-empty">本节暂无关联知识模块，可前往「${esc(s.name)}」系统学习。</div>
      <div class="mt-actions"><button class="primary-btn" data-goto-subj="${s.id}">前往 ${esc(s.name)} 学习 →</button></div>
    </div>`;
  }
  const tb = (TEXTBOOK[s.id] || {})[pi + '|' + mi] || [];
  const catsHtml = CATS.map((c) => {
    const arr = mod[c.key] || [];
    if (!arr.length) return '';
    return `<div class="etb-cat"><h4><span class="chip chip-${c.cls}">${c.icon} ${c.name}</span><em>${arr.length} 条</em></h4>
      <ul>${arr.slice(0, 10).map((t) => `<li class="etb-it"><span class="etb-dot"></span>${esc(t)}</li>`).join('')}</ul></div>`;
  }).join('');
  return `<div class="etb-sec-detail">${crumb}
    <h3 class="etb-sec-title">${esc(sec.sec)}</h3>
    <p class="etb-sec-module">关联模块：<b style="color:${s.color}">${esc(mod.title)}</b>（${esc(s.periods[pi].period)}）</p>
    ${tb.length ? `<div class="etb-tb"><h4><span class="chip chip-book">📖 课本知识点</span><em>${tb.length} 条</em></h4>
      <ul>${tb.map((t) => `<li class="etb-it"><span class="etb-dot"></span>${esc(t)}</li>`).join('')}</ul></div>` : ''}
    <div class="etb-cats">${catsHtml}</div>
    <div class="mt-actions" style="margin-top:18px"><button class="primary-btn" data-goto-mod="${s.id}|${pi}|${mi}">📖 进入「${esc(mod.title)}」深度学习 →</button></div>
  </div>`;
}
function bindEtb(){
  $$('.etb-subj').forEach((b) => b.addEventListener('click', () => { ETB.sid = b.dataset.sid; ETB.bIdx = 0; ETB.uIdx = 0; ETB.sIdx = 0; setBgMode(ETB.sid); renderEtb(); }));
  $$('.etb-book').forEach((b) => b.addEventListener('click', () => { ETB.bIdx = Number(b.dataset.b); ETB.uIdx = 0; ETB.sIdx = 0; renderEtb(); }));
  $$('.etb-ut').forEach((b) => b.addEventListener('click', () => { ETB.uIdx = Number(b.dataset.u); ETB.sIdx = 0; renderEtb(); }));
  $$('.etb-sec').forEach((b) => b.addEventListener('click', () => { ETB.sIdx = Number(b.dataset.s); renderEtb(); }));
}

addEventListener('scroll', () => { toTop.classList.toggle('show', scrollY > 500); }, { passive: true });
toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ============ 抽屉（移动端） ============ */
const sidebar = $('#sidebar'), mask = $('#mask');
function openDrawer(){ sidebar.classList.add('open'); mask.classList.add('show'); }
function closeDrawer(){ sidebar.classList.remove('open'); mask.classList.remove('show'); }
$('#menuBtn').addEventListener('click', openDrawer);
mask.addEventListener('click', closeDrawer);

/* ============ 全局点击委派 ============ */
document.addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (item){
    if (e.target.closest('.dot') || item.dataset.cat === 't'){ cycleLevel(item); return; }
    item.classList.toggle('open');
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav){
    e.preventDefault();
    if (nav.dataset.nav === 'home') goHome();
    else if (nav.dataset.nav === 'start'){ const g = $('.subj-grid'); if (g) g.scrollIntoView({ behavior: 'smooth' }); }
    return;
  }
  const subj = e.target.closest('[data-subject]');
  if (subj){ openSubject(subj.dataset.subject); return; }
  const gotoMod = e.target.closest('[data-goto-mod]');
  if (gotoMod){ const p = gotoMod.dataset.gotoMod.split('|'); jumpTo({ s: p[0], pi: Number(p[1]), mi: Number(p[2]) }); return; }
  const gotoSubj = e.target.closest('[data-goto-subj]');
  if (gotoSubj){ openSubject(gotoSubj.dataset.gotoSubj); return; }
  const res = e.target.closest('.search-item');
  if (res){ jumpTo(res.dataset); return; }
  if (!e.target.closest('.search-wrap')) hideSearch();
});
$('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) hideModal(); });

/* ============ 键盘 ============ */
addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){ hideSearch(); hideModal(); closeGraph(); }
  if (e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault(); searchInput.focus();
  }
});

/* ============ 启动 ============ */
renderSidebar();
setBgMode('home');
updateReviewBadge();
if (DATA_OK){
  renderHome();
  initScene(document.getElementById('fx'));
} else {
  renderHome();
}
})();
