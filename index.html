p":"先辨体裁再读文：新闻抓导语、报告抓数据、访谈抓问答。","example":"一则讲解睡眠原理的文本，先辨其科普体裁，再抓“褪黑素”等核心概念，阅读路径即明。"},"3|1|k|1":{"explain":"筛选整合三步法：据题干关键词定位区间，与选项逐词比对辨正误，概括时合并同类项提炼要点。防遗漏靠穷尽定位：题干问什么就把相关段落全部圈出。","tip":"概括前先圈全相关段落，宁可多圈不漏圈。","example":"题干问“我国航天成就”，先在材料中圈出嫦娥、天宫相关段落，再逐段提取要点合并归类。"},"3|1|k|2":{"explain":"三类图表读法不同：柱状看高低比较，折线看变化趋势，饼图看占比结构。表述“总体……其中……最高……最低”，数字单位准确，趋势词与图相符。","tip":"图表表述先总体后局部，趋势词与图形一致。","example":"折线图显示网购人数逐年上升，可表述为“网购规模总体扩大、近两年增速放缓”，趋势准确。"},"3|1|k|3":{"explain":"多材料题先分别概括各则要点，再横向比较：相同点合并，不同点分列，注意材料间互补（一则背景一则措施一则意义）。用“材料一……材料二……共同……差异……”对照结构。","tip":"比较题每条注明材料来源，异同分列层次清楚。","example":"材料一讲背景、材料二讲措施，概括时合并“背景”类信息，分列“措施”类要点，异同自明。"},"3|1|k|4":{"explain":"情境任务是学以致用：拟标题要准确醒目，写短评要观点加分析，提建议要具体可行。规范表达要点：身份意识、对象意识、字数意识。","tip":"情境任务先审身份对象字数，再组织内容。","example":"情境任务拟题：为读书活动拟“书香满城，阅见未来”，既扣主题又有文采，符合字数限制。"},"3|1|d|0":{"explain":"信息分散是实用文常态，对策是分区提取加合并归类：把材料按段落编号，逐段提取要点，再合并同类项，最后检查有无重复遗漏。列表格整理最清晰。","tip":"逐段编号提取要点，合并同类后自查重复遗漏。","example":"材料三段各谈阅读现状、原因、对策，逐段提取后把“原因”类两条合并，防重复防遗漏。"},"3|1|d|1":{"explain":"图表与文字结合题要数据加结论：不只复述数据，还要读出数据背后的意义（上升说明什么、对比揭示什么）。答题模式“数据表现＋原因分析＋结论启示”。","tip":"读图表多问“这组数据说明什么”，结论比数据重要。","example":"柱状图显示青少年近视率逐年上升，结论应是“用眼习惯堪忧、防控刻不容缓”，而非只报数字。"},"3|1|d|2":{"explain":"归纳要点通病是照抄原文、逐句罗列。对策：先提炼每句的上位概念（具体事例概括为抽象要点），再合并同类项。概括语言简洁，用“动词＋名词”短语列点。","example":"材料列举手机平板电脑的普及，可概括为“智能设备广泛普及”。","tip":"归纳时先提炼上位词，再合并同类，忌整句照抄。"},"3|1|e|0":{"explain":"实用类三大高频设错：曲解文意、范围失当、强加因果。解题逐项回文比对，重点盯“改词、加限定、删限定、加因果”四种手法。","tip":"比对时把选项与原文差异处圈出，差异即考点。"},"3|1|e|1":{"explain":"概括要点答题规范：先总说再分点，语言简洁用短语不用长句。要点按材料顺序或逻辑顺序排列，每条独立不重叠。","tip":"概括题“总分结构＋短语列点”，每条不超过一行。"},"3|1|e|2":{"explain":"探究题三要素：亮观点、引材料、作分析。结构“观点先行，材料佐证，分析收束”，观点站得住，材料贴切，分析有逻辑。","tip":"探究题按“观点—材料—分析”三段写。"},"3|1|e|3":{"explain":"开放题考综合表达：图文转换要准确（数字、趋势、结论不误），提建议要可行（具体、可操作、切题），表达要得体。先审任务指令再组织语言。","tip":"开放题先审“给谁提、做什么、多少字”，得体先行。"},"3|2|k|0":{"explain":"小说四要素构成有机整体：人物是核心，情节展现人物，环境烘托人物，主题由三者共同体现。答题挂靠四要素框架：问情节想人物主题，问环境想人物情节。","tip":"答题前先想四要素，问题落哪个就联动其他。","example":"分析《祝福》，祥林嫂之死是人物，倒叙手法是情节，鲁镇氛围是环境，三者合力揭示礼教主题。"},"3|2|k|1":{"explain":"散文读法一线串珠：先找线索（物线、情线、人线、事线或时空线），再沿线索梳理材料，最后归拢到神（主旨情感）。线索是形散的黏合剂。","example":"《荷塘月色》以“荷塘月色”为线，串联游踪与心绪变化。","tip":"散文题先点线索类型，再沿线索理思路。"},"3|2|k|2":{"explain":"文学类四大题型各有套路：作用题答内容结构情感，形象题答特征加依据，主旨题答情感加态度，探究题答观点加文本加延伸。先判题型再套框架。","tip":"先判题型再答题，四大框架要背熟。","example":"“某段有何作用”是作用题，“祥林嫂是怎样的人”是形象题，先判题型再动笔，思路即清。"},"3|2|k|3":{"explain":"表达技巧分四层：修辞手法、表现手法（象征、对比、衬托、虚实）、表达方式（叙述描写抒情议论）、语言特色。答技巧题先定位层次，再点名称，最后分析效果。","tip":"技巧题先分层次再点名称，分析与效果不可省。","example":"“像亭亭的舞女的裙”属修辞层，“以乐景衬哀情”属表现手法层，先分层再作答不混淆。"},"3|2|k|4":{"explain":"探究题是有依据的开放：观点明确，依据充分（引文本细节），延伸适度（联系背景现实但不跑远）。结构“亮观点—摆依据—作延伸”。","tip":"探究题观点先行，依据必引原文，延伸一两句即可。","example":"探究“祥林嫂之死谁之过”，先亮“礼教是根源”的观点，再引捐门槛被拒的细节作依据。"},"3|2|d|0":{"explain":"过度解读是主旨题通病：把文本没有的意思强加上去。防范：每个解读必须能找到文本依据（原句、细节），凡无据的深意都是过度。答题用“文本证据→主旨结论”自证。","tip":"主旨结论必须能回指原文细节，无据的解读要删。","example":"说“祥林嫂死于懒惰”即过度解读，原文处处写她勤劳耐劳，任何解读都必须找到文本依据。"},"3|2|d|1":{"explain":"散文物象含义常分三层：表层（物象本身特征）、深层（寄托的情感意蕴）、象征（指向时代人生哲理）。答题逐层展开，由实到虚，每层结合文本说明。","example":"《灯》中的灯：表层是照明的灯，深层是希望，象征光明与温暖。","tip":"物象含义按“表层—深层—象征”三层答。"},"3|2|d|2":{"explain":"次要人物与闲笔都有叙事功能：推动情节、制造悬念、丰富视角、映衬主角、揭示环境。分析问“没有他（它）会怎样”，功能即现。闲笔往往为后文伏笔。","example":"《林教头》中店小二夫妇是闲笔，却牵出陆谦密谋。","tip":"次要人物题用“没有他行不行”反推功能。"},"3|2|e|0":{"explain":"文学类选择题考细读：人物言行（谁说了什么做了什么）、情感基调（悲喜深浅）。错误常是言行错位、情感拔高或曲解。比对逐项回文核对。","tip":"文学选择题逐项回文核对人物言行，情感拔高是高频错点。"},"3|2|e|1":{"explain":"情节作用双角度：结构上答铺垫、伏笔、悬念、承上启下、照应；内容上答塑造人物、揭示主题、渲染氛围。先结构后内容，每点结合情节具体说明。","tip":"情节题先答结构再答内容，两角度覆盖防漏分。"},"3|2|e|2":{"explain":"人称视角题答“类型＋效果”：第一人称增强真实感便于抒情，第二人称拉近距离，第三人称客观灵活。近年爱考“我”的见证作用。","example":"《祝福》以“我”见证祥林嫂命运，真实感强且带出反思。","tip":"人称题必答类型加效果，“见证、真实感、限制”三词会用。"},"3|2|e|3":{"explain":"结尾艺术各有效果：欧·亨利式（出人意料又在情理之中）制造反差回味；留白式（戛然而止）引人想象；呼应式结构完整。先判类型再谈效果与主题。","example":"《麦琪的礼物》结尾互赠无用礼物，出人意料却深化爱的主题。","tip":"结尾题先定类型（逆转、留白、呼应），再答效果。"},"3|2|e|4":{"explain":"语言赏析四角度：炼字（传神）、句式（长短整散、反问排比）、语体（口语化亲切、书面语典雅）、风格（质朴华丽幽默冷峻）。答题“角度＋例句＋效果”。","tip":"语言赏析选两三个角度写透，忌罗列不分析。"},"3|3|k|0":{"explain":"断句四技巧：找名词代词定主宾（名词常作断点边界）、看虚词（句首句尾语气词）、辨句式（判断被动倒装句自足）、观对称（四六骈偶成对断）。四法并用再以句意验证。","tip":"断句四法齐用，断完必默读验证。","example":"“臣闻求木之长者，必固其根本”，借“臣闻”领起与对偶对称句式断句，再以句意验证无误。"},"3|3|k|1":{"explain":"实词推断五法：语境推断（前后文意定义）、语法推断（词性位置定）、字形推断（形旁表义）、成语印证（成语保留古义）、课内迁移（课内例句对照）。五法交叉使用。","example":"“引”有拉开弓义，由字形与“引而不发”成语可印证。","tip":"实词推断至少用两法交叉验证，单法易错。"},"3|3|k|2":{"explain":"翻译十字诀：直译为主（逐词对译）、意译为辅（直译不通时调整）、字字落实（每个词都译出）、文从句顺（符合现代汉语）。先直译再润色。","tip":"翻译先逐词直译，再调语序补省略，最后通读。","example":"“假舟楫者，非能水也”：假译凭借、水作动词游水，直译后调序为“借助舟船的人，并非会游水”。"},"3|3|k|3":{"explain":"高频实词分类记：官职类（拜授、除授、擢升、迁调动、谪贬）、数量类（再两次、三多次）、地理类（阴山北水南、阳山南水北）、古今异义（行李使者）。分类记忆效率最高。","example":"“一鼓作气，再而衰”中“再”是第二次。","tip":"高频实词按官职数量地理异义分类建表。"},"3|3|k|4":{"explain":"文化常识按体系记忆：官职（授升降罢）、科举（院乡会殿试）、礼仪（冠婚丧祭）、称谓（谦敬讳称）、天文（星宿分野）、地理（州郡阴阳五岳）。体系化记忆连成网。","tip":"文化常识按六大体系分类整理，考前按体系过。","example":"官职题中“拜为上卿”是授官、“谪守巴陵”是降职，按官职升降体系归类记忆，一见便可辨明。"},"3|3|k|5":{"explain":"内容概括题用五要素比对法：选项与原文逐一核对人物（张冠李戴？）、事件（无中生有？）、时间（颠倒？）、地点（错位？）、因果（强加？）。五要素全对才选。","tip":"概括题按人物事件时间地点因果五要素逐项比对。","example":"选项说“屈原主动求死”，原文写“怀石自沉”乃放逐后的绝望选择，须回文比对人物因果。"},"3|3|d|0":{"explain":"一词多义题的代入排除法：把每个义项代入原句试译，通顺者保留，不通者排除；多义项通顺时再据语境（人物身份、事件逻辑、情感倾向）精筛。先排后选。","example":"“亡”在“亡走赵”中是逃亡，在“亡何国变”中是灭亡。","tip":"一词多义先代入试译排除，再据语境精筛。"},"3|3|d|1":{"explain":"省略句翻译要补（补省略的主语宾语介词），倒装句翻译要调（按现代语序调整）。识别：译不通先想省略，语序怪先想倒装。补调之后再直译。","example":"“（秦伯）与郑人盟”补主语；“沛公安在”调为“沛公在安”。","tip":"翻译先查省略后查倒装，补足调整后再直译。"},"3|3|d|2":{"explain":"概括题最怕品质与事件错配：把甲事件体现的品质安到乙事件上。防范：坚持一事一品，每个品质注明出自哪个事件；比对时品质词与事件一一对应核查。","tip":"概括人物品质用“事件＋品质”配对，逐对核查。","example":"“清廉”出自拒贿之事，“忠勇”出自守城之战，一事一品、对应作答，可防张冠李戴之误。"},"3|3|e|0":{"explain":"新高考常给两则文言材料，考查比较阅读：比人物形象异同、比观点态度、比写法差异。应对：分别概括两则要点，再统一角度比较，异同分列。","tip":"双文本先各自概括，再按同一角度比较异同。"},"3|3|e|1":{"explain":"断句选择题有快速排除法：先看四个选项的断点差异，利用结构对称（四六骈偶、排比）快速排除错误断点，再结合句意验证。重点比对差异处。","tip":"断句选择题先找差异点，用对称结构快排再验证。"},"3|3|e|2":{"explain":"高考翻译约四类踩分点：重点实词（含活用）、关键虚词、特殊句式、整体文意。备考养成圈点翻译法：先圈采分点再动笔，译后回读检查漏译。","tip":"翻译前先圈采分点，逐点落实再通读。"},"3|3|e|3":{"explain":"新高考文化常识转向语境理解：把常识放入文句语境考运用。应对：掌握常识体系，做题把常识放回语境验证，常识与语境互相印证。","tip":"文化常识题先回语境验证，勿只凭记忆。"},"3|3|e|4":{"explain":"概括题三大误设：时序颠倒（先后错位）、无中生有（凭空添加）、强加因果（虚构因果）。比对重点查时间词（初、后、已而）、事件有无与因果词。","tip":"比对时圈时间词与因果词，时序因果是重灾区。"},"3|4|k|0":{"explain":"读诗先读三件套：标题定题材（送别怀古边塞），作者定风格身世（知人论世），注释定背景（时间用典）。三件套读毕题材背景已明，情感基调先有预判。","example":"标题“送杜少府”即知送别，注释若注“被贬”则情感添悲慨。","tip":"拿到诗先读标题作者注释，再读诗句。"},"3|4|k|1":{"explain":"古诗情感有常用谱系：忧国忧民、怀才不遇、思乡怀人、隐逸闲适、离别伤时。把握情感先对谱系定位，再结合具体诗句细化（为什么、程度如何）。","example":"杜甫“感时花溅泪”属忧国忧民，王维“空山新雨后”属隐逸闲适。","tip":"情感题先对谱系定位，再引诗句细化。"},"3|4|k|2":{"explain":"表达技巧分三层记忆：抒情方式（直抒借景托物用典）、描写手法（动静虚实感官白描衬托）、修辞手法（比喻拟人夸张对偶）。答题先定层再点手法分析效果。","example":"“鸟鸣山更幽”动静结合是描写手法。","tip":"技巧题先分清层次，抒情描写修辞三层勿混。"},"3|4|k|3":{"explain":"语言风格是整体印象：豪放（境界阔大）、婉约（含蓄细腻）、沉郁（深沉抑郁）、清新（自然明快）、平淡（质朴冲和）、典雅（辞采工丽）。判断看意象大小、用词色彩。","example":"“大江东去”豪放，“采菊东篱下”平淡。","tip":"风格题先给风格词再引诗句印证。"},"3|4|k|4":{"explain":"诗歌五大题型各有套路：炼字炼句（字义画面手法情感）、意境（意象氛围情感）、情感（分层作答）、手法（名称分析效果）、比较（同中求异）。先判题型再套框架。","tip":"先判题型再套框架，五大套路考前默写一遍。","example":"炼字题“春风又绿”先释义再绘图，意境题“大漠孤烟直”先列意象再概括氛围，题型套框架。"},"3|4|d|0":{"explain":"复杂情感要分层拆解：逐句逐联提取情感点，再结合注释背景理解深层，最后按主次排列作答。复杂诗常情感交织：豪放中有悲慨，闲适中有愤激。","example":"杜甫《登高》有漂泊之悲、老病之痛，还有忧国伤时之慨。","tip":"复杂情感逐联提取再整合，每条附诗句依据。"},"3|4|d|1":{"explain":"易混术语要辨析：借景抒情强调借景的主动性，寓情于景强调情融景中的含蓄；衬托有主次，对比无主次。辨析看有无主次与情景关系。","example":"“以乐景写哀情”是衬托；“朱门酒肉臭，路有冻死骨”是对比。","tip":"术语辨析看主次：有主次是衬托，无主次是对比。"},"3|4|d|2":{"explain":"意象的约定义随语境变化：同是“月”，团圆时可思乡，清冷时可怀古。答题必须语境优先：先看本诗意象的修饰语与组合方式，再定内涵，模板只作参考。","example":"“月落乌啼霜满天”的月是羁旅之愁，“海上生明月”的月是相思之寄。","tip":"意象题先看语境再定内涵，模板义只作参考。"},"3|4|e|0":{"explain":"诗歌选择题三大设错：手法误判（说错名称）、情感拔高（浅情说深）、景物特征曲解（改换特征）。解题逐项回诗验证：手法对号、情感对度、景物对特征。","tip":"诗歌选择题逐项回诗核对，手法情感特征三处最易设错。"},"3|4|e|1":{"explain":"炼字题四评分点：释字义（含词性活用）、绘画面（字在句中的情境）、点手法、言情感。四步齐全才得满分，答题顺序固定。","example":"“红杏枝头春意闹”的“闹”：字义热闹，画面红杏竞放，手法拟人，情感春意盎然。","tip":"炼字四步“义画法情”缺一不可。"},"3|4|e|2":{"explain":"诗评题给一段评价语让判断正误并说明理由。解题分两步：先整体把握诗歌风格情感，再逐句验证评价语——风格、手法、情感三方面对号。","tip":"诗评题先定全诗风格基调，再逐条核对评价语。"},"3|4|e|3":{"explain":"比较鉴赏常规比法：比意象（选材异同）、比情感（基调层次）、比风格（语言特色）、比手法（技巧运用）。答题分点对照：共同点先说，不同点分条，每点引双方诗句。","tip":"比较题双方都要引诗句，同异分列。"},"3|4|e|4":{"explain":"名句题把理解与默写结合：既考诗句含义，又考准确书写。易错集中在通假字（生通性）、异体字、形近字（须与需）。备考把名句按“含义＋写法”成对记忆。","tip":"默写名句一字一分，通假异体形近字专项过关。"},"3|5|k|0":{"explain":"高考默写范围是课标推荐60篇，背诵要有全局规划：按初高中双线推进，先熟读成诵再精确书写。60篇按题材或作者分类记忆，滚动复习防遗忘。","tip":"60篇制定背诵计划表，按主题分类滚动复习。","example":"把60篇按“劝学惜时”“思乡怀人”等主题分类，同类名句互证互记，背诵记忆效率更高。"},"3|5|k|1":{"explain":"高频篇目反复轮考，须全文背诵：文言篇目（劝学师说赤壁赋）与诗歌篇目（离骚登高琵琶行）。这些篇目名句多、易错字多，是默写复习的重中之重。","tip":"高频篇目全文背诵加逐字听写，重点盯易错字。","example":"《劝学》的“锲而不舍”、《登高》的“无边落木萧萧下”都是轮考高频句，须全文过关。"},"3|5|k|2":{"explain":"易错字三类分治：通假字（本字借字成对记）、形近字（锲与契、戌与戍）、易混虚词（而则之的位置）。建易错字本按类别收录，考前反复听写。","example":"“锲而不舍”的“锲”易写成“契”。","tip":"易错字分类建档，形近字对比记忆。"},"3|5|k|3":{"explain":"情境默写不给上下句，只给提示：关键意象或情感指向。解题抓提示语中的关键词（意象、情感、手法），再定位对应名句。理解性记忆比死记更可靠。","example":"提示“以登山喻治学”，应写“譬如为山，未成一篑”。","tip":"情境默写先圈提示语关键词，再定位诗句。"},"3|5|k|4":{"explain":"高效复习两招：按主题分类（惜时、劝学、思乡、咏志）与按作家归类，同主题名句互证易记；滚动默写（先背新篇定期复默旧篇）防遗忘。间隔重复是记忆规律。","tip":"背诵按主题作家分类，每周滚动复默旧篇。","example":"本周背诵《赤壁赋》新篇，下周复默《劝学》旧篇，新旧篇目滚动交替，可防止边背边忘。"},"3|5|d|0":{"explain":"默写失分主因在写错字：形近字（须与需）与通假字（本字借字）最易混。如“君子生非异也”中“生”通“性”。对策：每篇易错字单独标出，听写纠错。","example":"“善假于物也”的“假”易写“驾”。","tip":"默写后逐字检查易错字，通假字按原文书写。"},"3|5|d|1":{"explain":"情境默写张冠李戴的根源是提示理解偏差。对策：审提示语圈出所有限定（意象＋手法＋情感），再逐句核对备选诗句，三个限定都符合才写。","example":"提示“以比喻写学习能超越本原”，应写“青取之于蓝而青于蓝”。","tip":"情境题圈全限定条件，三条件全符才落笔。"},"3|5|d|2":{"explain":"生僻字是默写拦路虎：笔画多不常用（锱铢、踯躅、鼎铛）。对策：单独建表，拆解笔画记忆（左形右声、部件拆分），反复听写。理解字义助记。","tip":"生僻字拆部件记笔画，结合字义助记。","example":"“锱铢必较”的“锱铢”拆为金字旁加“留”“朱”，结合“微小重量”之义记忆更牢。"},"3|5|e|0":{"explain":"新高考默写以理解性为主：给情境提示，考生自主回忆诗句。这要求理解加记忆双保险：不仅会背，还要懂句意、手法与情感指向。备考做“句意＋提示词”卡片。","tip":"理解性默写靠句意提示卡片，背句同时背含义手法。"},"3|5|e|1":{"explain":"提示语常绕弯：不直接说诗句意思，而提示手法、意象组合或情感。陷阱在按字面找必错。对策：先破译提示语——它提示的是意象、手法还是情感，再定位。","example":"提示“以动静结合写春景”，应写“明月别枝惊鹊，清风半夜鸣蝉”。","tip":"提示语先破译考的是意象还是手法，勿按字面直找。"},"3|5|e|2":{"explain":"高频篇目反复轮考是规律：同一篇名句隔年再考、换角度再考。对策：高频篇目全文背诵，不只背名句，所有句子都要能默写。","tip":"高频篇目全文背诵，非名句也要能默写。"},"3|5|e|3":{"explain":"默写评分一字一分，错字别字皆不得分：笔画完整、结构端正、通假按原文。写完后逐字回读检查，尤其检查易错字。","tip":"默写写完逐字回读，书写要工整。"},"3|6|k|0":{"explain":"词语题两大块：实词近义辨析（看语素差异、搭配对象、轻重程度）与成语运用（意义、色彩、对象）。辨析步骤：先解本义，再对语境，最后查色彩对象。","example":"“简洁”重简明，“简捷”重直接迅速。","tip":"词语辨析先解义再对语境，色彩对象双重验证。"},"3|6|k|1":{"explain":"病句修改两原则：识别（六类框架判断）与修改（最小改动、不换原意）。修改按病类：语序不当调顺序，搭配不当换词语，成分残缺补成分，杂糅拆句式。改后必读验证。","tip":"修改坚持最小改动，改完通读确认原意未变。","example":"“通过努力，他取得了进步”无语病；“通过努力，使他有进步”缺主语，改删“使”字。"},"3|6|k|2":{"explain":"衔接三原则：话题一致（主语对象统一）、前后呼应（关键词句式标点呼应）、逻辑顺畅（时间空间事理顺序）。解题先找话题，再验顺序，最后看呼应。","tip":"衔接题先定话题再验逻辑顺序，代入后通读。","example":"“春天来了，草绿了，花开了”按时间与事理顺序排列，主语话题统一，句子才连贯。"},"3|6|k|3":{"explain":"补写考逻辑推断：常见逻辑有总分（总起或总结）、因果（原因或结果）、转折（相反方向）、递进（更进一步）。先定句位功能，再搜上下文关键词，按逻辑补写。","tip":"补写先定逻辑关系（总分因果转折），再组织语句。","example":"前句“读书有三到”，补写“谓心到、眼到、口到”，属总分逻辑，冒号还提示了句式。"},"3|6|k|4":{"explain":"修辞效果各有侧重：比喻化抽象为具体，比拟赋予生命，排比增强语势，夸张突出特征。答题“手法＋内容＋效果”三步，效果要具体（生动在哪、强调什么）。","example":"“像牛毛，像花针，像细丝”以排比加比喻写春雨细密。","tip":"修辞题三步“手法内容效果”，效果具体化。"},"3|6|k|5":{"explain":"表达六项要求是语言运用总纲：简明（无冗余）、连贯（衔接顺畅）、得体（合场合对象）、准确（表意精确）、鲜明（态度明朗）、生动（形象感染力）。答题按要求逐项自查。","tip":"语言运用题对照六项要求自查，简明得体准确最常考。","example":"写校园通知用简明书面语，与朋友聊天可口语化，场合与对象决定表达的得体分寸。"},"3|6|d|0":{"explain":"搭配不当难点在远距离搭配：主干相隔远或修饰语复杂，错误被掩盖。判断方法：压缩句子找主干，逐对检查搭配，再查修饰语与中心语。先主干后枝叶。","tip":"搭配判断先压缩主干再查修饰语，远近都验。","example":"“提高水平”搭配得当、“改善水平”则不当，压缩主干后，主谓宾的搭配问题立即显现。"},"3|6|d|1":{"explain":"补写除显性逻辑外还有隐形逻辑：对照（前后相反）、假设（如果那么）、条件（只有才）、目的（为了）。识别靠上下文关键词与标点。隐形逻辑是补写难点。","example":"前句“若只注重速度”，后句应补“就会忽视质量”。","tip":"补写留心“如果、只有、相反”等隐形逻辑词。"},"3|6|d|2":{"explain":"修辞效果四要素：手法、内容、情感、效果。只答生动形象是空话，须具体：把什么写得怎样、突出什么。四要素齐备才得满分。","example":"“叶子出水很高，像亭亭的舞女的裙”答：比喻写叶子的形态，写出亭亭玉立之美。","tip":"修辞效果按“手法内容情感效果”四步答全。"},"3|6|e|0":{"explain":"语段综合题把各类考点放进一个语段：成语、病句、衔接、补写同场考。应对：先通读语段把握大意，再按题逐一解决，注意题目间的相互关联。","tip":"综合题先通读全段再逐题做，注意上下文关联。"},"3|6|e|1":{"explain":"新考法要求具体分析比喻的相似性：本体与喻体在哪一点上相似（形状、颜色、动态、性质）。答题“本体喻体＋相似点＋表达效果”。","example":"“月光如流水”相似点在“泻”的动态与清亮。","tip":"相似性题必须点出具体相似点，只说“相似”不得分。"},"3|6|e|2":{"explain":"人称转换题考视角变化效果：我（真实亲切）、你（拉近距离便于抒情）、他（客观疏离）。转换人称常为调整情感距离。答题“人称＋效果＋转换目的”。","example":"文中由“我”转“你”，把读者拉入情境增强共鸣。","tip":"人称题答类型加效果，转换处点明变化。"},"3|6|e|3":{"explain":"标点作用考语境义：引号（引用、特殊含义、反语、强调）、破折号（解释、转折、递进、延长）、省略号（列举省略、语意未尽、沉默）。先定类型再选作用。","example":"“他是‘英雄’”——引号可表反语或强调，须看语境。","tip":"标点题先想全部作用再选语境义，反语与强调看语气。"},"3|6|e|4":{"explain":"压缩扩展题回归：下定义（被定义概念＋种差＋属概念，单句表述）、拟标题（概括核心＋吸引眼球）、概括语段（提取要点合并）。按题型套格式。","example":"下定义“人是能制造和使用工具的高等动物”，种差加属概念成单句。","tip":"下定义必用单句“……是……的……”，拟标题先抓核心。"},"3|7|k|0":{"explain":"审题四步防偏题：抓关键词（反复出现与核心概念）、理任务指令（写什么给谁）、辨情境（话题语境）、明文体（议论文、书信、演讲稿）。四步走完题意尽在掌握。","tip":"审题四步逐项落实，动笔前复述题意自检。","example":"材料谈“快与慢”，关键词是“节奏”，任务指令是“谈看法”，文体定为议论文，四步即明。"},"3|7|k|1":{"explain":"立意三级标准：准确（切合材料核心，保底）、深刻（透过现象见本质，加分）、新颖（角度独到，出彩）。顺序是先准确后深刻再新颖。","tip":"立意先求准确再求深刻，新颖须在材料射程内。","example":"同一材料，立意“慢是沉淀”比“要珍惜时间”更深刻，比“慢生活好”更为新颖独到。"},"3|7|k|2":{"explain":"议论文常用框架“引议联结”：引（引材料亮观点）、议（分析论证）、联（联系现实自身）、结（总结升华）。变体有递进式与对比式。选框架依题意。","tip":"结构选“引议联结”最稳妥，每部分功能明确。","example":"写“坚守”可用引议联结结构：引材料亮出观点，议坚守之因，联身边事例，结升华呼应。"},"3|7|k|3":{"explain":"素材运用三技巧：古今结合（历史人物配时代事例）、一材多用（同一素材多角度开掘）、叙议结合（叙述简括、议论点睛）。素材为论点服务，剪裁比堆砌重要。","example":"袁隆平之例可论证坚守、创新、民生情怀，一材三用。","tip":"素材叙述要简、议论要深，一材多用的角度提前开掘。"},"3|7|k|4":{"explain":"主体段规范五步：观点句（亮分论点）、阐释句（解释内涵）、事例句（典型论据）、分析句（扣题析例）、小结句（回扣总结）。五步成段论证完整。","tip":"每段五步齐全，观点先行小结收束。","example":"“自律是成长的基石。自律即自我约束。曾国藩日课自律成事。正因自律……可见自律之要。”五步俱全。"},"3|7|k|5":{"explain":"卷面是印象分：书写工整（字迹清楚）、段落分明（每段三至五行）、标点正确（点号占格规范）。卷面整洁可隐性提分。考前练字与规范书写。","tip":"卷面三查：字迹清楚、分段分明、标点规范。","example":"字迹潦草的作文，阅卷者难以辨认，卷面分受损，内容分也常被连带压低，卷面即门面。"},"3|7|d|0":{"explain":"立意两大偏差：就事论事（不上升提炼）与脱离材料（拔高太远）。正确做法是双向把握：从材料中提炼普遍道理，又让道理回扣材料。","tip":"立意后自问“道理从材料来吗、能回扣材料吗”。","example":"材料谈工匠精神，若只写“某师傅技艺高超”是就事论事，须提炼到“精益求精”的普遍价值。"},"3|7|d|1":{"explain":"以叙代议是议论大忌：叙事占篇幅说理缺席。突破：强化因果分析（为什么能成）与假设分析（若不如此会怎样）。叙是引子，议是主体。","example":"述袁隆平事迹后追问“正因心系苍生，方能扎根田野”。","tip":"例后必跟因果或假设分析，叙议比例二比八。"},"3|7|d|2":{"explain":"素材雷同让作文失彩。对策：建时代素材库——科技前沿、时代楷模、社会热点，与经典素材混用。新鲜素材是发展等级“丰富”的得分点。","tip":"每月积累两三个时代新素材，与经典搭配。","example":"论证“青年担当”，可举航天团队平均年龄三十岁的新鲜事例，替代千篇一律的古人素材。"},"3|7|e|0":{"explain":"高考作文评分60分构成：基础等级40分（内容20＋语言20）看切题中心内容语言；发展等级20分看深刻丰富文采创意。基础求稳，发展求亮。","tip":"先保基础等级（切题完整），再争发展等级（深刻文采）。"},"3|7|e|1":{"explain":"任务驱动型作文有明确指令：写信（格式与身份）、谈看法（观点与理由）、提建议（具体可行）、参与讨论（回应他人观点）。先确认任务类型再按格式内容回应。","tip":"任务驱动先圈任务指令，逐项回应，漏任务即偏题。"},"3|7|e|2":{"explain":"高考作文趋向时评思辨：给现实事件材料，考理性分析能力。应对：观点要鲜明，分析要理性（多角度有分寸），立场要有温度。时评重就事论理。","tip":"时评作文观点先行，理性有分寸，就事论理不空谈。"},"3|7|e|3":{"explain":"标题与开头决定第一印象：标题要亮观点又有文采（比喻对偶引用），开头要快速入题（引材料亮论点150字内）。首因效应下标题开头最值得花心思。","tip":"标题开头各花三五分钟打磨，观点加文采双赢。"},"3|7|e|4":{"explain":"四大硬伤直接降等：字数不足、偏题、套作、错别字过多。防范：字数留余量、审题走四步、内容自己写、书写多检查。","tip":"考场保底三件事：写足字数、扣紧题意、杜绝套作。"}},"math":{"0|0|k|0":{"explain":"集合三要素中互异性最实用：同一集合元素不能重复，含参元素求出后必须回代检验。元素与集合是「属于」关系，集合与集合才是「包含」关系，符号别混用。记忆口诀：确定、互异、无序三兄弟。","example":"已知集合A={1,a,a^2}，若a=1则元素重复舍去；a=-1时集合为{1,-1,1}仍重复，故a无解。关键在求出参数后回代验互异性。","tip":"求出参数必回代检验互异性，元素重复即舍去。"},"0|0|k|1":{"explain":"数集字母有来历：N是Natural自然数含0，N*去掉0；Z来自德语Zahlen整数，Q是Quotient即分数，R是Real实数。先看x属于哪个数集，范围不同答案不同。","example":"方程x^2=2在Q中无解，在R中有解x=±√2。数集决定解集，审题先圈出x∈后的字母再动笔。","tip":"N含0、N*不含0，数集不同答案可能不同。"},"0|0|k|2":{"explain":"A⊆B即「A中每个元素都在B中」，双向包含就是相等。空集是任何集合的子集、任何非空集合的真子集，讨论A⊆B时先想A是否为空。含n个元素的集合有2^n个子集、2^n-1个真子集。","example":"集合{1,2}的子集有∅、{1}、{2}、{1,2}共4个，其中真子集3个。求子集个数可直接用公式2^n验证。","tip":"空集是任何集合的子集，含参讨论勿忘A=∅情形。"},"0|0|k|3":{"explain":"交集取「公共部分」、并集取「全部合在一起去重」、补集是「全集中去掉A剩下的」。数轴上交集是重叠段、并集是覆盖范围，端点取等与否代入验证。口诀：交少并多。","example":"已知A={x|x大于1}，B={x|x≤3}，则A∩B={x|1小于x≤3}，A∪B=R。数轴一画便知，注意端点1不取、3取。","tip":"端点取等与否代入原式验证，数轴画实心空心点。"},"0|0|k|4":{"explain":"记法「小范围推大范围」：p能推出q说明p范围小或相同，p充分「够用」、q必要「缺它不行」。用集合看：p对应A、q对应B，A⊆B则p是q的充分条件，方向搞反是最大易错点。","example":"p：x大于2，q：x大于1。因{x|x大于2}⊆{x|x大于1}，故p是q的充分不必要条件。记住「小推大，充分不必要」。","tip":"充分看推出方向，必要时举反例验证。"},"0|0|k|5":{"explain":"否定规则像「翻牌子」：全称∀改成存在∃，量词换了结论也要否定。核心思想：否定「所有都成立」只需找到「一个不成立」的反例。先变量词、再否结论，两步缺一不可。","example":"命题「∀x∈R，x^2≥0」的否定是「∃x∈R，x^2小于0」。量词由∀变∃，结论由≥变小，两处都改了。","tip":"量词与结论必须同时否定，只改一处即为错。"},"0|0|d|0":{"explain":"含参集合两大坑：一是元素含参求出后须回代验互异性，重复即舍；二是A⊆B中A可能是空集，空集是任何集合的子集，必须先讨论A=∅再讨论非空，顺序不能乱。","example":"A={x|ax=1}，B={x|x^2-1=0}，A⊆B。先讨论a=0时A=∅符合；再a≠0时x=1/a∈B得a=±1。共3个答案。","tip":"见A⊆B先写A=∅情形；元素含参必回代验互异性。"},"0|0|d|1":{"explain":"把命题对应成集合就清楚：p的范围是A、q的范围是B，p⇒q等价于A⊆B。想清楚「p能推出q」说明满足p的对象都满足q，所以A小、B大。画数轴把两个集合标出来，谁包谁一目了然。","example":"p：|x|小于2即A=(-2,2)，q：x小于3即B=(-∞,3)，A⊆B，故p是q的充分不必要条件。","tip":"A⊆B时p充分q必要，方向别写反。"},"0|0|d|2":{"explain":"命题的否定只否定结论，不动条件；否命题则条件、结论都否定，两者完全不同。如「若p则q」的否定是「若p则非q」，否命题是「若非p则非q」。量词命题还要换量词。","example":"「若x大于1则x^2大于1」的否定是「若x大于1则x^2≤1」，否命题是「若x≤1则x^2≤1」，对比可见差异。","tip":"只否结论的是否定，条件结论都否的是否命题。"},"0|0|d|3":{"explain":"含参集合求参数范围时端点是关键：先用数轴画出大致范围，再把端点值单独代入原集合验证是否满足包含或运算关系。端点往往处于「恰好临界」位置，取等与不取等就在一念之间，必须逐一代入。","example":"A={x|x大于a}，B={x|x≥1}，A∩B=A则a≥1；a=1时A={x|x大于1}仍被B包含，取等成立。","tip":"端点值单独代入验证，先试取等再试不取等。"},"0|0|e|0":{"explain":"命题套路：先解一元二次或分式不等式得到集合，再考交并补。解题顺序固定：解不等式（注意分母不为0、二次项系数化正）→数轴画图→取交集并集补集。把解不等式练熟，这题就是送分题。","tip":"分式不等式移项通分，勿直接乘分母。"},"0|0|e|1":{"explain":"已知A⊆B或A∩B=∅等关系求参数，核心是数轴画图加端点讨论。先画出不含参数的集合，再移动含参集合看临界位置，最后验证端点取等。讨论中别忘空集与端点两个细节。","tip":"数轴分界处逐段讨论，端点代回验证。"},"0|0|e|2":{"explain":"考法：给出两个条件判断充要关系。思路：先分别求出两条件对应的集合或等价形式，再用集合包含判断方向，必要时举反例。核心是把条件翻译成数集比大小。","tip":"反例要简洁有力，一次反例即可否定充分性或必要性。"},"0|0|e|3":{"explain":"送分题但易失分：写法上「∀x∈M，p(x)」否定为「∃x∈M，非p(x)」，量词互换、结论否定、两处都要改。做题时先圈出量词，再圈结论，逐项核对。","tip":"检查时默念「量词换了、结论否了」两遍。"},"0|0|e|4":{"explain":"新定义题给你一个新符号或新规则，考的是「读懂规则→套用规则」。策略：先给规则举小例子验证，把抽象符号具体化，再按普通集合运算处理。本质考查阅读理解与类比迁移能力。","tip":"先举小例子理解新运算，再动笔计算。"},"0|1|k|0":{"explain":"求根公式由配方法推出：除以a后配方得(x+b/2a)^2=(b^2-4ac)/4a^2，开方即得。前提a≠0且判别式非负才有实根。记忆：负b加减根号下b方减4ac，整体除以2a。","example":"解2x^2-4x-6=0：a=2、b=-4、c=-6，Δ=16+48=64，x=(4±8)/4得x=3或x=-1。","tip":"先判Δ符号，Δ小于0直接写无实根。"},"0|1|k|1":{"explain":"判别式来自求根公式里的√(b^2-4ac)：根号内为正开方出两个不同值，为0两根重合，为负实数范围开方无意义。它是二次方程根的「体检报告」，恒成立、交点个数问题全靠它。","example":"x^2-2x+3=0中Δ=4-12=-8小于0，无实根，其图象与x轴无交点，恒在x轴上方。","tip":"用判别式先确认a≠0，二次项系数含参须讨论。"},"0|1|k|2":{"explain":"顶点式y=a(x-h)^2+k由配方法得到：h=-b/2a是对称轴，k是顶点纵坐标即最值。a为正开口向上取最小值，a为负开口向下取最大值。图象是抛物线，对称轴两侧单调性相反。","example":"y=x^2-4x+3配方得y=(x-2)^2-1，对称轴x=2，顶点(2,-1)，最小值-1。","tip":"配方提系数别漏项，顶点纵坐标即最值。"},"0|1|k|3":{"explain":"标准流程：①二次项系数化正（两边同乘-1要变号）；②因式分解求两根x1、x2；③画开口向上的抛物线草图；④大于0取两边、小于0取中间。口诀：大于取两边，小于取中间。","example":"解-x^2+x+2大于0：化正得x^2-x-2小于0，分解(x-2)(x+1)小于0，两根-1、2，取中间得-1小于x小于2。","tip":"系数化正要变号，两根大小排序别写反。"},"0|1|k|4":{"explain":"由(√a-√b)^2≥0展开得a+b≥2√ab，说明算术平均不小于几何平均。适用条件：一正二定三相等，等号能取到才是真最值。记忆：和定积最大，积定和最小。","example":"已知x大于0，求x+4/x最小值：x·4/x=4为定值，当x=4/x即x=2时取等，最小值为4。","tip":"取等条件必须验证，取不到等号则不能用。"},"0|1|k|5":{"explain":"思路：和是定值时积在相等处最大，积是定值时和在相等处最小。变形技巧：凑系数（2x凑成2x）、拆项（x拆成x/2+x/2）、常值代换（1=a+b代入）。三步检查缺一不可。","example":"x大于0，y大于0，x+y=1，求1/x+1/y最小值：代换得(x+y)/x+(x+y)/y=2+y/x+x/y≥4，当x=y=1/2时取等。","tip":"使用前验证一正二定三相等，勿忘取等条件。"},"0|1|d|0":{"explain":"含参不等式三处要讨论：①二次项系数是否为0及正负，决定是否一次式与开口方向；②判别式符号，决定有无根；③两根大小，决定取两边还是中间。按系数、判别式、根大小的顺序逐层分类。","example":"解ax^2-(a+1)x+1大于0：a=0时-x+1大于0；a≠0时分解(ax-1)(x-1)大于0，再按a与0、1/a与1的大小分类。","tip":"分类按层次进行，系数、判别式、根大小逐一讨论。"},"0|1|d|1":{"explain":"用基本不等式求出的「最值」只有在等号能取到时才是真最值。等号条件即两数相等，若相等点不在允许范围内结果就错了。对策：求出候选值后回头验证「等号成立时x是否存在」。","example":"x大于2求x+1/(x-2)最小值：拆项x-2+1/(x-2)+2，当x-2=1即x=3时取等，最小值为4，x=3满足x大于2，可行。","tip":"等号条件不满足时，改用单调性或图象求最值。"},"0|1|d|2":{"explain":"核心转化：f(x)≥a恒成立等价于a≤f(x)的最小值；能成立等价于a≤f(x)的最大值。恒成立「处处都行」取最小值，能成立「至少一处行」取最大值。分离参数后求新函数最值即可。","example":"x∈[1,3]时x^2-2x+a≥0恒成立：分离得a≥-(x^2-2x)，右式在x=1取最大1，故a≥1。","tip":"恒成立看最小、能成立看最大，方向别反。"},"0|1|d|3":{"explain":"三个二次同源：函数图象与x轴交点横坐标即方程的根，图象在x轴上方的部分即不等式大于0的解集。解题以图象为桥梁：画草图定根、判正负、看区间。","example":"已知不等式ax^2+bx+c大于0的解集为(1,3)，则方程ax^2+bx+c=0的根为1和3，且a小于0。","tip":"解集端点必是方程的根，由解集反推系数。"},"0|1|e|0":{"explain":"必考送分点但载体多变：可能让你解不等式求集合，可能求对数函数定义域（真数大于0解不等式）。核心能力是解不等式的准确率与速度，一次算对不返工。","tip":"求定义域时多个限制条件取交集。"},"0|1|e|1":{"explain":"小题常直接考「积定和最小」「和定积最大」；解答题常与三角函数、解三角形结合，如求面积或周长最值。熟练凑、拆、换的技巧，注意取等条件书写规范。","tip":"三个条件一正二定三相等，写最值前先验证取等。"},"0|1|e|2":{"explain":"压轴套路：f(x)含参且要求恒成立，先分离参数a≥g(x)或a≤g(x)，再求g(x)最值（可能用导数）。难点在求最值时对g(x)的分析，常需分类讨论。","tip":"分离后注意x定义域，最值点可能取不到。"},"0|1|e|3":{"explain":"考法：给出解集反求系数、给出图象判断系数符号、结合单调性求范围等。总思路：根、交点、零点三者互通，图象正负与不等式解集对应，画图分析最直观。","tip":"图象与x轴交点横坐标即根，开口定正负区间。"},"0|2|k|0":{"explain":"函数是「输入x→规则f→输出y」的机器：定义域是允许输入的范围，对应关系是运算规则，值域是输出的集合。判断两函数是否同一：定义域和对应关系都相同才相同，值域由前两者决定不用单查。","example":"f(x)=x与g(x)=(√x)^2不同：f定义域R，g定义域x≥0，定义域不同故不是同一函数。","tip":"同一函数比定义域与对应关系，两处都要看。"},"0|2|k|1":{"explain":"用「任意」二字强调：增函数要求在定义域区间内任取两点，自变量大函数值就大。注意单调性是区间上的局部性质，不是点上的。判断方法：定义法作差、图象法看走势、导数法看符号。","example":"证f(x)=x^2在[0,+∞)递增：取0≤x1小于x2，作差f(x2)-f(x1)=(x2-x1)(x2+x1)大于0，故递增。","tip":"「任意」不可换成「存在」；单调区间内不能有断点。"},"0|2|k|2":{"explain":"先验定义域：不关于原点对称直接排除奇偶性。再验证f(-x)与f(x)：相等为偶，图象关于y轴对称；互为相反数为奇，图象关于原点对称。奇函数若过原点必有f(0)=0。","example":"f(x)=x^3，定义域R对称，f(-x)=(-x)^3=-x^3=-f(x)，为奇函数，且f(0)=0。","tip":"判断奇偶性第一步看定义域是否关于原点对称。"},"0|2|k|3":{"explain":"复合函数y=f(g(x))的单调性遵循「同增异减」：内层与外层单调性相同则整体递增，相异则整体递减。原理是变化方向的一致传递，就像负负得正。求单调区间前必须先求复合函数定义域。","example":"y=log2(x^2-4x+3)，外层增，内层x^2-4x+3在(-∞,1)递减，故该区间上复合函数递减。","tip":"先求复合函数定义域，再逐层判断单调区间。"},"0|2|k|4":{"explain":"求最值方法随函数类型而变：能画图的用图象看高低点；单调函数在端点处取最值；能配方的配成顶点式；形如x+1/x用基本不等式。无论哪种方法，最后检查端点是否在定义域内、等号能否取到。","example":"f(x)=2x-1在[0,3]递增，故最小值f(0)=-1、最大值f(3)=5，直接看单调性即可。","tip":"端点不在定义域内时最值取不到，改用开区间描述。"},"0|2|k|5":{"explain":"周期函数图象像「复印机」：平移T个单位后与原图完全重合。若T是周期则kT也是，最小正周期是最小正数。常考：f(x+a)=-f(x)或1/f(x)时周期都是2a。","example":"f(x+2)=f(x)恒成立，则f(5)=f(1)。周期为2，把自变量往已知区间内「搬」即可。","tip":"周期对定义域内一切x成立，求值先往已知区间搬。"},"0|2|d|0":{"explain":"抽象函数只有性质没有式子，如f(x+y)=f(x)+f(y)。策略：赋值法令x=0、y=0、x=y挖出f(0)、f(1)；再套用奇偶、单调、周期定义验证；必要时构造函数模型猜想。","example":"f(x+y)=f(x)+f(y)且f(1)=2，求f(3)：f(2)=f(1)+f(1)=4，f(3)=f(2)+f(1)=6。","tip":"赋值法先取0、1、-1等特殊值，再找规律。"},"0|2|d|1":{"explain":"双性质题套路固定：先用奇偶性把f(-x)变成±f(x)，把自变量「翻到同一侧」；再用单调性比较大小或脱掉f符号解不等式。注意奇函数解不等式时要小心符号变化。","example":"f(x)为R上奇函数且递增，解f(x-1)小于f(2)：由单调性得x-1小于2，x小于3。","tip":"用单调性「脱f」时，确认自变量在定义域内且单调区间正确。"},"0|2|d|2":{"explain":"分段函数整体单调要满足「双条件」：①每一段内部单调且方向一致；②分界点处左段函数值不大于（增时）或不小于（减时）右段函数值。第二条件最易漏，求参时常因只做第一条件而错。","example":"f(x)={ax+1, x≤1; x^2, x大于1}在R递增：需a大于0且a+1≤1，得a≤0与a大于0矛盾，无解。","tip":"分界点处必代入比较，左右函数值要衔接。"},"0|2|d|3":{"explain":"方法选择看结构：二次型配方；含根式换元令t=√(ax+b)；分式型分离常数，如(2x+1)/(x-1)=2+3/(x-1)；二次分式用判别式法。选对方法省一半时间。","example":"求y=(x^2+1)/(x^2-1)值域：分离常数得y=1+2/(x^2-1)，由x^2-1的范围推得值域为(-∞,-1]∪(1,+∞)。","tip":"换元后新元的取值范围是隐含条件，勿忘。"},"0|2|e|0":{"explain":"求定义域就是「找限制条件取交集」：分母不为0、偶次根号内不小于0、对数真数大于0、底数大于0且不为1、0次幂底数不为0。多个条件列不等式组解交集。","tip":"定义域优先原则，任何函数题先求定义域。"},"0|2|e|1":{"explain":"判断单调性优先用定义或导数；判断奇偶性先看定义域对称性再看f(-x)关系。小题常考「已知性质推结论」：奇函数f(0)=0、偶函数在对称区间最值相等、奇函数在对称区间单调性相同。","tip":"定义域不对称直接判非奇非偶，省时。"},"0|2|e|2":{"explain":"比较大小三步：判断函数单调性→把自变量化到同一单调区间→由自变量大小推函数值大小。指数对数比较还常用中间值0、1搭桥。","tip":"化到同一单调区间再比，勿跨区间直接比。"},"0|2|e|3":{"explain":"图象变换规律：f(x+a)左加右减、f(x)+b上加下减、f(-x)关于y轴对称、-f(x)关于x轴对称、f(|x|)保右翻左、|f(x)|保上翻下。检验技巧：代入特殊点核对。","tip":"平移口诀「左加右减」只对x本身操作。"},"0|2|e|4":{"explain":"压轴套路：给含抽象函数的关系式，如f(x+2)=-f(x)，推周期再结合奇偶性求值。熟记周期结论：f(x+a)=f(x-a)周期2a；f(x+a)=-f(x)周期2a。","tip":"周期结论背熟，求值先搬自变量到已知区间。"},"0|3|k|0":{"explain":"幂的法则本质是「乘法变加法」：同底数幂相乘指数相加，由a^m的定义即可推出。a^0=1是规定，保证a^m除以a^m自洽；a^(-n)是倒数定义，让法则对负数也成立。","example":"化简2^3·2^(-5)=2^(-2)=1/4；(a^2·b^3)^2=a^4·b^6。","tip":"底数不同不能直接用指数加减，先化同底。"},"0|3|k|1":{"explain":"指数函数图象恒过(0,1)，因为a^0=1。底数大于1时递增且越涨越快，底数在0到1之间时递减。图象全在x轴上方，值域为(0,+∞)。记住：底数大递增、底数小递减。","example":"比较2^0.5与2^1.3：底数2大于1函数递增，0.5小于1.3故2^0.5小于2^1.3。","tip":"底数a恒大于0，图象不过原点不过x轴。"},"0|3|k|2":{"explain":"对数是指数的「逆运算」：问「a的几次方等于N」，答案就是log_a N。互化口诀：底数a不变，指数x与真数N互换位置。记忆「log就像问指数」。注意真数N必须大于0，这是硬性限制。","example":"2^3=8⇔log2 8=3；log3 81=4⇔3^4=81。互化时底数始终是底数。","tip":"真数必须大于0，对数式才有意义。"},"0|3|k|3":{"explain":"对数把「乘除变加减」：积的对数等于对数的和，由指数加法反推。换底公式推导：设log_a b=x则a^x=b，两边取log_c得x·log_c a=log_c b。","example":"log2 6+log2 3=log2 18；log8 4=log2 4/log2 8=2/3。","tip":"换底注意分子分母对应：真数在上、底数在下。"},"0|3|k|4":{"explain":"反函数即「x与y互换」：指数y=a^x与对数y=log_a x同式互化，图象关于y=x对称，对数过(1,0)、指数过(0,1)。单调性与指数相同，对数定义域(0,+∞)、值域R。","example":"y=2^x与y=log2 x互为反函数，图象关于y=x对称，点(0,1)与(1,0)互相对应。","tip":"对数函数定义域(0,+∞)，真数部分整体要大于0。"},"0|3|k|5":{"explain":"比较大小三招：①同底比指数或真数，直接用单调性；②同指数比底数，看图象高低；③全不同，找0、1搭桥（大于1的放一堆、0到1放一堆、负数放一堆），或用换底公式化同底。","example":"比较2^0.3与0.3^2：2^0.3大于1，0.3^2小于1，故2^0.3大于0.3^2。","tip":"以0、1为界分组比较，负数别忘了。"},"0|3|d|0":{"explain":"全不同时先粗分：大于1、等于1、0到1、小于0四堆，同堆内再细比。细比手段：换底公式化同底、取中间值、构造同构函数把结构相同的写成f(x)形式比单调性。同构是近年压轴热点。","example":"比较log2 3与log3 5：换底后作差或构造函数y=log_x(x+1)研究其单调性判断。","tip":"同构函数先看结构是否一致，再判单调方向。"},"0|3|d|1":{"explain":"复合指对函数（如y=log_a(x^2-2x-3)）先求定义域，再分层分析：内层二次函数的单调区间要配合外层对数的增减性（同增异减），值域要结合内层能取到的范围。","example":"求y=log2(x^2-2x-3)的单调递增区间：先求定义域x小于-1或x大于3，内层在(3,+∞)递增，外层对数递增，同增异减得递增区间为(3,+∞)。","tip":"定义域是分析复合函数的第一道门，先求再析。"},"0|3|d|2":{"explain":"底数a不确定时单调方向未知：解a^x大于a^b或log_a x大于log_a b时，底数大于1不等号不变，底数在0到1之间要变号。见到含参底数，先分类讨论再解。","example":"解log_a x大于log_a 2：a大于1时x大于2；0小于a小于1时x小于2，再结合真数x大于0得0小于x小于2。","tip":"底数含参先分类，变号别忘了真数大于0。"},"0|3|d|3":{"explain":"log_a N中真数N大于0是「底线」。解对数方程、不等式、求定义域时，每一步变换都要守住真数大于0，例如log2(x-1)有意义须x大于1，解出x后要回代验证。","example":"解log2(x-1)=3得x-1=8即x=9，回代x-1=8大于0成立。若算出x≤1的根须舍去。","tip":"对数方程解完必回代验真数正负。"},"0|3|e|0":{"explain":"对数恒等式a^(log_a N)=N（即「a的log_a N次方等于N」）是「指数对数互消」的核心工具，化简求值常用。换底公式用于化不同底为同底。这两个公式是运算题的两把钥匙。","tip":"换底时选好新底（常用10或e），结果可约分。"},"0|3|e|1":{"explain":"定点问题：y=a^x恒过(0,1)，y=log_a x恒过(1,0)，含参数平移后定点也跟着移（如y=a^(x-1)+2过(1,3)）。单调区间与值域要结合定义域与图象分析。","tip":"求定点就是「令指数为0或真数为1」，消去参数。"},"0|3|e|2":{"explain":"压轴比较大小常给三个数（如e^0.1、ln1.1、0.1）构造同构：把结构相同的写成同一函数不同自变量，用导数判断单调性后比较。核心是识别结构、构造函数。","tip":"识别同构结构，构造函数后先证单调性再比大小。"},"0|3|e|3":{"explain":"应用模型两类：指数增长（人口、复利：N=N0(1+r)^t）与指数衰减（半衰期：N=N0·(1/2)^(t/T)）。解题：把题中数据代入模型，解指数方程（取对数）求时间或参数。","tip":"应用题先设未知数列模型式，再取对数求解。"},"0|3|e|4":{"explain":"零点个数=图象与x轴交点个数=方程f(x)=0的根的个数。指对混合方程不会解时，变形为「两个熟悉函数图象的交点个数」，数形结合数交点。","tip":"变形时优先拆成一边指对一边简单函数，好画图。"},"0|4|k|0":{"explain":"弧度制用「弧长与半径之比」度量角：整圆周弧长2πr对应2π弧度，故360°=2π，即180°=π。扇形弧长按比例推得l=αr，面积S=1/2·αr^2=1/2·lr。","example":"60°=π/3；半径2、圆心角π/3的扇形弧长l=2·π/3=2π/3，面积S=1/2·2·2π/3=2π/3。","tip":"弧度制公式中α必须是弧度，角度要先化弧度。"},"0|4|k|1":{"explain":"在终边上任取点P(x,y)，r为P到原点距离，则sin=y/r、cos=x/r、tan=y/x。各象限正负由x、y符号决定：一全正、二正弦、三正切、四余弦。","example":"终边过点(-3,4)，r=5，则sinα=4/5、cosα=-3/5、tanα=-4/3。第二象限sin正cos负。","tip":"用终边上点求函数值时，注意该点象限定正负。"},"0|4|k|2":{"explain":"sin^2α+cos^2α=1由勾股定理r^2=x^2+y^2除以r^2得到，是三角第一恒等式。知sinα求cosα时开方有正负两个值，符号由α所在象限决定——这是最常丢分处。","example":"sinα=3/5且α为第二象限角，则cosα=-4/5（第二象限cos为负），tanα=-3/4。","tip":"开方取正负看象限，题目给象限才敢定号。"},"0|4|k|3":{"explain":"口诀拆解：「奇变偶不变」指k为奇数函数名变（sin变cos等）、k为偶数函数名不变；「符号看象限」指把α当锐角，看k·π/2±α所在象限定符号。任意角都能用诱导公式化到锐角。","example":"sin(π+α)：k=2为偶数名不变，π+α在第三象限sin为负，故sin(π+α)=-sinα。","tip":"符号看「原函数在对应象限的符号」，α一律当锐角。"},"0|4|k|4":{"explain":"y=sin x图象是波浪线：定义域R、值域[-1,1]、周期2π；递增区间[-π/2+2kπ, π/2+2kπ]，对称轴x=π/2+kπ过最值点，对称中心(kπ,0)。","example":"求sin x在[0,2π]的递增区间：结合图象得[0,π/2]∪[3π/2,2π]。","tip":"对称轴处取最值、对称中心处值为0，可用来检验。"},"0|4|k|5":{"explain":"五点法取一个周期内五个关键点：起点、最高点、平衡点、最低点、终点（正弦取0、π/2、π、3π/2、2π五点）。光滑连线即得图象。画图后单调、最值、对称性都从图上「读」出来。","example":"作y=sin x在[0,2π]图象：取(0,0)、(π/2,1)、(π,0)、(3π/2,-1)、(2π,0)五点连线。","tip":"列表五点再连线，曲线要过最高最低点。"},"0|4|k|6":{"explain":"记忆口诀「赛考考赛，考考赛赛」：sin是sin cos加cos sin，符号相同；cos是cos cos减sin sin，符号相反。它是三角恒等变换的总源头。","example":"sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√6+√2)/4。","tip":"cos公式中间是减号，符号与括号内相反。"},"0|4|d|0":{"explain":"由(sinα+cosα)^2=1+2sinαcosα，知道和就能求积；知道积再求sinα-cosα时开方取正负，符号由α象限或与1的大小关系判定。链条是「和→积→差」，环环要定号。","example":"sinα+cosα=1/2，平方得1+2sinαcosα=1/4，故sinαcosα=-3/8。","tip":"开方定号看象限；sinαcosα小于0说明α在二四象限。"},"0|4|d|1":{"explain":"化简任意三角函数：先把角化成k·π/2±α形式，k奇偶定名变不变，再把α视为锐角判断象限定符号。符号判断错了结果全错，所以每步写完自查「函数名变了没、符号对不对」。","example":"cos(3π/2+α)：k=3为奇数名变cos→sin，3π/2+α在第四象限cos为正，故cos(3π/2+α)=sinα。","tip":"三步走：k定名、象限定号、α当锐角。"},"0|4|d|2":{"explain":"变换顺序影响相位：先平移φ个单位再伸缩1/ω，平移量是φ；先伸缩再平移，平移量是φ/ω。因为「平移是对x本身操作」，伸缩后再平移相位被压缩了。建议固定一种顺序练习。","example":"由y=sin2x到y=sin(2x+π/3)，把x换成x+π/6即左移π/6（因为2(x+π/6)=2x+π/3）。","tip":"平移量看「x的变化量」，先变形为y=sin[ω(x+φ/ω)]再操作。"},"0|4|d|3":{"explain":"流程：用辅助角或二倍角把式子化为单一正弦型，令t=ωx+φ，由x范围求t范围，再结合正弦图象求值域。定义域限制使t的范围可能不是整周期，必须用图象看。","example":"x∈[0,π/2]时y=sin(2x-π/6)：2x-π/6∈[-π/6,5π/6]，值域[-1/2,1]。","tip":"先求t=ωx+φ的范围再画图取值域，勿直接套[-1,1]。"},"0|4|e|0":{"explain":"小题套路：给sin或cos及象限，用sin^2+cos^2=1求另一个；或给tan用「齐次式」技巧（分式上下同除cos）求值。诱导公式负责把复杂角化锐角。","tip":"齐次式上下同除cos^n，tan值直接代入。"},"0|4|e|1":{"explain":"对y=Asin(ωx+φ)求单调区间：令t=ωx+φ，由t落在sin的递增区间解出x。对称轴：t=π/2+kπ解x；对称中心：t=kπ解x。整体代换是核心，勿对x直接套公式。","example":"求y=sin(2x+π/3)对称轴：2x+π/3=π/2+kπ，x=π/12+kπ/2。","tip":"整体代换后解不等式，k∈Z别忘了写。"},"0|4|e|2":{"explain":"由图象求A、ω、φ：A看振幅（最高减最低除以2）；ω由周期T=2π/ω，T看图（相邻平衡点距离）；φ用「五点法」代入特殊点（最值点或零点）解出。注意φ常取绝对值不超过π的角。","example":"图象最高点1最低点-1，周期π，过(0,1)，则A=1，ω=2，φ=π/2（sin(2·0+φ)=1）。","tip":"求φ代特殊点，最值点比零点更好确定。"},"0|4|e|3":{"explain":"解答题第一问常是化简：观察式子结构，先用二倍角公式降幂（cos2x=1-2sin^2x等），再用辅助角公式化为Asin(ωx+φ)+b，为后面求单调性、值域做铺垫。","tip":"降幂升角、升幂降角，目标单一三角函数。"},"1|0|k|0":{"explain":"三角形法则：首尾相接，和向量从起点指向终点；平行四边形法则：共起点作平行四边形，对角线为和。减法「共起点连终点指向被减」，数乘λa改变长度，λ为负时反向。","example":"化简AB+BC+CD=AD：首尾相接，和向量直接由起点指向终点，即「抄起点终点」，连续加多个向量同样处理。","tip":"减法记住「共起点，连终点，指向被减」。"},"1|0|k|1":{"explain":"共线即方向相同或相反（含零向量特例）。判定：存在实数λ使a=λb，坐标形式x1y2-x2y1=0。三点共线：证明AB=λAC即A、B、C共线。","example":"A(1,2)、B(3,4)、C(5,6)，AB=(2,2)，AC=(4,4)=2·AB，故三点共线。","tip":"共线证法：找公共点出发的两向量成倍数关系。"},"1|0|k|2":{"explain":"不共线的两个向量e1、e2像「坐标轴」，平面内任何向量a都能唯一写成a=λ1e1+λ2e2。唯一性保证「系数相等」可用于列方程解参数。基底选择要「不共线」是关键。","example":"已知a=2e1+e2，b=e1-3e2，则a+b=3e1-2e2（对应系数分别相加）。","tip":"基底不共线是前提，表示唯一才能列等式。"},"1|0|k|3":{"explain":"数量积a·b=|a||b|cosθ，坐标式x1x2+y1y2。用于求模|a|^2=a·a、夹角cosθ=(a·b)/(|a||b|)、垂直a·b=0、投影|a|cosθ。","example":"a=(1,2)、b=(3,4)，a·b=3+8=11，|a|=√5，|b|=5，cosθ=11/(5√5)。","tip":"a·b=0是垂直充要条件，0向量与任何向量垂直。"},"1|0|k|4":{"explain":"正弦定理说「边与对角正弦之比为常数2R」，由外接圆中「同弧所对圆周角」与直径关系可证。用处：已知两角一边求边、已知两边一对角求角（可能两解）、边角互化（a=2RsinA）。","example":"A=30°、B=45°、a=2，由a/sinA=b/sinB得b=2·sin45°/sin30°=2√2。","tip":"已知两边一对角用正弦定理求角时，注意检验是否有两解。"},"1|0|k|5":{"explain":"余弦定理是勾股定理的推广：a^2=b^2+c^2-2bc·cosA，A=90°时退化为勾股定理。变形可得cosA的表达式，用于已知两边夹角求第三边、已知三边求角。","example":"b=3、c=4、A=60°，a^2=9+16-2·3·4·1/2=13，a=√13。","tip":"用余弦定理求角时先判角的范围，大边对大角。"},"1|0|d|0":{"explain":"求|a+b|没有直接公式，但平方后展开：|a+b|^2=|a|^2+2a·b+|b|^2，再开方。这是「模转数量积」的标准手法，模、夹角、数量积互相转化都靠它。","example":"|a|=2、|b|=3、夹角60°，|a+b|^2=4+2·2·3·1/2+9=19，|a+b|=√19。","tip":"模的平方是数量积，算完开方取正值。"},"1|0|d|1":{"explain":"已知a、b和A，正弦定理算sinB后：若sinB小于1可能有两角（B和π-B），两解是否都成立要看是否满足A+B小于180°及大边对大角。对策：先算sinB，再逐一检验内角和。","example":"a=2、b=√2、A=45°：sinB=1/2，B=30°或150°，150°时A+B大于180°舍去，只有一解。","tip":"边边角问题画图判断解数，或用内角和检验。"},"1|0|d|2":{"explain":"判断形状两大路线：①角化边，如a^2+b^2=c^2为直角、大于c^2为锐角；②边化角，sinA=sinB则A=B或互补。结论要说全：等腰、直角、等边还是等腰直角。","example":"若a^2=b^2+c^2-bc，由余弦定理cosA=1/2得A=60°，为含60°角的三角形。","tip":"结论要写完整，等腰+直角=等腰直角三角形，别只写一半。"},"1|0|d|3":{"explain":"最值问题套路：把目标式（如a·b、|a+tb|）表示成「参数的函数」：或用坐标设参数，或用数量积定义展开，然后求函数最值（基本不等式或三角函数值域）。","example":"a=(1,2)固定，|b|=1，求a·b最大值：a·b=|a||b|cosθ=√5cosθ，当cosθ=1即b与a同向时取最大值√5。","tip":"先设变量建立目标函数，再选最值工具。"},"1|0|e|0":{"explain":"小题考运算速度：a·b=x1x2+y1y2，模|a|=√(x^2+y^2)，垂直x1x2+y1y2=0，平行x1y2-x2y1=0。四件事的坐标条件背熟，直接套用。","tip":"平行用交叉相乘相等，垂直用对应相乘相加为0。"},"1|0|e|1":{"explain":"解答题固定流程：读题确定已知边角→选定理（两边一夹角用余弦、两角一边用正弦）→求边求角→用S=1/2bc·sinA求面积。面积公式三种写法选已知角对应的那个。","tip":"面积公式要选「夹角」对应的两边，勿用对边。"},"1|0|e|2":{"explain":"最值问题主流解法「边化角」：用正弦定理把边写成2RsinA，目标式化为三角式，用辅助角公式合一后求值域。注意角的范围由三角形内角限制（如A+B固定则A有范围）。","example":"A=60°，求b+c最值：边化角b+c=2R(sinB+sinC)，结合B+C=120°化为单一角函数求最值。","tip":"边化角后别忘角的取值范围，最值要在范围内取。"},"1|0|e|3":{"explain":"交汇题：给向量等式（如m·n=0或|m|=|n|），展开成三角关系式，再用正弦余弦定理转成边角。本质是「向量是外壳，三角是内核」。","tip":"先展开向量式，再识别三角结构。"},"1|1|k|0":{"explain":"引入i使x^2=-1有解：i^2=-1，复数z=a+bi中a是实部、b是虚部（注意虚部是b不是bi）。b≠0且a=0时为纯虚数。复数集是实数集的扩展，实数是b=0的特殊复数。","example":"z=3-2i的实部3、虚部-2；z=2i是纯虚数，因为实部为0且虚部为2；实数是虚部为0的复数。","tip":"虚部不带i；纯虚数要求实部0且虚部非0。"},"1|1|k|1":{"explain":"复数相等即「实部=实部、虚部=虚部」，像向量坐标对应。求参数时把等式两边都化成a+bi形式（含i的项合并），再列实部虚部两个方程。","example":"(x+y)+(x-y)i=2+0i：实部相等、虚部相等，列方程组x+y=2且x-y=0，解得x=y=1。","tip":"先合并i的系数，再列实虚部方程。"},"1|1|k|2":{"explain":"除法核心是「分母实数化」：分母乘共轭c-di变实数c^2+d^2，分子同步乘再化简成a+bi。乘法按多项式展开用i^2=-1化简。i的幂有周期：i^4n=1、i^(4n+1)=i。","example":"(1+i)/(1-i)=((1+i)^2)/((1-i)(1+i))=(2i)/2=i。","tip":"除法结果务必化成a+bi形式，检查i^2=-1是否全部化简。"},"1|1|k|3":{"explain":"模是复平面上点到原点距离，由勾股定理|z|=√(a^2+b^2)。模的运算性质与绝对值类似：积的模等于模的积、商的模等于模的商，可用这些性质简化计算（先取模再乘除）。","example":"|2+3i|=√(4+9)=√13；|(1+i)(2-i)|=|1+i||2-i|=√2·√5=√10。","tip":"先取模再运算可简化计算，模恒为非负数。"},"1|1|k|4":{"explain":"复数a+bi对应复平面点(a,b)，实部是横坐标、虚部是纵坐标，模是到原点距离。共轭a-bi与a+bi关于实轴对称。|z-z0|表示z到z0对应点的距离，是轨迹与最值问题的钥匙。","example":"|z-1|=2表示z到点(1,0)距离为2，轨迹是以(1,0)为圆心半径2的圆。","tip":"|z-z0|是距离公式，几何意义优先想圆与距离。"},"1|1|d|0":{"explain":"分母实数化时共轭的符号是易错点：c+di的共轭是c-di，分子也要同步乘。展开分子时i^2=-1别漏，最后结果整理成「实数+实数·i」的标准形式才算完。","example":"(2+i)/(1-2i)=(2+i)(1+2i)/(1+4)=(2+4i+i+2i^2)/5=(5i)/5=i。","tip":"共轭只改虚部符号；展开后及时用i^2=-1化简。"},"1|1|d|1":{"explain":"|z-z0|=r表示圆，求|z|最值即求圆上点到原点距离最值：最大值=圆心距+r，最小值=|圆心距-r|。数形结合把代数问题几何化是核心思路。","example":"|z-2i|=1，则|z|最大=2+1=3（圆心(0,2)到原点距2加半径1），最小=2-1=1。","tip":"先写圆心与半径，最值是「距离±半径」。"},"1|1|d|2":{"explain":"纯虚数要同时满足两个条件：实部a=0且虚部b≠0。求参数时列两个方程（或不等式），缺一不可。常与「z为实数」（虚部为0）对比出题。","example":"z=(a-1)+(a^2-1)i为纯虚数，则a-1=0且a^2-1≠0，得a=1且a≠±1，无解。","tip":"纯虚数双条件：实部0、虚部非0，两个都要验。"},"1|1|e|0":{"explain":"复数运算基本是送分题：熟练加减乘除、i的幂周期（i^1=i、i^2=-1、i^3=-i、i^4=1，每4个循环）。i的高次幂先除以4看余数。","example":"i^2023=i^(4·505+3)=i^3=-i：指数除以4看余数，余3对应i^3=-i，秒算高次幂。","tip":"i的幂看指数除4的余数：余1为i、余2为-1、余3为-i、余0为1。"},"1|1|e|1":{"explain":"考法：给复数关系（如|z-1|=|z+i|），求|z|或对应点轨迹。|z-1|=|z+i|表示到两点距离相等，轨迹是垂直平分线；结合几何意义直接得范围。","tip":"复数等式先想几何含义：距离相等是垂直平分线。"},"1|1|e|2":{"explain":"常考「已知复数相等或实部虚部条件求参数」：先化简（除法实数化）成a+bi，再列方程解参数。注意纯虚数、实数的条件要写全。","tip":"化简到标准形式再列方程，条件勿漏。"},"1|1|e|3":{"explain":"核心转化：复数、点、向量三者等价。|z-z0|=r是圆、|z-z1|=|z-z2|是中垂线、|z-z1|+|z-z2|=2a是椭圆（类比定义）。选填压轴常考，几何直观秒解。","tip":"把复数模等式翻译成几何图形，再求最值。"},"1|2|k|0":{"explain":"三个公理是立体几何的「地基」：①不共线三点确定一平面；②直线两点在面内则整线在面内；③两平面有一公共点则交线唯一过该点。推论：一直线加线外一点也能确定平面。","example":"判断「空间四点确定一个平面」：错误，须不共线三点才确定一平面，第四点可能不在该平面内，例如正四面体的四个顶点。","tip":"证明点线共面，先找确定平面的依据再证。"},"1|2|k|1":{"explain":"两直线在空间的位置：相交、平行、异面三种。异面直线所成角：平移一条使两线相交，锐角或直角即所成角，范围(0°,90°]，不含0°因为0°就是平行。","example":"正方体中棱A1A与B1C1是异面直线：把B1C1平移至BC，A1A与BC所成角为90°，即异面直线所成角90°。","tip":"异面直线所成角用平移构造，范围(0,90°]。"},"1|2|k|2":{"explain":"判定定理：线不在面内+线平行于面内一条直线⇒线面平行。用的逻辑是「面内找一条线平行」。性质定理：线面平行，过该线的平面与已知面交线，则线平行于交线。判定用来证、性质用来推。","example":"证明AB平行平面CDE：在面CDE内找一条直线DF，证AB平行DF且AB不在面内，两个条件齐备即得线面平行。","tip":"证线面平行，面内先找（或作）一条平行线。"},"1|2|k|3":{"explain":"判定：一个面内两条相交直线都平行于另一平面⇒两面平行。「相交」二字不能丢，两条平行线不够（反例：两条线都与交线平行时两面相交）。性质：两面平行，一平面内直线平行于另一平面。","example":"证平面α平行β：在α内取两条相交直线a、b，分别证a平行β且b平行β即可。注意「相交」条件不能省略。","tip":"判定面面平行必须「两条相交直线」，缺一不可。"},"1|2|k|4":{"explain":"判定：直线垂直于面内两条相交直线⇒线面垂直（「相交」保证确定该平面方向）。性质：线面垂直则垂直于面内所有直线、且垂直于平行平面的直线。垂直是「双刃剑」：证垂直也用它、推垂直也用它。","example":"证PA垂直于平面ABC：证PA⊥AB且PA⊥AC，且AB、AC是面内两条相交直线，满足判定定理即得线面垂直。","tip":"线面垂直的判定中两线必须相交，勿用两平行线。"},"1|2|k|5":{"explain":"判定：一个平面经过另一个平面的垂线⇒两面垂直（本质是「线面垂直⇒面面垂直」）。性质：两面垂直，在一个面内作交线的垂线，则该线垂直另一平面（「面面垂直⇒线面垂直」）。","example":"证面α垂直于面β：在α内找一条直线l垂直于β即可。如直二面角中，一个面内垂直于交线的直线必垂直另一面。","tip":"面面垂直性质：交线垂线即面垂线，作辅助线常用。"},"1|2|d|0":{"explain":"求异面直线夹角标准流程：平移其中一条（或两条）到同一平面内相交，再解三角形求角。平移目标：把异面变共面。常通过中位线、平行四边形对边实现平移。","example":"正方体棱长1，求A1B与B1C所成角：把B1C平移至A1D，三角形A1BD三边均为√2，为等边三角形，所成角60°。","tip":"用中位线或平行四边形对边平移，再解三角形。"},"1|2|d|1":{"explain":"转化链：线线平行↔线面平行↔面面平行；线线垂直↔线面垂直↔面面垂直。判定定理「从低维证高维」（线线→线面→面面），性质定理「从高维推低维」。证题时倒着分析：要证什么，先证什么。","example":"证线面垂直：先证线线垂直，如a⊥b且a⊥c，且b、c是面内两条相交直线，则由判定定理得a垂直于该平面。","tip":"判定正向用、性质反向用，先定目标再选定理。"},"1|2|d|2":{"explain":"三视图「长对正、高平齐、宽相等」：正视图与侧视图同高、正视图与俯视图同长、侧视图与俯视图同宽。斜二测画法：x轴不变、y轴长度减半、z轴不变。还原几何体：三视图两两结合想象。","example":"正视图与侧视图都是矩形、俯视图为圆的几何体是圆柱；斜二测画法中平行于y轴的线段长度减半、x与z轴不变。","tip":"还原几何体从俯视图入手「拔高」，检查每个视图。"},"1|2|d|3":{"explain":"组合体表面积拆开算再相加，重合面要减去；体积用分割或补形。球与多面体切接：找球心位置，构造含球半径的直角三角形，用勾股定理求R。正方体外接球半径是体对角线一半。","example":"正方体棱长a：外接球直径等于体对角线√3a，故R=√3a/2；内切球半径等于棱长一半a/2。构造直角三角形求半径。","tip":"球心常在中点，构造直角三角形用勾股求半径。"},"1|2|e|0":{"explain":"命题判断类小题：对每个命题画图或举反例。常见陷阱：两条平行线确定平面（对）、三个点确定平面（错，须不共线）、垂直于同一直线的两直线平行（错，空间可能异面）。","tip":"举反例优先想正方体模型，棱、面关系最直观。"},"1|2|e|1":{"explain":"解答题第一问几乎固定考平行或垂直证明。书写规范：每一步注明所用定理，如「因为AB不在平面内，AB∥CD，CD在平面内，所以AB∥平面α」。判定条件一个都不能少。","tip":"书写按「条件→定理→结论」三段式，条件写全。"},"1|2|e|2":{"explain":"必背公式：圆柱侧面积2πrl、圆锥侧面积πrl、球S=4πR^2、V球=4/3πR^3、棱锥V=1/3Sh。侧面积展开图：圆柱是矩形、圆锥是扇形。","tip":"圆锥侧面积是πrl（l是母线不是高），V=1/3Sh别漏1/3。"},"1|2|e|3":{"explain":"流程：三视图→还原几何体（先俯视图定底面，正侧视图定高与形状）→套公式求表面积体积。注意虚线表示被遮挡的棱。","tip":"虚线是被遮挡的棱，还原时别漏。"},"1|2|e|4":{"explain":"策略：找球心所在位置（外接球心在体心或过底面外心的垂线上），构造直角三角形（球半径、底面外接圆半径、高的一半等）列勾股方程解R。","tip":"画截面图把立体问题平面化，勾股列方程。"},"1|3|k|0":{"explain":"三种抽样各有所长：简单随机抽样适合总体小且均匀，用抽签或随机数表；分层抽样适合总体差异明显，按比例分层保证代表性；系统抽样适合总体大且有序，先随机定起点再等距取。","example":"全校3000人分重点班与普通班，两班差异明显：适合分层抽样，按各班人数比例分配抽取数量，保证代表性。","tip":"分层抽样按比例分配，系统抽样先随机定起点。"},"1|3|k|1":{"explain":"直方图关键：纵轴是频率/组距，小矩形面积=组距×频率/组距=频率！所以面积才是频率，不是高度。各组频率和为1，总面积为1。频数=频率×样本容量。","example":"直方图中组距0.5、高0.6的矩形面积=0.5×0.6=0.3，即频率0.3；样本100个则频数=100×0.3=30。","tip":"读直方图看「面积」不看「高度」，面积才是频率。"},"1|3|k|2":{"explain":"平均数=总和/个数，受极端值影响大；中位数是排序后中间值（偶数个取中间两数平均），不受极端值影响；众数是出现最多的数。离散程度：方差越大波动越大。选择哪个指标看数据特点与提问。","example":"数据2、3、3、5、10：平均数4.6受极端值10影响偏大，中位数3更能代表一般水平，故选中位数描述。","tip":"数据含极端值时中位数比平均数更稳健。"},"1|3|k|3":{"explain":"方差思想：每个数据与平均数差的平方的平均，衡量「离平均有多远」。公式s^2=1/n·Σ(xi-x̄)^2，开方得标准差s（与原数据同量纲）。方差是标准差的平方，量纲是原数据的平方。","example":"数据1、2、3、4、5，平均3，方差=(4+1+0+1+4)/5=2，标准差√2。","tip":"方差带平方、标准差同量纲，题目问哪个看清。"},"1|3|k|4":{"explain":"第p百分位数：至少有p%的数据不大于它。算法：升序排列后算位置i=n·p%，i为整数取第i与第i+1项的平均，否则向上取整取对应项。第25百分位数即下四分位数。","example":"10个数据排序后求第60百分位数：位置i=10×60%=6为整数，取第6项与第7项的平均值。","tip":"先排序再定位，i是整数取平均、非整数向上取整。"},"1|3|d|0":{"explain":"直方图中：平均数=Σ(组中值×频率)，组中值是每组中点；中位数是累计频率到0.5那一点的横坐标。两者含义不同：平均数是「重心」，中位数是「分半点」。","example":"直方图各组频率为0.1、0.3、0.4、0.2：累计到第三组前为0.4，到第三组末为0.8，故中位数在第三组内，按比例求横坐标。","tip":"中位数找累计频率0.5处，平均数用组中值加权。"},"1|3|d|1":{"explain":"分层抽样核心：每层抽取数=该层个体数/总体数×样本容量（按比例）。比例分配保证各层在样本中的占比与总体一致。常见错误：直接用样本容量除以层数平均分配。","example":"总体1200人，男生720、女生480，样本容量60：男生抽720/1200×60=36人，女生抽480/1200×60=24人。","tip":"按比例分配：层个体数÷总数×样本容量。"},"1|3|d|2":{"explain":"方差、标准差都反映波动，但量纲不同：方差是原数据单位的平方（如cm^2），标准差同单位（cm）。题目问「哪个更稳定」看哪个标准差小。数据都加c，方差不变；都乘k，方差变k^2倍。","example":"数据每个都加5：平均数加5、方差不变，因为平移不改变波动；每个乘2：方差变为4倍，因为方差是平方缩放。","tip":"平移不变方差、伸缩平方倍，别记反。"},"1|3|e|0":{"explain":"高频考法：读直方图算频率、频数，再算平均数（组中值×频率求和）、中位数（累计频率0.5处）、众数（最高矩形中点）。样本容量=频数/频率。","tip":"组中值=组两端平均，加权求平均数。"},"1|3|e|1":{"explain":"分层抽样小题直接套比例：某层抽取数=该层人数/总人数×样本容量。给两层人数和总样本量，先算比例再分配。","tip":"比例计算用分数精确表示，勿四舍五入出错。"},"1|3|e|2":{"explain":"情境题：数据来自实际（考试成绩、空气质量），问平均数、中位数、方差及意义。回答「方差小说明成绩稳定」这类定性问题要结合情境语言。","tip":"结论表述结合情境，如「波动小→稳定」。"},"1|3|e|3":{"explain":"按定义算：排序→算位置i=n×p%→按规则取值。常考第25、50（中位数）、75百分位数（四分位数）。注意样本量与p%乘积的整数性。","tip":"位置计算分整数/非整数两种情况处理。"},"1|4|k|0":{"explain":"古典概型两个条件：基本事件有限个、每个等可能。概率P(A)=事件A包含的基本事件数/基本事件总数。核心是数数：列举、树状图、排列组合计数，数错则全错。","example":"掷两颗骰子，和为7的概率：总数36种，和为7的有(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)共6种，P=6/36=1/6。","tip":"数基本事件要不重不漏，骰子等模型「有序」计数。"},"1|4|k|1":{"explain":"互斥：A、B不能同时发生（但可能都不发生），和的概率等于概率之和。对立：A与Ā必有一个发生且仅一个发生，是对互斥的特殊情形。对立一定互斥，互斥不一定对立。","example":"掷骰子，A={点数1}，B={点数2}互斥：P(A∪B)=1/6+1/6=1/3。A与「非A」对立：P+1-P=1。","tip":"对立必互斥、互斥不一定对立；互斥相加别忘前提。"},"1|4|k|2":{"explain":"概率公理：任何事件概率在0到1之间，必然事件为1、不可能事件为0。可推出P(Ā)=1-P(A)、P(A∪B)=P(A)+P(B)-P(A∩B)。这些是计算复杂概率的「积木」。","example":"P(A)=0.3，则P(Ā)=0.7；若P(A)=0.6、P(B)=0.5、P(A∪B)=0.8，则由容斥公式P(A∩B)=0.6+0.5-0.8=0.3。","tip":"算出的概率若大于1或小于0说明过程有错，回头检查。"},"1|4|k|3":{"explain":"概率是「理论值」（客观存在），频率是「实验值」（随试验次数波动）。大数定律思想：试验次数越多，频率越稳定地接近概率。所以用频率估计概率，但频率不是概率。","example":"掷硬币1000次正面502次，频率0.502；但概率的理论值仍是0.5，频率只是概率的估计，不能等同。","tip":"频率随试验变、概率固定，表述「估计」勿说「等于」。"},"1|4|k|4":{"explain":"并事件A∪B是「至少一个发生」，交事件A∩B是「两个都发生」。加法一般公式P(A∪B)=P(A)+P(B)-P(A∩B)，减掉重叠防重复；A、B互斥时退化为直接相加。","example":"P(A)=0.5，P(B)=0.4，P(A∩B)=0.1，则P(A∪B)=0.5+0.4-0.1=0.8。","tip":"一般加法公式勿忘减交集；独立事件交集概率相乘。"},"1|4|d|0":{"explain":"计数方法选择：基本事件少用列举或树状图（保证不重不漏）；事件多且有序用排列、无序用组合。常见错误：把组合当排列数（顺序有无）、重算（如摸球是否放回）。","example":"袋中3红2白，不放回取2个，求至少1个红球：总数C(5,2)=10，反面全白只有C(2,2)=1种，概率1-1/10=9/10。","tip":"先判断有序无序、放回不放回，再选计数方法。"},"1|4|d|1":{"explain":"判断对立要「双条件」：不能同时发生（互斥）+必有一个发生（并集为全集）。如掷骰子A={1,2}、B={3,4}互斥不对立（还有5、6）；A={1}、B={非1}对立。","example":"掷骰子A={1,2}、B={3,4}互斥但不对立（还有5、6）；A={1}与B={2,3,4,5,6}互斥且对立。","tip":"对立=互斥+并集是全集，两条件都验证。"},"1|4|d|2":{"explain":"复杂事件先「翻译」：至少一个、至多一个、恰有一个分别对应并、补、交的组合。用文氏图或集合语言把事件分解，再用加法或乘法原理计算。","example":"投篮命中率0.6，两次至少中一次：反面是两次都不中，概率0.4^2=0.16，故P=1-0.16=0.84。","tip":"复杂事件用「正难则反」：先算对立事件概率再减。"},"1|4|e|0":{"explain":"小题套路：先数基本事件总数，再数事件包含个数，相除。摸球注意放回不放回：放回总数不变，不放回总数递减。骰子两枚注意「有序」共36种。","tip":"摸球放回与否决定总数，审题看清。"},"1|4|e|1":{"explain":"高频题型：求「至少一次」「恰好一次」「都不发生」的概率。「至少」类优先用对立：P(至少一次)=1-P(都不)。互斥直接加、一般事件用容斥公式。","tip":"「至少」字眼先想对立事件，1减去法。"},"1|4|e|2":{"explain":"综合题流程：读直方图得频率（面积）→用频率估计概率→求某范围概率。注意「用样本频率估计总体概率」的表述要规范。","tip":"直方图面积=频率=概率估计值，换算要准。"},"1|4|e|3":{"explain":"计数题：从n个取m个，有序用A(n,m)、无序用C(n,m)。古典概型中分子分母用同一种计数方式（都排列或都组合），保持「口径一致」。","tip":"分子分母计数口径必须一致，都按有序或都按无序。"},"2|0|k|0":{"explain":"类比平面：平面用两个不共线向量作基底，空间用三个不共面向量作基底，任意空间向量可唯一表示为x·a+y·b+z·c。基底三向量必须不共面（类比不共线），否则「张不开」整个空间。","example":"判断a、b、c能否作基底：只需验证三者不共面。如正方体从一个顶点出发的三条棱对应的向量，两两垂直必不共面。","tip":"基底条件是不共面，与平面「不共线」区分。"},"2|0|k|1":{"explain":"空间数量积比平面多一个z分量：a·b=x1x2+y1y2+z1z2。应用：垂直即a·b=0，模|a|=√(x^2+y^2+z^2)，夹角cosθ=(a·b)/(|a||b|)。","example":"a=(1,2,3)、b=(0,-1,1)，a·b=0-2+3=1，|a|=√14。","tip":"空间数量积照搬平面公式加z项，别漏。"},"2|0|k|2":{"explain":"法向量垂直平面内所有向量。求法：面内取两不共线向量a、b，设n=(x,y,z)，列n·a=0、n·b=0两个方程，令一个坐标取合适值求整数解。法向量不唯一，取简单整数。","example":"a=(1,1,0)、b=(0,1,1)，设n=(x,y,z)：x+y=0、y+z=0，令y=1得n=(-1,1,-1)。","tip":"令一个坐标取简单值求整数解，答案不唯一选简单者。"},"2|0|k|3":{"explain":"线面角θ是直线与其在平面内射影的夹角，0≤θ≤90°。向量法：设方向向量l、法向量n，sinθ=|cos(l,n)|，注意是正弦，因为θ与两向量夹角互余。这是最容易记错的点。","example":"l与n夹角余弦为1/2，则线面角的正弦为1/2，θ=30°；注意线面角公式用正弦，这是易错点。","tip":"线面角用「正弦=法向量夹角余弦的绝对值」。"},"2|0|k|4":{"explain":"二面角等于两平面法向量夹角或其补角。先算|cos〈n1,n2〉|得绝对值，再观察图形判断二面角是锐是钝：看两个面的「开口」方向，或在二面角内取点验证。","example":"两平面法向量夹角为60°，但观察图形知二面角开口向外为钝角，故二面角等于180°-60°=120°。","tip":"法向量夹角可能是补角，结合图形定锐钝。"},"2|0|k|5":{"explain":"推导：PA在法向量方向的投影长度即距离。d=|PA·n|/|n|（取绝对值）。A取面内任意点结果相同。线面距离、面面距离都转化为点面距离。","example":"平面法向量n=(1,1,1)，P(1,2,3)，面内点A(1,1,1)，PA=(0,1,2)，d=|0+1+2|/√3=√3。","tip":"分子是点与面内任一点连向量点乘法向量，取绝对值。"},"2|0|d|0":{"explain":"建系原则：找「三条两两垂直的直线」当坐标轴，优先利用几何体的直角（长方体、直棱柱天然适合）。不规则几何体要会「补」：把棱补成坐标轴方向。原点选在便于求坐标的点（如底面中心、顶点）。","example":"直三棱柱ABC-A1B1C1建系：以A为原点，AB、AC、AA1所在直线分别为x、y、z轴，各顶点坐标可直接读出。","tip":"建系前先找三垂线，无直角先构造直角。"},"2|0|d|1":{"explain":"判断方法：①看图：二面角开口大小直观判断锐钝；②在二面角内取特殊点看法向量指向；③算完后代入题中条件验证（如题目隐含钝角）。必要时在图形中「现场判断」。","example":"法向量夹角算得cosθ=1/2即60°，但二面角实际为钝角，故二面角=120°，符号判断结合图形完成。","tip":"求完夹角先判断二面角锐钝再定正负号。"},"2|0|d|2":{"explain":"套路：设动点P在棱（或面）上，用参数t表示坐标（如P=A+t·AB方向），把条件（垂直、平行、角度）写成向量方程，解出t，再判断t是否在合理范围。","example":"P在棱AA1上，设AP=t·AA1方向表示P坐标，由条件PB⊥AC列数量积方程解出t，再检验t是否在[0,1]内。","tip":"动点参数t的范围别忘了，解出的t须合理。"},"2|0|e|0":{"explain":"解答题固定流程：建系（说明建系依据）→写关键点坐标→求方向向量、法向量→套公式算角→作答。步骤规范能拿步骤分：每个量都写清楚来源。","tip":"步骤分按点给，建系、坐标、公式一步都不能省。"},"2|0|e|1":{"explain":"点面距离用公式d=|n·PA|/|n|。异面直线距离：求与两直线都垂直的法向量n，再取两直线上各一点连线在n上的投影长度。小题用公式快解。","tip":"距离公式统一为「向量在法向量上投影的绝对值」。"},"2|0|e|2":{"explain":"向量判定：线线平行看方向向量共线；线面平行看方向向量与法向量垂直（数量积0）且线不在面内；面面平行看法向量共线；线面垂直看方向向量与法向量共线。一整套判定规则背熟。","tip":"线面平行是「方向向量⊥法向量」，别与线面垂直混淆。"},"2|0|e|3":{"explain":"概念题考基底条件（不共面）与唯一表示。判断三个向量能否作基底：验证它们不共面（高中常用「观察+验证」或混合积思想）。","tip":"基底判定看是否共面，共面则不能作基底。"},"2|1|k|0":{"explain":"五种形式各有适用场景：点斜式知点加斜率最常用；斜截式便于读斜率；两点式知两点；截距式x/a+y/b=1知两截距；一般式通用可表示所有直线，转斜截式即y=-A/B·x-C/B。","example":"过点(1,2)斜率为3的直线，点斜式y-2=3(x-1)，化简为一般式3x-y-1=0。","tip":"截距式不能表示过原点或平行坐标轴的直线，注意限制。"},"2|1|k|1":{"explain":"平行：k1=k2（且截距不等）；垂直：k1·k2=-1。特殊情形：斜率不存在（竖直线）与斜率0（水平线）互相垂直；两竖直线平行。含参直线要先讨论斜率是否存在。","example":"直线x=2与y=3互相垂直：竖线与横线，前者斜率不存在，不能用k1k2=-1判断，须单独讨论。","tip":"斜率不存在情形先讨论，别直接套k1k2=-1。"},"2|1|k|2":{"explain":"点到直线距离：代入一般式取绝对值，除以√(A^2+B^2)。平行线Ax+By+C1=0与Ax+By+C2=0距离d=|C1-C2|/√(A^2+B^2)，须先化A、B相同。","example":"点(1,2)到直线3x+4y-5=0的距离：代入公式d=|3+8-5|/√(9+16)=6/5，分子取绝对值、分母是系数平方和开方。","tip":"平行线距离公式要求A、B系数一致，先化一致再用。"},"2|1|k|3":{"explain":"标准方程直接读出圆心(a,b)与半径r。一般方程配方可得标准方程，条件D^2+E^2-4F大于0是圆、等于0是点、小于0无轨迹。求圆的方程常用待定系数法或几何法找圆心。","example":"x^2+y^2-4x+6y-3=0配方得(x-2)^2+(y+3)^2=16，故圆心(2,-3)、半径4。","tip":"一般方程判圆：D^2+E^2-4F大于0，勿忘条件。"},"2|1|k|4":{"explain":"位置判定优先用「距离法」：d小于r相交、d等于r相切、d大于r相离。弦长由勾股定理算：半径、弦心距、半弦构成直角三角形，弦长=2√(r^2-d^2)。","example":"圆心(0,0)、r=2，直线y=x即x-y=0，d=0小于2，相交；弦长=2√(4-0)=4，直线过圆心时弦长即直径。","tip":"弦心距、半弦、半径构成直角三角形，勾股求弦长。"},"2|1|k|5":{"explain":"设两圆半径R、r且R≥r：d大于R+r外离、d=R+r外切、R-r小于d小于R+r相交、d=R-r内切、d小于R-r内含。两圆相交时两方程相减得一次方程，即公共弦所在直线。","example":"两圆圆心距d=3，半径R=4、r=1：因R-r=3=d，满足内切条件，故两圆内切。","tip":"公共弦方程=两圆方程相减（消去x^2、y^2项）。"},"2|1|d|0":{"explain":"设切线斜率k用点斜式，由圆心到直线距离=半径列方程解k。但斜率不存在的竖直线（x=常数）可能也是切线，必须单独检验！正确流程：先检验竖直切线，再设斜率求k。","example":"圆x^2+y^2=1过(2,0)的切线：先检验x=2不是切线，距离2大于1；设y=k(x-2)，由距离1=|2k|/√(k^2+1)解得k=±√3/3。","tip":"切线题先检验竖直线x=x0，防漏解。"},"2|1|d|1":{"explain":"圆上点到直线距离：圆心到直线距离d，最远=d+r、最近=|d-r|。原理：圆上点都在以圆心为中心半径r的范围内，直线距离在「圆心距离±r」之间波动。","example":"圆心到直线距离d=3、半径r=2，则圆上点到该直线距离最远=3+2=5、最近=3-2=1。","tip":"最值=d±r，注意最近是|d-r|（圆可能跨过直线）。"},"2|1|d|2":{"explain":"直线方程含参数m，整理成「参数×多项式1+多项式2=0」的形式，如m(2x+y+1)+(x-y)=0。令两个多项式都为0，解出x、y即定点，因为该点对任意m都成立。","example":"m(x+y-1)+(x-2y)=0恒过定点：x+y-1=0且x-2y=0，解得(2/3,1/3)。","tip":"对任意参数成立⇔参数系数与常数项同时为0。"},"2|1|e|0":{"explain":"必考小题：给直线与圆，判位置、求弦长、求切线方程。距离法是首选（不用联立解方程）。弦长与切线都要「直角三角形」勾股思想。","tip":"位置判断用距离法，比判别式快且不易错。"},"2|1|e|1":{"explain":"待定系数法：设标准或一般方程，代入条件解系数。几何法：由「圆心在弦的垂直平分线上」「圆心到切线距离=半径」等几何性质直接定圆心半径，更快更巧。","tip":"几何条件优先「垂直平分线找圆心」，数形结合。"},"2|1|e|2":{"explain":"判断两圆位置先算圆心距与半径和差。求公共弦：两方程相减得一次方程。求公共弦长：先用相减得弦所在直线，再用弦心距法求弦长。","tip":"相减得公共弦直线，弦长再用「弦心距+勾股」。"},"2|1|e|3":{"explain":"解析几何解答题中，直线设成y=kx+b，距离公式用于点到直线距离（如面积、最值），弦长公式用于求线段长。这些是圆锥曲线题的基础工具，务必熟练。","tip":"直线设斜截式前先考虑斜率不存在，防漏讨论。"},"2|2|k|0":{"explain":"椭圆是「到两定点距离之和为常数」的轨迹：|PF1|+|PF2|=2a，且2a大于|F1F2|，否则退化。标准方程中a大于b大于0，a^2=b^2+c^2，焦点在长轴上。","example":"椭圆x^2/25+y^2/16=1：a=5、b=4、c=3，焦点(±3,0)，|PF1|+|PF2|=10。","tip":"判断焦点在x还是y轴看分母大的在哪个变量下。"},"2|2|k|1":{"explain":"椭圆性质：范围|x|≤a、|y|≤b，关于x轴、y轴、原点对称，顶点(±a,0)、(0,±b)。离心率e=c/a在0到1间，越接近1越扁，e=√(1-b^2/a^2)。","example":"椭圆x^2/9+y^2/4=1：a=3、b=2、c=√(9-4)=√5，离心率e=√5/3，范围|x|≤3、|y|≤2。","tip":"e=√(1-b^2/a^2)，由b/a直接算离心率。"},"2|2|k|2":{"explain":"双曲线是「到两定点距离之差的绝对值为常数」的轨迹：||PF1|-|PF2||=2a且2a小于|F1F2|。c^2=a^2+b^2，渐近线y=±(b/a)x由右边1换0得到。","example":"双曲线x^2/16-y^2/9=1：a=4、b=3、c=5，渐近线y=±(3/4)x，焦点(±5,0)。","tip":"双曲线c^2=a^2+b^2，渐近线由「1变0」求出。"},"2|2|k|3":{"explain":"抛物线是「到定点（焦点）与定直线（准线）距离相等」的轨迹。y^2=2px开口向右，焦点(p/2,0)、准线x=-p/2，p是焦点到准线距离。焦半径|PF|=x+p/2。","example":"抛物线y^2=4x：p=2，焦点(1,0)、准线x=-1，点(1,2)在抛物线上，|PF|=1+1=2。","tip":"焦点坐标与准线方程中p/2别忘，p=2p/2。"},"2|2|k|4":{"explain":"焦点三角形是P与两焦点构成的三角形。椭圆中|PF1|+|PF2|=2a，由余弦定理推得面积S=b^2·tan(θ/2)，θ为顶角。双曲线中|PF1|-|PF2|=±2a，注意符号。","example":"椭圆b=2，∠F1PF2=60°，焦点三角形面积=4·tan30°=4√3/3。","tip":"椭圆焦点三角形面积S=b^2·tan(θ/2)，背熟直接用。"},"2|2|k|5":{"explain":"核心方法：直线y=kx+m代入曲线方程得二次方程，判别式判位置（Δ大于0两交点、Δ=0相切、Δ小于0相离），韦达定理得x1+x2、x1x2，设而不求。","example":"直线y=x+1与椭圆x^2/4+y^2=1联立消元得5x^2+8x=0，Δ=64大于0，故有两个交点。","tip":"联立时二次项系数可能为0（退化为一次），要单独讨论。"},"2|2|d|0":{"explain":"计算策略：①联立后整理成标准二次方程，写明各项系数；②韦达定理写出x1+x2、x1x2备用；③后续表达式整体代入，只算x1+x2、x1x2的组合，不展开到底。","example":"联立后5x^2+8x=0：韦达x1+x2=-8/5、x1x2=0，弦长=√2·√(64/25)=8√2/5，整体代入快速得结果。","tip":"韦达定理结果先写好备用，整体代入减少重复计算。"},"2|2|d|1":{"explain":"弦长|AB|=√(1+k^2)·√((x1+x2)^2-4x1x2)，韦达代入。k=0时退化为|x1-x2|；斜率不存在时换用纵坐标版本。求范围别忘Δ大于0限定k。","example":"k=1时弦长|AB|=√2·√((x1+x2)^2-4x1x2)，把韦达结果整体代入即可，勿先解出x1、x2。","tip":"弦长公式两种形式，斜率不存在时用纵坐标版本。"},"2|2|d|2":{"explain":"求离心率e=c/a：从条件中找a、b、c的齐次关系（同次方程），两边除以a^2化e的方程解出；求范围则把条件转成不等式。核心是「把条件翻译成a、b、c等式或不等式」。","example":"已知离心率e=c/a=1/2，由c^2=a^2-b^2得b^2/a^2=1-e^2=3/4，即b/a=√3/2。","tip":"齐次式两边同除a^n，化关于e的方程再解。"},"2|2|d|3":{"explain":"两段式：①探路：取特殊直线（如垂直于x轴）或特殊点，猜出定点/定值；②证明：设一般直线y=kx+m，联立用韦达定理，把目标式化简，消去参数（m与k的关系由「过定点」条件给出）。","example":"先取竖直直线x=1与水平直线y=0分别算交点，两结果重合处即猜出定点，再设一般直线y=kx+m证明。","tip":"先特殊后一般，猜出结论再代数验证，别一上来硬算。"},"2|2|e|0":{"explain":"必考：由方程读a、b、c，算离心率、焦点、渐近线。双曲线渐近线方程与标准方程互推要熟练（x^2/a^2-y^2/b^2=1的渐近线y=±bx/a）。","tip":"由方程求渐近线：令右边1为0即得。"},"2|2|e|1":{"explain":"过焦点F的弦叫焦点弦：|AB|=x1+x2+p（横坐标和加p）；A、B纵坐标积y1y2=-p^2（常数）；1/|AF|+1/|BF|=2/p。这些二级结论记住直接秒杀小题。","tip":"焦点弦结论：|AB|=x1+x2+p，y1y2=-p^2。"},"2|2|e|2":{"explain":"解答题结构：第一问求曲线方程（待定系数），第二问直线与曲线综合：联立→韦达→弦长或面积公式→求范围时判别式Δ大于0与目标函数结合。","tip":"求范围时判别式Δ大于0是隐含条件，务必参与。"},"2|2|e|3":{"explain":"压轴离心率：条件常给焦点三角形、渐近线夹角、点与曲线的位置关系等，翻译成a、b、c等式。多用定义式（椭圆2a、双曲线2a）建立关系。","tip":"焦点三角形优先用定义+余弦定理建方程。"},"3|0|k|0":{"explain":"通项公式由「每次加d」累加得到：an=a1+(n-1)d。前n项和Sn=n(a1+an)/2，首尾配对；或Sn=na1+n(n-1)d/2。五个基本量知三求二。","example":"a1=2、d=3，则an=a1+(n-1)d=3n-1，S10=n(a1+an)/2=10(2+29)/2=155，两种公式任选。","tip":"Sn公式选含an的版本更省计算（知an时）。"},"3|0|k|1":{"explain":"通项由「每次乘q」累乘得到。前n项和推导：Sn与qSn错位相减得Sn(1-q)=a1(1-q^n)。注意q=1时Sn=na1要单独处理。q≠0是等比数列基本要求（每项不为0）。","example":"a1=1、q=2：S10=a1(1-q^10)/(1-q)=1(1-2^10)/(1-2)=1023，q≠1才能用公式。","tip":"等比求和先讨论q=1，q≠1才能用公式。"},"3|0|k|2":{"explain":"等差中项2b=a+c，等比中项b^2=ac且a、c同号。下标和性质：等差中m+n=p+q则am+an=ap+aq；等比中am·an=ap·aq。用性质可绕开d、q快速解题。","example":"等差{an}中a3+a7=10：由下标和性质3+7=5+5，得2a5=10，故a5=5，绕开d直接求解。","tip":"下标和相等才可用性质，条件「m+n=p+q」别忘。"},"3|0|k|3":{"explain":"方法选择看通项结构：等差或等比直接用公式；等差×等比用错位相减；分式型如1/n(n+1)用裂项相消；混合型分组求和。识别结构是关键第一步。","example":"通项an=1/[n(n+1)]为分式型，用裂项相消求和；an=n·2^n为等差乘等比，用错位相减。","tip":"先看通项结构再选方法，错位相减只用于等差×等比。"},"3|0|k|4":{"explain":"累加法：an+1-an=f(n)时，把n=1到n-1的式子相加，左边连环相消剩an-a1。累乘法：an+1/an=f(n)时相乘，左边约分剩an/a1。看差或比为函数选方法。","example":"an+1-an=2n且a1=1：累加得an=1+2(1+2+…+(n-1))=n^2-n+1。","tip":"累加从n=1加到n-1共n-1个式子，别数错项数。"},"3|0|k|5":{"explain":"由定义Sn=a1+…+an，Sn-S(n-1)=an（n≥2）。注意n=1时S0没定义，必须单独算a1=S1并检验能否并入通项公式。写答案时n=1与n≥2可能分段表示。","example":"Sn=n^2，a1=S1=1；n≥2时an=n^2-(n-1)^2=2n-1，n=1代入2n-1=1一致，故an=2n-1。","tip":"n≥2求an后必验n=1，不一致写分段形式。"},"3|0|d|0":{"explain":"步骤：Sn=…，两边同乘公比q得qSn，错一位相减（Sn-qSn），中间项全部抵消，注意相减时符号（减号括号展开）。最后除以(1-q)并化简，别忘了首尾残留项。","example":"Sn=1·2+2·2^2+3·2^3+…+n·2^n，乘2错位相减得-Sn=2+2^2+…+2^n-n·2^(n+1)。","tip":"相减时「同次幂对齐」，括号展开防符号错。"},"3|0|d|1":{"explain":"裂项公式：1/[n(n+1)]=1/n-1/(n+1)；1/[n(n+k)]=(1/k)(1/n-1/(n+k))，系数1/k别漏。求和后典型剩首项、第二项、倒数第二项、末项四项。","example":"Σ1/[n(n+2)]=(1/2)Σ(1/n-1/(n+2))=(1/2)(1+1/2-1/(n+1)-1/(n+2))。","tip":"裂项前系数=1/k，消后剩首尾各一两项。"},"3|0|d|2":{"explain":"递推式既有Sn又有an，如Sn=2an-1：把n换成n-1再相减，消去Sn得an与a(n-1)的关系，化等比。注意相减要求n≥2，a1单独验证。","example":"Sn=2an-1：n=1得a1=1；n≥2时an=Sn-S(n-1)=2an-2a(n-1)，化简得an=2a(n-1)，{an}为等比。","tip":"相减消Sn得到的是n≥2的关系，a1另算。"},"3|0|d|3":{"explain":"放缩思想：把不好求和的通项放大或缩小成能求和的形式。常用1/n^2小于1/[n(n-1)]的裂项放缩、1/2^k型等比放缩、阶乘放缩。放缩方向要配合欲证的不等号。","example":"证Σ1/k^2小于2：放缩1/k^2小于1/[k(k-1)]=1/(k-1)-1/k，裂项求和得1+1-1/n小于2。","tip":"放缩要「恰到好处」：放得太大证不出、缩得太小超范围。"},"3|0|e|0":{"explain":"基本量法：把条件都写成a1与d（或q）的方程，解方程求基本量，再求其他量。五个量知三求二，列方程是核心。","tip":"列方程注意Sn两种形式选择，减少计算量。"},"3|0|e|1":{"explain":"解答题常考：先求通项（递推或an与Sn关系），再求和。错位相减与裂项相消是两大主力方法，步骤规范、化简正确是得分关键。","tip":"错位相减写完检验首尾项，裂项注意系数。"},"3|0|e|2":{"explain":"高频流程：an=Sn-S(n-1)（n≥2），求分段通项，验证n=1。答案常写成分段函数形式：n=1时a1，n≥2时公式。","tip":"n=1验证一致才能合并，否则分段写。"},"3|0|e|3":{"explain":"压轴题：数列单调性（作差比较）、最值（配方法或函数观点）、不等式证明（放缩、数学归纳法）。数列是特殊的函数，用函数观点分析数列性质是突破口。","tip":"数列最值先看单调性（作差或作商），再定位最值项。"},"3|1|k|0":{"explain":"导数是「瞬时变化率」：割线斜率[f(x0+Δx)-f(x0)]/Δx当Δx→0的极限，即切线斜率。理解：平均速度→瞬时速度。定义求导常用于证明求导公式或解决特殊极限。","example":"f(x)=x^2在x=1处导数：f'(1)=lim[(1+h)^2-1]/h=lim(2+h)=2。","tip":"导数定义极限式分母是Δx，分子是函数值差，对应好。"},"3|1|k|1":{"explain":"常数导数为0，因为不变则变化率为0；幂函数「指数提前、指数减1」；(e^x)'=e^x是导数等于自身的独特函数；(lnx)'=1/x。这些是求导的「零件库」，必须默写。","example":"(x^5)'=5x^4；(3^x)'=3^x·ln3；(1/x)'=(x^-1)'=-x^-2；幂指对公式各举一例对照记忆。","tip":"求导公式必须背熟，含常数的乘除别漏系数。"},"3|1|k|2":{"explain":"求导法则：和差直接分别求导；积(uv)'=u'v+uv'；商(u/v)'=(u'v-uv')/v^2。复合函数链式法则：外层求导乘内层求导。","example":"(x^2·sinx)'=2x·sinx+x^2·cosx，用的是积法则(u·v)'=u'v+uv'，前导后不导加后导前不导。","tip":"复合函数先分「外层函数」再逐层求导相乘。"},"3|1|k|3":{"explain":"导数符号决定增减：f'(x)大于0递增，小于0递减，且须区间内处处成立。f'(x)≥0只在孤立点取0也算递增，如x^3。求单调区间就解f'(x)大于0与小于0，区间结合定义域。","example":"f(x)=x^3-3x，f'(x)=3(x-1)(x+1)：x大于1或x小于-1时f'大于0递增，-1小于x小于1时递减。","tip":"求单调区间先定定义域，解不等式结果取定义域内的部分。"},"3|1|k|4":{"explain":"极值是「局部最值」：f'(x0)=0且左正右负为极大值、左负右正为极小值（符号变才是极值，不变则不是）。最值是「整体最值」：闭区间上比较所有极值与两端点值取最大最小。","example":"f(x)=x^3-3x，f'=3(x+1)(x-1)，x=-1左正右负为极大值f(-1)=2，x=1为极小值-2。","tip":"f'(x0)=0只是极值必要条件，须验证两侧符号变化。"},"3|1|k|5":{"explain":"「在点P处」切线：P就是切点，斜率f'(x0)，直接写点斜式。「过点P」的切线：P可能不是切点！须设切点(x0,f(x0))，由「斜率=导数」且「切线过P」两个条件列方程解x0。","example":"过(1,1)作y=x^2切线：设切点(a,a^2)，斜率2a，切线y-a^2=2a(x-a)过(1,1)解得a=1，切线y=2x-1。","tip":"「在」与「过」一字之差：过点切线必须设切点，可能有多个。"},"3|1|d|0":{"explain":"分类标准来自f'(x)的结构：①二次型：先看二次项系数是否为0及正负；②判别式符号决定根的个数；③两根大小（含参时比大小）。分类要做到「不重不漏」，每类分别求单调区间。","example":"f(x)=x^3-ax：f'=3x^2-a，a≤0时f'≥0恒增；a大于0时增区间为(-∞,-√(a/3))与(√(a/3),+∞)。","tip":"分类顺序：系数→判别式→根大小，写完检查是否遗漏类。"},"3|1|d|1":{"explain":"两法：分离参数a≥g(x)求g(x)最小值，可行则优先；不能分离时构造函数F(x)=f(x)-a研究最值。隐零点：f'(x)=0解不出时设零点x0，用f'(x0)=0整体代换化简。","example":"x大于0时e^x≥ax恒成立：分离得a≤e^x/x，研究g(x)=e^x/x在x=1处取最小值e，故a≤e。","tip":"分离参数后求最值注意定义域与取等；隐零点代换「设而不解」。"},"3|1|d|2":{"explain":"极值点偏移：x1+x2与2x0比较大小。方法：构造F(x)=f(x)-f(2x0-x)研究符号；或比值换元t=x2/x1把双变量化单变量。核心是「把双变量问题化归单变量」。","example":"f(x)=lnx-x+1两零点x1、x2（0小于x1小于1小于x2），证x1+x2大于2：构造F(x)=f(x)-f(2-x)判单调性。","tip":"偏移问题套路固定：构造对称差函数，判单调性。"},"3|1|d|3":{"explain":"零点个数=方程f(x)=0根个数=两函数图象交点个数。策略：分离成f(x)=g(x)（一边是熟悉函数）数交点；或研究f(x)的单调区间与极值符号，由「极值与0的关系」数零点。","example":"f(x)=x^3-3x+1：极值f(-1)=3、f(1)=-1，三个单调区间端点符号交替，故与x轴有3个交点，共3个零点。","tip":"数零点先求极值点与极值符号，画趋势草图。"},"3|1|e|0":{"explain":"小题考切线：在点处直接套公式；过点处设切点列方程（可能两解，勿漏）。注意切点「在曲线上」也是隐含条件。","tip":"设切点后两个条件：点在曲线上、切线过给定点。"},"3|1|e|1":{"explain":"解答题第一问固定流程：求定义域→求导→解f'(x)大于0与小于0→列单调区间→有极值再列表判断。定义域优先是铁律，如含lnx、分式的函数。","tip":"含ln、分式的函数先写定义域，单调区间不超定义域。"},"3|1|e|2":{"explain":"压轴问法：f(x)≥0恒成立求a。分离参数a≥g(x)是主流；分离失败用「端点效应」：先由端点（如x=0处）必要条件缩范围，再证充分性。","tip":"端点效应先探必要条件，再严格证明充分性。"},"3|1|e|3":{"explain":"热点题型：f(x)零点个数随a变化。方法：分离参数a=g(x)，研究g(x)图象（单调性、极值、渐近），由水平线y=a与图象交点个数得零点个数。","tip":"画出g(x)草图，水平线上下移动数交点，注意端点取等。"},"3|2|k|0":{"explain":"加法原理：完成一件事有k类办法且互斥，总数等于各类之和。乘法原理：分k个步骤且各步独立，总数等于各步之积。判断标准：一步完成用加、多步完成用乘。","example":"从A到C必须途经B：A到B有2条路、B到C有3条路，分两步完成，共2×3=6种，这就是分步乘法原理。","tip":"「分类互斥、分步独立」，先判断是分类还是分步。"},"3|2|k|1":{"explain":"排列是「从n个取m个排成一列」有顺序：共n(n-1)…(n-m+1)=n!/(n-m)!种。组合是不分顺序：排列数除以m!去重。判断口诀：有序排列、无序组合。","example":"从5人选3人排队，有序用排列A(5,3)=60种；只选3人不排顺序，用组合C(5,3)=10种。有序排列、无序组合。","tip":"先判断有序无序，再选A还是C，别混用。"},"3|2|k|2":{"explain":"对称性C(n,m)=C(n,n-m)：取m个等价于剩下n-m个。递推C(n,m)+C(n,m-1)=C(n+1,m)，把取法分成含与不含新元素两类。用于化简与证恒等式。","example":"C(10,3)=C(10,7)=120（对称性）；C(8,3)+C(8,2)=C(9,3)=84（递推公式）。","tip":"对称性注意「取与不取」对应，化简常用。"},"3|2|k|3":{"explain":"展开原理：每个括号选a或b，选k个b、n-k个a的取法为C(n,k)。通项T(k+1)是第k+1项，k从0到n。求指定项就令通项中x的指数等于要求。","example":"(x+2)^5中x^3项：T(4)=C(5,3)x^3·2^2=10·4x^3=40x^3。","tip":"通项中k从0开始，第k+1项才是T(k+1)，别数错。"},"3|2|k|4":{"explain":"二项式系数只是C(n,k)（与a、b无关）；项的系数还要乘上a、b的数值系数（如(2x+1)^n中项系数含2^k）。求系数和用赋值法：令x=1得各项系数和；令x=0得常数项。","example":"(1+x)^n中令x=1得各项系数和2^n；令x=-1得Σ(-1)^k·C(n,k)=0（n大于0），赋值法求系数和。","tip":"二项式系数和恒为2^n，项的系数和用x=1代入。"},"3|2|d|0":{"explain":"方法字典：特殊元素先安排（优先法）；相邻问题捆绑（把相邻元素捆成整体）；不相邻问题插空（先排其他再插空）；至多至少问题用排除法（总数-反面）。识别题目关键字选方法。","example":"甲乙必须相邻排队：先把甲乙捆绑成一个整体，与其余人共4个对象排列A(4,4)，再内部排甲乙2种，共A(4,4)×2种。","tip":"相邻捆绑、不相邻插空，至多至少正难则反。"},"3|2|d|1":{"explain":"均匀分组（组无区别）会重复计数：6人分3组每组2人，C(6,2)C(4,2)C(2,2)把组序也算了，须除以3!。非均匀分组不除；分组后再分配给不同对象（有区别）则乘组数阶乘。","example":"6人分3组每组2人：先取C(6,2)C(4,2)C(2,2)，因组无区别会重复计数，须除以3!，得15种。","tip":"均匀分组除以组数阶乘；分配对象有区别时再乘阶乘。"},"3|2|d|2":{"explain":"流程：写通项T(k+1)=C(n,k)a^(n-k)b^k，整理成系数乘x^m，令x的指数等于要求（0求常数项），解出k代回。项的系数等于二项式系数乘数值系数部分，勿混淆。","example":"(2x-1)^6中x^3项：T(4)=C(6,3)(2x)^3(-1)^3=-160x^3，注意系数含2^3与(-1)^3。","tip":"求常数项令指数为0，系数要含a、b的数值因子。"},"3|2|e|0":{"explain":"必考：排队、选人、数字组成、分组分配问题。与概率结合：分子分母都计数（口径一致）。方法：优先、捆绑、插空、排除。","tip":"计数题先定有序无序，再选方法，最后检验有无重复遗漏。"},"3|2|e|1":{"explain":"高频考法：(a+b)^n展开式中求x^k项系数、常数项、二项式系数。写通项→定指数→解k→算系数，四步固定。","tip":"通项中a、b的指数和为n，可用来核对k。"},"3|2|e|2":{"explain":"赋值法原理：展开式是恒等式，x取任意值两边相等。令x=1：左边(a+b)^n右边各项系数和；令x=0得常数项；两式加减可得奇偶次项系数和。","tip":"求奇次（偶次）项系数和：两式相减（相加）除以2。"},"3|2|e|3":{"explain":"二项式系数最大：n为偶数时中间一项C(n,n/2)最大；n为奇数时中间两项相等最大。系数最大项含字母系数，要用相邻项比大小求k。","tip":"二项式系数最大看n奇偶；系数最大项逐项比较求k。"},"3|3|k|0":{"explain":"分布列是随机变量的「概率户口本」：每行一个取值及对应概率，两个条件pi≥0、和为1是检验分布列正确与否的标准。求分布列流程：定取值→求各概率→列表→检验和为1。","example":"掷两次硬币，X为正面次数：P(X=0)=1/4、P(X=1)=1/2、P(X=2)=1/4，列表后检验概率和为1。","tip":"分布列两条件：每项非负、和为1，写完必验。"},"3|3|k|1":{"explain":"期望是「加权平均」：取值×概率求和，衡量平均水平。方差是「偏离程度」：每个取值与期望差的平方×概率求和，方差越大波动越大。标准差=√方差。记忆：期望看平均、方差看波动。","example":"X取1、2、3概率各1/3，E(X)=2，D(X)=(1+0+1)/3=2/3。","tip":"方差公式中先算期望再算差的平方和，顺序别乱。"},"3|3|k|2":{"explain":"线性变换性质：期望「跟着变」（加b加b、乘a乘a）；方差「平方变」（乘a则方差乘a^2，加b不变——平移不影响波动）。这两个性质用于标准化、简化计算。","example":"E(X)=3、D(X)=4：E(2X+1)=2×3+1=7，D(2X+1)=2^2×4=16，注意方差是平方缩放、加常数不变。","tip":"方差平移不变、伸缩平方倍，E与D的性质别混。"},"3|3|k|3":{"explain":"二项分布描述n次独立重复试验的成功次数：每次成功概率p，成功k次的概率=C(n,k)p^k(1-p)^(n-k)，即选k次成功再乘成功与失败的概率。期望np、方差np(1-p)。","example":"掷硬币5次（p=1/2），正面3次概率=C(5,3)(1/2)^5=10/32。","tip":"二项分布判据：独立重复、每次概率不变；期望np方差np(1-p)。"},"3|3|k|4":{"explain":"正态曲线关于均值μ对称呈钟形，σ决定胖瘦。3σ原则：落在μ±σ内概率约68.3%、μ±2σ约95.4%、μ±3σ约99.7%。由对称性P(X小于μ)=0.5，左右对称区间概率相等。","example":"X~N(2,σ^2)且P(X大于4)=0.1：由对称性，X小于0与X大于4关于均值2对称，故P(X小于0)=0.1。","tip":"正态题画对称草图，利用「对称区间概率相等」转化。"},"3|3|d|0":{"explain":"常见错误：取值漏（如「至少一个」的取值从1开始）、概率重复计数。流程：先审清试验（放回与否、有序无序）→确定X的所有取值→逐一算概率（古典概型计数）→列表检验和为1。","example":"袋中3红2白，有放回取3次，X为红球次数：X取0、1、2、3，每次p=3/5，按二项分布算各概率。","tip":"审题先定「试验规则」，取值从最小到最大列全。"},"3|3|d|1":{"explain":"二项分布：n次独立重复（有放回或重复试验），每次概率不变。超几何：不放回抽取（从N个含M个次品中取n个，次品数X服从超几何），概率随抽取变化。记忆：放回→二项，不放回→超几何。","example":"从10件产品（含3件次品）取2件，X为次品数：不放回抽取为超几何分布；有放回重复抽取为二项分布。","tip":"判断模型看「放回与否」与「每次概率是否独立不变」。"},"3|3|d|2":{"explain":"条件概率P(A|B)是「B已发生前提下A的概率」，分母是P(B)。独立满足P(AB)=P(A)P(B)，即互不影响，此时P(A|B)=P(A)。独立看是否影响，条件概率看前提。","example":"P(A)=0.5、P(B)=0.4、P(AB)=0.2，P(A|B)=0.2/0.4=0.5=P(A)，A、B独立。","tip":"条件概率分母是已知事件概率；独立则P(AB)=P(A)P(B)。"},"3|3|e|0":{"explain":"解答题流程：审题定X取值→求分布列→算期望方差→结合问题决策（比较期望或方差选方案）。书写规范：分布列表格+检验。","tip":"分布列检验和为1再算期望，算错一步全错。"},"3|3|e|1":{"explain":"高频：判二项分布（独立重复、每次概率p不变）→套P(X=k)公式→E(X)=np。常见背景：射击、质检、投篮等重复试验。","tip":"独立重复判断三要素：n次、独立、概率恒定。"},"3|3|e|2":{"explain":"正态小题：给μ、σ求区间概率。用对称性：P(X大于μ+a)等于P(X小于μ-a)；区间概率=0.5±对称部分。画标准钟形图最直观。","tip":"画对称草图，左右对称概率相等，总量1。"},"3|3|e|3":{"explain":"决策题：两种方案各有期望方差，期望大（收益类）或小（成本类）者优；期望相同时方差小者更稳定更优。写清比较过程与结论。","tip":"先比期望定优劣，期望相同再比方差稳定性。"},"3|4|k|0":{"explain":"函数关系是确定性的（x确定y唯一确定）；相关关系是「趋势性」的（x增大y大体增大但不唯一）。散点图看相关：点云从左下到右上正相关、左上到右下负相关、杂乱无相关。","example":"身高与体重是相关关系（同身高者体重不同）；圆的面积S=πr^2是函数关系（r确定则S唯一确定）。","tip":"相关关系不说「确定」，说「有趋势、大致」。"},"3|4|k|1":{"explain":"最小二乘：让残差平方和最小的直线。b̂分子是x、y离差乘积和，分母是x离差平方和；â由直线过样本中心(x̄,ȳ)得到，故回归直线必过样本中心点。先求平均数再代公式。","example":"样本中心(3,5)，b̂=2：回归直线过样本中心，â=ȳ-b̂x̄=5-2×3=-1，故回归方程ŷ=2x-1。","tip":"回归直线必过样本中心点(x̄,ȳ)，可用来检验。"},"3|4|k|2":{"explain":"相关系数r∈[-1,1]：r大于0正相关、r小于0负相关；|r|越接近1线性关系越强、越接近0越弱，|r|=1完全线性相关。注意r只衡量线性相关，非线性相关时r接近0不代表没关系。","example":"r=0.9为强正相关；r=-0.6为中等负相关；r=0.1几乎无线性相关，但可能有非线性关系。","tip":"|r|看强弱、符号看方向，非线性相关r≈0。"},"3|4|k|3":{"explain":"残差=实际值-预测值（观测点与回归线的竖直距离）。残差平方和（或R^2越接近1）越小说明拟合越好。比较两个模型：算残差平方和或R^2选优。","example":"两个模型拟合同一组数据，残差平方和分别为2.5与1.2，后者更小，说明后者拟合效果更好。","tip":"残差是「观测减预测」，平方和小的模型优。"},"3|4|k|4":{"explain":"流程：列2×2列联表→假设H0无关联→算χ^2，用n(ad-bc)^2/[(a+b)(c+d)(a+c)(b+d)]→与临界值比较，3.841对应95%把握→χ^2大则拒绝H0。","example":"χ^2=4.5大于临界值3.841，拒绝零假设「无关联」，认为有95%的把握两变量有关联。","tip":"χ^2越大越有把握说有关联；结论说「有把握认为」不说「一定」。"},"3|4|d|0":{"explain":"防错流程：列表算Σx、Σy、Σx^2、Σxy→求x̄、ȳ→代b̂公式→代â=ȳ-b̂x̄。计算时先算Σxi^2与(Σxi)^2/n的差作分母，分子类似，减少中间误差。","example":"数据(1,2)(2,4)(3,5)：x̄=2、ȳ=11/3，b̂=Σ(xi-x̄)(yi-ȳ)/Σ(xi-x̄)^2=3/2，â=ȳ-b̂x̄=2/3。","tip":"先列表求和再代公式，中间量保留多位小数防误差。"},"3|4|d|1":{"explain":"b̂的斜率含义：「x每增加1个单位，y平均增加（或减少）b̂个单位」。注意关键词「平均」，因为相关关系不是确定性的。回答解释题必须写「平均」二字。","example":"回归方程ŷ=3+0.5x：x每增加1个单位，y平均增加0.5个单位，注意「平均」二字不可省。","tip":"解释b̂写「平均变化」，加「单位」表述完整。"},"3|4|d|2":{"explain":"规范表述：「在犯错误的概率不超过α的前提下，认为X与Y有关联」或「有(1-α)×100%的把握认为有关联」。不能写成「一定有关」——统计结论是概率性的。","example":"规范表述：有95%的把握认为吸烟与患病有关联；不能说「吸烟一定导致患病」，统计结论是概率性的。","tip":"结论模板：有99%的把握认为…有关联，勿说绝对。"},"3|4|e|0":{"explain":"解答题：给数据求回归方程→用方程预报（把x代入ŷ）→解释b̂含义。预报值ŷ是「估计值」，与真实观测值y有残差，表述注意区分。","tip":"预报用回归方程代入，结果写「估计/预报」不写「等于」。"},"3|4|e|1":{"explain":"高频考法：给列联表算χ^2、比较临界值、写结论。步骤规范：设H0→算χ^2→比较→下结论，每一步都有分。","tip":"χ^2计算用公式注意行列合计，结论按临界值对应把握度写。"},"3|4|e|2":{"explain":"新考点：给残差图判断拟合（残差点随机分布好、有规律差）、给r判断相关强弱方向、比较模型用残差平方和或R^2。","tip":"残差图点无规律随机分布说明拟合好。"},"3|4|e|3":{"explain":"概念题：看图说话——点云方向定正负、聚散程度定强弱（紧密|r|大）。与「r=0不相关」「|r|=1完全相关」等判断搭配考查。","tip":"看图先看方向再看聚散，r只反映线性相关。"},"4|0|k|0":{"explain":"导数解答题「标准流水线」：①写定义域；②求导；③解f'(x)=0的根，含参要分类；④列表写区间、符号、单调、极值；⑤比较极值与端点求最值。每一步都有步骤分。","example":"f(x)=x^3-3x+1：定义域R，f'=3(x+1)(x-1)，列表得极大值3、极小值-1，再比较端点得闭区间最值。","tip":"列表是最清晰的呈现方式，单调区间用开区间写。"},"4|0|k|1":{"explain":"分类标准三来源：①f'(x)是否为二次型、二次项系数符号；②判别式符号（有无根）；③根的大小（两根比较、根与定义域端点比较）。先定标准再逐类讨论，每类写完整单调区间。","example":"f(x)=x^3-ax：a≤0时f'≥0恒增；a大于0时有两个增区间一个减区间，按a与0的关系分类讨论写全。","tip":"讨论完自检：参数的所有取值是否全覆盖、各类是否重叠。"},"4|0|k|2":{"explain":"核心转化：f(x)≥a对所有x成立⇔a≤f(x)的最小值；f(x)≤a恒成立⇔a≥f(x)的最大值。优先分离参数（能分离则研究新函数最值），不能分离则直接研究f(x)-a的最值。","example":"x∈[1,e]时lnx+a≥0恒成立：分离得a≥-lnx，右式在x=1处取最大值0，故a≥0。","tip":"恒成立取「最值」而非「极值」，别忘了比较端点。"},"4|0|k|3":{"explain":"判定流程：①求导定单调区间；②在每个单调区间内看端点（或极限）函数值符号；③符号相反则该区间内有唯一零点（零点存在性定理+单调性）。零点个数=各单调区间零点数之和。","example":"f(x)=e^x-x-2：f'=e^x-1，x小于0递减、x大于0递增，f(0)=-1小于0且f(2)大于0，故恰有两个零点。","tip":"单调区间内至多一个零点，符号相反必有零点。"},"4|0|k|4":{"explain":"两个经典不等式：e^x≥x+1（x=0取等）、lnx≤x-1（x=1取等），都是切线不等式，切点取等，用于证明与估值。常用变形：e^x≥ex（x≥1）、lnx≤x/e。","example":"证e^x大于x+1（x≠0）：由e^x≥x+1且等号仅当x=0取到，故x≠0时严格大于成立。","tip":"放缩方向：证「大于」用下界、证「小于」用上界，取等点要说明。"},"4|0|k|5":{"explain":"当f'(x)=0是超越方程解不出时：设隐零点x0，利用f'(x0)=0的关系式（如e^x0=x0+2）整体代换目标式中的指数对数，把目标式化简成不含x0的式子或易判符号的式子。","example":"设f'(x)=e^x-2x-1=0的根为x0，由e^x0=2x0+1整体代换，把f(x0)化简为不含e^x的式子再判符号。","tip":"隐零点「设而不解」，用f'(x0)=0代换化简。"},"4|0|d|0":{"explain":"极值点偏移：x1、x2是f(x)=b的两零点，证x1+x2与2x0的关系。主流方法：构造F(x)=f(x)-f(2x0-x)，判单调性证符号；或借助对数均值不等式。","example":"f(x)=lnx-x两零点0小于x1小于1小于x2，证x1+x2大于2：构造F(x)=f(x)-f(2-x)，判F(x)符号得结论。","tip":"偏移问题固定套路：构造对称差函数→判单调→得符号。"},"4|0|d|1":{"explain":"混合式先「同构」：把式子变形为同一函数f的不同自变量，如xe^x与(lnx)e^(lnx)同构，用f的单调性比较。识别技巧：把lnx当x'、e^x当「倒数」看结构。","example":"比较x·e^x与lnx：同构f(t)=t·e^t，因lnx=e^(lnx)·lnx，只需比较x与lnx的大小，f单调递增。","tip":"同构关键：变形为f(g(x))与f(h(x))形式，再比g(x)与h(x)。"},"4|0|d|2":{"explain":"两步法：①必要条件：取特殊点（端点、极值点）代入不等式得参数范围（缩窄搜索区间）；②充分性：证明该范围内原不等式恒成立。逻辑上「必要探路+充分验证」完备，但充分性证明常是难点。","example":"f(x)≥0恒成立：先取x=0得必要条件a≥1，再证明a≥1时原不等式恒成立，两步完备。","tip":"探路得候选范围，必须再证充分性才算完整解。"},"4|0|e|0":{"explain":"压轴第一问固定送分：求切线（在点或过点）、求单调区间（含参讨论）、求极值最值。把基础问练到「不假思索」，为第二问留时间。","tip":"第一问求完检查定义域与端点，基础分必拿。"},"4|0|e|1":{"explain":"压轴核心：f(x)≥g(x)恒成立或存在x使成立。分离参数→求新函数最值；或构造差函数分类讨论。答案常含参数分段结果，书写规范分类清楚。","tip":"存在性「能成立」与恒成立方向相反，审题看「任意」还是「存在」。"},"4|0|e|2":{"explain":"热点题型：f(x)零点个数随a变化求a范围。分离参数a=g(x)，画g(x)图象（单调、极值、极限），水平线y=a与图象交点个数即零点个数，写分段结论。","tip":"画趋势图注意定义域端点极限，交点个数在极值处变化。"},"4|0|e|3":{"explain":"比较a、b、c大小：识别结构构造f(x)（如x·lnx、e^x/x、lnx/x），把数写成f(不同自变量)形式，用导数判单调性比大小。平时积累常见同构结构。","tip":"构造f后先求导定单调，再比自变量大小。"},"4|1|k|0":{"explain":"整体代换法：令t=ωx+φ，把sin t的性质「翻译」回x：单调区间解不等式、对称轴解t=π/2+kπ、对称中心解t=kπ、最值看sin t=±1。统一流程，勿对x直接套公式。","example":"y=2sin(2x+π/3)最大值2（sin=1时），对应2x+π/3=π/2+2kπ即x=π/12+kπ。","tip":"整体代换后「解出x」再写区间，k∈Z标注。"},"4|1|k|1":{"explain":"二倍角公式与辅助角公式是两大化简工具：sin2x=2sinxcosx；asinx+bcosx=√(a^2+b^2)sin(x+φ)，tanφ=b/a，用于求值域。","example":"sinx+√3cosx=2sin(x+π/3)（a=1、b=√3，√(a^2+b^2)=2，tanφ=√3，φ=π/3）。","tip":"辅助角φ由a、b符号定象限，别只写arctan。"},"4|1|k|2":{"explain":"解三角形三工具：正弦定理（边角互化a=2RsinA）、余弦定理（边与角直接联系）、面积公式（两边夹角）。综合题先统一变量：全部化边或全部化角，再求解。","example":"A=60°、b=4、c=3：由余弦定理a^2=16+9-2·4·3·cos60°=13，面积S=1/2·4·3·sin60°=3√3。","tip":"边角互化方向先定，混合式优先「边化角」或「角化边」选其一。"},"4|1|k|3":{"explain":"应用流程：读题画示意图（标出已知角与边）→找三角形（常需作辅助线构造）→选正弦或余弦定理求解。仰角俯角、方位角是常用角。","example":"测塔高：在距塔底100m处测得仰角45°，直角三角形中塔高h=100·tan45°=100m，画图后直接用正切。","tip":"示意图标清已知与未知，选「够条件」的三角形先解。"},"4|1|k|4":{"explain":"求周长、面积、边长最值两条路：①边化角：用正弦定理把边写成2RsinA，目标式化为三角式，用辅助角与值域求最值；②角化边：用余弦定理+基本不等式（如bc≤((b+c)/2)^2）。","example":"A=60°求b+c最大值：边化角b+c=2R(sinB+sinC)，又B+C=120°，化单一角函数求值域得最大值。","tip":"最值问题边化角时注意角的范围（内角和限制）。"},"4|1|d|0":{"explain":"判断标准：式子含多个角的正弦用边化角，全变角；含a^2、b^2等用角化边，全变边。a/sinA这类齐次式边角可互化。选错方向计算量暴增，先观察结构再动笔。","example":"条件2a·sinB=b：齐次结构边化角得2sinA·sinB=sinB，因sinB≠0得sinA=1/2，A=30°或150°。","tip":"齐次结构边角可互化，优先统一成「好算」的一边。"},"4|1|d|1":{"explain":"已知a、b、A：由正弦定理算sinB，若sinB介于0和1，B有两值（B与π-B），逐一检验A+B小于π。也可用「大边对大角」快速判断：b大于a时B大于A，可能两解。","example":"a=3、b=4、A=30°：sinB=2/3，B≈41.8°或138.2°，两者内角和均可行，故有两解。","tip":"解个数用「大边对大角」或内角和检验，别默认一解。"},"4|1|d|2":{"explain":"求b+c最值：边化角得b+c=2R(sinB+sinC)，和差化积或辅助角求最值；角化边用基本不等式bc≤((b+c)/2)^2。无论哪种，最后验证取等条件（如B=C时）是否成立。","example":"A=60°、a=2，边化角b+c=4(sinB+sinC)/√3，当B=C=60°时取最大值4，取等条件可达到。","tip":"取等条件（B=C或a=b）必须验证成立再下结论。"},"4|1|e|0":{"explain":"给值求值：由已知三角函数值求另一值，注意象限定符号。给值求角：先求角的三角函数值，再结合角的范围（缩小到唯一）定角。角的范围是定符号、定角的关键。","tip":"求角先定范围「唯一化」，符号看象限。"},"4|1|e|1":{"explain":"解答题固定：第一问用正余弦定理求边角，第二问求面积或最值。与向量结合：给向量等式（如a·b=c^2形式）翻译成三角式。","tip":"向量等式先展开成数量积，再翻译边角。"},"4|1|e|2":{"explain":"由图象求A、ω、φ：A看振幅、T定ω=2π/T、φ代入特殊点。再问单调区间、对称性、值域，整体代换处理。","tip":"求φ选最值点代入，比零点更不易出错。"},"4|1|e|3":{"explain":"第2问常考：给定一角（如A=60°）求b+c、bc、面积或周长的范围。边化角是主流，注意B的范围（B∈(0,120°)）影响最值位置。","tip":"边化角后角范围要算准，最值可能在端点取到。"},"4|2|k|0":{"explain":"下标和性质：等差m+n=p+q则am+an=ap+aq，等比则am·an=ap·aq。片段和：等差Sk、S2k-Sk、S3k-S2k仍等差；等比对应仍等比。这些性质能跳步快速解题。","example":"等差{an}中a2+a8=10，由下标和性质2a5=10得a5=5；S4、S8-S4、S12-S8仍成等差数列。","tip":"片段和性质注意「间隔等长」才成立，等比须q≠-1。"},"4|2|k|1":{"explain":"构造法核心：把an+1=pan+q变形为an+1+λ=p(an+λ)，展开对比系数得λ=q/(p-1)（p≠1），则{an+λ}是等比数列！λ是「配凑常数」，先求λ再构造等比。","example":"an+1=2an+3：配凑an+1+3=2(an+3)，{an+3}公比2，an+3=(a1+3)·2^(n-1)。","tip":"λ=q/(p-1)，p=1时是等差递推用累加。"},"4|2|k|2":{"explain":"方法体系：等差/等比→公式法；等差×等比→错位相减；分式型→裂项相消；混合型→分组求和；首尾配对型（等差）→倒序相加（即Sn=n(a1+an)/2的推导法）。按通项结构选方法。","example":"an=2n+3^n：分组求和Σ2n+Σ3^n=n(n+1)+3(3^n-1)/2，两组分别用等差、等比公式。","tip":"倒序相加适用「首尾和恒定」；分组求和先分「类」再各用公式。"},"4|2|k|3":{"explain":"数列单调看an+1-an的正负（与函数单调同理，但自变量是正整数）。求最大项：先找递增转递减的位置；证明不等式：结合单调性与首项。作商法（各项为正）用于等比型。","example":"an=2n-7：作差an+1-an=2大于0恒成立，故递增，最小项为a1=-5。","tip":"数列最值在「由增转减」处，作差判单调再定位。"},"4|2|k|4":{"explain":"压轴题型：证明Σak小于某值，放缩成能求和的式子；an≥某式恒成立求参，分离参数加数列最值；数列与函数综合，把an当自变量代入函数研究。","example":"证Σ1/k^2小于2：放缩1/k^2小于1/[k(k-1)]，裂项相消后求和小于2，达到证明目标。","tip":"放缩目标「能求和」，恒成立先分离参数再求数列最值。"},"4|2|d|0":{"explain":"推导：设an+1+λ=p(an+λ)，展开an+1=p·an+(p-1)λ，与原式对比(p-1)λ=q得λ=q/(p-1)。计算时注意p=1不能用（分母为0），p=1改累加法。","example":"an+1=3an+2：λ=2/(3-1)=1，配凑得an+1+1=3(an+1)，故{an+1}是以3为公比的等比数列。","tip":"p=1时无λ，直接累加；配凑后别忘写「{an+λ}是等比」。"},"4|2|d|1":{"explain":"放缩对象是「不能直接求和的通项」：放成裂项形式1/n^2小于1/[n(n-1)]或等比形式1/n!小于1/2^(n-1)。放太大证不出、放太小无法求和，用目标值反推放缩方向。","example":"证Σ1/k!小于2：k≥2时放缩1/k!小于1/2^(k-1)，等比求和得1+1小于2，放缩程度正好。","tip":"放缩以「刚好能证出目标」为准，宁小勿大。"},"4|2|d|2":{"explain":"流程：分离参数a≥g(n)（或≤）→研究g(n)单调性与最值（作差判单调）→最值常是某整数项，注意n∈N*的取整与端点。","example":"an=1-1/n，a≤an对一切n恒成立：即a≤an的最小值，an递增最小为a1=0，故a≤0。","tip":"数列最值在整数项处，比较相邻两项定位。"},"4|2|e|0":{"explain":"混合题：一个等差一个等比，用「下标和性质」或「错位相减」交叉求解。如{an}等差{bn}等比，求an·bn的和用错位相减。","tip":"交叉运算看清下标对应，错位相减乘的是等比公比。"},"4|2|e|1":{"explain":"解答题两大主力：给分式通项求和（裂项）、给等差×等比求和（错位相减）。步骤规范+化简准确是拿分关键，写完可用「小n检验」：代入n=1、2核对。","example":"Σ1/[k(k+1)]=1-1/(n+1)：裂项后中间全消；代入n=1检验，左边1/2、右边1/2吻合，可快速自查。","tip":"求和结果用n=1、2代入检验，快速自查。"},"4|2|e|2":{"explain":"压轴问：证Σak小于C。常用放缩：1/k^2小于1/[k(k-1)]裂项求和、2^k型等比放缩、对数放缩，放缩后与C比较。","tip":"放缩后能求和是关键，方向与不等号一致。"},"4|2|e|3":{"explain":"新定义题：读懂新概念（给出运算规则或性质）→验证特例理解规则→把新定义「翻译」成等差等比或递推→用熟悉方法求解。本质是阅读理解+迁移。","tip":"先举小例子理解定义，再找与等差等比的联系。"},"4|3|k|0":{"explain":"证明转化链：线线平行↔线面平行↔面面平行；线线垂直↔线面垂直↔面面垂直。证题倒推：要证面面垂直→证线面垂直→证线线垂直，逐层找「够条件」的那一层。","example":"证面面垂直：先证直线l垂直于β，再说明l在α内，由判定定理「面过线垂则面垂直」得α⊥β。","tip":"倒推分析法：从结论出发反推需要的条件，逐步找齐。"},"4|3|k|1":{"explain":"建系原则：三条两两垂直的直线作轴，原点选「好求坐标」的点。长方体、直棱柱、正棱锥天然有垂直结构。坐标求法：先定原点，各点按「沿轴平移」写出坐标，注意中点公式。","example":"正方体ABCD-A1B1C1D1以A为原点建系：B(1,0,0)、C(1,1,0)、A1(0,0,1)，坐标沿轴平移直接写出。","tip":"坐标算完用「中点、对称」检验，防低级错误。"},"4|3|k|2":{"explain":"向量法求角统一为「算两向量夹角」：线面角sinθ=|cos〈l,n〉|（方向向量与法向量）；二面角cosθ=±cos〈n1,n2〉（两法向量，符号看锐钝）。公式套用前先求对向量。","example":"线面角：l=(1,1,0)、n=(0,0,1)，sinθ=|cos(l,n)|=0，故线面角为0°，直线在平面内。","tip":"线面角用正弦、二面角用余弦，符号结合图形。"},"4|3|k|3":{"explain":"距离统一思路「投影」：点到平面距离=PA在法向量n方向投影长度=|PA·n|/|n|。线面距离（线平行面时）=线上任一点到平面距离；面面距离同理。异面直线距离用公垂线或向量法。","example":"正方体棱长1，A1到平面AB1D1的距离：法向量n=(1,1,1)，d=|A1A·n|/|n|=1/√3=√3/3。","tip":"线面、面面距离都「化归」为点面距离。"},"4|3|k|4":{"explain":"翻折问题核心「找不变量」：翻折前后长度不变（折痕上点不动）、垂直关系（折痕）不变。动点问题：设参数t表示动点坐标（沿棱或面内运动），把条件翻译成方程解t。","example":"矩形沿对角线翻折：对角线长度不变、折痕处垂直关系不变；翻折后求二面角用向量法建系计算。","tip":"翻折抓「折痕上的点不动、长度不变」；动点参数范围要写。"},"4|3|d|0":{"explain":"两法向量夹角与二面角「相等或互补」。判断：①观察图形直观判断锐钝；②法向量方向「同向则补角、反向则相等」（结合图形定）；③实在不行代入特殊点验证。","example":"两法向量夹角60°，但观察图形知二面角开口向外为钝角，故二面角为120°，锐钝判断结合图形。","tip":"算完夹角先定锐钝再写答案，符号错了全题错。"},"4|3|d|1":{"explain":"翻折不变量的「三不变」：①线段长度不变；②折痕上的垂直关系不变；③折痕所在直线不变。变化的是「空间角度」。分析时把「翻折前平面图」与「翻折后立体图」对照找等量关系。","example":"正方形翻折前后：边长、折痕处的垂直关系不变，翻折后顶点位置变化，用不变量列等量关系求解。","tip":"长度与折痕垂直不变，角度可变，对照两图分析。"},"4|3|d|2":{"explain":"套路：设动点P在棱（面）上，P=A+t·向量AB（0≤t≤1），用t表示坐标；把「存在性」条件（垂直、平行、角、距离）写成关于t的方程或不等式；解出t并检验范围。","example":"P在棱B1C1上，设BP=t·BC方向表示坐标，由AP⊥BD列数量积方程解出t，再检验t∈[0,1]。","tip":"t的范围限定动点位置，解出的t必须在[0,1]等范围内。"},"4|3|e|0":{"explain":"解答题固定两问：第一问证平行或垂直（综合法），第二问求空间角（向量法）。综合法证第一问、向量法解第二问是标准配置。","tip":"第一问综合法证完，第二问建系求坐标要准。"},"4|3|e|1":{"explain":"常考结合：用「等体积法」求点到面距离：V(锥)=1/3·S·h，同一锥体换底面列等式求h。或建系用向量距离公式。等体积法不用建系，适合综合法场景。","tip":"等体积法：换底面列方程求高，注意底面积对应。"},"4|3|e|2":{"explain":"切接问题：外接球找球心（各顶点到球心等距）、内切球用等体积法（V=1/3·S表·r）。构造直角三角形（球心、截面圆心、顶点）列勾股方程。","tip":"外接球优先找「体对角线中点」，内切球用等体积。"},"4|3|e|3":{"explain":"热点题型：问「是否存在点P使…」。先假设存在设参数，解出满足条件的参数值，再判断是否在范围内——「假设-求解-检验」三步。","tip":"假设存在→解参数→检验范围，三步完整作答。"},"4|4|k|0":{"explain":"三大曲线定义是「轨迹观」：椭圆是距离和定值，双曲线是距离差绝对值定值，抛物线是到点与直线距离相等。定义可用于求轨迹方程和焦半径，如椭圆|PF1|+|PF2|=2a。","example":"动点P满足|PF1|+|PF2|=6且|F1F2|=4：因6大于4符合椭圆定义，故轨迹为椭圆，2a=6即a=3。","tip":"求轨迹优先想定义法，符合定义直接写方程。"},"4|4|k|1":{"explain":"标准流程：直线y=kx+m代入曲线方程→整理二次方程→写判别式Δ与韦达定理x1+x2、x1x2→后续问题（弦长、面积、中点）全部用这两式「设而不求」表达。","example":"y=kx+1与x^2/4+y^2=1联立：(1+4k^2)x^2+8kx=0，Δ=64k^2≥0，恒有两个交点（k≠0时）。","tip":"联立前先讨论k不存在；Δ≥0给k的范围别忘了。"},"4|4|k|2":{"explain":"弦长公式由两点间距离加韦达定理推导：|AB|=√(1+k^2)|x1-x2|。三角形面积=1/2×弦长×点到直线距离，把弦当底、原点到直线距离当高。","example":"直线与曲线交点A、B，|AB|=√(1+k^2)·√((x1+x2)^2-4x1x2)。","tip":"面积「弦长×距离/2」，距离是原点到直线公式。"},"4|4|k|3":{"explain":"点差法：设弦两端点A(x1,y1)、B(x2,y2)，分别代入曲线方程后两式相减，利用中点坐标与斜率化简，直接得「弦斜率×中点关系」。用于求中点弦方程、弦中点轨迹。","example":"椭圆x^2/4+y^2=1中，弦中点(1,1/2)：点差得斜率k=-b^2x0/(a^2y0)=-1/2。","tip":"点差法免联立，直接得斜率与中点关系式。"},"4|4|k|4":{"explain":"两步走：①特殊化：取特殊直线（垂直x轴、过原点等）猜出定点/定值；②一般化：设直线y=kx+m，联立韦达，把目标式化简为与k、m无关的常数（利用m与k的关系消参）。","example":"先取y=0与x=1两条特殊直线探路，两情形公共点即猜出定点，再设y=kx+m用韦达定理证明。","tip":"特殊探路定结论，一般证明用「韦达整体代入」消参。"},"4|4|k|5":{"explain":"应试策略：第一问（求方程）必须拿满分；第二问设直线先问自己「斜率可能不存在吗」——过定点的竖直直线常是遗漏点，设x=ty+n（可表示竖直线）可绕开讨论。","example":"第二问设直线为x=ty+n代入抛物线y^2=2px，可统一表示竖直线，避免斜率不存在的分类讨论。","tip":"设x=ty+n可统一处理斜率不存在，减少分类。"},"4|4|d|0":{"explain":"化简技巧：①韦达定理结果先「备好」整体代入；②对称式（x1+x2、x1x2的组合）不要展开成单个x；③出现√(1+k^2)与Δ组合时先平方化简；④写一步验一步防错。","example":"弦长平方先分别算Δ与1+k^2再开方；x1+x2、x1x2的对称式整体代入，不逐项展开防出错。","tip":"设而不求+整体代入，对称式绝不展开。"},"4|4|d|1":{"explain":"找规律技巧：取两条特殊直线（如垂直于x轴、水平线）分别算目标值，交出的公共点或公共值即答案；再设一般直线用韦达定理证明。特殊化「猜」，一般化「证」。","example":"取过定点(1,0)的竖直与水平两条直线分别算出目标值，公共结论即定点定值，再作一般性证明。","tip":"两条特殊直线求交点/定值，直接得结论再证明。"},"4|4|d|2":{"explain":"流程：设变量（斜率k或参数）→建立目标函数（面积、弦长、数量积）→求最值：二次型配方、分式型基本不等式或求导。别忘了k的取值范围（来自Δ≥0）参与求最值。","example":"面积S=1/2·|AB|·d，k的范围由判别式Δ≥0限定，目标函数用基本不等式或求导求最值。","tip":"目标函数定义域（k的范围）先求出，最值在范围内取。"},"4|4|e|0":{"explain":"必考小题：定义法或待定系数法求方程、由方程或条件求离心率。基础题，公式与定义熟练即可。","tip":"求方程先定焦点位置（x轴还是y轴）再设方程。"},"4|4|e|1":{"explain":"解答题格局固定：第一问求曲线方程（送分），第二问直线与曲线综合（弦长、面积、定点定值、最值）。第二问按「联立→韦达→目标式」流水线走。","tip":"第一问保证全对，第二问写满步骤拿步骤分。"},"4|4|e|2":{"explain":"焦点弦结论：|AB|=x1+x2+p、y1y2=-p^2、1/|AF|+1/|BF|=2/p、以AB为直径的圆与准线相切。小题直接用结论秒解。","tip":"焦点弦五结论背熟，做题直接套。"},"4|4|e|3":{"explain":"压轴综合：目标式含向量（数量积）或需要求导（函数最值）。流程：几何问题→坐标化→目标函数→代数最值工具。","tip":"向量条件先坐标化，最值工具按目标函数结构选。"},"4|5|k|0":{"explain":"古典概型P(A)=n(A)/n(Ω)中两个「数」都用排列组合数：总数用乘法原理（分步）、事件数按限制条件计数。分子分母计数「口径一致」（都有序或都无序）。","example":"5人选3人按顺序值班：基本事件总数A(5,3)=60，事件「甲在第一个」有A(4,2)=12种，概率1/5。","tip":"分子分母计数方式一致，别一个排列一个组合。"},"4|5|k|1":{"explain":"条件概率：B已发生前提下A的概率=P(AB)/P(B)。全概率：事件A由多个原因B1、B2…Bn导致，P(A)=ΣP(Bi)·P(A|Bi)，即按原因加权求和，用于多步试验。","example":"某产品甲厂造60%（次品率2%）、乙厂40%（次品率3%），抽到次品概率=0.6×0.02+0.4×0.03=0.024。","tip":"全概率「按原因分拆」；贝叶斯（已知结果求原因）用条件概率反推。"},"4|5|k|2":{"explain":"完整体系：分布列取值加概率且和为1；期望E(X)=Σxi·pi看平均水平；方差看波动。线性性质：E(aX+b)=aE(X)+b、D(aX+b)=a^2·D(X)。","example":"X取0、1概率各0.5：E(X)=0×0.5+1×0.5=0.5，D(X)=(0-0.5)^2×0.5+(1-0.5)^2×0.5=0.25。","tip":"先分布列后期望方差，检验分布列和是否为1。"},"4|5|k|3":{"explain":"模型识别口诀：独立重复试验、每次概率不变→二项B(n,p)；不放回抽取（如一批产品抽检）→超几何。二项期望np、方差np(1-p)；超几何期望nM/N。","example":"质检：有放回抽3件，次品数X~B(3,p)为二项分布；无放回抽3件，次品数为超几何分布。","tip":"识别模型三问：放回吗？独立吗？概率变吗？"},"4|5|k|4":{"explain":"综合应用：正态用对称性求概率（3σ原则）；回归用最小二乘法求方程并预报；独立性检验用χ^2判关联。三者常在同一情境题中出现，各按套路解。","example":"X~N(2,4)：P(0小于X小于4)约68.3%（μ±σ区间），再用对称性求其他区间概率。","tip":"综合题分块处理，每个统计工具按各自流程走。"},"4|5|d|0":{"explain":"防错要点：①审清试验（放回/不放回、抽几次）；②X的取值列全（最小到最大）；③概率用古典概型或分布模型算；④检验Σpi=1。写分布列前先「复述试验过程」。","example":"掷两枚骰子，X为点数差：X取0到5，逐一数基本事件建分布列，最后检验各概率和为1。","tip":"取值漏项是最大坑，写完数一遍「和是否为1」。"},"4|5|d|1":{"explain":"独立：P(AB)=P(A)P(B)，即A不影响B；条件概率P(A|B)=P(AB)/P(B)。独立时P(A|B)=P(A)。判断独立看是否相互影响，不看是否互斥，互斥反而极不独立。","example":"P(A)=0.4、P(B)=0.5、P(AB)=0.2，因P(AB)=P(A)P(B)，A、B独立，P(A|B)=0.2/0.5=0.4。","tip":"独立看乘积公式，互斥是「不能同时发生」，两概念无关。"},"4|5|d|2":{"explain":"综合题流程：读频率直方图/茎叶图/散点图→提取频率（面积）→用频率估计概率→求随机变量分布与期望。图表信息提取错误则全盘皆错。","example":"直方图中[60,70)组频率0.2，样本500人则该段100人；抽到该段学生的概率估计为0.2。","tip":"直方图面积=频率，读图先算总面积核对。"},"4|5|e|0":{"explain":"解答题格式：情境描述→设随机变量X→建分布列→算期望方差→决策建议。书写「设、列、算、答」四步完整，情境中的单位别忘。","tip":"建模题先「翻译」情境为随机变量，再走标准流程。"},"4|5|e|1":{"explain":"核心三件套必考：分布列（表格）、期望（加权平均）、方差（波动）。算期望前先检验分布列正确，方差用「E(X^2)-E(X)^2」可简化计算。","tip":"D(X)=E(X^2)-[E(X)]^2，有时比定义式好算。"},"4|5|e|2":{"explain":"稳定考法：回归给数据求方程+预报+解释b̂；独立性检验给列联表算χ^2+结论。两个流程都「套路化」，背熟步骤规范书写。","tip":"χ^2结论按临界值写「有…把握认为有关联」。"},"4|5|e|3":{"explain":"新增热点：条件概率P(A|B)、全概率P(A)=ΣP(Bi)P(A|Bi)、贝叶斯公式。多步试验、抽奖、疾病检测等情境常考。","tip":"全概率按原因分拆求和，条件概率看清「谁已知」。"},"4|6|k|0":{"explain":"数形结合是把代数问题「画出来看」：零点个数看图象与x轴交点、方程根看两图象交点、不等式解集看图象上下位置、最值看图象高低。画图要准（关键点、单调性），草图也有价值。","example":"方程x^2-2x-3=0的根即抛物线y=x^2-2x-3与x轴交点的横坐标：-1和3。","tip":"画图标注关键点（零点、顶点、交点），数形结合快速定位。"},"4|6|k|1":{"explain":"分类讨论三问：按什么分（参数符号、判别式、根大小、位置关系）、分几类（画数轴分区间）、何时停（每类内结论一致）。原则「不重不漏」，写完检查参数全域覆盖。","example":"解|x-1|大于a：a小于0时解集为R；a=0时x≠1；a大于0时x小于1-a或x大于1+a，三类讨论完整。","tip":"分类标准来自「式子结构变化点」，讨论完自检覆盖性。"},"4|6|k|2":{"explain":"化归思想是「变陌生为熟悉」：新定义题化归为旧知识、多变量化归单变量、高次化归低次、几何化归代数。核心是找到「已知模型」与「当前问题」的对应关系。","example":"新定义运算先翻译为向量数量积计算；双变量恒成立问题分离参数化归为单变量函数最值。","tip":"转化要注意「等价性」，化归过程中定义域等条件不能变。"},"4|6|k|3":{"explain":"方程f(x)=0的根⇔函数y=f(x)的零点⇔图象与x轴交点。解不等式⇔比较函数值大小。用函数观点（单调、奇偶、最值）研究方程与不等式，是高中数学的主线思想。","example":"方程2^x=3-x的根即y=2^x与y=3-x图象交点横坐标，数形结合观察得x=1。","tip":"方程问题先想「构造函数」，用函数性质替代硬解。"},"4|6|k|4":{"explain":"两步法：先用特殊值（x=0、1）、特殊位置（垂直、水平）、特殊图形（正方形、正三角形）「猜出」结论；再对一般情形证明。特殊探路降低难度，一般证明保证严谨。","example":"先取x=0代入验证猜出结论，再对一般x严格证明；求定点先取特殊直线猜点再一般证明。","tip":"特殊化只能猜结论，答题必须给出一般性证明。"},"4|6|d|0":{"explain":"找分类标准的方法：①找「临界值」：使式子结构变化的参数值（如分母为0、判别式为0、根相等）；②在数轴上按临界值分区；③每区逐一讨论。临界值通常是「等式成立」处。","example":"解ax^2-(a+1)x+1大于0：临界值a=0（退化为一次）与a=1（两根相等），按a小于0、a=0、0小于a小于1、a=1、a大于1分类。","tip":"临界值=让系数为0、判别式为0、两根相等的参数值。"},"4|6|d|1":{"explain":"草图误差风险：交点位置估错、增减趋势画反。对策：关键点精确（零点、顶点、交点坐标都算出来标注）、趋势由导数（或单调性）确定、含参图象「动起来」观察临界位置。","example":"画y=x^3-3x草图：先标出极值点(-1,2)与(1,-2)再连线，防止增减趋势画反导致结论错误。","tip":"草图标注精确关键点，结论前用特殊值检验。"},"4|6|d|2":{"explain":"常见破坏等价性的操作：两边平方（增根）、乘除含参式子（丢根、变号）、开方取正负（丢负根）、换元后定义域变化。对策：每一步变换标注「等价吗」，解方程后回代检验。","example":"解√(x+1)=x-1：两边平方得x^2-3x=0，x=0或3，回代x=0不满足原式舍去，仅x=3为根。","tip":"平方、乘除含未知数、换元后都要检验根的合理性。"},"4|6|e|0":{"explain":"压轴分类场景：导数含参单调性（系数、判别式、根大小三层次）、恒成立参数分段、圆锥曲线斜率讨论。分类讨论题「分得清、写得全」是拿分关键。","tip":"压轴分类先列「分类标准」，再逐类求解，别边做边想。"},"4|6|e|1":{"explain":"高频用法：零点个数看图象交点、参数范围用「水平线平移」数交点、不等式解集看上下位置。数形结合让「看不见」的代数关系「看得见」。","tip":"参数范围问题：把参数当「水平线高度」，移动数交点。"},"4|6|e|2":{"explain":"典型转化：数列放缩化归为能求和的式子、不等式证明化归为函数最值（构造函数求导）、三角化简化归为单一函数（辅助角）。化归目标明确：变成「会做的」。","tip":"化归方向：陌生→熟悉、复杂→简单、多量→单量。"},"4|6|e|3":{"explain":"全卷渗透的思想：恒成立转化为函数最值、最值问题构造函数求导、范围问题用函数值域、方程根个数用零点定理。见到「求范围」「证不等式」先想构造函数。","tip":"「求范围」三个字出现，优先想构造函数与函数性质。"}},"english":{"0|0|k|0":{"explain":"一般现在时讲「习惯与真理」：经常性动作、客观事实、普遍真理都用它。口诀「三单加 s，其余用原形」，主语是 he/she/it 时动词加 -s。","example":"例句 The earth goes around the sun，goes 是 go 的三单形式；客观真理与时间无关，所以永远用一般现在时。","tip":"客观真理永远用一般现在时，即使主句是过去时。"},"0|0|k|1":{"explain":"一般过去时表过去的动作或状态，常与 yesterday、ago 连用。不规则动词过去式强记：go-went、see-saw、take-took；规则动词加 -ed。","example":"例句 I saw the film yesterday，saw 是 see 的不规则过去式，yesterday 提示动作在过去，所以用过去时。","tip":"不规则动词过去式靠积累，went、saw、took 要记牢。"},"0|0|k|2":{"explain":"现在进行时由「be + 现在分词」构成，强调此刻正在进行的动作，常与 now 连用。口诀「be 加 doing，正在进行中」。","example":"例句 Look! The children are playing football，Look 提示动作正发生，所以用 are playing 而非 play。","tip":"见到 look、listen、now 想进行时，状态动词一般不用于进行时。"},"0|0|k|3":{"explain":"一般将来时三种表达：will do 表临时决定，be going to do 表事先打算，be about to do 表即将发生。判定看「主观意图」还是「客观预测」。","example":"例句 I will help you with your homework，will 表示说话时临时决定，不是事先计划，这正是与 going to 的区别。","tip":"be about to do 不与具体时间状语连用，常接 when 从句。"},"0|0|k|4":{"explain":"现在完成时「have/has + 过去分词」连接过去与现在：强调动作对现在的影响或持续至今，常与 already、yet、since、for 连用。","example":"例句 I have already finished my homework，already 提示已完成且影响现在，所以用 have finished。","tip":"since 后接时间点、for 后接时间段，看到它们先想完成时。"},"0|0|k|5":{"explain":"被动语态「be + 过去分词」表主语是承受者，时态体现在 be 上：is built、was built、has been built。主语与动词是被动关系时用被动。","example":"例句 The bridge was built last year，bridge 是 build 的承受者，was built 表过去被动，缺 be 即错。","tip":"被动时态看 be 的变化，过去分词不变，情态动词后接 be done。"},"0|0|k|6":{"explain":"时态选择「时间状语优先、语境兜底」：since、for、already 指向完成时，yesterday、ago 指向过去时，now 指向进行时，无状语看是否影响现在。","example":"例句 He has lived here since 2010，since 接时间点，表从那时持续至今，主句用现在完成时。","tip":"先圈时间状语再选时态；无状语时看动作是否影响现在。"},"0|0|d|0":{"explain":"两者都涉及过去，区别在关注点：一般过去时只陈述过去的事，现在完成时强调对现在的影响。口诀「过去完成看结果，单纯过去用过去」。","example":"例句 I saw the film 只说看过；I have seen the film 强调「看过了不用再看」，完成时带着对现在的影响。","tip":"看句中是否有 already、yet、since、for，有则用完成时。"},"0|0|d|1":{"explain":"buy、join、leave 等短暂动词表瞬间动作，不能接 for/since，须换延续动词：buy 变 have、join 变 be in、leave 变 be away。","example":"例句 He has been in the army for five years，不能说 joined，因为 join 是瞬间动作，要用 be in 接时间段。","tip":"记牢「短暂换延续」：borrow 换 keep、open 换 be open。"},"0|0|d|2":{"explain":"make、let、see、hear 后接不定式作宾补省略 to，即「make sb do」；变被动语态时 to 必须还原，变成 sb is made to do。","example":"例句 He was made to clean the room，主动句 clean 前无 to，变被动后必须加 to，漏掉即错。","tip":"看到 make、see、hear 的被动式，后面动词必须带 to。"},"0|0|d|3":{"explain":"主将从现：主句用将来时，时间、条件状语从句用一般现在时表将来。标志词 if、when、as soon as、unless。口诀「主将从句现」。","example":"例句 If it rains tomorrow, we will stay at home，if 从句虽有 tomorrow 仍用 rains，主句用 will stay。","tip":"见到 if、when、until 从句先想主将从现，从句用一般现在时。"},"0|0|e|0":{"explain":"语法填空动词题先判断是否作谓语：作谓语则按时态语态变形，结合时间状语与语境，再考虑主谓一致。判定顺序「谓语、时态、语态、一致」。","tip":"先找时间状语和主语确定时态语态，别一上来就填原型。"},"0|0|e|1":{"explain":"被动语态常与情态动词、完成时结合考查：情态动词 + be done、have/has been done。判定主语与动词的主被动关系是关键。","example":"例句 The work must be done today，must 后接 be done 表必须被完成，注意 must 后不加 have。","tip":"情态动词后接 be done，别把时态搞乱。"},"0|0|e|2":{"explain":"since 接时间点或从句、for 接时间段，常与现在完成时连用；since 从句用一般过去时，主句用现在完成时，考查时态呼应。","tip":"since 从句用过去时、主句用完成时，固定搭配直接套用。"},"0|0|e|3":{"explain":"改错常设时态混用陷阱：该用过去时却用现在时。解题须通读全文确定时间线，以首句时态为基准逐个核对动词。","tip":"通读全文画时间线，以首句时态为基准逐一核对动词。"},"0|1|k|0":{"explain":"定语从句由关系词引导，先行词指人用 who、whom、that，指物用 which、that。先看先行词指人指物，再看关系词作何成分。","example":"例句 The girl who is singing is my sister，先行词 girl 指人，who 作从句主语，所以用 who。","tip":"先看先行词指人指物，再看关系词在从句中的成分。"},"0|1|k|1":{"explain":"关系代词在从句中作宾语时可省略：The book (that) I bought is interesting。判定：还原从句后关系词作宾语就可省，作主语不能省。","example":"例句 The book (that) I bought is interesting，that 作 bought 的宾语可省；若作主语则不可省。","tip":"省略只发生在作宾语时，从句缺主语关系词不能少。"},"0|1|k|2":{"explain":"whose 表所属，先行词指人或物均可，在从句中作定语修饰名词。whose 相当于「先行词的」，后面必然接名词。","example":"例句 The boy whose father is a doctor works hard，whose father 表「那个男孩的爸爸」，作从句定语。","tip":"从句中名词前缺「谁的」就用 whose，与指人指物无关。"},"0|1|k|3":{"explain":"关系副词在从句中作状语：where 表地点、when 表时间、why 表原因。口诀「从句缺状语用副词，缺主宾用代词」。","example":"例句 This is the school where I studied，从句 I studied 结构完整、缺地点状语，所以用 where。","tip":"把从句写完整，缺主宾语选代词，缺状语选关系副词。"},"0|1|k|4":{"explain":"that 与 which 多可互换，但先行词是不定代词或受最高级、序数词修饰时只用 that。口诀「不定代词最高级，序数词前只用 that」。","example":"例句 This is the best film that I have ever seen，先行词前有最高级 the best，关系词只能用 that。","tip":"见到 the best、the first、all 等词，关系词一律选 that。"},"0|1|k|5":{"explain":"介词可提到关系代词前构成「介词 + which/whom」，介词由先行词或谓语动词的搭配决定，如 depend on which。介词后不用 that。","example":"例句 The house in which I live is old，live in the house 搭配固定，介词 in 提前接 which。","tip":"先还原动词介词搭配，介词后只用 which/whom。"},"0|1|k|6":{"explain":"非限制性定语从句用逗号隔开，起补充说明作用，不能用 that，指人用 who、指物用 which，which 还可指代整个句子。","example":"例句 Tom, who is my best friend, came to see me，who 引导非限制性从句，前后有逗号，不能用 that。","tip":"看到逗号想非限制性从句，禁用 that。"},"0|1|d|0":{"explain":"只用 that 的情况要死记：先行词为 all、everything 等不定代词，或被最高级、序数词、the only 修饰时；介词之后只用 which。","example":"例句 I have read all the books that you lent me，先行词 all 是不定代词，关系词只能用 that。","tip":"「不定代词、最高级、序数词」用 that，介词后用 which。"},"0|1|d|1":{"explain":"先行词是 the way 时，关系词用 that、in which 或省略，三种都对：the way (that) he works。不能用 how 引导定语从句。","example":"例句 I don't like the way (that) he speaks，the way 表方式，填 that、in which 或省略都行，不填 how。","tip":"the way 后接 that、in which 或省略，永远不接 how。"},"0|1|d|2":{"explain":"关系代词与关系副词的选择：把从句还原，缺主语或宾语用关系代词，缺地点、时间、原因状语用关系副词，勿凭先行词判断。","example":"例句 the days when we stayed 缺时间状语用 when；the days that we spent 缺宾语用 that。","tip":"还原从句成分是唯一标准：缺主宾用代词、缺状语用副词。"},"0|1|d|3":{"explain":"介词 + 关系代词中介词的确定：看从句谓语动词或先行词的固定搭配，如 talk about、depend on。把介词放回从句验证搭配成立。","example":"例句 The man with whom you talked is our teacher，talk with sb 搭配固定，介词 with 提前接 whom。","tip":"把介词放回从句末尾验证搭配是否成立。"},"0|1|d|4":{"explain":"先行词 time 比较特殊：表「次数」用 that 或省略，表「一段时间」用 when，如 the first time (that) I came here。","example":"例句 This is the first time (that) I have visited Beijing，表「第一次」用 that 或省略，从句常用完成时。","tip":"time 作先行词先辨含义：次数用 that 可省，时间段用 when。"},"0|1|e|0":{"explain":"语法填空考关系词选择：先判断从句成分，缺主语宾语用关系代词，缺状语用关系副词；再结合先行词指人指物。","tip":"先还原从句判成分，再定先行词指人指物。"},"0|1|e|1":{"explain":"非限制性定语从句是高频考点，注意 which 可指代前面整个句子的内容，关系词前有逗号，不能用 that。","example":"例句 He was late again, which made the teacher angry，which 指代「他又迟到」整件事，作从句主语。","tip":"which 指代整句时必用 which，不能用 that。"},"0|1|e|2":{"explain":"定语从句与强调句、同位语从句的区分：强调句去掉 It is...that 后句子完整；定语从句 that 作成分；同位语从句 that 不作成分。","tip":"把 that 去掉，看 it 和 that 是否都能删，能删是强调句。"},"0|1|e|3":{"explain":"改错常见关系词误用：that 用于非限制性从句、关系词缺失或多余。逐句检查每个从句的关系词及其成分功能即可发现。","tip":"非限制性从句禁 that；缺主宾时关系词不可省。"},"0|2|k|0":{"explain":"情态动词后接动词原形，无人称变化。can 表能力、may 表允许、must 表必须；否定形式各异：can't、mustn't、needn't。","example":"例句 She can speak three languages，can 后接原形 speak，不随主语变化，这是情态动词的基本特点
