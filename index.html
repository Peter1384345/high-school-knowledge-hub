<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>高中全科知识库 · 语数英物化生重点难点考点</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f1e6; --bg2:#eee5d2;
  --card:rgba(255,253,247,.62); --card2:rgba(255,253,247,.42);
  --panel:rgba(252,248,238,.97); --topbar-bg:rgba(246,241,230,.9); --mask:rgba(70,52,24,.38);
  --border:rgba(122,96,54,.18); --border2:rgba(122,96,54,.34);
  --text:#2b2620; --muted:#6d6252; --faint:#9b9179;
  --accent:#a63a2b;
  --key:#b3372e; --diff:#5b4b8a; --exam:#2f6f5e;
  --cinnabar:#a63a2b; --gold:#d98324; --jade:#4e8a5a;
  --shadow:0 12px 30px rgba(96,74,40,.14);
  --r-lg:16px; --r-md:10px;
  --top-h:62px; --side-w:248px;
  font-size:16px;
}
html[data-theme="dark"]{
  --bg:#211c15; --bg2:#2a241b;
  --card:rgba(255,252,240,.055); --card2:rgba(255,252,240,.035);
  --panel:rgba(34,29,21,.97); --topbar-bg:rgba(30,25,18,.9); --mask:rgba(0,0,0,.55);
  --border:rgba(228,208,166,.16); --border2:rgba(228,208,166,.3);
  --text:#ede4cf; --muted:#b7ab90; --faint:#8b8068;
  --accent:#d98324;
  --key:#e0604f; --diff:#a892e0; --exam:#6fbfa0;
  --shadow:0 16px 38px rgba(0,0,0,.45);
}
html{scroll-behavior:smooth}
body{background:var(--bg); color:var(--text); font-family:'Noto Serif SC','Songti SC','STSong','SimSun','Microsoft YaHei',serif; line-height:1.7; overflow-x:clip; min-height:100vh}
body.no-scroll{overflow:hidden}
::selection{background:rgba(166,58,43,.22)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#a63a2b55,#d9832455); border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ============ 书香背景层（水墨晕染，随科目变色） ============ */
.inkwash{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.inkwash i{position:absolute; border-radius:50%; filter:blur(70px); opacity:.8; animation:inkbreath 22s ease-in-out infinite alternate; transition:background 1.4s ease}
/* 实物照片背景层（每科真实摄影图 + 强色调色膜，加载失败自动回退） */
.photo-bg{position:fixed; inset:0; z-index:0; pointer-events:none; background-size:cover; background-position:center; opacity:.52; transition:opacity 1.4s ease}
.photo-bg::after{content:''; position:absolute; inset:0; background:var(--veil, rgba(96,74,40,.35)); transition:background 1.4s ease}
html[data-theme="dark"] .photo-bg{opacity:.34}
body.no-photo .photo-bg{display:none}
body[data-bg="chinese"] .photo-bg{background-image:url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600&q=70&auto=format&fit=crop'); --veil:rgba(36,104,84,.52)}
body[data-bg="math"] .photo-bg{background-image:url('https://images.unsplash.com/photo-1509228468518-180dd4864904?w=1600&q=70&auto=format&fit=crop'); --veil:rgba(28,52,124,.55)}
body[data-bg="english"] .photo-bg{background-image:url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=1600&q=70&auto=format&fit=crop'); --veil:rgba(120,64,160,.52)}
body[data-bg="physics"] .photo-bg{background-image:url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=1600&q=70&auto=format&fit=crop'); --veil:rgba(40,116,176,.55)}
body[data-bg="chemistry"] .photo-bg{background-image:url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=1600&q=70&auto=format&fit=crop'); --veil:rgba(184,108,36,.52)}
body[data-bg="biology"] .photo-bg{background-image:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=70&auto=format&fit=crop'); --veil:rgba(52,124,64,.52)}
body[data-bg="home"] .photo-bg{background-image:url('https://images.unsplash.com/photo-1455390582262-044cdead277a?w=1600&q=70&auto=format&fit=crop'); --veil:rgba(96,74,40,.38)}
.inkwash i:nth-child(1){width:48vw;height:48vw; left:-13vw; top:-15vh; background:radial-gradient(circle,var(--iw1,#d9cdab),transparent 70%)}
.inkwash i:nth-child(2){width:42vw;height:42vw; right:-11vw; top:18vh; background:radial-gradient(circle,var(--iw2,#c4cda4),transparent 70%); animation-delay:-7s}
.inkwash i:nth-child(3){width:44vw;height:44vw; left:24vw; bottom:-19vh; background:radial-gradient(circle,var(--iw3,#d8cbb0),transparent 70%); animation-delay:-14s}
@keyframes inkbreath{from{transform:translate(0,0) scale(1)}to{transform:translate(3vw,3vh) scale(1.1)}}
html[data-theme="dark"] .inkwash i{opacity:.4}
/* 每科页面整体染色：底色随科目切换，差异一目了然 */
html[data-theme="light"] body[data-bg="chinese"]{--bg:#e9f5ef; --bg2:#dcece2}
html[data-theme="light"] body[data-bg="math"]{--bg:#e9effa; --bg2:#dbe5f5}
html[data-theme="light"] body[data-bg="english"]{--bg:#f2edfa; --bg2:#e8e0f5}
html[data-theme="light"] body[data-bg="physics"]{--bg:#e8f4fb; --bg2:#d9ebf6}
html[data-theme="light"] body[data-bg="chemistry"]{--bg:#faf2e4; --bg2:#f2e3cb}
html[data-theme="light"] body[data-bg="biology"]{--bg:#edf7ec; --bg2:#deefdb}
html[data-theme="dark"] body[data-bg="chinese"]{--bg:#13221b; --bg2:#192b22}
html[data-theme="dark"] body[data-bg="math"]{--bg:#121a2e; --bg2:#18223c}
html[data-theme="dark"] body[data-bg="english"]{--bg:#1d1730; --bg2:#251d3d}
html[data-theme="dark"] body[data-bg="physics"]{--bg:#101f2e; --bg2:#162a3d}
html[data-theme="dark"] body[data-bg="chemistry"]{--bg:#241a0e; --bg2:#2e2313}
html[data-theme="dark"] body[data-bg="biology"]{--bg:#132116; --bg2:#192b1c}
body[data-bg="chinese"]{--iw1:#7fb8a0; --iw2:#e0b890; --iw3:#9cc0b0}
body[data-bg="math"]{--iw1:#7fa0d8; --iw2:#e0c890; --iw3:#9cb0d0}
body[data-bg="english"]{--iw1:#b090d8; --iw2:#e0c890; --iw3:#b0a0d8}
body[data-bg="physics"]{--iw1:#80c0e8; --iw2:#e0b090; --iw3:#98c8e0}
body[data-bg="chemistry"]{--iw1:#e8c080; --iw2:#e0a880; --iw3:#c8b080}
body[data-bg="biology"]{--iw1:#80c890; --iw2:#d8c080; --iw3:#98c8a0}
#fx{position:fixed; inset:0; z-index:1; pointer-events:none}

/* ============ 顶栏 ============ */
.topbar{position:fixed; top:0; left:0; right:0; height:var(--top-h); z-index:40; display:flex; align-items:center; gap:12px; padding:0 16px; background:var(--topbar-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--border)}
.logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px; color:var(--text); text-decoration:none; white-space:nowrap; cursor:pointer; font-family:'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif}
.logo span{background:linear-gradient(90deg,#a63a2b,#d98324,#8a6d3b,#a63a2b); background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:grad 9s linear infinite}
@keyframes grad{to{background-position:300% center}}
.search-wrap{position:relative; flex:1; max-width:520px; margin:0 auto}
.search-wrap .search-ico{position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.7; pointer-events:none}
.search-wrap input{width:100%; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); padding:0 14px 0 38px; font-size:14.5px; outline:none; transition:border-color .25s, box-shadow .25s, background .25s}
.search-wrap input::placeholder{color:var(--faint)}
.search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(166,58,43,.12); background:var(--card2)}
.search-panel{position:absolute; top:48px; left:0; right:0; max-height:min(62vh,560px); overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:14px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:var(--shadow); padding:8px; z-index:60; animation:pop .18s ease}
.search-panel.hidden{display:none}
@keyframes pop{from{opacity:0; transform:translateY(-6px) scale(.99)}to{opacity:1; transform:none}}
.sg-head{display:flex; align-items:center; gap:8px; padding:8px 10px 4px; font-size:13px; font-weight:800}
.sg-head em{font-style:normal; font-size:11px; color:var(--faint); margin-left:auto}
.search-item{display:block; width:100%; text-align:left; padding:9px 12px; border-radius:10px; border:none; background:transparent; color:var(--text); cursor:pointer; transition:background .18s}
.search-item:hover{background:rgba(166,58,43,.07)}
.si-crumb{display:block; font-size:11.5px; color:var(--faint); margin-bottom:2px}
.si-text{display:block; font-size:13.5px}
mark{background:rgba(251,191,36,.32); color:inherit; border-radius:4px; padding:0 2px}
.sg-empty{padding:22px; text-align:center; color:var(--faint); font-size:13.5px}
.top-actions{display:flex; gap:9px; align-items:center}
#reviewBtn{position:relative}
.rv-badge{position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--accent); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:800; box-shadow:0 2px 6px rgba(166,58,43,.35)}
.ghost-btn{background:transparent; border:1px solid var(--border); color:var(--muted); padding:8px 15px; border-radius:11px; cursor:pointer; font-size:13.5px; transition:all .22s; white-space:nowrap}
.ghost-btn:hover{color:var(--text); border-color:var(--accent); box-shadow:0 2px 10px rgba(166,58,43,.14); transform:translateY(-1px)}
.icon-btn{width:38px;height:38px;border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:16px; cursor:pointer; transition:all .22s; display:grid; place-items:center; flex:0 0 auto}
.icon-btn:hover{color:var(--text); border-color:var(--accent); box-shadow:0 2px 10px rgba(166,58,43,.14)}
#menuBtn{display:none}

/* ============ 侧边栏 ============ */
#sidebar{position:fixed; top:var(--top-h); left:0; bottom:0; width:var(--side-w); z-index:35; background:var(--bg2); border-right:1px solid var(--border); padding:14px 12px; display:flex; flex-direction:column; gap:6px; overflow-y:auto}
.side-group{display:flex; flex-direction:column; gap:6px; margin-top:4px}
.side-link{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:12px; border:1px solid transparent; background:transparent; color:var(--muted); font-size:14.5px; cursor:pointer; transition:all .22s; text-align:left}
.side-link:hover{background:var(--card); color:var(--text); border-color:var(--border)}
.side-link.active{background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 16%, transparent),transparent); color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
.sl-ico{font-size:19px; width:24px; text-align:center}
.sl-count{margin-left:auto; font-size:11px; background:var(--card); border:1px solid var(--border); padding:1px 8px; border-radius:999px; color:var(--faint)}
.side-foot{margin-top:auto; padding:12px 8px 4px; font-size:11.5px; color:var(--faint); line-height:1.7; border-top:1px dashed var(--border)}
.mask{position:fixed; inset:0; z-index:34; background:var(--mask); opacity:0; pointer-events:none; transition:opacity .25s}
.mask.show{opacity:1; pointer-events:auto}

/* ============ 主区域 ============ */
#main{position:relative; z-index:2; margin-left:var(--side-w); padding:calc(var(--top-h) + 26px) 22px 90px}
#view{max-width:1000px; margin:0 auto; transition:opacity .18s ease, transform .18s ease}
#view.leaving{opacity:0; transform:translateY(8px)}

/* ============ 首页 ============ */
.hero{padding:30px 6px 24px; text-align:center}
.hero-badge{display:inline-block; font-size:12.5px; padding:5px 15px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); margin-bottom:18px}
.hero-title{font-size:clamp(34px,5.5vw,58px); font-weight:900; letter-spacing:3px; line-height:1.3; font-family:'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; color:var(--text)}
.hero-title .grad{background:linear-gradient(90deg,#a63a2b,#d98324,#a63a2b); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:grad 9s linear infinite}
.seal{display:inline-block; vertical-align:middle; margin-left:10px; width:34px; height:34px; line-height:34px; border-radius:7px; background:#a63a2b; color:#f6f1e6; font-size:18px; font-family:'Kaiti SC','STKaiti',serif; text-align:center; box-shadow:0 2px 8px rgba(166,58,43,.4); animation:sealpulse 3.2s ease-in-out infinite}
@keyframes sealpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hero-sub{margin-top:14px; font-size:clamp(15px,2vw,19px); color:var(--muted); min-height:1.9em; font-family:'Kaiti SC','STKaiti','KaiTi',serif}
.caret{display:inline-block; width:2px; height:1.05em; background:var(--accent); margin-left:3px; vertical-align:-2px; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero-actions{display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap}
.primary-btn{background:linear-gradient(135deg,#a63a2b,#8a2f22); border:1px solid transparent; color:#f6f1e6; padding:10px 22px; border-radius:12px; cursor:pointer; font-size:14.5px; font-weight:700; transition:filter .2s, transform .2s, box-shadow .2s; box-shadow:0 3px 12px rgba(166,58,43,.3)}
.primary-btn:hover{filter:brightness(1.12); transform:translateY(-2px); box-shadow:0 6px 18px rgba(166,58,43,.38)}
.hero-stats{display:flex; justify-content:center; gap:clamp(18px,6vw,64px); margin-top:28px; flex-wrap:wrap}
.stat b{display:block; font-size:clamp(26px,4vw,40px); font-weight:900; background:linear-gradient(180deg,var(--text),var(--faint)); -webkit-background-clip:text; background-clip:text; color:transparent}
.stat span{font-size:13px; color:var(--faint)}
.subj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:18px; margin-top:14px}
.subj-card{position:relative; padding:22px; border-radius:var(--r-lg); border:1px solid var(--border); background:var(--card); cursor:pointer; overflow:hidden; transition:transform .35s cubic-bezier(.22,1,.36,1), border-color .3s, box-shadow .3s; will-change:transform}
.subj-card::before{content:''; position:absolute; inset:0; background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%); opacity:0; transition:opacity .3s}
.subj-card::after{content:''; position:absolute; left:0; bottom:0; height:3px; width:0; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .5s cubic-bezier(.22,1,.36,1); pointer-events:none}
.subj-card:hover{transform:translateY(-5px); border-color:color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow:0 14px 30px rgba(96,74,40,.16)}
.subj-card:hover::before{opacity:1}
.subj-card:hover::after{width:100%}
.sc-top{display:flex; align-items:center; gap:10px}
.sc-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;border:1px solid}
.sc-tag{margin-left:auto; font-size:12px; color:var(--faint); border:1px solid var(--border); padding:2px 10px; border-radius:999px; white-space:nowrap}
.subj-card h2{font-size:20px; margin-top:14px}
.subj-card p{color:var(--muted); font-size:13.5px; margin-top:6px; min-height:3.4em}
.sc-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:12.5px; color:var(--faint); padding-top:12px; border-top:1px dashed var(--border)}
.sc-foot b{color:var(--accent); font-weight:700}
.home-tip{margin-top:26px; padding:14px 18px; border-radius:var(--r-md); border:1px dashed var(--border2); background:var(--card); color:var(--muted); font-size:13.5px}
.site-foot{margin-top:36px; text-align:center; font-size:12px; color:var(--faint); line-height:1.8}
.err{margin:40px auto; max-width:520px; text-align:center; padding:28px; border:1px dashed var(--key); border-radius:var(--r-lg); color:var(--key)}

/* ============ 学科页 ============ */
.subj-head{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:start; padding:26px; border-radius:var(--r-lg); border:1px solid var(--border); background:linear-gradient(160deg, var(--card2), var(--card)); position:relative; overflow:hidden}
.subj-head::after{content:''; position:absolute; right:-90px; top:-90px; width:260px;height:260px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%); pointer-events:none}
.sh-ico{width:64px;height:64px; border-radius:18px; display:grid; place-items:center; font-size:32px; border:1px solid}
.sh-info h1{font-size:26px; line-height:1.3}
.sh-info p{color:var(--muted); font-size:14px; margin-top:6px; max-width:600px}
.sh-trend{grid-column:1/-1; margin-top:6px; border-top:1px dashed var(--border); padding-top:14px}
.sh-trend h3{font-size:13.5px; color:var(--muted); margin-bottom:9px}
.sh-trend ul{display:flex; flex-wrap:wrap; gap:8px}
.sh-trend li{font-size:12.5px; list-style:none; background:var(--card); border:1px solid var(--border); padding:6px 12px; border-radius:10px; color:var(--muted)}
.period-chips{position:sticky; top:calc(var(--top-h) + 8px); z-index:25; display:flex; gap:8px; overflow-x:auto; padding:10px 2px; margin:18px 0 4px; scrollbar-width:none}
.period-chips::-webkit-scrollbar{display:none}
.chip-link{flex:0 0 auto; padding:7px 16px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:13.5px; cursor:pointer; transition:all .25s; white-space:nowrap}
.chip-link:hover{color:var(--text); border-color:var(--accent); transform:translateY(-1px)}
.chip-link.active{background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 60%, #6d28d9)); border-color:transparent; color:#fff; box-shadow:0 6px 20px color-mix(in srgb, var(--accent) 45%, transparent)}

.period{padding:22px 0 8px; scroll-margin-top:calc(var(--top-h) + 70px)}
.period-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.period-head h2{font-size:22px; padding-left:12px; border-left:4px solid var(--accent); line-height:1.2}
.textbook{font-size:12px; color:var(--faint); border:1px solid var(--border); padding:2px 11px; border-radius:999px}
.tips{display:flex; flex-wrap:wrap; gap:8px; margin-top:13px}
.tip-chip{font-size:12.5px; background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--muted); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding:5px 12px; border-radius:10px}
.prog{display:flex; align-items:center; gap:12px; margin:14px 0 2px}
.prog-bar{flex:1; height:8px; border-radius:999px; background:var(--card); border:1px solid var(--border); overflow:hidden}
.prog-bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .5s cubic-bezier(.22,1,.36,1); box-shadow:0 0 10px color-mix(in srgb, var(--accent) 35%, transparent)}
.prog-txt{font-size:12.5px; color:var(--faint); white-space:nowrap}
.modules{display:flex; flex-direction:column; gap:16px; margin-top:12px}

.module{position:relative; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--card); overflow:hidden; transition:border-color .3s, box-shadow .3s; scroll-margin-top:calc(var(--top-h) + 100px)}
.module::after{content:''; position:absolute; left:0; bottom:0; height:2px; width:0; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .55s cubic-bezier(.22,1,.36,1); pointer-events:none}
.module:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow:0 12px 26px rgba(96,74,40,.12)}
.module:hover::after{width:100%}
.module.flash{animation:flash 1.7s ease}
@keyframes flash{0%,100%{box-shadow:none}20%,70%{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 75%, transparent), 0 14px 30px rgba(0,0,0,.25)}}
.m-head{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--border); background:var(--card2)}
.m-num{font-size:13px; font-weight:800; padding:4px 11px; border-radius:9px; border:1px solid}
.m-head h3{font-size:16.5px; flex:1}
.m-prog{font-size:12px; color:var(--faint); border:1px solid var(--border); padding:2px 10px; border-radius:999px; background:var(--card); white-space:nowrap}
.m-body{display:flex; flex-direction:column; gap:18px; padding:16px 18px 18px}
.m-grid{display:grid; gap:18px}
@media(min-width:1024px){.m-grid{grid-template-columns:1.05fr 1fr 1fr}}
.cat{min-width:0}
.cat h4{display:flex; align-items:center; gap:8px; margin-bottom:11px}
.chip{font-size:12.5px; padding:4px 11px; border-radius:999px; font-weight:800}
.chip-key{background:rgba(255,107,107,.13); color:var(--key); border:1px solid color-mix(in srgb, var(--key) 38%, transparent)}
.chip-diff{background:rgba(176,132,255,.13); color:var(--diff); border:1px solid color-mix(in srgb, var(--diff) 38%, transparent)}
.chip-exam{background:rgba(94,234,212,.11); color:var(--exam); border:1px solid color-mix(in srgb, var(--exam) 38%, transparent)}
.chip-book{background:rgba(78,138,90,.12); color:var(--jade); border:1px solid color-mix(in srgb, var(--jade) 38%, transparent)}
.cat h4 em{font-style:normal; font-size:11px; color:var(--faint)}
.cat ul{list-style:none; display:flex; flex-direction:column; gap:7px}
.tb-full{border-bottom:1px dashed var(--border); padding-bottom:4px}
.cat-book ul{flex-direction:row; flex-wrap:wrap; gap:8px}
.cat-book .item{display:inline-flex; align-items:center; gap:8px; padding:6px 13px; border-radius:999px; border:1px solid var(--border); background:var(--card); transition:all .22s}
.cat-book .item:hover{background:var(--card2); border-color:color-mix(in srgb, var(--jade) 55%, transparent); box-shadow:0 2px 10px rgba(78,138,90,.16)}
.cat-book .item .dot{width:15px; height:15px; margin-top:0; border-width:1.5px; flex:0 0 auto}
.cat-book .item .it-body{display:flex; align-items:center; gap:8px}
.cat-book .item .it-text{font-size:13px; line-height:1.5}
.cat-book .item.lv1 .dot{width:15px; height:15px}
.cat-book .item.lv1 .dot::after{width:15px; height:15px; line-height:13px}
.cat-book .item.lv2 .dot{width:15px; height:15px}
.cat-book .item.lv2 .dot::after{width:15px; height:15px; line-height:13px}
.cat-book .item.lv3 .dot{width:15px; height:15px}
.cat-book .item.lv3 .dot::after{width:15px; height:15px; line-height:13px}
.cat-book .item.lv4 .dot{width:15px; height:15px}
.cat-book .item.lv4 .dot::after{width:15px; height:15px; line-height:13px}
.cat-book .item.lv5 .dot{width:15px; height:15px}
.cat-book .item.lv5 .dot::after{width:15px; height:15px; line-height:13px}
.item{display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border-radius:10px; border:1px solid transparent; cursor:pointer; transition:background .22s, border-color .22s}
.item:hover{background:var(--card2); border-color:var(--border)}
.item .dot{flex:0 0 auto; width:18px; height:18px; margin-top:3px; border-radius:50%; border:2px solid var(--border2); background:transparent; position:relative; transition:all .28s; cursor:pointer; user-select:none}
.item .dot::after{content:'✓'; position:absolute; inset:0; display:grid; place-items:center; font-size:11px; font-weight:900; color:#052e1b; opacity:0; transform:scale(.3); transition:all .28s cubic-bezier(.34,1.56,.64,1)}
.item.lv1 .dot{border-color:#9aa0a8; background:rgba(154,160,168,.14)}
.item.lv1 .dot::after{content:'1'; opacity:.7; transform:scale(1); color:#6b7280; font-size:9px}
.item.lv2 .dot{border-color:#4d9bb8; background:rgba(77,155,184,.14)}
.item.lv2 .dot::after{content:'2'; opacity:.8; transform:scale(1); color:#3b7d96; font-size:9px}
.item.lv3 .dot{border-color:var(--gold); background:rgba(217,131,36,.14)}
.item.lv3 .dot::after{content:'3'; opacity:.9; transform:scale(1); color:#b07a1c; font-size:9px}
.item.lv4 .dot{border-color:#d97a2b; background:rgba(217,122,43,.15)}
.item.lv4 .dot::after{content:'4'; opacity:.95; transform:scale(1); color:#b05f1c; font-size:9px}
.item.lv5 .dot{border-color:var(--jade); background:var(--jade); box-shadow:0 0 9px rgba(78,138,90,.5)}
.item.lv5 .dot::after{content:'✓'; opacity:1; transform:scale(1); color:#06281b}
.item .it-body{flex:1; min-width:0}
.item .it-text{font-size:14px; color:var(--text); transition:color .25s, opacity .25s}
.item.lv5 .it-text{opacity:.55; text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--jade) 65%, transparent)}
.item.lv1 .it-text{color:color-mix(in srgb, var(--text) 88%, #9aa0a8)}
.it-more{display:inline-flex; align-items:center; gap:4px; margin-top:7px; font-size:11.5px; color:var(--accent); background:transparent; border:1px solid color-mix(in srgb, var(--accent) 40%, transparent); padding:2px 11px; border-radius:999px; cursor:pointer; transition:all .22s}
.it-more:hover{background:color-mix(in srgb, var(--accent) 14%, transparent); box-shadow:0 0 10px color-mix(in srgb, var(--accent) 25%, transparent)}
.item.open .it-more{background:color-mix(in srgb, var(--accent) 14%, transparent)}
.it-detail{display:none; margin-top:9px; padding:11px 13px; border-radius:10px; background:rgba(0,0,10,.35); border:1px dashed var(--border); animation:slideIn .28s ease}
html[data-theme="light"] .it-detail{background:rgba(30,60,120,.06)}
.item.open .it-detail{display:block}
@keyframes slideIn{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
.ex{font-size:13.5px; line-height:1.75; margin-bottom:8px}
.ex:last-child{margin-bottom:0}
.ex b{display:inline-block; font-size:11.5px; margin-right:7px; color:var(--faint); letter-spacing:1px}
.ex p{display:inline; color:var(--muted)}
.ex-eg b{color:var(--gold)}
.ex-tip b{color:var(--key)}

/* ============ 知识图谱 ============ */
.graph-view{position:fixed; inset:0; z-index:75; background:var(--mask); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; flex-direction:column; animation:gvin .25s ease}
@keyframes gvin{from{opacity:0}to{opacity:1}}
.gv-head{display:flex; align-items:center; gap:14px; padding:12px 18px; background:var(--topbar-bg); border-bottom:1px solid var(--border); flex-wrap:wrap}
.gv-title{font-size:17px; font-weight:800; white-space:nowrap}
.gv-filters{display:flex; gap:8px; flex-wrap:wrap; flex:1}
.gv-fchip{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:12.5px; cursor:pointer; transition:all .2s}
.gv-fchip .fd{width:9px; height:9px; border-radius:50%}
.gv-fchip.on{border-color:var(--accent); color:var(--text); box-shadow:0 2px 10px rgba(166,58,43,.16)}
.gv-fchip.off{opacity:.38}
.gv-close{margin-left:auto}
.gv-wrap{position:relative; flex:1; overflow:hidden; cursor:grab}
.gv-wrap:active{cursor:grabbing}
#gvSvg{position:absolute; inset:0; width:100%; height:100%}
.gv-node{cursor:pointer}
.gv-node circle{stroke:rgba(255,255,255,.55); stroke-width:1.2; transition:all .25s}
.gv-node.dim{opacity:.12}
.gv-node.hl circle{stroke:#fff; stroke-width:2}
.gv-label{display:none; font-size:11px; fill:var(--text); text-anchor:middle; stroke:var(--bg); stroke-width:3; paint-order:stroke; pointer-events:none}
.gv-node:hover .gv-label{display:block}
.gv-edge{stroke:rgba(120,150,230,.2); stroke-width:1; transition:stroke .2s, opacity .2s}
.gv-edge.cross{stroke:rgba(255,190,90,.3); stroke-dasharray:4 3}
.gv-edge.hl{stroke:var(--accent); stroke-width:1.6; filter:drop-shadow(0 0 3px rgba(166,58,43,.4))}
.gv-tip{position:absolute; z-index:5; max-width:300px; padding:9px 13px; border-radius:10px; background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); font-size:12.5px; color:var(--text); pointer-events:none; line-height:1.6}
.gv-tip b{color:var(--accent)}
.gv-foot{padding:9px 18px; font-size:12px; color:var(--faint); text-align:center; border-top:1px solid var(--border); background:var(--topbar-bg)}

/* ============ 浮层 ============ */
.to-top{position:fixed; right:22px; bottom:26px; z-index:50; width:46px;height:46px; border-radius:50%; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:18px; cursor:pointer; opacity:0; transform:translateY(16px); pointer-events:none; transition:all .3s; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.to-top.show{opacity:1; transform:none; pointer-events:auto}
.to-top:hover{border-color:var(--accent); color:var(--accent); box-shadow:0 2px 12px rgba(166,58,43,.3)}
.modal{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:18px; background:var(--mask); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .25s}
.modal.show{opacity:1; pointer-events:auto}
.modal-card{width:min(580px,94vw); background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:22px; box-shadow:var(--shadow); transform:translateY(18px) scale(.97); transition:transform .3s cubic-bezier(.22,1,.36,1)}
.modal.show .modal-card{transform:none}
.modal-top{display:flex; justify-content:space-between; align-items:center}
.mt-subj{font-weight:800; font-size:15px}
.mt-crumb{font-size:12.5px; color:var(--faint); margin:10px 0 8px}
.mt-text{font-size:16.5px; line-height:1.85; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px}
.mt-ex{margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--card); border:1px dashed var(--border); font-size:13.5px; line-height:1.8; color:var(--muted)}
.mt-ex b{color:var(--faint); font-size:11.5px; margin-right:6px; letter-spacing:1px}
.mt-ex-tip b{color:var(--key)}
.mt-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end; flex-wrap:wrap}
.toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); background:var(--panel); color:var(--text); border:1px solid var(--border); padding:10px 24px; border-radius:999px; font-size:14px; z-index:90; opacity:0; pointer-events:none; transition:all .3s; box-shadow:var(--shadow); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.toast.show{opacity:1; transform:translateX(-50%)}

/* ============ 滚动浮现 ============ */
.reveal{opacity:0; transform:translateY(26px); transition:opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1); transition-delay:var(--d,0s)}
.reveal.in{opacity:1; transform:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}.reveal{opacity:1; transform:none}}

/* ============ 电子课本 ============ */
.etb-head{display:flex; gap:18px; align-items:center; padding:24px; border-radius:var(--r-lg); border:1px solid var(--border); background:linear-gradient(160deg,var(--card2),var(--card)); margin-bottom:16px}
.etb-res{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; border:1px dashed var(--border2); border-radius:var(--r-md); background:var(--card); margin-bottom:16px}
.etb-res-t{font-size:13px; color:var(--muted); font-weight:700; white-space:nowrap}
.etb-res-link{display:inline-flex; flex-direction:column; gap:2px; padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:13.5px; text-decoration:none; transition:all .22s}
.etb-res-link span{font-size:11px; color:var(--faint)}
.etb-res-link:hover{border-color:var(--accent); box-shadow:0 2px 10px rgba(166,58,43,.16); transform:translateY(-1px)}
.etb-body{display:grid; grid-template-columns:310px 1fr; gap:16px; align-items:start}
@media(max-width:880px){.etb-body{grid-template-columns:1fr}}
.etb-toc{position:sticky; top:calc(var(--top-h) + 70px); max-height:calc(100vh - var(--top-h) - 130px); overflow-y:auto; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--card); padding:12px}
@media(max-width:880px){.etb-toc{position:static; max-height:none}}
.etb-subjects{display:flex; flex-wrap:wrap; gap:7px; padding-bottom:10px; border-bottom:1px solid var(--border)}
.etb-subj{padding:5px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:12.5px; cursor:pointer; transition:all .2s}
.etb-subj:hover{color:var(--text); border-color:var(--accent)}
.etb-subj.on{color:#fff; background:var(--accent); border-color:transparent; box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent)}
.etb-books{display:flex; flex-wrap:wrap; gap:7px; padding:10px 0; border-bottom:1px solid var(--border)}
.etb-book{padding:4px 11px; border-radius:9px; border:1px solid var(--border); background:var(--card2); color:var(--muted); font-size:12px; cursor:pointer; transition:all .2s}
.etb-book:hover{color:var(--text)}
.etb-book.on{color:var(--text); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent)}
.etb-units{padding-top:8px}
.etb-unit{border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden; background:var(--card2)}
.etb-ut{display:flex; align-items:center; gap:8px; width:100%; padding:10px 12px; background:transparent; border:none; color:var(--text); font-size:13.5px; cursor:pointer; text-align:left; transition:background .2s}
.etb-ut:hover{background:var(--card)}
.etb-ar{color:var(--faint); font-size:11px; width:14px; transition:transform .2s}
.etb-secs{display:flex; flex-direction:column; gap:2px; padding:2px 8px 8px; animation:slideIn .25s ease}
.etb-sec{padding:7px 10px 7px 26px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-size:13px; cursor:pointer; text-align:left; transition:all .18s}
.etb-sec:hover{color:var(--text); background:var(--card)}
.etb-sec.on{color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent)}
.etb-detail{border:1px solid var(--border); border-radius:var(--r-lg); background:var(--card); padding:22px; min-height:440px}
.etb-crumb{font-size:12.5px; color:var(--faint); margin-bottom:12px}
.etb-sec-title{font-size:20px; margin-bottom:6px}
.etb-sec-module{font-size:13px; color:var(--muted); margin-bottom:14px}
.etb-tb{border:1px dashed var(--border); border-radius:12px; padding:13px; margin-bottom:16px; background:var(--card2)}
.etb-tb h4,.etb-cat h4{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.etb-tb h4 em,.etb-cat h4 em{font-style:normal; font-size:11px; color:var(--faint)}
.etb-tb ul,.etb-cat ul{list-style:none; display:flex; flex-wrap:wrap; gap:8px}
.etb-it{display:inline-flex; align-items:flex-start; gap:7px; padding:6px 11px; border-radius:9px; border:1px solid var(--border); background:var(--card); font-size:13px; color:var(--muted); line-height:1.55}
.etb-dot{flex:0 0 auto; width:6px; height:6px; border-radius:50%; background:var(--jade); margin-top:7px; box-shadow:0 0 5px rgba(78,138,90,.45)}
.etb-cats{display:grid; gap:14px}
.etb-cat ul{flex-direction:column; align-items:stretch}
.etb-cat .etb-it{display:flex; width:100%}
.etb-empty{color:var(--faint); font-size:13.5px; text-align:center; padding:30px 10px}

/* ============ 响应式 ============ */
@media (max-width:900px){
  #menuBtn{display:grid}
  #sidebar{transform:translateX(-100%); transition:transform .32s cubic-bezier(.22,1,.36,1); z-index:36; box-shadow:none}
  #sidebar.open{transform:none; box-shadow:var(--shadow)}
  #main{margin-left:0; padding:calc(var(--top-h) + 18px) 14px 80px}
  .logo span{display:none}
  .m-body{grid-template-columns:1fr}
  .sh-trend li{flex:1 1 100%}
  .top-actions .ghost-btn span{display:none}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="inkwash" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="photo-bg" aria-hidden="true"></div>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="菜单">☰</button>
  <a class="logo" data-nav="home" title="返回首页">🎓<span>高中全科知识库</span></a>
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input id="searchInput" type="text" placeholder="搜索知识点 / 公式 / 考点 / 讲解…" autocomplete="off"/>
    <div id="searchPanel" class="search-panel hidden"></div>
  </div>
  <div class="top-actions">
    <button id="etbBtn" class="icon-btn" title="电子课本（按教材单元目录浏览）">📖</button>
    <button id="graphBtn" class="icon-btn" title="知识关系图谱">🗺️</button>
    <button id="reviewBtn" class="ghost-btn" title="间隔重复复习（按遗忘曲线安排）">🔄 <span>复习</span><span id="reviewBadge" class="rv-badge" style="display:none">0</span></button>
    <button id="randomBtn" class="ghost-btn" title="随机复习一条知识点">🎲 <span>随机复习</span></button>
    <button id="themeBtn" class="icon-btn" title="切换明暗主题"></button>
  </div>
</header>

<aside id="sidebar">
  <nav>
    <button class="side-link home" data-nav="home">🏠 首页</button>
    <div class="side-group" id="sideSubjects"></div>
    <button class="side-link" id="sideEtbBtn">📖 电子课本</button>
    <button class="side-link" id="sideGraphBtn">🗺️ 知识关系图谱</button>
  </nav>
  <div class="side-foot">新课标 · 人教版 / 统编版<br/>高一 → 高三 全覆盖<br/>点击知识点可查看详细讲解</div>
</aside>
<div id="mask" class="mask"></div>

<main id="main">
  <section id="view"></section>
</main>

<button id="toTop" class="to-top" title="回到顶部">↑</button>
<div id="modal" class="modal"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>

<div id="graphView" class="graph-view hidden">
  <div class="gv-head">
    <div class="gv-title">🗺️ 知识关系图谱</div>
    <div class="gv-filters" id="gvFilters"></div>
    <button id="gvClose" class="icon-btn gv-close" title="关闭">✕</button>
  </div>
  <div class="gv-wrap" id="gvWrap">
    <svg id="gvSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="gvTip" class="gv-tip hidden"></div>
  </div>

字题：“字义＋画面＋手法＋情感”四步作答","手法赏析题：先点手法名称再结合诗句分析，忌只贴标签","情感分析题：分条作答，复杂情感须逐句逐联分层挖掘","比较鉴赏题：同题材诗作比较意象、情感与手法的异同","形象分析题：概括诗人形象特征并引用诗句佐证"]},{"title":"文学常识与文化常识","keyPoints":["文体常识：古体诗与近体诗、词之豪放婉约、散文与小说分类","作家作品：陶渊明、曹操、李白、杜甫、白居易、苏轼、辛弃疾等","纪年法：干支纪年与年号纪年；月相：朔、望、晦、既望","官职科举：太守、刺史、左迁、拜、除、及第、进士等含义","称谓礼仪：谦称、敬称、讳称的区分与使用场合","地理常识：阴阳（山南水北为阳）、分野、五岳等文化知识"],"difficultPoints":["官职升降用语易混：拜、除表授官，迁、谪、左迁表降职","纪年与月相组合判断难：须结合上下文推算时间关系","谦敬称混用易错：自称用谦称、称人用敬称，须看对象"],"examPoints":["常识选择题：选项常张冠李戴、以今释古，须逐项核对课本","庙号、谥号、尊号区分：如“太祖”是庙号，“武帝”是谥号","科举制度：乡试、会试、殿试与“连中三元”等概念辨析","与课内勾连：《赤壁赋》“壬戌”、《登泰山记》“戊申晦”常入题"]},{"title":"写作：议论文入门（论点、论据、论证）","keyPoints":["论点要求：正确、鲜明、有针对性，中心论点统率分论点","论据要求：典型、真实、新颖，事实论据与道理论据相结合","论证方法：举例、道理、对比、比喻、引用论证各显其效","基本结构：引论（提出问题）—本论（分析问题）—结论（解决问题）","分论点设置：并列、递进、对比三种模式，角度须统一不交叉","拟题技巧：比喻式、引用式、对偶式，题目须揭示中心论点"],"difficultPoints":["论据与论点脱节：事例叙述后须扣题分析，忌简单罗列","分论点易重复交叉：须先界定角度再逐层展开论证","论证浅层化：只叙不析，缺少“为什么”的因果追问"],"examPoints":["材料作文审题：抓关键词句与任务指令，明确情境文体要求","主体段模式：观点句＋阐释＋事例＋分析＋小结五步成段","评分标准：基础等级（内容语言）＋发展等级（深刻丰富文采）","常见失分：偏题离题、观点模糊、素材陈旧雷同","开头结尾：开头亮观点，结尾回扣中心、升华主题"]}]},{"period":"高一（下）","textbook":"必修下册","tips":["阅读经典整本书（《红楼梦》），制定章回阅读计划并做批注","关注社会新闻与热点，积累时评素材，训练思辨表达","文言文学习重在翻译能力，坚持逐字逐句过关","戏剧与小说单元注意比较不同文体，把握文体特征"],"modules":[{"title":"小说与戏剧阅读（祝福、林教头风雪山神庙、雷雨等）","keyPoints":["小说三要素：人物、情节、环境，主题通过三者综合体现","《祝福》倒叙：先写祥林嫂之死再回溯，制造悬念、突出悲剧","祥林嫂形象：勤劳善良却备受封建礼教摧残的悲剧典型","《林教头》风雪描写：推动情节、烘托人物、象征黑暗社会","《雷雨》戏剧冲突：周朴园与鲁侍萍、鲁大海冲突展现阶级对立","人物描写方法：肖像、语言、动作、心理、细节及侧面烘托","环境描写作用：渲染氛围、塑造人物、推动情节、暗示主题"],"difficultPoints":["祥林嫂之死原因复杂，须综合社会环境分析，不可单一归因","次要人物与看客形象作用易忽略，如柳妈、鲁四老爷的帮凶性","戏剧潜台词难懂：须结合人物性格与冲突揣摩言外之意"],"examPoints":["人物形象概括题：分条概括性格并引用文中细节佐证","情节作用题：从结构（铺垫伏笔悬念）与内容（人物主题）作答","环境作用题：社会与自然环境分开答，四点法全覆盖","标题含义题：须挖掘《祝福》式标题的讽刺与象征意味","细节描写题：以山神庙一段为典型训练，析其对情节的作用"]},{"title":"文言文阅读（烛之武退秦师、鸿门宴、谏太宗十思疏、答司马谏议书等）","keyPoints":["《烛之武退秦师》说理艺术：层层深入，以利害打动秦伯","《鸿门宴》对比手法：刘邦项羽性格对照，语言动作传神","《谏太宗十思疏》：居安思危、戒奢以俭，善用比喻论证","《答司马谏议书》驳论：名实之辩，逐条反驳四项责难","重点实词：贰、鄙、阙、济、谢、坐、董、简、盘桓等","通假字：“共其乏困”“距关”“要项伯”“籍吏民”等","古今异义：“山东”“婚姻”“非常”“行李”等词今义不同"],"difficultPoints":["使动、意动、为动用法易混：先判断动词与宾语关系再译","对话体省略句多，翻译须补出省略的主语、宾语","疏、表、书文体差异与奏疏说理结构难掌握"],"examPoints":["翻译题：考查“谢”“坐”“举”等多义实词的语境选择","断句题：借助“曰”“乎”“也”标志与句意双重判断","内容概括题：防“无中生有”“张冠李戴”，须回文比对","默写：“居安思危”“载舟覆舟”等《谏太宗十思疏》名句","劝谏艺术赏析：分析说理语言策略与说服效果"]},{"title":"实用类文本与新闻阅读","keyPoints":["新闻体裁：消息、通讯、特写、评论，讲究真实性与时效性","消息结构：标题、导语、主体、背景、结语，导语概括要旨","新闻六要素：何时、何地、何人、何事、何因、如何","客观性与倾向性：用事实说话，倾向寓于选材与措辞之中","信息筛选整合：定位区间、比对表述、归纳概括三步","图表解读：关注数据极值、趋势与结论之间的逻辑关系"],"difficultPoints":["事实与观点区分难：新闻评论中二者交织，须仔细辨别","信息整合易遗漏重复：须合并同类项，忌照抄原文","图表转文字难：单位、极值、变化趋势表述须准确"],"examPoints":["选择题高频设错：偷换概念、以偏概全、强加因果","非连续性文本：多则材料比对，概括共同与差异信息","新闻评论分析：从立场、针对性、论证方式作答","情境任务题：拟标题、写推荐语，须兼顾内容与表达"]},{"title":"整本书阅读《红楼梦》","keyPoints":["前五回总纲：冷子兴演说、林黛玉进贾府交代人物与家世","宝黛钗爱情悲剧：折射封建家族与礼教对个性的压抑","主要人物：宝玉、黛玉、宝钗、王熙凤、贾母形象鲜明","关键情节：元妃省亲、刘姥姥进园、抄检大观园等","环境映衬：潇湘馆、蘅芜苑等居所布置暗示人物性格","叙事艺术：草蛇灰线、伏脉千里，判词谶语预示命运"],"difficultPoints":["人物立体复杂难把握：宝钗的圆融与世故须辩证看待","判词解读难：如“玉带林中挂”须结合人物命运理解","情节因果网络复杂：前八十回伏笔须整体勾连理解"],"examPoints":["情境化考查：以材料形式考查人物、情节与主题","人物分析题：抓典型言行细节，多角度有依据作答","主题探究题：从爱情悲剧、家族兴衰、社会批判分层分析","细节记忆题：如刘姥姥三进荣国府的作用，须熟读回目"]},{"title":"写作：思辨性表达与议论深化","keyPoints":["思辨写作：一分为二看问题，反对绝对化、片面化","思辨角度：现象与本质、整体与局部、继承与创新、利与弊","递进结构：是什么—为什么—怎么办，层层深入","批判思维：对观点设问质疑，多角度审视，避免盲从","现实针对性：结合时代热点与自身体验，增强说服力"],"difficultPoints":["辩证分析易变“和稀泥”：须有主次倾向，不能各打五十大板","论证深度不足：止于举例，缺少因果分析与价值判断","求新求异易跑题：须紧扣材料核心与任务指令"],"examPoints":["关系型作文：如“坚守与变通”，须阐释二者的辩证关系","多角度立意：比较后选最优角度，深挖材料内涵","发展等级“深刻”：体现在观点辩证与说理透彻","时评类作文：就事论理，观点鲜明，层次清晰"]}]},{"period":"高二","textbook":"选择性必修上中下","tips":["选择性必修选文加深加难，重在迁移运用课内所学","系统整理文言虚词、句式与文学文化常识，形成知识网络","强化逻辑思维训练，写作向思辨性、深刻性进阶","适度拓展课外阅读，开阔视野，为高考素养奠基"],"modules":[{"title":"古代诗歌散文专题","keyPoints":["诗歌流变：诗经楚辞、汉乐府、魏晋诗、唐诗宋词元曲","唐诗题材：送别、边塞、山水田园、咏史怀古、羁旅思乡","宋词风格：豪放（苏辛）与婉约（柳李）的对比鉴赏","散文体裁：论、说、记、序、表、书、赋的文体特点","重要篇目：《将进酒》《蜀道难》《陈情表》《项脊轩志》等","虚词系统：之、其、而、以、于、乃、为用法的全面梳理"],"difficultPoints":["怀古诗双时空结构难：须分清古事、今景、己情三个层面","赋体与骈散结合文体的语言特点难把握","“以”“于”等多义虚词易错：须据语法位置判断词性用法"],"examPoints":["题材归类与情感基调判断为选择题高频考点","诗眼题：找最富表现力的字词并阐释其统摄作用","抒情方式辨析：直抒、借景、托物、用典抒怀","翻译评分细则：实词、虚词、句式各设踩分点","默写跨册整合：高二常考选择性必修新增篇目"]},{"title":"逻辑思维与论述类文本","keyPoints":["论证结构：总分、并列、递进、对比式及论证思路梳理","论据类型与作用：事实论据、道理论据支撑论点的方式","常见逻辑错误：偷换概念、以偏概全、强加因果等","阅读方法：圈点论点句、论据句，理清句间逻辑关系","推理基础：归纳、演绎、类比推理及其文本运用","概念理解：明确概念内涵与外延，防止概念混用"],"difficultPoints":["论证思路梳理难：须逐段概括并连缀成“先…再…最后…”","因果逻辑判断易错：区分因果关系与强加因果","推理形式分析超出直觉，需逻辑知识支撑"],"examPoints":["选择题命题角度：论证方法、论证思路、论据作用","常见设错：把“或然”说成“必然”、扩大范围","论证特点分析题：从结构、方法、语言严密性作答","情境迁移题：用文中观点分析新问题，考迁移能力"]},{"title":"现代文深度阅读（外国小说、学术随笔）","keyPoints":["魔幻现实主义：如《百年孤独》变现实为幻想而不失其真","叙述视角：全知与限知视角及其表达效果","圆形人物与扁平人物：性格发展与单一特征的区别","学术随笔：语言准确严密，观点与材料紧密结合","意象与象征：重复物象承载主题，如《老人与海》的大海","跨文化阅读：理解价值观差异与人类共通主题"],"difficultPoints":["魔幻与现实交织的文本解读难度大，须抓象征意义","叙述视角与叙事节奏分析抽象，学生难以下笔","学术随笔概念密集逻辑跳跃，抓核心观点有难度"],"examPoints":["叙述视角作用题：分析“我”的所见所感带来的真实感","物象作用题：象征义与结构作用双线作答","观点提取题：区分观点句与支撑句，整合成文","中西比较题：以材料对比考查文化理解与思辨"]},{"title":"文言文专题（老子、庄子、屈原列传等）","keyPoints":["诸子散文：语录体、对话体、寓言体的风格差异","《屈原列传》：屈原生平遭遇与太史公的评价态度","重点实词：闻、迁、伐、疏、绌、厌、反、奉、间等","被动句：见、于、为、被及无标志被动句的识别","儒道思想：儒道互补等传统文化精神的当代价值","史传文读法：梳理经历时间线，把握品质与作者褒贬"],"difficultPoints":["诸子思想抽象：须借寓言（如庖丁解牛）理解道论","被动句多种标志辨析难，无标志被动尤易漏判","叙事与议论交织，“太史公曰”的评价立场须辨明"],"examPoints":["史传文阅读为高考主流，人物品质概括为高频题","被动句翻译：“信而见疑，忠而被谤”为经典考点","思想理解题：结合材料谈儒道思想的现实意义","断句与内容理解组合考查，注重课内向课外迁移","实词题常考课内外勾连，须以课内所学推断课外"]},{"title":"语言文字运用基础（病句、成语、连贯）","keyPoints":["病句六类：语序不当、搭配不当、成分残缺赘余、结构混乱、表意不明、不合逻辑","病句标志词：两面词、介词开头、关联词、数量短语","成语三大误区：望文生义、褒贬误用、对象误用","语句衔接：话题一致、逻辑顺序、句式呼应、关联词","语境补写：结合上下文与标点，注意句式内容一致","语言得体：符合场合对象文体，谦敬辞使用规范"],"difficultPoints":["句式杂糅难识别：如“原因是…造成的”类混搭","多层定语、状语语序难判断","近义成语辨析难：如“不孚众望”与“不负众望”"],"examPoints":["病句辨析与修改为必考，须掌握六类典型例句","成语题：结合语境判断，常设对象与感情色彩陷阱","补写句：答案须与上下文句式逻辑严丝合缝","语段综合：病句、成语、连贯融合考查","标点作用：引号、破折号、省略号用法辨析"]}]},{"period":"高三","textbook":"高考总复习","tips":["一轮复习回归教材，梳理考点知识体系，夯实基础","二轮专题突破，按题型专项训练，总结答题规范与模板","建立错题本与素材本，滚动复习，查漏补缺","限时模拟训练，规范书写与卷面，调整应考节奏"],"modules":[{"title":"论述类文本阅读专项","keyPoints":["快速阅读：标论点、圈论据、理结构，把握观点材料关系","三大设错：偷换曲解、逻辑关系错、过度推断","论证分析：结构、方法、语言的严密性","整体把握：中心论点与分论点的层级关系","比对策略：逐词比对，关注“可能”“一定”等限定词"],"difficultPoints":["“无中生有”与“合理推断”界限难把握", yPoints":["词语运用：实词近义辨析与成语意义、色彩、对象","病句修改：六类识别＋保持原意最小改动","句子衔接：话题一致、前后呼应、逻辑顺畅","补写句子：总分、因果、转折、递进逻辑推断","修辞效果：比喻、比拟、排比、夸张等作用分析","表达要求：简明、连贯、得体、准确、鲜明、生动"],"difficultPoints":["主宾搭配与修饰语中心语搭配难判断","补写的隐形逻辑（对照、假设、条件）难识别","修辞效果答题不全：须手法＋内容＋情感＋效果"],"examPoints":["语段综合：成语、病句、连贯、补写融合考查","修辞新考法：分析比喻的相似性，须具体阐释","人称视角题：如“我”“你”转换的表达作用","标点作用题：引号、破折号、省略号语境辨析","压缩扩展：下定义、拟新闻标题等题型回归"]},{"title":"写作专项（审题立意、结构布局、素材运用、卷面）","keyPoints":["审题四步：抓关键词、理任务指令、辨情境、明文体","立意原则：准确切题、深刻透表、新颖独到","结构布局：引—议—联—结框架及递进、对比变体","素材运用：古今结合、一材多用、叙议结合","段落规范：观点—阐释—事例—分析—小结","卷面规范：书写工整、段落分明、标点正确"],"difficultPoints":["立意易“就事论事”或“脱离材料”，须双向把握","“以叙代议”难突破，须强化因果与假设分析","素材陈旧雷同难出彩，须储备时代新鲜素材"],"examPoints":["评分构成：基础等级40分＋发展等级20分","任务驱动作文：须回应写信、谈看法等具体指令","时评思辨趋势：考查对现实问题的理性分析","标题开头是印象分关键：须亮观点有文采","硬伤降等：字数不足、偏题、套作、错别字过多"]}]}]},{"id":"math","name":"数学","icon":"📐","color":"#4dabf7","intro":"数学是研究数量关系与空间形式的科学，高中数学以函数为主线，涵盖代数、几何、统计与概率三大板块，是高考区分度的核心学科。本知识库按教材顺序整理各模块重点、难点与考点，助你高效复习备考。","examTrend":["强调基础与通性通法：集合、复数、向量等基础题占比稳定，重视概念理解与基本公式。","注重情境化与建模：以生产生活、科技为背景的统计概率、函数应用问题明显增多。","压轴题格局稳定：导数与解析几何是压轴主战场，常考查综合性与运算能力。","新题型频现：结构不良题（删选条件）、开放题、新定义题成为命题新方向。","突出数学思想：数形结合、分类讨论、转化化归思想贯穿全卷，思维量持续上升。"],"periods":[{"period":"高一（上）","textbook":"必修第一册","tips":["完成从初中到高中的思维转型，函数是贯穿高中数学的主线，务必建立函数观念。","集合与逻辑用语是工具性知识，熟练数轴、韦恩图与充分必要条件的判断。","函数的概念与性质是重头戏，单调性、奇偶性要结合图象反复训练。","指对函数与三角函数公式多，建议制作公式卡片，天天默写巩固。"],"modules":[{"title":"集合与常用逻辑用语","keyPoints":["集合的三要素：确定性、互异性、无序性；元素与集合的关系用属于∈或不属于∉表示。","常用数集：N自然数集（含0）、N*正整数集、Z整数集、Q有理数集、R实数集。","子集、真子集、集合相等的判定：A⊆B且B⊆A则A=B；空集是任何集合的子集。","集合运算：交集A∩B、并集A∪B、补集∁UA，借助数轴与韦恩图直观求解。","充分条件与必要条件：p⇒q则p是q的充分条件、q是p的必要条件，互推则为充要条件。","含量词命题的否定：全称命题改存在命题、存在命题改全称命题，且结论都要否定。"],"difficultPoints":["含参集合求参数：元素互异性需回代检验，A⊆B时须先讨论A为空集的情形，极易遗漏。","充分必要条件与集合包含关系对应：p是q的充分条件对应A⊆B，方向易搞反。","命题的否定与否命题不同：命题的否定只否定结论，含量词命题的否定易错。","集合运算中含参端点取等问题：边界是否取等号需代入验证，细节易出错。"],"examPoints":["高考选填必考交并补运算，多以一元二次不等式或分式不等式解集为背景。","已知集合关系求参数范围，结合数轴分类讨论，为高频考点。","充分必要条件判断常与函数性质、数列、立体几何等知识交汇命题。","全称命题与存在命题的否定为常考小题，注意量词与结论同时否定。","新定义集合运算题近年出现，考查对新符号新规则的理解与迁移能力。"]},{"title":"一元二次函数方程和不等式","keyPoints":["一元二次方程ax^2+bx+c=0求根公式：x=(-b±√(b^2-4ac))/(2a)。","判别式Δ=b^2-4ac：Δ大于0两不等实根，Δ=0两相等实根，Δ小于0无实根。","二次函数y=ax^2+bx+c(a≠0)：开口方向由a决定，对称轴x=-b/(2a)，顶点坐标。","一元二次不等式解法：先化二次项系数为正，再因式分解或结合图象取解集。","基本不等式：√(ab)≤(a+b)/2（a、b大于0），当且仅当a=b时取等号。","用基本不等式求最值：一正二定三相等，和定积最大、积定和最小。"],"difficultPoints":["含参一元二次不等式：需对二次项系数符号与两根大小分类讨论，层次易乱。","基本不等式求最值的取等条件验证易漏，一正二定三相等缺一不可。","恒成立与能成立问题：转化为最值问题，分离参数技巧较难掌握。","三个二次（函数、方程、不等式）关系综合，图象与代数互译易出错。"],"examPoints":["一元二次不等式解法为必考基础，常以集合运算、函数定义域为载体。","基本不等式求最值为高考热点，小题与解答题均有出现。","含参不等式恒成立求参数范围，分离参数法常与导数结合压轴考查。","三个二次关系综合题考查数形结合思想，是经典考法。"]},{"title":"函数的概念与性质","keyPoints":["函数三要素：定义域、对应关系、值域；判断同一函数须定义域与对应关系都相同。","单调性定义：任意x1小于x2，f(x1)小于f(x2)为增函数，反之为减函数。","奇偶性：f(-x)=f(x)为偶函数，f(-x)=-f(x)为奇函数，前提是定义域关于原点对称。","复合函数单调性：同增异减，内外层单调性相同则增、相异则减。","函数最值：图象法、单调性法、基本不等式法求最值，注意端点与等号条件。","周期性：f(x+T)=f(x)（T≠0），周期函数图象每隔T个单位重复出现。"],"difficultPoints":["抽象函数问题：无解析式，需由性质推结论，对推理与构造能力要求高。","单调性与奇偶性综合：先由奇偶性转化自变量，再用单调性比较大小或解不等式。","含参分段函数单调：需每段单调且分界点处函数值衔接，条件易漏。","求值域方法多（配方法、换元法、分离常数法、判别式法），选错方法易陷计算。"],"examPoints":["函数定义域为必考小题，常与指数对数、根式、分式复合考查。","奇偶性、单调性判断为高频考点，选择填空均有涉及。","利用单调性比较大小或解不等式，常与指数对数函数结合命题。","函数图象识别与变换（平移、对称、翻折）为常考题型，注意特殊点检验。","抽象函数与周期性综合常在选填压轴出现，考查推理能力。"]},{"title":"指数函数与对数函数","keyPoints":["指数幂运算：a^m·a^n=a^(m+n)，(a^m)^n=a^(mn)，a^0=1（a≠0），a^(-n)=1/a^n。","指数函数y=a^x（a大于0且a≠1）：图象过(0,1)，a大于1递增，0小于a小于1递减。","对数定义：a^x=N⇔x=log_a N（a大于0且a≠1，N大于0），指数式与对数式互化。","对数运算：log_a(MN)=log_a M+log_a N，log_a(M/N)=log_a M-log_a N，换底公式log_a b=log_c b/log_c a。","对数函数y=log_a x：图象过(1,0)，与指数函数y=a^x互为反函数，关于直线y=x对称。","指对数比较大小：同底用单调性，异底找中间值（0、1）搭桥或构造函数。"],"difficultPoints":["指对数混合比较大小：底数与真数均不同时，需搭桥或构造同构函数，技巧性强。","指对函数综合性质分析：定义域、值域、单调性、奇偶性叠加，条件易漏。","含参数指对方程与不等式：底数a大于1与0小于a小于1需分类讨论。","对数真数大于0的定义域限制易被忽略，导致解题出错。"],"examPoints":["指对数运算为必考基础，注意对数恒等式a^(log_a N)=N与换底公式运用。","指对数函数图象与性质为高频考点，常考定点、单调区间与值域。","比较大小为高考热点，常与导数、三角函数结合出现在选填压轴。","指数对数模型应用（增长率、半衰期等）为新教材强调的建模考点。","函数零点问题常结合指对数函数考查图象交点个数。"]},{"title":"三角函数（一）","keyPoints":["弧度制：360°=2π，弧度与角度互化，扇形弧长l=αr、面积S=1/2·αr^2。","三角函数定义：sinα=y/r，cosα=x/r，tanα=y/x，其中r=√(x^2+y^2)。","同角关系：sin^2α+cos^2α=1，tanα=sinα/cosα，知一求二注意符号。","诱导公式：奇变偶不变、符号看象限，k·π/2±α的化简规律。","正弦函数y=sin x：定义域R、值域[-1,1]、周期2π，以及单调区间、对称轴与对称中心。","五点法作正弦、余弦、正切函数图象，理解图象与性质的对应关系。","两角和与差公式：sin(α±β)=sinαcosβ±cosαsinβ，cos(α±β)=cosαcosβ∓sinαsinβ。"],"difficultPoints":["已知sinα±cosα求sinαcosα等：平方后需按角所在象限定符号，易漏正负。","诱导公式化简符号判断：先定角所在象限，符号定错全盘皆错。","图象变换：y=sin x到y=Asin(ωx+φ)，先平移后伸缩与先伸缩后平移相位不同。","求三角函数值域：化为y=Asin(ωx+φ)+b形式，注意整体代换与定义域限制。"],"examPoints":["三角函数定义与同角关系为必考小题，常与诱导公式结合化简求值。","单调区间、对称性、最值为高频考点，需整体代换ωx+φ处理。","图象变换与由图象求解析式（A、ω、φ）为经典题型。","三角恒等变换化简求值为解答题的常用入手点。"]}]},{"period":"高一（下）","textbook":"必修第二册","tips":["向量是解决几何与三角问题的利器，坐标运算与数量积务必练熟。","立体几何重在空间想象，多画图、多观察实物，从三视图入手建立空间感。","统计概率贴近生活，注意规范表述、计算准确与图表读取。","解三角形与三角恒等变换公式多，注意公式的正用、逆用与变形用。"],"modules":[{"title":"平面向量与解三角形（含正余弦定理）","keyPoints":["向量加法（三角形法则、平行四边形法则）、减法、数乘运算及几何意义。","向量共线定理：a=λb（b≠0）⇔a与b共线，用于证明三点共线与平行。","平面向量基本定理：不共线向量e1、e2作基底，任一向量可唯一线性表示。","数量积：a·b=|a||b|cosθ=x1x2+y1y2，用于求模、夹角、垂直与投影。","正弦定理：a/sinA=b/sinB=c/sinC=2R，R为外接圆半径，可实现边角互化。","余弦定理：a^2=b^2+c^2-2bc·cosA，已知两边夹角求第三边或已知三边求角。"],"difficultPoints":["向量模与夹角综合：|a±b|平方转化为数量积，注意a·a=|a|^2的运用。","已知两边一对角用正弦定理解三角形可能有两解，需结合大边对大角判断取舍。","判断三角形形状：边化角或角化边，注意锐角、直角、钝角的分类。","数量积最值问题：常与基本不等式、三角函数值域结合，转化方向难把握。"],"examPoints":["向量数量积与坐标运算为必考小题，常考模、夹角、垂直与平行条件。","正余弦定理解三角形为解答题常客，常与面积公式S=1/2·bc·sinA结合。","三角形中求边长、面积、周长最值：边化角后求三角函数值域，近年热点。","向量与三角交汇：利用向量关系求边角，为经典综合题。"]},{"title":"复数","keyPoints":["复数概念：z=a+bi（a、b∈R，i^2=-1），a为实部、b为虚部，纯虚数为bi（b≠0）。","复数相等：a+bi=c+di当且仅当a=c且b=d，用于列方程求参数。","复数四则运算：除法分子分母同乘分母共轭，即(a+bi)/(c+di)=(a+bi)(c-di)/(c^2+d^2)。","复数模：|z|=√(a^2+b^2)，性质|z1z2|=|z1||z2|、|z1/z2|=|z1|/|z2|。","几何意义：复数与复平面内点、向量一一对应，共轭复数关于实轴对称。"],"difficultPoints":["复数除法运算：分母实数化过程符号易错，结果需化为a+bi标准形式。","复数模的最值问题：转化为几何图形（圆、距离）求解，抽象性强。","纯虚数条件：实部为0且虚部不为0，双重条件易漏判。"],"examPoints":["复数四则运算为高考必考第一题，注意i的幂周期性i^4n=1。","复数的模与共轭复数常考，结合几何意义求模的范围。","复数相等列方程求参数为常考题型。","复数与复平面点对应关系，|z-z0|表示距离，用于轨迹与最值问题。"]},{"title":"立体几何初步（点线面位置关系、平行垂直判定与性质）","keyPoints":["平面基本性质：不共线三点确定平面等三个公理与推论，掌握确定平面的条件。","空间点线面位置关系：平行、相交、异面三种，异面直线所成角范围(0,90°]。","线面平行判定与性质：平面外一条直线平行于面内直线，则线面平行。","面面平行判定与性质：一个平面内两条相交直线平行于另一平面，则两面平行。","线面垂直判定与性质：直线垂直平面内两条相交直线，则线面垂直。","面面垂直判定与性质：一个平面过另一个平面的垂线，则两平面垂直。"],"difficultPoints":["异面直线所成角：需平移构造相交直线求角，辅助线做法是难点。","平行与垂直的相互转化：定理选用与推理链条易乱，需熟记判定与性质对应。","三视图与直观图：斜二测画法横不变纵减半，还原几何体空间想象要求高。","组合体表面积体积：分割补形求法易错，球与多面体切接需构造直角三角形。"],"examPoints":["空间点线面位置关系判断为必考小题，常以命题真假判断形式出现。","线面平行垂直证明为解答题第1问必考，推理书写需规范。","几何体表面积与体积计算常考，注意圆柱、圆锥、球的公式。","三视图还原几何体求表面积体积为经典题型。","球与多面体切接问题为选填压轴常客，需找球心与截面。"]},{"title":"统计","keyPoints":["抽样方法：简单随机抽样、分层随机抽样、系统抽样的适用条件与操作步骤。","频率分布直方图：小矩形面积=频率，各频率之和为1，频率=频数/样本容量。","集中趋势：平均数、众数、中位数；离散程度：方差、标准差。","方差公式：s^2=1/n·Σ(xi-x̄)^2，标准差为方差的算术平方根。","百分位数：数据排序后按位置求第p百分位数，反映数据分布位置。"],"difficultPoints":["直方图中求平均数与中位数：中位数是累计频率0.5处的横坐标，易与平均数混淆。","分层抽样各层样本数按比例分配，层内差异与样本量的关系易错。","方差反映波动大小，量纲为原数据平方，与标准差区分易混。"],"examPoints":["频率分布直方图读图计算为高频考点，考查平均数、中位数、方差。","分层抽样为常考小题，注意按比例计算各层抽取数量。","数字特征与实际情境结合（成绩、空气质量）为新课标命题方向。","百分位数计算为新教材新增考点，需掌握定义与算法。"]},{"title":"概率","keyPoints":["古典概型：基本事件有限且等可能，P(A)=n(A)/n(Ω)。","互斥事件：不能同时发生，P(A∪B)=P(A)+P(B)；对立事件满足P(A)+P(Ā)=1。","概率基本性质：0≤P(A)≤1，P(Ω)=1，P(∅)=0。","频率与概率：大量重复试验中频率稳定于概率，频率是概率的近似。","事件运算：并事件、交事件，P(A∪B)=P(A)+P(B)-P(A∩B)。"],"difficultPoints":["古典概型计数：列举法、树状图、排列组合计数，易漏算或重算基本事件。","互斥与对立区分：对立一定互斥、互斥不一定对立，概念易混。","较复杂事件的概率：正确识别并事件与交事件，避免重复计数。"],"examPoints":["古典概型计算为必考小题，常以摸球、掷骰子、抽签为背景。","互斥事件与对立事件概率计算为高频考点。","概率与统计综合题：结合频率分布直方图求概率，解答题常考。","概率与排列组合结合考查计数能力，注意有序与无序。"]}]},{"period":"高二（上）","textbook":"选择性必修第一册","tips":["圆锥曲线是高考压轴主战场，运算量大，建议坚持每日限时计算训练。","空间向量把立体几何代数化，建系与求点坐标是得分关键。","直线与圆是解析几何入门，吃透位置关系判定与距离公式。","整理常用二级结论（焦点弦、中点弦、切线方程），提高解题速度。"],"modules":[{"title":"空间向量与立体几何","keyPoints":["空间向量基本定理：三个不共面向量可表示空间任意向量，基底需不共面。","空间向量坐标运算与数量积：a·b=x1x2+y1y2+z1z2，用于求夹角与垂直。","法向量求法：由平面内两不共线向量建立方程组求解，常取整数解。","线面角：sinθ=|cos〈n,l〉|，即直线方向向量与平面法向量夹角的正弦。","二面角：cosθ=|cos〈n1,n2〉|，两法向量夹角，注意判断锐角或钝角。","点到平面距离：d=|n·PA|/|n|，其中n为法向量，A为平面内任一点。"],"difficultPoints":["建系与求坐标：不规则几何体建系方案选择不当会使坐标难求，需选好原点与轴。","二面角锐钝判断：法向量夹角可能是二面角的补角，需结合图形确定。","动点与存在性问题：设参数表示点坐标，列向量方程求解，运算量大。"],"examPoints":["用空间向量求线面角、二面角为解答题核心，建系、坐标、公式步骤规范是得分关键。","点到平面距离与异面直线距离为选填常考。","平行垂直的向量判定：方向向量共线与法向量数量积为0。","空间向量基本定理与基底表示为概念小题，注意基底不共面条件。"]},{"title":"直线和圆的方程","keyPoints":["直线方程五种形式：点斜式、斜截式、两点式、截距式、一般式Ax+By+C=0。","两直线平行垂直：平行时斜率相等，垂直时k1·k2=-1，注意斜率不存在情形。","点到直线距离：d=|Ax0+By0+C|/√(A^2+B^2)，以及平行线间距离公式。","圆的标准方程(x-a)^2+(y-b)^2=r^2，一般方程x^2+y^2+Dx+Ey+F=0。","直线与圆位置关系：用圆心到直线距离d与半径r比较，相交弦长=2√(r^2-d^2)。","圆与圆位置关系：用圆心距d与两半径和差比较，相交时公共弦为两方程相减。"],"difficultPoints":["切线问题：过圆外一点引切线，斜率不存在情形易遗漏，需分情况讨论。","圆上点到直线距离最值：转化为圆心到直线距离加减半径，几何转化易错。","含参直线过定点问题：整理为关于参数的方程，令各项系数为0求定点。"],"examPoints":["直线与圆位置关系判断为高考必考，常结合弦长、切线命题。","求圆的方程：待定系数法或几何法，注意条件的等价转化。","圆与圆位置关系、公共弦方程（两圆方程相减）为常考。","直线方程与距离公式常与圆锥曲线综合考查。"]},{"title":"圆锥曲线（椭圆、双曲线、抛物线）","keyPoints":["椭圆定义：|PF1|+|PF2|=2a（2a大于|F1F2|），标准方程x^2/a^2+y^2/b^2=1（a大于b大于0）。","椭圆性质：范围、对称性、顶点、焦距2c，离心率e=c/a（0小于e小于1）。","双曲线定义：||PF1|-|PF2||=2a，标准方程x^2/a^2-y^2/b^2=1，渐近线y=±(b/a)x。","抛物线定义：到焦点与准线距离相等，标准方程y^2=2px，焦点(p/2,0)、准线x=-p/2。","焦点三角形：椭圆中由定义与余弦定理求面积，双曲线中注意||PF1|-|PF2||的符号。","直线与圆锥曲线：联立方程用判别式判断位置关系，韦达定理设而不求。"],"difficultPoints":["联立化简计算量大：需整体代入与技巧化简，运算错误率高，是得分瓶颈。","弦长公式|AB|=√(1+k^2)·|x1-x2|与面积表示，需结合判别式求范围。","离心率求值与求范围：建立a、b、c齐次关系或构造不等式，方向难把握。","定点定值问题：先特殊位置探路再证明一般性，消参化归逻辑要求高。"],"examPoints":["椭圆、双曲线基本性质（焦点、离心率、渐近线）为必考小题。","抛物线焦点弦性质为高频考点，|AB|=x1+x2+p等结论可直接使用。","直线与圆锥曲线解答题：求方程、弦长、面积、范围与最值。","离心率计算为热点，常与几何性质结合出现在选填压轴。"]}]},{"period":"高二（下）","textbook":"选择性必修第二、三册","tips":["导数与数列是压轴题两大来源，含参讨论务必专题突破。","计数原理与概率分布环环相扣，注意二项分布与超几何分布的模型识别。","错位相减、裂项相消求和需专项训练到条件反射。","每周安排一次整套真题限时训练，积累时间分配与心态经验。"],"modules":[{"title":"数列（等差数列、等比数列、数列求和与递推）","keyPoints":["等差数列通项an=a1+(n-1)d，前n项和Sn=n(a1+an)/2=na1+n(n-1)d/2。","等比数列通项an=a1·q^(n-1)，前n项和Sn=a1(1-q^n)/(1-q)（q≠1）。","等差中项2b=a+c，等比中项b^2=ac（同号），下标和性质am+an=ap+aq。","求和方法：公式法、错位相减（等差乘等比）、裂项相消、分组求和。","递推求通项：累加法（an+1-an=f(n)）、累乘法（an+1/an=f(n)）。","an与Sn关系：an=Sn-S(n-1)（n≥2），需验证n=1时是否一致。"],"difficultPoints":["错位相减求和：乘公比错位相减，相减项数处理与符号易错。","裂项相消：1/n(n+1)=1/n-1/(n+1)等变形，系数与项数易漏。","含Sn与an的递推式：消Sn或消an转化，n≥2与n=1验证易漏。","数列不等式证明：放缩技巧（裂项放缩、等比放缩）难掌握，常作压轴。"],"examPoints":["等差等比基本量计算为必考，知三求二（a1、d或q、n、an、Sn）。","数列求和（错位相减、裂项相消）为解答题高频题型。","an与Sn关系求通项为常考点，注意分段表示与n=1验证。","数列与函数、不等式综合为压轴方向，考查放缩与构造。"]},{"title":"一元函数的导数及其应用","keyPoints":["导数定义：f'(x0)=lim(Δx→0)[f(x0+Δx)-f(x0)]/Δx，几何意义为切线斜率。","基本求导公式：C'=0，(x^n)'=nx^(n-1)，(sinx)'=cosx，(lnx)'=1/x，(e^x)'=e^x。","求导法则：和差积商法则，复合函数链式法则，如[(2x+1)^3]'=6(2x+1)^2。","导数与单调性：f'(x)大于0则递增，f'(x)小于0则递减，注意区间连续性。","极值：f'(x0)=0且两侧符号相反为极值点；最值需比较极值与端点值。","切线问题：在点处切线y-f(x0)=f'(x0)(x-x0)，过点切线需设切点坐标。"],"difficultPoints":["含参讨论单调性：参数分类标准的确定（定义域、判别式、根的大小）难把握。","恒成立求参数范围：分离参数或构造函数，隐零点整体代换技巧性强。","极值点偏移与双变量问题：构造对称函数或比值换元，方法抽象难模仿。","零点个数问题：转化为图象交点，需准确画出含参函数图象趋势。"],"examPoints":["求切线方程为高频小题，过某点切线需设切点避免漏解。","求单调区间、极值最值为解答题必考基础问，注意定义域优先。","恒成立求参数范围为压轴核心，常考分离参数与端点效应。","零点个数与参数范围问题为近年高考压轴热点。"]},{"title":"计数原理与二项式定理","keyPoints":["分类加法计数原理与分步乘法计数原理：分类用加、分步用乘，互斥且独立。","排列数A(n,m)=n!/(n-m)!，组合数C(n,m)=n!/[m!(n-m)!]，排列有序组合无序。","组合数性质：C(n,m)=C(n,n-m)，C(n,m)+C(n,m-1)=C(n+1,m)。","二项式定理：(a+b)^n=ΣC(n,k)·a^(n-k)·b^k，通项T(k+1)=C(n,k)·a^(n-k)·b^k。","二项式系数与系数区别：二项式系数为C(n,k)，各项系数含字母系数，赋值法求系数和。"],"difficultPoints":["有限制条件的排列组合：特殊元素优先、捆绑法、插空法、排除法的方法选择。","均匀分组与分配易重复计数：均匀分组需除以组数的阶乘。","求特定项系数：通项中k的确定，二项式系数与项的系数区分易混。"],"examPoints":["排列组合计数为必考小题，常与古典概型结合考查。","二项式定理求指定项系数为高频考点，注意通项公式运用。","赋值法求系数和：令x=1得各项系数和，令x=0得常数项。","二项式系数最大项（n为偶数取中间一项）与系数最大项区分常考。"]},{"title":"随机变量及其分布","keyPoints":["分布列：P(X=xi)=pi，满足pi≥0且Σpi=1，用表格表示随机变量取值与概率。","期望E(X)=Σxi·pi，方差D(X)=Σ(xi-E(X))^2·pi，方差开方为标准差。","期望方差性质：E(aX+b)=aE(X)+b，D(aX+b)=a^2·D(X)。","二项分布：X~B(n,p)，P(X=k)=C(n,k)·p^k·(1-p)^(n-k)，E(X)=np，D(X)=np(1-p)。","正态分布：曲线关于x=μ对称，遵循3σ原则，用对称性求区间概率。"],"difficultPoints":["分布列的建立：正确确定随机变量取值与对应概率，计数与审题易错。","二项分布与超几何分布区分：有放回为二项分布，无放回为超几何分布。","条件概率P(A|B)=P(AB)/P(B)与独立事件区分，公式应用易混。"],"examPoints":["求分布列、期望、方差为解答题核心，常以实际问题为背景建模。","二项分布概率与期望为高频考点，注意独立重复试验判断。","正态分布对称性求概率为常考小题。","利用期望方差比较方案优劣的决策题为新教材强调的应用方向。"]},{"title":"成对数据的统计分析","keyPoints":["相关关系与函数关系：相关关系是非确定性的，用散点图直观判断正负相关。","最小二乘法回归方程：ŷ=b̂x+â，b̂=Σ(xi-x̄)(yi-ȳ)/Σ(xi-x̄)^2，â=ȳ-b̂x̄。","样本相关系数r：|r|越接近1线性相关越强，r大于0正相关、r小于0负相关。","残差分析：残差平方和越小拟合效果越好，用于比较模型优劣。","独立性检验：2×2列联表计算χ^2，χ^2大于临界值则拒绝原假设，认为有关联。"],"difficultPoints":["回归方程计算量大：公式复杂，需先算平均数再代入，数据易错。","回归系数b̂的含义解释：x每增加1个单位y平均变化b̂个单位，表述易混淆。","独立性检验结论表述规范：不能说绝对有关，只能说有把握认为有关联。"],"examPoints":["线性回归方程应用为解答题常考，注意预报值与实际观测值区别。","独立性检验为高频考点，需规范写出零假设与结论。","残差分析与相关系数解读为近年新考点。","散点图与相关系数正负、强弱判断为常考概念题。"]}]},{"period":"高三","textbook":"高考总复习","tips":["一轮复习回归课本，构建完整知识网络，扫清概念与公式盲区。","二轮专题突破高频考点与易错题型，建立并反复翻阅错题本。","三轮强化套卷训练，规范书写推理步骤，控制答题时间节奏。","压轴题策略：先保基础题满分，再集中突破导数与解析几何难点。"],"modules":[{"title":"函数与导数综合（含压轴题策略）","keyPoints":["完整流程：求导、定义域优先、求f'(x)=0的根、列表判单调极值、求最值并规范书写。","含参单调性讨论：按参数对导数符号的影响分类，分类标准完整不重不漏。","恒成立问题：f(x)≥a恒成立⇔a≤f(x)min，分离参数后研究新函数最值。","零点问题：单调性加零点存在性定理，由端点值符号判断零点个数。","常用放缩：e^x≥x+1，lnx≤x-1，用于不等式证明与估值。","隐零点处理：设零点为x0，代入f'(x0)=0整体代换，化简目标式。"],"difficultPoints":["双变量与极值点偏移：构造对称函数或对数均值不等式，方法技巧性强。","含e^x与lnx混合结构：指对互化、同构函数是突破口，识别难度大。","必要性探路与端点效应：先由必要条件猜参数，再证明充分性，逻辑要求高。"],"examPoints":["切线、单调区间、极值最值为压轴题第1问必考基础。","恒成立与存在性求参数范围为压轴核心问，答案常含分类讨论。","零点个数与参数范围结合为近年压轴热点。","选填压轴常考构造函数比较大小，需积累常见结构（如x·lnx、e^x/x）。"]},{"title":"三角函数与解三角形专题","keyPoints":["y=Asin(ωx+φ)性质综合：单调区间、对称轴、对称中心、最值整体代换求解。","恒等变换：两角和差、二倍角公式，辅助角asinx+bcosx=√(a^2+b^2)sin(x+φ)。","正余弦定理与面积S=1/2·bc·sinA综合，边角互化统一变量。","实际应用：测量高度、距离、角度问题，画示意图建立数学模型。","范围最值：边化角转化为三角函数值域，或角化边用基本不等式。"],"difficultPoints":["边角混合条件式：统一为边或角的选择，方向判断错会陷入计算困境。","已知两边一对角的解个数判断：正弦定理可能两解，需检验是否满足内角和。","周长面积最值：基本不等式与辅助角公式的选择及取等条件验证。"],"examPoints":["给值求值、给值求角为必考小题，注意角的范围与符号。","解三角形解答题为稳定考点，常与数列、平面向量结合。","由图象求解析式与性质综合为高频题型。","三角形中求范围最值近年热度上升，常作解答题第2问。"]},{"title":"数列专题","keyPoints":["等差等比性质：下标和性质、中项性质、片段和成等差（等比）性质。","由Sn求an、递推式构造新数列：an+1=pan+q可配凑an+1+λ=p(an+λ)。","求和方法体系：错位相减、裂项相消、分组求和、倒序相加。","数列单调性：作差比较an+1-an符号，用于求最值与证明。","数列与不等式：放缩证明、恒成立问题，常与函数结合压轴。"],"difficultPoints":["构造等比数列的配凑：λ=q/(p-1)的推导与计算易错。","数列不等式放缩：裂项放缩与等比放缩的选择，放缩程度把握难。","含参恒成立问题：分离参数后研究数列最值，注意n的取整。"],"examPoints":["等差等比混合问题：两数列综合求通项与前n项和。","裂项相消与错位相减为解答题主力题型。","数列与不等式放缩为压轴方向之一。","新定义数列题（如X数列、分群数列）近年出现，考查理解迁移。"]},{"title":"立体几何专题","keyPoints":["平行垂直证明：线线、线面、面面之间的转化链条与定理选用。","建系技巧：规则几何体选好原点与坐标轴，准确求各点坐标。","空间角向量法：线面角sinθ=|cos〈n,l〉|，二面角用两法向量夹角。","空间距离：点到平面距离d=|n·PA|/|n|，线面距离转化为点面距离。","翻折与动点问题：翻折前后不变量分析，动点设参数用向量表示。"],"difficultPoints":["二面角锐钝判断：法向量夹角可能为补角，需观察图形或代入检验。","翻折问题：翻折前后哪些量不变（长度、垂直关系），空间想象要求高。","动点存在性问题：设参数求坐标，运算与条件转化复杂。"],"examPoints":["证明平行垂直加求空间角为解答题固定模式。","点到面距离与体积计算结合为常考综合。","球与多面体切接问题为选填压轴常客。","动点与存在性问题近年热度高，考查向量运算与逻辑推理。"]},{"title":"解析几何专题（含压轴题策略）","keyPoints":["圆锥曲线定义、标准方程、几何性质系统梳理，定义用于轨迹与焦半径。","直线与曲线联立：消元得二次方程，判别式、韦达定理、设而不求。","弦长与面积：|AB|=√(1+k^2)|x1-x2|，面积常化为弦长乘距离。","中点弦与点差法：中点坐标代入作差，得斜率与中点坐标关系。","定点定值问题：特殊位置探路、一般位置证明，逐步消去参数。","压轴策略：先保证第1问，第2问设直线方程时注意斜率不存在的分类。"],"difficultPoints":["计算化简冗长：需整体代入与对称式化简，耐心与技巧并重。","定点定值找规律难：先特殊化（取特殊直线）猜结论，再代数验证。","最值范围问题：目标函数建立后求导或基本不等式，过程综合性强。"],"examPoints":["求曲线方程与离心率为选填必考。","解答题第1问求方程，第2问考弦长、面积、定点定值。","抛物线焦点弦性质应用为高频。","与向量、不等式、导数结合的最值范围为压轴方向。"]},{"title":"概率统计专题","keyPoints":["古典概型与计数原理结合：用排列组合数计算基本事件总数与事件数。","条件概率与全概率公式：P(A|B)=P(AB)/P(B)，全概率用于多原因事件。","离散型随机变量：分布列、期望、方差及性质E(aX+b)、D(aX+b)。","分布模型识别：二项分布（独立重复）、超几何分布（不放回抽取）。","正态分布与回归分析、独立性检验的综合应用。"],"difficultPoints":["分布列的建立：审清随机试验过程，确定X的取值与概率，计数易错。","条件概率与事件独立区分：P(AB)=P(A)P(B)为独立，避免混淆。","统计图表与概率综合：读图提取数据转化为概率，审题要求高。"],"examPoints":["概率统计解答题以实际情境为载体，考查建模与计算能力。","分布列、期望、方差为必考核心内容。","独立性检验、回归分析为稳定考点。","条件概率与全概率公式为新课标新增热点。"]},{"title":"数学思想方法（数形结合、分类讨论、转化与化归、函数与方程思想）","keyPoints":["数形结合：用图象研究零点、方程根、不等式解集与最值问题。","分类讨论：含参问题确定分类标准，做到不重不漏、逐类求解。","转化与化归：把陌生问题化归为熟悉模型，把复杂问题化归为简单问题。","函数与方程思想：用函数性质研究方程解的个数，构造函数解决不等式。","特殊与一般：特殊值、特殊位置探路，再推广到一般情形证明。"],"difficultPoints":["分类标准确定难：按什么分类、分几类、何时停止，需结合图象与式子结构。","数形结合草图误判：图象画得不精确导致结论错误，需关键点校验。","转化等价性：化归过程改变条件范围，等价性被破坏导致失根或增根。"],"examPoints":["分类讨论贯穿压轴题，特别是导数含参单调性与恒成立问题。","数形结合用于零点个数、方程根与参数范围问题。","转化化归用于数列放缩、不等式证明与三角化简。","函数方程思想用于恒成立、最值与范围问题，全卷渗透。"]}]}]},{"id":"english","name":"英语","icon":"🇬🇧","color":"#51cf66","intro":"高中英语以主题语境为主线，涵盖语音、词汇、语法、语篇四大板块，注重培养语言能力、文化意识、思维品质与学习能力四大核心素养，高考考查以语篇为载体、以运用为目的。","examTrend":["新高考英语淡化死记规则，语法融入语法填空与短文改错考查，强调在语篇语境中的实际运用","阅读理解四篇题材多样，记叙、说明、议论、应用文兼备，细节题为主，推断与主旨题为拉分点","读后续写为新高考写作新题型，考查情节构思与语言表达，与应用文共同构成书面表达 40 分","完形填空以记叙文为主，侧重实词在语境中的辨析与上下文逻辑推理，语言知识题比例下降","七选五考查语篇连贯与衔接手段，代词指代、逻辑连接词与词汇复现是解题关键线索","听力注重日常交际场景，信息获取与意图推断并重，考查同义替换与数字信息的处理能力"],"periods":[{"period":"高一（上）","textbook":"必修一、二","tips":["完成初高中衔接，重点突破时态语态、定语从句等核心语法，打牢基础","坚持每天朗读课文与听力输入，培养语感，结合语境记忆词汇而非孤立背单词","建立错题本，每周整理语法与词汇错题并定期回顾，避免同类错误反复出现","结合单元话题做写作输出，先模仿课文句型再独立成篇，积累话题词汇"],"modules":[{"title":"核心语法：时态与语态","keyPoints":["一般现在时表经常性动作或客观真理，主语第三人称单数谓语加 -s，如 The earth goes around the sun","一般过去时表过去发生的动作，注意不规则动词过去式，如 went、saw、took","现在进行时结构 am/is/are + doing，表正在进行，常与 now、at present 连用","一般将来时 will do 表将来，be going to do 表打算，be about to do 表即将发生","现在完成时 have/has + done，强调对现在的影响或持续至今，与 already、yet、since、for 连用","被动语态 be + 过去分词，注意时态变化，如 is built、was built、has been built","时态选择看时间状语与语境，如 since 后常用现在完成时，yesterday 用一般过去时"],"difficultPoints":["一般过去时与现在完成时易混：前者强调动作发生在过去，后者强调对现在的影响，如 I saw the film 与 I have seen the film","短暂性动词不与 for/since 连用，须换延续性动词，如 buy 变 have、join 变 be in，这是高频易错点","不带 to 的不定式作宾补在被动语态中须加 to，如 make sb do 变为 sb is made to do","主将从现：时间、条件状语从句中用一般现在时表将来，如 If it rains tomorrow, we will stay at home"],"examPoints":["语法填空常考时态语态辨析，依据时间状语与语境判断，注意主谓一致","被动语态为高频考点，注意其与情态动词、完成时结合的形式，如 must be done、has been built","现在完成时与 since、for 连用为常考点，注意主从句时态呼应","短文改错常设时态混用陷阱，如该用过去时却用现在时，需通读全文判断时间线"]},{"title":"核心语法：定语从句","keyPoints":["定语从句由关系词引导，先行词指人用 who/whom/that，指物用 which/that","关系代词在从句中作宾语时可省略，如 The book (that) I bought is interesting","whose 表所属，先行词指人或物均可，如 the boy whose father is a doctor","关系副词 where 表地点、when 表时间、why 表原因，在从句中作状语成分","that 与 which 可互换，但先行词为不定代词或含最高级、序数词修饰时只用 that","介词 + which/whom 引导定语从句，介词由先行词或谓语动词搭配决定","非限制性定语从句用逗号隔开，不能用 that，指人用 who、指物用 which"],"difficultPoints":["that 与 which 的选用：先行词为 all、everything 等不定代词或受最高级、序数词修饰时只能用 that","先行词为 the way 时，关系词用 that/in which 或省略，如 the way (that) he works","关系代词与关系副词的选择难：看从句缺主语、宾语还是状语，缺状语用 where/when/why","介词 + 关系代词中介词的确定需分析动词搭配，如 depend on which、talk about whom","先行词 time 后可用 when 也可用 that 或省略，如 the first time (that) I came here"],"examPoints":["语法填空常考关系词选择：先判断从句成分，缺主语宾语用代词，缺状语用副词","非限制性定语从句为高频考点，注意 which 可指代前面整个句子的内容","定语从句与强调句、同位语从句的区分是常考易错点，注意 that 在从句中的作用","改错中常见关系词误用，如 that 用于非限制性从句、关系词缺失或多余"]},{"title":"核心语法：情态动词与比较等级","keyPoints":["情态动词后接动词原形，can 表能力、may 表允许、must 表必须，注意各自否定形式","must 表推测用于肯定句，can't 表不可能，may/might 表可能，语气逐级减弱","情态动词 + have done 表对过去的推测：must have done 一定做过、can't have done 不可能做过","should have done 表本应做而未做，含责备或遗憾语气，如 You should have told me","比较级 + than 表比较，最高级前加 the，如 taller than、the tallest of all","as...as 表同级比较，否定式 not as/so...as，中间用形容词或副词原级","the + 比较级，the + 比较级 表越……越……，如 The harder you work, the greater progress you will make"],"difficultPoints":["must 表推测时否定用 can't 而非 mustn't，mustn't 表禁止，这是最易错点","情态动词 + have done 与情态动词 + do 的时态区分难，需根据时间状语判断","比较级修饰语用 much、far、a little 等，不能用 very 直接修饰比较级","no more than 表仅仅、not more than 表不超过，语义差别细微易混","隐含比较句需补全省略成分，如 the older I get, the wiser 结构中冠词与前后呼应"],"examPoints":["语法填空常考情态动词的推测用法，结合语境判断可能性大小","最高级可用比较级 + than any other + 单数名词表达，为高频转换考点","倍数表达 twice as...as、three times the size of 为常考句型","改错常考 more 与比较级连用造成重复、最高级前缺 the 等错误"]},{"title":"高频词汇与话题积累（必修阶段）","keyPoints":["必修一、二核心话题：学校生活、友谊、自然灾害、健康、节日文化，按话题分类积累词汇","高频动词短语：look forward to、take part in、make use of、come up with、give up","掌握构词法：un-、dis- 表否定，-tion、-ment 变名词，-ful 变形容词，扩大词汇量","一词多义重点：develop、remain、cover、charge、deliver 在不同语境中的含义","积累交际功能句型：建议、邀请、道歉、感谢等，用于应用文写作","词汇按词性、搭配、语境三维记忆，避免孤立背单词造成只会认不会用"],"difficultPoints":["动词短语辨析难：look up 查寻与 look up to 尊敬、turn on 打开与 turn out 结果是，易混","形近词辨析：adapt 与 adopt、affect 与 effect、beside 与 besides 拼写相近易混淆","一词多义与熟词生义难在脱离记忆语境，需在阅读中反复接触巩固","不规则动词变化需强记，如 choose-chose-chosen、lose-lost-lost、lie-lay-lain","介词搭配易错：be fond of、be familiar with、be good at 需分类记忆"],"examPoints":["完形填空与语法填空考查词汇在语境中的运用，动词短语与固定搭配是重点","阅读理解中生词处理：利用构词法与语境线索猜测词义","高频短语的准确使用是写作评分的重要依据，注意拼写与搭配","词性转换为语法填空必考点，如形容词变副词加 -ly、动词变名词加 -tion"]},{"title":"阅读理解基础技巧","keyPoints":["先读题干再读文章，带着问题定位信息，提高阅读效率与准确率","细节题：根据题干关键词回原文定位，逐词比对选项与原文表述","主旨大意题：关注首尾段与各段首句，归纳文章中心思想","词义猜测题：利用上下文逻辑关系，如定义、因果、转折、举例线索猜词","推理判断题：依据原文事实合理推断，不选与原文直接重复的选项","标题选择题：标题应概括主旨、简洁醒目，避免以偏概全或过于宽泛","限时阅读训练：每分钟 60~80 词，先略读把握结构再精读定位"],"difficultPoints":["细节题干扰项常偷换概念或扩大范围，需逐词比对原文，不可凭印象选择","主旨题难点在区分文章大意与局部细节，选项出现原文细节内容多为干扰","推理题易过度推断，选项超出原文信息范围即为错误","长难句理解困难，需先找主谓宾主干再分析从句与修饰成分","熟词生义与派生词阻碍理解，需结合语境灵活处理而非死记词义"],"examPoints":["全国卷阅读理解四篇难度递增，前两篇重细节定位，后两篇重推断与主旨","细节题占比最高，关键词定位法是基本解题策略","词义猜测题为每年必考，考查构词法与语境推断能力","应用文类文章常设信息匹配题，注意快速扫读关键信息"]},{"title":"写作基础：应用文入门","keyPoints":["应用文常见类型：书信、电子邮件、通知、日记、留言条，注意各类格式规范","书信格式：称呼、正文、结束语、署名齐全，称呼后用逗号，如 Dear Tom","书信常用句型：I'm writing to...、I'd like to...、I'm looking forward to your reply","通知格式：标题 Notice，正文说明时间、地点、活动内容，落款署名","段落结构：开头点明目的、中间展开内容、结尾表达期望或感谢","常用连接词：first of all、besides、in addition、what's more、in a word 使行文连贯"],"difficultPoints":["格式错误是低分主因，如称呼缺失、署名位置错误、日期格式不规范","内容要点遗漏导致失分，动笔前先列提纲确保覆盖全部要点","中式英语表达：避免逐词翻译，如我非常高兴不能写成 I very happy","时态人称混乱：写信常用一般现在时与一般将来时，需保持全文一致","简单句堆砌影响得分，需学会用连接词与从句整合句子"],"examPoints":["高考应用文以书信类为主，如建议信、邀请信、申请信、道歉信","评分标准关注内容要点、语言准确性、篇章连贯性三方面","开头结尾句型是阅卷亮点，背熟万能句式可稳定提分","字数要求约 80 词，超出或不足均会扣分，需控制篇幅"]}]},{"period":"高一（下）","textbook":"必修三、选择性必修一","tips":["非谓语动词与名词性从句是本阶段语法重点，注意在真实语境中辨析运用","完形填空与七选五要建立语篇意识，从词句理解转向篇章逻辑分析","读后续写开始入门，积累动作、心理、环境描写的基本句型","每周完成一篇应用文并互评修改，重点检查格式、时态与人称"],"modules":[{"title":"核心语法：非谓语动词（入门）","keyPoints":["非谓语动词包括不定式、动名词、分词，在句中不能单独作谓语","不定式 to do 表目的、将来，如 I want to learn English well","动名词 doing 作主语表习惯性动作，如 Reading aloud is important","现在分词 doing 表主动进行，过去分词 done 表被动完成，如 a broken cup","后接不定式作宾语的动词：want、hope、decide、agree、manage 等","后接动名词作宾语的动词：enjoy、finish、avoid、mind、keep 等","remember、forget 接 doing 表做过，接 to do 表去做，如 remember to lock the door"],"difficultPoints":["remember/forget/stop/regret 接 doing 与 to do 含义不同，需结合语境判断动作是否发生","分词作状语与不定式作状语易混：分词表伴随、原因，不定式表目的","动名词与不定式作主语的区别：泛指习惯用 doing，具体某次用 to do","非谓语逻辑主语的判断难：需看其与句子主语之间的主被动关系","see/hear/feel 等感官动词后接 doing 表正在进行、接原形表全过程"],"examPoints":["语法填空常考非谓语作状语、定语、宾语，先判断成分再选形式","动名词与不定式作宾语的区别为高频考点，注意动词分类记忆","分词作定语：现在分词表主动进行、过去分词表被动完成，注意语态判断","改错常见谓语与非谓语混用，句中已有谓语动词时其他动词须用非谓语形式"]},{"title":"核心语法：名词性从句","keyPoints":["名词性从句包括主语从句、宾语从句、表语从句、同位语从句","that 引导宾语从句可省略，引导主语从句、表语从句一般不省略","宾语从句一律用陈述语序，如 I don't know where he lives","主语从句可用 it 作形式主语：It is certain that he will come","whether 与 if 引导宾语从句可互换，引导主语从句、表语从句只用 whether","what 引导名词性从句表……的东西，如 What he said is true","表语从句：The reason is that...，reason 作主语时表语从句不用 because 引导"],"difficultPoints":["that 与 what 的区分：that 无词义，what 在从句中作成分，如 what he said 中 what 作宾语","whether 与 if 的选用：介词后、不定式前、主语从句中只能用 whether","宾语从句语序常错，疑问词引导时仍须用陈述语序，如 where he lives","同位语从句与定语从句易混：that 在同位语从句中不作成分，在定语从句中作成分","主从句时态呼应：主句为过去时，从句用相应的过去时态"],"examPoints":["语法填空常考 what、that、whether 等连接词的选用，注意 that 不作成分","宾语从句语序为改错高频考点，疑问语序混入为常见错误","it 作形式主语的主语从句结构是写作加分句型","同位语从句常与 news、fact、idea、suggestion 等抽象名词连用，为高考常考点"]},{"title":"核心语法：主谓一致","keyPoints":["主谓一致三原则：语法一致、意义一致、就近一致","主语为单数名词或不可数名词谓语用单数，复数名词谓语用复数","each、every、either、neither 修饰或作主语时谓语用单数","either...or、neither...nor、not only...but also 连接主语时谓语就近一致","主语后接 with、together with、as well as 等短语时，谓语与主语本身一致","the number of + 复数名词谓语用单数，a number of + 复数名词谓语用复数","不定式、动名词作主语谓语用单数，如 To learn English well takes time"],"difficultPoints":["with、together with、as well as 等插入语不影响谓语数，易误判为就近原则","集合名词 family、team 强调整体用单数，强调成员用复数，需看语境","百分数、分数 + of + 名词时谓语与 of 后名词一致，如 Two thirds of the work is done","定语从句中关系代词作主语，谓语动词与先行词保持一致","就近一致与语法一致原则混用，需记住固定搭配结构"],"examPoints":["语法填空常考主谓一致，注意找准主语中心词的单复数","either...or 等就近原则结构为改错常考点","定语从句中谓语与先行词一致为高频考点","主谓一致常与时态结合考查，需综合分析判断"]},{"title":"完形填空基础技巧","keyPoints":["完形填空考查语篇理解与词汇辨析，先通读全文把握大意再逐题选择","首句通常不设空，是理解全文的钥匙，精读首句确定文章基调","利用上下文逻辑：因果、转折、递进、对比关系选择答案","词汇复现：同一词或同义词在上下文中复现，可互相印证答案","固定搭配与短语辨析：根据动词短语、介词搭配直接选择","先易后难：先做有把握的题，利用已选答案帮助解决难题","完形注重动词、名词、形容词、副词辨析，注意词义轻重与感情色彩"],"difficultPoints":["近义词辨析难：如 look、watch、see、observe 语义相近需辨细微差异","脱离语境的词义选择易错，需联系上下文情感色彩判断","逻辑连接词判断难：however、therefore、besides 等需分析句间关系","复现与同义替换识别困难，需平时积累同义词组","首尾呼应型题目需读完文章才能确定，不要过早下结论"],"examPoints":["完形填空以记叙文为主，考查故事发展与人物情感变化","动词辨析与名词辨析占比大，注意动作先后与逻辑顺序","逻辑关系词为常考点，考查 however、therefore、instead 等","近年真题重视词汇在语境中的活用，熟词生义需重点积累"]},{"title":"七选五基础技巧","keyPoints":["七选五考查语篇连贯，选项为完整句子，先通读全文了解结构","段首题多为段落主题句，需概括该段大意，注意与下文衔接","段尾题总结上文或承上启下，注意与下段开头的衔接","段中题根据上下文逻辑与指代关系选择","利用代词线索：选项中的 it、they、this 等指代上文内容","利用逻辑连接词：however 表转折、therefore 表因果、for example 表举例","利用词汇复现与同义替换：选项与上下文出现相同或相关词汇"],"difficultPoints":["干扰项设计巧妙，看似合理但逻辑不连贯，需排除表面相似项","代词指代关系判断难，需明确选项代词具体指代的对象","转折与递进关系区分难，需结合上下文语义判断","段落主题句与细节句混淆，需把握段落中心","两个相似选项并存时，需比较与上下文的衔接紧密程度"],"examPoints":["七选五两篇文章体裁不同，一篇为说明文，一篇为记叙文或应用文","段首主题句、段尾总结句为高频设空位置","转折、因果、递进逻辑词与代词指代为解题关键线索","答题后回读检查全文，确保语义与逻辑通顺连贯"]},{"title":"读后续写入门","keyPoints":["读后续写要求阅读所给材料后，根据内容与段首语续写两段","原文以记叙文为主，注意人物、情节、冲突与情感线索","续写应与原文风格一致，人称、时态保持一致","每段首句已给出，需围绕首句展开合理情节","情节设计注意与前文衔接，设置合理的冲突与解决","结尾可升华主题，表达情感或道理，与前文呼应","常用动作描写：用动词短语生动刻画，如 rush out of、stare at、burst into tears"],"difficultPoints":["情节偏离原文：续写内容与原文逻辑不符，需紧扣前文伏笔展开","语言表达受限：词汇句型储备不足，需积累动作、心理、环境描写句型","段落比例失调：两段字数差距过大，需均衡分配内容","时态人称不一致：续写忘记保持与原文一致，需仔细核对","结尾生硬：突然结束缺乏呼应，需与前文情节或主题呼应"],"examPoints":["读后续写分值 25 分，是拉开差距的关键题型","评分看内容衔接、语言表达、结构完整三方面","所给段首语是情节发展的关键提示，续写必须与段首语紧密衔接","划线词或关键信息需在续写中合理体现，确保内容相关"]}]},{"period":"高二","textbook":"选择性必修二~四","tips":["非谓语、虚拟语气、倒装等进阶语法要在长难句阅读中反复强化运用","阅读训练转向篇章结构与作者态度，提升深层理解与批判思维能力","读后续写进入技巧训练阶段，建立个人语料库积累高级句型与描写素材","开始真题限时训练，逐步适应高考题型结构与时间分配"],"modules":[{"title":"非谓语动词进阶与辨析","keyPoints":["非谓语三种形式功能辨析：不定式表目的将来、动名词表习惯、分词表状态","不定式作定语：与被修饰词有动宾关系且为主动时用 to do，如 something to eat","非谓语作状语时逻辑主语须与句子主语一致，如 Seeing the film, he cried","with + 宾语 + 宾补结构：with the light on、with the work done","独立主格结构：名词或代词 + 非谓语，如 Weather permitting, we will go out","非谓语作宾补：ask sb to do、see sb doing、have sth done","不定式完成式 to have done 表先于谓语发生，如 He seems to have finished the task"],"difficultPoints":["doing 与 done 作状语：看与逻辑主语的主动被动关系，主动用 doing、被动用 done","having done 强调先于谓语且主动，与 done 作状语的区别是难点","不定式被动式 to be done 表将来被动，与 done 表完成被动作定语时易混","逻辑主语与句子主语不一致时须用独立主格结构，这是本阶段难点","只接 doing 与只接 to do 的动词需分类强记，如 avoid doing、decide to do"],"examPoints":["语法填空高频考点：非谓语作定语、状语、宾补时的形式选择","非谓语与谓语辨析：句中已有谓语动词时其他动词用非谓语，是解题关键","having done 与 having been done 为进阶考点，注意语态选择","非谓语在写作中的运用可提升语言档次，是高分句型基础"]},{"title":"虚拟语气与倒装强调","keyPoints":["虚拟条件句：与现在事实相反用 did/were，与过去相反用 had done，与将来相反用 were to/should do","虚拟主句形式：现在用 would do，过去用 would have done，将来用 would do","wish 后从句用虚拟：对现在用过去式、对过去用 had done、对未来用 would do","if 省略倒装：Had I known、Were I you、Should it rain，把 were/had/should 提前","建议、要求、命令类动词后从句用 should do，should 可省略，如 suggest、advise、require","It is (high) time that 后用过去式或 should do，表该做某事的时候了","否定词开头部分倒装：never、hardly、not only 等置于句首，助动词提前"],"difficultPoints":["虚拟条件句主从句时态搭配易错，现在、过去、将来三组形式需对应记忆","含蓄条件句：without、but for 等介词短语隐含条件，容易忽略虚拟用法","错综时间条件句：条件与主句时间不一致，各自用对应时态，难度大","would rather 后用过去式表虚拟，与一般用法混淆是常见错误","部分倒装与完全倒装区分：否定词开头用部分倒装，方位副词开头用完全倒装"],"examPoints":["语法填空常考虚拟语气：suggest 后从句用 should do 且 should 可省略","if 省略倒装为高频考点，注意 were/had/should 提前到句首","倒装与强调句结合考查：it is...that 强调句不属于倒装","not only...but also 位于句首时部分倒装为常考点"]},{"title":"长难句分析与语法综合","keyPoints":["长难句分析第一步：找谓语动词，确定句子主干主谓宾","从句识别：根据引导词判断从句类型与在句中的功能","非谓语短语作修饰成分：分词短语、不定式短语作定语或状语","插入语识别：逗号隔开的解释说明成分不影响句子主干","并列结构：and、but、or 连接的并列谓语与并列从句","省略结构：从句中主语与 be 动词可省略，如 when (it is) necessary","切割法：先抓主干，再逐层分析修饰成分，化长为短"],"difficultPoints":["多从句嵌套：从句中套从句，需逐层剥离分析，先内后外","谓语与非谓语混淆：句中多个动词需判断哪个是真正的谓语","分隔结构：主语与谓语被插入语或从句分隔，影响主干识别","省略成分补全难：需根据语境还原省略的主语、谓语或连接词","双重否定与否定转移影响语义理解，需注意逻辑方向"],"examPoints":["阅读中长难句是细节题与推断题的障碍，分析能力决定得分","语法填空与改错常在长难句中设置考点，需准确切分结构","写作中适度使用从句与非谓语可提升档次，但正确性优先","语篇理解与翻译以长难句分析能力为基础"]},{"title":"阅读理解进阶（主旨/推断/词义猜测）","keyPoints":["主旨大意题：通读首尾段与各段首句找主题句，注意高频词提示","标题题：须涵盖主旨、简洁新颖，排除以偏概全与过度宽泛选项","推理判断题：依据原文事实推断作者态度与言外之意，注意委婉表达","作者态度题：关注形容词、副词与情感色彩词，如 positive、critical、objective","词义猜测题：利用定义、举例、对比、因果、构词法线索猜词","篇章结构题：考查段落功能与行文逻辑，如承上启下、举例论证","细节理解进阶：注意数字、时间、地点等信息的准确对应与计算"],"difficultPoints":["推断题易过度推断：选项超出原文信息范围即错误，需把握推断限度","主旨题陷阱：选项概括过宽或过窄，需比较各选项涵盖范围","态度题难在客观描述与主观评价的区分，注意作者用词色彩","词义猜测受背景知识干扰，需以语境线索为准而非常识","说明文与议论文结构复杂，需把握段间逻辑关系"],"examPoints":["新高考阅读四篇中后两篇多设推断与主旨题，难度较大","词义猜测题为必考题，每年至少一题","作者态度与写作目的题为常考题型","干扰项设置规律：偷换概念、无中生有、过度推断需熟练识别"]},{"t 境为载体的试题增多，如高铁、航天、新能源等，考查建模与信息提取能力","图像题年年必考，v-t、U-I、B-t等图像的解读与相互转换是基本能力要求","计算大题注重多过程综合，板块模型、电磁感应、带电粒子运动常与动量能量结合","实验题趋向开放创新，突出原理理解、误差分析与图像处理，减少死记硬背","新高考等级考对数学工具要求高，几何关系、三角函数、函数图像分析贯穿压轴题","概念辨析类选择题稳定出现，考查对易混概念（如速度与加速度、场强与电势）的深层理解"],"periods":[{"period":"高一（上）","textbook":"必修一","tips":["重视受力分析，按重力、弹力、摩擦力顺序，画好受力图再列方程","建立画图习惯：情境示意图、v-t图像辅助分析运动过程","公式注意矢量性，先规定正方向再代入，刹车类问题先判停止时间","及时整理错题本，辨析速度与加速度、位移与路程等易混概念"],"modules":[{"title":"运动的描述","keyPoints":["质点：忽略物体大小形状、只考虑质量的理想化模型，平动问题常可视为质点","位移是矢量，由初位置指向末位置；路程是标量，为轨迹长度，位移大小不大于路程","速度v=x/t表示运动快慢，瞬时速度对应某一时刻，平均速度对应某段位移","加速度a=Δv/Δt，描述速度变化快慢，方向与速度变化量方向相同","纸带测瞬时速度用平均速度法：v=(x1+x2)/2T，T为打点周期","v-t图像斜率表示加速度，图线与t轴围成面积表示位移"],"difficultPoints":["速度与加速度方向易混：a与v方向无关，加速减速取决于二者同向还是反向","x-t图与v-t图区分：x-t斜率是速度，v-t斜率是加速度、面积是位移","瞬时速度概念抽象：用极短时间内的平均速度近似，体现极限思想","平均速度与平均速率混淆：前者位移/时间（矢量），后者路程/时间（标量）"],"examPoints":["高考常以图像题考查速度、加速度的概念辨析与计算","打点计时器纸带实验：求瞬时速度与加速度是实验题高频考点","位移、路程、速度、加速度的矢量标量辨析常出选择题","结合高铁、汽车等生活情境考查运动描述基本量","易错：误把加速度大理解为速度大，忽略矢量的方向性"]},{"title":"匀变速直线运动","keyPoints":["速度公式v=v0+at，适用于匀变速直线运动，注意各量矢量方向","位移公式x=v0t+at^2/2，可由v-t图像面积导出","导出公式v^2-v0^2=2ax，用于不含时间的问题，刹车问题先判停止时间","平均速度v(平均)=(v0+v)/2，等于中间时刻的瞬时速度","连续相等时间位移差Δx=aT^2，是纸带逐差法求加速度的依据","初速度为零匀加速：1s、2s…内位移比1:4:9，第1s、2s…内位移比1:3:5","自由落体v=gt、h=gt^2/2；竖直上抛全程匀减速，最高点速度为零"],"difficultPoints":["刹车问题：先算停车时间t0=v0/a，此后位移不再增加，盲目套公式会出错","追及相遇：速度相等时距离最近或最远是临界条件，需画运动示意图分析","多过程问题：分段分析，注意衔接点速度相等，各段加速度不同","图像法解运动学：v-t图中斜率、面积、交点的物理意义综合运用"],"examPoints":["计算题常考刹车与追及相遇问题，临界条件是速度相等","纸带逐差法求加速度：a=(x4+x5+x6-x1-x2-x3)/9T^2","v-t图像是选择题高频考点：斜率、面积、交点、截距的物理意义","竖直上抛与自由落体综合，注意对称性与多解问题","易错：刹车类盲目套位移公式、忽略初速度方向"]},{"title":"相互作用——力","keyPoints":["重力G=mg，方向竖直向下，重心位置与质量分布有关","弹簧弹力F=kx（胡克定律），弹力方向与形变方向相反，垂直接触面","静摩擦力0≤f≤fmax，滑动摩擦力f=μN，方向与相对运动（趋势）方向相反","滑动摩擦力与接触面积、相对速度无关，只与正压力N和动摩擦因数μ有关","力的合成遵循平行四边形定则，合力范围|F1-F2|≤F≤F1+F2","正交分解：Fx=Fcosθ、Fy=Fsinθ，沿运动方向和垂直方向分解最常用"],"difficultPoints":["静摩擦力方向判断难：与相对运动趋势相反，趋势方向可用假设法判定","摩擦力突变问题：静摩擦与滑动摩擦的临界转化（传送带、板块），比较μ与tanθ","动态平衡矢量三角形法：图解法分析缓慢转动过程中力的变化","力的实际效果分解：斜面上物体重力分解为沿斜面与垂直斜面两个分力"],"examPoints":["受力分析每年必考，常与牛顿定律、共点力平衡结合出选择题","共点力平衡：三力用矢量三角形，多力用正交分解","弹簧与摩擦力结合的动态分析题，注意弹力的突变与渐变","实验：探究胡克定律、验证力的平行四边形定则","易错：摩擦力方向判断错误、忽略静摩擦与滑动摩擦的临界转化"]},{"title":"牛顿运动定律","keyPoints":["牛顿第一定律：力是改变运动状态的原因，不是维持运动的原因，惯性是固有属性","牛顿第二定律F=ma，矢量式，瞬时对应，加速度与合外力同向","牛顿第三定律：作用力与反作用力等大反向、作用在不同物体上，不能合成抵消","两类基本问题：已知力求运动，或已知运动求力，核心是求加速度a","超重：a向上，F=mg+ma；失重：a向下，F=mg-ma；完全失重a=g","连接体：整体法求加速度，隔离法求内力，前提是各物体加速度相同"],"difficultPoints":["受力分析漏力或添力：按重力、弹力、摩擦力顺序画，再用运动状态检验","瞬时性问题：轻绳弹力突变、弹簧弹力渐变，剪断瞬间弹簧弹力不变","临界问题：接触面分离、绳断、相对滑动的临界条件，如a=μg边界","板块与传送带模型：摩擦力方向随相对运动变化，需分段讨论","超重失重辨析：只看加速度方向不看速度方向，完全失重时重力仍存在"],"examPoints":["验证牛顿第二定律实验：a-F图、a-1/M图处理，平衡摩擦力是关键","传送带、板块模型是计算题压轴常客，考查多过程与临界","整体法隔离法处理连接体，常结合弹簧测力计读数","超重失重常与电梯、蹦极等生活情境结合出选择题","易错：F=ma中F是合外力、m不变、加速度瞬时对应"]}]},{"period":"高一（下）","textbook":"必修二","tips":["运动合成与分解牢记分运动的独立性与等时性，用平行四边形定则","圆周运动先找向心力来源，再列F=mv^2/r方程，注意临界条件","天体问题万有引力提供向心力，黄金代换GM=gR^2要熟练","能量问题优先考虑动能定理，全程列式比分段更简洁"],"modules":[{"title":"抛体运动","keyPoints":["运动合成与分解：位移、速度、加速度均为矢量，分运动独立且等时","平抛运动：水平匀速vx=v0，竖直自由落体vy=gt，合速度tanθ=vy/vx","平抛位移：x=v0t、y=gt^2/2，合位移与水平方向夹角α满足tanα=y/x","平抛规律：速度反向延长线过水平位移中点，tanθ=2tanα","斜抛：分解为水平匀速与竖直上抛，最高点速度最小为v0cosθ","平抛时间由高度决定t=根号(2h/g)，与初速度无关，射程x=v0根号(2h/g)"],"difficultPoints":["平抛与斜面结合：落点在斜面上时，速度角或位移角与斜面倾角关系易混","平抛临界问题：球过网、恰不越界等，用位移边界条件求初速度范围","类平抛运动：匀强电场中带电粒子偏转，加速度a=qE/m恒定","速度角与位移角混淆：tanθ=2tanα，θ、α不可混用"],"examPoints":["平抛运动是高考必考，常与斜面、圆周、电场结合命题","实验：研究平抛运动，用描迹法或频闪照片，注意抛出点位置判断","斜抛近年新高考有考查，注意射程与最高点的计算","运动合成与分解结合小船过河、杆端速度分解问题","易错：平抛时间由高度决定、速度角与位移角混淆"]},{"title":"圆周运动","keyPoints":["线速度v=Δs/Δt=ωr，沿圆周切线方向；角速度ω=Δθ/Δt，单位rad/s","周期T、频率f、转速n关系：ω=2π/T=2πf，v=2πr/T=ωr","向心加速度a=v^2/r=ω^2r，指向圆心，只改变速度方向不改变大小","向心力F=mv^2/r=mω^2r，由合外力提供，是效果力而非性质力","皮带传动轮缘线速度相等，同轴转动角速度相等，用v=ωr比较","水平面圆周：圆锥摆、火车转弯由合力提供向心力，临界v=根号(grtanθ)","竖直面圆周：绳模型最高点v≥根号(gr)，杆模型最高点v≥0"],"difficultPoints":["向心力来源分析难：由重力、弹力、摩擦力的合力或分力提供，常漏画或多画","绳模型与杆模型最高点临界区别：绳最小速度根号(gr)，杆可为0","水平转弯：汽车、火车向心力来源与临界速度计算","离心运动：合外力不足以提供向心力时物体远离圆心，不是沿半径飞出","转盘上物体：静摩擦力提供向心力，临界角速度ω=根号(μg/r)"],"examPoints":["圆周运动常与牛顿定律结合，传动装置线速度角速度关系常出选择","竖直面圆周最高点临界是计算高频，绳杆模型区别必考","圆锥摆、漏斗摆类问题考查向心力来源与角速度关系","圆周与能量、平抛综合的多过程问题常为压轴","易错：把向心力当性质力多画、最高点速度条件记混"]},{"title":"万有引力与宇宙航行","keyPoints":["万有引力定律F=Gm1m2/r^2，G=6.67×10^-11 N·m^2/kg^2，适用于质点","天体质量环绕法：GMm/r^2=m4π^2r/T^2，得M=4π^2r^3/GT^2","黄金代换：地面附近GM=gR^2，可求天体表面重力加速度","卫星运动：万有引力提供向心力，轨道半径r越大，v、ω、a越小，T越大","宇宙速度：v1=7.9km/s环绕，v2=11.2km/s脱离地球，v3=16.7km/s脱离太阳","同步卫星：周期24h，轨道在赤道正上方，高度约3.6万千米，定轨定周期定高度"],"difficultPoints":["卫星变轨：椭圆与圆轨道切换，点火加速离心，用能量或近远地点比较速度","双星问题：两星绕共同质心转动，周期相同，满足M1r1=M2r2、r1+r2=L","天体密度计算：ρ=M/V结合黄金代换，注意中心天体半径R与轨道半径r区分","同步卫星、近地卫星与赤道上物体加速度比较：赤道物体不满足环绕公式","万有引力与重力区分：赤道处重力最小、两极最大，g随纬度升高而增大"],"examPoints":["天体运动每年必考，常以卫星变轨、空间站对接为情境出选择","估算天体质量、密度，用环绕法或黄金代换","比较不同轨道卫星的v、ω、a、T大小关系","双星、三星系统作为新情境题考查","易错：近地卫星与赤道物体混淆、变轨中速度与加速度判断"]},{"title":"机械能守恒定律","keyPoints":["功W=Fxcosθ，θ为力与位移夹角，恒力做功；变力做功用动能定理或图像面积","功率P=W/t=Fv，机车启动P=Fv，匀加速阶段P增大，达额定功率后变加速","动能Ek=mv^2/2，动能定理W合=ΔEk=mv2^2/2-mv1^2/2，适用变力与多过程","重力势能Ep=mgh与参考面有关，重力做功等于重力势能减少量","机械能守恒条件：只有重力或弹簧弹力做功，Ep1+Ek1=Ep2+Ek2","功能关系：合外力功=ΔEk，除重力外其他力功=ΔE机械，重力功=-ΔEp","弹性势能Ep=kx^2/2，形变量决定，常与动能、重力势能综合"],"difficultPoints":["机车启动两类问题：恒定功率启动变加速，恒定加速度启动两阶段，图像复杂","变力做功：用动能定理、F-x图像面积、平均功率等方法，不能直接用W=Fx","机械能守恒判定：绳拉力、摩擦力做功时机械能不守恒，改用功能关系","多物体系统机械能守恒：连接体速度关系与能量分配，如绳轮系统","弹簧类问题：弹性势能最大时两物体速度相等，全过程能量守恒"],"examPoints":["动能定理是计算大题常用方法，多过程问题首选","机械能守恒与圆周最高点临界综合，如绳球模型过最高点最小速度","机车启动v-t图、P-t图常出选择题","实验：验证机械能守恒，纸带测速度，注意误差分析","易错：机械能守恒条件判断错误、参考面选取不当"]}]},{"period":"高二（上）","textbook":"必修三与选择性必修一","tips":["电场先建立场的观念，用电场线与等势面理解场强、电势及电势能","电路问题先画等效电路，理清串并联关系再运用欧姆定律","动量问题注意守恒条件与矢量性，碰撞类列动量守恒加能量关系","振动与波抓住振动是波动根源，波的多解问题画图分析不遗漏"],"modules":[{"title":"静电场","keyPoints":["库仑定律F=kq1q2/r^2，k=9×10^9 N·m^2/C^2，适用于点电荷，力在连线上","电场强度E=F/q，矢量；点电荷场强E=kQ/r^2，匀强电场E=U/d","电场线从正电荷出发到负电荷，疏密表示强弱，不闭合不相交","电势φ=Ep/q，标量，沿电场线方向电势降低，等势面与电场线垂直","电势差Uab=φa-φb=Wab/q，电场力做功W=qU，与路径无关","电容器C=Q/U，平行板C=εS/4πkd，断开电源Q不变、接电源U不变","带电粒子加速qU=mv^2/2，偏转类平抛a=qE/m，侧移y=qUL^2/2mdv0^2"],"difficultPoints":["场强与电势关系易混：E大处φ不一定高，φ=0处E不一定为0，用电场线判断","电场力做功与电势能变化：W=Ep1-Ep2，做正功电势能减少，注意符号","带电粒子偏转：类平抛分解，速度角 NA","布朗运动：悬浮微粒的无规则运动，反映液体分子无规则运动，微粒越小越明显","温度是分子平均动能的标志，内能包括分子动能与分子势能","玻意耳定律p1V1=p2V2等温，查理定律p1/T1=p2/T2等容，盖-吕萨克定律V1/T1=V2/T2等压","理想气体状态方程pV/T=C或p1V1/T1=p2V2/T2，适用理想气体"],"difficultPoints":["分子力与分子势能随距离变化：r=r0时分子力为零、势能最小","气体压强微观解释与计算：p=nkT，用受力分析求封闭气体压强","变质量问题：打气、抽气、漏气，用pV=nRT转化处理","液柱与气缸问题：等高处压强相等，液体深度产生压强p=ρgh"],"examPoints":["气体实验定律计算题是选考必考，液柱、气缸、活塞模型","分子动理论、阿伏伽德罗常数估算常出选择","布朗运动与分子热运动辨析、温度与内能关系","气体状态变化图像（p-V、V-T、p-T图）分析","易错：气体定律用热力学温标、变质量问题直接套pV/T出错"]},{"title":"热力学定律","keyPoints":["热力学第一定律ΔU=W+Q，吸热Q为正、外界对气体做功W为正","热力学第二定律：热量不能自发从低温传到高温，第二类永动机不可能制成","能量守恒定律：能量不会凭空产生或消失，只发生转化转移，第一类永动机不可能","热力学第二定律微观解释：自然过程朝着熵增加的方向进行","气体做功W=pΔV，等压膨胀时气体对外做功，体积增大W为负"],"difficultPoints":["符号规则：ΔU=W+Q中W、Q正负判断，压缩膨胀与吸放热对应","理想气体内能只与温度有关：温度不变ΔU=0，绝热过程Q=0","热力学第二定律理解：不违反能量守恒但过程有方向性","p-V图循环过程：判断各阶段做功、吸放热与内能变化"],"examPoints":["热力学第一定律与气体状态变化结合是选考高频","p-V图中循环过程吸放热、做功、内能变化判断","热力学第二定律方向性与永动机辨析常出选择","易错：符号正负搞反、绝热与等温过程内能变化判断错误"]},{"title":"固体液体与物态变化","keyPoints":["晶体有确定熔点（单晶各向异性），非晶体无确定熔点各向同性","液晶介于晶体与液体之间，具有流动性又显示光学各向异性","液体表面张力：表面层分子稀疏引力作用使液面收缩，方向沿表面切线","浸润与不浸润由附着层分子受力决定，毛细现象管径越小液面升降越明显","饱和汽压只与温度有关与体积无关，相对湿度等于实际压强与饱和汽压之比"],"difficultPoints":["晶体各向异性原因：微观排列规则，多晶体各向同性但仍有熔点","表面张力方向辨析：沿液面切线收缩，不是指向液体内部","相对湿度计算与露点：温度降到露点出现液化"],"examPoints":["晶体非晶体、液晶、表面张力概念辨析常出选择","毛细现象与浸润不浸润现象解释","饱和汽压与相对湿度理解","易错：多晶体各向同性却有熔点、表面张力方向判断错误"]},{"title":"原子结构与波粒二象性","keyPoints":["α粒子散射实验（卢瑟福）提出核式结构：原子核很小带正电，电子绕核运动","玻尔模型：轨道量子化，能级En=-13.6/n^2 eV，跃迁辐射hν=Em-En","氢原子能级跃迁：高能级向低能级跃迁放光子，能级差越大频率越高","光电效应：Ek=hν-W0，光子说解释瞬时性与极限频率","光电效应规律：极限频率、最大初动能与频率线性、光强决定光电子数目","波粒二象性：光既有波动性又有粒子性，德布罗意波λ=h/p"],"difficultPoints":["光电效应方程图像：Ek-hν图斜率是h、截距是-W0，求逸出功与极限频率","能级跃迁光谱线数：一群氢原子跃迁发出C(n,2)=n(n-1)/2条谱线","光电效应与波动说矛盾：瞬时性与极限频率只有光子说能解释","波粒二象性理解：波动性与粒子性在不同情境体现，非机械叠加"],"examPoints":["光电效应方程与图像是选择必考，计算逸出功、极限频率、最大初动能","氢原子能级跃迁：能量计算、光谱线数目、电离能","光电效应实验装置：饱和电流、遏止电压概念辨析","波粒二象性、德布罗意波概念题","易错：hν=Em-En中ν取正、光强与频率作用混淆"]},{"title":"原子核与核能","keyPoints":["天然放射现象：α、β、γ三种射线，电离本领α最强、穿透本领γ最强","衰变规律：α衰变质量数减4电荷数减2，β衰变质量数不变电荷数加1","半衰期：N=N0(1/2)^(t/τ)，统计规律，与温度
